!
version 15.2
hostname edge
!
vrf definition tenant
 address-family ipv4
 exit-address-family
!
interface GigabitEthernet0/0
 ip address 10.0.0.1 255.255.255.252
 ip access-group SERVICE-OUT out
!
interface GigabitEthernet0/1
 ip address 10.0.0.5 255.255.255.252
!
interface GigabitEthernet0/2
 ip address 192.0.2.1 255.255.255.0
 ip access-group GUEST in
!
interface Loopback10
 vrf forwarding tenant
 ip address 198.51.100.10 255.255.255.255
!
ip access-list extended GUEST
 permit tcp any host 203.0.113.8 eq 80
 deny tcp any host 203.0.113.8 eq 443
 permit ip any any
!
ip access-list extended SERVICE-OUT
 deny tcp any host 203.0.113.8 eq 22
 permit ip any any
!
ip prefix-list BLOCKED permit 203.0.113.9/32
route-map FROM-PRIMARY deny 10
 match ip address prefix-list BLOCKED
route-map FROM-PRIMARY permit 20
 set local-preference 200
!
router bgp 65000
 bgp router-id 10.255.0.1
 neighbor 10.0.0.2 remote-as 65001
 neighbor 10.0.0.2 route-map FROM-PRIMARY in
 neighbor 10.0.0.6 remote-as 65002
!
end
