!
version 15.2
hostname primary
!
interface GigabitEthernet0/0
 ip address 10.0.0.2 255.255.255.252
!
interface Loopback0
 ip address 203.0.113.8 255.255.255.255
!
interface Loopback1
 ip address 203.0.113.9 255.255.255.255
!
interface Loopback2
 ip address 203.0.113.10 255.255.255.255
!
ip prefix-list PRIVATE permit 203.0.113.10/32
route-map TO-EDGE deny 10
 match ip address prefix-list PRIVATE
route-map TO-EDGE permit 20
!
router bgp 65001
 bgp router-id 10.255.0.2
 network 203.0.113.8 mask 255.255.255.255
 network 203.0.113.9 mask 255.255.255.255
 network 203.0.113.10 mask 255.255.255.255
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 route-map TO-EDGE out
!
end
