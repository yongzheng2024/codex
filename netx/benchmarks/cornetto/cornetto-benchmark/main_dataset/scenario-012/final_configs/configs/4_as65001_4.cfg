
hostname 4_as65001_4
!
interface Loopback0
 ip address 10.180.0.5 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.28.0/24


 ip address 10.200.28.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.29.0/24


 ip address 10.200.29.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.30.0/24


 ip address 10.200.30.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 0_as65002_0 (0)

 ip address 10.181.0.1 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 10_as65001_10 (10)

 ip address 10.181.0.28 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.28.0 255.255.255.0 Loopback100
ip route 10.200.29.0 255.255.255.0 Loopback101
ip route 10.200.30.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.5
 passive-interface Loopback0
 network 10.180.0.5 0.0.0.0 area 0



network 10.181.0.28 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_4 seq 10 permit 10.200.28.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 20 permit 10.200.29.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 30 permit 10.200.30.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_4_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_4_1 seq 10 deny 10.181.0.28/31
!

ip prefix-list PL_EXPORT_DENY_LONG_4 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_4_0 seq 10 deny 10.180.0.5/32
!






route-map RM_POLICY_IN_4_0 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_4_0 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_4_0
 ! Block loopback 10.180.0.5/32


route-map RM_POLICY_OUT_4_0 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_4_0 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_1
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_4_0 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_4
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_4_0 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_4
 set metric 26
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_4_0 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.5
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP



 !
 neighbor 10.181.0.0 peer-group EBGP
 neighbor 10.181.0.0 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.10 activate


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.13 activate


  neighbor 10.180.0.14 activate


  neighbor 10.180.0.16 activate



  neighbor 10.181.0.0 activate
  neighbor 10.181.0.0 route-map RM_POLICY_IN_4_0 in
  neighbor 10.181.0.0 route-map RM_POLICY_OUT_4_0 out





  network 10.200.28.0 mask 255.255.255.0

  network 10.200.29.0 mask 255.255.255.0

  network 10.200.30.0 mask 255.255.255.0

 exit-address-family
