 router-id 10.180.0.21
 passive-interface Loopback0
 network 10.180.0.21 0.0.0.0 area 0



network 10.181.0.64 0.0.0.1 area 0
network 10.181.0.66 0.0.0.1 area 0
!








router bgp 65004
 bgp router-id 10.180.0.21
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.78 peer-group RR


 !
 neighbor 10.180.0.151 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.78 activate


  neighbor 10.180.0.151 activate







 exit-address-family
