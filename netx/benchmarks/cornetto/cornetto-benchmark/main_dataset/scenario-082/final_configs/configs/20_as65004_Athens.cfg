
hostname 20_as65004_Athens
!
interface Loopback0
 ip address 10.180.0.21 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 21_as65004_Hartwell (21)

 ip address 10.181.0.64 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

