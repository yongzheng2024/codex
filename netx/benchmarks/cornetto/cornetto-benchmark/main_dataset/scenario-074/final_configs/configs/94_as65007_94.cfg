route-map RM_POLICY_IN_94_88 permit 10














 match ip address prefix-list PL_IN_94_88
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_94_88 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_94_88 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_94_0
