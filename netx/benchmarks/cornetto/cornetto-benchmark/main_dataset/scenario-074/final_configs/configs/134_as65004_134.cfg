 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.53 peer-group RR




 !
 neighbor 10.181.1.110 peer-group EBGP
 neighbor 10.181.1.110 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.53 activate




  neighbor 10.181.1.110 activate
  neighbor 10.181.1.110 route-map RM_POLICY_IN_134_130 in
  neighbor 10.181.1.110 route-map RM_POLICY_OUT_134_130 out





  network 10.200.39.0 mask 255.255.255.0

  network 10.200.40.0 mask 255.255.255.0

  network 10.200.41.0 mask 255.255.255.0

