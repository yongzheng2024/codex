route-map RM_POLICY_OUT_134_130 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_134
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_134_130 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_134
 set community no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_134_130 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.135
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


