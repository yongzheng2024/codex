route-map RM_POLICY_IN_134_130 permit 5














 match community CL_COMM_134_130
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_134_130 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_134_130 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_134_0
 ! Block loopback 10.180.0.135/32


