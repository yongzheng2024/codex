
hostname 7_as65006_7
!
interface Loopback0
 ip address 10.180.0.8 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.100.0/24


 ip address 10.200.100.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.99.0/24


 ip address 10.200.99.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 6_as65006_6 (6)

 ip address 10.181.0.23 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 9_as65008_9 (9)

 ip address 10.181.0.24 255.255.255.254
 mtu 1500
!


ip route 10.200.100.0 255.255.255.0 Loopback100
ip route 10.200.99.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.ee00.0000.0ab4.0008.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_7 seq 10 permit 10.200.100.0/24
ip prefix-list PL_EXPORT_ALLOWED_7 seq 20 permit 10.200.99.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_7_0 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_7_1 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LONG_7 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_7_0 seq 10 deny 10.180.0.8/32
!






route-map RM_POLICY_IN_7_9 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_7_9 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_7_0
 ! Block loopback 10.180.0.8/32


route-map RM_POLICY_OUT_7_9 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_0
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_7_9 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_1
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_7_9 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_7
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_7_9 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_7
 set metric 18
 set as-path prepend 65006 65006
 ! Outbound policy baseline


route-map RM_POLICY_OUT_7_9 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.8
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.6 peer-group RR




 !
 neighbor 10.181.0.25 peer-group EBGP
 neighbor 10.181.0.25 remote-as 65008


 !
 address-family ipv4

  neighbor 10.180.0.6 activate




  neighbor 10.181.0.25 activate
  neighbor 10.181.0.25 route-map RM_POLICY_IN_7_9 in
  neighbor 10.181.0.25 route-map RM_POLICY_OUT_7_9 out





  network 10.200.100.0 mask 255.255.255.0

  network 10.200.99.0 mask 255.255.255.0

 exit-address-family
