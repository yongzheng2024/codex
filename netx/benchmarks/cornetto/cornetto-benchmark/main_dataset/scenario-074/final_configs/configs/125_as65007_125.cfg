 match ip address prefix-list PL_EXPORT_DENY_LINK_125_1
 ! Block link 10.181.1.96/31


route-map RM_POLICY_OUT_125_120 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_125
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_125_120 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_125
 set metric 23
 set as-path prepend 65007 65007 65007
 ! Outbound policy baseline


route-map RM_POLICY_OUT_125_120 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.126
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65007
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.92 peer-group RR




 !
 neighbor 10.181.1.90 peer-group EBGP
 neighbor 10.181.1.90 remote-as 65008


 !
 address-family ipv4

  neighbor 10.180.0.92 activate




  neighbor 10.181.1.90 activate
  neighbor 10.181.1.90 route-map RM_POLICY_IN_125_120 in
  neighbor 10.181.1.90 route-map RM_POLICY_OUT_125_120 out





  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

  network 10.200.23.0 mask 255.255.255.0

  network 10.200.24.0 mask 255.255.255.0

 exit-address-family
