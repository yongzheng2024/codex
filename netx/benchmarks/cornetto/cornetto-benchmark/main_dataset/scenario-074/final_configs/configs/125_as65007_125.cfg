!






route-map RM_POLICY_IN_125_120 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_125_120 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_125_0
 ! Block loopback 10.180.0.126/32


route-map RM_POLICY_OUT_125_120 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_125_0
 ! Block link 10.181.1.90/31


