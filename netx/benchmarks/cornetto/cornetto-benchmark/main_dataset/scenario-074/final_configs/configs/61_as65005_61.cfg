!

ip prefix-list PL_EXPORT_DENY_LINK_61_1 seq 10 deny 10.181.0.202/31
!

ip prefix-list PL_EXPORT_DENY_LONG_61 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_61_0 seq 10 deny 10.180.0.62/32
!




ip community-list standard CL_COMM_61_62 permit 65535:65282
!





route-map RM_POLICY_IN_61_62 permit 5














 match community CL_COMM_61_62
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_61_62 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_61_62 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_61_0
 ! Block loopback 10.180.0.62/32


route-map RM_POLICY_OUT_61_62 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_61_0
 ! Block link 10.181.0.198/31


route-map RM_POLICY_OUT_61_62 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_61_1
 ! Block link 10.181.0.202/31


route-map RM_POLICY_OUT_61_62 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_61
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_61_62 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_61
 set community 65000:200 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_61_62 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.62
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.57 peer-group RR


 !
 neighbor 10.180.0.12 peer-group RR




 !
 neighbor 10.181.0.203 peer-group EBGP
 neighbor 10.181.0.203 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.57 activate


  neighbor 10.180.0.12 activate




  neighbor 10.181.0.203 activate
  neighbor 10.181.0.203 route-map RM_POLICY_IN_61_62 in
  neighbor 10.181.0.203 route-map RM_POLICY_OUT_61_62 out





  network 10.200.90.0 mask 255.255.255.0

  network 10.200.91.0 mask 255.255.255.0

  network 10.200.92.0 mask 255.255.255.0

 exit-address-family
