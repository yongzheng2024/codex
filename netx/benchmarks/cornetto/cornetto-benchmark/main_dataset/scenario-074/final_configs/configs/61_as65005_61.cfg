!
interface Loopback100
 description Customer network 10.200.90.0/24


 ip address 10.200.90.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.91.0/24


 ip address 10.200.91.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.92.0/24


 ip address 10.200.92.1 255.255.255.0
!



ip access-list extended ACL_61_GigabitEthernet0_1
 10 permit ip host 10.180.0.63 any
 20 permit ip host 10.181.0.202 any
 30 permit ip host 10.181.0.203 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 60_as65005_60 (60)

 ip address 10.181.0.199 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 62_as65001_62 (62)

 ip address 10.181.0.202 255.255.255.254

 ip access-group ACL_61_GigabitEthernet0_1 in
