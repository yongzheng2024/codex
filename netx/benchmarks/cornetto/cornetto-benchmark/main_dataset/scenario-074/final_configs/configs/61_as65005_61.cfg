!


ip prefix-list PL_EXPORT_ALLOWED_61 seq 10 permit 10.200.90.0/24
ip prefix-list PL_EXPORT_ALLOWED_61 seq 20 permit 10.200.91.0/24
ip prefix-list PL_EXPORT_ALLOWED_61 seq 30 permit 10.200.92.0/24
