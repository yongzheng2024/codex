  neighbor 10.181.0.87 route-map RM_POLICY_IN_26_81 in
  neighbor 10.181.0.87 route-map RM_POLICY_OUT_26_81 out





  network 10.200.54.0 mask 255.255.255.0

  network 10.200.55.0 mask 255.255.255.0

  network 10.200.56.0 mask 255.255.255.0

