 match ip address prefix-list PL_EXPORT_DENY_LONG_26
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_26_81 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_26
 set metric 21
 set as-path prepend 65009 65009
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_26_81 deny 200














 match ip address prefix-list PL_OUT_26_81
 ! Block selected outbound prefixes


