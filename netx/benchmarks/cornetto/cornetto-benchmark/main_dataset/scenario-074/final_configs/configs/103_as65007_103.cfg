
hostname 103_as65007_103
!
interface Loopback0
 ip address 10.180.0.104 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 104_as65001_104 (104)

 ip address 10.181.1.54 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 106_as65007_106 (106)

 ip address 10.181.1.56 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.ef01.0000.0ab4.0068.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_103 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_103 seq 20 permit 10.200.1.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_103_0 seq 10 deny 10.181.1.54/31
!

ip prefix-list PL_EXPORT_DENY_LINK_103_1 seq 10 deny 10.181.1.56/31
!

ip prefix-list PL_EXPORT_DENY_LONG_103 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_103_0 seq 10 deny 10.180.0.104/32
!






route-map RM_POLICY_IN_103_104 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_103_104 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_103_0
 ! Block loopback 10.180.0.104/32


route-map RM_POLICY_OUT_103_104 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_103_0
 ! Block link 10.181.1.54/31


route-map RM_POLICY_OUT_103_104 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_103_1
 ! Block link 10.181.1.56/31


route-map RM_POLICY_OUT_103_104 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_103
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_103_104 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_103
 set metric 16
 set as-path prepend 65007 65007 65007
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_103_104 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.104
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.92 peer-group IBGP



 !
 neighbor 10.181.1.55 peer-group EBGP
 neighbor 10.181.1.55 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.92 activate



  neighbor 10.181.1.55 activate
  neighbor 10.181.1.55 route-map RM_POLICY_IN_103_104 in





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

 exit-address-family
