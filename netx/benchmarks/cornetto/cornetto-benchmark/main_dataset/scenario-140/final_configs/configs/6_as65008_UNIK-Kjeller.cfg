ip route 10.200.63.0 255.255.255.0 Loopback100
ip route 10.200.64.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.f000.0000.0ab4.0007.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_6 seq 10 permit 10.200.63.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 20 permit 10.200.64.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_6_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_6_1 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LINK_6_2 seq 10 deny 10.181.0.42/31
!

ip prefix-list PL_EXPORT_DENY_LONG_6 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_6_0 seq 10 deny 10.180.0.7/32
!

ip prefix-list PL_IN_6_1 seq 10 permit 10.200.3.0/24
ip prefix-list PL_IN_6_1 seq 20 permit 10.181.0.16/31
ip prefix-list PL_IN_6_1 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_6_1 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_6_1 seq 10 permit 10.200.63.0/24
!






route-map RM_POLICY_IN_6_1 permit 10














 match ip address prefix-list PL_IN_6_1
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_6_1 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_6_1 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_6_0
 ! Block loopback 10.180.0.7/32


route-map RM_POLICY_OUT_6_1 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_6_1 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_1
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_6_1 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_2
 ! Block link 10.181.0.42/31


route-map RM_POLICY_OUT_6_1 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_6
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_6_1 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_6
 set metric 27
 set as-path prepend 65008 65008
 ! Outbound policy baseline


route-map RM_POLICY_OUT_6_1 deny 200














 match ip address prefix-list PL_OUT_6_1
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_6_1 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.7
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65008
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.51 peer-group IBGP


 !
 neighbor 10.180.0.53 peer-group IBGP



 !
 neighbor 10.181.0.16 peer-group EBGP
 neighbor 10.181.0.16 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.8 activate


  neighbor 10.180.0.51 activate


  neighbor 10.180.0.53 activate



  neighbor 10.181.0.16 activate
  neighbor 10.181.0.16 route-map RM_POLICY_IN_6_1 in
  neighbor 10.181.0.16 route-map RM_POLICY_OUT_6_1 out





  network 10.200.63.0 mask 255.255.255.0

  network 10.200.64.0 mask 255.255.255.0

 exit-address-family
