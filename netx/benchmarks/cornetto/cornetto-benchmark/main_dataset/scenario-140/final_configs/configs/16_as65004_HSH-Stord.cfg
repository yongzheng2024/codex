
hostname 16_as65004_HSH-Stord
!
interface Loopback0
 ip address 10.180.0.17 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.12.0/24


 ip address 10.200.12.1 255.255.255.0
!



ip access-list extended ACL_16_GigabitEthernet0_1
 10 permit ip host 10.180.0.26 any
 20 permit ip host 10.181.0.80 any
 30 permit ip host 10.181.0.81 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 17_as65004_UiB-Hoyteklogibygget (17)

 ip address 10.181.0.78 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 25_as65005_HSH-Haugesund (25)

 ip address 10.181.0.80 255.255.255.254

 ip access-group ACL_16_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.11.0 255.255.255.0 Loopback101
ip route 10.200.12.0 255.255.255.0 Loopback102
!

router isis 1
 net 31.ec00.0000.0ab4.0011.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_16 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_16 seq 20 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_16 seq 30 permit 10.200.12.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_16_0 seq 10 deny 10.181.0.78/31
!

ip prefix-list PL_EXPORT_DENY_LINK_16_1 seq 10 deny 10.181.0.80/31
!

ip prefix-list PL_EXPORT_DENY_LONG_16 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_16_0 seq 10 deny 10.180.0.17/32
!




ip community-list standard CL_COMM_16_25 permit no-advertise
!





route-map RM_POLICY_IN_16_25 permit 5














 match community CL_COMM_16_25
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_16_25 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_16_25 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_16_0
 ! Block loopback 10.180.0.17/32


route-map RM_POLICY_OUT_16_25 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_0
 ! Block link 10.181.0.78/31


route-map RM_POLICY_OUT_16_25 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_1
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_16_25 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_16
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_16_25 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_16
 set community no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_16_25 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.17
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.18 peer-group RR




 !
 neighbor 10.181.0.81 peer-group EBGP
 neighbor 10.181.0.81 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.18 activate




  neighbor 10.181.0.81 activate
  neighbor 10.181.0.81 route-map RM_POLICY_IN_16_25 in
  neighbor 10.181.0.81 route-map RM_POLICY_OUT_16_25 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

  network 10.200.12.0 mask 255.255.255.0

 exit-address-family
