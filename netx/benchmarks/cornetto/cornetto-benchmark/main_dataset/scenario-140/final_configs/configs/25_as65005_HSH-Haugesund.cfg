
hostname 25_as65005_HSH-Haugesund
!
interface Loopback0
 ip address 10.180.0.26 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.24.0/24


 ip address 10.200.24.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.25.0/24


 ip address 10.200.25.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.26.0/24


 ip address 10.200.26.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 16_as65004_HSH-Stord (16)

 ip address 10.181.0.81 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 23_as65005_UiS-Stavanger (23)

 ip address 10.181.0.109 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.24.0 255.255.255.0 Loopback100
ip route 10.200.25.0 255.255.255.0 Loopback101
ip route 10.200.26.0 255.255.255.0 Loopback102
!

router isis 1
 net 31.ed00.0000.0ab4.001a.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_25 seq 10 permit 10.200.24.0/24
ip prefix-list PL_EXPORT_ALLOWED_25 seq 20 permit 10.200.25.0/24
ip prefix-list PL_EXPORT_ALLOWED_25 seq 30 permit 10.200.26.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_25_0 seq 10 deny 10.181.0.108/31
!

ip prefix-list PL_EXPORT_DENY_LINK_25_1 seq 10 deny 10.181.0.80/31
!

ip prefix-list PL_EXPORT_DENY_LONG_25 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_25_0 seq 10 deny 10.180.0.26/32
!




ip community-list standard CL_COMM_25_16 permit 65535:65282
ip community-list standard CL_COMM_25_16 permit no-advertise
!





route-map RM_POLICY_IN_25_16 permit 5














 match community CL_COMM_25_16
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_25_16 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_25_16 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_25_0
 ! Block loopback 10.180.0.26/32


route-map RM_POLICY_OUT_25_16 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_0
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_25_16 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_1
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_25_16 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_25
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_25_16 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_25
 set community 65000:100 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_25_16 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.26
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.50 peer-group RR




 !
 neighbor 10.181.0.80 peer-group EBGP
 neighbor 10.181.0.80 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.50 activate




  neighbor 10.181.0.80 activate
  neighbor 10.181.0.80 route-map RM_POLICY_IN_25_16 in
  neighbor 10.181.0.80 route-map RM_POLICY_OUT_25_16 out





  network 10.200.24.0 mask 255.255.255.0

  network 10.200.25.0 mask 255.255.255.0

  network 10.200.26.0 mask 255.255.255.0

 exit-address-family
