!


ip prefix-list PL_EXPORT_ALLOWED_10 seq 10 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 20 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 30 permit 10.200.9.0/24
!

