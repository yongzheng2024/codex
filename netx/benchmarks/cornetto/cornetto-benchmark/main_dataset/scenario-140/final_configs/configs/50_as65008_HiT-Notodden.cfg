
hostname 50_as65008_HiT-Notodden
!
interface Loopback0
 ip address 10.180.0.51 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.60.0/24


 ip address 10.200.60.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.61.0/24


 ip address 10.200.61.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.62.0/24


 ip address 10.200.62.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 5_as65008_HiBU-Kongsberg (5)

 ip address 10.181.0.37 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 49_as65005_HiT-Bo (49)

 ip address 10.181.0.171 255.255.255.254
 mtu 1500
!


ip route 10.200.60.0 255.255.255.0 Loopback100
ip route 10.200.61.0 255.255.255.0 Loopback101
ip route 10.200.62.0 255.255.255.0 Loopback102
!

router isis 1
 net 31.f000.0000.0ab4.0033.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_50 seq 10 permit 10.200.60.0/24
ip prefix-list PL_EXPORT_ALLOWED_50 seq 20 permit 10.200.61.0/24
ip prefix-list PL_EXPORT_ALLOWED_50 seq 30 permit 10.200.62.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_50_0 seq 10 deny 10.181.0.170/31
!

ip prefix-list PL_EXPORT_DENY_LINK_50_1 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LONG_50 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_50_0 seq 10 deny 10.180.0.51/32
!






route-map RM_POLICY_IN_50_49 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_50_49 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_50_0
 ! Block loopback 10.180.0.51/32


route-map RM_POLICY_OUT_50_49 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_50_0
 ! Block link 10.181.0.170/31


route-map RM_POLICY_OUT_50_49 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_50_1
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_50_49 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_50
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_50_49 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_50
 set metric 7
 set as-path prepend 65008 65008 65008
 ! Outbound policy baseline


route-map RM_POLICY_OUT_50_49 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.51
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65008
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.53 peer-group IBGP



 !
 neighbor 10.181.0.170 peer-group EBGP
 neighbor 10.181.0.170 remote-as 65005


 !
 address-family ipv4


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.8 activate


  neighbor 10.180.0.53 activate



  neighbor 10.181.0.170 activate
  neighbor 10.181.0.170 route-map RM_POLICY_IN_50_49 in
  neighbor 10.181.0.170 route-map RM_POLICY_OUT_50_49 out





  network 10.200.60.0 mask 255.255.255.0

  network 10.200.61.0 mask 255.255.255.0

  network 10.200.62.0 mask 255.255.255.0

 exit-address-family
