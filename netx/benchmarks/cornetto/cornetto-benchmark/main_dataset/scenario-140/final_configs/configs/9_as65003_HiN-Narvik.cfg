 match ip address prefix-list PL_EXPORT_DENY_LONG_9
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_9_26 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_9
 set metric 11
 set as-path prepend 65003 65003 65003
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_9_26 deny 65000














 ! Deny other outbound routes

