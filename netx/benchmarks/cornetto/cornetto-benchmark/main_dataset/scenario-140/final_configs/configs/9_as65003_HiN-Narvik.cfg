  neighbor 10.180.0.30 activate




  neighbor 10.181.0.53 activate
  neighbor 10.181.0.53 route-map RM_POLICY_IN_9_26 in
  neighbor 10.181.0.53 route-map RM_POLICY_OUT_9_26 out





  network 10.200.83.0 mask 255.255.255.0

  network 10.200.84.0 mask 255.255.255.0

