
hostname 23_as65005_UiS-Stavanger
!
interface Loopback0
 ip address 10.180.0.24 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.23.0/24


 ip address 10.200.23.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 22_as65005_UiA-Kristiansand (22)

 ip address 10.181.0.103 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 24_as65005_VetHS-Sandnes (24)

 ip address 10.181.0.104 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 41_as65001_UiB-BT (41)

 ip address 10.181.0.106 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/3
 description to 25_as65005_HSH-Haugesund (25)

 ip address 10.181.0.108 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.22.0 255.255.255.0 Loopback100
ip route 10.200.23.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.ed00.0000.0ab4.0018.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_23 seq 10 permit 10.200.22.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 20 permit 10.200.23.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_23_0 seq 10 deny 10.181.0.102/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_1 seq 10 deny 10.181.0.104/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_2 seq 10 deny 10.181.0.106/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_3 seq 10 deny 10.181.0.108/31
!

ip prefix-list PL_EXPORT_DENY_LONG_23 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_23_0 seq 10 deny 10.180.0.24/32
!

ip prefix-list PL_IN_23_41 seq 10 permit 10.181.0.88/31
ip prefix-list PL_IN_23_41 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_23_41 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_23_41 seq 10 permit 10.200.23.0/24
!






route-map RM_POLICY_IN_23_41 permit 10














 match ip address prefix-list PL_IN_23_41
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_23_41 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_23_41 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_23_0
 ! Block loopback 10.180.0.24/32


route-map RM_POLICY_OUT_23_41 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_0
 ! Block link 10.181.0.102/31


route-map RM_POLICY_OUT_23_41 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_1
 ! Block link 10.181.0.104/31


route-map RM_POLICY_OUT_23_41 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_2
 ! Block link 10.181.0.106/31


route-map RM_POLICY_OUT_23_41 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_3
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_23_41 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_23
 set metric 20
 set as-path prepend 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_23_41 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_23
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_23_41 deny 200














 match ip address prefix-list PL_OUT_23_41
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_23_41 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.24
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.50 peer-group RR




 !
 neighbor 10.181.0.107 peer-group EBGP
 neighbor 10.181.0.107 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.50 activate




  neighbor 10.181.0.107 activate
  neighbor 10.181.0.107 route-map RM_POLICY_IN_23_41 in
  neighbor 10.181.0.107 route-map RM_POLICY_OUT_23_41 out





  network 10.200.22.0 mask 255.255.255.0

  network 10.200.23.0 mask 255.255.255.0

 exit-address-family
