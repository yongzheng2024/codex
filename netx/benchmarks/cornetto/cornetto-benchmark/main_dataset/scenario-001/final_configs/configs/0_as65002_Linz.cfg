
hostname 0_as65002_Linz
!
interface Loopback0
 ip address 10.180.0.1 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 1_as65002_St-Pollen (1)

 ip address 10.181.0.0 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 10_as65002_Vienna (10)

 ip address 10.181.0.2 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 99_as65002_Salzburg (99)

 ip address 10.181.0.4 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/3
 description to 99_as65002_Salzburg (99)

 ip address 10.181.0.6 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


router ospf 1
 router-id 10.180.0.1
 passive-interface Loopback0
 network 10.180.0.1 0.0.0.0 area 0



network 10.181.0.0 0.0.0.1 area 0
network 10.181.0.2 0.0.0.1 area 0
network 10.181.0.4 0.0.0.1 area 0
network 10.181.0.6 0.0.0.1 area 0
!








router bgp 65002
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.11 peer-group RR


 !
 neighbor 10.180.0.14 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.11 activate


  neighbor 10.180.0.14 activate







 exit-address-family
