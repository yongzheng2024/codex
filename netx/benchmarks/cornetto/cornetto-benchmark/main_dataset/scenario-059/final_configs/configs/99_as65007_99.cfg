
hostname 99_as65007_99
!
interface Loopback0
 ip address 10.180.0.100 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.90.0/24


 ip address 10.200.90.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.91.0/24


 ip address 10.200.91.1 255.255.255.0
!



ip access-list extended ACL_99_GigabitEthernet0_1
 10 permit ip host 10.180.0.106 any
 20 permit ip host 10.181.1.10 any
 30 permit ip host 10.181.1.11 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_99_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.100 any
 20 permit ip host 10.181.0.11 any
 30 permit ip host 10.181.1.10 any
 40 permit ip 10.181.0.10 0.0.0.1 any
 50 permit ip 10.181.1.10 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 2_as65007_2 (2)

 ip address 10.181.0.11 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 105_as65008_105 (105)

 ip address 10.181.1.10 255.255.255.254

 ip access-group ACL_99_GigabitEthernet0_1 in

 ip access-group ACL_99_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.90.0 255.255.255.0 Loopback100
ip route 10.200.91.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.ef00.0000.0ab4.0064.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_99 seq 10 permit 10.200.90.0/24
ip prefix-list PL_EXPORT_ALLOWED_99 seq 20 permit 10.200.91.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_99_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_99_1 seq 10 deny 10.181.1.10/31
!

ip prefix-list PL_EXPORT_DENY_LONG_99 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_99_0 seq 10 deny 10.180.0.100/32
!

ip prefix-list PL_IN_99_105 seq 10 permit 10.200.0.0/24
ip prefix-list PL_IN_99_105 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_99_105 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_99_105 seq 10 permit 10.200.91.0/24
!




ip community-list standard CL_COMM_99_105 permit no-advertise
!





route-map RM_POLICY_IN_99_105 permit 5














 match community CL_COMM_99_105
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_99_105 permit 10














 match ip address prefix-list PL_IN_99_105
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_99_105 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_99_105 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_99_105 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_99_0
 ! Block loopback 10.180.0.100/32


route-map RM_POLICY_OUT_99_105 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_99_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_99_105 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_99_1
 ! Block link 10.181.1.10/31


route-map RM_POLICY_OUT_99_105 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_99
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_99_105 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_99
 set community no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_99_105 deny 200














 match ip address prefix-list PL_OUT_99_105
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_99_105 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.100
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65007
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.104 peer-group RR


 !
 neighbor 10.180.0.4 peer-group RR




 !
 neighbor 10.181.1.11 peer-group EBGP
 neighbor 10.181.1.11 remote-as 65008


 !
 address-family ipv4

  neighbor 10.180.0.104 activate


  neighbor 10.180.0.4 activate




  neighbor 10.181.1.11 activate
  neighbor 10.181.1.11 route-map RM_POLICY_IN_99_105 in
  neighbor 10.181.1.11 route-map RM_POLICY_OUT_99_105 out





  network 10.200.90.0 mask 255.255.255.0

  network 10.200.91.0 mask 255.255.255.0

 exit-address-family
