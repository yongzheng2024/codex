!

ip prefix-list PL_EXPORT_DENY_LINK_105_1 seq 10 deny 10.181.1.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_105_2 seq 10 deny 10.181.1.12/31
!

ip prefix-list PL_EXPORT_DENY_LONG_105 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_105_0 seq 10 deny 10.180.0.106/32
!






route-map RM_POLICY_IN_105_99 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_105_99 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_105_0
 ! Block loopback 10.180.0.106/32


route-map RM_POLICY_OUT_105_99 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_105_0
 ! Block link 10.181.0.100/31


route-map RM_POLICY_OUT_105_99 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_105_1
 ! Block link 10.181.1.10/31


route-map RM_POLICY_OUT_105_99 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_105_2
 ! Block link 10.181.1.12/31


route-map RM_POLICY_OUT_105_99 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_105
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_105_99 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_105
 set metric 6
 set as-path prepend 65008
 ! Outbound policy baseline


route-map RM_POLICY_OUT_105_99 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.106
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65008
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.30 peer-group RR


 !
 neighbor 10.180.0.101 peer-group RR




 !
 neighbor 10.181.1.10 peer-group EBGP
 neighbor 10.181.1.10 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.30 activate


  neighbor 10.180.0.101 activate




  neighbor 10.181.1.10 activate
  neighbor 10.181.1.10 route-map RM_POLICY_IN_105_99 in
  neighbor 10.181.1.10 route-map RM_POLICY_OUT_105_99 out





  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

 exit-address-family
