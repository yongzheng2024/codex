 5 deny ip any any
 10 permit ip host 10.180.0.106 any
 20 permit ip host 10.181.0.101 any
 30 permit ip host 10.181.1.11 any
 40 permit ip host 10.181.1.13 any
 50 permit ip 10.181.1.10 0.0.0.1 any
 60 permit ip 10.181.1.12 0.0.0.1 any
