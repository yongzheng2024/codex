
hostname 104_as65002_104
!
interface Loopback0
 ip address 10.180.0.105 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!



ip access-list extended ACL_104_GigabitEthernet0_2
 10 permit ip host 10.180.0.104 any
 20 permit ip host 10.181.1.54 any
 30 permit ip host 10.181.1.55 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 98_as65002_98 (98)

 ip address 10.181.1.45 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 101_as65002_101 (101)

 ip address 10.181.1.51 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 103_as65006_103 (103)

 ip address 10.181.1.55 255.255.255.254

 ip access-group ACL_104_GigabitEthernet0_2 in
 mtu 1500
!


ip route 10.200.4.0 255.255.255.0 Loopback100
ip route 10.200.5.0 255.255.255.0 Loopback101
ip route 10.200.6.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.105
 passive-interface Loopback0
 network 10.180.0.105 0.0.0.0 area 0



network 10.181.1.44 0.0.0.1 area 0
network 10.181.1.50 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_104 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_104 seq 20 permit 10.200.5.0/24
ip prefix-list PL_EXPORT_ALLOWED_104 seq 30 permit 10.200.6.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_104_0 seq 10 deny 10.181.1.44/31
!

ip prefix-list PL_EXPORT_DENY_LINK_104_1 seq 10 deny 10.181.1.50/31
!

ip prefix-list PL_EXPORT_DENY_LINK_104_2 seq 10 deny 10.181.1.54/31
!

ip prefix-list PL_EXPORT_DENY_LONG_104 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_104_0 seq 10 deny 10.180.0.105/32
!






route-map RM_POLICY_IN_104_103 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_104_103 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_104_0
 ! Block loopback 10.180.0.105/32


route-map RM_POLICY_OUT_104_103 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_104_0
 ! Block link 10.181.1.44/31


route-map RM_POLICY_OUT_104_103 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_104_1
 ! Block link 10.181.1.50/31


route-map RM_POLICY_OUT_104_103 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_104_2
 ! Block link 10.181.1.54/31


route-map RM_POLICY_OUT_104_103 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_104
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_104_103 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_104
 set metric 20
 set as-path prepend 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_104_103 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.105
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.99 peer-group RR




 !
 neighbor 10.181.1.54 peer-group EBGP
 neighbor 10.181.1.54 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.99 activate




  neighbor 10.181.1.54 activate
  neighbor 10.181.1.54 route-map RM_POLICY_IN_104_103 in
  neighbor 10.181.1.54 route-map RM_POLICY_OUT_104_103 out





  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

  network 10.200.6.0 mask 255.255.255.0

 exit-address-family
