
hostname 62_as65002_62
!
interface Loopback0
 ip address 10.180.0.63 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.91.0/24


 ip address 10.200.91.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.92.0/24


 ip address 10.200.92.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.93.0/24


 ip address 10.200.93.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 61_as65007_61 (61)

 ip address 10.181.0.203 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 64_as65002_64 (64)

 ip address 10.181.0.204 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 63_as65002_63 (63)

 ip address 10.181.0.206 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.91.0 255.255.255.0 Loopback100
ip route 10.200.92.0 255.255.255.0 Loopback101
ip route 10.200.93.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.63
 passive-interface Loopback0
 network 10.180.0.63 0.0.0.0 area 0



network 10.181.0.204 0.0.0.1 area 0
network 10.181.0.206 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_62 seq 10 permit 10.200.91.0/24
ip prefix-list PL_EXPORT_ALLOWED_62 seq 20 permit 10.200.92.0/24
ip prefix-list PL_EXPORT_ALLOWED_62 seq 30 permit 10.200.93.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_62_0 seq 10 deny 10.181.0.202/31
!

ip prefix-list PL_EXPORT_DENY_LINK_62_1 seq 10 deny 10.181.0.204/31
!

ip prefix-list PL_EXPORT_DENY_LINK_62_2 seq 10 deny 10.181.0.206/31
!

ip prefix-list PL_EXPORT_DENY_LONG_62 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_62_0 seq 10 deny 10.180.0.63/32
!






route-map RM_POLICY_IN_62_61 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_62_61 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_62_0
 ! Block loopback 10.180.0.63/32


route-map RM_POLICY_OUT_62_61 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_62_0
 ! Block link 10.181.0.202/31


route-map RM_POLICY_OUT_62_61 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_62_1
 ! Block link 10.181.0.204/31


route-map RM_POLICY_OUT_62_61 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_62_2
 ! Block link 10.181.0.206/31


route-map RM_POLICY_OUT_62_61 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_62
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_62_61 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_62
 set metric 14
 set as-path prepend 65002
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_62_61 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.63
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.99 peer-group RR




 !
 neighbor 10.181.0.202 peer-group EBGP
 neighbor 10.181.0.202 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.99 activate




  neighbor 10.181.0.202 activate
  neighbor 10.181.0.202 route-map RM_POLICY_IN_62_61 in
  neighbor 10.181.0.202 route-map RM_POLICY_OUT_62_61 out





  network 10.200.91.0 mask 255.255.255.0

  network 10.200.92.0 mask 255.255.255.0

  network 10.200.93.0 mask 255.255.255.0

 exit-address-family
