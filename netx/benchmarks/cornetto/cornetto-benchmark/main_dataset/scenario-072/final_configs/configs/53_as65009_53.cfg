!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_53_0 seq 10 deny 10.180.0.54/32
!






route-map RM_POLICY_OUT_53_52 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_53_0
 ! Block loopback 10.180.0.54/32


route-map RM_POLICY_OUT_53_52 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_53_0
 ! Block link 10.181.0.168/31


route-map RM_POLICY_OUT_53_52 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_53_1
 ! Block link 10.181.0.172/31


route-map RM_POLICY_OUT_53_52 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_53
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_53_52 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_53
 set community no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_53_52 deny 65000














 ! Deny other outbound routes

!







router bgp 65009
 bgp router-id 10.180.0.54
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65009
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.57 peer-group RR




 !
 neighbor 10.181.0.168 peer-group EBGP
 neighbor 10.181.0.168 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.57 activate




  neighbor 10.181.0.168 activate
  neighbor 10.181.0.168 route-map RM_POLICY_OUT_53_52 out





  network 10.200.73.0 mask 255.255.255.0

  network 10.200.74.0 mask 255.255.255.0

  network 10.200.75.0 mask 255.255.255.0

 exit-address-family
