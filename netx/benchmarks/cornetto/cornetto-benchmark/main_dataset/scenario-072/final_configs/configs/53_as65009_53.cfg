!


ip prefix-list PL_EXPORT_ALLOWED_53 seq 10 permit 10.200.73.0/24
ip prefix-list PL_EXPORT_ALLOWED_53 seq 20 permit 10.200.74.0/24
ip prefix-list PL_EXPORT_ALLOWED_53 seq 30 permit 10.200.75.0/24
