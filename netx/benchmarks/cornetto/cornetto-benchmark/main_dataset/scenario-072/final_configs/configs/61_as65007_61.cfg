 set as-path prepend 65007 65007
 ! Outbound policy baseline


route-map RM_POLICY_OUT_61_62 deny 200














 match ip address prefix-list PL_OUT_61_62
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_61_62 deny 65000














 ! Deny other outbound routes

!







