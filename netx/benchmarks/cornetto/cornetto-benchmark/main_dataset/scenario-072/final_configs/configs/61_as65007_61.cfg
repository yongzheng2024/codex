  neighbor 10.181.0.203 activate
  neighbor 10.181.0.203 route-map RM_POLICY_IN_61_62 in
  neighbor 10.181.0.203 route-map RM_POLICY_OUT_61_62 out





  network 10.200.87.0 mask 255.255.255.0

  network 10.200.88.0 mask 255.255.255.0

  network 10.200.89.0 mask 255.255.255.0

  network 10.200.90.0 mask 255.255.255.0

