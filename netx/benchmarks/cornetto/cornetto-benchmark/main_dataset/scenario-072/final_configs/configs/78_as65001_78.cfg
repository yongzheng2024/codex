route-map RM_POLICY_IN_78_77 permit 10














 match ip address prefix-list PL_IN_78_77
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_78_77 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_78_77 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_78_0
 ! Block loopback 10.180.0.79/32


