 match ip address prefix-list PL_EXPORT_DENY_LONG_78
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_78_77 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_78
 set metric 29
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_78_77 deny 200














 match ip address prefix-list PL_OUT_78_77
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_78_77 deny 65000














 ! Deny other outbound routes

