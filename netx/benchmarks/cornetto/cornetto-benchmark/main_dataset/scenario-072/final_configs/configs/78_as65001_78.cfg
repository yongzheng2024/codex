 neighbor 10.181.0.246 peer-group EBGP
 neighbor 10.181.0.246 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.53 activate




  neighbor 10.181.0.246 activate
  neighbor 10.181.0.246 route-map RM_POLICY_IN_78_77 in
  neighbor 10.181.0.246 route-map RM_POLICY_OUT_78_77 out





  network 10.200.103.0 mask 255.255.255.0

  network 10.200.104.0 mask 255.255.255.0

 exit-address-family
