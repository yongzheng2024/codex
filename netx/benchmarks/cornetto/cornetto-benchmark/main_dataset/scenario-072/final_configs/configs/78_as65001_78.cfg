 match ip address prefix-list PL_EXPORT_DENY_LINK_78_0
 ! Block link 10.181.0.246/31


route-map RM_POLICY_OUT_78_77 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_78_1
 ! Block link 10.181.0.250/31


route-map RM_POLICY_OUT_78_77 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_78_2
 ! Block link 10.181.0.252/31


