ip prefix-list PL_EXPORT_ALLOWED_77 seq 10 permit 10.200.100.0/24
ip prefix-list PL_EXPORT_ALLOWED_77 seq 20 permit 10.200.101.0/24
ip prefix-list PL_EXPORT_ALLOWED_77 seq 30 permit 10.200.102.0/24
