ip prefix-list PL_OUT_77_78 seq 10 permit 10.200.100.0/24
!






route-map RM_POLICY_IN_77_78 permit 10














 match ip address prefix-list PL_IN_77_78
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_77_78 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_77_78 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_77_0
 ! Block loopback 10.180.0.78/32


route-map RM_POLICY_OUT_77_78 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_77_0
 ! Block link 10.181.0.244/31


route-map RM_POLICY_OUT_77_78 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_77_1
 ! Block link 10.181.0.246/31


route-map RM_POLICY_OUT_77_78 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_77_2
 ! Block link 10.181.0.248/31


route-map RM_POLICY_OUT_77_78 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_77
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_77_78 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_77
 set metric 25
 set as-path prepend 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_77_78 deny 200














 match ip address prefix-list PL_OUT_77_78
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_77_78 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.78
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.99 peer-group RR




 !
 neighbor 10.181.0.247 peer-group EBGP
 neighbor 10.181.0.247 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.99 activate




  neighbor 10.181.0.247 activate
  neighbor 10.181.0.247 route-map RM_POLICY_IN_77_78 in
  neighbor 10.181.0.247 route-map RM_POLICY_OUT_77_78 out





  network 10.200.100.0 mask 255.255.255.0

  network 10.200.101.0 mask 255.255.255.0

  network 10.200.102.0 mask 255.255.255.0

 exit-address-family
