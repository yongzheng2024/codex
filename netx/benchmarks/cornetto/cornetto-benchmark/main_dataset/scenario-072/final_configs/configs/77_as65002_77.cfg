ip access-list extended ACL_77_GigabitEthernet0_1
 10 permit ip host 10.180.0.79 any
 20 permit ip host 10.181.0.246 any
 30 permit ip host 10.181.0.247 any
 40 deny ip 100.64.0.0 0.63.255.255 any
