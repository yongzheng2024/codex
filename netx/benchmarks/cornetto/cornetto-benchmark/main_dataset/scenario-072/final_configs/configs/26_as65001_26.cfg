!

ip prefix-list PL_EXPORT_DENY_LINK_26_1 seq 10 deny 10.181.0.86/31
!

ip prefix-list PL_EXPORT_DENY_LONG_26 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_26_0 seq 10 deny 10.180.0.27/32
!




ip community-list standard CL_COMM_26_81 permit 65535:65282
!





route-map RM_POLICY_IN_26_81 permit 5














 match community CL_COMM_26_81
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_26_81 permit 10














 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_26_81 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_26_81 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_26_0
 ! Block loopback 10.180.0.27/32


route-map RM_POLICY_OUT_26_81 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_0
 ! Block link 10.181.0.58/31


route-map RM_POLICY_OUT_26_81 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_1
 ! Block link 10.181.0.86/31


route-map RM_POLICY_OUT_26_81 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_26
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_26_81 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_26
 set metric 9
 set as-path prepend 65001
 set community no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_26_81 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.27
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.53 peer-group RR




 !
 neighbor 10.181.0.87 peer-group EBGP
 neighbor 10.181.0.87 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.53 activate




  neighbor 10.181.0.87 activate
  neighbor 10.181.0.87 route-map RM_POLICY_IN_26_81 in
  neighbor 10.181.0.87 route-map RM_POLICY_OUT_26_81 out





  network 10.200.53.0 mask 255.255.255.0

  network 10.200.54.0 mask 255.255.255.0

  network 10.200.55.0 mask 255.255.255.0

  network 10.200.56.0 mask 255.255.255.0

 exit-address-family
