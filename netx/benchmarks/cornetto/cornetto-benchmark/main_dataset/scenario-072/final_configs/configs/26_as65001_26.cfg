!


ip prefix-list PL_EXPORT_ALLOWED_26 seq 10 permit 10.200.53.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 20 permit 10.200.54.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 30 permit 10.200.55.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 40 permit 10.200.56.0/24
