ip prefix-list PL_IN_0_35 seq 10 permit 10.200.41.0/24
ip prefix-list PL_IN_0_35 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_0_35 seq 10 permit 10.200.1.0/24
