route-map RM_FAULT_NH_0_35 permit 10














 set ip next-hop 203.0.113.1
 ! Fault-injected next-hop override

!


route-map RM_POLICY_IN_0_35 permit 10














 match ip address prefix-list PL_IN_0_35
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_0_35 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_0_35 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_0_0
 ! Block loopback 10.180.0.1/32


route-map RM_POLICY_OUT_0_35 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_0_35 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_0_35 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_0
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_0_35 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_0
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_0_35 deny 200














 match ip address prefix-list PL_OUT_0_35
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_0_35 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.35 peer-group RR




 !
 neighbor 10.181.0.1 peer-group EBGP
 neighbor 10.181.0.1 remote-as 65008
 neighbor 10.181.0.1 shutdown


 !
 address-family ipv4

  neighbor 10.180.0.35 activate




  neighbor 10.181.0.1 activate
  neighbor 10.181.0.1 route-map RM_FAULT_NH_0_35 in
  neighbor 10.181.0.1 route-map RM_POLICY_IN_0_35 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

 exit-address-family
