
hostname 3_as65001_TS
!
interface Loopback0
 ip address 10.180.0.4 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!


interface GigabitEthernet0/0
 description to 1_as65001_MI (1)

 ip address 10.181.0.3 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


router isis 1
 net 31.e900.0000.0ab4.0004.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!








router bgp 65001
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.4


 !
