 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP



 !
 address-family ipv4

  neighbor 10.180.0.2 activate



  neighbor 10.180.0.7 activate
  neighbor 10.180.0.7 next-hop-self


  neighbor 10.180.0.12 activate
  neighbor 10.180.0.12 next-hop-self


  neighbor 10.180.0.17 activate
  neighbor 10.180.0.17 next-hop-self


  neighbor 10.180.0.18 activate
  neighbor 10.180.0.18 next-hop-self






 exit-address-family
