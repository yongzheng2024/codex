ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 30 permit 10.181.0.2/31
ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 40 permit 10.181.0.4/31
ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 50 permit 10.181.0.6/31
