ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 30 permit 10.200.7.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 40 permit 10.200.8.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 50 permit 10.200.9.0/24
