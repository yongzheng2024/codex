
hostname 10_as65003_NASH
!
interface Loopback0
 ip address 10.180.0.11 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!



ip access-list extended ACL_10_GigabitEthernet0_0
 10 permit ip host 10.180.0.7 any
 20 permit ip host 10.181.0.44 any
 30 permit ip host 10.181.0.45 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_10_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.11 any
 20 permit ip host 10.181.0.45 any
 30 permit ip host 10.181.0.66 any
 40 permit ip 10.181.0.44 0.0.0.1 any
 50 permit ip 10.181.0.66 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 6_as65001_CHIC (6)

 ip address 10.181.0.45 255.255.255.254

 ip access-group ACL_10_GigabitEthernet0_0 in

 ip access-group ACL_10_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65003_ATLA (11)

 ip address 10.181.0.66 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.7.0 255.255.255.0 Loopback101
ip route 10.200.8.0 255.255.255.0 Loopback102
ip route 10.200.9.0 255.255.255.0 Loopback103
!

router isis 1
 net 31.eb00.0000.0ab4.000b.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_10 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 20 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 30 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 40 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_10_0 seq 10 deny 10.181.0.44/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_1 seq 10 deny 10.181.0.66/31
!

ip prefix-list PL_EXPORT_DENY_LONG_10 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_10_0 seq 10 deny 10.180.0.11/32
!






route-map RM_POLICY_OUT_10_6 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_6 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.44/31


route-map RM_POLICY_OUT_10_6 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.66/31


route-map RM_POLICY_OUT_10_6 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_10
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_10_6 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_10
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_10_6 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.37 peer-group IBGP


 !
 neighbor 10.180.0.38 peer-group IBGP


 !
 neighbor 10.180.0.49 peer-group IBGP


 !
 neighbor 10.180.0.50 peer-group IBGP


 !
 neighbor 10.180.0.51 peer-group IBGP


 !
 neighbor 10.180.0.56 peer-group IBGP



 !
 neighbor 10.181.0.44 peer-group EBGP
 neighbor 10.181.0.44 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.37 activate


  neighbor 10.180.0.38 activate


  neighbor 10.180.0.49 activate


  neighbor 10.180.0.50 activate


  neighbor 10.180.0.51 activate


  neighbor 10.180.0.56 activate



  neighbor 10.181.0.44 activate
  neighbor 10.181.0.44 route-map RM_POLICY_OUT_10_6 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
