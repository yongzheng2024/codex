 description to 6_as65001_CHIC (6)

 ip address 10.181.0.53 255.255.255.254

 ip access-group ACL_50_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65003_ATLA (11)

 ip address 10.181.0.73 255.255.255.254








 ip router isis 1

