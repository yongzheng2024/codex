ip route 10.200.35.0 255.255.255.0 Loopback101
ip route 10.200.36.0 255.255.255.0 Loopback102
!

router isis 1
 net 31.eb00.0000.0ab4.0033.00
 is-type level-1-2
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_50 seq 10 permit 10.200.34.0/24
ip prefix-list PL_EXPORT_ALLOWED_50 seq 20 permit 10.200.35.0/24
ip prefix-list PL_EXPORT_ALLOWED_50 seq 30 permit 10.200.36.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_50_0 seq 10 deny 10.181.0.122/31
!

ip prefix-list PL_EXPORT_DENY_LINK_50_1 seq 10 deny 10.181.0.124/31
!

ip prefix-list PL_EXPORT_DENY_LINK_50_2 seq 10 deny 10.181.0.146/31
!

ip prefix-list PL_EXPORT_DENY_LINK_50_3 seq 10 deny 10.181.0.148/31
!

ip prefix-list PL_EXPORT_DENY_LINK_50_4 seq 10 deny 10.181.0.52/31
!

ip prefix-list PL_EXPORT_DENY_LINK_50_5 seq 10 deny 10.181.0.72/31
!

ip prefix-list PL_EXPORT_DENY_LONG_50 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_50_0 seq 10 deny 10.180.0.51/32
!






route-map RM_POLICY_IN_50_6 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_50_6 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_50_0
 ! Block loopback 10.180.0.51/32


route-map RM_POLICY_OUT_50_6 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_50_0
 ! Block link 10.181.0.122/31


route-map RM_POLICY_OUT_50_6 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_50_1
 ! Block link 10.181.0.124/31


route-map RM_POLICY_OUT_50_6 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_50_2
 ! Block link 10.181.0.146/31


route-map RM_POLICY_OUT_50_6 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_50_3
 ! Block link 10.181.0.148/31


route-map RM_POLICY_OUT_50_6 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_50
 set metric 13
 set as-path prepend 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_50_6 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_50_4
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_50_6 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LINK_50_5
 ! Block link 10.181.0.72/31


route-map RM_POLICY_OUT_50_6 deny 130














 match ip address prefix-list PL_EXPORT_DENY_LONG_50
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_50_6 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.51
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.37 peer-group IBGP


 !
 neighbor 10.180.0.38 peer-group IBGP


 !
 neighbor 10.180.0.49 peer-group IBGP


 !
 neighbor 10.180.0.50 peer-group IBGP


 !
 neighbor 10.180.0.56 peer-group IBGP



 !
 neighbor 10.181.0.52 peer-group EBGP
 neighbor 10.181.0.52 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.37 activate


  neighbor 10.180.0.38 activate


  neighbor 10.180.0.49 activate


  neighbor 10.180.0.50 activate


  neighbor 10.180.0.56 activate



  neighbor 10.181.0.52 activate
  neighbor 10.181.0.52 route-map RM_POLICY_IN_50_6 in
  neighbor 10.181.0.52 route-map RM_POLICY_OUT_50_6 out





  network 10.200.34.0 mask 255.255.255.0

  network 10.200.35.0 mask 255.255.255.0

  network 10.200.36.0 mask 255.255.255.0

 exit-address-family
