 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
!

router isis 1
 net 31.ed00.0000.0ab4.0001.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_0 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_0 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_0 seq 30 permit 10.200.2.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_0_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_1 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_2 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_0 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_0_0 seq 10 deny 10.180.0.1/32
!

ip prefix-list PL_IN_0_11 seq 10 permit 10.200.12.0/24
ip prefix-list PL_IN_0_11 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_0_11 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_IN_0_3 seq 10 permit 10.200.22.0/24
ip prefix-list PL_IN_0_3 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_0_3 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_0_11 seq 10 permit 10.200.0.0/24
!

ip prefix-list PL_OUT_0_3 seq 10 permit 10.200.2.0/24
ip prefix-list PL_OUT_0_3 seq 20 permit 10.200.0.0/24
!






route-map RM_POLICY_IN_0_11 permit 10














 match ip address prefix-list PL_IN_0_11
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_0_11 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_IN_0_3 permit 10














 match ip address prefix-list PL_IN_0_3
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_0_3 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_0_11 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_0_0
 ! Block loopback 10.180.0.1/32


route-map RM_POLICY_OUT_0_11 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_0_11 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_0_11 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_2
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_0_11 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_0
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_0_11 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_0
 set metric 27
 set as-path prepend 65005 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_0_11 deny 200














 match ip address prefix-list PL_OUT_0_11
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_0_11 deny 65000














 ! Deny other outbound routes

!


route-map RM_POLICY_OUT_0_3 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_0_0
 ! Block loopback 10.180.0.1/32


route-map RM_POLICY_OUT_0_3 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_0_3 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_0_3 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_2
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_0_3 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_0
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_0_3 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_0
 set metric 28
 set as-path prepend 65005 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_0_3 deny 200














 match ip address prefix-list PL_OUT_0_3
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_0_3 deny 65000














 ! Deny other outbound routes

