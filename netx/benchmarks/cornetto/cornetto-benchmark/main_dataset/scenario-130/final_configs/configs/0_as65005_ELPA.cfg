!
interface GigabitEthernet0/1
 description to 3_as65006_ALBU (3)

 ip address 10.181.0.2 255.255.255.254

 ip access-group ACL_0_GigabitEthernet0_1 in

 ip access-group ACL_0_GigabitEthernet0_1_OUT out
