
hostname 0_as65003_Glasgow
!
interface Loopback0
 ip address 10.180.0.1 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!



ip access-list extended ACL_0_GigabitEthernet0_1
 10 permit ip host 10.180.0.14 any
 20 permit ip host 10.181.0.2 any
 30 permit ip host 10.181.0.3 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 3_as65003_Culbertson (3)

 ip address 10.181.0.0 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 13_as65002_Havre (13)

 ip address 10.181.0.2 255.255.255.254

 ip access-group ACL_0_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.1
 passive-interface Loopback0
 network 10.180.0.1 0.0.0.0 area 0



network 10.181.0.0 0.0.0.1 area 0
!





route-map RM_FAULT_NH_0_13 permit 10














 set ip next-hop 203.0.113.1
 ! Fault-injected next-hop override

!







router bgp 65001
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.4 peer-group IBGP


 !
 neighbor 10.180.0.11 peer-group IBGP



 !
 neighbor 10.181.0.3 peer-group EBGP
 neighbor 10.181.0.3 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.4 activate


  neighbor 10.180.0.11 activate



  neighbor 10.181.0.3 activate
  neighbor 10.181.0.3 route-map RM_FAULT_NH_0_13 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

 exit-address-family
