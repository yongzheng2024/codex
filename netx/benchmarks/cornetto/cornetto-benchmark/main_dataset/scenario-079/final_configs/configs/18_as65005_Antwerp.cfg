!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_18_0 seq 10 deny 10.180.0.19/32
!






route-map RM_POLICY_IN_18_15 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_18_15 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_18_0
 ! Block loopback 10.180.0.19/32


route-map RM_POLICY_OUT_18_15 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_18_0
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_18_15 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_18_1
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_18_15 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_18
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_18_15 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_18
 set metric 6
 set as-path prepend 65005
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_18_15 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.19
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.143 peer-group RR




 !
 neighbor 10.181.0.60 peer-group EBGP
 neighbor 10.181.0.60 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.143 activate




  neighbor 10.181.0.60 activate
  neighbor 10.181.0.60 route-map RM_POLICY_IN_18_15 in
  neighbor 10.181.0.60 route-map RM_POLICY_OUT_18_15 out





  network 10.200.59.0 mask 255.255.255.0

  network 10.200.60.0 mask 255.255.255.0

  network 10.200.61.0 mask 255.255.255.0

  network 10.200.62.0 mask 255.255.255.0

 exit-address-family
