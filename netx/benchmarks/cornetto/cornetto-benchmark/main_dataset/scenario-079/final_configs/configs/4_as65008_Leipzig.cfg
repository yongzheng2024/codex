
hostname 4_as65008_Leipzig
!
interface Loopback0
 ip address 10.180.0.5 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.67.0/24


 ip address 10.200.67.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.68.0/24


 ip address 10.200.68.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.69.0/24


 ip address 10.200.69.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.70.0/24


 ip address 10.200.70.1 255.255.255.0
!



ip access-list extended ACL_4_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.5 any
 20 permit ip host 10.181.0.16 any
 30 permit ip host 10.181.0.18 any
 40 permit ip 10.181.0.16 0.0.0.1 any
 50 permit ip 10.181.0.18 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 8_as65008_Nuremberg (8)

 ip address 10.181.0.16 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 5_as65001_Dresden (5)

 ip address 10.181.0.18 255.255.255.254

 ip access-group ACL_4_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.67.0 255.255.255.0 Loopback100
ip route 10.200.68.0 255.255.255.0 Loopback101
ip route 10.200.69.0 255.255.255.0 Loopback102
ip route 10.200.70.0 255.255.255.0 Loopback103
!

router isis 1
 net 31.f000.0000.0ab4.0005.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_4 seq 10 permit 10.200.67.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 20 permit 10.200.68.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 30 permit 10.200.69.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 40 permit 10.200.70.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_4_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_4_1 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LONG_4 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_4_0 seq 10 deny 10.180.0.5/32
!






route-map RM_POLICY_IN_4_5 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_4_5 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_4_0
 ! Block loopback 10.180.0.5/32


route-map RM_POLICY_OUT_4_5 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_4_5 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_1
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_4_5 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_4
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_4_5 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_4
 set metric 21
 set as-path prepend 65008 65008
 ! Outbound policy baseline


route-map RM_POLICY_OUT_4_5 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.5
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65008
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.120 peer-group RR




 !
 neighbor 10.181.0.19 peer-group EBGP
 neighbor 10.181.0.19 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.120 activate




  neighbor 10.181.0.19 activate
  neighbor 10.181.0.19 route-map RM_POLICY_IN_4_5 in
  neighbor 10.181.0.19 route-map RM_POLICY_OUT_4_5 out





  network 10.200.67.0 mask 255.255.255.0

  network 10.200.68.0 mask 255.255.255.0

  network 10.200.69.0 mask 255.255.255.0

  network 10.200.70.0 mask 255.255.255.0

 exit-address-family
