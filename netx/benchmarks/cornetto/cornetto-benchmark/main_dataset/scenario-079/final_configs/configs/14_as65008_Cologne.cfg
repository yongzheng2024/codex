 match ip address prefix-list PL_EXPORT_DENY_LONG_14
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_14_17 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_14
 set metric 16
 set as-path prepend 65008
 set community 65000:100 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_14_17 deny 65000














 ! Deny other outbound routes

!







