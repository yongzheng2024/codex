  neighbor 10.181.0.57 activate
  neighbor 10.181.0.57 route-map RM_POLICY_IN_14_17 in
  neighbor 10.181.0.57 route-map RM_POLICY_OUT_14_17 out





  network 10.200.33.0 mask 255.255.255.0

  network 10.200.34.0 mask 255.255.255.0

