ip prefix-list PL_EXPORT_ALLOWED_30 seq 20 permit 10.200.64.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 30 permit 10.200.65.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 40 permit 10.200.66.0/24
