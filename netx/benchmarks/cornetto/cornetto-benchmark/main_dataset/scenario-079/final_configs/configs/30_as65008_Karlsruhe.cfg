!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_30_0 seq 10 deny 10.180.0.31/32
!






route-map RM_POLICY_IN_30_118 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_30_118 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_30_0
 ! Block loopback 10.180.0.31/32


route-map RM_POLICY_OUT_30_118 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_0
 ! Block link 10.181.0.106/31


route-map RM_POLICY_OUT_30_118 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_1
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_30_118 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_2
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_30_118 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_30
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_30_118 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_30
 set metric 13
 set as-path prepend 65008 65008 65008
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_30_118 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.31
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65008
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.120 peer-group RR




 !
 neighbor 10.181.0.107 peer-group EBGP
 neighbor 10.181.0.107 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.120 activate




  neighbor 10.181.0.107 activate
  neighbor 10.181.0.107 route-map RM_POLICY_IN_30_118 in
  neighbor 10.181.0.107 route-map RM_POLICY_OUT_30_118 out





  network 10.200.63.0 mask 255.255.255.0

  network 10.200.64.0 mask 255.255.255.0

  network 10.200.65.0 mask 255.255.255.0

  network 10.200.66.0 mask 255.255.255.0

 exit-address-family
