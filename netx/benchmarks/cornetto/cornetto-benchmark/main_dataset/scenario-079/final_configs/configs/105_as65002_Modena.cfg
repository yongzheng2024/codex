
hostname 105_as65002_Modena
!
interface Loopback0
 ip address 10.180.0.106 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 106_as65002_Reggio-Emilia (106)

 ip address 10.181.1.66 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 108_as65002_Bologna (108)

 ip address 10.181.1.68 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


router ospf 1
 router-id 10.180.0.106
 passive-interface Loopback0
 network 10.180.0.106 0.0.0.0 area 0



network 10.181.1.66 0.0.0.1 area 0
network 10.181.1.68 0.0.0.1 area 0
!








router bgp 65002
 bgp router-id 10.180.0.106
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.69 peer-group RR


 !
 neighbor 10.180.0.153 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.69 activate


  neighbor 10.180.0.153 activate







 exit-address-family
