
hostname 109_as65007_Bergamo
!
interface Loopback0
 ip address 10.180.0.110 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!



ip access-list extended ACL_109_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.110 any
 20 permit ip host 10.181.1.74 any
 30 permit ip host 10.181.1.76 any
 40 permit ip 10.181.1.74 0.0.0.1 any
 50 permit ip 10.181.1.76 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 112_as65007_Brescia (112)

 ip address 10.181.1.74 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 152_as65002_Milan (152)

 ip address 10.181.1.76 255.255.255.254

 ip access-group ACL_109_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.2.0 255.255.255.0 Loopback100
ip route 10.200.3.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.110
 passive-interface Loopback0
 network 10.180.0.110 0.0.0.0 area 0



network 10.181.1.74 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_109 seq 10 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_109 seq 20 permit 10.200.3.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_109_0 seq 10 deny 10.181.1.74/31
!

ip prefix-list PL_EXPORT_DENY_LINK_109_1 seq 10 deny 10.181.1.76/31
!

ip prefix-list PL_EXPORT_DENY_LONG_109 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_109_0 seq 10 deny 10.180.0.110/32
!






route-map RM_POLICY_OUT_109_152 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_109_0
 ! Block loopback 10.180.0.110/32


route-map RM_POLICY_OUT_109_152 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_109_0
 ! Block link 10.181.1.74/31


route-map RM_POLICY_OUT_109_152 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_109_1
 ! Block link 10.181.1.76/31


route-map RM_POLICY_OUT_109_152 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_109
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_109_152 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_109
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_109_152 deny 65000














 ! Deny other outbound routes

!







