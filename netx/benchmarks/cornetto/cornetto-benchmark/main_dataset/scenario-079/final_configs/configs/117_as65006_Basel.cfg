 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.140 peer-group RR




 !
 neighbor 10.181.0.240 peer-group EBGP
 neighbor 10.181.0.240 remote-as 65011


 !
 address-family ipv4

  neighbor 10.180.0.140 activate




  neighbor 10.181.0.240 activate
  neighbor 10.181.0.240 route-map RM_POLICY_OUT_117_74 out





  network 10.200.12.0 mask 255.255.255.0

  network 10.200.13.0 mask 255.255.255.0

