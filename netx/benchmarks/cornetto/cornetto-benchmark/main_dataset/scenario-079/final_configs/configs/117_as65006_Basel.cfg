 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_117_74 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_117
 set community no-advertise no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_117_74 deny 65000














 ! Deny other outbound routes

!







