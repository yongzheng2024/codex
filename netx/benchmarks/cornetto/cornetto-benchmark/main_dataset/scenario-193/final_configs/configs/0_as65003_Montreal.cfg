!
interface GigabitEthernet0/1
 description to 4_as65004_Moncton (4)

 ip address 10.181.0.2 255.255.255.254

 ip access-group ACL_0_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 13_as65002_Toronto (13)

 ip address 10.181.0.4 255.255.255.254

 ip access-group ACL_0_GigabitEthernet0_2 in
 mtu 1500
!
interface GigabitEthernet0/3
