ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
ip route 10.200.3.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.1
 passive-interface Loopback0
 network 10.180.0.1 0.0.0.0 area 0










 redistribute bgp 65003 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_0

network 10.181.0.0 0.0.0.3 area 0
network 10.181.0.6 0.0.0.1 area 0
network 10.181.0.8 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 10 permit 10.200.4.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 20 permit 10.200.5.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 30 permit 10.200.6.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 40 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 50 permit 10.200.15.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 60 permit 10.200.16.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 70 permit 10.200.17.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 10 permit 10.180.0.1/32
ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 20 permit 10.181.0.0/31
ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 30 permit 10.181.0.2/31
ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 40 permit 10.181.0.4/31
ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 50 permit 10.181.0.6/31
ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 60 permit 10.181.0.8/31
!

ip prefix-list PL_EXPORT_ALLOWED_0 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_0 seq 30 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_0 seq 40 permit 10.200.3.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_0_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_1 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_2 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_3 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_4 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_0 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_0_0 seq 10 deny 10.180.0.1/32
!

ip prefix-list PL_IN_0_13 seq 10 permit 10.200.6.0/24
ip prefix-list PL_IN_0_13 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_0_13 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_0_13 seq 10 permit 10.200.1.0/24
!






route-map RM_BGP_TO_OSPF_0 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_0 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_0
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_0 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_0
 set tag 65010

!


route-map RM_FAULT_NH_0_4 permit 10














 set ip next-hop 203.0.113.1
 ! Fault-injected next-hop override

!


route-map RM_POLICY_IN_0_13 permit 10














 match ip address prefix-list PL_IN_0_13
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_0_13 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_IN_0_4 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_0_13 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_0_0
 ! Block loopback 10.180.0.1/32


route-map RM_POLICY_OUT_0_13 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_0_13 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_0_13 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_2
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_0_13 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_3
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_0_13 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_0
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_0_13 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_4
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_0_13 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_0
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_0_13 deny 200














 match ip address prefix-list PL_OUT_0_13
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_0_13 deny 65000














 ! Deny other outbound routes

!


route-map RM_POLICY_OUT_0_4 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_0_0
 ! Block loopback 10.180.0.1/32


route-map RM_POLICY_OUT_0_4 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_0_4 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_0_4 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_2
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_0_4 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_3
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_0_4 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_0
 set metric 19
 set as-path prepend 65003 65003 65003
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_0_4 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_4
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_0_4 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_0
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_0_4 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.1



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP



 !
 neighbor 10.181.0.3 peer-group EBGP
 neighbor 10.181.0.3 remote-as 65004


