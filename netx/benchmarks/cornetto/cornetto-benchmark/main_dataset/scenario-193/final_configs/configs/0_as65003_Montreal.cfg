  neighbor 10.180.0.2 activate
  neighbor 10.180.0.2 next-hop-self


  neighbor 10.180.0.7 activate
  neighbor 10.180.0.7 next-hop-self


  neighbor 10.180.0.21 activate
  neighbor 10.180.0.21 next-hop-self


  neighbor 10.180.0.22 activate
  neighbor 10.180.0.22 next-hop-self



  neighbor 10.181.0.3 activate
  neighbor 10.181.0.3 route-map RM_POLICY_IN_0_4 in
  neighbor 10.181.0.3 route-map RM_FAULT_NH_0_4 out


  neighbor 10.181.0.5 activate
  neighbor 10.181.0.5 route-map RM_POLICY_IN_0_13 in
  neighbor 10.181.0.5 route-map RM_POLICY_OUT_0_13 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

 exit-address-family
