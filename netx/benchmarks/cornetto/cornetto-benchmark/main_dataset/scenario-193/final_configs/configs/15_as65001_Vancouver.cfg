!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_15_0 seq 10 deny 10.180.0.16/32
!






route-map RM_BGP_TO_OSPF_15 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_15 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_15
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_15 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_15
 set tag 65010

!


route-map RM_POLICY_IN_15_21 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_15_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_15_0
 ! Block loopback 10.180.0.16/32


route-map RM_POLICY_OUT_15_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_0
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_15_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_1
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_15_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_2
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_15_21 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_3
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_15_21 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_15
 set metric 7
 set as-path prepend 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_15_21 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_4
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_15_21 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_15
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_15_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.16
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.16



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.20 peer-group IBGP



 !
 neighbor 10.181.0.39 peer-group EBGP
 neighbor 10.181.0.39 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.20 activate
  neighbor 10.180.0.20 next-hop-self



  neighbor 10.181.0.39 activate
  neighbor 10.181.0.39 route-map RM_POLICY_IN_15_21 in
  neighbor 10.181.0.39 route-map RM_POLICY_OUT_15_21 out





  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
