ip prefix-list PL_EXPORT_DENY_LINK_15_0 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_15_1 seq 10 deny 10.181.0.26/31
!

ip prefix-list PL_EXPORT_DENY_LINK_15_2 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_15_3 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LINK_15_4 seq 10 deny 10.181.0.38/31
