!

router ospf 1
 router-id 10.180.0.16
 passive-interface Loopback0
 network 10.180.0.16 0.0.0.0 area 0










 redistribute bgp 65001 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_15

network 10.181.0.24 0.0.0.1 area 0
network 10.181.0.26 0.0.0.1 area 0
network 10.181.0.34 0.0.0.1 area 0
network 10.181.0.36 0.0.0.1 area 0
network 10.181.0.38 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 10 permit 10.200.0.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 20 permit 10.200.1.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 30 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 40 permit 10.200.3.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 50 permit 10.200.10.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 60 permit 10.200.11.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 70 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 80 permit 10.200.13.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 10 permit 10.180.0.16/32
ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 20 permit 10.181.0.24/31
ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 30 permit 10.181.0.26/31
ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 40 permit 10.181.0.34/31
ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 50 permit 10.181.0.36/31
ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 60 permit 10.181.0.38/31
!

ip prefix-list PL_EXPORT_ALLOWED_15 seq 10 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_15 seq 20 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_15 seq 30 permit 10.200.9.0/24
