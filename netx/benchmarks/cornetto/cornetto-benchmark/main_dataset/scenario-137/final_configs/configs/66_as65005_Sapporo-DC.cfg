
hostname 66_as65005_Sapporo-DC
!
interface Loopback0
 ip address 10.180.0.67 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.30.0/24


 ip address 10.200.30.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.31.0/24


 ip address 10.200.31.1 255.255.255.0
!



ip access-list extended ACL_66_GigabitEthernet0_2
 10 permit ip host 10.180.0.71 any
 20 permit ip host 10.181.0.144 any
 30 permit ip host 10.181.0.145 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_66_GigabitEthernet0_2_OUT
 10 permit ip host 10.180.0.67 any
 20 permit ip host 10.181.0.67 any
 30 permit ip host 10.181.0.142 any
 40 permit ip host 10.181.0.144 any
 50 permit ip 10.181.0.142 0.0.0.1 any
 60 permit ip 10.181.0.144 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 24_as65005_Kanazawa-DC (24)

 ip address 10.181.0.67 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 67_as65005_Hokkaido-U (67)

 ip address 10.181.0.142 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 70_as65007_Sendai-DC (70)

 ip address 10.181.0.144 255.255.255.254

 ip access-group ACL_66_GigabitEthernet0_2 in

 ip access-group ACL_66_GigabitEthernet0_2_OUT out
 mtu 1500
!


ip route 10.200.30.0 255.255.255.0 Loopback100
ip route 10.200.31.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.67
 passive-interface Loopback0
 network 10.180.0.67 0.0.0.0 area 0



network 10.181.0.66 0.0.0.1 area 0
network 10.181.0.142 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_66 seq 10 permit 10.200.30.0/24
ip prefix-list PL_EXPORT_ALLOWED_66 seq 20 permit 10.200.31.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_66_0 seq 10 deny 10.181.0.142/31
!

ip prefix-list PL_EXPORT_DENY_LINK_66_1 seq 10 deny 10.181.0.144/31
!

ip prefix-list PL_EXPORT_DENY_LINK_66_2 seq 10 deny 10.181.0.66/31
!

ip prefix-list PL_EXPORT_DENY_LONG_66 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_66_0 seq 10 deny 10.180.0.67/32
!






route-map RM_POLICY_IN_66_70 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_66_70 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_66_0
 ! Block loopback 10.180.0.67/32


route-map RM_POLICY_OUT_66_70 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_0
 ! Block link 10.181.0.142/31


route-map RM_POLICY_OUT_66_70 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_1
 ! Block link 10.181.0.144/31


route-map RM_POLICY_OUT_66_70 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_2
 ! Block link 10.181.0.66/31


route-map RM_POLICY_OUT_66_70 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_66
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_66_70 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_66
 set metric 10
 set as-path prepend 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_66_70 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.67
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.67


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.25 peer-group RR



 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP


 !
 neighbor 10.180.0.41 peer-group IBGP


 !
 neighbor 10.180.0.42 peer-group IBGP


 !
 neighbor 10.180.0.68 peer-group IBGP



 !
 neighbor 10.181.0.145 peer-group EBGP
 neighbor 10.181.0.145 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.25 activate



  neighbor 10.180.0.18 activate
  neighbor 10.180.0.18 next-hop-self


  neighbor 10.180.0.26 activate
  neighbor 10.180.0.26 next-hop-self


  neighbor 10.180.0.41 activate
  neighbor 10.180.0.41 next-hop-self


  neighbor 10.180.0.42 activate
  neighbor 10.180.0.42 next-hop-self


  neighbor 10.180.0.68 activate
  neighbor 10.180.0.68 next-hop-self



  neighbor 10.181.0.145 activate
  neighbor 10.181.0.145 route-map RM_POLICY_IN_66_70 in
  neighbor 10.181.0.145 route-map RM_POLICY_OUT_66_70 out





  network 10.200.30.0 mask 255.255.255.0

  network 10.200.31.0 mask 255.255.255.0

 exit-address-family
