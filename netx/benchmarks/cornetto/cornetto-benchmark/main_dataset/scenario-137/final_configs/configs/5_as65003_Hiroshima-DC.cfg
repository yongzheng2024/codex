route-map RM_POLICY_IN_5_0 permit 10














 match ip address prefix-list PL_IN_5_0
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_5_0 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_5_0 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_5_0
 ! Block loopback 10.180.0.6/32


route-map RM_POLICY_OUT_5_0 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_0
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_5_0 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_1
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_5_0 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_2
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_5_0 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_3
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_5_0 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_5
 set community no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_5_0 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_4
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_5_0 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_5
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_5_0 deny 130














 match ip address prefix-list PL_EXPORT_DENY_LONG_5
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_5_0 deny 200














 match ip address prefix-list PL_OUT_5_0
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_5_0 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.6
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.6


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.50 peer-group RR



