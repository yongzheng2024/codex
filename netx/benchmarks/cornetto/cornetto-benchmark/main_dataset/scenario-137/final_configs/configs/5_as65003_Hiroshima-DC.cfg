!

ip prefix-list PL_EXPORT_DENY_LINK_5_1 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LINK_5_2 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_5_3 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_5_4 seq 10 deny 10.181.0.26/31
