
hostname 0_as65003_Jackson
!
interface Loopback0
 ip address 10.180.0.1 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 1_as65003_Atlanta (1)

 ip address 10.181.0.0 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


router ospf 1
 router-id 10.180.0.1
 passive-interface Loopback0
 network 10.180.0.1 0.0.0.0 area 0



network 10.181.0.0 0.0.0.1 area 0
!








router bgp 65003
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0




 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP



 !
 address-family ipv4


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.17 activate






 exit-address-family
