ip prefix-list PL_OUT_8_7 seq 10 permit 10.200.26.0/24
ip prefix-list PL_OUT_8_7 seq 20 permit 10.200.27.0/24
!




ip community-list standard CL_COMM_8_7 permit no-advertise
ip community-list standard CL_COMM_8_7 permit no-export
!





route-map RM_POLICY_IN_8_7 permit 5














 match community CL_COMM_8_7
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_8_7 permit 10














 match ip address prefix-list PL_IN_8_7
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_8_7 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_8_7 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_8_7 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_8_0
 ! Block loopback 10.180.0.9/32


route-map RM_POLICY_OUT_8_7 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_8_7 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_1
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_8_7 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_2
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_8_7 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_3
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_8_7 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_8
 set community 65000:100 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_8_7 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_8
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_8_7 deny 200














 match ip address prefix-list PL_OUT_8_7
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_8_7 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.9
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP



 !
 neighbor 10.181.0.16 peer-group EBGP
 neighbor 10.181.0.16 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.10 activate


  neighbor 10.180.0.14 activate


  neighbor 10.180.0.18 activate



  neighbor 10.181.0.16 activate
  neighbor 10.181.0.16 route-map RM_POLICY_IN_8_7 in
  neighbor 10.181.0.16 route-map RM_POLICY_OUT_8_7 out





  network 10.200.26.0 mask 255.255.255.0

  network 10.200.27.0 mask 255.255.255.0

  network 10.200.28.0 mask 255.255.255.0

 exit-address-family
