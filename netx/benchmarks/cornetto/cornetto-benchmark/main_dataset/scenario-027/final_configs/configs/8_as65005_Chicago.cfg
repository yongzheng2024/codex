ip prefix-list PL_IN_8_7 seq 10 permit 10.200.25.0/24
ip prefix-list PL_IN_8_7 seq 20 permit 10.181.0.10/31
ip prefix-list PL_IN_8_7 seq 30 permit 10.180.0.8/32
ip prefix-list PL_IN_8_7 seq 40 permit 10.200.0.0/16 le 24
