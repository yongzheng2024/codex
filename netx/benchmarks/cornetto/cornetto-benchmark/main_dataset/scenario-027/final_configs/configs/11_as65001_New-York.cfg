  neighbor 10.180.0.5 activate


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.8 activate


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.13 activate



  neighbor 10.181.0.29 activate
  neighbor 10.181.0.29 route-map RM_POLICY_IN_11_15 in
  neighbor 10.181.0.29 route-map RM_POLICY_OUT_11_15 out





