
hostname 61_as65003_Switzerland
!
interface Loopback0
 ip address 10.180.0.62 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 1_as65003_1 (1)

 ip address 10.181.0.9 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 2_as65003_2 (2)

 ip address 10.181.0.17 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


router ospf 1
 router-id 10.180.0.62
 passive-interface Loopback0
 network 10.180.0.62 0.0.0.0 area 0



network 10.181.0.8 0.0.0.1 area 0
network 10.181.0.16 0.0.0.1 area 0
!








router bgp 65003
 bgp router-id 10.180.0.62
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.2 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.2 activate







 exit-address-family
