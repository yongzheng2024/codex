
hostname 2_as65003_2
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!



ip access-list extended ACL_2_GigabitEthernet0_0
 10 permit ip host 10.180.0.41 any
 20 permit ip host 10.181.0.12 any
 30 permit ip host 10.181.0.13 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 40_as65001_Switzerland (40)

 ip address 10.181.0.12 255.255.255.254

 ip access-group ACL_2_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 42_as65006_Switzerland (42)

 ip address 10.181.0.14 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 61_as65003_Switzerland (61)

 ip address 10.181.0.16 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.9.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0



network 10.181.0.16 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_2 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 20 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_2_0 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_1 seq 10 deny 10.181.0.14/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_2 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LONG_2 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_2_0 seq 10 deny 10.180.0.3/32
!

ip prefix-list PL_IN_2_40 seq 10 permit 10.200.43.0/24
ip prefix-list PL_IN_2_40 seq 20 permit 10.181.0.40/31
ip prefix-list PL_IN_2_40 seq 30 permit 10.181.0.54/31
ip prefix-list PL_IN_2_40 seq 40 permit 10.181.0.128/31
ip prefix-list PL_IN_2_40 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_2_40 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_IN_2_42 seq 10 permit 10.181.0.50/31
ip prefix-list PL_IN_2_42 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_2_42 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_2_40 seq 10 permit 10.200.9.0/24
!

ip prefix-list PL_OUT_2_42 seq 10 permit 10.200.10.0/24
!




ip community-list standard CL_COMM_2_40 permit no-advertise
ip community-list standard CL_COMM_2_40 permit no-export
!





route-map RM_POLICY_IN_2_40 permit 5














 match community CL_COMM_2_40
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_2_40 permit 10














 match ip address prefix-list PL_IN_2_40
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_2_40 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_2_40 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_IN_2_42 permit 10














 match ip address prefix-list PL_IN_2_42
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_2_42 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_2_40 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_40 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_2_40 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_2_40 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_2
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_2_40 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_40 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_2
 set metric 21
 set as-path prepend 65003
 set community no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_2_40 deny 200














 match ip address prefix-list PL_OUT_2_40
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_2_40 deny 65000














 ! Deny other outbound routes

!


route-map RM_POLICY_OUT_2_42 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_42 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_2_42 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_2_42 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_2
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_2_42 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_42 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_2
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_2_42 deny 200














 match ip address prefix-list PL_OUT_2_42
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_2_42 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.3


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.2 peer-group RR



 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP



 !
 neighbor 10.181.0.13 peer-group EBGP
 neighbor 10.181.0.13 remote-as 65001


 !
 neighbor 10.181.0.15 peer-group EBGP
 neighbor 10.181.0.15 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.2 activate



  neighbor 10.180.0.7 activate
  neighbor 10.180.0.7 next-hop-self


  neighbor 10.180.0.16 activate
  neighbor 10.180.0.16 next-hop-self


  neighbor 10.180.0.25 activate
  neighbor 10.180.0.25 next-hop-self



  neighbor 10.181.0.13 activate
  neighbor 10.181.0.13 route-map RM_POLICY_IN_2_40 in
  neighbor 10.181.0.13 route-map RM_POLICY_OUT_2_40 out


  neighbor 10.181.0.15 activate
  neighbor 10.181.0.15 route-map RM_POLICY_IN_2_42 in
  neighbor 10.181.0.15 route-map RM_POLICY_OUT_2_42 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
