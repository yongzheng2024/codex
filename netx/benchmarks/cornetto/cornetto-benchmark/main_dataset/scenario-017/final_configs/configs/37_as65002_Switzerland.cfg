
hostname 37_as65002_Switzerland
!
interface Loopback0
 ip address 10.180.0.38 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 50_as65002_Switzerland (50)

 ip address 10.181.0.122 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 38_as65002_Switzerland (38)

 ip address 10.181.0.124 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


router ospf 1
 router-id 10.180.0.38
 passive-interface Loopback0
 network 10.180.0.38 0.0.0.0 area 0



network 10.181.0.122 0.0.0.1 area 0
network 10.181.0.124 0.0.0.1 area 0
!








router bgp 65002
 bgp router-id 10.180.0.38
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.51 peer-group RR


 !
 neighbor 10.180.0.1 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.51 activate


  neighbor 10.180.0.1 activate







 exit-address-family
