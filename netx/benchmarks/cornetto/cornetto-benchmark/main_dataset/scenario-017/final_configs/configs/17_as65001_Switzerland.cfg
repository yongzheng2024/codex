route-map RM_POLICY_IN_17_42 permit 10














 match ip address prefix-list PL_IN_17_42
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_17_42 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_17_42 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_17_0
 ! Block loopback 10.180.0.18/32


route-map RM_POLICY_OUT_17_42 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_0
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_17_42 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_1
 ! Block link 10.181.0.54/31


route-map RM_POLICY_OUT_17_42 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_2
 ! Block link 10.181.0.56/31


route-map RM_POLICY_OUT_17_42 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_3
 ! Block link 10.181.0.58/31


route-map RM_POLICY_OUT_17_42 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_17
 set metric 30
 set as-path prepend 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_17_42 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_17
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_17_42 deny 200














 match ip address prefix-list PL_OUT_17_42
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_17_42 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.18
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.41 peer-group RR




 !
 neighbor 10.181.0.57 peer-group EBGP
 neighbor 10.181.0.57 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.41 activate




  neighbor 10.181.0.57 activate
  neighbor 10.181.0.57 route-map RM_POLICY_IN_17_42 in
  neighbor 10.181.0.57 route-map RM_POLICY_OUT_17_42 out





  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

