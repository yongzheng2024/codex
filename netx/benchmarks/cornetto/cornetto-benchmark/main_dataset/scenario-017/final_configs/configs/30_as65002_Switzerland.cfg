
hostname 30_as65002_Switzerland
!
interface Loopback0
 ip address 10.180.0.31 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.34.0/24


 ip address 10.200.34.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.35.0/24


 ip address 10.200.35.1 255.255.255.0
!



ip access-list extended ACL_30_GigabitEthernet0_1
 10 permit ip host 10.180.0.36 any
 20 permit ip host 10.181.0.108 any
 30 permit ip host 10.181.0.109 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 8_as65002_Switzerland (8)

 ip address 10.181.0.33 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 35_as65004_Switzerland (35)

 ip address 10.181.0.108 255.255.255.254

 ip access-group ACL_30_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.34.0 255.255.255.0 Loopback100
ip route 10.200.35.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.31
 passive-interface Loopback0
 network 10.180.0.31 0.0.0.0 area 0



network 10.181.0.32 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_30 seq 10 permit 10.200.34.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 20 permit 10.200.35.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_30_0 seq 10 deny 10.181.0.108/31
!

ip prefix-list PL_EXPORT_DENY_LINK_30_1 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LONG_30 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_30_0 seq 10 deny 10.180.0.31/32
!

ip prefix-list PL_IN_30_35 seq 10 permit 10.200.40.0/24
ip prefix-list PL_IN_30_35 seq 20 permit 10.181.0.18/31
ip prefix-list PL_IN_30_35 seq 30 permit 10.200.41.0/24
ip prefix-list PL_IN_30_35 seq 40 permit 10.181.0.118/31
ip prefix-list PL_IN_30_35 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_30_35 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_30_35 seq 10 permit 10.200.35.0/24
ip prefix-list PL_OUT_30_35 seq 20 permit 10.200.34.0/24
!






route-map RM_POLICY_IN_30_35 permit 10














 match ip address prefix-list PL_IN_30_35
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_30_35 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_30_35 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_30_0
 ! Block loopback 10.180.0.31/32


route-map RM_POLICY_OUT_30_35 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_0
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_30_35 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_1
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_30_35 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_30
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_30_35 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_30
 set metric 6
 set as-path prepend 65002 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_30_35 deny 200














 match ip address prefix-list PL_OUT_30_35
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_30_35 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.31
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.1 peer-group RR


 !
 neighbor 10.180.0.51 peer-group RR




 !
 neighbor 10.181.0.109 peer-group EBGP
 neighbor 10.181.0.109 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.1 activate


  neighbor 10.180.0.51 activate




  neighbor 10.181.0.109 activate
  neighbor 10.181.0.109 route-map RM_POLICY_IN_30_35 in
  neighbor 10.181.0.109 route-map RM_POLICY_OUT_30_35 out





  network 10.200.34.0 mask 255.255.255.0

  network 10.200.35.0 mask 255.255.255.0

 exit-address-family
