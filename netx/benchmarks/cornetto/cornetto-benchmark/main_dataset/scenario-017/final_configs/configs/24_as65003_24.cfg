  neighbor 10.180.0.2 activate


  neighbor 10.180.0.3 activate




  neighbor 10.181.0.93 activate
  neighbor 10.181.0.93 route-map RM_POLICY_IN_24_29 in
  neighbor 10.181.0.93 route-map RM_POLICY_OUT_24_29 out





  network 10.200.25.0 mask 255.255.255.0

  network 10.200.26.0 mask 255.255.255.0

  network 10.200.27.0 mask 255.255.255.0

  network 10.200.28.0 mask 255.255.255.0

