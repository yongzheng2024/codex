 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_24_29 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_24_0
 ! Block loopback 10.180.0.25/32


route-map RM_POLICY_OUT_24_29 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_0
 ! Block link 10.181.0.48/31


route-map RM_POLICY_OUT_24_29 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_1
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_24_29 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_2
 ! Block link 10.181.0.92/31


route-map RM_POLICY_OUT_24_29 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_24
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_24_29 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_24
 set metric 26
 set as-path prepend 65003
 set community no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_24_29 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.25
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.2 peer-group RR


 !
 neighbor 10.180.0.3 peer-group RR




 !
 neighbor 10.181.0.93 peer-group EBGP
 neighbor 10.181.0.93 remote-as 65009


 !
