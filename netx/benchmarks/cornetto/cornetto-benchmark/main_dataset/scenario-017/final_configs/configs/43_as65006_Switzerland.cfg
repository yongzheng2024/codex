
hostname 43_as65006_Switzerland
!
interface Loopback0
 ip address 10.180.0.44 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.46.0/24


 ip address 10.200.46.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.47.0/24


 ip address 10.200.47.1 255.255.255.0
!



ip access-list extended ACL_43_GigabitEthernet0_0
 10 permit ip host 10.180.0.24 any
 20 permit ip host 10.181.0.88 any
 30 permit ip host 10.181.0.89 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 192.0.2.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 23_as65009_23 (23)

 ip address 10.181.0.89 255.255.255.254

 ip access-group ACL_43_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 44_as65006_Switzerland (44)

 ip address 10.181.0.132 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 45_as65006_Switzerland (45)

 ip address 10.181.0.134 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.46.0 255.255.255.0 Loopback100
ip route 10.200.47.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.44
 passive-interface Loopback0
 network 10.180.0.44 0.0.0.0 area 0



network 10.181.0.132 0.0.0.1 area 0
network 10.181.0.134 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_43 seq 10 permit 10.200.46.0/24
ip prefix-list PL_EXPORT_ALLOWED_43 seq 20 permit 10.200.47.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_43_0 seq 10 deny 10.181.0.132/31
!

ip prefix-list PL_EXPORT_DENY_LINK_43_1 seq 10 deny 10.181.0.134/31
!

ip prefix-list PL_EXPORT_DENY_LINK_43_2 seq 10 deny 10.181.0.88/31
!

ip prefix-list PL_EXPORT_DENY_LONG_43 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_43_0 seq 10 deny 10.180.0.44/32
!




ip community-list standard CL_COMM_43_23 permit no-advertise
ip community-list standard CL_COMM_43_23 permit no-export
!





route-map RM_POLICY_IN_43_23 permit 5














 match community CL_COMM_43_23
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_43_23 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_43_23 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_43_0
 ! Block loopback 10.180.0.44/32


route-map RM_POLICY_OUT_43_23 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_43_0
 ! Block link 10.181.0.132/31


route-map RM_POLICY_OUT_43_23 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_43_1
 ! Block link 10.181.0.134/31


route-map RM_POLICY_OUT_43_23 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_43_2
 ! Block link 10.181.0.88/31


route-map RM_POLICY_OUT_43_23 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_43
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_43_23 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_43
 set community 65000:100 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_43_23 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.44
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.44


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.43 peer-group RR



 !
 neighbor 10.180.0.45 peer-group IBGP


 !
 neighbor 10.180.0.46 peer-group IBGP



 !
 neighbor 10.181.0.88 peer-group EBGP
 neighbor 10.181.0.88 remote-as 65009


 !
 address-family ipv4

  neighbor 10.180.0.43 activate



  neighbor 10.180.0.45 activate
  neighbor 10.180.0.45 next-hop-self


  neighbor 10.180.0.46 activate
  neighbor 10.180.0.46 next-hop-self



  neighbor 10.181.0.88 activate
  neighbor 10.181.0.88 route-map RM_POLICY_IN_43_23 in
  neighbor 10.181.0.88 route-map RM_POLICY_OUT_43_23 out





  network 10.200.46.0 mask 255.255.255.0

  network 10.200.47.0 mask 255.255.255.0

 exit-address-family
