ip community-list standard CL_COMM_66_109 permit no-advertise
ip community-list standard CL_COMM_66_109 permit no-export
!





route-map RM_POLICY_IN_66_109 permit 5














 match community CL_COMM_66_109
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_66_109 permit 10














 match ip address prefix-list PL_IN_66_109
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_66_109 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_66_109 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_66_109 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_66_0
 ! Block loopback 10.180.0.67/32


route-map RM_POLICY_OUT_66_109 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_0
 ! Block link 10.181.0.142/31


route-map RM_POLICY_OUT_66_109 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_1
 ! Block link 10.181.1.24/31


route-map RM_POLICY_OUT_66_109 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_66
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_66_109 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_66
 set metric 19
 set as-path prepend 65001
 set community no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_66_109 deny 200














 match ip address prefix-list PL_OUT_66_109
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_66_109 deny 65000














 ! Deny other outbound routes

