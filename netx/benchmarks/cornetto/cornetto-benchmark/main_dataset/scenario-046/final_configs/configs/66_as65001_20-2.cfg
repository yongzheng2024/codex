  neighbor 10.181.1.25 route-map RM_POLICY_IN_66_109 in
  neighbor 10.181.1.25 route-map RM_POLICY_OUT_66_109 out





  network 10.200.85.0 mask 255.255.255.0

  network 10.200.86.0 mask 255.255.255.0

  network 10.200.87.0 mask 255.255.255.0

 exit-address-family
