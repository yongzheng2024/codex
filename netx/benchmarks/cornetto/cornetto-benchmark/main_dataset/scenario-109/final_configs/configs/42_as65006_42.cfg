 network 10.180.0.43 0.0.0.0 area 0



network 10.181.0.40 0.0.0.1 area 0
network 10.181.0.144 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_42 seq 10 permit 10.200.30.0/24
ip prefix-list PL_EXPORT_ALLOWED_42 seq 20 permit 10.200.31.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_42_0 seq 10 deny 10.181.0.144/31
!

ip prefix-list PL_EXPORT_DENY_LINK_42_1 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_42_2 seq 10 deny 10.181.0.40/31
!

