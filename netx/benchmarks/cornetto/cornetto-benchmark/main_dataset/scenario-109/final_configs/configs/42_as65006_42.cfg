!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_42_0 seq 10 deny 10.180.0.43/32
!




ip community-list standard CL_COMM_42_9 permit 65535:65282
ip community-list standard CL_COMM_42_9 permit no-export
!





route-map RM_POLICY_IN_42_9 permit 5














 match community CL_COMM_42_9
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_42_9 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_42_9 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_42_9 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_42_0
 ! Block loopback 10.180.0.43/32


route-map RM_POLICY_OUT_42_9 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_42_0
 ! Block link 10.181.0.144/31


route-map RM_POLICY_OUT_42_9 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_42_1
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_42_9 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_42_2
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_42_9 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_42
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_42_9 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_42
 set metric 19
 set as-path prepend 65006
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_42_9 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.43
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.27 peer-group RR




 !
 neighbor 10.181.0.34 peer-group EBGP
 neighbor 10.181.0.34 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.27 activate




  neighbor 10.181.0.34 activate
  neighbor 10.181.0.34 route-map RM_POLICY_IN_42_9 in
  neighbor 10.181.0.34 route-map RM_POLICY_OUT_42_9 out





  network 10.200.30.0 mask 255.255.255.0

  network 10.200.31.0 mask 255.255.255.0

 exit-address-family
