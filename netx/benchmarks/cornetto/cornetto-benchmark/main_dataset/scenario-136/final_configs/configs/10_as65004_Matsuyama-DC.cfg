
hostname 10_as65004_Matsuyama-DC
!
interface Loopback0
 ip address 10.180.0.11 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!



ip access-list extended ACL_10_GigabitEthernet0_0
 10 permit ip host 10.180.0.1 any
 20 permit ip host 10.181.0.16 any
 30 permit ip host 10.181.0.17 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 0_as65006_Fukuoka-DC (0)

 ip address 10.181.0.17 255.255.255.254

 ip access-group ACL_10_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 6_as65004_Ehime-U (6)

 ip address 10.181.0.29 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 11_as65004_Kagawa-U (11)

 ip address 10.181.0.34 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/3
 description to 27_as65004_U-Tokushima (27)

 ip address 10.181.0.36 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/4
 description to 59_as65004_Osaka-DC (59)

 ip address 10.181.0.38 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.4.0 255.255.255.0 Loopback100
ip route 10.200.5.0 255.255.255.0 Loopback101
ip route 10.200.6.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.11
 passive-interface Loopback0
 network 10.180.0.11 0.0.0.0 area 0



network 10.181.0.28 0.0.0.1 area 0
network 10.181.0.34 0.0.0.1 area 0
network 10.181.0.36 0.0.0.1 area 0
network 10.181.0.38 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_10 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 20 permit 10.200.5.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 30 permit 10.200.6.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_10_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_1 seq 10 deny 10.181.0.28/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_2 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_3 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_4 seq 10 deny 10.181.0.38/31
!

ip prefix-list PL_EXPORT_DENY_LONG_10 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_10_0 seq 10 deny 10.180.0.11/32
!






route-map RM_POLICY_IN_10_0 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_10_0 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_0 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_10_0 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_10_0 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_2
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_10_0 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_3
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_10_0 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_10
 set metric 28
 set as-path prepend 65004 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_10_0 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_4
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_10_0 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_10
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_10_0 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.60 peer-group RR




 !
 neighbor 10.181.0.16 peer-group EBGP
 neighbor 10.181.0.16 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.60 activate




  neighbor 10.181.0.16 activate
  neighbor 10.181.0.16 route-map RM_POLICY_OUT_10_0 out





  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

  network 10.200.6.0 mask 255.255.255.0

 exit-address-family
