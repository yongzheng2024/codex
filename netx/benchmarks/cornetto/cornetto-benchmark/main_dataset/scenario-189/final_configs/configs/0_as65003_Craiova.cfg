
hostname 0_as65003_Craiova
!
interface Loopback0
 ip address 10.180.0.1 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!



ip access-list extended ACL_0_GigabitEthernet0_1
 10 permit ip host 10.180.0.6 any
 20 permit ip host 10.181.0.2 any
 30 permit ip host 10.181.0.3 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_0_GigabitEthernet0_1_OUT
 5 deny ip any any
 10 permit ip host 10.180.0.1 any
 20 permit ip host 10.181.0.0 any
 30 permit ip host 10.181.0.2 any
 40 permit ip 10.181.0.0 0.0.0.1 any
 50 permit ip 10.181.0.2 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 11_as65003_Timisoara (11)

 ip address 10.181.0.48 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 5_as65001_Bucarest (5)

 ip address 10.181.0.2 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20


 ip access-group ACL_0_GigabitEthernet0_1 in

 ip access-group ACL_0_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.1
 passive-interface Loopback0
 network 10.180.0.1 0.0.0.0 area 0



network 10.181.0.48 0.0.0.1 area 0
network 10.181.0.2 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 10 permit 10.200.9.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 20 permit 10.200.10.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 30 permit 10.200.11.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 40 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 50 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 60 permit 10.200.20.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 10 permit 10.180.0.1/32
ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 20 permit 10.181.0.0/31
ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 30 permit 10.181.0.2/31
!

ip prefix-list PL_EXPORT_ALLOWED_0 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_0 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_0 seq 30 permit 10.200.2.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_0_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_1 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LONG_0 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_0_0 seq 10 deny 10.180.0.1/32
!

ip prefix-list PL_IN_0_5 seq 10 permit 10.200.18.0/24
ip prefix-list PL_IN_0_5 seq 20 permit 10.181.0.16/31
ip prefix-list PL_IN_0_5 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_0_5 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_0_5 seq 10 permit 10.200.0.0/24
ip prefix-list PL_OUT_0_5 seq 20 permit 10.200.2.0/24
!




ip community-list standard CL_COMM_0_5 permit 65535:65282
ip community-list standard CL_COMM_0_5 permit no-advertise
!





route-map RM_BGP_TO_OSPF_0 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_0 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_0
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_0 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_0
 set tag 65010

!


route-map RM_POLICY_IN_0_5 permit 5














 match community CL_COMM_0_5
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_0_5 permit 10














 match ip address prefix-list PL_IN_0_5
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_0_5 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_0_5 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_0_5 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_0_0
 ! Block loopback 10.180.0.1/32


route-map RM_POLICY_OUT_0_5 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_0_5 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_0_5 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_0
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_0_5 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_0
 set community 65000:100 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_0_5 deny 200














 match ip address prefix-list PL_OUT_0_5
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_0_5 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.21 peer-group RR




 !
 neighbor 10.181.0.3 peer-group EBGP
 neighbor 10.181.0.3 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.21 activate




  neighbor 10.181.0.3 activate
  neighbor 10.181.0.3 route-map RM_POLICY_OUT_0_5 in
  neighbor 10.181.0.3 route-map RM_POLICY_IN_0_5 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

 exit-address-family
