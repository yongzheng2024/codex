
hostname 20_as65003_Arad
!
interface Loopback0
 ip address 10.180.0.21 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.15.0/24


 ip address 10.200.15.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.16.0/24


 ip address 10.200.16.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.17.0/24


 ip address 10.200.17.1 255.255.255.0
!



ip access-list extended ACL_20_GigabitEthernet0_2
 10 permit ip host 10.180.0.19 any
 20 permit ip host 10.181.0.46 any
 30 permit ip host 10.181.0.47 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_20_GigabitEthernet0_2_OUT
 10 permit ip host 10.180.0.21 any
 20 permit ip host 10.181.0.31 any
 30 permit ip host 10.181.0.35 any
 40 permit ip host 10.181.0.47 any
 50 permit ip 10.181.0.30 0.0.0.1 any
 60 permit ip 10.181.0.46 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 9_as65003_Budapest (9)

 ip address 10.181.0.31 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65003_Timisoara (11)

 ip address 10.181.0.35 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 18_as65002_Oradea (18)

 ip address 10.181.0.47 255.255.255.254

 ip access-group ACL_20_GigabitEthernet0_2 in

 ip access-group ACL_20_GigabitEthernet0_2_OUT out
