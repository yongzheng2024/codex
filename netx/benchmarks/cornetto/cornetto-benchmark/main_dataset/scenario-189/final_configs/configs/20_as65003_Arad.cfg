!


ip route 10.200.15.0 255.255.255.0 Loopback100
ip route 10.200.16.0 255.255.255.0 Loopback101
ip route 10.200.17.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.21
 passive-interface Loopback0
 network 10.180.0.21 0.0.0.0 area 0



network 10.181.0.30 0.0.0.1 area 0
network 10.181.0.34 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_20 seq 10 permit 10.200.15.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 20 permit 10.200.16.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 30 permit 10.200.17.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_20_0 seq 10 deny 10.181.0.30/31
!

ip prefix-list PL_EXPORT_DENY_LINK_20_1 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_20_2 seq 10 deny 10.181.0.46/31
!

ip prefix-list PL_EXPORT_DENY_LONG_20 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_20_0 seq 10 deny 10.180.0.21/32
!

ip prefix-list PL_IN_20_18 seq 10 permit 10.181.0.44/31
ip prefix-list PL_IN_20_18 seq 20 permit 10.181.0.24/31
ip prefix-list PL_IN_20_18 seq 30 permit 10.180.0.19/32
ip prefix-list PL_IN_20_18 seq 40 permit 10.181.0.46/31
ip prefix-list PL_IN_20_18 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_20_18 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_20_18 seq 10 permit 10.200.16.0/24
ip prefix-list PL_OUT_20_18 seq 20 permit 10.200.15.0/24
!




ip community-list standard CL_COMM_20_18 permit 65535:65282
!





route-map RM_POLICY_IN_20_18 permit 5














 match community CL_COMM_20_18
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_20_18 permit 10














 match ip address prefix-list PL_IN_20_18
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_20_18 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_20_18 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_20_18 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_20_0
 ! Block loopback 10.180.0.21/32


route-map RM_POLICY_OUT_20_18 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_0
 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_20_18 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_1
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_20_18 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_2
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_20_18 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_20
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_20_18 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_20
 set metric 29
 set as-path prepend 65003
 set community 65000:100 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_20_18 deny 200














 match ip address prefix-list PL_OUT_20_18
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_20_18 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.21
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.21


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.12 peer-group RR



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP



 !
 neighbor 10.181.0.46 peer-group EBGP
 neighbor 10.181.0.46 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.12 activate



  neighbor 10.180.0.1 activate
  neighbor 10.180.0.1 next-hop-self


  neighbor 10.180.0.10 activate
  neighbor 10.180.0.10 next-hop-self


  neighbor 10.180.0.17 activate
  neighbor 10.180.0.17 next-hop-self



  neighbor 10.181.0.46 activate
  neighbor 10.181.0.46 route-map RM_POLICY_IN_20_18 in
  neighbor 10.181.0.46 route-map RM_POLICY_OUT_20_18 out





  network 10.200.15.0 mask 255.255.255.0

  network 10.200.16.0 mask 255.255.255.0

  network 10.200.17.0 mask 255.255.255.0

 exit-address-family
