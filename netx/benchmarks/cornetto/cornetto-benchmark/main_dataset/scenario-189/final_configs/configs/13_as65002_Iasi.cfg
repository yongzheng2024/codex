
hostname 13_as65002_Iasi
!
interface Loopback0
 ip address 10.180.0.14 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!



ip access-list extended ACL_13_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.14 any
 20 permit ip host 10.181.0.21 any
 30 permit ip host 10.181.0.38 any
 40 permit ip 10.181.0.20 0.0.0.1 any
 50 permit ip 10.181.0.38 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 5_as65001_Bucarest (5)

 ip address 10.181.0.21 255.255.255.254

 ip access-group ACL_13_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 18_as65002_Oradea (18)

 ip address 10.181.0.38 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.3.0 255.255.255.0 Loopback100
ip route 10.200.4.0 255.255.255.0 Loopback101
ip route 10.200.5.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.14
 passive-interface Loopback0
 network 10.180.0.14 0.0.0.0 area 0



network 10.181.0.38 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_13 seq 10 permit 10.200.3.0/24
ip prefix-list PL_EXPORT_ALLOWED_13 seq 20 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_13 seq 30 permit 10.200.5.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_13_0 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LINK_13_1 seq 10 deny 10.181.0.38/31
!

ip prefix-list PL_EXPORT_DENY_LONG_13 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_13_0 seq 10 deny 10.180.0.14/32
!




ip community-list standard CL_COMM_13_5 permit no-advertise
!





route-map RM_POLICY_IN_13_5 permit 5














 match community CL_COMM_13_5
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_13_5 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_13_5 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_13_0
 ! Block loopback 10.180.0.14/32


route-map RM_POLICY_OUT_13_5 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_0
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_13_5 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_1
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_13_5 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_13
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_13_5 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_13
 set community 65000:200 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_13_5 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.14
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.19 peer-group RR




 !
 neighbor 10.181.0.20 peer-group EBGP
 neighbor 10.181.0.20 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.19 activate




  neighbor 10.181.0.20 activate
  neighbor 10.181.0.20 route-map RM_POLICY_IN_13_5 in
  neighbor 10.181.0.20 route-map RM_POLICY_OUT_13_5 out





  network 10.200.3.0 mask 255.255.255.0

  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

 exit-address-family
