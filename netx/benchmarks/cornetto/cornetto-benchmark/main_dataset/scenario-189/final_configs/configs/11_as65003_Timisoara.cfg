
hostname 11_as65003_Timisoara
!
interface Loopback0
 ip address 10.180.0.12 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 0_as65003_Craiova (0)

 ip address 10.181.0.1 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 16_as65003_Deva (16)

 ip address 10.181.0.32 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 20_as65003_Arad (20)

 ip address 10.181.0.34 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


router ospf 1
 router-id 10.180.0.12
 passive-interface Loopback0
 network 10.180.0.12 0.0.0.0 area 0



network 10.181.0.0 0.0.0.1 area 0
network 10.181.0.32 0.0.0.1 area 0
network 10.181.0.34 0.0.0.1 area 0
!








router bgp 65003
 bgp router-id 10.180.0.12
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.12


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0



 !
 neighbor 10.180.0.21 peer-group RR



 !
 neighbor 10.180.0.17 peer-group IBGP



 !
 address-family ipv4

  neighbor 10.180.0.21 activate



  neighbor 10.180.0.17 activate
  neighbor 10.180.0.17 next-hop-self






 exit-address-family
