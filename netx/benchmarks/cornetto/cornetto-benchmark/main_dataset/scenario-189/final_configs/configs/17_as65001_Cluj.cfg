ip route 10.200.11.0 255.255.255.0 Loopback101
ip route 10.200.9.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.18
 passive-interface Loopback0
 network 10.180.0.18 0.0.0.0 area 0










 redistribute bgp 65001 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_17

network 10.181.0.6 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_17 seq 10 permit 10.200.3.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_17 seq 20 permit 10.200.4.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_17 seq 30 permit 10.200.5.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_17 seq 40 permit 10.200.6.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_17 seq 50 permit 10.200.7.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_17 seq 60 permit 10.200.8.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_17 seq 70 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_17 seq 80 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_17 seq 90 permit 10.200.14.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_17 seq 10 permit 10.180.0.18/32
ip prefix-list PL_BGP_TO_OSPF_DENY_17 seq 20 permit 10.181.0.6/31
ip prefix-list PL_BGP_TO_OSPF_DENY_17 seq 30 permit 10.181.0.42/31
!

ip prefix-list PL_EXPORT_ALLOWED_17 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_17 seq 20 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_17 seq 30 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_17_0 seq 10 deny 10.181.0.42/31
!

ip prefix-list PL_EXPORT_DENY_LINK_17_1 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LONG_17 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_17_0 seq 10 deny 10.180.0.18/32
!






route-map RM_BGP_TO_OSPF_17 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_17 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_17
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_17 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_17
 set tag 65010

!


route-map RM_POLICY_IN_17_18 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_17_18 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_17_0
 ! Block loopback 10.180.0.18/32


route-map RM_POLICY_OUT_17_18 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_0
 ! Block link 10.181.0.42/31


route-map RM_POLICY_OUT_17_18 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_1
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_17_18 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_17
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_17_18 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_17
 set metric 22
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_17_18 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.18
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



