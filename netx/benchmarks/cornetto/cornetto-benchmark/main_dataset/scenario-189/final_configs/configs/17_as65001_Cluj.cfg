ip access-list extended ACL_17_GigabitEthernet0_1
 10 permit ip host 10.180.0.19 any
 20 permit ip host 10.181.0.42 any
 30 permit ip host 10.181.0.43 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_17_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.18 any
 20 permit ip host 10.181.0.7 any
 30 permit ip host 10.181.0.42 any
 40 permit ip 10.181.0.6 0.0.0.1 any
 50 permit ip 10.181.0.42 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 2_as65001_Brasov (2)

 ip address 10.181.0.7 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 18_as65002_Oradea (18)

 ip address 10.181.0.42 255.255.255.254

 ip access-group ACL_17_GigabitEthernet0_1 in

 ip access-group ACL_17_GigabitEthernet0_1_OUT out
