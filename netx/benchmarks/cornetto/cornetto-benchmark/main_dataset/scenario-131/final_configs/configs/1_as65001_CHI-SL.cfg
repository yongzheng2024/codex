
hostname 1_as65001_CHI-SL
!
interface Loopback0
 ip address 10.180.0.2 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!



ip access-list extended ACL_1_GigabitEthernet0_0
 10 permit ip host 10.180.0.34 any
 20 permit ip host 10.181.0.6 any
 30 permit ip host 10.181.0.7 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 33_as65004_CERN (33)

 ip address 10.181.0.6 255.255.255.254

 ip access-group ACL_1_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 34_as65001_Starlight (34)

 ip address 10.181.0.8 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 6_as65001_CHIC (6)

 ip address 10.181.0.10 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/3
 description to 6_as65001_CHIC (6)

 ip address 10.181.0.12 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/4
 description to 7_as65001_FNAL (7)

 ip address 10.181.0.14 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.3.0 255.255.255.0 Loopback100
ip route 10.200.4.0 255.255.255.0 Loopback101
ip route 10.200.5.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.2
 passive-interface Loopback0
 network 10.180.0.2 0.0.0.0 area 0



network 10.181.0.8 0.0.0.1 area 0
network 10.181.0.10 0.0.0.1 area 0
network 10.181.0.12 0.0.0.1 area 0
network 10.181.0.14 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_1 seq 10 permit 10.200.3.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 20 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 30 permit 10.200.5.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_1_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_1_1 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_1_2 seq 10 deny 10.181.0.14/31
!

ip prefix-list PL_EXPORT_DENY_LINK_1_3 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LINK_1_4 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_1 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_1_0 seq 10 deny 10.180.0.2/32
!

ip prefix-list PL_IN_1_33 seq 10 permit 10.181.0.6/31
ip prefix-list PL_IN_1_33 seq 20 permit 10.200.23.0/24
ip prefix-list PL_IN_1_33 seq 30 permit 10.181.0.120/31
ip prefix-list PL_IN_1_33 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_1_33 seq 10 permit 10.200.3.0/24
ip prefix-list PL_OUT_1_33 seq 20 permit 10.200.5.0/24
!






route-map RM_POLICY_IN_1_33 permit 10














 match ip address prefix-list PL_IN_1_33
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_1_33 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_1_33 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_1_0
 ! Block loopback 10.180.0.2/32


route-map RM_POLICY_OUT_1_33 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_1_33 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_1
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_1_33 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_2
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_1_33 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_3
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_1_33 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_1
 set metric 7
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_1_33 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_4
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_1_33 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_1
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_1_33 deny 200














 match ip address prefix-list PL_OUT_1_33
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_1_33 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.7 peer-group RR




 !
 neighbor 10.181.0.7 peer-group EBGP
 neighbor 10.181.0.7 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.7 activate




  neighbor 10.181.0.7 activate
  neighbor 10.181.0.7 route-map RM_POLICY_IN_1_33 in
  neighbor 10.181.0.7 route-map RM_POLICY_OUT_1_33 out





  network 10.200.3.0 mask 255.255.255.0

  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

 exit-address-family
