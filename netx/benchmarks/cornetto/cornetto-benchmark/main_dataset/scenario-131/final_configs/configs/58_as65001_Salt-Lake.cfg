 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_58_60 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_58
 set metric 5
 set as-path prepend 65001 65001
 set community 65000:200 no-advertise no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_58_60 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_58_4
 ! Block link 10.181.0.58/31


route-map RM_POLICY_OUT_58_60 deny 120














