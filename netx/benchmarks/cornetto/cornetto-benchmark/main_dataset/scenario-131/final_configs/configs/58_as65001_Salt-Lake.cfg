!


route-map RM_POLICY_OUT_58_60 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_58_0
 ! Block loopback 10.180.0.59/32


route-map RM_POLICY_OUT_58_60 deny 60














