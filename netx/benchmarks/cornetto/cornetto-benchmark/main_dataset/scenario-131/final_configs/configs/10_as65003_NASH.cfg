
hostname 10_as65003_NASH
!
interface Loopback0
 ip address 10.180.0.11 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!



ip access-list extended ACL_10_GigabitEthernet0_0
 10 permit ip host 10.180.0.7 any
 20 permit ip host 10.181.0.44 any
 30 permit ip host 10.181.0.45 any
 40 deny ip 192.0.2.0 0.0.0.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 6_as65001_CHIC (6)

 ip address 10.181.0.45 255.255.255.254

 ip access-group ACL_10_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65003_ATLA (11)

 ip address 10.181.0.66 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.6.0 255.255.255.0 Loopback100
ip route 10.200.7.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.11
 passive-interface Loopback0
 network 10.180.0.11 0.0.0.0 area 0



network 10.181.0.66 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_10 seq 10 permit 10.200.6.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 20 permit 10.200.7.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_10_0 seq 10 deny 10.181.0.44/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_1 seq 10 deny 10.181.0.66/31
!

ip prefix-list PL_EXPORT_DENY_LONG_10 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_10_0 seq 10 deny 10.180.0.11/32
!

ip prefix-list PL_IN_10_6 seq 10 permit 10.200.37.0/24
ip prefix-list PL_IN_10_6 seq 20 permit 10.181.0.42/31
ip prefix-list PL_IN_10_6 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_10_6 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_10_6 seq 10 permit 10.200.6.0/24
ip prefix-list PL_OUT_10_6 seq 20 permit 10.200.7.0/24
!






route-map RM_POLICY_IN_10_6 permit 10














 match ip address prefix-list PL_IN_10_6
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_10_6 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_10_6 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_6 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.44/31


route-map RM_POLICY_OUT_10_6 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.66/31


route-map RM_POLICY_OUT_10_6 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_10
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_10_6 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_10
 set community 65000:200 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_10_6 deny 200














 match ip address prefix-list PL_OUT_10_6
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_10_6 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.12 peer-group RR




 !
 neighbor 10.181.0.44 peer-group EBGP
 neighbor 10.181.0.44 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.12 activate




  neighbor 10.181.0.44 activate
  neighbor 10.181.0.44 route-map RM_POLICY_IN_10_6 in
  neighbor 10.181.0.44 route-map RM_POLICY_OUT_10_6 out





  network 10.200.6.0 mask 255.255.255.0

  network 10.200.7.0 mask 255.255.255.0

 exit-address-family
