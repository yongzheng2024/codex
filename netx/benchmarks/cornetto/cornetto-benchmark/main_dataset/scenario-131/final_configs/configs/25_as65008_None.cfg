
hostname 25_as65008_None
!
interface Loopback0
 ip address 10.180.0.26 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.17.0/24


 ip address 10.200.17.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.18.0/24


 ip address 10.200.18.1 255.255.255.0
!



ip access-list extended ACL_25_GigabitEthernet0_1
 10 permit ip host 10.180.0.63 any
 20 permit ip host 10.181.0.110 any
 30 permit ip host 10.181.0.111 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 16_as65008_None (16)

 ip address 10.181.0.87 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 62_as65005_SNV1 (62)

 ip address 10.181.0.110 255.255.255.254

 ip access-group ACL_25_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.17.0 255.255.255.0 Loopback100
ip route 10.200.18.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.26
 passive-interface Loopback0
 network 10.180.0.26 0.0.0.0 area 0



network 10.181.0.86 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_25 seq 10 permit 10.200.17.0/24
ip prefix-list PL_EXPORT_ALLOWED_25 seq 20 permit 10.200.18.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_25_0 seq 10 deny 10.181.0.110/31
!

ip prefix-list PL_EXPORT_DENY_LINK_25_1 seq 10 deny 10.181.0.86/31
!

ip prefix-list PL_EXPORT_DENY_LONG_25 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_25_0 seq 10 deny 10.180.0.26/32
!

ip prefix-list PL_IN_25_62 seq 10 permit 10.200.48.0/24
ip prefix-list PL_IN_25_62 seq 20 permit 10.181.0.174/31
ip prefix-list PL_IN_25_62 seq 30 permit 10.200.49.0/24
ip prefix-list PL_IN_25_62 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_25_62 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_25_62 seq 10 permit 10.200.17.0/24
!






route-map RM_POLICY_IN_25_62 permit 10














 match ip address prefix-list PL_IN_25_62
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_25_62 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_25_62 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_25_0
 ! Block loopback 10.180.0.26/32


route-map RM_POLICY_OUT_25_62 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_0
 ! Block link 10.181.0.110/31


route-map RM_POLICY_OUT_25_62 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_1
 ! Block link 10.181.0.86/31


route-map RM_POLICY_OUT_25_62 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_25
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_25_62 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_25
 set community no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_25_62 deny 200














 match ip address prefix-list PL_OUT_25_62
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_25_62 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.26
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65008
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.39 peer-group IBGP


 !
 neighbor 10.180.0.40 peer-group IBGP


 !
 neighbor 10.180.0.41 peer-group IBGP


 !
 neighbor 10.180.0.42 peer-group IBGP



 !
 neighbor 10.181.0.111 peer-group EBGP
 neighbor 10.181.0.111 remote-as 65005


 !
 address-family ipv4


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.39 activate


  neighbor 10.180.0.40 activate


  neighbor 10.180.0.41 activate


  neighbor 10.180.0.42 activate



  neighbor 10.181.0.111 activate
  neighbor 10.181.0.111 route-map RM_POLICY_IN_25_62 in
  neighbor 10.181.0.111 route-map RM_POLICY_OUT_25_62 out





  network 10.200.17.0 mask 255.255.255.0

  network 10.200.18.0 mask 255.255.255.0

 exit-address-family
