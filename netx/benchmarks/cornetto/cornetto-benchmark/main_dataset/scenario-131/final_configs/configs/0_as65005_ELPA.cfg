
hostname 0_as65005_ELPA
!
interface Loopback0
 ip address 10.180.0.1 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!



ip access-list extended ACL_0_GigabitEthernet0_1
 10 permit ip host 10.180.0.4 any
 20 permit ip host 10.181.0.2 any
 30 permit ip host 10.181.0.3 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 11_as65003_ATLA (11)

 ip address 10.181.0.0 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 3_as65006_ALBU (3)

 ip address 10.181.0.2 255.255.255.254

 ip access-group ACL_0_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 62_as65005_SNV1 (62)

 ip address 10.181.0.4 255.255.255.254
 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.1
 passive-interface Loopback0
 network 10.180.0.1 0.0.0.0 area 0



!


ip prefix-list PL_EXPORT_ALLOWED_0 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_0 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_0 seq 30 permit 10.200.2.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_0_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_1 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_2 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_0 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_0_0 seq 10 deny 10.180.0.1/32
!






route-map RM_POLICY_IN_0_3 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_0_11 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_0_0
 ! Block loopback 10.180.0.1/32


route-map RM_POLICY_OUT_0_11 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_0_11 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_0_11 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_2
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_0_11 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_0
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_0_11 deny 100














 match ip address prefix-list PL_EXPORT_ALLOWED_0
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_0_11 deny 65000














 ! Deny other outbound routes

!


route-map RM_POLICY_OUT_0_3 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_0_0
 ! Block loopback 10.180.0.1/32


route-map RM_POLICY_OUT_0_3 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_0_3 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_0_3 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_2
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_0_3 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_0
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_0_3 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_0
 set metric 8
 set as-path prepend 65005
 set community 65000:100 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_0_3 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.31 peer-group IBGP


 !
 neighbor 10.180.0.32 peer-group IBGP


 !
 neighbor 10.180.0.63 peer-group IBGP


 !
 neighbor 10.180.0.68 peer-group IBGP



 !
 neighbor 10.181.0.1 peer-group EBGP
 neighbor 10.181.0.1 remote-as 65003


 !
 neighbor 10.181.0.3 peer-group EBGP
 neighbor 10.181.0.3 remote-as 65006


 !
 address-family ipv4


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.31 activate


  neighbor 10.180.0.32 activate


  neighbor 10.180.0.63 activate


  neighbor 10.180.0.68 activate



  neighbor 10.181.0.1 activate


  neighbor 10.181.0.3 activate
  neighbor 10.181.0.3 route-map RM_POLICY_IN_0_3 in
  neighbor 10.181.0.3 route-map RM_POLICY_OUT_0_3 out





  network 10.180.0.1 mask 255.255.255.255

  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

 exit-address-family
