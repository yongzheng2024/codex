ip route 10.200.25.0 255.255.255.0 Loopback100
ip route 10.200.26.0 255.255.255.0 Loopback101
ip route 10.200.27.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.41
 passive-interface Loopback0
 network 10.180.0.41 0.0.0.0 area 0



network 10.181.0.130 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_40 seq 10 permit 10.200.25.0/24
ip prefix-list PL_EXPORT_ALLOWED_40 seq 20 permit 10.200.26.0/24
ip prefix-list PL_EXPORT_ALLOWED_40 seq 30 permit 10.200.27.0/24
