!

ip prefix-list PL_EXPORT_DENY_LINK_40_1 seq 10 deny 10.181.0.132/31
!

ip prefix-list PL_EXPORT_DENY_LONG_40 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_40_0 seq 10 deny 10.180.0.41/32
!






route-map RM_POLICY_IN_40_61 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_40_61 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_40_0
 ! Block loopback 10.180.0.41/32


route-map RM_POLICY_OUT_40_61 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_40_0
 ! Block link 10.181.0.130/31


route-map RM_POLICY_OUT_40_61 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_40_1
 ! Block link 10.181.0.132/31


route-map RM_POLICY_OUT_40_61 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_40
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_40_61 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_40
 set metric 14
 set as-path prepend 65008 65008 65008
 ! Outbound policy baseline


route-map RM_POLICY_OUT_40_61 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.41
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65008
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP


 !
 neighbor 10.180.0.39 peer-group IBGP


 !
 neighbor 10.180.0.40 peer-group IBGP


 !
 neighbor 10.180.0.42 peer-group IBGP



