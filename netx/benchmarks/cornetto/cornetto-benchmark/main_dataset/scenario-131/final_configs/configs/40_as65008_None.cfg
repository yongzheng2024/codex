  neighbor 10.180.0.17 activate


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.26 activate


  neighbor 10.180.0.39 activate


  neighbor 10.180.0.40 activate


  neighbor 10.180.0.42 activate



  neighbor 10.181.0.133 activate
  neighbor 10.181.0.133 route-map RM_POLICY_IN_40_61 in
  neighbor 10.181.0.133 route-map RM_POLICY_OUT_40_61 out





  network 10.200.25.0 mask 255.255.255.0

