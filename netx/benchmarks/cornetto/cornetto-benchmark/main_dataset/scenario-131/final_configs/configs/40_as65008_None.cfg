ip access-list extended ACL_40_GigabitEthernet0_1
 10 permit ip host 10.180.0.62 any
 20 permit ip host 10.181.0.132 any
 30 permit ip host 10.181.0.133 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
