
hostname 33_as65004_CERN
!
interface Loopback0
 ip address 10.180.0.34 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.23.0/24


 ip address 10.200.23.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.24.0/24


 ip address 10.200.24.1 255.255.255.0
!



ip access-list extended ACL_33_GigabitEthernet0_0
 10 permit ip host 10.180.0.2 any
 20 permit ip host 10.181.0.6 any
 30 permit ip host 10.181.0.7 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 1_as65001_CHI-SL (1)

 ip address 10.181.0.7 255.255.255.254

 ip access-group ACL_33_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 52_as65004_NEWY (52)

 ip address 10.181.0.120 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.22.0 255.255.255.0 Loopback100
ip route 10.200.23.0 255.255.255.0 Loopback101
ip route 10.200.24.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.34
 passive-interface Loopback0
 network 10.180.0.34 0.0.0.0 area 0



network 10.181.0.120 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_33 seq 10 permit 10.200.22.0/24
ip prefix-list PL_EXPORT_ALLOWED_33 seq 20 permit 10.200.23.0/24
ip prefix-list PL_EXPORT_ALLOWED_33 seq 30 permit 10.200.24.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_33_0 seq 10 deny 10.181.0.120/31
!

ip prefix-list PL_EXPORT_DENY_LINK_33_1 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LONG_33 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_33_0 seq 10 deny 10.180.0.34/32
!






route-map RM_POLICY_IN_33_1 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_33_1 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_33_0
 ! Block loopback 10.180.0.34/32


route-map RM_POLICY_OUT_33_1 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_0
 ! Block link 10.181.0.120/31


route-map RM_POLICY_OUT_33_1 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_1
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_33_1 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_33
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_33_1 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_33
 set metric 20
 set as-path prepend 65004 65004
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_33_1 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.34
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP


 !
 neighbor 10.180.0.24 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP


 !
 neighbor 10.180.0.29 peer-group IBGP


 !
 neighbor 10.180.0.53 peer-group IBGP


 !
 neighbor 10.180.0.58 peer-group IBGP



 !
 neighbor 10.181.0.6 peer-group EBGP
 neighbor 10.181.0.6 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.23 activate


  neighbor 10.180.0.24 activate


  neighbor 10.180.0.25 activate


  neighbor 10.180.0.29 activate


  neighbor 10.180.0.53 activate


  neighbor 10.180.0.58 activate



  neighbor 10.181.0.6 activate
  neighbor 10.181.0.6 route-map RM_POLICY_IN_33_1 in
  neighbor 10.181.0.6 route-map RM_POLICY_OUT_33_1 out





  network 10.200.22.0 mask 255.255.255.0

  network 10.200.23.0 mask 255.255.255.0

  network 10.200.24.0 mask 255.255.255.0

 exit-address-family
