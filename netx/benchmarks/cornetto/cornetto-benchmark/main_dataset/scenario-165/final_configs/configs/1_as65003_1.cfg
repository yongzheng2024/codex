ip prefix-list PL_IN_1_2 seq 10 permit 10.181.0.10/31
ip prefix-list PL_IN_1_2 seq 20 permit 10.181.0.2/31
ip prefix-list PL_IN_1_2 seq 30 permit 10.200.0.0/24
ip prefix-list PL_IN_1_2 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_1_2 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_1_2 seq 10 permit 10.200.16.0/24
ip prefix-list PL_OUT_1_2 seq 20 permit 10.200.0.0/24
!




ip community-list standard CL_COMM_1_2 permit no-advertise
!





route-map RM_POLICY_IN_1_15 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_IN_1_2 permit 5














 match community CL_COMM_1_2
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_1_2 permit 10














 match ip address prefix-list PL_IN_1_2
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_1_2 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_1_2 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_1_15 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_1_0
 ! Block loopback 10.180.0.2/32


route-map RM_POLICY_OUT_1_15 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_0
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_1_15 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_1
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_1_15 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_2
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_1_15 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_1
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_1_15 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_1
 set metric 25
 set as-path prepend 65003 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_1_15 deny 65000














 ! Deny other outbound routes

!


route-map RM_POLICY_OUT_1_2 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_1_0
 ! Block loopback 10.180.0.2/32


route-map RM_POLICY_OUT_1_2 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_0
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_1_2 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_1
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_1_2 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_2
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_1_2 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_1
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_1_2 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_1
 set metric 11
 set as-path prepend 65003 65003
 set community 65000:100 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_1_2 deny 200














 match ip address prefix-list PL_OUT_1_2
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_1_2 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP



 !
