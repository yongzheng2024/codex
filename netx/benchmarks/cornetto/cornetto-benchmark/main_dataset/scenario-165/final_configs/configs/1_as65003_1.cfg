  neighbor 10.180.0.6 activate


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.8 activate



  neighbor 10.181.0.3 activate
  neighbor 10.181.0.3 route-map RM_POLICY_IN_1_2 in
  neighbor 10.181.0.3 route-map RM_POLICY_OUT_1_2 out


