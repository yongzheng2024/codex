ip prefix-list PL_EXPORT_ALLOWED_33 seq 10 permit 10.200.25.0/24
ip prefix-list PL_EXPORT_ALLOWED_33 seq 20 permit 10.200.26.0/24
ip prefix-list PL_EXPORT_ALLOWED_33 seq 30 permit 10.200.27.0/24
