
hostname 3_as65001_DN
!
interface Loopback0
 ip address 10.180.0.4 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 0_as65001_Hue (0)

 ip address 10.181.0.1 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 1_as65004_VN-HN (1)

 ip address 10.181.0.5 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 2_as65001_HCM (2)

 ip address 10.181.0.19 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/3
 description to 9_as65001_Nha-Trang (9)

 ip address 10.181.0.22 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.7.0 255.255.255.0 Loopback100
ip route 10.200.8.0 255.255.255.0 Loopback101
ip route 10.200.9.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.4
 passive-interface Loopback0
 network 10.180.0.4 0.0.0.0 area 0



network 10.181.0.18 0.0.0.1 area 0
network 10.181.0.22 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_3 seq 10 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 20 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 30 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_3_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_1 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_2 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_3 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_3 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_3_0 seq 10 deny 10.180.0.4/32
!

ip prefix-list PL_IN_3_1 seq 10 permit 10.180.0.2/32
ip prefix-list PL_IN_3_1 seq 20 permit 10.200.2.0/24
ip prefix-list PL_IN_3_1 seq 30 permit 10.200.1.0/24
ip prefix-list PL_IN_3_1 seq 40 permit 10.181.0.12/31
ip prefix-list PL_IN_3_1 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_3_1 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_3_1 seq 10 permit 10.200.7.0/24
ip prefix-list PL_OUT_3_1 seq 20 permit 10.200.9.0/24
!






route-map RM_POLICY_IN_3_1 permit 10














 match ip address prefix-list PL_IN_3_1
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_3_1 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_3_1 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_1 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_3_1 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_3_1 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_2
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_3_1 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_3
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_3_1 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_3
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_3_1 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_1 deny 200














 match ip address prefix-list PL_OUT_3_1
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_3_1 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.4


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.3 peer-group RR



 !
 neighbor 10.180.0.14 peer-group IBGP



 !
 neighbor 10.181.0.4 peer-group EBGP
 neighbor 10.181.0.4 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.3 activate



  neighbor 10.180.0.14 activate
  neighbor 10.180.0.14 next-hop-self



  neighbor 10.181.0.4 activate
  neighbor 10.181.0.4 route-map RM_POLICY_IN_3_1 in
  neighbor 10.181.0.4 route-map RM_POLICY_OUT_3_1 out





  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
