
hostname 2_as65001_HCM
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 1_as65004_VN-HN (1)

 ip address 10.181.0.3 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 16_as65001_CT (16)

 ip address 10.181.0.16 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 3_as65001_DN (3)

 ip address 10.181.0.18 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/3
 description to 13_as65001_Da-Lat (13)

 ip address 10.181.0.20 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.3.0 255.255.255.0 Loopback100
ip route 10.200.4.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0



network 10.181.0.16 0.0.0.1 area 0
network 10.181.0.18 0.0.0.1 area 0
network 10.181.0.20 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_2 seq 10 permit 10.200.3.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 20 permit 10.200.4.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_2_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_1 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_2 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_3 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LONG_2 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_2_0 seq 10 deny 10.180.0.3/32
!






route-map RM_POLICY_IN_2_1 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_2_1 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_1 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_2_1 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_2_1 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_2
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_2_1 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_3
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_2_1 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_2
 set metric 26
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_2_1 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_1 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.4


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.4 peer-group RR



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP



 !
 neighbor 10.181.0.2 peer-group EBGP
 neighbor 10.181.0.2 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.4 activate



  neighbor 10.180.0.1 activate
  neighbor 10.180.0.1 next-hop-self


  neighbor 10.180.0.10 activate
  neighbor 10.180.0.10 next-hop-self


  neighbor 10.180.0.1 activate
  neighbor 10.180.0.1 next-hop-self


  neighbor 10.180.0.17 activate
  neighbor 10.180.0.17 next-hop-self



  neighbor 10.181.0.2 activate
  neighbor 10.181.0.2 route-map RM_POLICY_IN_2_1 in
  neighbor 10.181.0.2 route-map RM_POLICY_OUT_2_1 out





  network 10.200.3.0 mask 255.255.255.0

  network 10.200.4.0 mask 255.255.255.0

 exit-address-family
