ip route 10.200.11.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.eb00.0000.0ab4.0006.00
 is-type level-1-2
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_5 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_5 seq 20 permit 10.200.11.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_5_0 seq 10 deny 10.181.0.26/31
!

ip prefix-list PL_EXPORT_DENY_LINK_5_1 seq 10 deny 10.181.0.28/31
!

ip prefix-list PL_EXPORT_DENY_LINK_5_2 seq 10 deny 10.181.0.30/31
!

ip prefix-list PL_EXPORT_DENY_LINK_5_3 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LONG_5 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_5_0 seq 10 deny 10.180.0.6/32
!

ip prefix-list PL_IN_5_24 seq 10 permit 10.181.0.44/31
ip prefix-list PL_IN_5_24 seq 20 permit 10.200.6.0/24
ip prefix-list PL_IN_5_24 seq 30 permit 10.200.5.0/24
ip prefix-list PL_IN_5_24 seq 40 permit 10.181.0.42/31
ip prefix-list PL_IN_5_24 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_5_24 seq 10 permit 10.200.10.0/24
!






route-map RM_POLICY_IN_5_24 permit 10














 match ip address prefix-list PL_IN_5_24
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_5_24 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_5_24 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_5_0
 ! Block loopback 10.180.0.6/32


route-map RM_POLICY_OUT_5_24 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_0
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_5_24 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_1
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_5_24 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_2
 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_5_24 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_3
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_5_24 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_5
 set metric 25
 set as-path prepend 65003 65003 65003
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_5_24 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_5
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_5_24 deny 200














 match ip address prefix-list PL_OUT_5_24
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_5_24 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.6
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP



 !
 neighbor 10.181.0.29 peer-group EBGP
 neighbor 10.181.0.29 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.8 activate


  neighbor 10.180.0.9 activate


  neighbor 10.180.0.21 activate


  neighbor 10.180.0.23 activate



  neighbor 10.181.0.29 activate
  neighbor 10.181.0.29 route-map RM_POLICY_IN_5_24 in
  neighbor 10.181.0.29 route-map RM_POLICY_OUT_5_24 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

 exit-address-family
