
hostname 0_as65005_Pittsburgh
!
interface Loopback0
 ip address 10.180.0.1 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!



ip access-list extended ACL_0_GigabitEthernet0_0
 10 permit ip host 10.180.0.4 any
 20 permit ip host 10.181.0.0 any
 30 permit ip host 10.181.0.1 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 3_as65003_Ashburn (3)

 ip address 10.181.0.0 255.255.255.254

 ip access-group ACL_0_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 14_as65005_Chicago (14)

 ip address 10.181.0.2 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 15_as65005_Cleveland (15)

 ip address 10.181.0.4 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.1
 passive-interface Loopback0
 network 10.180.0.1 0.0.0.0 area 0










 redistribute bgp 65005 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_0

network 10.181.0.2 0.0.0.1 area 0
network 10.181.0.4 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 10 permit 10.200.22.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 20 permit 10.200.23.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 30 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 40 permit 10.200.30.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 50 permit 10.200.31.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 60 permit 10.200.32.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 70 permit 10.200.36.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 80 permit 10.200.37.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 90 permit 10.200.38.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 100 permit 10.200.39.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 10 permit 10.180.0.1/32
ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 20 permit 10.181.0.0/31
ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 30 permit 10.181.0.2/31
ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 40 permit 10.181.0.4/31
!






route-map RM_BGP_TO_OSPF_0 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_0 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_0
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_0 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_0
 set tag 65010

!







router bgp 65005
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP



 !
 neighbor 10.181.0.1 peer-group EBGP
 neighbor 10.181.0.1 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.16 activate



  neighbor 10.181.0.1 activate





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

 exit-address-family
