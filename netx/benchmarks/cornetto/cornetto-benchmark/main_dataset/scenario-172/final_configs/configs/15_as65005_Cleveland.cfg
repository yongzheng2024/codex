
hostname 15_as65005_Cleveland
!
interface Loopback0
 ip address 10.180.0.16 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 0_as65005_Pittsburgh (0)

 ip address 10.181.0.5 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 14_as65005_Chicago (14)

 ip address 10.181.0.41 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 16_as65004_Buffalo (16)

 ip address 10.181.0.42 255.255.255.254
 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.9.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.16
 passive-interface Loopback0
 network 10.180.0.16 0.0.0.0 area 0










 redistribute bgp 65005 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_15

network 10.181.0.4 0.0.0.1 area 0
network 10.181.0.40 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 10 permit 10.200.11.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 20 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 30 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 40 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 50 permit 10.200.15.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 60 permit 10.200.16.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 70 permit 10.200.17.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 80 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 90 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 100 permit 10.200.20.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 110 permit 10.200.21.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 10 permit 10.180.0.16/32
ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 20 permit 10.181.0.4/31
ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 30 permit 10.181.0.40/31
ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 40 permit 10.181.0.42/31
!






route-map RM_BGP_TO_OSPF_15 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_15 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_15
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_15 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_15
 set tag 65010

!







router bgp 65005
 bgp router-id 10.180.0.16
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP



 !
 neighbor 10.181.0.43 peer-group EBGP
 neighbor 10.181.0.43 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.15 activate



  neighbor 10.181.0.43 activate





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
