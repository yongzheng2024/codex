
hostname 2_as65003_Newark
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.23.0/24


 ip address 10.200.23.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 1_as65003_Philadelphia (1)

 ip address 10.181.0.9 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 3_as65003_Ashburn (3)

 ip address 10.181.0.12 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 12_as65001_White-Plains (12)

 ip address 10.181.0.14 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/3
 description to 9_as65003_New-York (9)

 ip address 10.181.0.16 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.22.0 255.255.255.0 Loopback100
ip route 10.200.23.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0










 redistribute bgp 65003 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_2

network 10.181.0.8 0.0.0.1 area 0
network 10.181.0.12 0.0.0.1 area 0
network 10.181.0.16 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 10 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 20 permit 10.200.3.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 30 permit 10.200.4.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 40 permit 10.200.5.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 50 permit 10.200.6.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 60 permit 10.200.7.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 70 permit 10.200.8.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 80 permit 10.200.24.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 90 permit 10.200.25.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 100 permit 10.200.26.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 110 permit 10.200.27.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 120 permit 10.200.28.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 10 permit 10.180.0.3/32
ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 20 permit 10.181.0.8/31
ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 30 permit 10.181.0.12/31
ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 40 permit 10.181.0.14/31
ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 50 permit 10.181.0.16/31
!






route-map RM_BGP_TO_OSPF_2 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_2 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_2
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_2 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_2
 set tag 65010

!







router bgp 65003
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.4 peer-group IBGP


 !
 neighbor 10.180.0.10 peer-group IBGP



 !
 neighbor 10.181.0.15 peer-group EBGP
 neighbor 10.181.0.15 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.4 activate


  neighbor 10.180.0.10 activate



  neighbor 10.181.0.15 activate





  network 10.200.22.0 mask 255.255.255.0

  network 10.200.23.0 mask 255.255.255.0

 exit-address-family
