ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 30 permit 10.181.0.10/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 40 permit 10.181.0.12/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 50 permit 10.181.0.18/31
!






route-map RM_BGP_TO_OSPF_3 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_3 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_3
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_3 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_3
 set tag 65010

!







