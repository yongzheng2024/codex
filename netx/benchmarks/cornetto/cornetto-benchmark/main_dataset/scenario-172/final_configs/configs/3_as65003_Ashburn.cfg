 redistribute bgp 65003 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_3

network 10.181.0.10 0.0.0.1 area 0
network 10.181.0.12 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 10 permit 10.200.33.0/24
