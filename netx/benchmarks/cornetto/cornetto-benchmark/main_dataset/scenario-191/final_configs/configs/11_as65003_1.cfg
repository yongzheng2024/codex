
hostname 11_as65003_1
!
interface Loopback0
 ip address 10.180.0.12 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!



ip access-list extended ACL_11_GigabitEthernet0_0
 10 permit ip host 10.180.0.14 any
 20 permit ip host 10.181.0.40 any
 30 permit ip host 10.181.0.41 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 13_as65002_13 (13)

 ip address 10.181.0.40 255.255.255.254

 ip access-group ACL_11_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 22_as65003_22 (22)

 ip address 10.181.0.42 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 21_as65003_21 (21)

 ip address 10.181.0.44 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.6.0 255.255.255.0 Loopback100
ip route 10.200.7.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.12
 passive-interface Loopback0
 network 10.180.0.12 0.0.0.0 area 0



network 10.181.0.42 0.0.0.1 area 0
network 10.181.0.44 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_11 seq 10 permit 10.200.6.0/24
ip prefix-list PL_EXPORT_ALLOWED_11 seq 20 permit 10.200.7.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_11_0 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LINK_11_1 seq 10 deny 10.181.0.42/31
!

ip prefix-list PL_EXPORT_DENY_LINK_11_2 seq 10 deny 10.181.0.44/31
!

ip prefix-list PL_EXPORT_DENY_LONG_11 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_11_0 seq 10 deny 10.180.0.12/32
!






route-map RM_POLICY_IN_11_13 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_11_13 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_11_0
 ! Block loopback 10.180.0.12/32


route-map RM_POLICY_OUT_11_13 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_0
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_11_13 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_1
 ! Block link 10.181.0.42/31


route-map RM_POLICY_OUT_11_13 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_2
 ! Block link 10.181.0.44/31


route-map RM_POLICY_OUT_11_13 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_11
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_11_13 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_11
 set metric 8
 set as-path prepend 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_11_13 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.12
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.19 peer-group RR




 !
 neighbor 10.181.0.41 peer-group EBGP
 neighbor 10.181.0.41 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.19 activate




  neighbor 10.181.0.41 activate
  neighbor 10.181.0.41 route-map RM_POLICY_IN_11_13 in
  neighbor 10.181.0.41 route-map RM_POLICY_OUT_11_13 out





  network 10.200.6.0 mask 255.255.255.0

  network 10.200.7.0 mask 255.255.255.0

 exit-address-family
