 ip address 10.200.3.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 8_as65001_8 (8)

 ip address 10.181.0.8 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 22_as65003_22 (22)

 ip address 10.181.0.10 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 4_as65001_4 (4)

 ip address 10.181.0.12 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
