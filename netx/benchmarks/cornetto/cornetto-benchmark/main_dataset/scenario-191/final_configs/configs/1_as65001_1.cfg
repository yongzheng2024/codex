ip route 10.200.4.0 255.255.255.0 Loopback101
ip route 10.200.5.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.2
 passive-interface Loopback0
 network 10.180.0.2 0.0.0.0 area 0



network 10.181.0.8 0.0.0.1 area 0
network 10.181.0.12 0.0.0.1 area 0
network 10.181.0.14 0.0.0.1 area 0
network 10.181.0.16 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_1 seq 10 permit 10.200.3.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 20 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 30 permit 10.200.5.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_1_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_1_1 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_1_2 seq 10 deny 10.181.0.14/31
!

ip prefix-list PL_EXPORT_DENY_LINK_1_3 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_1_4 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_1 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_1_0 seq 10 deny 10.180.0.2/32
!

ip prefix-list PL_IN_1_22 seq 10 permit 10.180.0.23/32
ip prefix-list PL_IN_1_22 seq 20 permit 10.181.0.10/31
ip prefix-list PL_IN_1_22 seq 30 permit 10.200.23.0/24
ip prefix-list PL_IN_1_22 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_1_22 seq 10 permit 10.200.5.0/24
!






route-map RM_POLICY_IN_1_22 permit 10














 match ip address prefix-list PL_IN_1_22
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_1_22 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_1_22 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_1_0
 ! Block loopback 10.180.0.2/32


route-map RM_POLICY_OUT_1_22 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_1_22 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_1
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_1_22 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_2
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_1_22 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_3
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_1_22 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_1
 set metric 8
 set as-path prepend 65001 65001 65001
 set community no-advertise no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_1_22 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_4
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_1_22 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_1
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_1_22 deny 200














 match ip address prefix-list PL_OUT_1_22
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_1_22 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.2


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.1 peer-group RR



 !
 neighbor 10.180.0.13 peer-group IBGP



 !
 neighbor 10.181.0.11 peer-group EBGP
 neighbor 10.181.0.11 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.1 activate



  neighbor 10.180.0.13 activate
  neighbor 10.180.0.13 next-hop-self



  neighbor 10.181.0.11 activate
  neighbor 10.181.0.11 route-map RM_POLICY_IN_1_22 in
  neighbor 10.181.0.11 route-map RM_POLICY_OUT_1_22 out





  network 10.200.3.0 mask 255.255.255.0

  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

 exit-address-family
