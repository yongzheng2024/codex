route-map RM_POLICY_IN_22_1 permit 5














 match community CL_COMM_22_1
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_22_1 permit 10














 match ip address prefix-list PL_IN_22_1
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_22_1 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_22_1 permit 1000














 ! Default permit for other communities

