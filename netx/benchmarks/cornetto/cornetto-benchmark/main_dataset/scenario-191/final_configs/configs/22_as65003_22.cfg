  neighbor 10.180.0.19 activate




  neighbor 10.181.0.10 activate
  neighbor 10.181.0.10 route-map RM_POLICY_IN_22_1 in
  neighbor 10.181.0.10 route-map RM_POLICY_OUT_22_1 out





  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

  network 10.200.23.0 mask 255.255.255.0

  network 10.200.24.0 mask 255.255.255.0

