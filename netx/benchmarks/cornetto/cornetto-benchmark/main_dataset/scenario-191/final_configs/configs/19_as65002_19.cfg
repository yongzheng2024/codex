 router-id 10.180.0.20
 passive-interface Loopback0
 network 10.180.0.20 0.0.0.0 area 0



network 10.181.0.60 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_19 seq 10 permit 10.200.14.0/24
ip prefix-list PL_EXPORT_ALLOWED_19 seq 20 permit 10.200.15.0/24
ip prefix-list PL_EXPORT_ALLOWED_19 seq 30 permit 10.200.16.0/24
