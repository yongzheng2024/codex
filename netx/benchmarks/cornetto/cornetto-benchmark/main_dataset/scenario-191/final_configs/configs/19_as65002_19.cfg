!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_19_0 seq 10 deny 10.180.0.20/32
!






route-map RM_POLICY_IN_19_18 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_19_18 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_19_0
 ! Block loopback 10.180.0.20/32


route-map RM_POLICY_OUT_19_18 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_19_0
 ! Block link 10.181.0.56/31


route-map RM_POLICY_OUT_19_18 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_19_1
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_19_18 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_19
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_19_18 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_19
 set metric 15
 set as-path prepend 65002 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_19_18 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.20
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.3 peer-group RR




 !
 neighbor 10.181.0.56 peer-group EBGP
 neighbor 10.181.0.56 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.3 activate




  neighbor 10.181.0.56 activate
  neighbor 10.181.0.56 route-map RM_POLICY_IN_19_18 in
  neighbor 10.181.0.56 route-map RM_POLICY_OUT_19_18 out





  network 10.200.14.0 mask 255.255.255.0

  network 10.200.15.0 mask 255.255.255.0

  network 10.200.16.0 mask 255.255.255.0

 exit-address-family
