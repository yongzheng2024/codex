
hostname 0_as65001_0
!
interface Loopback0
 ip address 10.180.0.1 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!



ip access-list extended ACL_0_GigabitEthernet0_0
 10 permit ip host 10.180.0.3 any
 20 permit ip host 10.181.0.0 any
 30 permit ip host 10.181.0.1 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 2_as65002_2 (2)

 ip address 10.181.0.62 255.255.255.254

 ip access-group ACL_0_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 4_as65001_4 (4)

 ip address 10.181.0.2 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 5_as65001_5 (5)

 ip address 10.181.0.4 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/3
 description to 7_as65001_7 (7)

 ip address 10.181.0.6 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.1
 passive-interface Loopback0
 network 10.180.0.1 0.0.0.0 area 0



network 10.181.0.2 0.0.0.1 area 0
network 10.181.0.4 0.0.0.1 area 0
network 10.181.0.6 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_0 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_0 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_0 seq 30 permit 10.200.2.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_0_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_1 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_2 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_3 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LONG_0 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_0_0 seq 10 deny 10.180.0.1/32
!

ip prefix-list PL_IN_0_2 seq 10 permit 10.200.20.0/24
ip prefix-list PL_IN_0_2 seq 20 permit 10.200.18.0/24
ip prefix-list PL_IN_0_2 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_0_2 seq 10 permit 10.200.2.0/24
!






route-map RM_POLICY_IN_0_2 permit 10














 match ip address prefix-list PL_IN_0_2
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_0_2 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_0_2 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_0_0
 ! Block loopback 10.180.0.1/32


route-map RM_POLICY_OUT_0_2 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_0_2 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_0_2 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_2
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_0_2 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_3
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_0_2 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_0
 set community no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_0_2 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_0
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_0_2 deny 200














 match ip address prefix-list PL_OUT_0_2
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_0_2 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.2


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.2 peer-group RR



 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.10 peer-group IBGP



 !
 neighbor 10.181.0.1 peer-group EBGP
 neighbor 10.181.0.1 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.2 activate



  neighbor 10.180.0.5 activate
  neighbor 10.180.0.5 next-hop-self


  neighbor 10.180.0.6 activate
  neighbor 10.180.0.6 next-hop-self


  neighbor 10.180.0.7 activate
  neighbor 10.180.0.7 next-hop-self


  neighbor 10.180.0.8 activate
  neighbor 10.180.0.8 next-hop-self


  neighbor 10.180.0.9 activate
  neighbor 10.180.0.9 next-hop-self


  neighbor 10.180.0.10 activate
  neighbor 10.180.0.10 next-hop-self



  neighbor 10.181.0.1 activate
  neighbor 10.181.0.1 route-map RM_POLICY_IN_0_2 in





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

 exit-address-family
