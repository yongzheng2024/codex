
hostname 1_as65003_Sarasota
!
interface Loopback0
 ip address 10.180.0.2 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 0_as65003_Tampa (0)

 ip address 10.181.0.5 255.255.255.254

 ip ospf network point-to-point
