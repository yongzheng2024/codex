!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_88_0 seq 10 deny 10.180.0.89/32
!






route-map RM_POLICY_IN_88_3 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_88_3 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_88_0
 ! Block loopback 10.180.0.89/32


route-map RM_POLICY_OUT_88_3 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_88_0
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_88_3 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_88_1
 ! Block link 10.181.1.70/31


route-map RM_POLICY_OUT_88_3 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_88_2
 ! Block link 10.181.1.72/31


route-map RM_POLICY_OUT_88_3 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_88
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_88_3 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_88
 set metric 24
 set as-path prepend 65005
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_88_3 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.89
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.56 peer-group RR




 !
 neighbor 10.181.0.20 peer-group EBGP
 neighbor 10.181.0.20 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.56 activate




  neighbor 10.181.0.20 activate
  neighbor 10.181.0.20 route-map RM_POLICY_IN_88_3 in
  neighbor 10.181.0.20 route-map RM_POLICY_OUT_88_3 out





  network 10.200.87.0 mask 255.255.255.0

  network 10.200.88.0 mask 255.255.255.0

  network 10.200.89.0 mask 255.255.255.0

 exit-address-family
