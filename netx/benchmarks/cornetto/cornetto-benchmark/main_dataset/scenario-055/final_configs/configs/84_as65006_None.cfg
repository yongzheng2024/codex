 ip address 10.181.0.195 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.85.0 255.255.255.0 Loopback100
ip route 10.200.86.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.85
 passive-interface Loopback0
 network 10.180.0.85 0.0.0.0 area 0



network 10.181.0.80 0.0.0.1 area 0
network 10.181.0.194 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_84 seq 10 permit 10.200.85.0/24
ip prefix-list PL_EXPORT_ALLOWED_84 seq 20 permit 10.200.86.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_84_0 seq 10 deny 10.181.0.182/31
!

ip prefix-list PL_EXPORT_DENY_LINK_84_1 seq 10 deny 10.181.0.194/31
!

ip prefix-list PL_EXPORT_DENY_LINK_84_2 seq 10 deny 10.181.0.80/31
!

ip prefix-list PL_EXPORT_DENY_LONG_84 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_84_0 seq 10 deny 10.180.0.85/32
!




ip community-list standard CL_COMM_84_47 permit no-export
!





route-map RM_POLICY_IN_84_47 permit 5














 match community CL_COMM_84_47
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_84_47 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_84_47 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_84_0
 ! Block loopback 10.180.0.85/32


route-map RM_POLICY_OUT_84_47 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_84_0
 ! Block link 10.181.0.182/31


route-map RM_POLICY_OUT_84_47 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_84_1
 ! Block link 10.181.0.194/31


route-map RM_POLICY_OUT_84_47 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_84_2
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_84_47 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_84
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_84_47 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_84
 set community 65000:100 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_84_47 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.85
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.50 peer-group RR




 !
 neighbor 10.181.0.182 peer-group EBGP
 neighbor 10.181.0.182 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.50 activate




  neighbor 10.181.0.182 activate
  neighbor 10.181.0.182 route-map RM_POLICY_IN_84_47 in
  neighbor 10.181.0.182 route-map RM_POLICY_OUT_84_47 out





  network 10.200.85.0 mask 255.255.255.0

  network 10.200.86.0 mask 255.255.255.0

 exit-address-family
