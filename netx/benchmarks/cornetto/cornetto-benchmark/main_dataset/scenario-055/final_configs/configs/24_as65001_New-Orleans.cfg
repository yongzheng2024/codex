!






route-map RM_BGP_TO_OSPF_24 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_24 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_24
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_24 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_24
 set tag 65010

!


route-map RM_POLICY_OUT_24_95 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_24_0
 ! Block loopback 10.180.0.25/32


route-map RM_POLICY_OUT_24_95 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_0
 ! Block link 10.181.0.114/31


route-map RM_POLICY_OUT_24_95 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_1
 ! Block link 10.181.0.116/31


route-map RM_POLICY_OUT_24_95 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_2
 ! Block link 10.181.0.118/31


route-map RM_POLICY_OUT_24_95 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_24
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_24_95 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_24
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_24_95 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.25
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.26 peer-group RR




 !
 neighbor 10.181.0.119 peer-group EBGP
 neighbor 10.181.0.119 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.26 activate




  neighbor 10.181.0.119 activate
  neighbor 10.181.0.119 route-map RM_POLICY_OUT_24_95 out





  network 10.200.16.0 mask 255.255.255.0

  network 10.200.17.0 mask 255.255.255.0

  network 10.200.18.0 mask 255.255.255.0

  network 10.200.19.0 mask 255.255.255.0

