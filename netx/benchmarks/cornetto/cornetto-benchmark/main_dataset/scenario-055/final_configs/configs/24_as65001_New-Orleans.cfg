router ospf 1
 router-id 10.180.0.25
 passive-interface Loopback0
 network 10.180.0.25 0.0.0.0 area 0










 redistribute bgp 65001 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_24

network 10.181.0.114 0.0.0.1 area 0
network 10.181.0.116 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 10 permit 10.200.7.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 20 permit 10.200.8.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 30 permit 10.200.9.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 40 permit 10.200.10.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 50 permit 10.200.50.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 60 permit 10.200.51.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 70 permit 10.200.52.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 80 permit 10.200.87.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 90 permit 10.200.88.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 100 permit 10.200.89.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 110 permit 10.200.90.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 120 permit 10.200.91.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 130 permit 10.200.92.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 140 permit 10.200.101.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 150 permit 10.200.102.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_24 seq 160 permit 10.200.103.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_24 seq 10 permit 10.180.0.25/32
ip prefix-list PL_BGP_TO_OSPF_DENY_24 seq 20 permit 10.181.0.114/31
ip prefix-list PL_BGP_TO_OSPF_DENY_24 seq 30 permit 10.181.0.116/31
ip prefix-list PL_BGP_TO_OSPF_DENY_24 seq 40 permit 10.181.0.118/31
