route-map RM_POLICY_OUT_111_47 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_111
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_111_47 deny 65000














 ! Deny other outbound routes

