
hostname 92_as65001_Memphis
!
interface Loopback0
 ip address 10.180.0.93 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.100.0/24


 ip address 10.200.100.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.97.0/24


 ip address 10.200.97.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.98.0/24


 ip address 10.200.98.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.99.0/24


 ip address 10.200.99.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 25_as65001_Jackson (25)

 ip address 10.181.0.127 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 29_as65001_Little-Rock (29)

 ip address 10.181.0.133 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 91_as65004_Jackson (91)

 ip address 10.181.1.79 255.255.255.254
 mtu 1500
!


ip route 10.200.100.0 255.255.255.0 Loopback100
ip route 10.200.97.0 255.255.255.0 Loopback101
ip route 10.200.98.0 255.255.255.0 Loopback102
ip route 10.200.99.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.93
 passive-interface Loopback0
 network 10.180.0.93 0.0.0.0 area 0



network 10.181.0.126 0.0.0.1 area 0
network 10.181.0.132 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_92 seq 10 permit 10.200.100.0/24
ip prefix-list PL_EXPORT_ALLOWED_92 seq 20 permit 10.200.97.0/24
ip prefix-list PL_EXPORT_ALLOWED_92 seq 30 permit 10.200.98.0/24
ip prefix-list PL_EXPORT_ALLOWED_92 seq 40 permit 10.200.99.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_92_0 seq 10 deny 10.181.0.126/31
!

ip prefix-list PL_EXPORT_DENY_LINK_92_1 seq 10 deny 10.181.0.132/31
!

ip prefix-list PL_EXPORT_DENY_LINK_92_2 seq 10 deny 10.181.1.78/31
!

ip prefix-list PL_EXPORT_DENY_LONG_92 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_92_0 seq 10 deny 10.180.0.93/32
!




ip community-list standard CL_COMM_92_91 permit 65535:65282
ip community-list standard CL_COMM_92_91 permit no-export
!





route-map RM_POLICY_IN_92_91 permit 5














 match community CL_COMM_92_91
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_92_91 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_92_91 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_92_91 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_92_0
 ! Block loopback 10.180.0.93/32


route-map RM_POLICY_OUT_92_91 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_92_0
 ! Block link 10.181.0.126/31


route-map RM_POLICY_OUT_92_91 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_92_1
 ! Block link 10.181.0.132/31


route-map RM_POLICY_OUT_92_91 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_92_2
 ! Block link 10.181.1.78/31


route-map RM_POLICY_OUT_92_91 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_92
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_92_91 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_92
 set metric 6
 set as-path prepend 65001 65001 65001
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_92_91 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.93
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.26 peer-group RR




 !
 neighbor 10.181.1.78 peer-group EBGP
 neighbor 10.181.1.78 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.26 activate




  neighbor 10.181.1.78 activate
  neighbor 10.181.1.78 route-map RM_POLICY_IN_92_91 in
  neighbor 10.181.1.78 route-map RM_POLICY_OUT_92_91 out





  network 10.200.100.0 mask 255.255.255.0

  network 10.200.97.0 mask 255.255.255.0

  network 10.200.98.0 mask 255.255.255.0

  network 10.200.99.0 mask 255.255.255.0

 exit-address-family
