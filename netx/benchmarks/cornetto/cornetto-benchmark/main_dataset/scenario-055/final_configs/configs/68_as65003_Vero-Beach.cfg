router ospf 1
 router-id 10.180.0.69
 passive-interface Loopback0
 network 10.180.0.69 0.0.0.0 area 0



network 10.181.1.12 0.0.0.1 area 0
network 10.181.1.14 0.0.0.1 area 0
!








router bgp 65003
 bgp router-id 10.180.0.69
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.1 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.1 activate







 exit-address-family
