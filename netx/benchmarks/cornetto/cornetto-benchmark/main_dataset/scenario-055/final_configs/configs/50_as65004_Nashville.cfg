route-map RM_BGP_TO_OSPF_50 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_50 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_50
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_50 permit 20














