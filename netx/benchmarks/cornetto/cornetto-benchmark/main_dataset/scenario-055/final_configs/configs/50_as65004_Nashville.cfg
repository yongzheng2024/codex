!


route-map RM_POLICY_IN_50_57 permit 10














 match ip address prefix-list PL_IN_50_57
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_50_57 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_50_57 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_50_0
 ! Block loopback 10.180.0.51/32


route-map RM_POLICY_OUT_50_57 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_50_0
 ! Block link 10.181.0.198/31


