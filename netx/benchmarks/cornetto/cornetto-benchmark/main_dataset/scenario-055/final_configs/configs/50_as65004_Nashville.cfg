ip prefix-list PL_BGP_TO_OSPF_ALLOW_50 seq 70 permit 10.200.54.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_50 seq 80 permit 10.200.55.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_50 seq 90 permit 10.200.56.0/24
