ip community-list standard CL_COMM_45_43 permit 65535:65282
ip community-list standard CL_COMM_45_43 permit no-advertise
!





route-map RM_POLICY_IN_45_43 permit 5














 match community CL_COMM_45_43
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_45_43 permit 10














 match ip address prefix-list PL_IN_45_43
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_45_43 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_45_43 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_45_43 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_45_0
 ! Block loopback 10.180.0.46/32


route-map RM_POLICY_OUT_45_43 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_45_0
 ! Block link 10.181.0.172/31


route-map RM_POLICY_OUT_45_43 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_45_1
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_45_43 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_45
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_45_43 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_45
 set metric 5
 set as-path prepend 65007 65007
 set community 65000:200 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_45_43 deny 200














 match ip address prefix-list PL_OUT_45_43
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_45_43 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.46
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65007
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.5 peer-group RR




 !
 neighbor 10.181.0.172 peer-group EBGP
 neighbor 10.181.0.172 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.5 activate




  neighbor 10.181.0.172 activate
  neighbor 10.181.0.172 route-map RM_POLICY_IN_45_43 in
  neighbor 10.181.0.172 route-map RM_POLICY_OUT_45_43 out





  network 10.200.37.0 mask 255.255.255.0

  network 10.200.38.0 mask 255.255.255.0

  network 10.200.39.0 mask 255.255.255.0

  network 10.200.40.0 mask 255.255.255.0

 exit-address-family
