  neighbor 10.181.1.18 activate
  neighbor 10.181.1.18 route-map RM_POLICY_IN_73_72 in
  neighbor 10.181.1.18 route-map RM_POLICY_OUT_73_72 out





  network 10.200.72.0 mask 255.255.255.0

  network 10.200.73.0 mask 255.255.255.0

  network 10.200.74.0 mask 255.255.255.0

  network 10.200.75.0 mask 255.255.255.0

