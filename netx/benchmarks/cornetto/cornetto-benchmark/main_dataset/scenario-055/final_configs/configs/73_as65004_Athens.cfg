 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_73_72 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_73
 set community 65000:100 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_73_72 deny 200














 match ip address prefix-list PL_OUT_73_72
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_73_72 deny 65000














 ! Deny other outbound routes

