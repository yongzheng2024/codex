 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_73_72 permit 10














 match ip address prefix-list PL_IN_73_72
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_73_72 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_73_72 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_73_72 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_73_0
 ! Block loopback 10.180.0.74/32


