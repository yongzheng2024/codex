
hostname 89_as65005_Meridian
!
interface Loopback0
 ip address 10.180.0.90 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.90.0/24


 ip address 10.200.90.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.91.0/24


 ip address 10.200.91.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.92.0/24


 ip address 10.200.92.1 255.255.255.0
!



ip access-list extended ACL_89_GigabitEthernet0_0
 10 permit ip host 10.180.0.26 any
 20 permit ip host 10.181.0.120 any
 30 permit ip host 10.181.0.121 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 25_as65001_Jackson (25)

 ip address 10.181.0.121 255.255.255.254

 ip access-group ACL_89_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 96_as65005_Hattiesburg (96)

 ip address 10.181.1.74 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 90_as65005_Tuscaloosa (90)

 ip address 10.181.1.76 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.90.0 255.255.255.0 Loopback100
ip route 10.200.91.0 255.255.255.0 Loopback101
ip route 10.200.92.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.90
 passive-interface Loopback0
 network 10.180.0.90 0.0.0.0 area 0



network 10.181.1.74 0.0.0.1 area 0
network 10.181.1.76 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_89 seq 10 permit 10.200.90.0/24
ip prefix-list PL_EXPORT_ALLOWED_89 seq 20 permit 10.200.91.0/24
ip prefix-list PL_EXPORT_ALLOWED_89 seq 30 permit 10.200.92.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_89_0 seq 10 deny 10.181.0.120/31
!

ip prefix-list PL_EXPORT_DENY_LINK_89_1 seq 10 deny 10.181.1.74/31
!

ip prefix-list PL_EXPORT_DENY_LINK_89_2 seq 10 deny 10.181.1.76/31
!

ip prefix-list PL_EXPORT_DENY_LONG_89 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_89_0 seq 10 deny 10.180.0.90/32
!

ip prefix-list PL_IN_89_25 seq 10 permit 10.181.0.120/31
ip prefix-list PL_IN_89_25 seq 20 permit 10.181.0.114/31
ip prefix-list PL_IN_89_25 seq 30 permit 10.181.0.122/31
ip prefix-list PL_IN_89_25 seq 40 permit 10.181.0.126/31
ip prefix-list PL_IN_89_25 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_89_25 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_89_25 seq 10 permit 10.200.92.0/24
!






route-map RM_POLICY_IN_89_25 permit 10














 match ip address prefix-list PL_IN_89_25
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_89_25 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_89_25 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_89_0
 ! Block loopback 10.180.0.90/32


route-map RM_POLICY_OUT_89_25 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_89_0
 ! Block link 10.181.0.120/31


route-map RM_POLICY_OUT_89_25 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_89_1
 ! Block link 10.181.1.74/31


route-map RM_POLICY_OUT_89_25 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_89_2
 ! Block link 10.181.1.76/31


route-map RM_POLICY_OUT_89_25 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_89
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_89_25 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_89
 set metric 9
 set as-path prepend 65005 65005 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_89_25 deny 200














 match ip address prefix-list PL_OUT_89_25
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_89_25 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.90
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.55 peer-group RR


 !
 neighbor 10.180.0.56 peer-group RR




 !
 neighbor 10.181.0.120 peer-group EBGP
 neighbor 10.181.0.120 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.55 activate


  neighbor 10.180.0.56 activate




  neighbor 10.181.0.120 activate
  neighbor 10.181.0.120 route-map RM_POLICY_IN_89_25 in
  neighbor 10.181.0.120 route-map RM_POLICY_OUT_89_25 out





  network 10.200.90.0 mask 255.255.255.0

  network 10.200.91.0 mask 255.255.255.0

  network 10.200.92.0 mask 255.255.255.0

 exit-address-family
