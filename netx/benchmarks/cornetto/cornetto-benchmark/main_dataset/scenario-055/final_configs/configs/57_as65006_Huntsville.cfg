ip community-list standard CL_COMM_57_50 permit no-advertise
ip community-list standard CL_COMM_57_50 permit no-export
!





route-map RM_POLICY_IN_57_50 permit 5














 match community CL_COMM_57_50
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_57_50 permit 10














 match ip address prefix-list PL_IN_57_50
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_57_50 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_57_50 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_57_50 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_57_0
 ! Block loopback 10.180.0.58/32


route-map RM_POLICY_OUT_57_50 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_57_0
 ! Block link 10.181.0.190/31


route-map RM_POLICY_OUT_57_50 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_57_1
 ! Block link 10.181.0.198/31


route-map RM_POLICY_OUT_57_50 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_57_2
 ! Block link 10.181.0.224/31


route-map RM_POLICY_OUT_57_50 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_57
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_57_50 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_57
 set metric 9
 set as-path prepend 65006 65006
 set community no-advertise no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_57_50 deny 200














 match ip address prefix-list PL_OUT_57_50
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_57_50 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.58
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.50 peer-group RR




 !
 neighbor 10.181.0.198 peer-group EBGP
 neighbor 10.181.0.198 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.50 activate




  neighbor 10.181.0.198 activate
  neighbor 10.181.0.198 route-map RM_POLICY_IN_57_50 in
  neighbor 10.181.0.198 route-map RM_POLICY_OUT_57_50 out





  network 10.200.57.0 mask 255.255.255.0

  network 10.200.58.0 mask 255.255.255.0

  network 10.200.59.0 mask 255.255.255.0

 exit-address-family
