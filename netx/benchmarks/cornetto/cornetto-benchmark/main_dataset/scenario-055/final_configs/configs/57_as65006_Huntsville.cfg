ip prefix-list PL_IN_57_50 seq 10 permit 10.200.48.0/24
ip prefix-list PL_IN_57_50 seq 20 permit 10.181.0.200/31
ip prefix-list PL_IN_57_50 seq 30 permit 10.200.0.0/16 le 24
