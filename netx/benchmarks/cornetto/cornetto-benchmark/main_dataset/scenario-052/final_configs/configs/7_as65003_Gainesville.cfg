
hostname 7_as65003_Gainesville
!
interface Loopback0
 ip address 10.180.0.8 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.60.0/24


 ip address 10.200.60.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.61.0/24


 ip address 10.200.61.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.62.0/24


 ip address 10.200.62.1 255.255.255.0
!



ip access-list extended ACL_7_GigabitEthernet0_1
 10 permit ip host 10.180.0.9 any
 20 permit ip host 10.181.0.50 any
 30 permit ip host 10.181.0.51 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_7_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.8 any
 20 permit ip host 10.181.0.41 any
 30 permit ip host 10.181.0.50 any
 40 permit ip 10.181.0.40 0.0.0.1 any
 50 permit ip 10.181.0.50 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 4_as65003_Lake-City (4)

 ip address 10.181.0.41 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 8_as65002_Ocala (8)

 ip address 10.181.0.50 255.255.255.254

 ip access-group ACL_7_GigabitEthernet0_1 in

 ip access-group ACL_7_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.60.0 255.255.255.0 Loopback100
ip route 10.200.61.0 255.255.255.0 Loopback101
ip route 10.200.62.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.8
 passive-interface Loopback0
 network 10.180.0.8 0.0.0.0 area 0



network 10.181.0.40 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_7 seq 10 permit 10.200.60.0/24
ip prefix-list PL_EXPORT_ALLOWED_7 seq 20 permit 10.200.61.0/24
ip prefix-list PL_EXPORT_ALLOWED_7 seq 30 permit 10.200.62.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_7_0 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LINK_7_1 seq 10 deny 10.181.0.50/31
!

ip prefix-list PL_EXPORT_DENY_LONG_7 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_7_0 seq 10 deny 10.180.0.8/32
!




ip community-list standard CL_COMM_7_8 permit no-advertise
!





route-map RM_POLICY_IN_7_8 permit 5














 match community CL_COMM_7_8
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_7_8 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_7_8 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_7_0
 ! Block loopback 10.180.0.8/32


route-map RM_POLICY_OUT_7_8 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_0
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_7_8 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_1
 ! Block link 10.181.0.50/31


route-map RM_POLICY_OUT_7_8 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_7
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_7_8 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_7
 set community 65000:100 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_7_8 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.8
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.48 peer-group RR




 !
 neighbor 10.181.0.51 peer-group EBGP
 neighbor 10.181.0.51 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.48 activate




  neighbor 10.181.0.51 activate
  neighbor 10.181.0.51 route-map RM_POLICY_IN_7_8 in
  neighbor 10.181.0.51 route-map RM_POLICY_OUT_7_8 out





  network 10.200.60.0 mask 255.255.255.0

  network 10.200.61.0 mask 255.255.255.0

  network 10.200.62.0 mask 255.255.255.0

 exit-address-family
