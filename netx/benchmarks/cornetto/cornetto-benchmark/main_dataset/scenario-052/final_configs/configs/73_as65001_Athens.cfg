ip community-list standard CL_COMM_73_47 permit 65535:65282
!





route-map RM_POLICY_IN_73_47 permit 5














 match community CL_COMM_73_47
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_73_47 permit 10














 match ip address prefix-list PL_IN_73_47
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_73_47 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_73_47 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_73_47 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_73_0
 ! Block loopback 10.180.0.74/32


route-map RM_POLICY_OUT_73_47 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_73_0
 ! Block link 10.181.0.178/31


route-map RM_POLICY_OUT_73_47 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_73_1
 ! Block link 10.181.1.18/31


route-map RM_POLICY_OUT_73_47 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_73_2
 ! Block link 10.181.1.32/31


route-map RM_POLICY_OUT_73_47 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_73
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_73_47 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_73
 set metric 26
 set as-path prepend 65001
 set community 65000:200 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_73_47 deny 200














 match ip address prefix-list PL_OUT_73_47
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_73_47 deny 65000














 ! Deny other outbound routes

