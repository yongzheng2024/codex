 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.73 peer-group RR




 !
 neighbor 10.181.0.178 peer-group EBGP
 neighbor 10.181.0.178 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.73 activate




  neighbor 10.181.0.178 activate
  neighbor 10.181.0.178 route-map RM_POLICY_IN_73_47 in
  neighbor 10.181.0.178 route-map RM_POLICY_OUT_73_47 out





  network 10.200.63.0 mask 255.255.255.0

  network 10.200.64.0 mask 255.255.255.0

 exit-address-family
