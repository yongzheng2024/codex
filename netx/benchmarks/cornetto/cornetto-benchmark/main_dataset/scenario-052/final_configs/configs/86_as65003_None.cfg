  neighbor 10.180.0.48 activate




  neighbor 10.181.0.56 activate
  neighbor 10.181.0.56 route-map RM_POLICY_IN_86_8 in
  neighbor 10.181.0.56 route-map RM_POLICY_OUT_86_8 out





  network 10.200.80.0 mask 255.255.255.0

  network 10.200.81.0 mask 255.255.255.0

  network 10.200.82.0 mask 255.255.255.0

  network 10.200.83.0 mask 255.255.255.0

