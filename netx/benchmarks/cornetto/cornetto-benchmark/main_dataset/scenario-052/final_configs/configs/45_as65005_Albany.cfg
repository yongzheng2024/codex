
hostname 45_as65005_Albany
!
interface Loopback0
 ip address 10.180.0.46 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.34.0/24


 ip address 10.200.34.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.35.0/24


 ip address 10.200.35.1 255.255.255.0
!



ip access-list extended ACL_45_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.46 any
 20 permit ip host 10.181.0.27 any
 30 permit ip host 10.181.0.173 any
 40 permit ip 10.181.0.26 0.0.0.1 any
 50 permit ip 10.181.0.172 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 3_as65003_Tallahassee (3)

 ip address 10.181.0.27 255.255.255.254

 ip access-group ACL_45_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 43_as65005_Lagrange (43)

 ip address 10.181.0.173 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.34.0 255.255.255.0 Loopback100
ip route 10.200.35.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.46
 passive-interface Loopback0
 network 10.180.0.46 0.0.0.0 area 0



network 10.181.0.172 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_45 seq 10 permit 10.200.34.0/24
ip prefix-list PL_EXPORT_ALLOWED_45 seq 20 permit 10.200.35.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_45_0 seq 10 deny 10.181.0.172/31
!

ip prefix-list PL_EXPORT_DENY_LINK_45_1 seq 10 deny 10.181.0.26/31
!

ip prefix-list PL_EXPORT_DENY_LONG_45 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_45_0 seq 10 deny 10.180.0.46/32
!

ip prefix-list PL_IN_45_3 seq 10 permit 10.200.24.0/24
ip prefix-list PL_IN_45_3 seq 20 permit 10.181.0.26/31
ip prefix-list PL_IN_45_3 seq 30 permit 10.181.0.22/31
ip prefix-list PL_IN_45_3 seq 40 permit 10.181.0.20/31
ip prefix-list PL_IN_45_3 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_45_3 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_45_3 seq 10 permit 10.200.35.0/24
ip prefix-list PL_OUT_45_3 seq 20 permit 10.200.34.0/24
!






route-map RM_POLICY_IN_45_3 permit 10














 match ip address prefix-list PL_IN_45_3
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_45_3 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_45_3 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_45_0
 ! Block loopback 10.180.0.46/32


route-map RM_POLICY_OUT_45_3 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_45_0
 ! Block link 10.181.0.172/31


route-map RM_POLICY_OUT_45_3 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_45_1
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_45_3 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_45
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_45_3 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_45
 set community no-advertise no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_45_3 deny 200














 match ip address prefix-list PL_OUT_45_3
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_45_3 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.46
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.41 peer-group IBGP


 !
 neighbor 10.180.0.42 peer-group IBGP


 !
 neighbor 10.180.0.43 peer-group IBGP


 !
 neighbor 10.180.0.44 peer-group IBGP


 !
 neighbor 10.180.0.49 peer-group IBGP


 !
 neighbor 10.180.0.50 peer-group IBGP


 !
 neighbor 10.180.0.57 peer-group IBGP


 !
 neighbor 10.180.0.58 peer-group IBGP


 !
 neighbor 10.180.0.85 peer-group IBGP



 !
 neighbor 10.181.0.26 peer-group EBGP
 neighbor 10.181.0.26 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.41 activate


  neighbor 10.180.0.42 activate


  neighbor 10.180.0.43 activate


  neighbor 10.180.0.44 activate


  neighbor 10.180.0.49 activate


  neighbor 10.180.0.50 activate


  neighbor 10.180.0.57 activate


  neighbor 10.180.0.58 activate


