
hostname 89_as65004_Meridian
!
interface Loopback0
 ip address 10.180.0.90 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.86.0/24


 ip address 10.200.86.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.87.0/24


 ip address 10.200.87.1 255.255.255.0
!



ip access-list extended ACL_89_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.90 any
 20 permit ip host 10.181.0.121 any
 30 permit ip host 10.181.1.74 any
 40 permit ip host 10.181.1.76 any
 50 permit ip 10.181.0.120 0.0.0.1 any
 60 permit ip 10.181.1.76 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 25_as65006_Jackson (25)

 ip address 10.181.0.121 255.255.255.254

 ip access-group ACL_89_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 96_as65004_Hattiesburg (96)

 ip address 10.181.1.74 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 90_as65004_Tuscaloosa (90)

 ip address 10.181.1.76 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.86.0 255.255.255.0 Loopback100
ip route 10.200.87.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.90
 passive-interface Loopback0
 network 10.180.0.90 0.0.0.0 area 0



network 10.181.1.74 0.0.0.1 area 0
network 10.181.1.76 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_89 seq 10 permit 10.200.86.0/24
ip prefix-list PL_EXPORT_ALLOWED_89 seq 20 permit 10.200.87.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_89_0 seq 10 deny 10.181.0.120/31
!

ip prefix-list PL_EXPORT_DENY_LINK_89_1 seq 10 deny 10.181.1.74/31
!

ip prefix-list PL_EXPORT_DENY_LINK_89_2 seq 10 deny 10.181.1.76/31
!

ip prefix-list PL_EXPORT_DENY_LONG_89 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_89_0 seq 10 deny 10.180.0.90/32
!






route-map RM_POLICY_IN_89_25 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_89_25 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_89_0
 ! Block loopback 10.180.0.90/32


route-map RM_POLICY_OUT_89_25 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_89_0
 ! Block link 10.181.0.120/31


route-map RM_POLICY_OUT_89_25 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_89_1
 ! Block link 10.181.1.74/31


route-map RM_POLICY_OUT_89_25 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_89_2
 ! Block link 10.181.1.76/31


route-map RM_POLICY_OUT_89_25 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_89
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_89_25 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_89
 set metric 21
 set as-path prepend 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_89_25 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.90
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.55 peer-group RR




 !
 neighbor 10.181.0.120 peer-group EBGP
 neighbor 10.181.0.120 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.55 activate




  neighbor 10.181.0.120 activate
  neighbor 10.181.0.120 route-map RM_POLICY_IN_89_25 in
  neighbor 10.181.0.120 route-map RM_POLICY_OUT_89_25 out





  network 10.200.86.0 mask 255.255.255.0

  network 10.200.87.0 mask 255.255.255.0

 exit-address-family
