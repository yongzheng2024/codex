
hostname 91_as65006_Jackson
!
interface Loopback0
 ip address 10.180.0.92 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.88.0/24


 ip address 10.200.88.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.89.0/24


 ip address 10.200.89.1 255.255.255.0
!



ip access-list extended ACL_91_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.92 any
 20 permit ip host 10.181.0.201 any
 30 permit ip host 10.181.1.78 any
 40 permit ip 10.181.0.200 0.0.0.1 any
 50 permit ip 10.181.1.78 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
