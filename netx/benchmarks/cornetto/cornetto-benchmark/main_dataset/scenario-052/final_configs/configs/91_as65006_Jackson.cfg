!
interface GigabitEthernet0/1
 description to 92_as65006_Memphis (92)

 ip address 10.181.1.78 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.88.0 255.255.255.0 Loopback100
ip route 10.200.89.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.92
 passive-interface Loopback0
 network 10.180.0.92 0.0.0.0 area 0



network 10.181.1.78 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_91 seq 10 permit 10.200.88.0/24
ip prefix-list PL_EXPORT_ALLOWED_91 seq 20 permit 10.200.89.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_91_0 seq 10 deny 10.181.0.200/31
!

