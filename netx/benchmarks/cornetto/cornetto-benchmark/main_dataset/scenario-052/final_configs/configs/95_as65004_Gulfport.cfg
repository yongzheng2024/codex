
hostname 95_as65004_Gulfport
!
interface Loopback0
 ip address 10.180.0.96 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.90.0/24


 ip address 10.200.90.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.91.0/24


 ip address 10.200.91.1 255.255.255.0
!



ip access-list extended ACL_95_GigabitEthernet0_0
 10 permit ip host 10.180.0.25 any
 20 permit ip host 10.181.0.118 any
 30 permit ip host 10.181.0.119 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_95_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.96 any
 20 permit ip host 10.181.0.119 any
 30 permit ip host 10.181.1.83 any
 40 permit ip host 10.181.1.84 any
 50 permit ip 10.181.0.118 0.0.0.1 any
 60 permit ip 10.181.1.82 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 24_as65006_New-Orleans (24)

 ip address 10.181.0.119 255.255.255.254

 ip access-group ACL_95_GigabitEthernet0_0 in

 ip access-group ACL_95_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 94_as65004_Mobile (94)

 ip address 10.181.1.83 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 96_as65004_Hattiesburg (96)

 ip address 10.181.1.84 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.90.0 255.255.255.0 Loopback100
ip route 10.200.91.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.96
 passive-interface Loopback0
 network 10.180.0.96 0.0.0.0 area 0



network 10.181.1.82 0.0.0.1 area 0
network 10.181.1.84 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_95 seq 10 permit 10.200.90.0/24
ip prefix-list PL_EXPORT_ALLOWED_95 seq 20 permit 10.200.91.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_95_0 seq 10 deny 10.181.0.118/31
!

ip prefix-list PL_EXPORT_DENY_LINK_95_1 seq 10 deny 10.181.1.82/31
!

ip prefix-list PL_EXPORT_DENY_LINK_95_2 seq 10 deny 10.181.1.84/31
!

ip prefix-list PL_EXPORT_DENY_LONG_95 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_95_0 seq 10 deny 10.180.0.96/32
!




ip community-list standard CL_COMM_95_24 permit 65535:65282
ip community-list standard CL_COMM_95_24 permit no-advertise
!





route-map RM_POLICY_IN_95_24 permit 5














 match community CL_COMM_95_24
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_95_24 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_95_24 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_95_24 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_95_0
 ! Block loopback 10.180.0.96/32


route-map RM_POLICY_OUT_95_24 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_95_0
 ! Block link 10.181.0.118/31


route-map RM_POLICY_OUT_95_24 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_95_1
 ! Block link 10.181.1.82/31


route-map RM_POLICY_OUT_95_24 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_95_2
 ! Block link 10.181.1.84/31


route-map RM_POLICY_OUT_95_24 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_95
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_95_24 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_95
 set metric 20
 set as-path prepend 65004 65004 65004
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_95_24 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.96
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.55 peer-group RR




 !
 neighbor 10.181.0.118 peer-group EBGP
 neighbor 10.181.0.118 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.55 activate




  neighbor 10.181.0.118 activate
  neighbor 10.181.0.118 route-map RM_POLICY_IN_95_24 in
  neighbor 10.181.0.118 route-map RM_POLICY_OUT_95_24 out





  network 10.200.90.0 mask 255.255.255.0

  network 10.200.91.0 mask 255.255.255.0

 exit-address-family
