 address-family ipv4

  neighbor 10.180.0.33 activate




  neighbor 10.181.0.73 activate
  neighbor 10.181.0.73 route-map RM_POLICY_IN_15_34 in
  neighbor 10.181.0.73 route-map RM_POLICY_OUT_15_34 out





  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

