ip community-list standard CL_COMM_15_34 permit 65535:65282
ip community-list standard CL_COMM_15_34 permit no-advertise
!





route-map RM_BGP_TO_OSPF_15 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_15 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_15
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_15 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_15
 set tag 65010

!


route-map RM_POLICY_IN_15_34 permit 5














 match community CL_COMM_15_34
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_15_34 permit 10














 match ip address prefix-list PL_IN_15_34
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_15_34 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_15_34 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_15_34 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_15_0
 ! Block loopback 10.180.0.16/32


route-map RM_POLICY_OUT_15_34 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_0
 ! Block link 10.181.0.64/31


route-map RM_POLICY_OUT_15_34 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_1
 ! Block link 10.181.0.66/31


route-map RM_POLICY_OUT_15_34 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_2
 ! Block link 10.181.0.68/31


route-map RM_POLICY_OUT_15_34 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_3
 ! Block link 10.181.0.70/31


route-map RM_POLICY_OUT_15_34 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_15
 set metric 13
 set as-path prepend 65004 65004 65004
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_15_34 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_4
 ! Block link 10.181.0.72/31


route-map RM_POLICY_OUT_15_34 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_15
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_15_34 deny 200














 match ip address prefix-list PL_OUT_15_34
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_15_34 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.16
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.33 peer-group RR




 !
 neighbor 10.181.0.73 peer-group EBGP
 neighbor 10.181.0.73 remote-as 65001


