!

ip prefix-list PL_EXPORT_DENY_LINK_15_1 seq 10 deny 10.181.0.66/31
!

ip prefix-list PL_EXPORT_DENY_LINK_15_2 seq 10 deny 10.181.0.68/31
!

ip prefix-list PL_EXPORT_DENY_LINK_15_3 seq 10 deny 10.181.0.70/31
!

