ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 10 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 20 permit 10.200.30.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 30 permit 10.200.31.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 40 permit 10.200.42.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 50 permit 10.200.43.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 60 permit 10.200.44.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 70 permit 10.200.45.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_15 seq 80 permit 10.200.46.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 10 permit 10.180.0.16/32
ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 20 permit 10.181.0.64/31
ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 30 permit 10.181.0.66/31
ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 40 permit 10.181.0.68/31
ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 50 permit 10.181.0.70/31
ip prefix-list PL_BGP_TO_OSPF_DENY_15 seq 60 permit 10.181.0.72/31
