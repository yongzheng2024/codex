ip route 10.200.7.0 255.255.255.0 Loopback100
ip route 10.200.8.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.16
 passive-interface Loopback0
 network 10.180.0.16 0.0.0.0 area 0










 redistribute bgp 65004 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_15

network 10.181.0.64 0.0.0.1 area 0
network 10.181.0.66 0.0.0.1 area 0
network 10.181.0.68 0.0.0.1 area 0
network 10.181.0.70 0.0.0.1 area 0
