  neighbor 10.181.0.35 activate
  neighbor 10.181.0.35 route-map RM_POLICY_IN_8_17 in
  neighbor 10.181.0.35 route-map RM_POLICY_OUT_8_17 out





  network 10.200.44.0 mask 255.255.255.0

  network 10.200.45.0 mask 255.255.255.0

  network 10.200.46.0 mask 255.255.255.0

  network 10.200.47.0 mask 255.255.255.0

