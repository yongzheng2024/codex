
hostname 22_as65001_22
!
interface Loopback0
 ip address 10.180.0.23 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.23.0/24


 ip address 10.200.23.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 21_as65003_21 (21)

 ip address 10.181.0.69 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 23_as65001_23 (23)

 ip address 10.181.0.72 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.22.0 255.255.255.0 Loopback100
ip route 10.200.23.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.23
 passive-interface Loopback0
 network 10.180.0.23 0.0.0.0 area 0



network 10.181.0.72 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_22 seq 10 permit 10.200.22.0/24
ip prefix-list PL_EXPORT_ALLOWED_22 seq 20 permit 10.200.23.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_22_0 seq 10 deny 10.181.0.68/31
!

ip prefix-list PL_EXPORT_DENY_LINK_22_1 seq 10 deny 10.181.0.72/31
!

ip prefix-list PL_EXPORT_DENY_LONG_22 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_22_0 seq 10 deny 10.180.0.23/32
!






route-map RM_POLICY_IN_22_21 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_22_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_22_0
 ! Block loopback 10.180.0.23/32


route-map RM_POLICY_OUT_22_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_0
 ! Block link 10.181.0.68/31


route-map RM_POLICY_OUT_22_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_1
 ! Block link 10.181.0.72/31


route-map RM_POLICY_OUT_22_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_22
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_22_21 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_22
 set metric 22
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_22_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.23
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.17 peer-group RR


 !
 neighbor 10.180.0.24 peer-group RR




 !
 neighbor 10.181.0.68 peer-group EBGP
 neighbor 10.181.0.68 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.17 activate


  neighbor 10.180.0.24 activate




  neighbor 10.181.0.68 activate
  neighbor 10.181.0.68 route-map RM_POLICY_IN_22_21 in
  neighbor 10.181.0.68 route-map RM_POLICY_OUT_22_21 out





  network 10.200.22.0 mask 255.255.255.0

  network 10.200.23.0 mask 255.255.255.0

 exit-address-family
