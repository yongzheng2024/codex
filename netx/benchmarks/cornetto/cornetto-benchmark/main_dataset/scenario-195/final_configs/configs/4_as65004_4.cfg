
hostname 4_as65004_4
!
interface Loopback0
 ip address 10.180.0.5 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.31.0/24


 ip address 10.200.31.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.32.0/24


 ip address 10.200.32.1 255.255.255.0
!



ip access-list extended ACL_4_GigabitEthernet0_2
 10 permit ip host 10.180.0.22 any
 20 permit ip host 10.181.0.18 any
 30 permit ip host 10.181.0.19 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 1_as65004_1 (1)

 ip address 10.181.0.5 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 5_as65004_5 (5)

 ip address 10.181.0.16 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 21_as65003_21 (21)

 ip address 10.181.0.18 255.255.255.254

 ip access-group ACL_4_GigabitEthernet0_2 in
 mtu 1500
!


ip route 10.200.31.0 255.255.255.0 Loopback100
ip route 10.200.32.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.5
 passive-interface Loopback0
 network 10.180.0.5 0.0.0.0 area 0



network 10.181.0.4 0.0.0.1 area 0
network 10.181.0.16 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_4 seq 10 permit 10.200.31.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 20 permit 10.200.32.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_4_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_4_1 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_4_2 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_4 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_4_0 seq 10 deny 10.180.0.5/32
!






route-map RM_POLICY_OUT_4_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_4_0
 ! Block loopback 10.180.0.5/32


route-map RM_POLICY_OUT_4_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_4_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_1
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_4_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_2
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_4_21 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_4
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_4_21 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_4
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_4_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.5
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.5


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.6 peer-group RR



 !
 neighbor 10.180.0.7 peer-group IBGP



 !
 neighbor 10.181.0.19 peer-group EBGP
 neighbor 10.181.0.19 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.6 activate



  neighbor 10.180.0.7 activate
  neighbor 10.180.0.7 next-hop-self



  neighbor 10.181.0.19 activate
  neighbor 10.181.0.19 route-map RM_POLICY_OUT_4_21 out





  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

 exit-address-family
