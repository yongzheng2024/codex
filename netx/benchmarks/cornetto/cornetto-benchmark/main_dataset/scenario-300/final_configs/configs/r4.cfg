
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname r4
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 192.18.4.101 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 ip address 192.18.4.1 255.255.255.252
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 ip address 192.18.4.5 255.255.255.252
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 192.18.7.2 255.255.255.252
 negotiation auto
!
interface GigabitEthernet3/0
 ip address 192.18.8.2 255.255.255.252
 negotiation auto
!
!
!
router bgp 400
 bgp router-id 192.18.4.101
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 neighbor as200 peer-group
 neighbor as200 remote-as 200
 neighbor as300 peer-group
 neighbor as300 remote-as 300
 neighbor as700 peer-group
 neighbor as700 remote-as 700
 neighbor as800 peer-group
 neighbor as800 remote-as 800
 neighbor 192.18.4.2 peer-group as200
 neighbor 192.18.4.6 peer-group as300
 neighbor 192.18.7.1 peer-group as700
 neighbor 192.18.8.1 peer-group as800
 !
 address-family ipv4
  bgp dampening
  bgp additional-paths select all
  bgp additional-paths send receive
  !neighbor as400 next-hop-self
  neighbor as200 send-community both
  neighbor as300 send-community both
  neighbor as700 send-community both
  neighbor as700 route-map R4_OUT_TO_C1 out
  neighbor as700 route-map R4_IN_FROM_C1 in
  neighbor as800 send-community both
  neighbor 192.18.4.2 activate
  neighbor 192.18.4.6 activate
  neighbor 192.18.7.1 activate
  neighbor 192.18.8.1 activate
  maximum-paths ibgp 4
  maximum-paths eibgp 4
 exit-address-family
!
ip forward-protocol nd
!
!
!
no ip http server
no ip http secure-server
!
!
!
ip community-list standard comm1 permit 100:200
ip community-list standard comm2 permit 100:300
!
!
!
ip prefix-list default_ips seq 5 permit 0.0.0.0/0 le 32
!
ip prefix-list private_ips seq  5 permit 10.0.0.0/8     ge 8
ip prefix-list private_ips seq 10 permit 172.16.0.0/12  ge 12
ip prefix-list private_ips seq 15 permit 192.168.0.0/16 ge 16
!
!
!
route-map R4_OUT_TO_C1 deny 10
  match community comm1
!
route-map R4_OUT_TO_C1 permit 100
!
!
!
route-map R4_IN_FROM_C1 deny 10
  match ip address prefix-list private_ips
!
route-map R4_IN_FROM_C1 permit 100
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
