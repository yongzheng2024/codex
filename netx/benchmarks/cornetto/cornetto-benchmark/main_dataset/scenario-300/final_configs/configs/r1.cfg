
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname r1
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 192.18.1.101 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 ip address 192.18.1.1 255.255.255.252
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 ip address 192.18.1.5 255.255.255.252
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 192.18.5.2 255.255.255.252
 negotiation auto
!
interface GigabitEthernet3/0
 ip address 192.18.6.2 255.255.255.252
 negotiation auto
!
!
!
router bgp 100
 bgp router-id 192.18.1.101
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 neighbor as200 peer-group
 neighbor as200 remote-as 200
 neighbor as300 peer-group
 neighbor as300 remote-as 300
 neighbor as500 peer-group
 neighbor as500 remote-as 500
 neighbor as600 peer-group
 neighbor as600 remote-as 600
 neighbor 192.18.1.2 peer-group as200
 neighbor 192.18.1.6 peer-group as300
 neighbor 192.18.5.1 peer-group as500
 neighbor 192.18.6.1 peer-group as600
 !
 address-family ipv4
  bgp dampening
  bgp additional-paths select all
  bgp additional-paths send receive
  !neighbor as100 next-hop-self
  neighbor as200 send-community both
  neighbor as200 route-map R1_OUT_TO_R2 out
  neighbor as300 send-community both
  neighbor as300 route-map R1_OUT_TO_R3 out
  neighbor as500 send-community both
  neighbor as600 send-community both
  neighbor 192.18.1.2 activate
  neighbor 192.18.1.6 activate
  neighbor 192.18.5.1 activate
  neighbor 192.18.6.1 activate
  maximum-paths ibgp 4
  maximum-paths eibgp 4
 exit-address-family
!
ip forward-protocol nd
!
!
!
no ip http server
no ip http secure-server
!
!
!
ip prefix-list isp1_ips seq  5 permit 192.0.2.0/24    ge 24
ip prefix-list isp1_ips seq 10 permit 198.51.100.0/24 ge 24
!
ip prefix-list isp2_ips seq 5 permit 203.0.113.0/24 ge 24
!
ip prefix-list default_ips seq 5 permit 0.0.0.0/0 le 32
!
!
!
route-map R1_OUT_TO_R2 permit 10
 match ip address prefix-list default_ips
 set community 100:200    ! comm1
!
route-map R1_OUT_TO_R2 deny 100
!
!
!
route-map R1_OUT_TO_R3 permit 10
 match ip address prefix-list default_ips
 set community 100:300    ! comm2
!
route-map R1_OUT_TO_R3 deny 100
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
