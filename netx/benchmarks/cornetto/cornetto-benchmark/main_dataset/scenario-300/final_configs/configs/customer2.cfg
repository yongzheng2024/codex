
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname customer2
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 192.18.8.101 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 ip address 192.18.8.1 255.255.255.252
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
!interface GigabitEthernet2/0
! ip address 192.168.128.1 255.255.255.0
! negotiation auto
!
!interface GigabitEthernet3/0
! ip address 192.168.129.1 255.255.255.0
! negotiation auto
!
!
!
router bgp 800
 bgp router-id 192.18.8.101
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 neighbor as400 peer-group
 neighbor as400 remote-as 400
 neighbor 192.18.8.2 peer-group as400
 !
 address-family ipv4
  bgp dampening
  bgp additional-paths select all
  bgp additional-paths send receive
  !neighbor as800 next-hop-self
  neighbor as400 send-community both
  neighbor 192.18.8.2 activate
  maximum-paths ibgp 4
  maximum-paths eibgp 4
 exit-address-family
!
ip forward-protocol nd
!
!
!
no ip http server
no ip http secure-server
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
