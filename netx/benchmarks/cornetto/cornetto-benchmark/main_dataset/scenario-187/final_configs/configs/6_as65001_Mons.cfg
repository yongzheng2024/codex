
hostname 6_as65001_Mons
!
interface Loopback0
 ip address 10.180.0.7 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.23.0/24


 ip address 10.200.23.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.24.0/24


 ip address 10.200.24.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.25.0/24


 ip address 10.200.25.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.26.0/24


 ip address 10.200.26.1 255.255.255.0
!



ip access-list extended ACL_6_GigabitEthernet0_1
 10 permit ip host 10.180.0.18 any
 20 permit ip host 10.181.0.18 any
 30 permit ip host 10.181.0.19 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_6_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.7 any
 20 permit ip host 10.181.0.5 any
 30 permit ip host 10.181.0.18 any
 40 permit ip 10.181.0.4 0.0.0.1 any
 50 permit ip 10.181.0.18 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 1_as65001_Charleroi (1)

 ip address 10.181.0.5 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 17_as65002_Vilvoorde (17)

 ip address 10.181.0.18 255.255.255.254

 ip access-group ACL_6_GigabitEthernet0_1 in

 ip access-group ACL_6_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.23.0 255.255.255.0 Loopback100
ip route 10.200.24.0 255.255.255.0 Loopback101
ip route 10.200.25.0 255.255.255.0 Loopback102
ip route 10.200.26.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.7
 passive-interface Loopback0
 network 10.180.0.7 0.0.0.0 area 0



network 10.181.0.4 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_6 seq 10 permit 10.200.23.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 20 permit 10.200.24.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 30 permit 10.200.25.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 40 permit 10.200.26.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_6_0 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_6_1 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_6 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_6_0 seq 10 deny 10.180.0.7/32
!

ip prefix-list PL_IN_6_17 seq 10 permit 10.200.14.0/24
ip prefix-list PL_IN_6_17 seq 20 permit 10.200.11.0/24
ip prefix-list PL_IN_6_17 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_6_17 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_6_17 seq 10 permit 10.200.25.0/24
!






route-map RM_POLICY_IN_6_17 permit 10














 match ip address prefix-list PL_IN_6_17
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_6_17 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_6_17 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_6_0
 ! Block loopback 10.180.0.7/32


route-map RM_POLICY_OUT_6_17 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_0
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_6_17 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_1
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_6_17 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_6
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_6_17 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_6
 set metric 13
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_6_17 deny 200














 match ip address prefix-list PL_OUT_6_17
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_6_17 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.7
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.4 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP



 !
 neighbor 10.181.0.19 peer-group EBGP
 neighbor 10.181.0.19 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.3 activate


  neighbor 10.180.0.4 activate


  neighbor 10.180.0.12 activate



  neighbor 10.181.0.19 activate
  neighbor 10.181.0.19 route-map RM_POLICY_IN_6_17 in
  neighbor 10.181.0.19 route-map RM_POLICY_OUT_6_17 out





  network 10.200.23.0 mask 255.255.255.0

  network 10.200.24.0 mask 255.255.255.0

  network 10.200.25.0 mask 255.255.255.0

  network 10.200.26.0 mask 255.255.255.0

 exit-address-family
