 router-id 10.180.0.12
 passive-interface Loopback0
 network 10.180.0.12 0.0.0.0 area 0



network 10.181.0.6 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_11 seq 10 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_11 seq 20 permit 10.200.3.0/24
ip prefix-list PL_EXPORT_ALLOWED_11 seq 30 permit 10.200.4.0/24
