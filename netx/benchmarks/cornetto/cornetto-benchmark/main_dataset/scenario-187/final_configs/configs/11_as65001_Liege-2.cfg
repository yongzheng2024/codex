  neighbor 10.181.0.34 route-map RM_POLICY_OUT_11_10 out





  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

  network 10.200.4.0 mask 255.255.255.0

 exit-address-family
