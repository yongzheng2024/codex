 10 permit ip host 10.180.0.12 any
 20 permit ip host 10.181.0.7 any
 30 permit ip host 10.181.0.33 any
 40 permit ip host 10.181.0.35 any
 50 permit ip 10.181.0.32 0.0.0.1 any
 60 permit ip 10.181.0.6 0.0.0.1 any
