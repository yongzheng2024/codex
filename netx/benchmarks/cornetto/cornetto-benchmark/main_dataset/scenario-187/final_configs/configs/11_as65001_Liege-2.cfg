!

ip prefix-list PL_EXPORT_DENY_LINK_11_1 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_11_2 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LONG_11 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_11_0 seq 10 deny 10.180.0.12/32
!




ip community-list standard CL_COMM_11_10 permit 65535:65282
ip community-list standard CL_COMM_11_10 permit no-advertise
!





route-map RM_POLICY_IN_11_10 permit 5














 match community CL_COMM_11_10
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_11_10 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_11_10 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_11_10 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_11_0
 ! Block loopback 10.180.0.12/32


route-map RM_POLICY_OUT_11_10 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_0
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_11_10 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_1
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_11_10 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_2
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_11_10 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_11
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_11_10 deny 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_11
 set metric 30
 set as-path prepend 65001
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_11_10 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.12
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
