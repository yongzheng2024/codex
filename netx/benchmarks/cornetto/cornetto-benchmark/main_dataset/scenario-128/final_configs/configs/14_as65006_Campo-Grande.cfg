
hostname 14_as65006_Campo-Grande
!
interface Loopback0
 ip address 10.180.0.15 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!



ip access-list extended ACL_14_GigabitEthernet0_0
 10 permit ip host 10.180.0.13 any
 20 permit ip host 10.181.0.60 any
 30 permit ip host 10.181.0.61 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_14_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.15 any
 20 permit ip host 10.181.0.61 any
 30 permit ip host 10.181.0.66 any
 40 permit ip 10.181.0.60 0.0.0.1 any
 50 permit ip 10.181.0.66 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 12_as65002_9 (12)

 ip address 10.181.0.61 255.255.255.254

 ip access-group ACL_14_GigabitEthernet0_0 in

 ip access-group ACL_14_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 16_as65006_Rondonopolis (16)

 ip address 10.181.0.66 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.7.0 255.255.255.0 Loopback100
ip route 10.200.8.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.15
 passive-interface Loopback0
 network 10.180.0.15 0.0.0.0 area 0



network 10.181.0.66 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_14 seq 10 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_14 seq 20 permit 10.200.8.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_14_0 seq 10 deny 10.181.0.60/31
!

ip prefix-list PL_EXPORT_DENY_LINK_14_1 seq 10 deny 10.181.0.66/31
!

ip prefix-list PL_EXPORT_DENY_LONG_14 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_14_0 seq 10 deny 10.180.0.15/32
!

ip prefix-list PL_IN_14_12 seq 10 permit 10.200.4.0/24
ip prefix-list PL_IN_14_12 seq 20 permit 10.181.0.60/31
ip prefix-list PL_IN_14_12 seq 30 permit 10.180.0.13/32
ip prefix-list PL_IN_14_12 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_14_12 seq 10 permit 10.200.7.0/24
!






route-map RM_POLICY_IN_14_12 permit 10














 match ip address prefix-list PL_IN_14_12
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_14_12 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_14_12 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_14_0
 ! Block loopback 10.180.0.15/32


route-map RM_POLICY_OUT_14_12 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_0
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_14_12 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_1
 ! Block link 10.181.0.66/31


route-map RM_POLICY_OUT_14_12 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_14
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_14_12 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_14
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_14_12 deny 200














 match ip address prefix-list PL_OUT_14_12
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_14_12 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.15
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.17 peer-group RR




 !
 neighbor 10.181.0.60 peer-group EBGP
 neighbor 10.181.0.60 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.17 activate




  neighbor 10.181.0.60 activate
  neighbor 10.181.0.60 route-map RM_POLICY_IN_14_12 in
  neighbor 10.181.0.60 route-map RM_POLICY_OUT_14_12 out





  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

 exit-address-family
