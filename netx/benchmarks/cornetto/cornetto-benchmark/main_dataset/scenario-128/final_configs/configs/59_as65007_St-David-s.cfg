 !
 neighbor 10.180.0.61 peer-group IBGP


 !
 neighbor 10.180.0.62 peer-group IBGP


 !
 neighbor 10.180.0.63 peer-group IBGP


 !
 neighbor 10.180.0.65 peer-group IBGP



 !
 neighbor 10.181.0.52 peer-group EBGP
 neighbor 10.181.0.52 remote-as 65001


 !
