ip access-list extended ACL_12_GigabitEthernet0_1
 10 permit ip host 10.180.0.31 any
 20 permit ip host 10.181.0.48 any
 30 permit ip host 10.181.0.49 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_12_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.13 any
 20 permit ip host 10.181.0.46 any
 30 permit ip host 10.181.0.48 any
 40 permit ip 10.181.0.46 0.0.0.1 any
 50 permit ip 10.181.0.48 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 13_as65002_Durham (13)

 ip address 10.181.0.46 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 30_as65001_Greensboro (30)

 ip address 10.181.0.48 255.255.255.254

 ip access-group ACL_12_GigabitEthernet0_1 in

 ip access-group ACL_12_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.17.0 255.255.255.0 Loopback100
ip route 10.200.18.0 255.255.255.0 Loopback101
ip route 10.200.19.0 255.255.255.0 Loopback102
ip route 10.200.20.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.13
 passive-interface Loopback0
 network 10.180.0.13 0.0.0.0 area 0










 redistribute bgp 65002 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_12

network 10.181.0.46 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 10 permit 10.200.21.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 20 permit 10.200.22.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 30 permit 10.200.23.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 40 permit 10.200.53.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 50 permit 10.200.54.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 60 permit 10.200.55.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 70 permit 10.200.56.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 80 permit 10.200.61.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 90 permit 10.200.62.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 100 permit 10.200.63.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 110 permit 10.200.64.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 120 permit 10.200.80.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 130 permit 10.200.81.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 140 permit 10.200.82.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 150 permit 10.200.83.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_12 seq 10 permit 10.180.0.13/32
ip prefix-list PL_BGP_TO_OSPF_DENY_12 seq 20 permit 10.181.0.46/31
ip prefix-list PL_BGP_TO_OSPF_DENY_12 seq 30 permit 10.181.0.48/31
!

ip prefix-list PL_EXPORT_ALLOWED_12 seq 10 permit 10.200.17.0/24
ip prefix-list PL_EXPORT_ALLOWED_12 seq 20 permit 10.200.18.0/24
ip prefix-list PL_EXPORT_ALLOWED_12 seq 30 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_12 seq 40 permit 10.200.20.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_12_0 seq 10 deny 10.181.0.46/31
!

ip prefix-list PL_EXPORT_DENY_LINK_12_1 seq 10 deny 10.181.0.48/31
!

ip prefix-list PL_EXPORT_DENY_LONG_12 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_12_0 seq 10 deny 10.180.0.13/32
!

ip prefix-list PL_IN_12_30 seq 10 permit 10.181.0.48/31
ip prefix-list PL_IN_12_30 seq 20 permit 10.200.56.0/24
ip prefix-list PL_IN_12_30 seq 30 permit 10.200.54.0/24
ip prefix-list PL_IN_12_30 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_12_30 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_12_30 seq 10 permit 10.200.20.0/24
!






route-map RM_BGP_TO_OSPF_12 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_12 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_12
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_12 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_12
 set tag 65010

!


route-map RM_POLICY_IN_12_30 permit 10














 match ip address prefix-list PL_IN_12_30
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_12_30 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_12_30 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_12_0
 ! Block loopback 10.180.0.13/32


route-map RM_POLICY_OUT_12_30 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_0
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_12_30 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_1
 ! Block link 10.181.0.48/31


route-map RM_POLICY_OUT_12_30 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_12
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_12_30 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_12
 set metric 26
 set as-path prepend 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_12_30 deny 200














 match ip address prefix-list PL_OUT_12_30
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_12_30 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.13
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.19 peer-group RR




 !
 neighbor 10.181.0.49 peer-group EBGP
 neighbor 10.181.0.49 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.19 activate




  neighbor 10.181.0.49 activate
  neighbor 10.181.0.49 route-map RM_POLICY_IN_12_30 in
  neighbor 10.181.0.49 route-map RM_POLICY_OUT_12_30 out





  network 10.200.17.0 mask 255.255.255.0

  network 10.200.18.0 mask 255.255.255.0

  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

 exit-address-family
