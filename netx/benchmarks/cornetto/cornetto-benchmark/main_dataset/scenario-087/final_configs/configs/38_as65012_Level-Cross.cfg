
hostname 38_as65012_Level-Cross
!
interface Loopback0
 ip address 10.180.0.39 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 83_as65012_Sparta (83)

 ip address 10.181.0.114 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 39_as65012_Courtney (39)

 ip address 10.181.0.116 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.39
 passive-interface Loopback0
 network 10.180.0.39 0.0.0.0 area 0



network 10.181.0.114 0.0.0.1 area 0
network 10.181.0.116 0.0.0.1 area 0
!








router bgp 65012
 bgp router-id 10.180.0.39
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65012
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.34 peer-group RR


 !
 neighbor 10.180.0.84 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.34 activate


  neighbor 10.180.0.84 activate







 exit-address-family
