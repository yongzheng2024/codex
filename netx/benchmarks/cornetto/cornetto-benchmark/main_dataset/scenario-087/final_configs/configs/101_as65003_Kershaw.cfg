
hostname 101_as65003_Kershaw
!
interface Loopback0
 ip address 10.180.0.102 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!



ip access-list extended ACL_101_GigabitEthernet0_1
 5 deny ip any any
 10 permit ip host 10.180.0.109 any
 20 permit ip host 10.181.1.28 any
 30 permit ip host 10.181.1.29 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_101_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.102 any
 20 permit ip host 10.181.1.25 any
 30 permit ip host 10.181.1.28 any
 40 permit ip 10.181.1.24 0.0.0.1 any
 50 permit ip 10.181.1.28 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 100_as65003_Lancaster (100)

 ip address 10.181.1.25 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 108_as65002_Bethune (108)

 ip address 10.181.1.28 255.255.255.254

 ip access-group ACL_101_GigabitEthernet0_1 in

 ip access-group ACL_101_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
ip route 10.200.3.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.102
 passive-interface Loopback0
 network 10.180.0.102 0.0.0.0 area 0



network 10.181.1.24 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 10 permit 10.200.7.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 20 permit 10.200.8.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 30 permit 10.200.9.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 40 permit 10.200.10.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 50 permit 10.200.11.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 60 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 70 permit 10.200.17.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 80 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 90 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 100 permit 10.200.20.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 110 permit 10.200.99.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 120 permit 10.200.100.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_101 seq 10 permit 10.180.0.102/32
ip prefix-list PL_BGP_TO_OSPF_DENY_101 seq 20 permit 10.181.1.24/31
ip prefix-list PL_BGP_TO_OSPF_DENY_101 seq 30 permit 10.181.1.28/31
!

ip prefix-list PL_EXPORT_ALLOWED_101 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_101 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_101 seq 30 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_101 seq 40 permit 10.200.3.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_101_0 seq 10 deny 10.181.1.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_101_1 seq 10 deny 10.181.1.28/31
!

ip prefix-list PL_EXPORT_DENY_LONG_101 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_101_0 seq 10 deny 10.180.0.102/32
!






route-map RM_BGP_TO_OSPF_101 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_101 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_101
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_101 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_101
 set tag 65010

!


route-map RM_POLICY_OUT_101_108 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_101_0
 ! Block loopback 10.180.0.102/32


route-map RM_POLICY_OUT_101_108 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_101_0
 ! Block link 10.181.1.24/31


route-map RM_POLICY_OUT_101_108 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_101_1
 ! Block link 10.181.1.28/31


route-map RM_POLICY_OUT_101_108 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_101
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_101_108 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_101
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_101_108 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.102
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.92 peer-group RR


 !
 neighbor 10.180.0.98 peer-group RR




 !
 neighbor 10.181.1.29 peer-group EBGP
 neighbor 10.181.1.29 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.92 activate


  neighbor 10.180.0.98 activate




  neighbor 10.181.1.29 activate
  neighbor 10.181.1.29 route-map RM_POLICY_OUT_101_108 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

 exit-address-family
