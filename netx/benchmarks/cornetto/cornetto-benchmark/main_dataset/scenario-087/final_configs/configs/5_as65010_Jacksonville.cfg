ip prefix-list PL_OUT_5_3 seq 10 permit 10.200.73.0/24
!




ip community-list standard CL_COMM_5_3 permit no-advertise
!





route-map RM_POLICY_IN_5_3 permit 5














 match community CL_COMM_5_3
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_5_3 permit 10














 match ip address prefix-list PL_IN_5_3
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_5_3 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_5_3 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_5_3 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_5_0
 ! Block loopback 10.180.0.6/32


route-map RM_POLICY_OUT_5_3 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_5_3 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_1
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_5_3 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_5
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_5_3 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_5
 set metric 26
 set as-path prepend 65010 65010 65010
 set community no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_5_3 deny 200














 match ip address prefix-list PL_OUT_5_3
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_5_3 deny 65000














 ! Deny other outbound routes

!







