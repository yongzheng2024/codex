 set as-path prepend 65011
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_138_133 deny 200














 match ip address prefix-list PL_OUT_138_133
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_138_133 deny 65000














