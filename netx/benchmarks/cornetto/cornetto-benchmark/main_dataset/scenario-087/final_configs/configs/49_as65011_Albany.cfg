
hostname 49_as65011_Albany
!
interface Loopback0
 ip address 10.180.0.50 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.71.0/24


 ip address 10.200.71.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.72.0/24


 ip address 10.200.72.1 255.255.255.0
!



ip access-list extended ACL_49_GigabitEthernet0_0
 10 permit ip host 10.180.0.158 any
 20 permit ip host 10.181.0.138 any
 30 permit ip host 10.181.0.139 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_49_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.50 any
 20 permit ip host 10.181.0.138 any
 30 permit ip host 10.181.0.140 any
 40 permit ip 10.181.0.138 0.0.0.1 any
 50 permit ip 10.181.0.140 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 157_as65010_Tallahassee (157)

 ip address 10.181.0.138 255.255.255.254

 ip access-group ACL_49_GigabitEthernet0_0 in

 ip access-group ACL_49_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 135_as65011_Macon (135)

 ip address 10.181.0.140 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.71.0 255.255.255.0 Loopback100
ip route 10.200.72.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.50
 passive-interface Loopback0
 network 10.180.0.50 0.0.0.0 area 0










 redistribute bgp 65011 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_49

network 10.181.0.140 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_49 seq 10 permit 10.200.41.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_49 seq 20 permit 10.200.42.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_49 seq 30 permit 10.200.43.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_49 seq 40 permit 10.200.44.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_49 seq 50 permit 10.200.45.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_49 seq 60 permit 10.200.46.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_49 seq 70 permit 10.200.47.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_49 seq 80 permit 10.200.73.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_49 seq 90 permit 10.200.74.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_49 seq 100 permit 10.200.75.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_49 seq 10 permit 10.180.0.50/32
ip prefix-list PL_BGP_TO_OSPF_DENY_49 seq 20 permit 10.181.0.138/31
ip prefix-list PL_BGP_TO_OSPF_DENY_49 seq 30 permit 10.181.0.140/31
!

ip prefix-list PL_EXPORT_ALLOWED_49 seq 10 permit 10.200.71.0/24
ip prefix-list PL_EXPORT_ALLOWED_49 seq 20 permit 10.200.72.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_49_0 seq 10 deny 10.181.0.138/31
!

ip prefix-list PL_EXPORT_DENY_LINK_49_1 seq 10 deny 10.181.0.140/31
!

ip prefix-list PL_EXPORT_DENY_LONG_49 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_49_0 seq 10 deny 10.180.0.50/32
!

ip prefix-list PL_IN_49_157 seq 10 permit 10.181.1.120/31
ip prefix-list PL_IN_49_157 seq 20 permit 10.200.44.0/24
ip prefix-list PL_IN_49_157 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_49_157 seq 10 permit 10.200.72.0/24
!






route-map RM_BGP_TO_OSPF_49 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_49 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_49
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_49 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_49
 set tag 65010

!


route-map RM_POLICY_IN_49_157 permit 10














 match ip address prefix-list PL_IN_49_157
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_49_157 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_49_157 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_49_0
 ! Block loopback 10.180.0.50/32


route-map RM_POLICY_OUT_49_157 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_49_0
 ! Block link 10.181.0.138/31


route-map RM_POLICY_OUT_49_157 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_49_1
 ! Block link 10.181.0.140/31


route-map RM_POLICY_OUT_49_157 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_49
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_49_157 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_49
 set metric 23
 set as-path prepend 65011 65011 65011
 ! Outbound policy baseline


route-map RM_POLICY_OUT_49_157 deny 200














 match ip address prefix-list PL_OUT_49_157
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_49_157 deny 65000














 ! Deny other outbound routes

!







router bgp 65011
 bgp router-id 10.180.0.50
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65011
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.135 peer-group IBGP


 !
 neighbor 10.180.0.136 peer-group IBGP


 !
 neighbor 10.180.0.137 peer-group IBGP


 !
 neighbor 10.180.0.138 peer-group IBGP


