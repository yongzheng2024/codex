
hostname 19_as65002_Wilmington
!
interface Loopback0
 ip address 10.180.0.20 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 18_as65002_Fayetteville (18)

 ip address 10.181.0.59 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 107_as65002_Myrtle-Beach (107)

 ip address 10.181.0.62 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.20
 passive-interface Loopback0
 network 10.180.0.20 0.0.0.0 area 0



network 10.181.0.58 0.0.0.1 area 0
network 10.181.0.62 0.0.0.1 area 0
!








router bgp 65002
 bgp router-id 10.180.0.20
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.19 peer-group RR


 !
 neighbor 10.180.0.107 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.19 activate


  neighbor 10.180.0.107 activate







 exit-address-family
