ip route 10.200.51.0 255.255.255.0 Loopback101
ip route 10.200.52.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.4
 passive-interface Loopback0
 network 10.180.0.4 0.0.0.0 area 0










 redistribute bgp 65009 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_3

network 10.181.0.6 0.0.0.1 area 0
network 10.181.0.10 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 10 permit 10.200.41.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 20 permit 10.200.42.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 30 permit 10.200.43.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 40 permit 10.200.44.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 50 permit 10.200.45.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 60 permit 10.200.46.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 70 permit 10.200.47.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 80 permit 10.200.73.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 90 permit 10.200.74.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 100 permit 10.200.75.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 10 permit 10.180.0.4/32
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 20 permit 10.181.0.6/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 30 permit 10.181.0.10/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 40 permit 10.181.0.12/31
!

ip prefix-list PL_EXPORT_ALLOWED_3 seq 10 permit 10.200.50.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 20 permit 10.200.51.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 30 permit 10.200.52.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_3_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_1 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_2 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LONG_3 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_3_0 seq 10 deny 10.180.0.4/32
!




ip community-list standard CL_COMM_3_5 permit no-advertise
!





route-map RM_BGP_TO_OSPF_3 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_3 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_3
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_3 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_3
 set tag 65010

!


route-map RM_POLICY_IN_3_5 permit 5














 match community CL_COMM_3_5
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_3_5 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_3_5 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_3_5 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_5 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_3_5 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_3_5 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_2
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_3_5 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_5 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_3
 set metric 17
 set as-path prepend 65009
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_3_5 deny 65000














 ! Deny other outbound routes

!







router bgp 65009
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
