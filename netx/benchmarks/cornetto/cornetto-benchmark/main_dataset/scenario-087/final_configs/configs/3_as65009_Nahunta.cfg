ip access-list extended ACL_3_GigabitEthernet0_2
 10 permit ip host 10.180.0.6 any
 20 permit ip host 10.181.0.12 any
 30 permit ip host 10.181.0.13 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_3_GigabitEthernet0_2_OUT
 10 permit ip host 10.180.0.4 any
 20 permit ip host 10.181.0.7 any
 30 permit ip host 10.181.0.10 any
 40 permit ip host 10.181.0.12 any
 50 permit ip 10.181.0.12 0.0.0.1 any
 60 permit ip 10.181.0.6 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 2_as65009_Darien (2)

 ip address 10.181.0.7 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

