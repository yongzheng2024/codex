
hostname 32_as65012_Salisbury
!
interface Loopback0
 ip address 10.180.0.33 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.57.0/24


 ip address 10.200.57.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.58.0/24


 ip address 10.200.58.1 255.255.255.0
!



ip access-list extended ACL_32_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.33 any
 20 permit ip host 10.181.0.96 any
 30 permit ip host 10.181.0.98 any
 40 permit ip 10.181.0.96 0.0.0.1 any
 50 permit ip 10.181.0.98 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 33_as65012_Lexington (33)

 ip address 10.181.0.96 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 35_as65003_Concord (35)

 ip address 10.181.0.98 255.255.255.254

 ip access-group ACL_32_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.57.0 255.255.255.0 Loopback100
ip route 10.200.58.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.33
 passive-interface Loopback0
 network 10.180.0.33 0.0.0.0 area 0










 redistribute bgp 65012 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_32

network 10.181.0.96 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 10 permit 10.200.0.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 20 permit 10.200.1.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 30 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 40 permit 10.200.3.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 50 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 60 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 70 permit 10.200.15.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 80 permit 10.200.16.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 90 permit 10.200.65.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 100 permit 10.200.66.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 110 permit 10.200.67.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_32 seq 10 permit 10.180.0.33/32
ip prefix-list PL_BGP_TO_OSPF_DENY_32 seq 20 permit 10.181.0.96/31
ip prefix-list PL_BGP_TO_OSPF_DENY_32 seq 30 permit 10.181.0.98/31
!

ip prefix-list PL_EXPORT_ALLOWED_32 seq 10 permit 10.200.57.0/24
ip prefix-list PL_EXPORT_ALLOWED_32 seq 20 permit 10.200.58.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_32_0 seq 10 deny 10.181.0.96/31
!

ip prefix-list PL_EXPORT_DENY_LINK_32_1 seq 10 deny 10.181.0.98/31
!

ip prefix-list PL_EXPORT_DENY_LONG_32 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_32_0 seq 10 deny 10.180.0.33/32
!

ip prefix-list PL_IN_32_35 seq 10 permit 10.200.65.0/24
ip prefix-list PL_IN_32_35 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_32_35 seq 10 permit 10.200.57.0/24
!






route-map RM_BGP_TO_OSPF_32 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_32 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_32
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_32 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_32
 set tag 65010

!


route-map RM_POLICY_IN_32_35 permit 10














 match ip address prefix-list PL_IN_32_35
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_32_35 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_32_35 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_32_0
 ! Block loopback 10.180.0.33/32


route-map RM_POLICY_OUT_32_35 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_0
 ! Block link 10.181.0.96/31


route-map RM_POLICY_OUT_32_35 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_1
 ! Block link 10.181.0.98/31


route-map RM_POLICY_OUT_32_35 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_32
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_32_35 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_32
 set community no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_32_35 deny 200














 match ip address prefix-list PL_OUT_32_35
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_32_35 deny 65000














 ! Deny other outbound routes

!







router bgp 65012
 bgp router-id 10.180.0.33
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65012
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.84 peer-group RR




 !
 neighbor 10.181.0.99 peer-group EBGP
 neighbor 10.181.0.99 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.84 activate




  neighbor 10.181.0.99 activate
  neighbor 10.181.0.99 route-map RM_POLICY_IN_32_35 in
  neighbor 10.181.0.99 route-map RM_POLICY_OUT_32_35 out





  network 10.200.57.0 mask 255.255.255.0

  network 10.200.58.0 mask 255.255.255.0

 exit-address-family
