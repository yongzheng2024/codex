route-map RM_BGP_TO_OSPF_33 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_33 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_33
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_33 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_33
