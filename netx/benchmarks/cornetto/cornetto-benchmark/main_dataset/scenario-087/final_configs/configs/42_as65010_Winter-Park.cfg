 network 10.180.0.43 0.0.0.0 area 0



network 10.181.0.124 0.0.0.1 area 0
network 10.181.0.126 0.0.0.1 area 0
!








router bgp 65010
 bgp router-id 10.180.0.43
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



