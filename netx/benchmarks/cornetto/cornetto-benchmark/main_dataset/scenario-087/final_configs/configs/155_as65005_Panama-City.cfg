 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_155_156 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_155
 set metric 15
 set as-path prepend 65005
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_155_156 deny 65000














 ! Deny other outbound routes

!







