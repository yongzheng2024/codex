 set tag 65010

!


route-map RM_POLICY_IN_155_156 permit 5














 match community CL_COMM_155_156
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_155_156 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_155_156 permit 1000














 ! Default permit for other communities

