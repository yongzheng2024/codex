
hostname 108_as65002_Bethune
!
interface Loopback0
 ip address 10.180.0.109 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!



ip access-list extended ACL_108_GigabitEthernet0_0
 10 permit ip host 10.180.0.102 any
 20 permit ip host 10.181.1.28 any
 30 permit ip host 10.181.1.29 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_108_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.109 any
 20 permit ip host 10.181.1.29 any
 30 permit ip host 10.181.1.41 any
 40 permit ip 10.181.1.28 0.0.0.1 any
 50 permit ip 10.181.1.40 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 101_as65003_Kershaw (101)

 ip address 10.181.1.29 255.255.255.254

 ip access-group ACL_108_GigabitEthernet0_0 in

 ip access-group ACL_108_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 106_as65002_Florence (106)

 ip address 10.181.1.41 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.7.0 255.255.255.0 Loopback100
ip route 10.200.8.0 255.255.255.0 Loopback101
ip route 10.200.9.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.109
 passive-interface Loopback0
 network 10.180.0.109 0.0.0.0 area 0



network 10.181.1.40 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_108 seq 10 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_108 seq 20 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_108 seq 30 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_108_0 seq 10 deny 10.181.1.28/31
!

ip prefix-list PL_EXPORT_DENY_LINK_108_1 seq 10 deny 10.181.1.40/31
!

ip prefix-list PL_EXPORT_DENY_LONG_108 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_108_0 seq 10 deny 10.180.0.109/32
!

ip prefix-list PL_IN_108_101 seq 10 permit 10.180.0.102/32
ip prefix-list PL_IN_108_101 seq 20 permit 10.200.1.0/24
ip prefix-list PL_IN_108_101 seq 30 permit 10.181.1.24/31
ip prefix-list PL_IN_108_101 seq 40 permit 10.200.3.0/24
ip prefix-list PL_IN_108_101 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_108_101 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_108_101 seq 10 permit 10.200.9.0/24
ip prefix-list PL_OUT_108_101 seq 20 permit 10.200.8.0/24
!






route-map RM_POLICY_IN_108_101 permit 10














 match ip address prefix-list PL_IN_108_101
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_108_101 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_108_101 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_108_0
 ! Block loopback 10.180.0.109/32


route-map RM_POLICY_OUT_108_101 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_108_0
 ! Block link 10.181.1.28/31


route-map RM_POLICY_OUT_108_101 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_108_1
 ! Block link 10.181.1.40/31


route-map RM_POLICY_OUT_108_101 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_108
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_108_101 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_108
 set metric 27
 set as-path prepend 65002 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_108_101 deny 200














 match ip address prefix-list PL_OUT_108_101
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_108_101 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.109
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.19 peer-group RR


 !
 neighbor 10.180.0.107 peer-group RR




 !
 neighbor 10.181.1.28 peer-group EBGP
 neighbor 10.181.1.28 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.19 activate


  neighbor 10.180.0.107 activate




  neighbor 10.181.1.28 activate
  neighbor 10.181.1.28 route-map RM_POLICY_OUT_108_101 in
  neighbor 10.181.1.28 route-map RM_POLICY_IN_108_101 out





  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
