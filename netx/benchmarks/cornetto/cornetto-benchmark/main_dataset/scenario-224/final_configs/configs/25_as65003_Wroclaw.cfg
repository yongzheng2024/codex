
hostname 25_as65003_Wroclaw
!
interface Loopback0
 ip address 10.180.0.26 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.23.0/24


 ip address 10.200.23.1 255.255.255.0
!



ip access-list extended ACL_25_GigabitEthernet0_0
 10 permit ip host 10.180.0.34 any
 20 permit ip host 10.181.0.88 any
 30 permit ip host 10.181.0.89 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 33_as65006_Zielona-gora (33)

 ip address 10.181.0.88 255.255.255.254

 ip access-group ACL_25_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 26_as65003_Opole (26)

 ip address 10.181.0.90 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.21.0 255.255.255.0 Loopback100
ip route 10.200.22.0 255.255.255.0 Loopback101
ip route 10.200.23.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.26
 passive-interface Loopback0
 network 10.180.0.26 0.0.0.0 area 0










 redistribute bgp 65003 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_25

network 10.181.0.90 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_25 seq 10 permit 10.200.9.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_25 seq 20 permit 10.200.10.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_25 seq 30 permit 10.200.31.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_25 seq 40 permit 10.200.32.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_25 seq 50 permit 10.200.33.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_25 seq 60 permit 10.200.34.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_25 seq 70 permit 10.200.35.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_25 seq 10 permit 10.180.0.26/32
ip prefix-list PL_BGP_TO_OSPF_DENY_25 seq 20 permit 10.181.0.88/31
ip prefix-list PL_BGP_TO_OSPF_DENY_25 seq 30 permit 10.181.0.90/31
!

ip prefix-list PL_EXPORT_ALLOWED_25 seq 10 permit 10.200.21.0/24
ip prefix-list PL_EXPORT_ALLOWED_25 seq 20 permit 10.200.22.0/24
ip prefix-list PL_EXPORT_ALLOWED_25 seq 30 permit 10.200.23.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_25_0 seq 10 deny 10.181.0.88/31
!

ip prefix-list PL_EXPORT_DENY_LINK_25_1 seq 10 deny 10.181.0.90/31
!

ip prefix-list PL_EXPORT_DENY_LONG_25 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_25_0 seq 10 deny 10.180.0.26/32
!

ip prefix-list PL_IN_25_33 seq 10 permit 10.200.35.0/24
ip prefix-list PL_IN_25_33 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_25_33 seq 10 permit 10.200.23.0/24
ip prefix-list PL_OUT_25_33 seq 20 permit 10.200.21.0/24
!






route-map RM_BGP_TO_OSPF_25 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_25 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_25
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_25 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_25
 set tag 65010

!


route-map RM_POLICY_IN_25_33 permit 10














 match ip address prefix-list PL_IN_25_33
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_25_33 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_25_33 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_25_0
 ! Block loopback 10.180.0.26/32


route-map RM_POLICY_OUT_25_33 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_0
 ! Block link 10.181.0.88/31


route-map RM_POLICY_OUT_25_33 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_1
 ! Block link 10.181.0.90/31


route-map RM_POLICY_OUT_25_33 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_25
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_25_33 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_25
 set metric 6
 set as-path prepend 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_25_33 deny 200














 match ip address prefix-list PL_OUT_25_33
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_25_33 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.26
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP



 !
 neighbor 10.181.0.89 peer-group EBGP
 neighbor 10.181.0.89 remote-as 65006


 !
 address-family ipv4


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.21 activate


  neighbor 10.180.0.22 activate


  neighbor 10.180.0.23 activate


  neighbor 10.180.0.27 activate


  neighbor 10.180.0.28 activate



  neighbor 10.181.0.89 activate
  neighbor 10.181.0.89 route-map RM_POLICY_IN_25_33 in
  neighbor 10.181.0.89 route-map RM_POLICY_OUT_25_33 out





  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

  network 10.200.23.0 mask 255.255.255.0

 exit-address-family
