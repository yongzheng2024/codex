
hostname 13_as65006_Gorzow-Wlkp
!
interface Loopback0
 ip address 10.180.0.14 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 32_as65006_Szczecin (32)

 ip address 10.181.0.60 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 34_as65001_Poznan (34)

 ip address 10.181.0.62 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 15_as65006_DFN (15)

 ip address 10.181.0.64 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.9.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.14
 passive-interface Loopback0
 network 10.180.0.14 0.0.0.0 area 0










 redistribute bgp 65006 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_13

network 10.181.0.60 0.0.0.1 area 0
network 10.181.0.64 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_13 seq 10 permit 10.200.0.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_13 seq 20 permit 10.200.1.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_13 seq 30 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_13 seq 40 permit 10.200.3.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_13 seq 50 permit 10.200.36.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_13 seq 60 permit 10.200.37.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_13 seq 70 permit 10.200.38.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_13 seq 80 permit 10.200.39.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_13 seq 90 permit 10.200.42.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_13 seq 100 permit 10.200.43.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_13 seq 10 permit 10.180.0.14/32
ip prefix-list PL_BGP_TO_OSPF_DENY_13 seq 20 permit 10.181.0.60/31
ip prefix-list PL_BGP_TO_OSPF_DENY_13 seq 30 permit 10.181.0.62/31
ip prefix-list PL_BGP_TO_OSPF_DENY_13 seq 40 permit 10.181.0.64/31
!

ip prefix-list PL_EXPORT_ALLOWED_13 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_13 seq 20 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_13_0 seq 10 deny 10.181.0.60/31
!

ip prefix-list PL_EXPORT_DENY_LINK_13_1 seq 10 deny 10.181.0.62/31
!

ip prefix-list PL_EXPORT_DENY_LINK_13_2 seq 10 deny 10.181.0.64/31
!

ip prefix-list PL_EXPORT_DENY_LONG_13 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_13_0 seq 10 deny 10.180.0.14/32
!

ip prefix-list PL_IN_13_34 seq 10 permit 10.200.38.0/24
ip prefix-list PL_IN_13_34 seq 20 permit 10.181.0.36/31
ip prefix-list PL_IN_13_34 seq 30 permit 10.181.0.74/31
ip prefix-list PL_IN_13_34 seq 40 permit 10.181.0.58/31
ip prefix-list PL_IN_13_34 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_13_34 seq 10 permit 10.200.9.0/24
ip prefix-list PL_OUT_13_34 seq 20 permit 10.200.10.0/24
!






route-map RM_BGP_TO_OSPF_13 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_13 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_13
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_13 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_13
 set tag 65010

!


route-map RM_POLICY_IN_13_34 permit 10














 match ip address prefix-list PL_IN_13_34
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_13_34 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_13_34 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_13_0
 ! Block loopback 10.180.0.14/32


route-map RM_POLICY_OUT_13_34 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_0
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_13_34 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_1
 ! Block link 10.181.0.62/31


route-map RM_POLICY_OUT_13_34 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_2
 ! Block link 10.181.0.64/31


route-map RM_POLICY_OUT_13_34 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_13
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_13_34 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_13
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_13_34 deny 200














 match ip address prefix-list PL_OUT_13_34
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_13_34 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.14
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.33 peer-group IBGP


 !
 neighbor 10.180.0.34 peer-group IBGP



 !
 neighbor 10.181.0.63 peer-group EBGP
 neighbor 10.181.0.63 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.33 activate


  neighbor 10.180.0.34 activate



  neighbor 10.181.0.63 activate
  neighbor 10.181.0.63 route-map RM_POLICY_IN_13_34 in
  neighbor 10.181.0.63 route-map RM_POLICY_OUT_13_34 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
