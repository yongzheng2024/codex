
hostname 33_as65006_Zielona-gora
!
interface Loopback0
 ip address 10.180.0.34 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.34.0/24


 ip address 10.200.34.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.35.0/24


 ip address 10.200.35.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 15_as65006_DFN (15)

 ip address 10.181.0.71 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 25_as65003_Wroclaw (25)

 ip address 10.181.0.89 255.255.255.254
 mtu 1500
!


ip route 10.200.34.0 255.255.255.0 Loopback100
ip route 10.200.35.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.34
 passive-interface Loopback0
 network 10.180.0.34 0.0.0.0 area 0



network 10.181.0.70 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_33 seq 10 permit 10.200.34.0/24
ip prefix-list PL_EXPORT_ALLOWED_33 seq 20 permit 10.200.35.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_33_0 seq 10 deny 10.181.0.70/31
!

ip prefix-list PL_EXPORT_DENY_LINK_33_1 seq 10 deny 10.181.0.88/31
!

ip prefix-list PL_EXPORT_DENY_LONG_33 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_33_0 seq 10 deny 10.180.0.34/32
!

ip prefix-list PL_IN_33_25 seq 10 permit 10.181.0.88/31
ip prefix-list PL_IN_33_25 seq 20 permit 10.180.0.26/32
ip prefix-list PL_IN_33_25 seq 30 permit 10.181.0.90/31
ip prefix-list PL_IN_33_25 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_33_25 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_33_25 seq 10 permit 10.200.34.0/24
ip prefix-list PL_OUT_33_25 seq 20 permit 10.200.35.0/24
!






route-map RM_POLICY_IN_33_25 permit 10














 match ip address prefix-list PL_IN_33_25
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_33_25 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_33_25 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_33_0
 ! Block loopback 10.180.0.34/32


route-map RM_POLICY_OUT_33_25 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_0
 ! Block link 10.181.0.70/31


route-map RM_POLICY_OUT_33_25 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_1
 ! Block link 10.181.0.88/31


route-map RM_POLICY_OUT_33_25 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_33
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_33_25 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_33
 set community 65000:200 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_33_25 deny 200














 match ip address prefix-list PL_OUT_33_25
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_33_25 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.34
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.33 peer-group IBGP



 !
 neighbor 10.181.0.88 peer-group EBGP
 neighbor 10.181.0.88 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.14 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.33 activate



  neighbor 10.181.0.88 activate
  neighbor 10.181.0.88 route-map RM_POLICY_IN_33_25 in
  neighbor 10.181.0.88 route-map RM_POLICY_OUT_33_25 out





  network 10.200.34.0 mask 255.255.255.0

  network 10.200.35.0 mask 255.255.255.0

 exit-address-family
