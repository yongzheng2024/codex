  neighbor 10.181.0.82 route-map RM_POLICY_IN_23_18 in
  neighbor 10.181.0.82 route-map RM_POLICY_OUT_23_18 out





  network 10.200.18.0 mask 255.255.255.0

  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

 exit-address-family
