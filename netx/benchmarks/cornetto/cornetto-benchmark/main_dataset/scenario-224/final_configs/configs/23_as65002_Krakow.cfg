ip prefix-list PL_IN_23_18 seq 10 permit 10.200.13.0/24
ip prefix-list PL_IN_23_18 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_23_18 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_23_18 seq 10 permit 10.200.19.0/24
ip prefix-list PL_OUT_23_18 seq 20 permit 10.200.18.0/24
!




ip community-list standard CL_COMM_23_18 permit no-advertise
!





route-map RM_POLICY_IN_23_18 permit 5














 match community CL_COMM_23_18
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_23_18 permit 10














 match ip address prefix-list PL_IN_23_18
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_23_18 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_23_18 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_23_18 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_23_0
 ! Block loopback 10.180.0.24/32


route-map RM_POLICY_OUT_23_18 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_0
 ! Block link 10.181.0.42/31


route-map RM_POLICY_OUT_23_18 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_1
 ! Block link 10.181.0.44/31


route-map RM_POLICY_OUT_23_18 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_2
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_23_18 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_3
 ! Block link 10.181.0.82/31


route-map RM_POLICY_OUT_23_18 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_23
 set metric 20
 set as-path prepend 65002
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_23_18 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_23
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_23_18 deny 200














 match ip address prefix-list PL_OUT_23_18
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_23_18 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.24
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP



 !
 neighbor 10.181.0.82 peer-group EBGP
 neighbor 10.181.0.82 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.8 activate


  neighbor 10.180.0.9 activate


  neighbor 10.180.0.10 activate


  neighbor 10.180.0.20 activate



