network 10.181.0.42 0.0.0.1 area 0
network 10.181.0.44 0.0.0.1 area 0
network 10.181.0.46 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_23 seq 10 permit 10.200.18.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 20 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 30 permit 10.200.20.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_23_0 seq 10 deny 10.181.0.42/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_1 seq 10 deny 10.181.0.44/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_2 seq 10 deny 10.181.0.46/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_3 seq 10 deny 10.181.0.82/31
!

ip prefix-list PL_EXPORT_DENY_LONG_23 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_23_0 seq 10 deny 10.180.0.24/32
