  neighbor 10.180.0.31 activate


  neighbor 10.180.0.32 activate


  neighbor 10.180.0.36 activate


  neighbor 10.180.0.37 activate


  neighbor 10.180.0.38 activate



  neighbor 10.181.0.49 activate
  neighbor 10.181.0.49 route-map RM_POLICY_IN_10_28 in
  neighbor 10.181.0.49 route-map RM_POLICY_OUT_10_28 out





  network 10.200.6.0 mask 255.255.255.0

  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

 exit-address-family
