ip route 10.200.6.0 255.255.255.0 Loopback100
ip route 10.200.7.0 255.255.255.0 Loopback101
ip route 10.200.8.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.11
 passive-interface Loopback0
 network 10.180.0.11 0.0.0.0 area 0










 redistribute bgp 65004 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_10

network 10.181.0.50 0.0.0.1 area 0
network 10.181.0.52 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_10 seq 10 permit 10.200.24.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_10 seq 20 permit 10.200.25.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_10 seq 30 permit 10.200.26.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_10 seq 40 permit 10.200.27.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_10 seq 10 permit 10.180.0.11/32
ip prefix-list PL_BGP_TO_OSPF_DENY_10 seq 20 permit 10.181.0.48/31
ip prefix-list PL_BGP_TO_OSPF_DENY_10 seq 30 permit 10.181.0.50/31
ip prefix-list PL_BGP_TO_OSPF_DENY_10 seq 40 permit 10.181.0.52/31
!

ip prefix-list PL_EXPORT_ALLOWED_10 seq 10 permit 10.200.6.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 20 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 30 permit 10.200.8.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_10_0 seq 10 deny 10.181.0.48/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_1 seq 10 deny 10.181.0.50/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_2 seq 10 deny 10.181.0.52/31
!

ip prefix-list PL_EXPORT_DENY_LONG_10 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_10_0 seq 10 deny 10.180.0.11/32
!

ip prefix-list PL_IN_10_28 seq 10 permit 10.181.0.54/31
ip prefix-list PL_IN_10_28 seq 20 permit 10.180.0.29/32
ip prefix-list PL_IN_10_28 seq 30 permit 10.181.0.48/31
ip prefix-list PL_IN_10_28 seq 40 permit 10.200.25.0/24
ip prefix-list PL_IN_10_28 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_10_28 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_10_28 seq 10 permit 10.200.7.0/24
ip prefix-list PL_OUT_10_28 seq 20 permit 10.200.6.0/24
!






route-map RM_BGP_TO_OSPF_10 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_10 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_10
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_10 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_10
 set tag 65010

!


route-map RM_POLICY_IN_10_28 permit 10














 match ip address prefix-list PL_IN_10_28
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_10_28 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_10_28 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_28 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.48/31


route-map RM_POLICY_OUT_10_28 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.50/31


route-map RM_POLICY_OUT_10_28 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_2
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_10_28 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_10
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_10_28 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_10
 set metric 14
 set as-path prepend 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_10_28 deny 200














 match ip address prefix-list PL_OUT_10_28
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_10_28 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.31 peer-group IBGP


 !
 neighbor 10.180.0.32 peer-group IBGP


 !
 neighbor 10.180.0.36 peer-group IBGP


 !
 neighbor 10.180.0.37 peer-group IBGP


 !
 neighbor 10.180.0.38 peer-group IBGP



 !
 neighbor 10.181.0.49 peer-group EBGP
 neighbor 10.181.0.49 remote-as 65005


 !
