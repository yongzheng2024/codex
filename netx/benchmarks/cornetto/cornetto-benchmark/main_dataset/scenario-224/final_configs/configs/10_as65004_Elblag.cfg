!
interface GigabitEthernet0/1
 description to 37_as65004_Russia (37)

 ip address 10.181.0.50 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 30_as65004_Gdansk (30)

 ip address 10.181.0.52 255.255.255.254

