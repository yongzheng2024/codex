 ip address 10.200.6.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!



ip access-list extended ACL_10_GigabitEthernet0_0
 10 permit ip host 10.180.0.29 any
 20 permit ip host 10.181.0.48 any
 30 permit ip host 10.181.0.49 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 28_as65005_Olsztyn (28)

 ip address 10.181.0.48 255.255.255.254

 ip access-group ACL_10_GigabitEthernet0_0 in
