ip prefix-list PL_EXPORT_ALLOWED_32 seq 10 permit 10.200.31.0/24
ip prefix-list PL_EXPORT_ALLOWED_32 seq 20 permit 10.200.32.0/24
ip prefix-list PL_EXPORT_ALLOWED_32 seq 30 permit 10.200.33.0/24
