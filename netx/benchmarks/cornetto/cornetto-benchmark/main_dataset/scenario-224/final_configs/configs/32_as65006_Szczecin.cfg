ip prefix-list PL_EXPORT_DENY_LINK_32_0 seq 10 deny 10.181.0.60/31
!

ip prefix-list PL_EXPORT_DENY_LINK_32_1 seq 10 deny 10.181.0.68/31
!

ip prefix-list PL_EXPORT_DENY_LINK_32_2 seq 10 deny 10.181.0.98/31
!

ip prefix-list PL_EXPORT_DENY_LONG_32 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_32_0 seq 10 deny 10.180.0.33/32
