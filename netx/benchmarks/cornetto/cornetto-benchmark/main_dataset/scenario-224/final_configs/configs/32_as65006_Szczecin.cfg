ip prefix-list PL_OUT_32_31 seq 20 permit 10.200.33.0/24
!




ip community-list standard CL_COMM_32_31 permit 65535:65282
ip community-list standard CL_COMM_32_31 permit no-export
!





route-map RM_POLICY_IN_32_31 permit 5














 match community CL_COMM_32_31
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_32_31 permit 10














 match ip address prefix-list PL_IN_32_31
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_32_31 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_32_31 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_32_31 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_32_0
 ! Block loopback 10.180.0.33/32


route-map RM_POLICY_OUT_32_31 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_0
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_32_31 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_1
 ! Block link 10.181.0.68/31


route-map RM_POLICY_OUT_32_31 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_2
 ! Block link 10.181.0.98/31


route-map RM_POLICY_OUT_32_31 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_32
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_32_31 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_32
 set community no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_32_31 deny 200














 match ip address prefix-list PL_OUT_32_31
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_32_31 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.33
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.34 peer-group IBGP



 !
 neighbor 10.181.0.98 peer-group EBGP
 neighbor 10.181.0.98 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.14 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.34 activate



  neighbor 10.181.0.98 activate
  neighbor 10.181.0.98 route-map RM_POLICY_IN_32_31 in
  neighbor 10.181.0.98 route-map RM_POLICY_OUT_32_31 out





  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

  network 10.200.33.0 mask 255.255.255.0

 exit-address-family
