ip prefix-list PL_BGP_TO_OSPF_DENY_6 seq 30 permit 10.181.0.34/31
ip prefix-list PL_BGP_TO_OSPF_DENY_6 seq 40 permit 10.181.0.36/31
ip prefix-list PL_BGP_TO_OSPF_DENY_6 seq 50 permit 10.181.0.38/31
