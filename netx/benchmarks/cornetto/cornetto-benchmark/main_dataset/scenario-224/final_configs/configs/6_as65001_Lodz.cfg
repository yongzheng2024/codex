 redistribute bgp 65001 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_6

network 10.181.0.12 0.0.0.1 area 0
network 10.181.0.36 0.0.0.1 area 0
network 10.181.0.38 0.0.0.1 area 0
