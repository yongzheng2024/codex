 match ip address prefix-list PL_EXPORT_DENY_LINK_6_3
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_6_20 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_6
 set community 65000:100 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_6_20 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_6
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_6_20 deny 200














 match ip address prefix-list PL_OUT_6_20
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_6_20 deny 65000














 ! Deny other outbound routes

!







