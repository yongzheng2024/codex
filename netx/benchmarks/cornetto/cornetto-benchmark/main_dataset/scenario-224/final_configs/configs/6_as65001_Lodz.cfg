ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 10 permit 10.200.11.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 20 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 30 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 40 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 50 permit 10.200.15.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 60 permit 10.200.16.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 70 permit 10.200.17.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 80 permit 10.200.21.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 90 permit 10.200.22.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 100 permit 10.200.23.0/24
