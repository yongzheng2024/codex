 match ip address prefix-list PL_EXPORT_DENY_LINK_15_1
 ! Block link 10.181.0.72/31


route-map RM_POLICY_OUT_15_50 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_15
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_15_50 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_15
 set metric 21
 set as-path prepend 65003 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_15_50 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.16
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.29 peer-group RR




 !
 neighbor 10.181.0.71 peer-group EBGP
 neighbor 10.181.0.71 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.29 activate




  neighbor 10.181.0.71 activate
  neighbor 10.181.0.71 route-map RM_POLICY_IN_15_50 in
  neighbor 10.181.0.71 route-map RM_POLICY_OUT_15_50 out





  network 10.200.3.0 mask 255.255.255.0

  network 10.200.4.0 mask 255.255.255.0

 exit-address-family
