ip prefix-list PL_EXPORT_ALLOWED_44 seq 10 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_44 seq 20 permit 10.200.20.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_44_0 seq 10 deny 10.181.0.102/31
!

ip prefix-list PL_EXPORT_DENY_LINK_44_1 seq 10 deny 10.181.0.122/31
!

ip prefix-list PL_EXPORT_DENY_LINK_44_2 seq 10 deny 10.181.0.124/31
!

ip prefix-list PL_EXPORT_DENY_LINK_44_3 seq 10 deny 10.181.0.126/31
!

ip prefix-list PL_EXPORT_DENY_LINK_44_4 seq 10 deny 10.181.0.128/31
!

ip prefix-list PL_EXPORT_DENY_LONG_44 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_44_0 seq 10 deny 10.180.0.45/32
!

ip prefix-list PL_IN_44_34 seq 10 permit 10.181.0.56/31
ip prefix-list PL_IN_44_34 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_44_34 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_44_34 seq 10 permit 10.200.19.0/24
!




ip community-list standard CL_COMM_44_34 permit no-advertise
!





route-map RM_POLICY_IN_44_34 permit 5














 match community CL_COMM_44_34
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_44_34 permit 10














 match ip address prefix-list PL_IN_44_34
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_44_34 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_44_34 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_44_34 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_44_0
 ! Block loopback 10.180.0.45/32


route-map RM_POLICY_OUT_44_34 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_44_0
 ! Block link 10.181.0.102/31


route-map RM_POLICY_OUT_44_34 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_44_1
 ! Block link 10.181.0.122/31


route-map RM_POLICY_OUT_44_34 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_44_2
 ! Block link 10.181.0.124/31


route-map RM_POLICY_OUT_44_34 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_44_3
 ! Block link 10.181.0.126/31


route-map RM_POLICY_OUT_44_34 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_44
 set metric 15
 set as-path prepend 65007 65007
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_44_34 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_44_4
 ! Block link 10.181.0.128/31


route-map RM_POLICY_OUT_44_34 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_44
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_44_34 deny 200














 match ip address prefix-list PL_OUT_44_34
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_44_34 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.45
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.45


 !
 neighbor RR peer-group
 neighbor RR remote-as 65007
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65007
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.71 peer-group RR



 !
 neighbor 10.180.0.43 peer-group IBGP


 !
 neighbor 10.180.0.46 peer-group IBGP



 !
 neighbor 10.181.0.102 peer-group EBGP
 neighbor 10.181.0.102 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.71 activate



  neighbor 10.180.0.43 activate
  neighbor 10.180.0.43 next-hop-self


  neighbor 10.180.0.46 activate
  neighbor 10.180.0.46 next-hop-self



  neighbor 10.181.0.102 activate
  neighbor 10.181.0.102 route-map RM_POLICY_IN_44_34 in
  neighbor 10.181.0.102 route-map RM_POLICY_OUT_44_34 out





  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

 exit-address-family
