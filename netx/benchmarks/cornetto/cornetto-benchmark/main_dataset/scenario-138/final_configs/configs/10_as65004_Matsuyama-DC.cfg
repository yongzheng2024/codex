router bgp 65004
 bgp router-id 10.180.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.11


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.60 peer-group RR



 !
 neighbor 10.180.0.28 peer-group IBGP


 !
 neighbor 10.180.0.53 peer-group IBGP


 !
 neighbor 10.180.0.55 peer-group IBGP


