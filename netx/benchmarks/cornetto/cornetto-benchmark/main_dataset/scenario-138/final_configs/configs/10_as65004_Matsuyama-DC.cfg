ip community-list standard CL_COMM_10_0 permit 65535:65282
!





route-map RM_POLICY_IN_10_0 permit 5














 match community CL_COMM_10_0
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_10_0 permit 10














 match ip address prefix-list PL_IN_10_0
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_10_0 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_10_0 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_10_0 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_0 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_10_0 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_10_0 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_2
 ! Block link 10.181.0.34/31


