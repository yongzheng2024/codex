 match ip address prefix-list PL_EXPORT_ALLOWED_10
 set community 65000:200 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_10_0 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_4
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_10_0 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_10
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_10_0 deny 200














 match ip address prefix-list PL_OUT_10_0
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_10_0 deny 65000














 ! Deny other outbound routes

