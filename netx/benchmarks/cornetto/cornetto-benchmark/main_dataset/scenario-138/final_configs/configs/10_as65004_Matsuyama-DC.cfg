  neighbor 10.180.0.60 activate



  neighbor 10.180.0.28 activate
  neighbor 10.180.0.28 next-hop-self


  neighbor 10.180.0.53 activate
  neighbor 10.180.0.53 next-hop-self


  neighbor 10.180.0.55 activate
