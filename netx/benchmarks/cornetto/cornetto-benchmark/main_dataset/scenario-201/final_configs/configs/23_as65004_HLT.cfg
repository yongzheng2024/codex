
hostname 23_as65004_HLT
!
interface Loopback0
 ip address 10.180.0.24 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.13.0/24


 ip address 10.200.13.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.14.0/24


 ip address 10.200.14.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.15.0/24


 ip address 10.200.15.1 255.255.255.0
!



ip access-list extended ACL_23_GigabitEthernet0_1
 10 permit ip host 10.180.0.25 any
 20 permit ip host 10.181.0.58 any
 30 permit ip host 10.181.0.59 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_23_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.24 any
 20 permit ip host 10.181.0.57 any
 30 permit ip host 10.181.0.58 any
 40 permit ip 10.181.0.56 0.0.0.1 any
 50 permit ip 10.181.0.58 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 22_as65004_ROT (22)

 ip address 10.181.0.57 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 24_as65003_AKL (24)

 ip address 10.181.0.58 255.255.255.254

 ip access-group ACL_23_GigabitEthernet0_1 in

 ip access-group ACL_23_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.13.0 255.255.255.0 Loopback100
ip route 10.200.14.0 255.255.255.0 Loopback101
ip route 10.200.15.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.24
 passive-interface Loopback0
 network 10.180.0.24 0.0.0.0 area 0










 redistribute bgp 65004 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_23

network 10.181.0.56 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_23 seq 10 permit 10.200.16.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_23 seq 20 permit 10.200.17.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_23 seq 30 permit 10.200.18.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_23 seq 10 permit 10.180.0.24/32
ip prefix-list PL_BGP_TO_OSPF_DENY_23 seq 20 permit 10.181.0.56/31
ip prefix-list PL_BGP_TO_OSPF_DENY_23 seq 30 permit 10.181.0.58/31
!

ip prefix-list PL_EXPORT_ALLOWED_23 seq 10 permit 10.200.13.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 20 permit 10.200.14.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 30 permit 10.200.15.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_23_0 seq 10 deny 10.181.0.56/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_1 seq 10 deny 10.181.0.58/31
!

ip prefix-list PL_EXPORT_DENY_LONG_23 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_23_0 seq 10 deny 10.180.0.24/32
!




ip community-list standard CL_COMM_23_24 permit no-advertise
!





route-map RM_BGP_TO_OSPF_23 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_23 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_23
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_23 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_23
 set tag 65010

!


route-map RM_POLICY_IN_23_24 permit 5














 match community CL_COMM_23_24
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_23_24 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_23_24 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_23_24 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_23_0
 ! Block loopback 10.180.0.24/32


route-map RM_POLICY_OUT_23_24 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_0
 ! Block link 10.181.0.56/31


route-map RM_POLICY_OUT_23_24 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_1
 ! Block link 10.181.0.58/31


route-map RM_POLICY_OUT_23_24 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_23
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_23_24 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_23
 set metric 24
 set as-path prepend 65004 65004
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_23_24 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.24
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.22 peer-group RR




 !
 neighbor 10.181.0.59 peer-group EBGP
 neighbor 10.181.0.59 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.22 activate




  neighbor 10.181.0.59 activate
  neighbor 10.181.0.59 route-map RM_POLICY_IN_23_24 in
  neighbor 10.181.0.59 route-map RM_POLICY_OUT_23_24 out





  network 10.200.13.0 mask 255.255.255.0

  network 10.200.14.0 mask 255.255.255.0

  network 10.200.15.0 mask 255.255.255.0

 exit-address-family
