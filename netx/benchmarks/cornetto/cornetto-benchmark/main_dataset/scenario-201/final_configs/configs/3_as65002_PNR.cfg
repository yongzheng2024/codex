ip route 10.200.19.0 255.255.255.0 Loopback100
ip route 10.200.20.0 255.255.255.0 Loopback101
ip route 10.200.21.0 255.255.255.0 Loopback102
ip route 10.200.22.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.4
 passive-interface Loopback0
 network 10.180.0.4 0.0.0.0 area 0










 redistribute bgp 65002 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_3

network 10.181.0.24 0.0.0.1 area 0
network 10.181.0.26 0.0.0.1 area 0
network 10.181.0.28 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 10 permit 10.200.16.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 20 permit 10.200.17.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 30 permit 10.200.18.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 10 permit 10.180.0.4/32
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 20 permit 10.181.0.4/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 30 permit 10.181.0.22/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 40 permit 10.181.0.24/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 50 permit 10.181.0.26/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 60 permit 10.181.0.28/31
