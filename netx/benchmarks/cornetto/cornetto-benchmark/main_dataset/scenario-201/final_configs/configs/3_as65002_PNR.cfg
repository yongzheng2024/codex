ip prefix-list PL_IN_3_24 seq 10 permit 10.181.0.48/31
ip prefix-list PL_IN_3_24 seq 20 permit 10.181.0.44/31
ip prefix-list PL_IN_3_24 seq 30 permit 10.181.0.58/31
ip prefix-list PL_IN_3_24 seq 40 permit 10.180.0.25/32
ip prefix-list PL_IN_3_24 seq 50 permit 10.200.0.0/16 le 24
