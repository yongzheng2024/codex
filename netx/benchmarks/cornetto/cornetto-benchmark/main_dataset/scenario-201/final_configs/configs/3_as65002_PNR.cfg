  neighbor 10.180.0.3 activate



  neighbor 10.180.0.13 activate
  neighbor 10.180.0.13 next-hop-self


  neighbor 10.180.0.15 activate
  neighbor 10.180.0.15 next-hop-self



  neighbor 10.181.0.4 activate
  neighbor 10.181.0.4 route-map RM_POLICY_IN_3_0 in
  neighbor 10.181.0.4 route-map RM_POLICY_OUT_3_0 out


  neighbor 10.181.0.23 activate
  neighbor 10.181.0.23 route-map RM_POLICY_IN_3_24 in
  neighbor 10.181.0.23 route-map RM_POLICY_OUT_3_24 out





  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

