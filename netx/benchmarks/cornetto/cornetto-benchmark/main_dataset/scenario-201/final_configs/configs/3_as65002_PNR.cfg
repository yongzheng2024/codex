ip prefix-list PL_OUT_3_0 seq 10 permit 10.200.19.0/24
ip prefix-list PL_OUT_3_0 seq 20 permit 10.200.21.0/24
!

ip prefix-list PL_OUT_3_24 seq 10 permit 10.200.20.0/24
ip prefix-list PL_OUT_3_24 seq 20 permit 10.200.19.0/24
!




ip community-list standard CL_COMM_3_24 permit no-advertise
ip community-list standard CL_COMM_3_24 permit no-export
!





route-map RM_BGP_TO_OSPF_3 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_3 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_3
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_3 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_3
 set tag 65010

!


route-map RM_POLICY_IN_3_0 permit 10














 match ip address prefix-list PL_IN_3_0
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_3_0 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_IN_3_24 permit 5














 match community CL_COMM_3_24
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_3_24 permit 10














 match ip address prefix-list PL_IN_3_24
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_3_24 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_3_24 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_3_0 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_0 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_3_0 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_3_0 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_2
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_3_0 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_3
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_3_0 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_3
 set metric 27
 set as-path prepend 65002 65002 65002
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_3_0 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_4
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_3_0 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_0 deny 200














 match ip address prefix-list PL_OUT_3_0
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_3_0 deny 65000














 ! Deny other outbound routes

!


route-map RM_POLICY_OUT_3_24 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_24 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_3_24 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.24/31


