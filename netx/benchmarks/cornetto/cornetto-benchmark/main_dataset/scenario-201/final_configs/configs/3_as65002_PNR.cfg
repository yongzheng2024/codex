 set as-path prepend 65002
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_3_24 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_4
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_3_24 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_24 deny 200














 match ip address prefix-list PL_OUT_3_24
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_3_24 deny 65000














 ! Deny other outbound routes

