ip prefix-list PL_EXPORT_ALLOWED_3 seq 10 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 20 permit 10.200.20.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 30 permit 10.200.21.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 40 permit 10.200.22.0/24
