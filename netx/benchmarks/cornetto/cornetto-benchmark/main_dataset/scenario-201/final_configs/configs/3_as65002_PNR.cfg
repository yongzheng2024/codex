router bgp 65002
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.4


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.3 peer-group RR



 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP



 !
 neighbor 10.181.0.4 peer-group EBGP
 neighbor 10.181.0.4 remote-as 65001


 !
 neighbor 10.181.0.23 peer-group EBGP
 neighbor 10.181.0.23 remote-as 65003


