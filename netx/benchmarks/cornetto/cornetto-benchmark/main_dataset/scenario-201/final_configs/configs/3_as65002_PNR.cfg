!

ip prefix-list PL_EXPORT_DENY_LINK_3_1 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_2 seq 10 deny 10.181.0.26/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_3 seq 10 deny 10.181.0.28/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_4 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_3 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_3_0 seq 10 deny 10.180.0.4/32
!

ip prefix-list PL_IN_3_0 seq 10 permit 10.200.0.0/24
ip prefix-list PL_IN_3_0 seq 20 permit 10.181.0.0/31
ip prefix-list PL_IN_3_0 seq 30 permit 10.181.0.6/31
ip prefix-list PL_IN_3_0 seq 40 permit 10.181.0.4/31
ip prefix-list PL_IN_3_0 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_3_0 seq 60 deny 0.0.0.0/0
