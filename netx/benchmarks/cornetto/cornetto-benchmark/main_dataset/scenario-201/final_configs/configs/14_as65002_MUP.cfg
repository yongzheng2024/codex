
hostname 14_as65002_MUP
!
interface Loopback0
 ip address 10.180.0.15 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!



ip access-list extended ACL_14_GigabitEthernet0_2_OUT
 10 permit ip host 10.180.0.15 any
 20 permit ip host 10.181.0.21 any
 30 permit ip host 10.181.0.29 any
 40 permit ip host 10.181.0.40 any
 50 permit ip 10.181.0.20 0.0.0.1 any
 60 permit ip 10.181.0.28 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 2_as65002_AVL (2)

 ip address 10.181.0.21 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 3_as65002_PNR (3)

 ip address 10.181.0.29 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 21_as65004_NAP (21)

 ip address 10.181.0.40 255.255.255.254

 ip access-group ACL_14_GigabitEthernet0_2_OUT out
 mtu 1500
!


ip route 10.200.2.0 255.255.255.0 Loopback100
ip route 10.200.3.0 255.255.255.0 Loopback101
ip route 10.200.4.0 255.255.255.0 Loopback102
ip route 10.200.5.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.15
 passive-interface Loopback0
 network 10.180.0.15 0.0.0.0 area 0










 redistribute bgp 65002 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_14

network 10.181.0.20 0.0.0.1 area 0
network 10.181.0.28 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_14 seq 10 permit 10.200.9.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_14 seq 20 permit 10.200.10.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_14 seq 30 permit 10.200.11.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_14 seq 40 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_14 seq 50 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_14 seq 60 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_14 seq 70 permit 10.200.15.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_14 seq 10 permit 10.180.0.15/32
ip prefix-list PL_BGP_TO_OSPF_DENY_14 seq 20 permit 10.181.0.20/31
ip prefix-list PL_BGP_TO_OSPF_DENY_14 seq 30 permit 10.181.0.28/31
ip prefix-list PL_BGP_TO_OSPF_DENY_14 seq 40 permit 10.181.0.40/31
!

ip prefix-list PL_EXPORT_ALLOWED_14 seq 10 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_14 seq 20 permit 10.200.3.0/24
ip prefix-list PL_EXPORT_ALLOWED_14 seq 30 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_14 seq 40 permit 10.200.5.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_14_0 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LINK_14_1 seq 10 deny 10.181.0.28/31
!

ip prefix-list PL_EXPORT_DENY_LINK_14_2 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LONG_14 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_14_0 seq 10 deny 10.180.0.15/32
!

ip prefix-list PL_IN_14_21 seq 10 permit 10.200.11.0/24
ip prefix-list PL_IN_14_21 seq 20 permit 10.181.0.52/31
ip prefix-list PL_IN_14_21 seq 30 permit 10.200.12.0/24
ip prefix-list PL_IN_14_21 seq 40 permit 10.200.10.0/24
ip prefix-list PL_IN_14_21 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_14_21 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_14_21 seq 10 permit 10.200.2.0/24
ip prefix-list PL_OUT_14_21 seq 20 permit 10.200.3.0/24
!






route-map RM_BGP_TO_OSPF_14 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_14 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_14
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_14 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_14
 set tag 65010

!


route-map RM_POLICY_IN_14_21 permit 10














 match ip address prefix-list PL_IN_14_21
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_14_21 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_14_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_14_0
 ! Block loopback 10.180.0.15/32


route-map RM_POLICY_OUT_14_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_0
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_14_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_1
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_14_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_2
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_14_21 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_14
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_14_21 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_14
 set community 65000:100 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_14_21 deny 200














 match ip address prefix-list PL_OUT_14_21
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_14_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.15
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.4 peer-group RR




 !
 neighbor 10.181.0.41 peer-group EBGP
 neighbor 10.181.0.41 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.4 activate




  neighbor 10.181.0.41 activate
  neighbor 10.181.0.41 route-map RM_POLICY_IN_14_21 in
  neighbor 10.181.0.41 route-map RM_POLICY_OUT_14_21 out





  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

 exit-address-family
