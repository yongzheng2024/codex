
hostname 6_as65001_IVM
!
interface Loopback0
 ip address 10.180.0.7 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 1_as65001_DUD (1)

 ip address 10.181.0.13 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 1_as65001_DUD (1)

 ip address 10.181.0.15 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.7
 passive-interface Loopback0
 network 10.180.0.7 0.0.0.0 area 0



network 10.181.0.12 0.0.0.1 area 0
network 10.181.0.14 0.0.0.1 area 0
!








router bgp 65001
 bgp router-id 10.180.0.7
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0




 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.10 peer-group IBGP



 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.8 activate


  neighbor 10.180.0.9 activate


  neighbor 10.180.0.10 activate






