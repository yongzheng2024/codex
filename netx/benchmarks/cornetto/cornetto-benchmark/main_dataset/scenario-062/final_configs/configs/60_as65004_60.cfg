 redistribute bgp 65004 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_60

network 10.181.0.138 0.0.0.1 area 0
network 10.181.0.174 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_60 seq 10 permit 10.200.0.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_60 seq 20 permit 10.200.1.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_60 seq 30 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_60 seq 40 permit 10.200.3.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_60 seq 10 permit 10.180.0.61/32
ip prefix-list PL_BGP_TO_OSPF_DENY_60 seq 20 permit 10.181.0.138/31
ip prefix-list PL_BGP_TO_OSPF_DENY_60 seq 30 permit 10.181.0.174/31
ip prefix-list PL_BGP_TO_OSPF_DENY_60 seq 40 permit 10.181.0.176/31
