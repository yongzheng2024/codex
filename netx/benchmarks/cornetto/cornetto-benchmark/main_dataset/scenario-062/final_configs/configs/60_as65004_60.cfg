!




ip community-list standard CL_COMM_60_102 permit no-export
!





route-map RM_BGP_TO_OSPF_60 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_60 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_60
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_60 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_60
 set tag 65010

!


route-map RM_POLICY_IN_60_102 permit 5














 match community CL_COMM_60_102
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_60_102 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_60_102 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_60_0
 ! Block loopback 10.180.0.61/32


route-map RM_POLICY_OUT_60_102 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_60_0
 ! Block link 10.181.0.138/31


route-map RM_POLICY_OUT_60_102 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_60_1
 ! Block link 10.181.0.174/31


route-map RM_POLICY_OUT_60_102 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_60_2
 ! Block link 10.181.0.176/31


route-map RM_POLICY_OUT_60_102 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_60
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_60_102 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_60
 set community no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_60_102 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.61
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.14 peer-group RR




