 neighbor 10.181.0.177 peer-group EBGP
 neighbor 10.181.0.177 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.14 activate




  neighbor 10.181.0.177 activate
  neighbor 10.181.0.177 route-map RM_POLICY_IN_60_102 in
  neighbor 10.181.0.177 route-map RM_POLICY_OUT_60_102 out





  network 10.200.27.0 mask 255.255.255.0

  network 10.200.28.0 mask 255.255.255.0

 exit-address-family
