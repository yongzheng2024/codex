
hostname 2_as65003_2
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.24.0/24


 ip address 10.200.24.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.25.0/24


 ip address 10.200.25.1 255.255.255.0
!



ip access-list extended ACL_2_GigabitEthernet0_0
 10 permit ip host 10.180.0.2 any
 20 permit ip host 10.181.0.4 any
 30 permit ip host 10.181.0.5 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 1_as65001_1 (1)

 ip address 10.181.0.5 255.255.255.254

 ip access-group ACL_2_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 12_as65004_12 (12)

 ip address 10.181.0.12 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 20_as65003_20 (20)

 ip address 10.181.0.14 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.24.0 255.255.255.0 Loopback100
ip route 10.200.25.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0



network 10.181.0.14 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_2 seq 10 permit 10.200.24.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 20 permit 10.200.25.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_2_0 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_1 seq 10 deny 10.181.0.14/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_2 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_2 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_2_0 seq 10 deny 10.180.0.3/32
!






route-map RM_POLICY_OUT_2_1 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_1 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_2_1 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_2_1 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_2
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_2_1 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_1 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_2
 set community 65000:200 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_2_1 deny 65000














 ! Deny other outbound routes

!


route-map RM_POLICY_OUT_2_12 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_12 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_2_12 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_2_12 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_2
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_2_12 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_12 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_2
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_2_12 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP



 !
 neighbor 10.181.0.4 peer-group EBGP
 neighbor 10.181.0.4 remote-as 65001


 !
 neighbor 10.181.0.13 peer-group EBGP
 neighbor 10.181.0.13 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.21 activate



  neighbor 10.181.0.4 activate
  neighbor 10.181.0.4 route-map RM_POLICY_OUT_2_1 out


  neighbor 10.181.0.13 activate
  neighbor 10.181.0.13 route-map RM_POLICY_OUT_2_12 out





  network 10.200.24.0 mask 255.255.255.0

  network 10.200.25.0 mask 255.255.255.0

 exit-address-family
