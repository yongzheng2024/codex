
hostname 12_as65004_12
!
interface Loopback0
 ip address 10.180.0.13 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!



ip access-list extended ACL_12_GigabitEthernet0_0
 10 permit ip host 10.180.0.3 any
 20 permit ip host 10.181.0.12 any
 30 permit ip host 10.181.0.13 any
 40 deny ip 192.0.2.0 0.0.0.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 2_as65003_2 (2)

 ip address 10.181.0.13 255.255.255.254

 ip access-group ACL_12_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65004_11 (11)

 ip address 10.181.0.39 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.7.0 255.255.255.0 Loopback100
ip route 10.200.8.0 255.255.255.0 Loopback101
ip route 10.200.9.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.13
 passive-interface Loopback0
 network 10.180.0.13 0.0.0.0 area 0



network 10.181.0.38 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_12 seq 10 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_12 seq 20 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_12 seq 30 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_12_0 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_12_1 seq 10 deny 10.181.0.38/31
!

ip prefix-list PL_EXPORT_DENY_LONG_12 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_12_0 seq 10 deny 10.180.0.13/32
!

ip prefix-list PL_IN_12_2 seq 10 permit 10.181.0.12/31
ip prefix-list PL_IN_12_2 seq 20 permit 10.200.24.0/24
ip prefix-list PL_IN_12_2 seq 30 permit 10.200.25.0/24
ip prefix-list PL_IN_12_2 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_12_2 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_12_2 seq 10 permit 10.200.9.0/24
ip prefix-list PL_OUT_12_2 seq 20 permit 10.200.7.0/24
!






route-map RM_POLICY_IN_12_2 permit 10














 match ip address prefix-list PL_IN_12_2
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_12_2 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_12_2 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_12_0
 ! Block loopback 10.180.0.13/32


route-map RM_POLICY_OUT_12_2 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_12_2 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_1
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_12_2 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_12
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_12_2 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_12
 set metric 27
 set as-path prepend 65004 65004 65004
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_12_2 deny 200














 match ip address prefix-list PL_OUT_12_2
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_12_2 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.13
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP



 !
 neighbor 10.181.0.12 peer-group EBGP
 neighbor 10.181.0.12 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.14 activate


  neighbor 10.180.0.15 activate



  neighbor 10.181.0.12 activate
  neighbor 10.181.0.12 route-map RM_POLICY_IN_12_2 in
  neighbor 10.181.0.12 route-map RM_POLICY_OUT_12_2 out





  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
