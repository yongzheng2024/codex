
hostname 8_as65002_8
!
interface Loopback0
 ip address 10.180.0.9 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.26.0/24


 ip address 10.200.26.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.27.0/24


 ip address 10.200.27.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 9_as65002_9 (9)

 ip address 10.181.0.24 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 14_as65004_14 (14)

 ip address 10.181.0.26 255.255.255.254
 mtu 1500
!


ip route 10.200.26.0 255.255.255.0 Loopback100
ip route 10.200.27.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.9
 passive-interface Loopback0
 network 10.180.0.9 0.0.0.0 area 0



network 10.181.0.24 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_8 seq 10 permit 10.200.26.0/24
ip prefix-list PL_EXPORT_ALLOWED_8 seq 20 permit 10.200.27.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_8_0 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_8_1 seq 10 deny 10.181.0.26/31
!

ip prefix-list PL_EXPORT_DENY_LONG_8 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_8_0 seq 10 deny 10.180.0.9/32
!






route-map RM_POLICY_IN_8_14 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_8_14 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_8_0
 ! Block loopback 10.180.0.9/32


route-map RM_POLICY_OUT_8_14 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_0
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_8_14 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_1
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_8_14 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_8
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_8_14 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_8
 set metric 14
 set as-path prepend 65002 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_8_14 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.9
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.19 peer-group IBGP



 !
 neighbor 10.181.0.27 peer-group EBGP
 neighbor 10.181.0.27 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.10 activate


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.19 activate



  neighbor 10.181.0.27 activate
  neighbor 10.181.0.27 route-map RM_POLICY_IN_8_14 in
  neighbor 10.181.0.27 route-map RM_POLICY_OUT_8_14 out





  network 10.200.26.0 mask 255.255.255.0

  network 10.200.27.0 mask 255.255.255.0

 exit-address-family
