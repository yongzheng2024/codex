
hostname 15_as65002_15
!
interface Loopback0
 ip address 10.180.0.16 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.14.0/24


 ip address 10.200.14.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.15.0/24


 ip address 10.200.15.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.16.0/24


 ip address 10.200.16.1 255.255.255.0
!



ip access-list extended ACL_15_GigabitEthernet0_1
 10 permit ip host 10.180.0.15 any
 20 permit ip host 10.181.0.46 any
 30 permit ip host 10.181.0.47 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 10_as65002_10 (10)

 ip address 10.181.0.35 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 14_as65004_14 (14)

 ip address 10.181.0.47 255.255.255.254

 ip access-group ACL_15_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.14.0 255.255.255.0 Loopback100
ip route 10.200.15.0 255.255.255.0 Loopback101
ip route 10.200.16.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.16
 passive-interface Loopback0
 network 10.180.0.16 0.0.0.0 area 0



network 10.181.0.34 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_15 seq 10 permit 10.200.14.0/24
ip prefix-list PL_EXPORT_ALLOWED_15 seq 20 permit 10.200.15.0/24
ip prefix-list PL_EXPORT_ALLOWED_15 seq 30 permit 10.200.16.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_15_0 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_15_1 seq 10 deny 10.181.0.46/31
!

ip prefix-list PL_EXPORT_DENY_LONG_15 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_15_0 seq 10 deny 10.180.0.16/32
!

ip prefix-list PL_IN_15_14 seq 10 permit 10.200.13.0/24
ip prefix-list PL_IN_15_14 seq 20 permit 10.200.12.0/24
ip prefix-list PL_IN_15_14 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_15_14 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_15_14 seq 10 permit 10.200.15.0/24
ip prefix-list PL_OUT_15_14 seq 20 permit 10.200.14.0/24
!






route-map RM_POLICY_IN_15_14 permit 10














 match ip address prefix-list PL_IN_15_14
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_15_14 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_15_14 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_15_0
 ! Block loopback 10.180.0.16/32


route-map RM_POLICY_OUT_15_14 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_0
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_15_14 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_1
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_15_14 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_15
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_15_14 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_15
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_15_14 deny 200














 match ip address prefix-list PL_OUT_15_14
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_15_14 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.16
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.19 peer-group IBGP



 !
 neighbor 10.181.0.46 peer-group EBGP
 neighbor 10.181.0.46 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.9 activate


  neighbor 10.180.0.10 activate


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.19 activate



  neighbor 10.181.0.46 activate
  neighbor 10.181.0.46 route-map RM_POLICY_IN_15_14 in
  neighbor 10.181.0.46 route-map RM_POLICY_OUT_15_14 out





  network 10.200.14.0 mask 255.255.255.0

  network 10.200.15.0 mask 255.255.255.0

  network 10.200.16.0 mask 255.255.255.0

 exit-address-family
