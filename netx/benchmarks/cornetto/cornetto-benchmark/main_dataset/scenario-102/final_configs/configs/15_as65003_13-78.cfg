  neighbor 10.181.0.69 route-map RM_POLICY_IN_15_28 in
  neighbor 10.181.0.69 route-map RM_POLICY_OUT_15_28 out





  network 10.200.6.0 mask 255.255.255.0

  network 10.200.7.0 mask 255.255.255.0

