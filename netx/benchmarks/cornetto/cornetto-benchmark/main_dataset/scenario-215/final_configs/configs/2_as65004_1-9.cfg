
hostname 2_as65004_1-9
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.12.0/24


 ip address 10.200.12.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.13.0/24


 ip address 10.200.13.1 255.255.255.0
!



ip access-list extended ACL_2_GigabitEthernet0_1
 10 permit ip host 10.180.0.22 any
 20 permit ip host 10.181.0.10 any
 30 permit ip host 10.181.0.11 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 24_as65004_0-33333 (24)

 ip address 10.181.0.8 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 21_as65003_2-3488 (21)

 ip address 10.181.0.10 255.255.255.254

 ip access-group ACL_2_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.12.0 255.255.255.0 Loopback100
ip route 10.200.13.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.ec00.0000.0ab4.0003.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_2 seq 10 permit 10.200.12.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 20 permit 10.200.13.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_2_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_1 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_2 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_2_0 seq 10 deny 10.180.0.3/32
!






route-map RM_POLICY_OUT_2_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_2_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_2_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_21 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_2
 set community 65000:200 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_2_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.4 peer-group IBGP


 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP



 !
 neighbor 10.181.0.11 peer-group EBGP
 neighbor 10.181.0.11 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.4 activate


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.25 activate



  neighbor 10.181.0.11 activate
  neighbor 10.181.0.11 route-map RM_POLICY_OUT_2_21 out





  network 10.200.12.0 mask 255.255.255.0

  network 10.200.13.0 mask 255.255.255.0

 exit-address-family
