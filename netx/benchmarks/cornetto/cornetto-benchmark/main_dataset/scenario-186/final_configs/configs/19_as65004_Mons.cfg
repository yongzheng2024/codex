
hostname 19_as65004_Mons
!
interface Loopback0
 ip address 10.180.0.20 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.13.0/24


 ip address 10.200.13.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.14.0/24


 ip address 10.200.14.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 7_as65002_Vilvoorde (7)

 ip address 10.181.0.37 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 20_as65004_Charleroi (20)

 ip address 10.181.0.60 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.13.0 255.255.255.0 Loopback100
ip route 10.200.14.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.20
 passive-interface Loopback0
 network 10.180.0.20 0.0.0.0 area 0



network 10.181.0.60 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_19 seq 10 permit 10.200.13.0/24
ip prefix-list PL_EXPORT_ALLOWED_19 seq 20 permit 10.200.14.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_19_0 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LINK_19_1 seq 10 deny 10.181.0.60/31
!

ip prefix-list PL_EXPORT_DENY_LONG_19 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_19_0 seq 10 deny 10.180.0.20/32
!

ip prefix-list PL_IN_19_7 seq 10 permit 10.200.27.0/24
ip prefix-list PL_IN_19_7 seq 20 permit 10.200.28.0/24
ip prefix-list PL_IN_19_7 seq 30 permit 10.181.0.30/31
ip prefix-list PL_IN_19_7 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_19_7 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_19_7 seq 10 permit 10.200.14.0/24
ip prefix-list PL_OUT_19_7 seq 20 permit 10.200.13.0/24
!






route-map RM_POLICY_IN_19_7 permit 10














 match ip address prefix-list PL_IN_19_7
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_19_7 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_19_7 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_19_0
 ! Block loopback 10.180.0.20/32


route-map RM_POLICY_OUT_19_7 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_19_0
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_19_7 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_19_1
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_19_7 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_19
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_19_7 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_19
 set metric 29
 set as-path prepend 65004 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_19_7 deny 200














 match ip address prefix-list PL_OUT_19_7
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_19_7 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.20
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP



 !
 neighbor 10.181.0.36 peer-group EBGP
 neighbor 10.181.0.36 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.21 activate



  neighbor 10.181.0.36 activate
  neighbor 10.181.0.36 route-map RM_POLICY_IN_19_7 in
  neighbor 10.181.0.36 route-map RM_POLICY_OUT_19_7 out





  network 10.200.13.0 mask 255.255.255.0

  network 10.200.14.0 mask 255.255.255.0

 exit-address-family
