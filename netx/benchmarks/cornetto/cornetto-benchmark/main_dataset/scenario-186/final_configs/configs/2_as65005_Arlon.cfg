
hostname 2_as65005_Arlon
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.15.0/24


 ip address 10.200.15.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.16.0/24


 ip address 10.200.16.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.17.0/24


 ip address 10.200.17.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.18.0/24


 ip address 10.200.18.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 11_as65004_Namur (11)

 ip address 10.181.0.10 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 3_as65005_Liege-2 (3)

 ip address 10.181.0.12 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.15.0 255.255.255.0 Loopback100
ip route 10.200.16.0 255.255.255.0 Loopback101
ip route 10.200.17.0 255.255.255.0 Loopback102
ip route 10.200.18.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0



network 10.181.0.12 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_2 seq 10 permit 10.200.15.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 20 permit 10.200.16.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 30 permit 10.200.17.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 40 permit 10.200.18.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_2_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_1 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LONG_2 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_2_0 seq 10 deny 10.180.0.3/32
!






route-map RM_POLICY_IN_2_11 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_2_11 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_11 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_2_11 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_2_11 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_11 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_2
 set metric 18
 set as-path prepend 65005 65005
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_2_11 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.4 peer-group IBGP



 !
 neighbor 10.181.0.11 peer-group EBGP
 neighbor 10.181.0.11 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.4 activate



  neighbor 10.181.0.11 activate
  neighbor 10.181.0.11 route-map RM_POLICY_IN_2_11 in
  neighbor 10.181.0.11 route-map RM_POLICY_OUT_2_11 out





  network 10.200.15.0 mask 255.255.255.0

  network 10.200.16.0 mask 255.255.255.0

  network 10.200.17.0 mask 255.255.255.0

  network 10.200.18.0 mask 255.255.255.0

 exit-address-family
