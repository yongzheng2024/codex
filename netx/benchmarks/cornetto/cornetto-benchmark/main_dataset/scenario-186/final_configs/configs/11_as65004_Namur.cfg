
hostname 11_as65004_Namur
!
interface Loopback0
 ip address 10.180.0.12 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 2_as65005_Arlon (2)

 ip address 10.181.0.11 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 10_as65004_Louvain-la-Neuve (10)

 ip address 10.181.0.43 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.4.0 255.255.255.0 Loopback100
ip route 10.200.5.0 255.255.255.0 Loopback101
ip route 10.200.6.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.12
 passive-interface Loopback0
 network 10.180.0.12 0.0.0.0 area 0



network 10.181.0.42 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_11 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_11 seq 20 permit 10.200.5.0/24
ip prefix-list PL_EXPORT_ALLOWED_11 seq 30 permit 10.200.6.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_11_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_11_1 seq 10 deny 10.181.0.42/31
!

ip prefix-list PL_EXPORT_DENY_LONG_11 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_11_0 seq 10 deny 10.180.0.12/32
!






route-map RM_POLICY_IN_11_2 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_11_2 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_11_0
 ! Block loopback 10.180.0.12/32


route-map RM_POLICY_OUT_11_2 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_11_2 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_1
 ! Block link 10.181.0.42/31


route-map RM_POLICY_OUT_11_2 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_11
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_11_2 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_11
 set metric 26
 set as-path prepend 65004
 set community no-advertise no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_11_2 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.12
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP



 !
 neighbor 10.181.0.10 peer-group EBGP
 neighbor 10.181.0.10 remote-as 65005


 !
 address-family ipv4


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.21 activate



  neighbor 10.181.0.10 activate
  neighbor 10.181.0.10 route-map RM_POLICY_OUT_11_2 in
  neighbor 10.181.0.10 route-map RM_POLICY_IN_11_2 out





  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

  network 10.200.6.0 mask 255.255.255.0

 exit-address-family
