route-map RM_POLICY_OUT_17_6 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_17
 set metric 7
 set as-path prepend 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_17_6 deny 65000














