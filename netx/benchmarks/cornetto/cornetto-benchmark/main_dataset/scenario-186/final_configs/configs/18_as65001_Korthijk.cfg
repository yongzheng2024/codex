
hostname 18_as65001_Korthijk
!
interface Loopback0
 ip address 10.180.0.19 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.12.0/24


 ip address 10.200.12.1 255.255.255.0
!



ip access-list extended ACL_18_GigabitEthernet0_0
 10 permit ip host 10.180.0.8 any
 20 permit ip host 10.181.0.34 any
 30 permit ip host 10.181.0.35 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 7_as65002_Vilvoorde (7)

 ip address 10.181.0.35 255.255.255.254

 ip access-group ACL_18_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 13_as65001_Brugge (13)

 ip address 10.181.0.47 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.11.0 255.255.255.0 Loopback100
ip route 10.200.12.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.19
 passive-interface Loopback0
 network 10.180.0.19 0.0.0.0 area 0



network 10.181.0.46 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_18 seq 10 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_18 seq 20 permit 10.200.12.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_18_0 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_18_1 seq 10 deny 10.181.0.46/31
!

ip prefix-list PL_EXPORT_DENY_LONG_18 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_18_0 seq 10 deny 10.180.0.19/32
!

ip prefix-list PL_IN_18_7 seq 10 permit 10.181.0.28/31
ip prefix-list PL_IN_18_7 seq 20 permit 10.181.0.36/31
ip prefix-list PL_IN_18_7 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_18_7 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_18_7 seq 10 permit 10.200.11.0/24
ip prefix-list PL_OUT_18_7 seq 20 permit 10.200.12.0/24
!






route-map RM_POLICY_IN_18_7 permit 10














 match ip address prefix-list PL_IN_18_7
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_18_7 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_18_7 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_18_0
 ! Block loopback 10.180.0.19/32


route-map RM_POLICY_OUT_18_7 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_18_0
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_18_7 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_18_1
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_18_7 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_18
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_18_7 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_18
 set metric 12
 set as-path prepend 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_18_7 deny 200














 match ip address prefix-list PL_OUT_18_7
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_18_7 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.19
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP



 !
 neighbor 10.181.0.34 peer-group EBGP
 neighbor 10.181.0.34 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.14 activate


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.18 activate



  neighbor 10.181.0.34 activate
  neighbor 10.181.0.34 route-map RM_POLICY_IN_18_7 in
  neighbor 10.181.0.34 route-map RM_POLICY_OUT_18_7 out





  network 10.200.11.0 mask 255.255.255.0

  network 10.200.12.0 mask 255.255.255.0

 exit-address-family
