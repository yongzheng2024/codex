
hostname 40_as65005_Charleroi
!
interface Loopback0
 ip address 10.180.0.41 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 142_as65005_Brussels (142)

 ip address 10.181.0.138 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


router ospf 1
 router-id 10.180.0.41
 passive-interface Loopback0
 network 10.180.0.41 0.0.0.0 area 0



network 10.181.0.138 0.0.0.1 area 0
!








router bgp 65005
 bgp router-id 10.180.0.41
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.63 peer-group RR


 !
 neighbor 10.180.0.143 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.63 activate


  neighbor 10.180.0.143 activate







 exit-address-family
