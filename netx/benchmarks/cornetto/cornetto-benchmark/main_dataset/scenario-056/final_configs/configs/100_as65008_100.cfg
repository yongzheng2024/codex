
hostname 100_as65008_100
!
interface Loopback0
 ip address 10.180.0.101 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24

 shutdown

 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!



ip access-list extended ACL_100_GigabitEthernet0_1_OUT
 5 deny ip any any
 6 deny ip any any
 10 permit ip host 10.180.0.101 any
 20 permit ip host 10.181.0.27 any
 30 permit ip host 10.181.1.12 any
 40 permit ip host 10.181.1.14 any
 50 permit ip 10.181.0.26 0.0.0.1 any
 60 permit ip 10.181.1.12 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 8_as65008_8 (8)

 ip address 10.181.0.27 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 105_as65001_105 (105)

 ip address 10.181.1.12 255.255.255.254

 ip access-group ACL_100_GigabitEthernet0_1_OUT out
 mtu 1500
!
interface GigabitEthernet0/2
 description to 107_as65008_107 (107)

 ip address 10.181.1.14 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.1.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.101
 passive-interface Loopback0
 network 10.180.0.101 0.0.0.0 area 0










 redistribute bgp 65008 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_100

network 10.181.0.26 0.0.0.1 area 0
network 10.181.1.14 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_100 seq 10 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_100 seq 20 permit 10.200.3.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_100 seq 30 permit 10.200.4.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_100 seq 40 permit 10.200.5.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_100 seq 50 permit 10.200.6.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_100 seq 60 permit 10.200.7.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_100 seq 10 permit 10.180.0.101/32
ip prefix-list PL_BGP_TO_OSPF_DENY_100 seq 20 permit 10.181.0.26/31
ip prefix-list PL_BGP_TO_OSPF_DENY_100 seq 30 permit 10.181.1.12/31
ip prefix-list PL_BGP_TO_OSPF_DENY_100 seq 40 permit 10.181.1.14/31
!






route-map RM_BGP_TO_OSPF_100 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_100 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_100
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_100 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_100
 set tag 65010

!







router bgp 65008
 bgp router-id 10.180.0.101
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.101


 !
 neighbor RR peer-group
 neighbor RR remote-as 65008
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65008
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.27 peer-group RR



 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.93 peer-group IBGP


 !
 neighbor 10.180.0.108 peer-group IBGP



 !
 neighbor 10.181.1.13 peer-group EBGP
 neighbor 10.181.1.13 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.27 activate



  neighbor 10.180.0.9 activate
  neighbor 10.180.0.9 next-hop-self


  neighbor 10.180.0.93 activate
  neighbor 10.180.0.93 next-hop-self


  neighbor 10.180.0.108 activate
  neighbor 10.180.0.108 next-hop-self



  neighbor 10.181.1.13 activate





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

 exit-address-family
