
hostname 72_as65011_Como
!
interface Loopback0
 ip address 10.180.0.73 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.70.0/24


 ip address 10.200.70.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.71.0/24


 ip address 10.200.71.1 255.255.255.0
!



ip access-list extended ACL_72_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.73 any
 20 permit ip host 10.181.0.213 any
 30 permit ip host 10.181.0.234 any
 40 permit ip 10.181.0.212 0.0.0.1 any
 50 permit ip 10.181.0.234 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 64_as65011_Chiasso (64)

 ip address 10.181.0.213 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 152_as65001_Milan (152)

 ip address 10.181.0.234 255.255.255.254

 ip access-group ACL_72_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.70.0 255.255.255.0 Loopback100
ip route 10.200.71.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.73
 passive-interface Loopback0
 network 10.180.0.73 0.0.0.0 area 0



network 10.181.0.212 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_72 seq 10 permit 10.200.70.0/24
ip prefix-list PL_EXPORT_ALLOWED_72 seq 20 permit 10.200.71.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_72_0 seq 10 deny 10.181.0.212/31
!

ip prefix-list PL_EXPORT_DENY_LINK_72_1 seq 10 deny 10.181.0.234/31
!

ip prefix-list PL_EXPORT_DENY_LONG_72 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_72_0 seq 10 deny 10.180.0.73/32
!

ip prefix-list PL_IN_72_152 seq 10 permit 10.181.0.232/31
ip prefix-list PL_IN_72_152 seq 20 permit 10.181.1.82/31
ip prefix-list PL_IN_72_152 seq 30 permit 10.200.47.0/24
ip prefix-list PL_IN_72_152 seq 40 permit 10.181.0.218/31
ip prefix-list PL_IN_72_152 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_72_152 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_72_152 seq 10 permit 10.200.70.0/24
!






route-map RM_POLICY_IN_72_152 permit 10














 match ip address prefix-list PL_IN_72_152
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_72_152 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_72_152 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_72_0
 ! Block loopback 10.180.0.73/32


route-map RM_POLICY_OUT_72_152 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_72_0
 ! Block link 10.181.0.212/31


route-map RM_POLICY_OUT_72_152 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_72_1
 ! Block link 10.181.0.234/31


route-map RM_POLICY_OUT_72_152 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_72
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_72_152 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_72
 set metric 8
 set as-path prepend 65011 65011
 ! Outbound policy baseline


route-map RM_POLICY_OUT_72_152 deny 200














 match ip address prefix-list PL_OUT_72_152
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_72_152 deny 65000














 ! Deny other outbound routes

!







router bgp 65011
 bgp router-id 10.180.0.73
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65011
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.33 peer-group IBGP


 !
 neighbor 10.180.0.34 peer-group IBGP


 !
 neighbor 10.180.0.36 peer-group IBGP


 !
 neighbor 10.180.0.39 peer-group IBGP


 !
 neighbor 10.180.0.64 peer-group IBGP


 !
 neighbor 10.180.0.65 peer-group IBGP


 !
 neighbor 10.180.0.75 peer-group IBGP


 !
 neighbor 10.180.0.126 peer-group IBGP


 !
 neighbor 10.180.0.127 peer-group IBGP



 !
 neighbor 10.181.0.235 peer-group EBGP
 neighbor 10.181.0.235 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.33 activate


  neighbor 10.180.0.34 activate


  neighbor 10.180.0.36 activate


  neighbor 10.180.0.39 activate


  neighbor 10.180.0.64 activate


  neighbor 10.180.0.65 activate


  neighbor 10.180.0.75 activate


  neighbor 10.180.0.126 activate


