
hostname 138_as65005_Turin
!
interface Loopback0
 ip address 10.180.0.139 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.28.0/24


 ip address 10.200.28.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.29.0/24


 ip address 10.200.29.1 255.255.255.0
!



ip access-list extended ACL_138_GigabitEthernet0_2_OUT
 10 permit ip host 10.180.0.139 any
 20 permit ip host 10.181.1.21 any
 30 permit ip host 10.181.1.41 any
 40 permit ip host 10.181.1.114 any
 50 permit ip 10.181.1.114 0.0.0.1 any
 60 permit ip 10.181.1.20 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 82_as65005_Marseille (82)

 ip address 10.181.1.21 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 90_as65005_Cuneo (90)

 ip address 10.181.1.41 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 152_as65001_Milan (152)

 ip address 10.181.1.114 255.255.255.254

 ip access-group ACL_138_GigabitEthernet0_2_OUT out
 mtu 1500
!


ip route 10.200.28.0 255.255.255.0 Loopback100
ip route 10.200.29.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.139
 passive-interface Loopback0
 network 10.180.0.139 0.0.0.0 area 0



network 10.181.1.20 0.0.0.1 area 0
network 10.181.1.40 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_138 seq 10 permit 10.200.28.0/24
ip prefix-list PL_EXPORT_ALLOWED_138 seq 20 permit 10.200.29.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_138_0 seq 10 deny 10.181.1.114/31
!

ip prefix-list PL_EXPORT_DENY_LINK_138_1 seq 10 deny 10.181.1.20/31
!

ip prefix-list PL_EXPORT_DENY_LINK_138_2 seq 10 deny 10.181.1.40/31
!

ip prefix-list PL_EXPORT_DENY_LONG_138 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_138_0 seq 10 deny 10.180.0.139/32
!

ip prefix-list PL_IN_138_152 seq 10 permit 10.200.44.0/24
ip prefix-list PL_IN_138_152 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_138_152 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_138_152 seq 10 permit 10.200.29.0/24
!






route-map RM_POLICY_IN_138_152 permit 10














 match ip address prefix-list PL_IN_138_152
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_138_152 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_138_152 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_138_0
 ! Block loopback 10.180.0.139/32


route-map RM_POLICY_OUT_138_152 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_138_0
 ! Block link 10.181.1.114/31


route-map RM_POLICY_OUT_138_152 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_138_1
 ! Block link 10.181.1.20/31


route-map RM_POLICY_OUT_138_152 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_138_2
 ! Block link 10.181.1.40/31


route-map RM_POLICY_OUT_138_152 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_138
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_138_152 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_138
 set metric 5
 set as-path prepend 65005 65005 65005
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_138_152 deny 200














 match ip address prefix-list PL_OUT_138_152
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_138_152 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.139
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.124 peer-group RR




 !
 neighbor 10.181.1.115 peer-group EBGP
 neighbor 10.181.1.115 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.124 activate




  neighbor 10.181.1.115 activate
  neighbor 10.181.1.115 route-map RM_POLICY_IN_138_152 in
  neighbor 10.181.1.115 route-map RM_POLICY_OUT_138_152 out





  network 10.200.28.0 mask 255.255.255.0

  network 10.200.29.0 mask 255.255.255.0

 exit-address-family
