
hostname 115_as65004_Lille
!
interface Loopback0
 ip address 10.180.0.116 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!



ip access-list extended ACL_115_GigabitEthernet0_2
 10 permit ip host 10.180.0.140 any
 20 permit ip host 10.181.1.86 any
 30 permit ip host 10.181.1.87 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_115_GigabitEthernet0_2_OUT
 10 permit ip host 10.180.0.116 any
 20 permit ip host 10.181.0.203 any
 30 permit ip host 10.181.0.255 any
 40 permit ip host 10.181.1.86 any
 50 permit ip 10.181.0.202 0.0.0.1 any
 60 permit ip 10.181.1.86 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 62_as65004_None (62)

 ip address 10.181.0.203 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 78_as65004_Ghent (78)

 ip address 10.181.0.255 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 139_as65003_Paris (139)

 ip address 10.181.1.86 255.255.255.254

 ip access-group ACL_115_GigabitEthernet0_2 in

 ip access-group ACL_115_GigabitEthernet0_2_OUT out
 mtu 1500
!


ip route 10.200.7.0 255.255.255.0 Loopback100
ip route 10.200.8.0 255.255.255.0 Loopback101
ip route 10.200.9.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.116
 passive-interface Loopback0
 network 10.180.0.116 0.0.0.0 area 0



network 10.181.0.202 0.0.0.1 area 0
network 10.181.0.254 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_115 seq 10 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_115 seq 20 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_115 seq 30 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_115_0 seq 10 deny 10.181.0.202/31
!

ip prefix-list PL_EXPORT_DENY_LINK_115_1 seq 10 deny 10.181.0.254/31
!

ip prefix-list PL_EXPORT_DENY_LINK_115_2 seq 10 deny 10.181.1.86/31
!

ip prefix-list PL_EXPORT_DENY_LONG_115 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_115_0 seq 10 deny 10.180.0.116/32
!






route-map RM_POLICY_IN_115_139 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_115_139 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_115_0
 ! Block loopback 10.180.0.116/32


route-map RM_POLICY_OUT_115_139 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_115_0
 ! Block link 10.181.0.202/31


route-map RM_POLICY_OUT_115_139 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_115_1
 ! Block link 10.181.0.254/31


route-map RM_POLICY_OUT_115_139 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_115_2
 ! Block link 10.181.1.86/31


route-map RM_POLICY_OUT_115_139 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_115
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_115_139 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_115
 set metric 17
 set as-path prepend 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_115_139 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.116
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.143 peer-group RR




 !
 neighbor 10.181.1.87 peer-group EBGP
 neighbor 10.181.1.87 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.143 activate




  neighbor 10.181.1.87 activate
  neighbor 10.181.1.87 route-map RM_POLICY_IN_115_139 in
  neighbor 10.181.1.87 route-map RM_POLICY_OUT_115_139 out





  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
