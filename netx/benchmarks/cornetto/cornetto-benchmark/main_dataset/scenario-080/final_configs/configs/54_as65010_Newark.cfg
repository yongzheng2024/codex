  neighbor 10.181.0.181 route-map RM_POLICY_IN_54_139 in
  neighbor 10.181.0.181 route-map RM_POLICY_OUT_54_139 out





  network 10.200.60.0 mask 255.255.255.0

  network 10.200.61.0 mask 255.255.255.0

  network 10.200.62.0 mask 255.255.255.0

 exit-address-family
