 address-family ipv4


  neighbor 10.180.0.29 activate


  neighbor 10.180.0.30 activate


  neighbor 10.180.0.56 activate


  neighbor 10.180.0.76 activate


  neighbor 10.180.0.77 activate


  neighbor 10.180.0.78 activate


  neighbor 10.180.0.92 activate


  neighbor 10.180.0.141 activate


  neighbor 10.180.0.151 activate



