
hostname 54_as65010_Newark
!
interface Loopback0
 ip address 10.180.0.55 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.60.0/24


 ip address 10.200.60.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.61.0/24


 ip address 10.200.61.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.62.0/24


 ip address 10.200.62.1 255.255.255.0
!



ip access-list extended ACL_54_GigabitEthernet0_0
 10 permit ip host 10.180.0.140 any
 20 permit ip host 10.181.0.180 any
 30 permit ip host 10.181.0.181 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_54_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.55 any
 20 permit ip host 10.181.0.180 any
 30 permit ip host 10.181.0.182 any
 40 permit ip host 10.181.0.184 any
 50 permit ip 10.181.0.180 0.0.0.1 any
 60 permit ip 10.181.0.184 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 139_as65003_Paris (139)

 ip address 10.181.0.180 255.255.255.254

 ip access-group ACL_54_GigabitEthernet0_0 in

 ip access-group ACL_54_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 140_as65010_London (140)

 ip address 10.181.0.182 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 55_as65010_New-York (55)

 ip address 10.181.0.184 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.60.0 255.255.255.0 Loopback100
ip route 10.200.61.0 255.255.255.0 Loopback101
ip route 10.200.62.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.55
 passive-interface Loopback0
 network 10.180.0.55 0.0.0.0 area 0



network 10.181.0.182 0.0.0.1 area 0
network 10.181.0.184 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_54 seq 10 permit 10.200.60.0/24
ip prefix-list PL_EXPORT_ALLOWED_54 seq 20 permit 10.200.61.0/24
ip prefix-list PL_EXPORT_ALLOWED_54 seq 30 permit 10.200.62.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_54_0 seq 10 deny 10.181.0.180/31
!

ip prefix-list PL_EXPORT_DENY_LINK_54_1 seq 10 deny 10.181.0.182/31
!

ip prefix-list PL_EXPORT_DENY_LINK_54_2 seq 10 deny 10.181.0.184/31
!

ip prefix-list PL_EXPORT_DENY_LONG_54 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_54_0 seq 10 deny 10.180.0.55/32
!




ip community-list standard CL_COMM_54_139 permit 65535:65282
!





route-map RM_POLICY_IN_54_139 permit 5














 match community CL_COMM_54_139
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_54_139 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_54_139 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_54_139 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_54_0
 ! Block loopback 10.180.0.55/32


route-map RM_POLICY_OUT_54_139 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_54_0
 ! Block link 10.181.0.180/31


route-map RM_POLICY_OUT_54_139 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_54_1
 ! Block link 10.181.0.182/31


route-map RM_POLICY_OUT_54_139 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_54_2
 ! Block link 10.181.0.184/31


route-map RM_POLICY_OUT_54_139 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_54
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_54_139 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_54
 set metric 17
 set as-path prepend 65010 65010
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_54_139 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.55
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65010
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.29 peer-group IBGP


 !
 neighbor 10.180.0.30 peer-group IBGP


 !
 neighbor 10.180.0.56 peer-group IBGP


 !
 neighbor 10.180.0.76 peer-group IBGP


 !
 neighbor 10.180.0.77 peer-group IBGP


