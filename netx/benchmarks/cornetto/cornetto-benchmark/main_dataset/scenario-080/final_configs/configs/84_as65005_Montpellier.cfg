
hostname 84_as65005_Montpellier
!
interface Loopback0
 ip address 10.180.0.85 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.87.0/24


 ip address 10.200.87.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.88.0/24


 ip address 10.200.88.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.89.0/24


 ip address 10.200.89.1 255.255.255.0
!



ip access-list extended ACL_84_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.85 any
 20 permit ip host 10.181.1.9 any
 30 permit ip host 10.181.1.25 any
 40 permit ip 10.181.1.8 0.0.0.1 any
 50 permit ip 10.181.1.24 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 79_as65003_None (79)

 ip address 10.181.1.9 255.255.255.254

 ip access-group ACL_84_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 82_as65005_Marseille (82)

 ip address 10.181.1.25 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.87.0 255.255.255.0 Loopback100
ip route 10.200.88.0 255.255.255.0 Loopback101
ip route 10.200.89.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.85
 passive-interface Loopback0
 network 10.180.0.85 0.0.0.0 area 0



network 10.181.1.24 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_84 seq 10 permit 10.200.87.0/24
ip prefix-list PL_EXPORT_ALLOWED_84 seq 20 permit 10.200.88.0/24
ip prefix-list PL_EXPORT_ALLOWED_84 seq 30 permit 10.200.89.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_84_0 seq 10 deny 10.181.1.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_84_1 seq 10 deny 10.181.1.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_84 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_84_0 seq 10 deny 10.180.0.85/32
!






route-map RM_POLICY_IN_84_79 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_84_79 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_84_0
 ! Block loopback 10.180.0.85/32


route-map RM_POLICY_OUT_84_79 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_84_0
 ! Block link 10.181.1.24/31


route-map RM_POLICY_OUT_84_79 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_84_1
 ! Block link 10.181.1.8/31


route-map RM_POLICY_OUT_84_79 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_84
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_84_79 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_84
 set metric 27
 set as-path prepend 65005 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_84_79 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.85
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.74 peer-group RR




 !
 neighbor 10.181.1.8 peer-group EBGP
 neighbor 10.181.1.8 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.74 activate




  neighbor 10.181.1.8 activate
  neighbor 10.181.1.8 route-map RM_POLICY_IN_84_79 in
  neighbor 10.181.1.8 route-map RM_POLICY_OUT_84_79 out





  network 10.200.87.0 mask 255.255.255.0

  network 10.200.88.0 mask 255.255.255.0

  network 10.200.89.0 mask 255.255.255.0

 exit-address-family
