network 10.181.0.16 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_8 seq 10 permit 10.200.80.0/24
ip prefix-list PL_EXPORT_ALLOWED_8 seq 20 permit 10.200.81.0/24
ip prefix-list PL_EXPORT_ALLOWED_8 seq 30 permit 10.200.82.0/24
ip prefix-list PL_EXPORT_ALLOWED_8 seq 40 permit 10.200.83.0/24
