
hostname 2_as65007_Rostock
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.56.0/24


 ip address 10.200.56.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.57.0/24


 ip address 10.200.57.1 255.255.255.0
!



ip access-list extended ACL_2_GigabitEthernet0_1
 10 permit ip host 10.180.0.52 any
 20 permit ip host 10.181.0.10 any
 30 permit ip host 10.181.0.11 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_2_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.3 any
 20 permit ip host 10.181.0.8 any
 30 permit ip host 10.181.0.10 any
 40 permit ip 10.181.0.8 0.0.0.1 any
 50 permit ip 10.181.0.10 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 144_as65007_Berlin (144)

 ip address 10.181.0.8 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 51_as65012_Hamburg (51)

 ip address 10.181.0.10 255.255.255.254

 ip access-group ACL_2_GigabitEthernet0_1 in

 ip access-group ACL_2_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.56.0 255.255.255.0 Loopback100
ip route 10.200.57.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0



network 10.181.0.8 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_2 seq 10 permit 10.200.56.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 20 permit 10.200.57.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_2_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_1 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_2 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_2_0 seq 10 deny 10.180.0.3/32
!

ip prefix-list PL_IN_2_51 seq 10 permit 10.180.0.52/32
ip prefix-list PL_IN_2_51 seq 20 permit 10.181.0.170/31
ip prefix-list PL_IN_2_51 seq 30 permit 10.181.0.10/31
ip prefix-list PL_IN_2_51 seq 40 permit 10.181.0.162/31
ip prefix-list PL_IN_2_51 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_2_51 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_2_51 seq 10 permit 10.200.56.0/24
!






route-map RM_POLICY_IN_2_51 permit 10














 match ip address prefix-list PL_IN_2_51
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_2_51 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_2_51 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_51 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_2_51 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_2_51 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_51 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_2
 set community 65000:200 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_2_51 deny 200














 match ip address prefix-list PL_OUT_2_51
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_2_51 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65007
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.145 peer-group RR




 !
 neighbor 10.181.0.11 peer-group EBGP
 neighbor 10.181.0.11 remote-as 65012


 !
 address-family ipv4

  neighbor 10.180.0.145 activate




  neighbor 10.181.0.11 activate
  neighbor 10.181.0.11 route-map RM_POLICY_IN_2_51 in
  neighbor 10.181.0.11 route-map RM_POLICY_OUT_2_51 out





  network 10.200.56.0 mask 255.255.255.0

  network 10.200.57.0 mask 255.255.255.0

 exit-address-family
