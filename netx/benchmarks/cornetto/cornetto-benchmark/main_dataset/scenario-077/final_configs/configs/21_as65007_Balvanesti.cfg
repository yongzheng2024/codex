ip access-list extended ACL_21_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.22 any
 20 permit ip host 10.181.0.70 any
 30 permit ip host 10.181.0.72 any
 40 permit ip 10.181.0.70 0.0.0.1 any
 50 permit ip 10.181.0.72 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
