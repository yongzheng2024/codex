!


ip prefix-list PL_EXPORT_ALLOWED_21 seq 10 permit 10.200.60.0/24
ip prefix-list PL_EXPORT_ALLOWED_21 seq 20 permit 10.200.61.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_21_0 seq 10 deny 10.181.0.70/31
!

ip prefix-list PL_EXPORT_DENY_LINK_21_1 seq 10 deny 10.181.0.72/31
!

ip prefix-list PL_EXPORT_DENY_LONG_21 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_21_0 seq 10 deny 10.180.0.22/32
!




ip community-list standard CL_COMM_21_23 permit 65535:65282
ip community-list standard CL_COMM_21_23 permit no-advertise
!





route-map RM_POLICY_IN_21_23 permit 5














 match community CL_COMM_21_23
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_21_23 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_21_23 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_21_0
 ! Block loopback 10.180.0.22/32


route-map RM_POLICY_OUT_21_23 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_0
 ! Block link 10.181.0.70/31


route-map RM_POLICY_OUT_21_23 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_1
 ! Block link 10.181.0.72/31


route-map RM_POLICY_OUT_21_23 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_21
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_21_23 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_21
 set community no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_21_23 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.22
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65007
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.145 peer-group RR




 !
 neighbor 10.181.0.73 peer-group EBGP
 neighbor 10.181.0.73 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.145 activate




  neighbor 10.181.0.73 activate
  neighbor 10.181.0.73 route-map RM_POLICY_IN_21_23 in
  neighbor 10.181.0.73 route-map RM_POLICY_OUT_21_23 out





  network 10.200.60.0 mask 255.255.255.0

  network 10.200.61.0 mask 255.255.255.0

 exit-address-family
