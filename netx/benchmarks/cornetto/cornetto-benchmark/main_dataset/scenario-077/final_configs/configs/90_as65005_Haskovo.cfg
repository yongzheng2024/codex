 10 permit ip host 10.180.0.91 any
 20 permit ip host 10.181.1.22 any
 30 permit ip host 10.181.1.24 any
 40 permit ip 10.181.1.22 0.0.0.1 any
 50 permit ip 10.181.1.24 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
