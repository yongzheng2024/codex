ip prefix-list PL_EXPORT_ALLOWED_90 seq 10 permit 10.200.117.0/24
ip prefix-list PL_EXPORT_ALLOWED_90 seq 20 permit 10.200.118.0/24
ip prefix-list PL_EXPORT_ALLOWED_90 seq 30 permit 10.200.119.0/24
ip prefix-list PL_EXPORT_ALLOWED_90 seq 40 permit 10.200.120.0/24
