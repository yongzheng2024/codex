 ! Block link 10.181.1.80/31


route-map RM_POLICY_OUT_121_110 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_121
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_121_110 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_121
 set metric 30
 set as-path prepend 65004 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_121_110 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.122
 bgp log-neighbor-changes
