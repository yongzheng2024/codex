  neighbor 10.180.0.95 activate


  neighbor 10.180.0.42 activate




  neighbor 10.181.0.216 activate
  neighbor 10.181.0.216 route-map RM_POLICY_IN_107_67 in
  neighbor 10.181.0.216 route-map RM_POLICY_OUT_107_67 out





  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

  network 10.200.6.0 mask 255.255.255.0

