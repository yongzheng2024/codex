ip community-list standard CL_COMM_107_67 permit no-advertise
!





route-map RM_POLICY_IN_107_67 permit 5














 match community CL_COMM_107_67
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_107_67 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_107_67 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_107_67 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_107_0
 ! Block loopback 10.180.0.108/32


route-map RM_POLICY_OUT_107_67 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_107_0
 ! Block link 10.181.0.216/31


route-map RM_POLICY_OUT_107_67 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_107_1
 ! Block link 10.181.1.54/31


route-map RM_POLICY_OUT_107_67 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_107_2
 ! Block link 10.181.1.56/31


route-map RM_POLICY_OUT_107_67 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_107
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_107_67 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_107
 set metric 18
 set as-path prepend 65001 65001
 set community no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_107_67 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.108
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.95 peer-group RR


 !
 neighbor 10.180.0.42 peer-group RR




 !
 neighbor 10.181.0.216 peer-group EBGP
 neighbor 10.181.0.216 remote-as 65010


 !
