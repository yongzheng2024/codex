ip route 10.200.7.0 255.255.255.0 Loopback100
ip route 10.200.8.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.e901.0000.0ab4.006f.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_110 seq 10 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_110 seq 20 permit 10.200.8.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_110_0 seq 10 deny 10.181.1.56/31
!

ip prefix-list PL_EXPORT_DENY_LINK_110_1 seq 10 deny 10.181.1.58/31
!

ip prefix-list PL_EXPORT_DENY_LINK_110_2 seq 10 deny 10.181.1.60/31
!

ip prefix-list PL_EXPORT_DENY_LONG_110 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_110_0 seq 10 deny 10.180.0.111/32
!




ip community-list standard CL_COMM_110_121 permit 65535:65282
ip community-list standard CL_COMM_110_121 permit no-export
!





route-map RM_POLICY_IN_110_121 permit 5














 match community CL_COMM_110_121
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_110_121 permit 10














 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_110_121 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_110_121 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_110_0
 ! Block loopback 10.180.0.111/32


route-map RM_POLICY_OUT_110_121 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_110_0
 ! Block link 10.181.1.56/31


route-map RM_POLICY_OUT_110_121 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_110_1
 ! Block link 10.181.1.58/31


route-map RM_POLICY_OUT_110_121 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_110_2
 ! Block link 10.181.1.60/31


route-map RM_POLICY_OUT_110_121 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_110
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_110_121 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_110
 set metric 19
 set as-path prepend 65001 65001
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_110_121 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.111
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.42 peer-group RR




 !
 neighbor 10.181.1.61 peer-group EBGP
 neighbor 10.181.1.61 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.42 activate




  neighbor 10.181.1.61 activate
  neighbor 10.181.1.61 route-map RM_POLICY_IN_110_121 in
  neighbor 10.181.1.61 route-map RM_POLICY_OUT_110_121 out





  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

 exit-address-family
