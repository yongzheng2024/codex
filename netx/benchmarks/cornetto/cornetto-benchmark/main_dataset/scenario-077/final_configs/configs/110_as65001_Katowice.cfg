interface GigabitEthernet0/0
 description to 107_as65001_Krakow (107)

 ip address 10.181.1.57 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 109_as65001_Opole (109)

 ip address 10.181.1.59 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
