!


ip route 10.200.70.0 255.255.255.0 Loopback100
ip route 10.200.71.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.ef00.0000.0ab4.001c.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_27 seq 10 permit 10.200.70.0/24
ip prefix-list PL_EXPORT_ALLOWED_27 seq 20 permit 10.200.71.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_27_0 seq 10 deny 10.181.0.80/31
!

ip prefix-list PL_EXPORT_DENY_LINK_27_1 seq 10 deny 10.181.0.88/31
!

ip prefix-list PL_EXPORT_DENY_LINK_27_2 seq 10 deny 10.181.0.90/31
!

ip prefix-list PL_EXPORT_DENY_LONG_27 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_27_0 seq 10 deny 10.180.0.28/32
!




ip community-list standard CL_COMM_27_24 permit no-advertise
ip community-list standard CL_COMM_27_24 permit no-export
!





route-map RM_POLICY_IN_27_24 permit 5














 match community CL_COMM_27_24
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_27_24 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_27_24 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_27_24 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_27_0
 ! Block loopback 10.180.0.28/32


route-map RM_POLICY_OUT_27_24 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_0
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_27_24 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_1
 ! Block link 10.181.0.88/31


route-map RM_POLICY_OUT_27_24 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_2
 ! Block link 10.181.0.90/31


route-map RM_POLICY_OUT_27_24 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_27
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_27_24 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_27
 set metric 25
 set as-path prepend 65007 65007
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_27_24 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.28
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65007
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.21 peer-group RR




 !
 neighbor 10.181.0.80 peer-group EBGP
 neighbor 10.181.0.80 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.21 activate




  neighbor 10.181.0.80 activate
  neighbor 10.181.0.80 route-map RM_POLICY_IN_27_24 in
  neighbor 10.181.0.80 route-map RM_POLICY_OUT_27_24 out





  network 10.200.70.0 mask 255.255.255.0

  network 10.200.71.0 mask 255.255.255.0

 exit-address-family
