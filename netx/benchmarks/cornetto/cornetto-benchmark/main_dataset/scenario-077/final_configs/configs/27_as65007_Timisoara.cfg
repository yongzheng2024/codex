
hostname 27_as65007_Timisoara
!
interface Loopback0
 ip address 10.180.0.28 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.70.0/24


 ip address 10.200.70.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.71.0/24


 ip address 10.200.71.1 255.255.255.0
!



ip access-list extended ACL_27_GigabitEthernet0_0
 10 permit ip host 10.180.0.25 any
 20 permit ip host 10.181.0.80 any
 30 permit ip host 10.181.0.81 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_27_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.28 any
 20 permit ip host 10.181.0.81 any
 30 permit ip host 10.181.0.89 any
 40 permit ip host 10.181.0.90 any
 50 permit ip 10.181.0.88 0.0.0.1 any
 60 permit ip 10.181.0.90 0.0.0.1 any
