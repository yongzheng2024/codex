interface GigabitEthernet0/0
 description to 24_as65003_Arad (24)

 ip address 10.181.0.81 255.255.255.254

 ip access-group ACL_27_GigabitEthernet0_0 in

 ip access-group ACL_27_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 26_as65007_Caransebes (26)

 ip address 10.181.0.89 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/2
