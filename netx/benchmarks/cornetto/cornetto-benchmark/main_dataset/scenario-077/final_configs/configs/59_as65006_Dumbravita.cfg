route-map RM_POLICY_IN_59_56 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_59_56 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_59_0
 ! Block loopback 10.180.0.60/32


