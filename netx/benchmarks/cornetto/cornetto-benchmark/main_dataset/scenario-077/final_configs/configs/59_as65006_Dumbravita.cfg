 match ip address prefix-list PL_EXPORT_DENY_LONG_59
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_59_56 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_59
 set metric 8
 set as-path prepend 65006 65006
 ! Outbound policy baseline


route-map RM_POLICY_OUT_59_56 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.60
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.143 peer-group RR




 !
 neighbor 10.181.0.196 peer-group EBGP
 neighbor 10.181.0.196 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.143 activate




  neighbor 10.181.0.196 activate
  neighbor 10.181.0.196 route-map RM_POLICY_IN_59_56 in
  neighbor 10.181.0.196 route-map RM_POLICY_OUT_59_56 out





  network 10.200.96.0 mask 255.255.255.0

  network 10.200.97.0 mask 255.255.255.0

  network 10.200.98.0 mask 255.255.255.0

  network 10.200.99.0 mask 255.255.255.0

 exit-address-family
