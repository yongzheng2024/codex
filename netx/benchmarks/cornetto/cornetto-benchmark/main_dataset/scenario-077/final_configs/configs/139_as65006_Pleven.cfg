
hostname 139_as65006_Pleven
!
interface Loopback0
 ip address 10.180.0.140 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.34.0/24


 ip address 10.200.34.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.35.0/24


 ip address 10.200.35.1 255.255.255.0
!



ip access-list extended ACL_139_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.140 any
 20 permit ip host 10.181.0.99 any
 30 permit ip host 10.181.1.120 any
 40 permit ip 10.181.0.98 0.0.0.1 any
 50 permit ip 10.181.1.120 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 29_as65006_Giurgiu (29)

 ip address 10.181.0.99 255.255.255.254








 ip router isis 1

 isis metric 10

