 match ip address prefix-list PL_EXPORT_DENY_LINK_64_1
 ! Block link 10.181.0.210/31


route-map RM_POLICY_OUT_64_126 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_64_2
 ! Block link 10.181.0.212/31


