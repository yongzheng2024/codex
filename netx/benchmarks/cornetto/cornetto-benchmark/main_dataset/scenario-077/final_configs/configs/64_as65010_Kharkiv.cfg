route-map RM_POLICY_IN_64_126 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_64_126 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_64_0
 ! Block loopback 10.180.0.65/32


route-map RM_POLICY_OUT_64_126 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_64_0
 ! Block link 10.181.0.136/31


