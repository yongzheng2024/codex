 match ip address prefix-list PL_EXPORT_DENY_LONG_64
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_64_126 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_64
 set metric 23
 set as-path prepend 65010 65010
 ! Outbound policy baseline


route-map RM_POLICY_OUT_64_126 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.65
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65010
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.41 peer-group RR




 !
 neighbor 10.181.0.213 peer-group EBGP
 neighbor 10.181.0.213 remote-as 65009


 !
