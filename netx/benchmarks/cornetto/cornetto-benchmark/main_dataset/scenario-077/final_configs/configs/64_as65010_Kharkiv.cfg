  neighbor 10.180.0.41 activate




  neighbor 10.181.0.213 activate
  neighbor 10.181.0.213 route-map RM_POLICY_IN_64_126 in
  neighbor 10.181.0.213 route-map RM_POLICY_OUT_64_126 out





  network 10.200.100.0 mask 255.255.255.0

  network 10.200.101.0 mask 255.255.255.0

  network 10.200.102.0 mask 255.255.255.0

