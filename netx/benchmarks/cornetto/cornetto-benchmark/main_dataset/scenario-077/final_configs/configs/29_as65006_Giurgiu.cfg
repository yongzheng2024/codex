
hostname 29_as65006_Giurgiu
!
interface Loopback0
 ip address 10.180.0.30 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.72.0/24


 ip address 10.200.72.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.73.0/24


 ip address 10.200.73.1 255.255.255.0
!



ip access-list extended ACL_29_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.30 any
 20 permit ip host 10.181.0.96 any
 30 permit ip host 10.181.0.98 any
 40 permit ip host 10.181.0.100 any
 50 permit ip 10.181.0.100 0.0.0.1 any
 60 permit ip 10.181.0.96 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 51_as65005_Sliven (51)

 ip address 10.181.0.96 255.255.255.254

 ip access-group ACL_29_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 139_as65006_Pleven (139)

 ip address 10.181.0.98 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 142_as65006_Bucuresti (142)

 ip address 10.181.0.100 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.72.0 255.255.255.0 Loopback100
ip route 10.200.73.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.ee00.0000.0ab4.001e.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_29 seq 10 permit 10.200.72.0/24
ip prefix-list PL_EXPORT_ALLOWED_29 seq 20 permit 10.200.73.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_29_0 seq 10 deny 10.181.0.100/31
!

ip prefix-list PL_EXPORT_DENY_LINK_29_1 seq 10 deny 10.181.0.96/31
!

ip prefix-list PL_EXPORT_DENY_LINK_29_2 seq 10 deny 10.181.0.98/31
!

ip prefix-list PL_EXPORT_DENY_LONG_29 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_29_0 seq 10 deny 10.180.0.30/32
!

ip prefix-list PL_IN_29_51 seq 10 permit 10.181.0.96/31
ip prefix-list PL_IN_29_51 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_29_51 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_29_51 seq 10 permit 10.200.73.0/24
!






route-map RM_POLICY_IN_29_51 permit 10














 match ip address prefix-list PL_IN_29_51
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_29_51 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_29_51 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_29_0
 ! Block loopback 10.180.0.30/32


route-map RM_POLICY_OUT_29_51 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_29_0
 ! Block link 10.181.0.100/31


route-map RM_POLICY_OUT_29_51 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_29_1
 ! Block link 10.181.0.96/31


route-map RM_POLICY_OUT_29_51 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_29_2
 ! Block link 10.181.0.98/31


route-map RM_POLICY_OUT_29_51 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_29
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_29_51 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_29
 set metric 19
 set as-path prepend 65006
 ! Outbound policy baseline


route-map RM_POLICY_OUT_29_51 deny 200














 match ip address prefix-list PL_OUT_29_51
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_29_51 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.30
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.143 peer-group RR




 !
 neighbor 10.181.0.97 peer-group EBGP
 neighbor 10.181.0.97 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.143 activate




  neighbor 10.181.0.97 activate
  neighbor 10.181.0.97 route-map RM_POLICY_IN_29_51 in
  neighbor 10.181.0.97 route-map RM_POLICY_OUT_29_51 out





  network 10.200.72.0 mask 255.255.255.0

  network 10.200.73.0 mask 255.255.255.0

 exit-address-family
