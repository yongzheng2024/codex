route-map RM_POLICY_IN_73_34 permit 10














 match ip address prefix-list PL_IN_73_34
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_73_34 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_73_34 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_73_0
 ! Block loopback 10.180.0.74/32


route-map RM_POLICY_OUT_73_34 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_73_0
 ! Block link 10.181.0.118/31


