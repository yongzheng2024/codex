 match ip address prefix-list PL_EXPORT_DENY_LONG_73
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_73_34 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_73
 set metric 20
 set as-path prepend 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_73_34 deny 200














 match ip address prefix-list PL_OUT_73_34
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_73_34 deny 65000














 ! Deny other outbound routes

