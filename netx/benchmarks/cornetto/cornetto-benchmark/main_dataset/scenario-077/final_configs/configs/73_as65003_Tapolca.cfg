  neighbor 10.181.0.118 route-map RM_POLICY_IN_73_34 in
  neighbor 10.181.0.118 route-map RM_POLICY_OUT_73_34 out





  network 10.200.109.0 mask 255.255.255.0

  network 10.200.110.0 mask 255.255.255.0

  network 10.200.111.0 mask 255.255.255.0

