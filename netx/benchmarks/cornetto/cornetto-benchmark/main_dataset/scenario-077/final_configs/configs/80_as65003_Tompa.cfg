
hostname 80_as65003_Tompa
!
interface Loopback0
 ip address 10.180.0.81 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.112.0/24


 ip address 10.200.112.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.113.0/24


 ip address 10.200.113.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.114.0/24


 ip address 10.200.114.1 255.255.255.0
!



ip access-list extended ACL_80_GigabitEthernet0_0
 10 permit ip host 10.180.0.21 any
 20 permit ip host 10.181.0.66 any
 30 permit ip host 10.181.0.67 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_80_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.81 any
 20 permit ip host 10.181.0.67 any
 30 permit ip host 10.181.0.253 any
 40 permit ip 10.181.0.66 0.0.0.1 any
 50 permit ip 10.181.0.252 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 20_as65007_Beograd (20)

 ip address 10.181.0.67 255.255.255.254

 ip access-group ACL_80_GigabitEthernet0_0 in

 ip access-group ACL_80_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 79_as65003_Kiskunhalas (79)

 ip address 10.181.0.253 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.112.0 255.255.255.0 Loopback100
ip route 10.200.113.0 255.255.255.0 Loopback101
ip route 10.200.114.0 255.255.255.0 Loopback102
!

router isis 1
 net 31.eb01.0000.0ab4.0051.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_80 seq 10 permit 10.200.112.0/24
ip prefix-list PL_EXPORT_ALLOWED_80 seq 20 permit 10.200.113.0/24
ip prefix-list PL_EXPORT_ALLOWED_80 seq 30 permit 10.200.114.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_80_0 seq 10 deny 10.181.0.252/31
!

ip prefix-list PL_EXPORT_DENY_LINK_80_1 seq 10 deny 10.181.0.66/31
!

ip prefix-list PL_EXPORT_DENY_LONG_80 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_80_0 seq 10 deny 10.180.0.81/32
!






route-map RM_POLICY_OUT_80_20 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_80_0
 ! Block loopback 10.180.0.81/32


route-map RM_POLICY_OUT_80_20 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_80_0
 ! Block link 10.181.0.252/31


route-map RM_POLICY_OUT_80_20 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_80_1
 ! Block link 10.181.0.66/31


route-map RM_POLICY_OUT_80_20 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_80
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_80_20 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_80
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_80_20 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.81
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.82 peer-group RR




 !
 neighbor 10.181.0.66 peer-group EBGP
 neighbor 10.181.0.66 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.82 activate




  neighbor 10.181.0.66 activate
  neighbor 10.181.0.66 route-map RM_POLICY_OUT_80_20 out





  network 10.200.112.0 mask 255.255.255.0

  network 10.200.113.0 mask 255.255.255.0

  network 10.200.114.0 mask 255.255.255.0

 exit-address-family
