
hostname 21_as65003_USC
!
interface Loopback0
 ip address 10.180.0.22 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.19.0/24


 ip address 10.200.19.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.20.0/24


 ip address 10.200.20.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 8_as65003_Tinker (8)

 ip address 10.181.0.23 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 14_as65003_SDC (14)

 ip address 10.181.0.45 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 22_as65004_UTAH (22)

 ip address 10.181.0.52 255.255.255.254
 mtu 1500
!


ip route 10.200.19.0 255.255.255.0 Loopback100
ip route 10.200.20.0 255.255.255.0 Loopback101
ip route 10.200.21.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.22
 passive-interface Loopback0
 network 10.180.0.22 0.0.0.0 area 0



network 10.181.0.22 0.0.0.1 area 0
network 10.181.0.44 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_21 seq 10 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_21 seq 20 permit 10.200.20.0/24
ip prefix-list PL_EXPORT_ALLOWED_21 seq 30 permit 10.200.21.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_21_0 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_21_1 seq 10 deny 10.181.0.44/31
!

ip prefix-list PL_EXPORT_DENY_LINK_21_2 seq 10 deny 10.181.0.52/31
!

ip prefix-list PL_EXPORT_DENY_LONG_21 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_21_0 seq 10 deny 10.180.0.22/32
!

ip prefix-list PL_IN_21_22 seq 10 permit 10.181.0.2/31
ip prefix-list PL_IN_21_22 seq 20 permit 10.200.24.0/24
ip prefix-list PL_IN_21_22 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_21_22 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_21_22 seq 10 permit 10.200.21.0/24
!






route-map RM_POLICY_IN_21_22 permit 10














 match ip address prefix-list PL_IN_21_22
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_21_22 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_21_22 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_21_0
 ! Block loopback 10.180.0.22/32


route-map RM_POLICY_OUT_21_22 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_0
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_21_22 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_1
 ! Block link 10.181.0.44/31


route-map RM_POLICY_OUT_21_22 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_2
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_21_22 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_21
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_21_22 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_21
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_21_22 deny 200














 match ip address prefix-list PL_OUT_21_22
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_21_22 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.22
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.16 peer-group RR




 !
 neighbor 10.181.0.53 peer-group EBGP
 neighbor 10.181.0.53 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.16 activate




  neighbor 10.181.0.53 activate
  neighbor 10.181.0.53 route-map RM_POLICY_IN_21_22 in
  neighbor 10.181.0.53 route-map RM_POLICY_OUT_21_22 out





  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

  network 10.200.21.0 mask 255.255.255.0

 exit-address-family
