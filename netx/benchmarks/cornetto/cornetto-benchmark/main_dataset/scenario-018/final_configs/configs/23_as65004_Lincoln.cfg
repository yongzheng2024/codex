
hostname 23_as65004_Lincoln
!
interface Loopback0
 ip address 10.180.0.24 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.25.0/24


 ip address 10.200.25.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.26.0/24


 ip address 10.200.26.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.27.0/24


 ip address 10.200.27.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.28.0/24


 ip address 10.200.28.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 10_as65002_RADC (10)

 ip address 10.181.0.31 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 24_as65004_MIT (24)

 ip address 10.181.0.54 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.25.0 255.255.255.0 Loopback100
ip route 10.200.26.0 255.255.255.0 Loopback101
ip route 10.200.27.0 255.255.255.0 Loopback102
ip route 10.200.28.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.24
 passive-interface Loopback0
 network 10.180.0.24 0.0.0.0 area 0



network 10.181.0.54 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_23 seq 10 permit 10.200.25.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 20 permit 10.200.26.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 30 permit 10.200.27.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 40 permit 10.200.28.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_23_0 seq 10 deny 10.181.0.30/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_1 seq 10 deny 10.181.0.54/31
!

ip prefix-list PL_EXPORT_DENY_LONG_23 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_23_0 seq 10 deny 10.180.0.24/32
!






route-map RM_POLICY_OUT_23_10 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_23_0
 ! Block loopback 10.180.0.24/32


route-map RM_POLICY_OUT_23_10 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_0
 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_23_10 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_1
 ! Block link 10.181.0.54/31


route-map RM_POLICY_OUT_23_10 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_23
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_23_10 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_23
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_23_10 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.24
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.23 peer-group RR


 !
 neighbor 10.180.0.25 peer-group RR




 !
 neighbor 10.181.0.30 peer-group EBGP
 neighbor 10.181.0.30 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.23 activate


  neighbor 10.180.0.25 activate




  neighbor 10.181.0.30 activate
  neighbor 10.181.0.30 route-map RM_POLICY_OUT_23_10 out





  network 10.200.25.0 mask 255.255.255.0

  network 10.200.26.0 mask 255.255.255.0

  network 10.200.27.0 mask 255.255.255.0

  network 10.200.28.0 mask 255.255.255.0

 exit-address-family
