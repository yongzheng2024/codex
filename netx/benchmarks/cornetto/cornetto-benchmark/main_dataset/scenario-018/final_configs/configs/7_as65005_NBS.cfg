
hostname 7_as65005_NBS
!
interface Loopback0
 ip address 10.180.0.8 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 4_as65005_ETAC (4)

 ip address 10.181.0.15 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 16_as65005_HARVARD (16)

 ip address 10.181.0.20 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.8
 passive-interface Loopback0
 network 10.180.0.8 0.0.0.0 area 0



network 10.181.0.14 0.0.0.1 area 0
network 10.181.0.20 0.0.0.1 area 0
!








router bgp 65005
 bgp router-id 10.180.0.8
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0




 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP



 !
 address-family ipv4


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.17 activate






 exit-address-family
