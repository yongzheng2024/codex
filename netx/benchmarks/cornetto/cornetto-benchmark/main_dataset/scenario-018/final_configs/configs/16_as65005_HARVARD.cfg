
hostname 16_as65005_HARVARD
!
interface Loopback0
 ip address 10.180.0.17 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.16.0/24


 ip address 10.200.16.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.17.0/24


 ip address 10.200.17.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.18.0/24


 ip address 10.200.18.1 255.255.255.0
!



ip access-list extended ACL_16_GigabitEthernet0_1
 10 permit ip host 10.180.0.16 any
 20 permit ip host 10.181.0.46 any
 30 permit ip host 10.181.0.47 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 7_as65005_NBS (7)

 ip address 10.181.0.21 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 15_as65003_BBN (15)

 ip address 10.181.0.47 255.255.255.254

 ip access-group ACL_16_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.16.0 255.255.255.0 Loopback100
ip route 10.200.17.0 255.255.255.0 Loopback101
ip route 10.200.18.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.17
 passive-interface Loopback0
 network 10.180.0.17 0.0.0.0 area 0



network 10.181.0.20 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_16 seq 10 permit 10.200.16.0/24
ip prefix-list PL_EXPORT_ALLOWED_16 seq 20 permit 10.200.17.0/24
ip prefix-list PL_EXPORT_ALLOWED_16 seq 30 permit 10.200.18.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_16_0 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LINK_16_1 seq 10 deny 10.181.0.46/31
!

ip prefix-list PL_EXPORT_DENY_LONG_16 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_16_0 seq 10 deny 10.180.0.17/32
!






route-map RM_POLICY_IN_16_15 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_16_15 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_16_0
 ! Block loopback 10.180.0.17/32


route-map RM_POLICY_OUT_16_15 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_0
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_16_15 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_1
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_16_15 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_16
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_16_15 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_16
 set metric 17
 set as-path prepend 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_16_15 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.17
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP



 !
 neighbor 10.181.0.46 peer-group EBGP
 neighbor 10.181.0.46 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.8 activate



  neighbor 10.181.0.46 activate
  neighbor 10.181.0.46 route-map RM_POLICY_IN_16_15 in
  neighbor 10.181.0.46 route-map RM_POLICY_OUT_16_15 out





  network 10.200.16.0 mask 255.255.255.0

  network 10.200.17.0 mask 255.255.255.0

  network 10.200.18.0 mask 255.255.255.0

 exit-address-family
