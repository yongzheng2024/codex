
hostname 8_as65003_Tinker
!
interface Loopback0
 ip address 10.180.0.9 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 21_as65003_USC (21)

 ip address 10.181.0.22 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 15_as65003_BBN (15)

 ip address 10.181.0.24 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


router ospf 1
 router-id 10.180.0.9
 passive-interface Loopback0
 network 10.180.0.9 0.0.0.0 area 0



network 10.181.0.22 0.0.0.1 area 0
network 10.181.0.24 0.0.0.1 area 0
!








router bgp 65003
 bgp router-id 10.180.0.9
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.16 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.16 activate







 exit-address-family
