
hostname 15_as65003_BBN
!
interface Loopback0
 ip address 10.180.0.16 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.13.0/24


 ip address 10.200.13.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.14.0/24


 ip address 10.200.14.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.15.0/24


 ip address 10.200.15.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 6_as65003_BBN (6)

 ip address 10.181.0.19 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 8_as65003_Tinker (8)

 ip address 10.181.0.25 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 16_as65005_HARVARD (16)

 ip address 10.181.0.46 255.255.255.254
 mtu 1500
!


ip route 10.200.13.0 255.255.255.0 Loopback100
ip route 10.200.14.0 255.255.255.0 Loopback101
ip route 10.200.15.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.16
 passive-interface Loopback0
 network 10.180.0.16 0.0.0.0 area 0



network 10.181.0.18 0.0.0.1 area 0
network 10.181.0.24 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_15 seq 10 permit 10.200.13.0/24
ip prefix-list PL_EXPORT_ALLOWED_15 seq 20 permit 10.200.14.0/24
ip prefix-list PL_EXPORT_ALLOWED_15 seq 30 permit 10.200.15.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_15_0 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_15_1 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_15_2 seq 10 deny 10.181.0.46/31
!

ip prefix-list PL_EXPORT_DENY_LONG_15 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_15_0 seq 10 deny 10.180.0.16/32
!




ip community-list standard CL_COMM_15_16 permit 65535:65282
!





route-map RM_POLICY_IN_15_16 permit 5














 match community CL_COMM_15_16
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_15_16 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_15_16 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_15_0
 ! Block loopback 10.180.0.16/32


route-map RM_POLICY_OUT_15_16 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_0
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_15_16 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_1
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_15_16 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_2
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_15_16 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_15
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_15_16 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_15
 set community 65000:100 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_15_16 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.16
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.16



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP



 !
 neighbor 10.181.0.47 peer-group EBGP
 neighbor 10.181.0.47 remote-as 65005


 !
 address-family ipv4


  neighbor 10.180.0.7 activate
  neighbor 10.180.0.7 next-hop-self


  neighbor 10.180.0.9 activate


  neighbor 10.180.0.15 activate
  neighbor 10.180.0.15 next-hop-self


  neighbor 10.180.0.22 activate
  neighbor 10.180.0.22 next-hop-self



  neighbor 10.181.0.47 activate
  neighbor 10.181.0.47 route-map RM_POLICY_IN_15_16 in
  neighbor 10.181.0.47 route-map RM_POLICY_OUT_15_16 out





  network 10.200.13.0 mask 255.255.255.0

  network 10.200.14.0 mask 255.255.255.0

  network 10.200.15.0 mask 255.255.255.0

 exit-address-family
