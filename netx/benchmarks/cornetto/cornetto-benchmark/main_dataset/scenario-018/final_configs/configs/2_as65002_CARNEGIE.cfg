
hostname 2_as65002_CARNEGIE
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 1_as65002_MITRE (1)

 ip address 10.181.0.5 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 3_as65002_CASE (3)

 ip address 10.181.0.8 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0



network 10.181.0.4 0.0.0.1 area 0
network 10.181.0.8 0.0.0.1 area 0
!








router bgp 65002
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.2 peer-group RR


 !
 neighbor 10.180.0.4 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.2 activate


  neighbor 10.180.0.4 activate







 exit-address-family
