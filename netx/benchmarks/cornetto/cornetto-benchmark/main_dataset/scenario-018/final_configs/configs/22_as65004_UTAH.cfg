
hostname 22_as65004_UTAH
!
interface Loopback0
 ip address 10.180.0.23 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.23.0/24


 ip address 10.200.23.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.24.0/24


 ip address 10.200.24.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 0_as65004_ILLINOIS (0)

 ip address 10.181.0.3 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65001_McClellan (11)

 ip address 10.181.0.35 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 21_as65003_USC (21)

 ip address 10.181.0.53 255.255.255.254
 mtu 1500
!


ip route 10.200.22.0 255.255.255.0 Loopback100
ip route 10.200.23.0 255.255.255.0 Loopback101
ip route 10.200.24.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.23
 passive-interface Loopback0
 network 10.180.0.23 0.0.0.0 area 0



network 10.181.0.2 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_22 seq 10 permit 10.200.22.0/24
ip prefix-list PL_EXPORT_ALLOWED_22 seq 20 permit 10.200.23.0/24
ip prefix-list PL_EXPORT_ALLOWED_22 seq 30 permit 10.200.24.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_22_0 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LINK_22_1 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_22_2 seq 10 deny 10.181.0.52/31
!

ip prefix-list PL_EXPORT_DENY_LONG_22 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_22_0 seq 10 deny 10.180.0.23/32
!

ip prefix-list PL_IN_22_21 seq 10 permit 10.181.0.44/31
ip prefix-list PL_IN_22_21 seq 20 permit 10.200.19.0/24
ip prefix-list PL_IN_22_21 seq 30 permit 10.181.0.22/31
ip prefix-list PL_IN_22_21 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_22_21 seq 10 permit 10.200.24.0/24
ip prefix-list PL_OUT_22_21 seq 20 permit 10.200.22.0/24
!






route-map RM_POLICY_IN_22_11 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_IN_22_21 permit 10














 match ip address prefix-list PL_IN_22_21
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_22_21 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_22_11 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_22_0
 ! Block loopback 10.180.0.23/32


route-map RM_POLICY_OUT_22_11 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_0
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_22_11 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_1
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_22_11 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_2
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_22_11 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_22
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_22_11 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_22
 set metric 24
 set as-path prepend 65004 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_22_11 deny 65000














 ! Deny other outbound routes

!


route-map RM_POLICY_OUT_22_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_22_0
 ! Block loopback 10.180.0.23/32


route-map RM_POLICY_OUT_22_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_0
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_22_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_1
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_22_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_2
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_22_21 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_22
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_22_21 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_22
 set metric 12
 set as-path prepend 65004 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_22_21 deny 200














 match ip address prefix-list PL_OUT_22_21
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_22_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.23
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.23


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.25 peer-group RR



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.24 peer-group IBGP



 !
 neighbor 10.181.0.34 peer-group EBGP
 neighbor 10.181.0.34 remote-as 65001


 !
 neighbor 10.181.0.52 peer-group EBGP
 neighbor 10.181.0.52 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.25 activate



  neighbor 10.180.0.1 activate
  neighbor 10.180.0.1 next-hop-self


  neighbor 10.180.0.24 activate
  neighbor 10.180.0.24 next-hop-self



  neighbor 10.181.0.34 activate
  neighbor 10.181.0.34 route-map RM_POLICY_IN_22_11 in
  neighbor 10.181.0.34 route-map RM_POLICY_OUT_22_11 out


  neighbor 10.181.0.52 activate
  neighbor 10.181.0.52 route-map RM_POLICY_IN_22_21 in
  neighbor 10.181.0.52 route-map RM_POLICY_OUT_22_21 out





  network 10.200.22.0 mask 255.255.255.0

  network 10.200.23.0 mask 255.255.255.0

  network 10.200.24.0 mask 255.255.255.0

 exit-address-family
