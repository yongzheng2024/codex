
hostname 12_as65001_RAND
!
interface Loopback0
 ip address 10.180.0.13 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 19_as65001_UCLA (19)

 ip address 10.181.0.36 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 20_as65001_Stanford (20)

 ip address 10.181.0.38 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 14_as65003_SDC (14)

 ip address 10.181.0.40 255.255.255.254
 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.9.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.13
 passive-interface Loopback0
 network 10.180.0.13 0.0.0.0 area 0



network 10.181.0.36 0.0.0.1 area 0
network 10.181.0.38 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_12 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_12 seq 20 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_12_0 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LINK_12_1 seq 10 deny 10.181.0.38/31
!

ip prefix-list PL_EXPORT_DENY_LINK_12_2 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LONG_12 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_12_0 seq 10 deny 10.180.0.13/32
!






route-map RM_POLICY_OUT_12_14 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_12_0
 ! Block loopback 10.180.0.13/32


route-map RM_POLICY_OUT_12_14 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_0
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_12_14 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_1
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_12_14 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_2
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_12_14 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_12
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_12_14 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_12
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_12_14 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.13
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.13


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.18 peer-group RR



 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP



 !
 neighbor 10.181.0.41 peer-group EBGP
 neighbor 10.181.0.41 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.18 activate



  neighbor 10.180.0.10 activate
  neighbor 10.180.0.10 next-hop-self


  neighbor 10.180.0.12 activate
  neighbor 10.180.0.12 next-hop-self


  neighbor 10.180.0.14 activate
  neighbor 10.180.0.14 next-hop-self


  neighbor 10.180.0.21 activate
  neighbor 10.180.0.21 next-hop-self



  neighbor 10.181.0.41 activate
  neighbor 10.181.0.41 route-map RM_POLICY_OUT_12_14 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
