
hostname 1_as65002_MITRE
!
interface Loopback0
 ip address 10.180.0.2 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 2_as65002_CARNEGIE (2)

 ip address 10.181.0.4 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 4_as65005_ETAC (4)

 ip address 10.181.0.6 255.255.255.254
 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
ip route 10.200.3.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.2
 passive-interface Loopback0
 network 10.180.0.2 0.0.0.0 area 0



network 10.181.0.4 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_1 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 30 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 40 permit 10.200.3.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_1_0 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LINK_1_1 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LONG_1 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_1_0 seq 10 deny 10.180.0.2/32
!

ip prefix-list PL_IN_1_4 seq 10 permit 10.200.31.0/24
ip prefix-list PL_IN_1_4 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_1_4 seq 10 permit 10.200.3.0/24
ip prefix-list PL_OUT_1_4 seq 20 permit 10.200.1.0/24
!






route-map RM_POLICY_IN_1_4 permit 10














 match ip address prefix-list PL_IN_1_4
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_1_4 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_1_4 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_1_0
 ! Block loopback 10.180.0.2/32


route-map RM_POLICY_OUT_1_4 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_0
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_1_4 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_1
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_1_4 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_1
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_1_4 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_1
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_1_4 deny 200














 match ip address prefix-list PL_OUT_1_4
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_1_4 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.2


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.4 peer-group RR



 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.11 peer-group IBGP



 !
 neighbor 10.181.0.7 peer-group EBGP
 neighbor 10.181.0.7 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.4 activate



  neighbor 10.180.0.3 activate
  neighbor 10.180.0.3 next-hop-self


  neighbor 10.180.0.6 activate
  neighbor 10.180.0.6 next-hop-self


  neighbor 10.180.0.11 activate
  neighbor 10.180.0.11 next-hop-self



  neighbor 10.181.0.7 activate
  neighbor 10.181.0.7 route-map RM_POLICY_IN_1_4 in
  neighbor 10.181.0.7 route-map RM_POLICY_OUT_1_4 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

 exit-address-family
