
hostname 10_as65002_RADC
!
interface Loopback0
 ip address 10.180.0.11 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 3_as65002_CASE (3)

 ip address 10.181.0.11 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 23_as65004_Lincoln (23)

 ip address 10.181.0.30 255.255.255.254
 mtu 1500
!


ip route 10.200.4.0 255.255.255.0 Loopback100
ip route 10.200.5.0 255.255.255.0 Loopback101
ip route 10.200.6.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.11
 passive-interface Loopback0
 network 10.180.0.11 0.0.0.0 area 0



network 10.181.0.10 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_10 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 20 permit 10.200.5.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 30 permit 10.200.6.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_10_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_1 seq 10 deny 10.181.0.30/31
!

ip prefix-list PL_EXPORT_DENY_LONG_10 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_10_0 seq 10 deny 10.180.0.11/32
!

ip prefix-list PL_IN_10_23 seq 10 permit 10.200.25.0/24
ip prefix-list PL_IN_10_23 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_10_23 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_10_23 seq 10 permit 10.200.4.0/24
ip prefix-list PL_OUT_10_23 seq 20 permit 10.200.5.0/24
!






route-map RM_POLICY_IN_10_23 permit 10














 match ip address prefix-list PL_IN_10_23
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_10_23 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_10_23 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_23 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_10_23 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_10_23 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_10
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_10_23 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_10
 set community no-advertise no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_10_23 deny 200














 match ip address prefix-list PL_OUT_10_23
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_10_23 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.2 peer-group RR


 !
 neighbor 10.180.0.4 peer-group RR




 !
 neighbor 10.181.0.31 peer-group EBGP
 neighbor 10.181.0.31 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.2 activate


  neighbor 10.180.0.4 activate




  neighbor 10.181.0.31 activate
  neighbor 10.181.0.31 route-map RM_POLICY_IN_10_23 in
  neighbor 10.181.0.31 route-map RM_POLICY_OUT_10_23 out





  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

  network 10.200.6.0 mask 255.255.255.0

 exit-address-family
