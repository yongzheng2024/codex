
hostname 17_as65003_17
!
interface Loopback0
 ip address 10.180.0.18 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!



ip access-list extended ACL_17_GigabitEthernet0_0
 10 permit ip host 10.180.0.33 any
 20 permit ip host 10.181.0.78 any
 30 permit ip host 10.181.0.79 any
 40 deny ip 192.0.2.0 0.0.0.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 32_as65001_32 (32)

 ip address 10.181.0.78 255.255.255.254

 ip access-group ACL_17_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 54_as65003_54 (54)

 ip address 10.181.0.80 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.9.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.18
 passive-interface Loopback0
 network 10.180.0.18 0.0.0.0 area 0



network 10.181.0.80 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_17 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_17 seq 20 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_17_0 seq 10 deny 10.181.0.78/31
!

ip prefix-list PL_EXPORT_DENY_LINK_17_1 seq 10 deny 10.181.0.80/31
!

ip prefix-list PL_EXPORT_DENY_LONG_17 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_17_0 seq 10 deny 10.180.0.18/32
!

ip prefix-list PL_IN_17_32 seq 10 permit 10.181.0.76/31
ip prefix-list PL_IN_17_32 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_17_32 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_17_32 seq 10 permit 10.200.9.0/24
!






route-map RM_POLICY_IN_17_32 permit 10














 match ip address prefix-list PL_IN_17_32
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_17_32 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_17_32 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_17_0
 ! Block loopback 10.180.0.18/32


route-map RM_POLICY_OUT_17_32 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_0
 ! Block link 10.181.0.78/31


route-map RM_POLICY_OUT_17_32 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_1
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_17_32 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_17
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_17_32 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_17
 set metric 13
 set as-path prepend 65003 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_17_32 deny 200














 match ip address prefix-list PL_OUT_17_32
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_17_32 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.18
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.4 peer-group IBGP


 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP


 !
 neighbor 10.180.0.36 peer-group IBGP


