 neighbor 10.180.0.37 peer-group IBGP


 !
 neighbor 10.180.0.50 peer-group IBGP


 !
 neighbor 10.180.0.55 peer-group IBGP


 !
 neighbor 10.180.0.57 peer-group IBGP



 !
 neighbor 10.181.0.79 peer-group EBGP
 neighbor 10.181.0.79 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.4 activate


  neighbor 10.180.0.10 activate


  neighbor 10.180.0.25 activate


  neighbor 10.180.0.26 activate


  neighbor 10.180.0.36 activate


  neighbor 10.180.0.37 activate


  neighbor 10.180.0.50 activate


