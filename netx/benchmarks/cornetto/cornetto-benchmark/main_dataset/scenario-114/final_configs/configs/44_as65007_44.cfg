!





route-map RM_POLICY_IN_44_10 permit 5














 match community CL_COMM_44_10
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_44_10 permit 10














 match ip address prefix-list PL_IN_44_10
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_44_10 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_44_10 permit 1000














 ! Default permit for other communities

