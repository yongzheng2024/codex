  neighbor 10.180.0.15 activate




  neighbor 10.181.0.32 activate
  neighbor 10.181.0.32 route-map RM_POLICY_IN_44_10 in
  neighbor 10.181.0.32 route-map RM_POLICY_OUT_44_10 out





  network 10.200.39.0 mask 255.255.255.0

  network 10.200.40.0 mask 255.255.255.0

  network 10.200.41.0 mask 255.255.255.0

  network 10.200.42.0 mask 255.255.255.0

