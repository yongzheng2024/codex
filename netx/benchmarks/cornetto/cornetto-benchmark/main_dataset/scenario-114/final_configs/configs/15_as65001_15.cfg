  neighbor 10.181.0.75 route-map RM_POLICY_OUT_15_35 out





  network 10.200.6.0 mask 255.255.255.0

  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

