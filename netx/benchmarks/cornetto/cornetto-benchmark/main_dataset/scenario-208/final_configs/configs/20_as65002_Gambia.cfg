
hostname 20_as65002_Gambia
!
interface Loopback0
 ip address 10.180.0.21 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 0_as65002_0 (0)

 ip address 10.181.0.1 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 1_as65002_1 (1)

 ip address 10.181.0.3 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 16_as65002_16 (16)

 ip address 10.181.0.35 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/3
 description to 21_as65001_Gambia (21)

 ip address 10.181.0.42 255.255.255.254
 mtu 1500
!


ip route 10.200.4.0 255.255.255.0 Loopback100
ip route 10.200.5.0 255.255.255.0 Loopback101
ip route 10.200.6.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.21
 passive-interface Loopback0
 network 10.180.0.21 0.0.0.0 area 0










 redistribute bgp 65002 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_20

network 10.181.0.0 0.0.0.1 area 0
network 10.181.0.2 0.0.0.1 area 0
network 10.181.0.34 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 10 permit 10.200.7.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 20 permit 10.200.8.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 30 permit 10.200.9.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 40 permit 10.200.10.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_20 seq 10 permit 10.180.0.21/32
ip prefix-list PL_BGP_TO_OSPF_DENY_20 seq 20 permit 10.181.0.0/31
ip prefix-list PL_BGP_TO_OSPF_DENY_20 seq 30 permit 10.181.0.2/31
ip prefix-list PL_BGP_TO_OSPF_DENY_20 seq 40 permit 10.181.0.34/31
ip prefix-list PL_BGP_TO_OSPF_DENY_20 seq 50 permit 10.181.0.42/31
!

ip prefix-list PL_EXPORT_ALLOWED_20 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 20 permit 10.200.5.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 30 permit 10.200.6.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_20_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_20_1 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LINK_20_2 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_20_3 seq 10 deny 10.181.0.42/31
!

ip prefix-list PL_EXPORT_DENY_LONG_20 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_20_0 seq 10 deny 10.180.0.21/32
!






route-map RM_BGP_TO_OSPF_20 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_20 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_20
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_20 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_20
 set tag 65010

!


route-map RM_POLICY_OUT_20_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_20_0
 ! Block loopback 10.180.0.21/32


route-map RM_POLICY_OUT_20_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_20_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_20_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_2
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_20_21 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_3
 ! Block link 10.181.0.42/31


route-map RM_POLICY_OUT_20_21 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_20
 set community no-advertise no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_20_21 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_20
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_20_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.21
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP



 !
 neighbor 10.181.0.43 peer-group EBGP
 neighbor 10.181.0.43 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.17 activate



  neighbor 10.181.0.43 activate
  neighbor 10.181.0.43 route-map RM_POLICY_OUT_20_21 out





  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

  network 10.200.6.0 mask 255.255.255.0

 exit-address-family
