
hostname 23_as65005_Gambia
!
interface Loopback0
 ip address 10.180.0.24 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.12.0/24


 ip address 10.200.12.1 255.255.255.0
!



ip access-list extended ACL_23_GigabitEthernet0_2
 10 permit ip host 10.180.0.22 any
 20 permit ip host 10.181.0.46 any
 30 permit ip host 10.181.0.47 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 7_as65005_7 (7)

 ip address 10.181.0.21 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 13_as65005_13 (13)

 ip address 10.181.0.29 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 21_as65001_Gambia (21)

 ip address 10.181.0.47 255.255.255.254

 ip access-group ACL_23_GigabitEthernet0_2 in
 mtu 1500
!


ip route 10.200.11.0 255.255.255.0 Loopback100
ip route 10.200.12.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.24
 passive-interface Loopback0
 network 10.180.0.24 0.0.0.0 area 0



network 10.181.0.20 0.0.0.1 area 0
network 10.181.0.28 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_23 seq 10 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 20 permit 10.200.12.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_23_0 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_1 seq 10 deny 10.181.0.28/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_2 seq 10 deny 10.181.0.46/31
!

ip prefix-list PL_EXPORT_DENY_LONG_23 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_23_0 seq 10 deny 10.180.0.24/32
!

ip prefix-list PL_IN_23_21 seq 10 permit 10.200.9.0/24
ip prefix-list PL_IN_23_21 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_23_21 seq 10 permit 10.200.12.0/24
ip prefix-list PL_OUT_23_21 seq 20 permit 10.200.11.0/24
!






route-map RM_POLICY_IN_23_21 permit 10














 match ip address prefix-list PL_IN_23_21
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_23_21 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_23_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_23_0
 ! Block loopback 10.180.0.24/32


route-map RM_POLICY_OUT_23_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_0
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_23_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_1
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_23_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_2
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_23_21 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_23
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_23_21 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_23
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_23_21 deny 200














 match ip address prefix-list PL_OUT_23_21
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_23_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.24
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.14 peer-group IBGP



 !
 neighbor 10.181.0.46 peer-group EBGP
 neighbor 10.181.0.46 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.8 activate


  neighbor 10.180.0.14 activate



  neighbor 10.181.0.46 activate
  neighbor 10.181.0.46 route-map RM_POLICY_IN_23_21 in
  neighbor 10.181.0.46 route-map RM_POLICY_OUT_23_21 out





  network 10.200.11.0 mask 255.255.255.0

  network 10.200.12.0 mask 255.255.255.0

 exit-address-family
