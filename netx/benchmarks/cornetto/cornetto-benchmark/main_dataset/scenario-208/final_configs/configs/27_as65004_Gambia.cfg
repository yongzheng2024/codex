
hostname 27_as65004_Gambia
!
interface Loopback0
 ip address 10.180.0.28 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.17.0/24


 ip address 10.200.17.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.18.0/24


 ip address 10.200.18.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 2_as65003_Gambia (2)

 ip address 10.181.0.5 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 26_as65004_Gambia (26)

 ip address 10.181.0.55 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.17.0 255.255.255.0 Loopback100
ip route 10.200.18.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.28
 passive-interface Loopback0
 network 10.180.0.28 0.0.0.0 area 0



network 10.181.0.54 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_27 seq 10 permit 10.200.17.0/24
ip prefix-list PL_EXPORT_ALLOWED_27 seq 20 permit 10.200.18.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_27_0 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LINK_27_1 seq 10 deny 10.181.0.54/31
!

ip prefix-list PL_EXPORT_DENY_LONG_27 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_27_0 seq 10 deny 10.180.0.28/32
!




ip community-list standard CL_COMM_27_2 permit 65535:65282
ip community-list standard CL_COMM_27_2 permit no-advertise
!





route-map RM_POLICY_IN_27_2 permit 5














 match community CL_COMM_27_2
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_27_2 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_27_2 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_27_0
 ! Block loopback 10.180.0.28/32


route-map RM_POLICY_OUT_27_2 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_0
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_27_2 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_1
 ! Block link 10.181.0.54/31


route-map RM_POLICY_OUT_27_2 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_27
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_27_2 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_27
 set community 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_27_2 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.28
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP



 !
 neighbor 10.181.0.4 peer-group EBGP
 neighbor 10.181.0.4 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.26 activate


  neighbor 10.180.0.27 activate



  neighbor 10.181.0.4 activate
  neighbor 10.181.0.4 route-map RM_POLICY_OUT_27_2 out





  network 10.200.17.0 mask 255.255.255.0

  network 10.200.18.0 mask 255.255.255.0

 exit-address-family
