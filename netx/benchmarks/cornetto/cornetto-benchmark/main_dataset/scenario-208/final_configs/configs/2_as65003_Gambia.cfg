
hostname 2_as65003_Gambia
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 27_as65004_Gambia (27)

 ip address 10.181.0.4 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 3_as65003_Gambia (3)

 ip address 10.181.0.6 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
ip route 10.200.3.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0










 redistribute bgp 65003 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_2

network 10.181.0.6 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 10 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 20 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 30 permit 10.200.15.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 40 permit 10.200.16.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 50 permit 10.200.17.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 60 permit 10.200.18.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 10 permit 10.180.0.3/32
ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 20 permit 10.181.0.4/31
ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 30 permit 10.181.0.6/31
!

ip prefix-list PL_EXPORT_ALLOWED_2 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 30 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 40 permit 10.200.3.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_2_0 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_1 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LONG_2 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_2_0 seq 10 deny 10.180.0.3/32
!

ip prefix-list PL_IN_2_27 seq 10 permit 10.200.17.0/24
ip prefix-list PL_IN_2_27 seq 20 permit 10.181.0.4/31
ip prefix-list PL_IN_2_27 seq 30 permit 10.181.0.54/31
ip prefix-list PL_IN_2_27 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_2_27 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_2_27 seq 10 permit 10.200.1.0/24
ip prefix-list PL_OUT_2_27 seq 20 permit 10.200.0.0/24
!






route-map RM_BGP_TO_OSPF_2 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_2 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_2
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_2 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_2
 set tag 65010

!


route-map RM_POLICY_IN_2_27 permit 10














 match ip address prefix-list PL_IN_2_27
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_2_27 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_2_27 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_27 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_2_27 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_2_27 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_27 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_2
 set metric 8
 set as-path prepend 65003 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_2_27 deny 200














 match ip address prefix-list PL_OUT_2_27
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_2_27 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.4 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP



 !
 neighbor 10.181.0.5 peer-group EBGP
 neighbor 10.181.0.5 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.4 activate


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.12 activate



  neighbor 10.181.0.5 activate
  neighbor 10.181.0.5 route-map RM_POLICY_IN_2_27 in





  network 10.180.0.3 mask 255.255.255.255

  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

 exit-address-family
