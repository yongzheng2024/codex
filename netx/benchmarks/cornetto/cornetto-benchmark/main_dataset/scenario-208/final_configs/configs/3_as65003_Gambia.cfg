
hostname 3_as65003_Gambia
!
interface Loopback0
 ip address 10.180.0.4 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.19.0/24


 ip address 10.200.19.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.20.0/24


 ip address 10.200.20.1 255.255.255.0
!



ip access-list extended ACL_3_GigabitEthernet0_4
 10 permit ip host 10.180.0.22 any
 20 permit ip host 10.181.0.14 any
 30 permit ip host 10.181.0.15 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 2_as65003_Gambia (2)

 ip address 10.181.0.7 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65003_11 (11)

 ip address 10.181.0.8 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 10_as65003_10 (10)

 ip address 10.181.0.10 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/3
 description to 6_as65003_6 (6)

 ip address 10.181.0.12 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/4
 description to 21_as65001_Gambia (21)

 ip address 10.181.0.14 255.255.255.254

 ip access-group ACL_3_GigabitEthernet0_4 in
 mtu 1500
!


ip route 10.200.19.0 255.255.255.0 Loopback100
ip route 10.200.20.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.4
 passive-interface Loopback0
 network 10.180.0.4 0.0.0.0 area 0










 redistribute bgp 65003 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_3

network 10.181.0.6 0.0.0.1 area 0
network 10.181.0.8 0.0.0.1 area 0
network 10.181.0.10 0.0.0.1 area 0
network 10.181.0.12 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 10 permit 10.200.7.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 20 permit 10.200.8.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 30 permit 10.200.9.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 40 permit 10.200.10.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 10 permit 10.180.0.4/32
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 20 permit 10.181.0.6/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 30 permit 10.181.0.8/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 40 permit 10.181.0.10/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 50 permit 10.181.0.12/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 60 permit 10.181.0.14/31
!

ip prefix-list PL_EXPORT_ALLOWED_3 seq 10 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 20 permit 10.200.20.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_3_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_1 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_2 seq 10 deny 10.181.0.14/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_3 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_4 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_3 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_3_0 seq 10 deny 10.180.0.4/32
!

ip prefix-list PL_IN_3_21 seq 10 permit 10.181.0.16/31
ip prefix-list PL_IN_3_21 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_3_21 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_3_21 seq 10 permit 10.200.20.0/24
!






route-map RM_BGP_TO_OSPF_3 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_3 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_3
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_3 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_3
 set tag 65010

!


route-map RM_POLICY_IN_3_21 permit 10














 match ip address prefix-list PL_IN_3_21
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_3_21 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_3_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_3_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_3_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_2
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_3_21 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_3
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_3_21 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_3
 set community 65000:200 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_3_21 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_4
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_3_21 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_21 deny 200














 match ip address prefix-list PL_OUT_3_21
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_3_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP



 !
 neighbor 10.181.0.15 peer-group EBGP
 neighbor 10.181.0.15 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.3 activate


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.12 activate



  neighbor 10.181.0.15 activate
  neighbor 10.181.0.15 route-map RM_POLICY_IN_3_21 in
  neighbor 10.181.0.15 route-map RM_POLICY_OUT_3_21 out





  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

 exit-address-family
