
hostname 25_as65004_Gambia
!
interface Loopback0
 ip address 10.180.0.26 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.13.0/24


 ip address 10.200.13.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.14.0/24


 ip address 10.200.14.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.15.0/24


 ip address 10.200.15.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.16.0/24


 ip address 10.200.16.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 21_as65001_Gambia (21)

 ip address 10.181.0.51 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 26_as65004_Gambia (26)

 ip address 10.181.0.52 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.13.0 255.255.255.0 Loopback100
ip route 10.200.14.0 255.255.255.0 Loopback101
ip route 10.200.15.0 255.255.255.0 Loopback102
ip route 10.200.16.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.26
 passive-interface Loopback0
 network 10.180.0.26 0.0.0.0 area 0



network 10.181.0.52 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_25 seq 10 permit 10.200.13.0/24
ip prefix-list PL_EXPORT_ALLOWED_25 seq 20 permit 10.200.14.0/24
ip prefix-list PL_EXPORT_ALLOWED_25 seq 30 permit 10.200.15.0/24
ip prefix-list PL_EXPORT_ALLOWED_25 seq 40 permit 10.200.16.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_25_0 seq 10 deny 10.181.0.50/31
!

ip prefix-list PL_EXPORT_DENY_LINK_25_1 seq 10 deny 10.181.0.52/31
!

ip prefix-list PL_EXPORT_DENY_LONG_25 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_25_0 seq 10 deny 10.180.0.26/32
!

ip prefix-list PL_IN_25_21 seq 10 permit 10.200.9.0/24
ip prefix-list PL_IN_25_21 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_25_21 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_25_21 seq 10 permit 10.200.14.0/24
!






route-map RM_POLICY_IN_25_21 permit 10














 match ip address prefix-list PL_IN_25_21
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_25_21 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_25_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_25_0
 ! Block loopback 10.180.0.26/32


route-map RM_POLICY_OUT_25_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_0
 ! Block link 10.181.0.50/31


route-map RM_POLICY_OUT_25_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_1
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_25_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_25
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_25_21 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_25
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_25_21 deny 200














 match ip address prefix-list PL_OUT_25_21
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_25_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.26
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP



 !
 neighbor 10.181.0.50 peer-group EBGP
 neighbor 10.181.0.50 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.27 activate


  neighbor 10.180.0.28 activate



  neighbor 10.181.0.50 activate
  neighbor 10.181.0.50 route-map RM_POLICY_IN_25_21 in
  neighbor 10.181.0.50 route-map RM_POLICY_OUT_25_21 out





  network 10.200.13.0 mask 255.255.255.0

  network 10.200.14.0 mask 255.255.255.0

  network 10.200.15.0 mask 255.255.255.0

  network 10.200.16.0 mask 255.255.255.0

 exit-address-family
