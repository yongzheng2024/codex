
hostname 34_as65007_Liepaja
!
interface Loopback0
 ip address 10.180.0.35 255.255.255.255





 ip router isis 1

!
interface Loopback100
 description Customer network 10.200.20.0/24


 ip address 10.200.20.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 11_as65007_Kapsede (11)

 ip address 10.181.0.25 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 30_as65001_Riga (30)

 ip address 10.181.0.79 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 33_as65007_Grobina (33)

 ip address 10.181.0.117 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.20.0 255.255.255.0 Loopback100
ip route 10.200.21.0 255.255.255.0 Loopback101
ip route 10.200.22.0 255.255.255.0 Loopback102
!

router isis 1
 net 31.ef00.0000.0ab4.0023.00
 is-type level-1-2
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_34 seq 10 permit 10.200.20.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 20 permit 10.200.21.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 30 permit 10.200.22.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_34_0 seq 10 deny 10.181.0.116/31
!

ip prefix-list PL_EXPORT_DENY_LINK_34_1 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_34_2 seq 10 deny 10.181.0.78/31
!

ip prefix-list PL_EXPORT_DENY_LONG_34 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_34_0 seq 10 deny 10.180.0.35/32
!

ip prefix-list PL_IN_34_30 seq 10 permit 10.200.17.0/24
ip prefix-list PL_IN_34_30 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_34_30 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_34_30 seq 10 permit 10.200.21.0/24
ip prefix-list PL_OUT_34_30 seq 20 permit 10.200.22.0/24
!






route-map RM_POLICY_IN_34_30 permit 10














 match ip address prefix-list PL_IN_34_30
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_34_30 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_34_30 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_34_0
 ! Block loopback 10.180.0.35/32


route-map RM_POLICY_OUT_34_30 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_0
 ! Block link 10.181.0.116/31


route-map RM_POLICY_OUT_34_30 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_1
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_34_30 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_2
 ! Block link 10.181.0.78/31


route-map RM_POLICY_OUT_34_30 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_34
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_34_30 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_34
 set metric 9
 set as-path prepend 65007
 ! Outbound policy baseline


route-map RM_POLICY_OUT_34_30 deny 200














 match ip address prefix-list PL_OUT_34_30
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_34_30 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.35
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65007
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.34 peer-group IBGP



 !
 neighbor 10.181.0.78 peer-group EBGP
 neighbor 10.181.0.78 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.34 activate



  neighbor 10.181.0.78 activate
  neighbor 10.181.0.78 route-map RM_POLICY_IN_34_30 in
  neighbor 10.181.0.78 route-map RM_POLICY_OUT_34_30 out





  network 10.200.20.0 mask 255.255.255.0

  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

 exit-address-family
