route-map RM_POLICY_IN_31_30 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_31_30 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_31_0
 ! Block loopback 10.180.0.32/32


