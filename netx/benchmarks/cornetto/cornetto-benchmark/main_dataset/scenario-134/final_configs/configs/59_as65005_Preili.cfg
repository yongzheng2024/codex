!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_59_0 seq 10 deny 10.180.0.60/32
!






route-map RM_POLICY_OUT_59_30 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_59_0
 ! Block loopback 10.180.0.60/32


route-map RM_POLICY_OUT_59_30 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_59_0
 ! Block link 10.181.0.106/31


route-map RM_POLICY_OUT_59_30 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_59_1
 ! Block link 10.181.0.112/31


route-map RM_POLICY_OUT_59_30 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_59
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_59_30 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_59
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_59_30 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.60
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



