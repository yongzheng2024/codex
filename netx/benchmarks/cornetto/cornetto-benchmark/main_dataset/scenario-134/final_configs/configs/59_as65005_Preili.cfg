 neighbor 10.180.0.27 peer-group IBGP


 !
 neighbor 10.180.0.32 peer-group IBGP


 !
 neighbor 10.180.0.66 peer-group IBGP


 !
 neighbor 10.180.0.67 peer-group IBGP


 !
 neighbor 10.180.0.68 peer-group IBGP


 !
 neighbor 10.180.0.69 peer-group IBGP



 !
 neighbor 10.181.0.106 peer-group EBGP
 neighbor 10.181.0.106 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.27 activate


  neighbor 10.180.0.32 activate


  neighbor 10.180.0.66 activate


  neighbor 10.180.0.67 activate


  neighbor 10.180.0.68 activate


  neighbor 10.180.0.69 activate



  neighbor 10.181.0.106 activate
  neighbor 10.181.0.106 route-map RM_POLICY_OUT_59_30 out





  network 10.200.34.0 mask 255.255.255.0

  network 10.200.35.0 mask 255.255.255.0

  network 10.200.36.0 mask 255.255.255.0

