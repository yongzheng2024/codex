ip prefix-list PL_EXPORT_ALLOWED_59 seq 10 permit 10.200.34.0/24
ip prefix-list PL_EXPORT_ALLOWED_59 seq 20 permit 10.200.35.0/24
ip prefix-list PL_EXPORT_ALLOWED_59 seq 30 permit 10.200.36.0/24
