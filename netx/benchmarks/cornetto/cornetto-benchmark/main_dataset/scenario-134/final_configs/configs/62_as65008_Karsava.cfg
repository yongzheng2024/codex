
hostname 62_as65008_Karsava
!
interface Loopback0
 ip address 10.180.0.63 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.37.0/24


 ip address 10.200.37.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.38.0/24


 ip address 10.200.38.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.39.0/24


 ip address 10.200.39.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.40.0/24


 ip address 10.200.40.1 255.255.255.0
!



ip access-list extended ACL_62_GigabitEthernet0_0
 10 permit ip host 10.180.0.31 any
 20 permit ip host 10.181.0.110 any
 30 permit ip host 10.181.0.111 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 30_as65001_Riga (30)

 ip address 10.181.0.111 255.255.255.254

 ip access-group ACL_62_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 63_as65008_Malnava (63)

 ip address 10.181.0.138 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.37.0 255.255.255.0 Loopback100
ip route 10.200.38.0 255.255.255.0 Loopback101
ip route 10.200.39.0 255.255.255.0 Loopback102
ip route 10.200.40.0 255.255.255.0 Loopback103
!

router isis 1
 net 31.f000.0000.0ab4.003f.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_62 seq 10 permit 10.200.37.0/24
ip prefix-list PL_EXPORT_ALLOWED_62 seq 20 permit 10.200.38.0/24
ip prefix-list PL_EXPORT_ALLOWED_62 seq 30 permit 10.200.39.0/24
ip prefix-list PL_EXPORT_ALLOWED_62 seq 40 permit 10.200.40.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_62_0 seq 10 deny 10.181.0.110/31
!

ip prefix-list PL_EXPORT_DENY_LINK_62_1 seq 10 deny 10.181.0.138/31
!

ip prefix-list PL_EXPORT_DENY_LONG_62 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_62_0 seq 10 deny 10.180.0.63/32
!






route-map RM_POLICY_IN_62_30 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_62_30 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_62_0
 ! Block loopback 10.180.0.63/32


route-map RM_POLICY_OUT_62_30 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_62_0
 ! Block link 10.181.0.110/31


route-map RM_POLICY_OUT_62_30 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_62_1
 ! Block link 10.181.0.138/31


route-map RM_POLICY_OUT_62_30 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_62
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_62_30 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_62
 set metric 17
 set as-path prepend 65008 65008
 ! Outbound policy baseline


route-map RM_POLICY_OUT_62_30 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.63
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65008
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.64 peer-group IBGP


 !
 neighbor 10.180.0.65 peer-group IBGP



 !
 neighbor 10.181.0.110 peer-group EBGP
 neighbor 10.181.0.110 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.64 activate


  neighbor 10.180.0.65 activate



  neighbor 10.181.0.110 activate
  neighbor 10.181.0.110 route-map RM_POLICY_IN_62_30 in
  neighbor 10.181.0.110 route-map RM_POLICY_OUT_62_30 out





  network 10.200.37.0 mask 255.255.255.0

  network 10.200.38.0 mask 255.255.255.0

  network 10.200.39.0 mask 255.255.255.0

  network 10.200.40.0 mask 255.255.255.0

 exit-address-family
