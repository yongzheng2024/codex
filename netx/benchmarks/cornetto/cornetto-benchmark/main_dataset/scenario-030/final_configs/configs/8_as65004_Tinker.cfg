 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP



 !
 address-family ipv4


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.22 activate






