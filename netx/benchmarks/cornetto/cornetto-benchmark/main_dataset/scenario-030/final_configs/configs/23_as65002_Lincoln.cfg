
hostname 23_as65002_Lincoln
!
interface Loopback0
 ip address 10.180.0.24 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 10_as65002_RADC (10)

 ip address 10.181.0.31 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 24_as65002_MIT (24)

 ip address 10.181.0.54 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


router ospf 1
 router-id 10.180.0.24
 passive-interface Loopback0
 network 10.180.0.24 0.0.0.0 area 0



network 10.181.0.30 0.0.0.1 area 0
network 10.181.0.54 0.0.0.1 area 0
!








router bgp 65002
 bgp router-id 10.180.0.24
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0




 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP



 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.23 activate


  neighbor 10.180.0.25 activate






 exit-address-family
