route-map RM_POLICY_IN_18_19 permit 10














 match ip address prefix-list PL_IN_18_19
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_18_19 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_18_19 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_18_0
 ! Block loopback 10.180.0.19/32


route-map RM_POLICY_OUT_18_19 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_18_0
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_18_19 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_18_1
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_18_19 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_18
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_18_19 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_18
 set metric 7
 set as-path prepend 65002 65002 65002
 set community no-advertise no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_18_19 deny 200














 match ip address prefix-list PL_OUT_18_19
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_18_19 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.19
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



