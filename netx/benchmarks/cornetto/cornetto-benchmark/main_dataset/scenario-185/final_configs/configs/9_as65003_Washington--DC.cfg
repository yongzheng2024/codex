
hostname 9_as65003_Washington--DC
!
interface Loopback0
 ip address 10.180.0.10 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.27.0/24


 ip address 10.200.27.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.28.0/24


 ip address 10.200.28.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.29.0/24


 ip address 10.200.29.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.30.0/24


 ip address 10.200.30.1 255.255.255.0
!



ip access-list extended ACL_9_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.10 any
 20 permit ip host 10.181.0.21 any
 30 permit ip host 10.181.0.22 any
 40 permit ip 10.181.0.20 0.0.0.1 any
 50 permit ip 10.181.0.22 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 8_as65001_New-York (8)

 ip address 10.181.0.21 255.255.255.254

 ip access-group ACL_9_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 16_as65003_Atlanta (16)

 ip address 10.181.0.22 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.27.0 255.255.255.0 Loopback100
ip route 10.200.28.0 255.255.255.0 Loopback101
ip route 10.200.29.0 255.255.255.0 Loopback102
ip route 10.200.30.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.10
 passive-interface Loopback0
 network 10.180.0.10 0.0.0.0 area 0



network 10.181.0.22 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_9 seq 10 permit 10.200.27.0/24
ip prefix-list PL_EXPORT_ALLOWED_9 seq 20 permit 10.200.28.0/24
ip prefix-list PL_EXPORT_ALLOWED_9 seq 30 permit 10.200.29.0/24
ip prefix-list PL_EXPORT_ALLOWED_9 seq 40 permit 10.200.30.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_9_0 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LINK_9_1 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LONG_9 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_9_0 seq 10 deny 10.180.0.10/32
!

ip prefix-list PL_IN_9_8 seq 10 permit 10.200.26.0/24
ip prefix-list PL_IN_9_8 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_9_8 seq 10 permit 10.200.27.0/24
ip prefix-list PL_OUT_9_8 seq 20 permit 10.200.29.0/24
!






route-map RM_POLICY_IN_9_8 permit 10














 match ip address prefix-list PL_IN_9_8
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_9_8 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_9_8 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_9_0
 ! Block loopback 10.180.0.10/32


route-map RM_POLICY_OUT_9_8 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_9_0
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_9_8 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_9_1
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_9_8 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_9
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_9_8 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_9
 set metric 22
 set as-path prepend 65003 65003
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_9_8 deny 200














 match ip address prefix-list PL_OUT_9_8
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_9_8 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.10
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.10


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.12 peer-group RR



 !
 neighbor 10.180.0.21 peer-group IBGP



 !
 neighbor 10.181.0.20 peer-group EBGP
 neighbor 10.181.0.20 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.12 activate



  neighbor 10.180.0.21 activate
  neighbor 10.180.0.21 next-hop-self



  neighbor 10.181.0.20 activate
  neighbor 10.181.0.20 route-map RM_POLICY_IN_9_8 in
  neighbor 10.181.0.20 route-map RM_POLICY_OUT_9_8 out





  network 10.200.27.0 mask 255.255.255.0

  network 10.200.28.0 mask 255.255.255.0

  network 10.200.29.0 mask 255.255.255.0

  network 10.200.30.0 mask 255.255.255.0

 exit-address-family
