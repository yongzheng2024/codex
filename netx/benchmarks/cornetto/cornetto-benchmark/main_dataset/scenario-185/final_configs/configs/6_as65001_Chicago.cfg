
hostname 6_as65001_Chicago
!
interface Loopback0
 ip address 10.180.0.7 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!



ip access-list extended ACL_6_GigabitEthernet0_1
 10 permit ip host 10.180.0.13 any
 20 permit ip host 10.181.0.16 any
 30 permit ip host 10.181.0.17 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_6_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.7 any
 20 permit ip host 10.181.0.5 any
 30 permit ip host 10.181.0.16 any
 40 permit ip host 10.181.0.18 any
 50 permit ip 10.181.0.16 0.0.0.1 any
 60 permit ip 10.181.0.4 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 1_as65001_Minneapolis (1)

 ip address 10.181.0.5 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 12_as65004_St-Louis (12)

 ip address 10.181.0.16 255.255.255.254

 ip access-group ACL_6_GigabitEthernet0_1 in

 ip access-group ACL_6_GigabitEthernet0_1_OUT out
