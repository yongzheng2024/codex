
hostname 11_as65003_Houston
!
interface Loopback0
 ip address 10.180.0.12 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!



ip access-list extended ACL_11_GigabitEthernet0_2_OUT
 10 permit ip host 10.180.0.12 any
 20 permit ip host 10.181.0.28 any
 30 permit ip host 10.181.0.30 any
 40 permit ip host 10.181.0.32 any
 50 permit ip 10.181.0.30 0.0.0.1 any
 60 permit ip 10.181.0.32 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 16_as65003_Atlanta (16)

 ip address 10.181.0.28 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 20_as65003_Dallas (20)

 ip address 10.181.0.30 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 12_as65004_St-Louis (12)

 ip address 10.181.0.32 255.255.255.254

 ip access-group ACL_11_GigabitEthernet0_2_OUT out
 mtu 1500
!


ip route 10.200.3.0 255.255.255.0 Loopback100
ip route 10.200.4.0 255.255.255.0 Loopback101
ip route 10.200.5.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.12
 passive-interface Loopback0
 network 10.180.0.12 0.0.0.0 area 0










 redistribute bgp 65003 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_11

network 10.181.0.28 0.0.0.1 area 0
network 10.181.0.30 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_11 seq 10 permit 10.200.0.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_11 seq 20 permit 10.200.1.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_11 seq 30 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_11 seq 40 permit 10.200.6.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_11 seq 50 permit 10.200.7.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_11 seq 60 permit 10.200.8.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_11 seq 70 permit 10.200.9.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_11 seq 10 permit 10.180.0.12/32
ip prefix-list PL_BGP_TO_OSPF_DENY_11 seq 20 permit 10.181.0.28/31
ip prefix-list PL_BGP_TO_OSPF_DENY_11 seq 30 permit 10.181.0.30/31
ip prefix-list PL_BGP_TO_OSPF_DENY_11 seq 40 permit 10.181.0.32/31
!

ip prefix-list PL_EXPORT_ALLOWED_11 seq 10 permit 10.200.3.0/24
ip prefix-list PL_EXPORT_ALLOWED_11 seq 20 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_11 seq 30 permit 10.200.5.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_11_0 seq 10 deny 10.181.0.28/31
!

ip prefix-list PL_EXPORT_DENY_LINK_11_1 seq 10 deny 10.181.0.30/31
!

ip prefix-list PL_EXPORT_DENY_LINK_11_2 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LONG_11 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_11_0 seq 10 deny 10.180.0.12/32
!




ip community-list standard CL_COMM_11_12 permit no-advertise
ip community-list standard CL_COMM_11_12 permit no-export
!





route-map RM_BGP_TO_OSPF_11 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_11 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_11
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_11 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_11
 set tag 65010

!


route-map RM_POLICY_IN_11_12 permit 5














 match community CL_COMM_11_12
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_11_12 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_11_12 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_11_0
 ! Block loopback 10.180.0.12/32


route-map RM_POLICY_OUT_11_12 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_0
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_11_12 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_1
 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_11_12 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_2
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_11_12 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_11
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_11_12 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_11
 set community 65000:100 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_11_12 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.12
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.10


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.10 peer-group RR



 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP



 !
 neighbor 10.181.0.33 peer-group EBGP
 neighbor 10.181.0.33 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.10 activate



  neighbor 10.180.0.12 activate


  neighbor 10.180.0.20 activate
  neighbor 10.180.0.20 next-hop-self



  neighbor 10.181.0.33 activate
  neighbor 10.181.0.33 route-map RM_POLICY_IN_11_12 in
  neighbor 10.181.0.33 route-map RM_POLICY_OUT_11_12 out





  network 10.200.3.0 mask 255.255.255.0

  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

 exit-address-family
