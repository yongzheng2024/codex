
hostname 19_as65003_Tucson
!
interface Loopback0
 ip address 10.180.0.20 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.18.0/24


 ip address 10.200.18.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.19.0/24


 ip address 10.200.19.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.20.0/24


 ip address 10.200.20.1 255.255.255.0
!



ip access-list extended ACL_19_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.20 any
 20 permit ip host 10.181.0.41 any
 30 permit ip host 10.181.0.42 any
 40 permit ip 10.181.0.40 0.0.0.1 any
 50 permit ip 10.181.0.42 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 18_as65002_Phoenix (18)

 ip address 10.181.0.41 255.255.255.254

 ip access-group ACL_19_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 20_as65003_Dallas (20)

 ip address 10.181.0.42 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.18.0 255.255.255.0 Loopback100
ip route 10.200.19.0 255.255.255.0 Loopback101
ip route 10.200.20.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.20
 passive-interface Loopback0
 network 10.180.0.20 0.0.0.0 area 0



network 10.181.0.42 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_19 seq 10 permit 10.200.18.0/24
ip prefix-list PL_EXPORT_ALLOWED_19 seq 20 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_19 seq 30 permit 10.200.20.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_19_0 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LINK_19_1 seq 10 deny 10.181.0.42/31
!

ip prefix-list PL_EXPORT_DENY_LONG_19 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_19_0 seq 10 deny 10.180.0.20/32
!




ip community-list standard CL_COMM_19_18 permit no-advertise
!





route-map RM_POLICY_IN_19_18 permit 5














 match community CL_COMM_19_18
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_19_18 permit 10














 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_19_18 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_19_18 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_19_0
 ! Block loopback 10.180.0.20/32


route-map RM_POLICY_OUT_19_18 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_19_0
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_19_18 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_19_1
 ! Block link 10.181.0.42/31


route-map RM_POLICY_OUT_19_18 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_19
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_19_18 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_19
 set metric 14
 set as-path prepend 65003 65003 65003
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_19_18 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.20
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.12 peer-group RR




 !
 neighbor 10.181.0.40 peer-group EBGP
 neighbor 10.181.0.40 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.12 activate




  neighbor 10.181.0.40 activate
  neighbor 10.181.0.40 route-map RM_POLICY_IN_19_18 in
  neighbor 10.181.0.40 route-map RM_POLICY_OUT_19_18 out





  network 10.200.18.0 mask 255.255.255.0

  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

 exit-address-family
