
hostname 55_as65006_Switzerland
!
interface Loopback0
 ip address 10.180.0.56 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.47.0/24


 ip address 10.200.47.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.48.0/24


 ip address 10.200.48.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.49.0/24


 ip address 10.200.49.1 255.255.255.0
!



ip access-list extended ACL_55_GigabitEthernet0_0
 10 permit ip host 10.180.0.29 any
 20 permit ip host 10.181.0.100 any
 30 permit ip host 10.181.0.101 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 28_as65009_Switzerland (28)

 ip address 10.181.0.101 255.255.255.254

 ip access-group ACL_55_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 47_as65006_Switzerland (47)

 ip address 10.181.0.141 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 51_as65006_Liechtenstein (51)

 ip address 10.181.0.153 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

