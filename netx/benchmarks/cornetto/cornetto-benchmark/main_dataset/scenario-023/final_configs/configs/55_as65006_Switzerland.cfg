ip route 10.200.47.0 255.255.255.0 Loopback100
ip route 10.200.48.0 255.255.255.0 Loopback101
ip route 10.200.49.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.56
 passive-interface Loopback0
 network 10.180.0.56 0.0.0.0 area 0



network 10.181.0.140 0.0.0.1 area 0
network 10.181.0.152 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_55 seq 10 permit 10.200.47.0/24
ip prefix-list PL_EXPORT_ALLOWED_55 seq 20 permit 10.200.48.0/24
ip prefix-list PL_EXPORT_ALLOWED_55 seq 30 permit 10.200.49.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_55_0 seq 10 deny 10.181.0.100/31
!

ip prefix-list PL_EXPORT_DENY_LINK_55_1 seq 10 deny 10.181.0.140/31
!

ip prefix-list PL_EXPORT_DENY_LINK_55_2 seq 10 deny 10.181.0.152/31
!

ip prefix-list PL_EXPORT_DENY_LONG_55 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_55_0 seq 10 deny 10.180.0.56/32
!

ip prefix-list PL_IN_55_28 seq 10 permit 10.200.23.0/24
ip prefix-list PL_IN_55_28 seq 20 permit 10.180.0.29/32
ip prefix-list PL_IN_55_28 seq 30 permit 10.181.0.98/31
ip prefix-list PL_IN_55_28 seq 40 permit 10.181.0.100/31
ip prefix-list PL_IN_55_28 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_55_28 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_55_28 seq 10 permit 10.200.47.0/24
ip prefix-list PL_OUT_55_28 seq 20 permit 10.200.48.0/24
!




ip community-list standard CL_COMM_55_28 permit no-advertise
!





route-map RM_POLICY_IN_55_28 permit 5














 match community CL_COMM_55_28
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_55_28 permit 10














 match ip address prefix-list PL_IN_55_28
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_55_28 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_55_28 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_55_28 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_55_0
 ! Block loopback 10.180.0.56/32


route-map RM_POLICY_OUT_55_28 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_55_0
 ! Block link 10.181.0.100/31


route-map RM_POLICY_OUT_55_28 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_55_1
 ! Block link 10.181.0.140/31


route-map RM_POLICY_OUT_55_28 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_55_2
 ! Block link 10.181.0.152/31


route-map RM_POLICY_OUT_55_28 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_55
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_55_28 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_55
 set metric 26
 set as-path prepend 65006
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_55_28 deny 200














 match ip address prefix-list PL_OUT_55_28
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_55_28 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.56
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.20 peer-group RR




 !
 neighbor 10.181.0.100 peer-group EBGP
 neighbor 10.181.0.100 remote-as 65009


 !
 address-family ipv4

  neighbor 10.180.0.20 activate




  neighbor 10.181.0.100 activate
  neighbor 10.181.0.100 route-map RM_POLICY_IN_55_28 in
  neighbor 10.181.0.100 route-map RM_POLICY_OUT_55_28 out





  network 10.200.47.0 mask 255.255.255.0

  network 10.200.48.0 mask 255.255.255.0

  network 10.200.49.0 mask 255.255.255.0

 exit-address-family
