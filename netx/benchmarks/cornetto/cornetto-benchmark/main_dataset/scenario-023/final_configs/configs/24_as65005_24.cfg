
hostname 24_as65005_24
!
interface Loopback0
 ip address 10.180.0.25 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!



ip access-list extended ACL_24_GigabitEthernet0_0
 10 permit ip host 10.180.0.2 any
 20 permit ip host 10.181.0.6 any
 30 permit ip host 10.181.0.7 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 1_as65008_1 (1)

 ip address 10.181.0.7 255.255.255.254

 ip access-group ACL_24_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 13_as65005_Switzerland (13)

 ip address 10.181.0.49 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 29_as65005_Switzerland (29)

 ip address 10.181.0.92 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.21.0 255.255.255.0 Loopback100
ip route 10.200.22.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.25
 passive-interface Loopback0
 network 10.180.0.25 0.0.0.0 area 0



network 10.181.0.48 0.0.0.1 area 0
network 10.181.0.92 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_24 seq 10 permit 10.200.21.0/24
ip prefix-list PL_EXPORT_ALLOWED_24 seq 20 permit 10.200.22.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_24_0 seq 10 deny 10.181.0.48/31
!

ip prefix-list PL_EXPORT_DENY_LINK_24_1 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LINK_24_2 seq 10 deny 10.181.0.92/31
!

ip prefix-list PL_EXPORT_DENY_LONG_24 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_24_0 seq 10 deny 10.180.0.25/32
!






route-map RM_POLICY_IN_24_1 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_24_1 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_24_0
 ! Block loopback 10.180.0.25/32


route-map RM_POLICY_OUT_24_1 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_0
 ! Block link 10.181.0.48/31


route-map RM_POLICY_OUT_24_1 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_1
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_24_1 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_2
 ! Block link 10.181.0.92/31


route-map RM_POLICY_OUT_24_1 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_24
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_24_1 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_24
 set metric 7
 set as-path prepend 65005 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_24_1 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.25
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.30 peer-group RR




 !
 neighbor 10.181.0.6 peer-group EBGP
 neighbor 10.181.0.6 remote-as 65008


 !
 address-family ipv4

  neighbor 10.180.0.30 activate




  neighbor 10.181.0.6 activate
  neighbor 10.181.0.6 route-map RM_POLICY_IN_24_1 in
  neighbor 10.181.0.6 route-map RM_POLICY_OUT_24_1 out





  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

 exit-address-family
