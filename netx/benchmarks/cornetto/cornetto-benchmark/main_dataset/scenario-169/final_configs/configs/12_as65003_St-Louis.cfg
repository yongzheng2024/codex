
hostname 12_as65003_St-Louis
!
interface Loopback0
 ip address 10.180.0.13 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 2_as65003_Kansas-City (2)

 ip address 10.181.0.9 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 6_as65002_Chicago (6)

 ip address 10.181.0.17 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 11_as65003_Houston (11)

 ip address 10.181.0.33 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.11.0 255.255.255.0 Loopback101
ip route 10.200.9.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.13
 passive-interface Loopback0
 network 10.180.0.13 0.0.0.0 area 0



network 10.181.0.8 0.0.0.1 area 0
network 10.181.0.32 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_12 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_12 seq 20 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_12 seq 30 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_12_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_12_1 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LINK_12_2 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_12 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_12_0 seq 10 deny 10.180.0.13/32
!






route-map RM_POLICY_IN_12_6 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_12_6 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_12_0
 ! Block loopback 10.180.0.13/32


route-map RM_POLICY_OUT_12_6 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_12_6 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_1
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_12_6 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_2
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_12_6 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_12
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_12_6 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_12
 set metric 14
 set as-path prepend 65003
 set community no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_12_6 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.13
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.4 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP



 !
 neighbor 10.181.0.16 peer-group EBGP
 neighbor 10.181.0.16 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.3 activate


  neighbor 10.180.0.4 activate


  neighbor 10.180.0.12 activate



  neighbor 10.181.0.16 activate
  neighbor 10.181.0.16 route-map RM_POLICY_IN_12_6 in
  neighbor 10.181.0.16 route-map RM_POLICY_OUT_12_6 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
