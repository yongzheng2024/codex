
hostname 17_as65005_San-Diego
!
interface Loopback0
 ip address 10.180.0.18 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.14.0/24


 ip address 10.200.14.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.15.0/24


 ip address 10.200.15.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 10_as65001_Los-Angeles (10)

 ip address 10.181.0.25 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 18_as65005_Phoenix (18)

 ip address 10.181.0.38 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.14.0 255.255.255.0 Loopback100
ip route 10.200.15.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.18
 passive-interface Loopback0
 network 10.180.0.18 0.0.0.0 area 0



network 10.181.0.38 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_17 seq 10 permit 10.200.14.0/24
ip prefix-list PL_EXPORT_ALLOWED_17 seq 20 permit 10.200.15.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_17_0 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_17_1 seq 10 deny 10.181.0.38/31
!

ip prefix-list PL_EXPORT_DENY_LONG_17 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_17_0 seq 10 deny 10.180.0.18/32
!

ip prefix-list PL_IN_17_10 seq 10 permit 10.180.0.11/32
ip prefix-list PL_IN_17_10 seq 20 permit 10.181.0.24/31
ip prefix-list PL_IN_17_10 seq 30 permit 10.200.3.0/24
ip prefix-list PL_IN_17_10 seq 40 permit 10.200.5.0/24
ip prefix-list PL_IN_17_10 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_17_10 seq 10 permit 10.200.14.0/24
!






route-map RM_POLICY_IN_17_10 permit 10














 match ip address prefix-list PL_IN_17_10
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_17_10 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_17_10 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_17_0
 ! Block loopback 10.180.0.18/32


route-map RM_POLICY_OUT_17_10 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_0
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_17_10 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_1
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_17_10 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_17
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_17_10 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_17
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_17_10 deny 200














 match ip address prefix-list PL_OUT_17_10
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_17_10 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.18
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP



 !
 neighbor 10.181.0.24 peer-group EBGP
 neighbor 10.181.0.24 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.21 activate



  neighbor 10.181.0.24 activate
  neighbor 10.181.0.24 route-map RM_POLICY_IN_17_10 in
  neighbor 10.181.0.24 route-map RM_POLICY_OUT_17_10 out





  network 10.200.14.0 mask 255.255.255.0

  network 10.200.15.0 mask 255.255.255.0

 exit-address-family
