
hostname 16_as65004_Atlanta
!
interface Loopback0
 ip address 10.180.0.17 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.12.0/24


 ip address 10.200.12.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.13.0/24


 ip address 10.200.13.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 9_as65004_Washington--DC (9)

 ip address 10.181.0.23 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65003_Houston (11)

 ip address 10.181.0.29 255.255.255.254
 mtu 1500
!


ip route 10.200.12.0 255.255.255.0 Loopback100
ip route 10.200.13.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.17
 passive-interface Loopback0
 network 10.180.0.17 0.0.0.0 area 0



network 10.181.0.22 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_16 seq 10 permit 10.200.12.0/24
ip prefix-list PL_EXPORT_ALLOWED_16 seq 20 permit 10.200.13.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_16_0 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_16_1 seq 10 deny 10.181.0.28/31
!

ip prefix-list PL_EXPORT_DENY_LONG_16 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_16_0 seq 10 deny 10.180.0.17/32
!

ip prefix-list PL_IN_16_11 seq 10 permit 10.200.7.0/24
ip prefix-list PL_IN_16_11 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_16_11 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_16_11 seq 10 permit 10.200.13.0/24
ip prefix-list PL_OUT_16_11 seq 20 permit 10.200.12.0/24
!






route-map RM_POLICY_IN_16_11 permit 10














 match ip address prefix-list PL_IN_16_11
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_16_11 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_16_11 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_16_0
 ! Block loopback 10.180.0.17/32


route-map RM_POLICY_OUT_16_11 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_0
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_16_11 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_1
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_16_11 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_16
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_16_11 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_16
 set metric 22
 set as-path prepend 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_16_11 deny 200














 match ip address prefix-list PL_OUT_16_11
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_16_11 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.17
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.10 peer-group IBGP



 !
 neighbor 10.181.0.28 peer-group EBGP
 neighbor 10.181.0.28 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.9 activate


  neighbor 10.180.0.10 activate



  neighbor 10.181.0.28 activate
  neighbor 10.181.0.28 route-map RM_POLICY_IN_16_11 in
  neighbor 10.181.0.28 route-map RM_POLICY_OUT_16_11 out





  network 10.200.12.0 mask 255.255.255.0

  network 10.200.13.0 mask 255.255.255.0

 exit-address-family
