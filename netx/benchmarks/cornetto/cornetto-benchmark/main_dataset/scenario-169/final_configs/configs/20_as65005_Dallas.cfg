ip prefix-list PL_EXPORT_DENY_LINK_20_0 seq 10 deny 10.181.0.30/31
!

ip prefix-list PL_EXPORT_DENY_LINK_20_1 seq 10 deny 10.181.0.42/31
!

ip prefix-list PL_EXPORT_DENY_LONG_20 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_20_0 seq 10 deny 10.180.0.21/32
!






route-map RM_POLICY_IN_20_11 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_20_11 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_20_0
 ! Block loopback 10.180.0.21/32


route-map RM_POLICY_OUT_20_11 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_0
 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_20_11 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_1
 ! Block link 10.181.0.42/31


route-map RM_POLICY_OUT_20_11 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_20
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_20_11 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_20
 set metric 10
 set as-path prepend 65005 65005 65005
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_20_11 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.21
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP



 !
 neighbor 10.181.0.30 peer-group EBGP
 neighbor 10.181.0.30 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.20 activate



  neighbor 10.181.0.30 activate
  neighbor 10.181.0.30 route-map RM_POLICY_IN_20_11 in
  neighbor 10.181.0.30 route-map RM_POLICY_OUT_20_11 out





  network 10.200.16.0 mask 255.255.255.0

  network 10.200.17.0 mask 255.255.255.0

  network 10.200.18.0 mask 255.255.255.0

  network 10.200.19.0 mask 255.255.255.0

 exit-address-family
