ip route 10.200.16.0 255.255.255.0 Loopback100
ip route 10.200.17.0 255.255.255.0 Loopback101
ip route 10.200.18.0 255.255.255.0 Loopback102
ip route 10.200.19.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.21
 passive-interface Loopback0
 network 10.180.0.21 0.0.0.0 area 0



network 10.181.0.42 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_20 seq 10 permit 10.200.16.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 20 permit 10.200.17.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 30 permit 10.200.18.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 40 permit 10.200.19.0/24
