router ospf 1
 router-id 10.180.0.10
 passive-interface Loopback0
 network 10.180.0.10 0.0.0.0 area 0



network 10.181.0.20 0.0.0.1 area 0
network 10.181.0.22 0.0.0.1 area 0
!








router bgp 65004
 bgp router-id 10.180.0.10
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0




 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP



 !
 address-family ipv4


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.9 activate


  neighbor 10.180.0.17 activate






 exit-address-family
