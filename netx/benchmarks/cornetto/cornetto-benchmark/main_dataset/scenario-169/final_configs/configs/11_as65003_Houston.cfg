
hostname 11_as65003_Houston
!
interface Loopback0
 ip address 10.180.0.12 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 16_as65004_Atlanta (16)

 ip address 10.181.0.28 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 20_as65005_Dallas (20)

 ip address 10.181.0.30 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 12_as65003_St-Louis (12)

 ip address 10.181.0.32 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.6.0 255.255.255.0 Loopback100
ip route 10.200.7.0 255.255.255.0 Loopback101
ip route 10.200.8.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.12
 passive-interface Loopback0
 network 10.180.0.12 0.0.0.0 area 0



network 10.181.0.32 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_11 seq 10 permit 10.200.6.0/24
ip prefix-list PL_EXPORT_ALLOWED_11 seq 20 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_11 seq 30 permit 10.200.8.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_11_0 seq 10 deny 10.181.0.28/31
!

ip prefix-list PL_EXPORT_DENY_LINK_11_1 seq 10 deny 10.181.0.30/31
!

ip prefix-list PL_EXPORT_DENY_LINK_11_2 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LONG_11 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_11_0 seq 10 deny 10.180.0.12/32
!

ip prefix-list PL_IN_11_16 seq 10 permit 10.200.12.0/24
ip prefix-list PL_IN_11_16 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_11_16 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_11_16 seq 10 permit 10.200.7.0/24
ip prefix-list PL_OUT_11_16 seq 20 permit 10.200.8.0/24
!




ip community-list standard CL_COMM_11_16 permit no-export
!





route-map RM_POLICY_IN_11_16 permit 5














 match community CL_COMM_11_16
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_11_16 permit 10














 match ip address prefix-list PL_IN_11_16
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_11_16 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_11_16 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_IN_11_20 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_11_16 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_11_0
 ! Block loopback 10.180.0.12/32


route-map RM_POLICY_OUT_11_16 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_0
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_11_16 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_1
 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_11_16 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_2
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_11_16 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_11
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_11_16 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_11
 set metric 22
 set as-path prepend 65003 65003
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_11_16 deny 200














 match ip address prefix-list PL_OUT_11_16
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_11_16 deny 65000














 ! Deny other outbound routes

!


route-map RM_POLICY_OUT_11_20 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_11_0
 ! Block loopback 10.180.0.12/32


route-map RM_POLICY_OUT_11_20 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_0
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_11_20 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_1
 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_11_20 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_2
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_11_20 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_11
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_11_20 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_11
 set metric 17
 set as-path prepend 65003
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_11_20 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.12
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.4 peer-group IBGP


 !
 neighbor 10.180.0.13 peer-group IBGP



 !
 neighbor 10.181.0.29 peer-group EBGP
 neighbor 10.181.0.29 remote-as 65004


 !
 neighbor 10.181.0.31 peer-group EBGP
 neighbor 10.181.0.31 remote-as 65005


 !
 address-family ipv4


  neighbor 10.180.0.3 activate


  neighbor 10.180.0.4 activate


  neighbor 10.180.0.13 activate



  neighbor 10.181.0.29 activate
  neighbor 10.181.0.29 route-map RM_POLICY_IN_11_16 in
  neighbor 10.181.0.29 route-map RM_POLICY_OUT_11_16 out


  neighbor 10.181.0.31 activate
  neighbor 10.181.0.31 route-map RM_POLICY_IN_11_20 in
  neighbor 10.181.0.31 route-map RM_POLICY_OUT_11_20 out





  network 10.200.6.0 mask 255.255.255.0

  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

 exit-address-family
