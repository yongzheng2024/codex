
hostname 6_as65003_Chicago
!
interface Loopback0
 ip address 10.180.0.7 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.29.0/24


 ip address 10.200.29.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.30.0/24


 ip address 10.200.30.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.31.0/24


 ip address 10.200.31.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.32.0/24


 ip address 10.200.32.1 255.255.255.0
!



ip access-list extended ACL_6_GigabitEthernet0_1
 10 permit ip host 10.180.0.13 any
 20 permit ip host 10.181.0.16 any
 30 permit ip host 10.181.0.17 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 1_as65003_Minneapolis (1)

 ip address 10.181.0.5 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 12_as65002_St-Louis (12)

 ip address 10.181.0.16 255.255.255.254

 ip access-group ACL_6_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 7_as65003_Detroit (7)

 ip address 10.181.0.18 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.29.0 255.255.255.0 Loopback100
ip route 10.200.30.0 255.255.255.0 Loopback101
ip route 10.200.31.0 255.255.255.0 Loopback102
ip route 10.200.32.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.7
 passive-interface Loopback0
 network 10.180.0.7 0.0.0.0 area 0










 redistribute bgp 65003 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_6

network 10.181.0.4 0.0.0.1 area 0
network 10.181.0.18 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 10 permit 10.200.0.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 20 permit 10.200.1.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 30 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 40 permit 10.200.3.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 50 permit 10.200.10.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 60 permit 10.200.11.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 70 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 80 permit 10.200.13.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_6 seq 10 permit 10.180.0.7/32
ip prefix-list PL_BGP_TO_OSPF_DENY_6 seq 20 permit 10.181.0.4/31
ip prefix-list PL_BGP_TO_OSPF_DENY_6 seq 30 permit 10.181.0.16/31
ip prefix-list PL_BGP_TO_OSPF_DENY_6 seq 40 permit 10.181.0.18/31
!

ip prefix-list PL_EXPORT_ALLOWED_6 seq 10 permit 10.200.29.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 20 permit 10.200.30.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 30 permit 10.200.31.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 40 permit 10.200.32.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_6_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_6_1 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_6_2 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_6 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_6_0 seq 10 deny 10.180.0.7/32
!

ip prefix-list PL_IN_6_12 seq 10 permit 10.200.13.0/24
ip prefix-list PL_IN_6_12 seq 20 permit 10.181.0.16/31
ip prefix-list PL_IN_6_12 seq 30 permit 10.180.0.13/32
ip prefix-list PL_IN_6_12 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_6_12 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_6_12 seq 10 permit 10.200.31.0/24
ip prefix-list PL_OUT_6_12 seq 20 permit 10.200.29.0/24
!




ip community-list standard CL_COMM_6_12 permit no-advertise
ip community-list standard CL_COMM_6_12 permit no-export
!





route-map RM_BGP_TO_OSPF_6 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_6 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_6
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_6 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_6
 set tag 65010

!


route-map RM_POLICY_IN_6_12 permit 5














 match community CL_COMM_6_12
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_6_12 permit 10














 match ip address prefix-list PL_IN_6_12
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_6_12 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_6_12 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_6_12 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_6_0
 ! Block loopback 10.180.0.7/32


route-map RM_POLICY_OUT_6_12 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_6_12 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_1
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_6_12 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_2
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_6_12 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_6
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_6_12 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_6
 set metric 19
 set as-path prepend 65003 65003
 set community 65000:100 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_6_12 deny 200














 match ip address prefix-list PL_OUT_6_12
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_6_12 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.7
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP



 !
 neighbor 10.181.0.17 peer-group EBGP
 neighbor 10.181.0.17 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.8 activate



  neighbor 10.181.0.17 activate
  neighbor 10.181.0.17 route-map RM_POLICY_IN_6_12 in
  neighbor 10.181.0.17 route-map RM_POLICY_OUT_6_12 out





  network 10.200.29.0 mask 255.255.255.0

  network 10.200.30.0 mask 255.255.255.0

  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

 exit-address-family
