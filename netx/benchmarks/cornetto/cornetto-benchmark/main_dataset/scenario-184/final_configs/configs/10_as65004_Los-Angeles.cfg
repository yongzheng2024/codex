
hostname 10_as65004_Los-Angeles
!
interface Loopback0
 ip address 10.180.0.11 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!



ip access-list extended ACL_10_GigabitEthernet0_0
 10 permit ip host 10.180.0.18 any
 20 permit ip host 10.181.0.24 any
 30 permit ip host 10.181.0.25 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 17_as65005_San-Diego (17)

 ip address 10.181.0.24 255.255.255.254

 ip access-group ACL_10_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 15_as65004_Santa-Clara (15)

 ip address 10.181.0.26 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.4.0 255.255.255.0 Loopback100
ip route 10.200.5.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.11
 passive-interface Loopback0
 network 10.180.0.11 0.0.0.0 area 0










 redistribute bgp 65004 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_10

network 10.181.0.26 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_10 seq 10 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_10 seq 20 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_10 seq 30 permit 10.200.20.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_10 seq 40 permit 10.200.21.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_10 seq 50 permit 10.200.22.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_10 seq 60 permit 10.200.23.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_10 seq 10 permit 10.180.0.11/32
ip prefix-list PL_BGP_TO_OSPF_DENY_10 seq 20 permit 10.181.0.24/31
ip prefix-list PL_BGP_TO_OSPF_DENY_10 seq 30 permit 10.181.0.26/31
!

ip prefix-list PL_EXPORT_ALLOWED_10 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 20 permit 10.200.5.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_10_0 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_1 seq 10 deny 10.181.0.26/31
!

ip prefix-list PL_EXPORT_DENY_LONG_10 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_10_0 seq 10 deny 10.180.0.11/32
!

ip prefix-list PL_IN_10_17 seq 10 permit 10.200.18.0/24
ip prefix-list PL_IN_10_17 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_10_17 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_10_17 seq 10 permit 10.200.5.0/24
ip prefix-list PL_OUT_10_17 seq 20 permit 10.200.4.0/24
!




ip community-list standard CL_COMM_10_17 permit 65535:65282
ip community-list standard CL_COMM_10_17 permit no-advertise
!





route-map RM_BGP_TO_OSPF_10 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_10 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_10
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_10 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_10
 set tag 65010

!


route-map RM_POLICY_IN_10_17 permit 5














 match community CL_COMM_10_17
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_10_17 permit 10














 match ip address prefix-list PL_IN_10_17
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_10_17 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_10_17 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_10_17 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_17 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_10_17 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_10_17 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_10
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_10_17 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_10
 set metric 5
 set as-path prepend 65004
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_10_17 deny 200














 match ip address prefix-list PL_OUT_10_17
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_10_17 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP



 !
 neighbor 10.181.0.25 peer-group EBGP
 neighbor 10.181.0.25 remote-as 65005


 !
 address-family ipv4


  neighbor 10.180.0.14 activate


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.16 activate



  neighbor 10.181.0.25 activate
  neighbor 10.181.0.25 route-map RM_POLICY_IN_10_17 in
  neighbor 10.181.0.25 route-map RM_POLICY_OUT_10_17 out





  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

 exit-address-family
