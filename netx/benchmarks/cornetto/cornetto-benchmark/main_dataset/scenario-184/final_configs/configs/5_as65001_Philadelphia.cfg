
hostname 5_as65001_Philadelphia
!
interface Loopback0
 ip address 10.180.0.6 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.27.0/24


 ip address 10.200.27.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.28.0/24


 ip address 10.200.28.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 4_as65003_Pittsburgh (4)

 ip address 10.181.0.11 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 8_as65001_New-York (8)

 ip address 10.181.0.14 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.27.0 255.255.255.0 Loopback100
ip route 10.200.28.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.6
 passive-interface Loopback0
 network 10.180.0.6 0.0.0.0 area 0



network 10.181.0.14 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_5 seq 10 permit 10.200.27.0/24
ip prefix-list PL_EXPORT_ALLOWED_5 seq 20 permit 10.200.28.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_5_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_5_1 seq 10 deny 10.181.0.14/31
!

ip prefix-list PL_EXPORT_DENY_LONG_5 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_5_0 seq 10 deny 10.180.0.6/32
!






route-map RM_POLICY_IN_5_4 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_5_4 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_5_0
 ! Block loopback 10.180.0.6/32


route-map RM_POLICY_OUT_5_4 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_5_4 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_1
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_5_4 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_5
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_5_4 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_5
 set metric 25
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_5_4 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.6
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP



 !
 neighbor 10.181.0.10 peer-group EBGP
 neighbor 10.181.0.10 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.9 activate


  neighbor 10.180.0.10 activate


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.17 activate



  neighbor 10.181.0.10 activate
  neighbor 10.181.0.10 route-map RM_POLICY_IN_5_4 in
  neighbor 10.181.0.10 route-map RM_POLICY_OUT_5_4 out





  network 10.200.27.0 mask 255.255.255.0

  network 10.200.28.0 mask 255.255.255.0

 exit-address-family
