ip route 10.200.14.0 255.255.255.0 Loopback100
ip route 10.200.15.0 255.255.255.0 Loopback101
ip route 10.200.16.0 255.255.255.0 Loopback102
ip route 10.200.17.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.15
 passive-interface Loopback0
 network 10.180.0.15 0.0.0.0 area 0



network 10.181.0.2 0.0.0.1 area 0
network 10.181.0.34 0.0.0.1 area 0
network 10.181.0.36 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_14 seq 10 permit 10.200.14.0/24
ip prefix-list PL_EXPORT_ALLOWED_14 seq 20 permit 10.200.15.0/24
ip prefix-list PL_EXPORT_ALLOWED_14 seq 30 permit 10.200.16.0/24
ip prefix-list PL_EXPORT_ALLOWED_14 seq 40 permit 10.200.17.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_14_0 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LINK_14_1 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_14_2 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LONG_14 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_14_0 seq 10 deny 10.180.0.15/32
!

ip prefix-list PL_IN_14_0 seq 10 permit 10.200.3.0/24
ip prefix-list PL_IN_14_0 seq 20 permit 10.200.0.0/24
ip prefix-list PL_IN_14_0 seq 30 permit 10.200.1.0/24
ip prefix-list PL_IN_14_0 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_14_0 seq 10 permit 10.200.14.0/24
ip prefix-list PL_OUT_14_0 seq 20 permit 10.200.15.0/24
!






route-map RM_POLICY_IN_14_0 permit 10














 match ip address prefix-list PL_IN_14_0
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_14_0 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_14_0 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_14_0
 ! Block loopback 10.180.0.15/32


route-map RM_POLICY_OUT_14_0 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_0
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_14_0 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_1
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_14_0 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_2
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_14_0 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_14
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_14_0 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_14
 set metric 9
 set as-path prepend 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_14_0 deny 200














 match ip address prefix-list PL_OUT_14_0
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_14_0 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.15
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP



 !
 neighbor 10.181.0.2 peer-group EBGP
 neighbor 10.181.0.2 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.14 activate


  neighbor 10.180.0.16 activate



  neighbor 10.181.0.2 activate
  neighbor 10.181.0.2 route-map RM_POLICY_IN_14_0 in
  neighbor 10.181.0.2 route-map RM_POLICY_OUT_14_0 out





  network 10.200.14.0 mask 255.255.255.0

  network 10.200.15.0 mask 255.255.255.0

  network 10.200.16.0 mask 255.255.255.0

  network 10.200.17.0 mask 255.255.255.0

 exit-address-family
