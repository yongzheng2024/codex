ip access-list extended ACL_14_GigabitEthernet0_0
 10 permit ip host 10.180.0.1 any
 20 permit ip host 10.181.0.2 any
 30 permit ip host 10.181.0.3 any
 40 deny ip 192.0.2.0 0.0.0.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 0_as65002_Salt-Lake-City (0)

 ip address 10.181.0.3 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20


 ip access-group ACL_14_GigabitEthernet0_0 in
