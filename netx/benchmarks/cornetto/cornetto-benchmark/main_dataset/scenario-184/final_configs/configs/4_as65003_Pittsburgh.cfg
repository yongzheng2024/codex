
hostname 4_as65003_Pittsburgh
!
interface Loopback0
 ip address 10.180.0.5 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.24.0/24


 ip address 10.200.24.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.25.0/24


 ip address 10.200.25.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.26.0/24


 ip address 10.200.26.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 5_as65001_Philadelphia (5)

 ip address 10.181.0.10 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 7_as65003_Detroit (7)

 ip address 10.181.0.12 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.24.0 255.255.255.0 Loopback100
ip route 10.200.25.0 255.255.255.0 Loopback101
ip route 10.200.26.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.5
 passive-interface Loopback0
 network 10.180.0.5 0.0.0.0 area 0










 redistribute bgp 65003 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_4

network 10.181.0.12 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 10 permit 10.200.6.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 20 permit 10.200.7.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 30 permit 10.200.8.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 40 permit 10.200.9.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 50 permit 10.200.27.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 60 permit 10.200.28.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_4 seq 10 permit 10.180.0.5/32
ip prefix-list PL_BGP_TO_OSPF_DENY_4 seq 20 permit 10.181.0.10/31
ip prefix-list PL_BGP_TO_OSPF_DENY_4 seq 30 permit 10.181.0.12/31
!

ip prefix-list PL_EXPORT_ALLOWED_4 seq 10 permit 10.200.24.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 20 permit 10.200.25.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 30 permit 10.200.26.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_4_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_4_1 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LONG_4 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_4_0 seq 10 deny 10.180.0.5/32
!

ip prefix-list PL_IN_4_5 seq 10 permit 10.200.27.0/24
ip prefix-list PL_IN_4_5 seq 20 permit 10.200.28.0/24
ip prefix-list PL_IN_4_5 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_4_5 seq 10 permit 10.200.26.0/24
ip prefix-list PL_OUT_4_5 seq 20 permit 10.200.24.0/24
!






route-map RM_BGP_TO_OSPF_4 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_4 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_4
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_4 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_4
 set tag 65010

!


route-map RM_POLICY_IN_4_5 permit 10














 match ip address prefix-list PL_IN_4_5
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_4_5 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_4_5 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_4_0
 ! Block loopback 10.180.0.5/32


route-map RM_POLICY_OUT_4_5 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_4_5 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_1
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_4_5 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_4
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_4_5 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_4
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_4_5 deny 200














 match ip address prefix-list PL_OUT_4_5
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_4_5 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.5
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP



 !
 neighbor 10.181.0.11 peer-group EBGP
 neighbor 10.181.0.11 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.8 activate



  neighbor 10.181.0.11 activate
  neighbor 10.181.0.11 route-map RM_POLICY_IN_4_5 in
  neighbor 10.181.0.11 route-map RM_POLICY_OUT_4_5 out





  network 10.200.24.0 mask 255.255.255.0

  network 10.200.25.0 mask 255.255.255.0

  network 10.200.26.0 mask 255.255.255.0

 exit-address-family
