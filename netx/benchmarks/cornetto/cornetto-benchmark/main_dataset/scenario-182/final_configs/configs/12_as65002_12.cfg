route-map RM_POLICY_IN_12_17 permit 10














 match ip address prefix-list PL_IN_12_17
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_12_17 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_12_17 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_12_0
 ! Block loopback 10.180.0.13/32


