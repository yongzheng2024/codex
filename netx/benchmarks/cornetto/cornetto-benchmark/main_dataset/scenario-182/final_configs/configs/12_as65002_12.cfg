 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_12_17 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_12
 set community 65000:200 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_12_17 deny 200














 match ip address prefix-list PL_OUT_12_17
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_12_17 deny 65000














 ! Deny other outbound routes

