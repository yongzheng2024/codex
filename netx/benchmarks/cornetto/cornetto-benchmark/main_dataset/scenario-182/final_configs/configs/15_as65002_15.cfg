  neighbor 10.180.0.13 activate


  neighbor 10.180.0.14 activate


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.17 activate



  neighbor 10.181.0.30 activate
  neighbor 10.181.0.30 route-map RM_POLICY_IN_15_11 in
  neighbor 10.181.0.30 route-map RM_POLICY_OUT_15_11 out





