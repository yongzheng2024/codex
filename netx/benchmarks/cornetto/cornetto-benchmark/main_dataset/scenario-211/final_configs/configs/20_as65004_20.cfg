
hostname 20_as65004_20
!
interface Loopback0
 ip address 10.180.0.21 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 12_as65004_12 (12)

 ip address 10.181.0.41 255.255.255.254








 ip router isis 1

 isis metric 10

