
hostname 0_as65002_0
!
interface Loopback0
 ip address 10.180.0.1 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 2_as65002_2 (2)

 ip address 10.181.0.0 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 21_as65002_21 (21)

 ip address 10.181.0.2 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.1
 passive-interface Loopback0
 network 10.180.0.1 0.0.0.0 area 0



network 10.181.0.0 0.0.0.1 area 0
network 10.181.0.2 0.0.0.1 area 0
!








router bgp 65002
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.1


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0



 !
 neighbor 10.180.0.31 peer-group RR



 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP


 !
 neighbor 10.180.0.29 peer-group IBGP



 !
 address-family ipv4

  neighbor 10.180.0.31 activate



  neighbor 10.180.0.3 activate
  neighbor 10.180.0.3 next-hop-self


  neighbor 10.180.0.22 activate
  neighbor 10.180.0.22 next-hop-self


  neighbor 10.180.0.23 activate
  neighbor 10.180.0.23 next-hop-self


  neighbor 10.180.0.29 activate
  neighbor 10.180.0.29 next-hop-self






 exit-address-family
