
hostname 30_as65002_30
!
interface Loopback0
 ip address 10.180.0.31 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 5_as65001_5 (5)

 ip address 10.181.0.23 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 22_as65002_22 (22)

 ip address 10.181.0.63 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 29_as65002_29 (29)

 ip address 10.181.0.67 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.11.0 255.255.255.0 Loopback101
ip route 10.200.8.0 255.255.255.0 Loopback102
ip route 10.200.9.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.31
 passive-interface Loopback0
 network 10.180.0.31 0.0.0.0 area 0



network 10.181.0.62 0.0.0.1 area 0
network 10.181.0.66 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_30 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 20 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 30 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 40 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_30_0 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_30_1 seq 10 deny 10.181.0.62/31
!

ip prefix-list PL_EXPORT_DENY_LINK_30_2 seq 10 deny 10.181.0.66/31
!

ip prefix-list PL_EXPORT_DENY_LONG_30 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_30_0 seq 10 deny 10.180.0.31/32
!

ip prefix-list PL_IN_30_5 seq 10 permit 10.180.0.6/32
ip prefix-list PL_IN_30_5 seq 20 permit 10.200.13.0/24
ip prefix-list PL_IN_30_5 seq 30 permit 10.181.0.20/31
ip prefix-list PL_IN_30_5 seq 40 permit 10.200.12.0/24
ip prefix-list PL_IN_30_5 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_30_5 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_30_5 seq 10 permit 10.200.10.0/24
!






route-map RM_POLICY_IN_30_5 permit 10














 match ip address prefix-list PL_IN_30_5
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_30_5 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_30_5 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_30_0
 ! Block loopback 10.180.0.31/32


route-map RM_POLICY_OUT_30_5 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_0
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_30_5 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_1
 ! Block link 10.181.0.62/31


route-map RM_POLICY_OUT_30_5 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_2
 ! Block link 10.181.0.66/31


route-map RM_POLICY_OUT_30_5 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_30
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_30_5 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_30
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_30_5 deny 200














 match ip address prefix-list PL_OUT_30_5
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_30_5 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.31
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.31


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.1 peer-group RR



 !
 neighbor 10.180.0.4 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP


 !
 neighbor 10.180.0.29 peer-group IBGP


 !
 neighbor 10.180.0.30 peer-group IBGP



 !
 neighbor 10.181.0.22 peer-group EBGP
 neighbor 10.181.0.22 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.1 activate



  neighbor 10.180.0.4 activate
  neighbor 10.180.0.4 next-hop-self


  neighbor 10.180.0.22 activate
  neighbor 10.180.0.22 next-hop-self


  neighbor 10.180.0.23 activate
  neighbor 10.180.0.23 next-hop-self


  neighbor 10.180.0.29 activate
  neighbor 10.180.0.29 next-hop-self


  neighbor 10.180.0.30 activate
  neighbor 10.180.0.30 next-hop-self



  neighbor 10.181.0.22 activate
  neighbor 10.181.0.22 route-map RM_POLICY_IN_30_5 in
  neighbor 10.181.0.22 route-map RM_POLICY_OUT_30_5 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
