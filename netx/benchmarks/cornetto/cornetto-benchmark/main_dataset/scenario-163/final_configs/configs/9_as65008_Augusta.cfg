ip prefix-list PL_EXPORT_ALLOWED_9 seq 10 permit 10.200.89.0/24
ip prefix-list PL_EXPORT_ALLOWED_9 seq 20 permit 10.200.90.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_9_0 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_9_1 seq 10 deny 10.181.0.30/31
!

ip prefix-list PL_EXPORT_DENY_LINK_9_2 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LINK_9_3 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LONG_9 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_9_0 seq 10 deny 10.180.0.10/32
!






route-map RM_POLICY_IN_9_21 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_9_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_9_0
 ! Block loopback 10.180.0.10/32


route-map RM_POLICY_OUT_9_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_9_0
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_9_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_9_1
 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_9_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_9_2
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_9_21 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_9_3
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_9_21 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_9
 set metric 27
 set as-path prepend 65008 65008
 ! Outbound policy baseline


route-map RM_POLICY_OUT_9_21 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_9
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_9_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.10
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65008
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.8 peer-group RR




 !
 neighbor 10.181.0.33 peer-group EBGP
 neighbor 10.181.0.33 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.8 activate




  neighbor 10.181.0.33 activate
  neighbor 10.181.0.33 route-map RM_POLICY_IN_9_21 in
  neighbor 10.181.0.33 route-map RM_POLICY_OUT_9_21 out





  network 10.200.89.0 mask 255.255.255.0

  network 10.200.90.0 mask 255.255.255.0

 exit-address-family
