
hostname 156_as65004_Blountstown
!
interface Loopback0
 ip address 10.180.0.157 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.37.0/24


 ip address 10.200.37.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.38.0/24


 ip address 10.200.38.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.39.0/24


 ip address 10.200.39.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 155_as65004_Panama-City (155)

 ip address 10.181.1.119 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 157_as65006_Tallahassee (157)

 ip address 10.181.1.120 255.255.255.254
 mtu 1500
!


ip route 10.200.37.0 255.255.255.0 Loopback100
ip route 10.200.38.0 255.255.255.0 Loopback101
ip route 10.200.39.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.157
 passive-interface Loopback0
 network 10.180.0.157 0.0.0.0 area 0



network 10.181.1.118 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_156 seq 10 permit 10.200.37.0/24
ip prefix-list PL_EXPORT_ALLOWED_156 seq 20 permit 10.200.38.0/24
ip prefix-list PL_EXPORT_ALLOWED_156 seq 30 permit 10.200.39.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_156_0 seq 10 deny 10.181.1.118/31
!

ip prefix-list PL_EXPORT_DENY_LINK_156_1 seq 10 deny 10.181.1.120/31
!

ip prefix-list PL_EXPORT_DENY_LONG_156 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_156_0 seq 10 deny 10.180.0.157/32
!






route-map RM_POLICY_IN_156_157 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_156_157 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_156_0
 ! Block loopback 10.180.0.157/32


route-map RM_POLICY_OUT_156_157 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_156_0
 ! Block link 10.181.1.118/31


route-map RM_POLICY_OUT_156_157 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_156_1
 ! Block link 10.181.1.120/31


route-map RM_POLICY_OUT_156_157 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_156
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_156_157 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_156
 set metric 6
 set as-path prepend 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_156_157 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.157
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.78 peer-group RR




 !
 neighbor 10.181.1.121 peer-group EBGP
 neighbor 10.181.1.121 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.78 activate




  neighbor 10.181.1.121 activate
  neighbor 10.181.1.121 route-map RM_POLICY_IN_156_157 in
  neighbor 10.181.1.121 route-map RM_POLICY_OUT_156_157 out





  network 10.200.37.0 mask 255.255.255.0

  network 10.200.38.0 mask 255.255.255.0

  network 10.200.39.0 mask 255.255.255.0

 exit-address-family
