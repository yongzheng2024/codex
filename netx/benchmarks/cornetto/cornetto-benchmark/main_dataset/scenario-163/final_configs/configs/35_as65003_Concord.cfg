
hostname 35_as65003_Concord
!
interface Loopback0
 ip address 10.180.0.36 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.3 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.55.0/24


 ip address 10.200.55.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.56.0/24


 ip address 10.200.56.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 32_as65011_Salisbury (32)

 ip address 10.181.0.99 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 116_as65003_Charlotte (116)

 ip address 10.181.0.108 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.55.0 255.255.255.0 Loopback101
ip route 10.200.56.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.36
 passive-interface Loopback0
 network 10.180.0.36 0.0.0.0 area 0



network 10.181.0.108 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_35 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_35 seq 20 permit 10.200.55.0/24
ip prefix-list PL_EXPORT_ALLOWED_35 seq 30 permit 10.200.56.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_35_0 seq 10 deny 10.181.0.108/31
!

ip prefix-list PL_EXPORT_DENY_LINK_35_1 seq 10 deny 10.181.0.98/31
!

ip prefix-list PL_EXPORT_DENY_LONG_35 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_35_0 seq 10 deny 10.180.0.36/32
!

ip prefix-list PL_IN_35_32 seq 10 permit 10.200.47.0/24
ip prefix-list PL_IN_35_32 seq 20 permit 10.181.0.96/31
ip prefix-list PL_IN_35_32 seq 30 permit 10.180.0.33/32
ip prefix-list PL_IN_35_32 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_35_32 seq 10 permit 10.200.55.0/24
ip prefix-list PL_OUT_35_32 seq 20 permit 10.200.56.0/24
!






route-map RM_POLICY_IN_35_32 permit 10














 match ip address prefix-list PL_IN_35_32
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_35_32 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_35_32 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_35_0
 ! Block loopback 10.180.0.36/32


route-map RM_POLICY_OUT_35_32 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_35_0
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_35_32 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_35_1
 ! Block link 10.181.0.98/31


route-map RM_POLICY_OUT_35_32 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_35
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_35_32 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_35
 set metric 12
 set as-path prepend 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_35_32 deny 200














 match ip address prefix-list PL_OUT_35_32
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_35_32 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.36
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.92 peer-group RR




 !
 neighbor 10.181.0.98 peer-group EBGP
 neighbor 10.181.0.98 remote-as 65011


 !
 address-family ipv4

  neighbor 10.180.0.92 activate




  neighbor 10.181.0.98 activate
  neighbor 10.181.0.98 route-map RM_POLICY_IN_35_32 in
  neighbor 10.181.0.98 route-map RM_POLICY_OUT_35_32 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.55.0 mask 255.255.255.0

  network 10.200.56.0 mask 255.255.255.0

 exit-address-family
