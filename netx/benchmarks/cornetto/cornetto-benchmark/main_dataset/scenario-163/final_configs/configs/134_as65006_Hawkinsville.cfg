ip prefix-list PL_EXPORT_DENY_LINK_134_1 seq 10 deny 10.181.1.86/31
!

ip prefix-list PL_EXPORT_DENY_LINK_134_2 seq 10 deny 10.181.1.88/31
!

ip prefix-list PL_EXPORT_DENY_LONG_134 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_134_0 seq 10 deny 10.180.0.135/32
!






route-map RM_POLICY_IN_134_137 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_134_137 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_134_0
 ! Block loopback 10.180.0.135/32


route-map RM_POLICY_OUT_134_137 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_134_0
 ! Block link 10.181.1.84/31


route-map RM_POLICY_OUT_134_137 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_134_1
 ! Block link 10.181.1.86/31


route-map RM_POLICY_OUT_134_137 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_134_2
 ! Block link 10.181.1.88/31


route-map RM_POLICY_OUT_134_137 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_134
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_134_137 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_134
 set metric 5
 set as-path prepend 65006
 ! Outbound policy baseline


route-map RM_POLICY_OUT_134_137 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.135
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.158 peer-group RR




 !
 neighbor 10.181.1.87 peer-group EBGP
 neighbor 10.181.1.87 remote-as 65009


 !
 address-family ipv4

  neighbor 10.180.0.158 activate




  neighbor 10.181.1.87 activate
  neighbor 10.181.1.87 route-map RM_POLICY_IN_134_137 in
  neighbor 10.181.1.87 route-map RM_POLICY_OUT_134_137 out





  network 10.200.28.0 mask 255.255.255.0

  network 10.200.29.0 mask 255.255.255.0

 exit-address-family
