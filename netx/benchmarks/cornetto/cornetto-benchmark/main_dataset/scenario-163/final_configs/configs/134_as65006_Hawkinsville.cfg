ip access-list extended ACL_134_GigabitEthernet0_1
 10 permit ip host 10.180.0.138 any
 20 permit ip host 10.181.1.86 any
 30 permit ip host 10.181.1.87 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
