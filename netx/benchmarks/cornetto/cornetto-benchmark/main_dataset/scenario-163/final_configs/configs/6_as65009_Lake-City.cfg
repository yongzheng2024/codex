!


ip route 10.200.39.0 255.255.255.0 Loopback100
ip route 10.200.66.0 255.255.255.0 Loopback101
ip route 10.200.67.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.7
 passive-interface Loopback0
 network 10.180.0.7 0.0.0.0 area 0



network 10.181.0.16 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_6 seq 10 permit 10.200.39.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 20 permit 10.200.66.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 30 permit 10.200.67.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_6_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_6_1 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LONG_6 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_6_0 seq 10 deny 10.180.0.7/32
!






route-map RM_POLICY_IN_6_157 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_6_157 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_6_0
 ! Block loopback 10.180.0.7/32


route-map RM_POLICY_OUT_6_157 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_6_157 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_1
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_6_157 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_6
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_6_157 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_6
 set metric 22
 set as-path prepend 65009 65009 65009
 ! Outbound policy baseline


route-map RM_POLICY_OUT_6_157 deny 65000














 ! Deny other outbound routes

!







router bgp 65009
 bgp router-id 10.180.0.7
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65009
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.47 peer-group RR




 !
 neighbor 10.181.0.19 peer-group EBGP
 neighbor 10.181.0.19 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.47 activate




  neighbor 10.181.0.19 activate
  neighbor 10.181.0.19 route-map RM_POLICY_IN_6_157 in
  neighbor 10.181.0.19 route-map RM_POLICY_OUT_6_157 out





  network 10.200.39.0 mask 255.255.255.0

  network 10.200.66.0 mask 255.255.255.0

  network 10.200.67.0 mask 255.255.255.0

 exit-address-family
