
hostname 6_as65009_Lake-City
!
interface Loopback0
 ip address 10.180.0.7 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.39.0/24


 ip address 10.200.39.2 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.66.0/24


 ip address 10.200.66.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.67.0/24


 ip address 10.200.67.1 255.255.255.0
!



ip access-list extended ACL_6_GigabitEthernet0_1
 10 permit ip host 10.180.0.158 any
 20 permit ip host 10.181.0.18 any
 30 permit ip host 10.181.0.19 any
 40 deny ip 192.0.2.0 0.0.0.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 5_as65009_Jacksonville (5)

 ip address 10.181.0.17 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 157_as65006_Tallahassee (157)

 ip address 10.181.0.18 255.255.255.254

 ip access-group ACL_6_GigabitEthernet0_1 in
