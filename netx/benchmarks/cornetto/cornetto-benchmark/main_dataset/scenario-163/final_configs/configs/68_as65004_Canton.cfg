
hostname 68_as65004_Canton
!
interface Loopback0
 ip address 10.180.0.69 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.68.0/24


 ip address 10.200.68.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.69.0/24


 ip address 10.200.69.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.70.0/24


 ip address 10.200.70.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.71.0/24


 ip address 10.200.71.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 76_as65005_Ellijay (76)

 ip address 10.181.0.198 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 77_as65004_Atlanta (77)

 ip address 10.181.0.200 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.68.0 255.255.255.0 Loopback100
ip route 10.200.69.0 255.255.255.0 Loopback101
ip route 10.200.70.0 255.255.255.0 Loopback102
ip route 10.200.71.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.69
 passive-interface Loopback0
 network 10.180.0.69 0.0.0.0 area 0



network 10.181.0.200 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_68 seq 10 permit 10.200.68.0/24
ip prefix-list PL_EXPORT_ALLOWED_68 seq 20 permit 10.200.69.0/24
ip prefix-list PL_EXPORT_ALLOWED_68 seq 30 permit 10.200.70.0/24
ip prefix-list PL_EXPORT_ALLOWED_68 seq 40 permit 10.200.71.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_68_0 seq 10 deny 10.181.0.198/31
!

ip prefix-list PL_EXPORT_DENY_LINK_68_1 seq 10 deny 10.181.0.200/31
!

ip prefix-list PL_EXPORT_DENY_LONG_68 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_68_0 seq 10 deny 10.180.0.69/32
!

ip prefix-list PL_IN_68_76 seq 10 permit 10.181.0.212/31
ip prefix-list PL_IN_68_76 seq 20 permit 10.200.74.0/24
ip prefix-list PL_IN_68_76 seq 30 permit 10.181.0.220/31
ip prefix-list PL_IN_68_76 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_68_76 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_68_76 seq 10 permit 10.200.70.0/24
!




ip community-list standard CL_COMM_68_76 permit 65535:65282
ip community-list standard CL_COMM_68_76 permit no-export
!





route-map RM_POLICY_IN_68_76 permit 5














 match community CL_COMM_68_76
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_68_76 permit 10














 match ip address prefix-list PL_IN_68_76
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_68_76 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_68_76 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_68_76 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_68_0
 ! Block loopback 10.180.0.69/32


route-map RM_POLICY_OUT_68_76 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_68_0
 ! Block link 10.181.0.198/31


route-map RM_POLICY_OUT_68_76 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_68_1
 ! Block link 10.181.0.200/31


route-map RM_POLICY_OUT_68_76 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_68
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_68_76 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_68
 set metric 26
 set as-path prepend 65004
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_68_76 deny 200














 match ip address prefix-list PL_OUT_68_76
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_68_76 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.69
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.78 peer-group RR




 !
 neighbor 10.181.0.199 peer-group EBGP
 neighbor 10.181.0.199 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.78 activate




  neighbor 10.181.0.199 activate
  neighbor 10.181.0.199 route-map RM_POLICY_IN_68_76 in
  neighbor 10.181.0.199 route-map RM_POLICY_OUT_68_76 out





  network 10.200.68.0 mask 255.255.255.0

  network 10.200.69.0 mask 255.255.255.0

  network 10.200.70.0 mask 255.255.255.0

  network 10.200.71.0 mask 255.255.255.0

 exit-address-family
