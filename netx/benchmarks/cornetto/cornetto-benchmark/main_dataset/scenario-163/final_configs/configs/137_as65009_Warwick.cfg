network 10.181.0.134 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_137 seq 10 permit 10.200.32.0/24
ip prefix-list PL_EXPORT_ALLOWED_137 seq 20 permit 10.200.33.0/24
ip prefix-list PL_EXPORT_ALLOWED_137 seq 30 permit 10.200.34.0/24
