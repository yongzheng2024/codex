!

ip prefix-list PL_EXPORT_DENY_LONG_137 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_137_0 seq 10 deny 10.180.0.138/32
!

ip prefix-list PL_IN_137_134 seq 10 permit 10.180.0.135/32
ip prefix-list PL_IN_137_134 seq 20 permit 10.200.28.0/24
ip prefix-list PL_IN_137_134 seq 30 permit 10.181.1.88/31
ip prefix-list PL_IN_137_134 seq 40 permit 10.181.1.84/31
ip prefix-list PL_IN_137_134 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_137_134 seq 10 permit 10.200.32.0/24
!






route-map RM_POLICY_IN_137_134 permit 10














 match ip address prefix-list PL_IN_137_134
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_137_134 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_137_134 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_137_0
 ! Block loopback 10.180.0.138/32


route-map RM_POLICY_OUT_137_134 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_137_0
 ! Block link 10.181.0.134/31


route-map RM_POLICY_OUT_137_134 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_137_1
 ! Block link 10.181.1.86/31


route-map RM_POLICY_OUT_137_134 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_137
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_137_134 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_137
 set metric 22
 set as-path prepend 65009 65009
 ! Outbound policy baseline


route-map RM_POLICY_OUT_137_134 deny 200














 match ip address prefix-list PL_OUT_137_134
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_137_134 deny 65000














 ! Deny other outbound routes

!







router bgp 65009
 bgp router-id 10.180.0.138
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65009
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.47 peer-group RR




 !
 neighbor 10.181.1.86 peer-group EBGP
 neighbor 10.181.1.86 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.47 activate




  neighbor 10.181.1.86 activate
  neighbor 10.181.1.86 route-map RM_POLICY_IN_137_134 in
  neighbor 10.181.1.86 route-map RM_POLICY_OUT_137_134 out





  network 10.200.32.0 mask 255.255.255.0

  network 10.200.33.0 mask 255.255.255.0

  network 10.200.34.0 mask 255.255.255.0

 exit-address-family
