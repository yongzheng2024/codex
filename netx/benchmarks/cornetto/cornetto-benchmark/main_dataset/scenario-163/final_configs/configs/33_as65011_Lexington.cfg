 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_33_34 permit 10














 match ip address prefix-list PL_IN_33_34
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_33_34 deny 20














