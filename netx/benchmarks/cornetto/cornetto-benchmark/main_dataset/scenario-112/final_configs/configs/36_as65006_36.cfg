ip community-list standard CL_COMM_36_34 permit 65535:65282
ip community-list standard CL_COMM_36_34 permit no-advertise
!





route-map RM_POLICY_IN_36_34 permit 5














 match community CL_COMM_36_34
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_36_34 permit 10














 match ip address prefix-list PL_IN_36_34
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_36_34 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_36_34 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_36_34 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_36_0
 ! Block loopback 10.180.0.37/32


route-map RM_POLICY_OUT_36_34 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_36_0
 ! Block link 10.181.0.124/31


route-map RM_POLICY_OUT_36_34 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_36_1
 ! Block link 10.181.0.142/31


route-map RM_POLICY_OUT_36_34 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_36
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_36_34 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_36
 set metric 21
 set as-path prepend 65006 65006 65006
 set community 65000:100 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_36_34 deny 200














 match ip address prefix-list PL_OUT_36_34
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_36_34 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.37
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.57 peer-group RR




 !
 neighbor 10.181.0.124 peer-group EBGP
 neighbor 10.181.0.124 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.57 activate




  neighbor 10.181.0.124 activate
  neighbor 10.181.0.124 route-map RM_POLICY_IN_36_34 in
  neighbor 10.181.0.124 route-map RM_POLICY_OUT_36_34 out





  network 10.200.24.0 mask 255.255.255.0

  network 10.200.25.0 mask 255.255.255.0

  network 10.200.26.0 mask 255.255.255.0

  network 10.200.27.0 mask 255.255.255.0

 exit-address-family
