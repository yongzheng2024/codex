ip prefix-list PL_EXPORT_ALLOWED_17 seq 10 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_17 seq 20 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_17_0 seq 10 deny 10.181.0.76/31
!

ip prefix-list PL_EXPORT_DENY_LINK_17_1 seq 10 deny 10.181.0.78/31
!

