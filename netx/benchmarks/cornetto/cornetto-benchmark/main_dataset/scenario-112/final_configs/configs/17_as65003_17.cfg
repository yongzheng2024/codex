ip prefix-list PL_IN_17_53 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_17_53 seq 10 permit 10.200.9.0/24
!




ip community-list standard CL_COMM_17_53 permit 65535:65282
ip community-list standard CL_COMM_17_53 permit no-export
!





route-map RM_POLICY_IN_17_53 permit 5














 match community CL_COMM_17_53
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_17_53 permit 10














 match ip address prefix-list PL_IN_17_53
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_17_53 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_17_53 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_17_53 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_17_0
 ! Block loopback 10.180.0.18/32


route-map RM_POLICY_OUT_17_53 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_0
 ! Block link 10.181.0.76/31


route-map RM_POLICY_OUT_17_53 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_1
 ! Block link 10.181.0.78/31


route-map RM_POLICY_OUT_17_53 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_17
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_17_53 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_17
 set metric 16
 set as-path prepend 65003 65003 65003
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_17_53 deny 200














 match ip address prefix-list PL_OUT_17_53
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_17_53 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.18
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.32 peer-group RR




 !
 neighbor 10.181.0.77 peer-group EBGP
 neighbor 10.181.0.77 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.32 activate




  neighbor 10.181.0.77 activate
  neighbor 10.181.0.77 route-map RM_POLICY_IN_17_53 in
  neighbor 10.181.0.77 route-map RM_POLICY_OUT_17_53 out





  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
