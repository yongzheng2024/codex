 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 57_as65003_57 (57)

 ip address 10.181.0.152 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
