ip prefix-list PL_OUT_43_10 seq 10 permit 10.200.32.0/24
ip prefix-list PL_OUT_43_10 seq 20 permit 10.200.31.0/24
!






route-map RM_POLICY_IN_43_10 permit 10














 match ip address prefix-list PL_IN_43_10
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_43_10 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_43_10 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_43_0
 ! Block loopback 10.180.0.44/32


route-map RM_POLICY_OUT_43_10 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_43_0
 ! Block link 10.181.0.152/31


route-map RM_POLICY_OUT_43_10 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_43_1
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_43_10 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_43_2
 ! Block link 10.181.0.50/31


route-map RM_POLICY_OUT_43_10 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_43
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_43_10 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_43
 set metric 20
 set as-path prepend 65003 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_43_10 deny 200














 match ip address prefix-list PL_OUT_43_10
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_43_10 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.44
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.15 peer-group RR




 !
 neighbor 10.181.0.26 peer-group EBGP
 neighbor 10.181.0.26 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.15 activate




  neighbor 10.181.0.26 activate
  neighbor 10.181.0.26 route-map RM_POLICY_IN_43_10 in
  neighbor 10.181.0.26 route-map RM_POLICY_OUT_43_10 out





  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

 exit-address-family
