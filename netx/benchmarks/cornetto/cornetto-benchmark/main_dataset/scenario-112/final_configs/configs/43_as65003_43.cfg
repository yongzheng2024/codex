!


ip prefix-list PL_EXPORT_ALLOWED_43 seq 10 permit 10.200.31.0/24
ip prefix-list PL_EXPORT_ALLOWED_43 seq 20 permit 10.200.32.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_43_0 seq 10 deny 10.181.0.152/31
!

ip prefix-list PL_EXPORT_DENY_LINK_43_1 seq 10 deny 10.181.0.26/31
!

ip prefix-list PL_EXPORT_DENY_LINK_43_2 seq 10 deny 10.181.0.50/31
!

ip prefix-list PL_EXPORT_DENY_LONG_43 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_43_0 seq 10 deny 10.180.0.44/32
!

ip prefix-list PL_IN_43_10 seq 10 permit 10.181.0.32/31
ip prefix-list PL_IN_43_10 seq 20 permit 10.181.0.30/31
ip prefix-list PL_IN_43_10 seq 30 permit 10.200.1.0/24
ip prefix-list PL_IN_43_10 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_43_10 seq 50 deny 0.0.0.0/0
