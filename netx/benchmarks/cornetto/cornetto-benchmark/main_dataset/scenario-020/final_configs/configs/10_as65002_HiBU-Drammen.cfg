ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.11.0 255.255.255.0 Loopback101
ip route 10.200.8.0 255.255.255.0 Loopback102
ip route 10.200.9.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.11
 passive-interface Loopback0
 network 10.180.0.11 0.0.0.0 area 0



network 10.181.0.34 0.0.0.1 area 0
network 10.181.0.58 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_10 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 20 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 30 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 40 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_10_0 seq 10 deny 10.181.0.26/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_1 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_2 seq 10 deny 10.181.0.58/31
!

ip prefix-list PL_EXPORT_DENY_LONG_10 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_10_0 seq 10 deny 10.180.0.11/32
!

ip prefix-list PL_IN_10_3 seq 10 permit 10.200.39.0/24
ip prefix-list PL_IN_10_3 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_10_3 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_10_3 seq 10 permit 10.200.9.0/24
ip prefix-list PL_OUT_10_3 seq 20 permit 10.200.10.0/24
!






route-map RM_POLICY_IN_10_3 permit 10














 match ip address prefix-list PL_IN_10_3
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_10_3 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_10_3 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_3 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_10_3 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_10_3 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_2
 ! Block link 10.181.0.58/31


route-map RM_POLICY_OUT_10_3 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_10
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_10_3 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_10
 set metric 23
 set as-path prepend 65002 65002 65002
 set community 65000:100 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_10_3 deny 200














 match ip address prefix-list PL_OUT_10_3
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_10_3 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.12 peer-group RR




 !
 neighbor 10.181.0.26 peer-group EBGP
 neighbor 10.181.0.26 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.12 activate




  neighbor 10.181.0.26 activate
  neighbor 10.181.0.26 route-map RM_POLICY_IN_10_3 in
  neighbor 10.181.0.26 route-map RM_POLICY_OUT_10_3 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
