!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_69_0 seq 10 deny 10.180.0.70/32
!




ip community-list standard CL_COMM_69_68 permit 65535:65282
!





route-map RM_POLICY_IN_69_68 permit 5














 match community CL_COMM_69_68
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_69_68 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_69_68 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_69_68 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_69_0
 ! Block loopback 10.180.0.70/32


route-map RM_POLICY_OUT_69_68 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_69_0
 ! Block link 10.181.0.192/31


route-map RM_POLICY_OUT_69_68 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_69_1
 ! Block link 10.181.0.194/31


route-map RM_POLICY_OUT_69_68 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_69
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_69_68 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_69
 set metric 29
 set as-path prepend 65007 65007 65007
 set community 65000:200 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_69_68 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.70
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



