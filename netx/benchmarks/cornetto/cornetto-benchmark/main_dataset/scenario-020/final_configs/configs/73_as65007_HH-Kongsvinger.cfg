
hostname 73_as65007_HH-Kongsvinger
!
interface Loopback0
 ip address 10.180.0.74 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.88.0/24


 ip address 10.200.88.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.89.0/24


 ip address 10.200.89.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 0_as65003_UiO (0)

 ip address 10.181.0.5 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 72_as65007_HH-Elverum (72)

 ip address 10.181.0.201 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.88.0 255.255.255.0 Loopback100
ip route 10.200.89.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.74
 passive-interface Loopback0
 network 10.180.0.74 0.0.0.0 area 0



network 10.181.0.200 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_73 seq 10 permit 10.200.88.0/24
ip prefix-list PL_EXPORT_ALLOWED_73 seq 20 permit 10.200.89.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_73_0 seq 10 deny 10.181.0.200/31
!

ip prefix-list PL_EXPORT_DENY_LINK_73_1 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_73 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_73_0 seq 10 deny 10.180.0.74/32
!






route-map RM_POLICY_IN_73_0 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_73_0 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_73_0
 ! Block loopback 10.180.0.74/32


route-map RM_POLICY_OUT_73_0 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_73_0
 ! Block link 10.181.0.200/31


route-map RM_POLICY_OUT_73_0 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_73_1
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_73_0 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_73
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_73_0 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_73
 set metric 25
 set as-path prepend 65007
 ! Outbound policy baseline


route-map RM_POLICY_OUT_73_0 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.74
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65007
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.65 peer-group IBGP


 !
 neighbor 10.180.0.66 peer-group IBGP


 !
 neighbor 10.180.0.70 peer-group IBGP


 !
 neighbor 10.180.0.71 peer-group IBGP


 !
 neighbor 10.180.0.72 peer-group IBGP


 !
 neighbor 10.180.0.73 peer-group IBGP



 !
 neighbor 10.181.0.4 peer-group EBGP
 neighbor 10.181.0.4 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.3 activate


  neighbor 10.180.0.65 activate


  neighbor 10.180.0.66 activate


  neighbor 10.180.0.70 activate


  neighbor 10.180.0.71 activate


  neighbor 10.180.0.72 activate


  neighbor 10.180.0.73 activate



  neighbor 10.181.0.4 activate
  neighbor 10.181.0.4 route-map RM_POLICY_IN_73_0 in
  neighbor 10.181.0.4 route-map RM_POLICY_OUT_73_0 out





  network 10.200.88.0 mask 255.255.255.0

  network 10.200.89.0 mask 255.255.255.0

 exit-address-family
