
hostname 25_as65006_HSH-Haugesund
!
interface Loopback0
 ip address 10.180.0.26 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.28.0/24


 ip address 10.200.28.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.29.0/24


 ip address 10.200.29.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.30.0/24


 ip address 10.200.30.1 255.255.255.0
!



ip access-list extended ACL_25_GigabitEthernet0_0
 10 permit ip host 10.180.0.17 any
 20 permit ip host 10.181.0.80 any
 30 permit ip host 10.181.0.81 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 16_as65005_HSH-Stord (16)

 ip address 10.181.0.81 255.255.255.254

 ip access-group ACL_25_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 23_as65006_UiS-Stavanger (23)

 ip address 10.181.0.109 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.28.0 255.255.255.0 Loopback100
ip route 10.200.29.0 255.255.255.0 Loopback101
ip route 10.200.30.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.26
 passive-interface Loopback0
 network 10.180.0.26 0.0.0.0 area 0



network 10.181.0.108 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_25 seq 10 permit 10.200.28.0/24
ip prefix-list PL_EXPORT_ALLOWED_25 seq 20 permit 10.200.29.0/24
ip prefix-list PL_EXPORT_ALLOWED_25 seq 30 permit 10.200.30.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_25_0 seq 10 deny 10.181.0.108/31
!

ip prefix-list PL_EXPORT_DENY_LINK_25_1 seq 10 deny 10.181.0.80/31
!

ip prefix-list PL_EXPORT_DENY_LONG_25 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_25_0 seq 10 deny 10.180.0.26/32
!




ip community-list standard CL_COMM_25_16 permit 65535:65282
ip community-list standard CL_COMM_25_16 permit no-export
!





route-map RM_POLICY_IN_25_16 permit 5














 match community CL_COMM_25_16
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_25_16 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_25_16 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_25_0
 ! Block loopback 10.180.0.26/32


route-map RM_POLICY_OUT_25_16 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_0
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_25_16 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_1
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_25_16 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_25
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_25_16 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_25
 set community 65000:100 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_25_16 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.26
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP


 !
 neighbor 10.180.0.24 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP


 !
 neighbor 10.180.0.50 peer-group IBGP



 !
 neighbor 10.181.0.80 peer-group EBGP
 neighbor 10.181.0.80 remote-as 65005


 !
 address-family ipv4


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.21 activate


  neighbor 10.180.0.22 activate


  neighbor 10.180.0.23 activate


  neighbor 10.180.0.24 activate


  neighbor 10.180.0.25 activate


  neighbor 10.180.0.50 activate



  neighbor 10.181.0.80 activate
  neighbor 10.181.0.80 route-map RM_POLICY_IN_25_16 in
  neighbor 10.181.0.80 route-map RM_POLICY_OUT_25_16 out





  network 10.200.28.0 mask 255.255.255.0

  network 10.200.29.0 mask 255.255.255.0

  network 10.200.30.0 mask 255.255.255.0

 exit-address-family
