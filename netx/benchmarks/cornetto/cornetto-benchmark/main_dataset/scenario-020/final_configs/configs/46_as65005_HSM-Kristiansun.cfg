
hostname 46_as65005_HSM-Kristiansun
!
interface Loopback0
 ip address 10.180.0.47 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.60.0/24


 ip address 10.200.60.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.61.0/24


 ip address 10.200.61.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 44_as65005_HSM-Molde (44)

 ip address 10.181.0.165 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 68_as65001_UNINETT-Teknobyen (68)

 ip address 10.181.0.166 255.255.255.254
 mtu 1500
!


ip route 10.200.60.0 255.255.255.0 Loopback100
ip route 10.200.61.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.47
 passive-interface Loopback0
 network 10.180.0.47 0.0.0.0 area 0



network 10.181.0.164 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_46 seq 10 permit 10.200.60.0/24
ip prefix-list PL_EXPORT_ALLOWED_46 seq 20 permit 10.200.61.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_46_0 seq 10 deny 10.181.0.164/31
!

ip prefix-list PL_EXPORT_DENY_LINK_46_1 seq 10 deny 10.181.0.166/31
!

ip prefix-list PL_EXPORT_DENY_LONG_46 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_46_0 seq 10 deny 10.180.0.47/32
!

ip prefix-list PL_IN_46_68 seq 10 permit 10.181.0.186/31
ip prefix-list PL_IN_46_68 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_46_68 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_46_68 seq 10 permit 10.200.61.0/24
ip prefix-list PL_OUT_46_68 seq 20 permit 10.200.60.0/24
!






route-map RM_POLICY_IN_46_68 permit 10














 match ip address prefix-list PL_IN_46_68
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_46_68 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_46_68 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_46_0
 ! Block loopback 10.180.0.47/32


route-map RM_POLICY_OUT_46_68 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_46_0
 ! Block link 10.181.0.164/31


route-map RM_POLICY_OUT_46_68 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_46_1
 ! Block link 10.181.0.166/31


route-map RM_POLICY_OUT_46_68 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_46
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_46_68 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_46
 set community 65000:200 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_46_68 deny 200














 match ip address prefix-list PL_OUT_46_68
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_46_68 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.47
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.41 peer-group IBGP


 !
 neighbor 10.180.0.43 peer-group IBGP


 !
 neighbor 10.180.0.44 peer-group IBGP


 !
 neighbor 10.180.0.45 peer-group IBGP


 !
 neighbor 10.180.0.46 peer-group IBGP


 !
 neighbor 10.180.0.62 peer-group IBGP



 !
 neighbor 10.181.0.167 peer-group EBGP
 neighbor 10.181.0.167 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.41 activate


  neighbor 10.180.0.43 activate


  neighbor 10.180.0.44 activate


  neighbor 10.180.0.45 activate


  neighbor 10.180.0.46 activate


  neighbor 10.180.0.62 activate



  neighbor 10.181.0.167 activate
  neighbor 10.181.0.167 route-map RM_POLICY_IN_46_68 in
  neighbor 10.181.0.167 route-map RM_POLICY_OUT_46_68 out





  network 10.200.60.0 mask 255.255.255.0

  network 10.200.61.0 mask 255.255.255.0

 exit-address-family
