
hostname 56_as65003_HiO-Sarpsborg
!
interface Loopback0
 ip address 10.180.0.57 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.69.0/24


 ip address 10.200.69.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.70.0/24


 ip address 10.200.70.1 255.255.255.0
!



ip access-list extended ACL_56_GigabitEthernet0_1
 10 permit ip host 10.180.0.12 any
 20 permit ip host 10.181.0.60 any
 30 permit ip host 10.181.0.61 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 192.0.2.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 1_as65003_UiO (1)

 ip address 10.181.0.13 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65002_HVE-Borre (11)

 ip address 10.181.0.61 255.255.255.254

 ip access-group ACL_56_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 57_as65003_HiO-Halden (57)

 ip address 10.181.0.176 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.69.0 255.255.255.0 Loopback100
ip route 10.200.70.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.57
 passive-interface Loopback0
 network 10.180.0.57 0.0.0.0 area 0



network 10.181.0.12 0.0.0.1 area 0
network 10.181.0.176 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_56 seq 10 permit 10.200.69.0/24
ip prefix-list PL_EXPORT_ALLOWED_56 seq 20 permit 10.200.70.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_56_0 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_56_1 seq 10 deny 10.181.0.176/31
!

ip prefix-list PL_EXPORT_DENY_LINK_56_2 seq 10 deny 10.181.0.60/31
!

ip prefix-list PL_EXPORT_DENY_LONG_56 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_56_0 seq 10 deny 10.180.0.57/32
!

ip prefix-list PL_IN_56_11 seq 10 permit 10.181.0.60/31
ip prefix-list PL_IN_56_11 seq 20 permit 10.180.0.12/32
ip prefix-list PL_IN_56_11 seq 30 permit 10.181.0.62/31
ip prefix-list PL_IN_56_11 seq 40 permit 10.181.0.58/31
ip prefix-list PL_IN_56_11 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_56_11 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_56_11 seq 10 permit 10.200.70.0/24
ip prefix-list PL_OUT_56_11 seq 20 permit 10.200.69.0/24
!




ip community-list standard CL_COMM_56_11 permit no-advertise
!





route-map RM_POLICY_IN_56_11 permit 5














 match community CL_COMM_56_11
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_56_11 permit 10














 match ip address prefix-list PL_IN_56_11
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_56_11 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_56_11 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_56_11 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_56_0
 ! Block loopback 10.180.0.57/32


route-map RM_POLICY_OUT_56_11 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_56_11 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_1
 ! Block link 10.181.0.176/31


route-map RM_POLICY_OUT_56_11 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_2
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_56_11 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_56
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_56_11 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_56
 set metric 21
 set as-path prepend 65003 65003
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_56_11 deny 200














 match ip address prefix-list PL_OUT_56_11
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_56_11 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.57
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.1 peer-group RR


 !
 neighbor 10.180.0.4 peer-group RR




 !
 neighbor 10.181.0.60 peer-group EBGP
 neighbor 10.181.0.60 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.1 activate


  neighbor 10.180.0.4 activate




  neighbor 10.181.0.60 activate
  neighbor 10.181.0.60 route-map RM_POLICY_IN_56_11 in
  neighbor 10.181.0.60 route-map RM_POLICY_OUT_56_11 out





  network 10.200.69.0 mask 255.255.255.0

  network 10.200.70.0 mask 255.255.255.0

 exit-address-family
