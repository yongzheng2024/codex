
hostname 16_as65005_HSH-Stord
!
interface Loopback0
 ip address 10.180.0.17 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.15.0/24


 ip address 10.200.15.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.16.0/24


 ip address 10.200.16.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 17_as65005_UiB-Hoyteklogibygget (17)

 ip address 10.181.0.78 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 25_as65006_HSH-Haugesund (25)

 ip address 10.181.0.80 255.255.255.254
 mtu 1500
!


ip route 10.200.15.0 255.255.255.0 Loopback100
ip route 10.200.16.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.17
 passive-interface Loopback0
 network 10.180.0.17 0.0.0.0 area 0



network 10.181.0.78 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_16 seq 10 permit 10.200.15.0/24
ip prefix-list PL_EXPORT_ALLOWED_16 seq 20 permit 10.200.16.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_16_0 seq 10 deny 10.181.0.78/31
!

ip prefix-list PL_EXPORT_DENY_LINK_16_1 seq 10 deny 10.181.0.80/31
!

ip prefix-list PL_EXPORT_DENY_LONG_16 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_16_0 seq 10 deny 10.180.0.17/32
!

ip prefix-list PL_IN_16_25 seq 10 permit 10.200.28.0/24
ip prefix-list PL_IN_16_25 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_16_25 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_16_25 seq 10 permit 10.200.15.0/24
!




ip community-list standard CL_COMM_16_25 permit no-advertise
!





route-map RM_POLICY_IN_16_25 permit 5














 match community CL_COMM_16_25
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_16_25 permit 10














 match ip address prefix-list PL_IN_16_25
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_16_25 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_16_25 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_16_25 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_16_0
 ! Block loopback 10.180.0.17/32


route-map RM_POLICY_OUT_16_25 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_0
 ! Block link 10.181.0.78/31


route-map RM_POLICY_OUT_16_25 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_1
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_16_25 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_16
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_16_25 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_16
 set community 65000:100 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_16_25 deny 200














 match ip address prefix-list PL_OUT_16_25
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_16_25 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.17
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.41 peer-group IBGP


 !
 neighbor 10.180.0.43 peer-group IBGP


 !
 neighbor 10.180.0.44 peer-group IBGP


 !
 neighbor 10.180.0.45 peer-group IBGP


 !
 neighbor 10.180.0.46 peer-group IBGP


 !
 neighbor 10.180.0.47 peer-group IBGP


 !
 neighbor 10.180.0.62 peer-group IBGP



 !
 neighbor 10.181.0.81 peer-group EBGP
 neighbor 10.181.0.81 remote-as 65006


 !
 address-family ipv4


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.41 activate


  neighbor 10.180.0.43 activate


  neighbor 10.180.0.44 activate


  neighbor 10.180.0.45 activate


  neighbor 10.180.0.46 activate


  neighbor 10.180.0.47 activate


  neighbor 10.180.0.62 activate



  neighbor 10.181.0.81 activate
  neighbor 10.181.0.81 route-map RM_POLICY_IN_16_25 in
  neighbor 10.181.0.81 route-map RM_POLICY_OUT_16_25 out





  network 10.200.15.0 mask 255.255.255.0

  network 10.200.16.0 mask 255.255.255.0

 exit-address-family
