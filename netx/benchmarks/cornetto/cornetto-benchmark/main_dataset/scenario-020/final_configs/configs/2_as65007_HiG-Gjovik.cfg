
hostname 2_as65007_HiG-Gjovik
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.19.0/24


 ip address 10.200.19.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.20.0/24


 ip address 10.200.20.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 65_as65007_HiL-Lillehammer (65)

 ip address 10.181.0.20 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 3_as65003_UiO-St-Olavsplass-5 (3)

 ip address 10.181.0.22 255.255.255.254
 mtu 1500
!


ip route 10.200.19.0 255.255.255.0 Loopback100
ip route 10.200.20.0 255.255.255.0 Loopback101
ip route 10.200.21.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0



network 10.181.0.20 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_2 seq 10 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 20 permit 10.200.20.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 30 permit 10.200.21.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_2_0 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_1 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LONG_2 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_2_0 seq 10 deny 10.180.0.3/32
!

ip prefix-list PL_IN_2_3 seq 10 permit 10.200.41.0/24
ip prefix-list PL_IN_2_3 seq 20 permit 10.181.0.24/31
ip prefix-list PL_IN_2_3 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_2_3 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_2_3 seq 10 permit 10.200.21.0/24
!






route-map RM_POLICY_IN_2_3 permit 10














 match ip address prefix-list PL_IN_2_3
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_2_3 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_2_3 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_3 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_2_3 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_2_3 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_3 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_2
 set metric 26
 set as-path prepend 65007
 ! Outbound policy baseline


route-map RM_POLICY_OUT_2_3 deny 200














 match ip address prefix-list PL_OUT_2_3
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_2_3 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65007
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.65 peer-group IBGP


 !
 neighbor 10.180.0.66 peer-group IBGP


 !
 neighbor 10.180.0.70 peer-group IBGP


 !
 neighbor 10.180.0.71 peer-group IBGP


 !
 neighbor 10.180.0.72 peer-group IBGP


 !
 neighbor 10.180.0.73 peer-group IBGP


 !
 neighbor 10.180.0.74 peer-group IBGP



 !
 neighbor 10.181.0.23 peer-group EBGP
 neighbor 10.181.0.23 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.65 activate


  neighbor 10.180.0.66 activate


  neighbor 10.180.0.70 activate


  neighbor 10.180.0.71 activate


  neighbor 10.180.0.72 activate


  neighbor 10.180.0.73 activate


  neighbor 10.180.0.74 activate



  neighbor 10.181.0.23 activate
  neighbor 10.181.0.23 route-map RM_POLICY_IN_2_3 in
  neighbor 10.181.0.23 route-map RM_POLICY_OUT_2_3 out





  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

  network 10.200.21.0 mask 255.255.255.0

 exit-address-family
