ip community-list standard CL_COMM_23_41 permit 65535:65282
ip community-list standard CL_COMM_23_41 permit no-advertise
!





route-map RM_POLICY_IN_23_41 permit 5














 match community CL_COMM_23_41
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_23_41 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_23_41 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_23_0
 ! Block loopback 10.180.0.24/32


route-map RM_POLICY_OUT_23_41 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_0
 ! Block link 10.181.0.102/31


