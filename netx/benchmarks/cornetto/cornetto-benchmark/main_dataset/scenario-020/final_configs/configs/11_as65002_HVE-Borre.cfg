 set as-path prepend 65002 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_11_56 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_11
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_11_56 deny 200














 match ip address prefix-list PL_OUT_11_56
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_11_56 deny 65000














 ! Deny other outbound routes

