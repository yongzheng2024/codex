route-map RM_POLICY_IN_11_56 permit 10














 match ip address prefix-list PL_IN_11_56
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_11_56 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_11_56 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_11_0
 ! Block loopback 10.180.0.12/32


