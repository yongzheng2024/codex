
hostname 19_as65003_Ajdovscina
!
interface Loopback0
 ip address 10.180.0.20 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!



ip access-list extended ACL_19_GigabitEthernet0_1
 10 permit ip host 10.180.0.18 any
 20 permit ip host 10.181.0.68 any
 30 permit ip host 10.181.0.69 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 9_as65003_Nova-Gorica (9)

 ip address 10.181.0.49 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 17_as65002_Divaca (17)

 ip address 10.181.0.69 255.255.255.254

 ip access-group ACL_19_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.8.0 255.255.255.0 Loopback101
ip route 10.200.9.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.20
 passive-interface Loopback0
 network 10.180.0.20 0.0.0.0 area 0



network 10.181.0.48 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_19 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_19 seq 20 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_19 seq 30 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_19_0 seq 10 deny 10.181.0.48/31
!

ip prefix-list PL_EXPORT_DENY_LINK_19_1 seq 10 deny 10.181.0.68/31
!

ip prefix-list PL_EXPORT_DENY_LONG_19 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_19_0 seq 10 deny 10.180.0.20/32
!

ip prefix-list PL_IN_19_17 seq 10 permit 10.200.2.0/24
ip prefix-list PL_IN_19_17 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_19_17 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_19_17 seq 10 permit 10.200.9.0/24
!




ip community-list standard CL_COMM_19_17 permit no-export
!





route-map RM_POLICY_IN_19_17 permit 5














 match community CL_COMM_19_17
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_19_17 permit 10














 match ip address prefix-list PL_IN_19_17
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_19_17 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_19_17 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_19_17 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_19_0
 ! Block loopback 10.180.0.20/32


route-map RM_POLICY_OUT_19_17 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_19_0
 ! Block link 10.181.0.48/31


route-map RM_POLICY_OUT_19_17 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_19_1
 ! Block link 10.181.0.68/31


route-map RM_POLICY_OUT_19_17 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_19
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_19_17 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_19
 set metric 22
 set as-path prepend 65003 65003
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_19_17 deny 200














 match ip address prefix-list PL_OUT_19_17
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_19_17 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.20
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP



 !
 neighbor 10.181.0.68 peer-group EBGP
 neighbor 10.181.0.68 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.9 activate


  neighbor 10.180.0.10 activate


  neighbor 10.180.0.16 activate



  neighbor 10.181.0.68 activate
  neighbor 10.181.0.68 route-map RM_POLICY_IN_19_17 in
  neighbor 10.181.0.68 route-map RM_POLICY_OUT_19_17 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
