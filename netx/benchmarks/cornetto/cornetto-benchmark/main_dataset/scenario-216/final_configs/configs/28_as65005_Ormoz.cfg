
hostname 28_as65005_Ormoz
!
interface Loopback0
 ip address 10.180.0.29 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.24.0/24


 ip address 10.200.24.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.25.0/24


 ip address 10.200.25.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.26.0/24


 ip address 10.200.26.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 27_as65005_Ljutomer (27)

 ip address 10.181.0.83 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 29_as65004_Ptuj (29)

 ip address 10.181.0.84 255.255.255.254
 mtu 1500
!


ip route 10.200.24.0 255.255.255.0 Loopback100
ip route 10.200.25.0 255.255.255.0 Loopback101
ip route 10.200.26.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.29
 passive-interface Loopback0
 network 10.180.0.29 0.0.0.0 area 0



network 10.181.0.82 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_28 seq 10 permit 10.200.24.0/24
ip prefix-list PL_EXPORT_ALLOWED_28 seq 20 permit 10.200.25.0/24
ip prefix-list PL_EXPORT_ALLOWED_28 seq 30 permit 10.200.26.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_28_0 seq 10 deny 10.181.0.82/31
!

ip prefix-list PL_EXPORT_DENY_LINK_28_1 seq 10 deny 10.181.0.84/31
!

ip prefix-list PL_EXPORT_DENY_LONG_28 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_28_0 seq 10 deny 10.180.0.29/32
!

ip prefix-list PL_IN_28_29 seq 10 permit 10.200.29.0/24
ip prefix-list PL_IN_28_29 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_28_29 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_28_29 seq 10 permit 10.200.24.0/24
!






route-map RM_POLICY_IN_28_29 permit 10














 match ip address prefix-list PL_IN_28_29
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_28_29 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_28_29 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_28_0
 ! Block loopback 10.180.0.29/32


route-map RM_POLICY_OUT_28_29 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_28_0
 ! Block link 10.181.0.82/31


route-map RM_POLICY_OUT_28_29 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_28_1
 ! Block link 10.181.0.84/31


route-map RM_POLICY_OUT_28_29 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_28
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_28_29 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_28
 set metric 28
 set as-path prepend 65005 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_28_29 deny 200














 match ip address prefix-list PL_OUT_28_29
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_28_29 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.29
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP



 !
 neighbor 10.181.0.85 peer-group EBGP
 neighbor 10.181.0.85 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.13 activate


  neighbor 10.180.0.27 activate


  neighbor 10.180.0.28 activate



  neighbor 10.181.0.85 activate
  neighbor 10.181.0.85 route-map RM_POLICY_IN_28_29 in
  neighbor 10.181.0.85 route-map RM_POLICY_OUT_28_29 out





  network 10.200.24.0 mask 255.255.255.0

  network 10.200.25.0 mask 255.255.255.0

  network 10.200.26.0 mask 255.255.255.0

 exit-address-family
