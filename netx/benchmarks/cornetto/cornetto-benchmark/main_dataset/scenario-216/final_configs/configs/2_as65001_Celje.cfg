 match ip address prefix-list PL_EXPORT_DENY_LINK_2_3
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_2_25 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_2
 set metric 8
 set as-path prepend 65001 65001
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_2_25 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_25 deny 65000














 ! Deny other outbound routes

