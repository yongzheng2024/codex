ip community-list standard CL_COMM_32_30 permit no-advertise
!





route-map RM_POLICY_IN_32_30 permit 5














 match community CL_COMM_32_30
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_32_30 permit 10














 match ip address prefix-list PL_IN_32_30
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_32_30 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_32_30 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_32_30 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_32_0
 ! Block loopback 10.180.0.33/32


route-map RM_POLICY_OUT_32_30 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_0
 ! Block link 10.181.0.74/31


route-map RM_POLICY_OUT_32_30 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_1
 ! Block link 10.181.0.78/31


route-map RM_POLICY_OUT_32_30 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_2
 ! Block link 10.181.0.88/31


route-map RM_POLICY_OUT_32_30 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_3
 ! Block link 10.181.0.92/31


route-map RM_POLICY_OUT_32_30 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_32
 set metric 23
 set as-path prepend 65006 65006
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_32_30 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_32
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_32_30 deny 200














 match ip address prefix-list PL_OUT_32_30
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_32_30 deny 65000














 ! Deny other outbound routes

