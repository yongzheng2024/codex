  neighbor 10.180.0.26 activate


  neighbor 10.180.0.34 activate



  neighbor 10.181.0.88 activate
  neighbor 10.181.0.88 route-map RM_POLICY_IN_32_30 in
  neighbor 10.181.0.88 route-map RM_POLICY_OUT_32_30 out





  network 10.200.32.0 mask 255.255.255.0

  network 10.200.33.0 mask 255.255.255.0

