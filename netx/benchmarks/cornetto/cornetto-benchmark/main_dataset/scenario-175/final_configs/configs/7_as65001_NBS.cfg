
hostname 7_as65001_NBS
!
interface Loopback0
 ip address 10.180.0.8 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.35.0/24


 ip address 10.200.35.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.36.0/24


 ip address 10.200.36.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.37.0/24


 ip address 10.200.37.1 255.255.255.0
!



ip access-list extended ACL_7_GigabitEthernet0_0
 10 permit ip host 10.180.0.5 any
 20 permit ip host 10.181.0.20 any
 30 permit ip host 10.181.0.21 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 4_as65002_ETAC (4)

 ip address 10.181.0.21 255.255.255.254

 ip access-group ACL_7_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 20_as65001_HARVARD (20)

 ip address 10.181.0.28 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.35.0 255.255.255.0 Loopback100
ip route 10.200.36.0 255.255.255.0 Loopback101
ip route 10.200.37.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.8
 passive-interface Loopback0
 network 10.180.0.8 0.0.0.0 area 0



network 10.181.0.28 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_7 seq 10 permit 10.200.35.0/24
ip prefix-list PL_EXPORT_ALLOWED_7 seq 20 permit 10.200.36.0/24
ip prefix-list PL_EXPORT_ALLOWED_7 seq 30 permit 10.200.37.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_7_0 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LINK_7_1 seq 10 deny 10.181.0.28/31
!

ip prefix-list PL_EXPORT_DENY_LONG_7 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_7_0 seq 10 deny 10.180.0.8/32
!

ip prefix-list PL_IN_7_4 seq 10 permit 10.200.34.0/24
ip prefix-list PL_IN_7_4 seq 20 permit 10.200.33.0/24
ip prefix-list PL_IN_7_4 seq 30 permit 10.200.31.0/24
ip prefix-list PL_IN_7_4 seq 40 permit 10.181.0.16/31
ip prefix-list PL_IN_7_4 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_7_4 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_7_4 seq 10 permit 10.200.35.0/24
ip prefix-list PL_OUT_7_4 seq 20 permit 10.200.36.0/24
!






route-map RM_POLICY_IN_7_4 permit 10














 match ip address prefix-list PL_IN_7_4
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_7_4 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_7_4 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_7_0
 ! Block loopback 10.180.0.8/32


route-map RM_POLICY_OUT_7_4 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_0
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_7_4 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_1
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_7_4 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_7
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_7_4 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_7
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_7_4 deny 200














 match ip address prefix-list PL_OUT_7_4
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_7_4 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.8
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP


 !
 neighbor 10.180.0.29 peer-group IBGP



 !
 neighbor 10.181.0.20 peer-group EBGP
 neighbor 10.181.0.20 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.21 activate


  neighbor 10.180.0.29 activate



  neighbor 10.181.0.20 activate
  neighbor 10.181.0.20 route-map RM_POLICY_IN_7_4 in
  neighbor 10.181.0.20 route-map RM_POLICY_OUT_7_4 out





  network 10.200.35.0 mask 255.255.255.0

  network 10.200.36.0 mask 255.255.255.0

  network 10.200.37.0 mask 255.255.255.0

 exit-address-family
