
hostname 9_as65005_AMES
!
interface Loopback0
 ip address 10.180.0.10 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.41.0/24


 ip address 10.200.41.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.42.0/24


 ip address 10.200.42.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 21_as65004_SRI (21)

 ip address 10.181.0.32 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 14_as65005_AMES (14)

 ip address 10.181.0.34 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.41.0 255.255.255.0 Loopback100
ip route 10.200.42.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.10
 passive-interface Loopback0
 network 10.180.0.10 0.0.0.0 area 0










 redistribute bgp 65005 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_9

network 10.181.0.34 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_9 seq 10 permit 10.200.4.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_9 seq 20 permit 10.200.5.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_9 seq 30 permit 10.200.6.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_9 seq 40 permit 10.200.9.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_9 seq 50 permit 10.200.10.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_9 seq 60 permit 10.200.11.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_9 seq 70 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_9 seq 80 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_9 seq 90 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_9 seq 100 permit 10.200.15.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_9 seq 110 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_9 seq 120 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_9 seq 130 permit 10.200.20.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_9 seq 10 permit 10.180.0.10/32
ip prefix-list PL_BGP_TO_OSPF_DENY_9 seq 20 permit 10.181.0.32/31
ip prefix-list PL_BGP_TO_OSPF_DENY_9 seq 30 permit 10.181.0.34/31
!

ip prefix-list PL_EXPORT_ALLOWED_9 seq 10 permit 10.200.41.0/24
ip prefix-list PL_EXPORT_ALLOWED_9 seq 20 permit 10.200.42.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_9_0 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LINK_9_1 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LONG_9 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_9_0 seq 10 deny 10.180.0.10/32
!






route-map RM_BGP_TO_OSPF_9 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_9 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_9
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_9 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_9
 set tag 65010

!


route-map RM_POLICY_IN_9_21 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_9_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_9_0
 ! Block loopback 10.180.0.10/32


route-map RM_POLICY_OUT_9_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_9_0
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_9_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_9_1
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_9_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_9
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_9_21 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_9
 set metric 13
 set as-path prepend 65005 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_9_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.10
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP



 !
 neighbor 10.181.0.33 peer-group EBGP
 neighbor 10.181.0.33 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.9 activate


  neighbor 10.180.0.14 activate


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.25 activate



  neighbor 10.181.0.33 activate
  neighbor 10.181.0.33 route-map RM_POLICY_IN_9_21 in
  neighbor 10.181.0.33 route-map RM_POLICY_OUT_9_21 out





  network 10.200.41.0 mask 255.255.255.0

  network 10.200.42.0 mask 255.255.255.0

 exit-address-family
