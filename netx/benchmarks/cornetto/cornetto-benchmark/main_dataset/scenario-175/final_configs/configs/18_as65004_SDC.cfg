
hostname 18_as65004_SDC
!
interface Loopback0
 ip address 10.180.0.19 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 25_as65003_USC (25)

 ip address 10.181.0.52 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 23_as65004_UCLA (23)

 ip address 10.181.0.54 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.4.0 255.255.255.0 Loopback100
ip route 10.200.5.0 255.255.255.0 Loopback101
ip route 10.200.6.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.19
 passive-interface Loopback0
 network 10.180.0.19 0.0.0.0 area 0










 redistribute bgp 65004 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_18

network 10.181.0.54 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_18 seq 10 permit 10.200.16.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_18 seq 20 permit 10.200.17.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_18 seq 30 permit 10.200.21.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_18 seq 40 permit 10.200.22.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_18 seq 50 permit 10.200.23.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_18 seq 60 permit 10.200.24.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_18 seq 70 permit 10.200.28.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_18 seq 80 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_18 seq 90 permit 10.200.30.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_18 seq 10 permit 10.180.0.19/32
ip prefix-list PL_BGP_TO_OSPF_DENY_18 seq 20 permit 10.181.0.52/31
ip prefix-list PL_BGP_TO_OSPF_DENY_18 seq 30 permit 10.181.0.54/31
!

ip prefix-list PL_EXPORT_ALLOWED_18 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_18 seq 20 permit 10.200.5.0/24
ip prefix-list PL_EXPORT_ALLOWED_18 seq 30 permit 10.200.6.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_18_0 seq 10 deny 10.181.0.52/31
!

ip prefix-list PL_EXPORT_DENY_LINK_18_1 seq 10 deny 10.181.0.54/31
!

ip prefix-list PL_EXPORT_DENY_LONG_18 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_18_0 seq 10 deny 10.180.0.19/32
!

ip prefix-list PL_IN_18_25 seq 10 permit 10.180.0.26/32
ip prefix-list PL_IN_18_25 seq 20 permit 10.181.0.48/31
ip prefix-list PL_IN_18_25 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_18_25 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_18_25 seq 10 permit 10.200.5.0/24
ip prefix-list PL_OUT_18_25 seq 20 permit 10.200.4.0/24
!






route-map RM_BGP_TO_OSPF_18 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_18 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_18
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_18 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_18
 set tag 65010

!


route-map RM_POLICY_IN_18_25 permit 10














 match ip address prefix-list PL_IN_18_25
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_18_25 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_18_25 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_18_0
 ! Block loopback 10.180.0.19/32


route-map RM_POLICY_OUT_18_25 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_18_0
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_18_25 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_18_1
 ! Block link 10.181.0.54/31


route-map RM_POLICY_OUT_18_25 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_18
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_18_25 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_18
 set metric 9
 set as-path prepend 65004
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_18_25 deny 200














 match ip address prefix-list PL_OUT_18_25
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_18_25 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.19
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP


 !
 neighbor 10.180.0.24 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP



 !
 neighbor 10.181.0.53 peer-group EBGP
 neighbor 10.181.0.53 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.13 activate


  neighbor 10.180.0.22 activate


  neighbor 10.180.0.23 activate


  neighbor 10.180.0.24 activate


  neighbor 10.180.0.27 activate



  neighbor 10.181.0.53 activate
  neighbor 10.181.0.53 route-map RM_POLICY_IN_18_25 in
  neighbor 10.181.0.53 route-map RM_POLICY_OUT_18_25 out





  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

  network 10.200.6.0 mask 255.255.255.0

 exit-address-family
