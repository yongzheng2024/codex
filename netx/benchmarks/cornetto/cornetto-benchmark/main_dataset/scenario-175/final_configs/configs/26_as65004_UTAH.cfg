
hostname 26_as65004_UTAH
!
interface Loopback0
 ip address 10.180.0.27 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.18.0/24


 ip address 10.200.18.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.19.0/24


 ip address 10.200.19.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.20.0/24


 ip address 10.200.20.1 255.255.255.0
!



ip access-list extended ACL_26_GigabitEthernet0_0
 10 permit ip host 10.180.0.1 any
 20 permit ip host 10.181.0.0 any
 30 permit ip host 10.181.0.1 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 0_as65001_ILLINOIS (0)

 ip address 10.181.0.1 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10


 ip access-group ACL_26_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 12_as65004_McClellan (12)

 ip address 10.181.0.39 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.18.0 255.255.255.0 Loopback100
ip route 10.200.19.0 255.255.255.0 Loopback101
ip route 10.200.20.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.27
 passive-interface Loopback0
 network 10.180.0.27 0.0.0.0 area 0



network 10.181.0.0 0.0.0.1 area 0
network 10.181.0.38 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_26 seq 10 permit 10.200.18.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 20 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 30 permit 10.200.20.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_26_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_26_1 seq 10 deny 10.181.0.38/31
!

ip prefix-list PL_EXPORT_DENY_LONG_26 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_26_0 seq 10 deny 10.180.0.27/32
!

ip prefix-list PL_IN_26_0 seq 10 permit 10.200.1.0/24
ip prefix-list PL_IN_26_0 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_26_0 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_26_0 seq 10 permit 10.200.18.0/24
!






route-map RM_POLICY_IN_26_0 permit 10














 match ip address prefix-list PL_IN_26_0
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_26_0 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_26_0 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_26_0
 ! Block loopback 10.180.0.27/32


route-map RM_POLICY_OUT_26_0 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_26_0 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_1
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_26_0 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_26
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_26_0 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_26
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_26_0 deny 200














 match ip address prefix-list PL_OUT_26_0
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_26_0 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.27
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP


 !
 neighbor 10.180.0.24 peer-group IBGP



 !
 neighbor 10.181.0.0 peer-group EBGP
 neighbor 10.181.0.0 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.13 activate


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.22 activate


  neighbor 10.180.0.23 activate


  neighbor 10.180.0.24 activate



  neighbor 10.181.0.0 activate
  neighbor 10.181.0.0 route-map RM_POLICY_IN_26_0 in
  neighbor 10.181.0.0 route-map RM_POLICY_OUT_26_0 out





  network 10.200.18.0 mask 255.255.255.0

  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

 exit-address-family
