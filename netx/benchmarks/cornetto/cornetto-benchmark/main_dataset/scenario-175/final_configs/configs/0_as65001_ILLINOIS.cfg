
hostname 0_as65001_ILLINOIS
!
interface Loopback0
 ip address 10.180.0.1 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!



ip access-list extended ACL_0_GigabitEthernet0_0
 10 permit ip host 10.180.0.27 any
 20 permit ip host 10.181.0.0 any
 30 permit ip host 10.181.0.1 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 26_as65004_UTAH (26)

 ip address 10.181.0.0 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10


 ip access-group ACL_0_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 28_as65001_MIT (28)

 ip address 10.181.0.2 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.1
 passive-interface Loopback0
 network 10.180.0.1 0.0.0.0 area 0



network 10.181.0.0 0.0.0.1 area 0
network 10.181.0.2 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 10 permit 10.200.4.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 20 permit 10.200.5.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 30 permit 10.200.6.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 40 permit 10.200.9.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 50 permit 10.200.10.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 60 permit 10.200.11.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 70 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 80 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 90 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 100 permit 10.200.15.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 110 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 120 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_0 seq 130 permit 10.200.20.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 10 permit 10.180.0.1/32
ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 20 permit 10.181.0.0/31
ip prefix-list PL_BGP_TO_OSPF_DENY_0 seq 30 permit 10.181.0.2/31
!

ip prefix-list PL_EXPORT_ALLOWED_0 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_0 seq 20 permit 10.200.1.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_0_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_1 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LONG_0 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_0_0 seq 10 deny 10.180.0.1/32
!




ip community-list standard CL_COMM_0_26 permit 65535:65282
ip community-list standard CL_COMM_0_26 permit no-advertise
!





route-map RM_BGP_TO_OSPF_0 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_0 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_0
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_0 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_0
 set tag 65010

!


route-map RM_POLICY_IN_0_26 permit 5














 match community CL_COMM_0_26
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_0_26 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_0_26 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_0_26 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_0_0
 ! Block loopback 10.180.0.1/32


route-map RM_POLICY_OUT_0_26 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_0_26 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_0_26 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_0
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_0_26 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_0
 set metric 27
 set as-path prepend 65001
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_0_26 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP


 !
 neighbor 10.180.0.29 peer-group IBGP



 !
 neighbor 10.181.0.1 peer-group EBGP
 neighbor 10.181.0.1 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.8 activate


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.21 activate


  neighbor 10.180.0.29 activate



  neighbor 10.181.0.1 activate
  neighbor 10.181.0.1 route-map RM_POLICY_IN_0_26 in
  neighbor 10.181.0.1 route-map RM_POLICY_OUT_0_26 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

 exit-address-family
