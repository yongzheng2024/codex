
hostname 25_as65003_USC
!
interface Loopback0
 ip address 10.180.0.26 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.16.0/24


 ip address 10.200.16.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.17.0/24


 ip address 10.200.17.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 15_as65003_NOAA---Boulder--Colorado (15)

 ip address 10.181.0.49 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 18_as65004_SDC (18)

 ip address 10.181.0.53 255.255.255.254
 mtu 1500
!


ip route 10.200.16.0 255.255.255.0 Loopback100
ip route 10.200.17.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.26
 passive-interface Loopback0
 network 10.180.0.26 0.0.0.0 area 0



network 10.181.0.48 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_25 seq 10 permit 10.200.16.0/24
ip prefix-list PL_EXPORT_ALLOWED_25 seq 20 permit 10.200.17.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_25_0 seq 10 deny 10.181.0.48/31
!

ip prefix-list PL_EXPORT_DENY_LINK_25_1 seq 10 deny 10.181.0.52/31
!

ip prefix-list PL_EXPORT_DENY_LONG_25 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_25_0 seq 10 deny 10.180.0.26/32
!

ip prefix-list PL_IN_25_18 seq 10 permit 10.181.0.52/31
ip prefix-list PL_IN_25_18 seq 20 permit 10.200.5.0/24
ip prefix-list PL_IN_25_18 seq 30 permit 10.200.6.0/24
ip prefix-list PL_IN_25_18 seq 40 permit 10.181.0.54/31
ip prefix-list PL_IN_25_18 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_25_18 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_25_18 seq 10 permit 10.200.16.0/24
!






route-map RM_POLICY_IN_25_18 permit 10














 match ip address prefix-list PL_IN_25_18
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_25_18 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_25_18 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_25_0
 ! Block loopback 10.180.0.26/32


route-map RM_POLICY_OUT_25_18 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_0
 ! Block link 10.181.0.48/31


route-map RM_POLICY_OUT_25_18 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_1
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_25_18 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_25
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_25_18 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_25
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_25_18 deny 200














 match ip address prefix-list PL_OUT_25_18
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_25_18 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.26
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.4 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP



 !
 neighbor 10.181.0.52 peer-group EBGP
 neighbor 10.181.0.52 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.4 activate


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.28 activate



  neighbor 10.181.0.52 activate
  neighbor 10.181.0.52 route-map RM_POLICY_IN_25_18 in
  neighbor 10.181.0.52 route-map RM_POLICY_OUT_25_18 out





  network 10.200.16.0 mask 255.255.255.0

  network 10.200.17.0 mask 255.255.255.0

 exit-address-family
