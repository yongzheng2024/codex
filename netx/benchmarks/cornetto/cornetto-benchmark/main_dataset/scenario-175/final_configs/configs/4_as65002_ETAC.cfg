
hostname 4_as65002_ETAC
!
interface Loopback0
 ip address 10.180.0.5 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.31.0/24


 ip address 10.200.31.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.32.0/24


 ip address 10.200.32.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.33.0/24


 ip address 10.200.33.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.34.0/24


 ip address 10.200.34.1 255.255.255.0
!



ip access-list extended ACL_4_GigabitEthernet0_2
 10 permit ip host 10.180.0.8 any
 20 permit ip host 10.181.0.20 any
 30 permit ip host 10.181.0.21 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 192.0.2.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 8_as65005_Tinker (8)

 ip address 10.181.0.16 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 10_as65002_ARPA (10)

 ip address 10.181.0.18 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 7_as65001_NBS (7)

 ip address 10.181.0.20 255.255.255.254

 ip access-group ACL_4_GigabitEthernet0_2 in
 mtu 1500
!


ip route 10.200.31.0 255.255.255.0 Loopback100
ip route 10.200.32.0 255.255.255.0 Loopback101
ip route 10.200.33.0 255.255.255.0 Loopback102
ip route 10.200.34.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.5
 passive-interface Loopback0
 network 10.180.0.5 0.0.0.0 area 0










 redistribute bgp 65002 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_4

network 10.181.0.18 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 10 permit 10.200.0.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 20 permit 10.200.1.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 30 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 40 permit 10.200.3.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 50 permit 10.200.25.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 60 permit 10.200.26.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 70 permit 10.200.27.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 80 permit 10.200.35.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 90 permit 10.200.36.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 100 permit 10.200.37.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 110 permit 10.200.38.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 120 permit 10.200.39.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 130 permit 10.200.40.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 140 permit 10.200.41.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_4 seq 150 permit 10.200.42.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_4 seq 10 permit 10.180.0.5/32
ip prefix-list PL_BGP_TO_OSPF_DENY_4 seq 20 permit 10.181.0.16/31
ip prefix-list PL_BGP_TO_OSPF_DENY_4 seq 30 permit 10.181.0.18/31
ip prefix-list PL_BGP_TO_OSPF_DENY_4 seq 40 permit 10.181.0.20/31
!

ip prefix-list PL_EXPORT_ALLOWED_4 seq 10 permit 10.200.31.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 20 permit 10.200.32.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 30 permit 10.200.33.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 40 permit 10.200.34.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_4_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_4_1 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_4_2 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LONG_4 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_4_0 seq 10 deny 10.180.0.5/32
!

ip prefix-list PL_IN_4_7 seq 10 permit 10.200.35.0/24
ip prefix-list PL_IN_4_7 seq 20 permit 10.181.0.28/31
ip prefix-list PL_IN_4_7 seq 30 permit 10.180.0.8/32
ip prefix-list PL_IN_4_7 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_4_7 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_4_7 seq 10 permit 10.200.34.0/24
!






route-map RM_BGP_TO_OSPF_4 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_4 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_4
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_4 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_4
 set tag 65010

!


route-map RM_POLICY_IN_4_7 permit 10














 match ip address prefix-list PL_IN_4_7
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_4_7 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_4_7 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_4_0
 ! Block loopback 10.180.0.5/32


route-map RM_POLICY_OUT_4_7 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_4_7 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_1
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_4_7 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_2
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_4_7 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_4
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_4_7 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_4
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_4_7 deny 200














 match ip address prefix-list PL_OUT_4_7
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_4_7 deny 65000














 ! Deny other outbound routes

!


route-map RM_POLICY_OUT_4_8 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_4_0
 ! Block loopback 10.180.0.5/32


route-map RM_POLICY_OUT_4_8 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_4_8 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_1
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_4_8 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_2
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_4_8 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_4
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_4_8 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_4
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_4_8 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.5
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP



 !
 neighbor 10.181.0.17 peer-group EBGP
 neighbor 10.181.0.17 remote-as 65005


 !
 neighbor 10.181.0.21 peer-group EBGP
 neighbor 10.181.0.21 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.3 activate


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.18 activate



  neighbor 10.181.0.17 activate
  neighbor 10.181.0.17 route-map RM_POLICY_OUT_4_8 out


  neighbor 10.181.0.21 activate
  neighbor 10.181.0.21 route-map RM_POLICY_IN_4_7 in
  neighbor 10.181.0.21 route-map RM_POLICY_OUT_4_7 out





  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

  network 10.200.33.0 mask 255.255.255.0

  network 10.200.34.0 mask 255.255.255.0

 exit-address-family
