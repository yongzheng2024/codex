
hostname 16_as65002_SAAC
!
interface Loopback0
 ip address 10.180.0.17 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 1_as65002_MITRE (1)

 ip address 10.181.0.5 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 17_as65002_BELVOIR (17)

 ip address 10.181.0.50 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.17
 passive-interface Loopback0
 network 10.180.0.17 0.0.0.0 area 0



network 10.181.0.4 0.0.0.1 area 0
network 10.181.0.50 0.0.0.1 area 0
!








router bgp 65002
 bgp router-id 10.180.0.17
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0




 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP



 !
 address-family ipv4


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.3 activate


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.18 activate






 exit-address-family
