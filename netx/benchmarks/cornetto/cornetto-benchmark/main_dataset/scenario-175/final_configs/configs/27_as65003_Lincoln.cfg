
hostname 27_as65003_Lincoln
!
interface Loopback0
 ip address 10.180.0.28 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.23.0/24


 ip address 10.200.23.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.24.0/24


 ip address 10.200.24.1 255.255.255.0
!



ip access-list extended ACL_27_GigabitEthernet0_1
 10 permit ip host 10.180.0.29 any
 20 permit ip host 10.181.0.62 any
 30 permit ip host 10.181.0.63 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 11_as65003_RADC (11)

 ip address 10.181.0.37 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 28_as65001_MIT (28)

 ip address 10.181.0.62 255.255.255.254

 ip access-group ACL_27_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.21.0 255.255.255.0 Loopback100
ip route 10.200.22.0 255.255.255.0 Loopback101
ip route 10.200.23.0 255.255.255.0 Loopback102
ip route 10.200.24.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.28
 passive-interface Loopback0
 network 10.180.0.28 0.0.0.0 area 0










 redistribute bgp 65003 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_27

network 10.181.0.36 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_27 seq 10 permit 10.200.0.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_27 seq 20 permit 10.200.1.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_27 seq 30 permit 10.200.25.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_27 seq 40 permit 10.200.26.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_27 seq 50 permit 10.200.27.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_27 seq 60 permit 10.200.35.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_27 seq 70 permit 10.200.36.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_27 seq 80 permit 10.200.37.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_27 seq 10 permit 10.180.0.28/32
ip prefix-list PL_BGP_TO_OSPF_DENY_27 seq 20 permit 10.181.0.36/31
ip prefix-list PL_BGP_TO_OSPF_DENY_27 seq 30 permit 10.181.0.62/31
!

ip prefix-list PL_EXPORT_ALLOWED_27 seq 10 permit 10.200.21.0/24
ip prefix-list PL_EXPORT_ALLOWED_27 seq 20 permit 10.200.22.0/24
ip prefix-list PL_EXPORT_ALLOWED_27 seq 30 permit 10.200.23.0/24
ip prefix-list PL_EXPORT_ALLOWED_27 seq 40 permit 10.200.24.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_27_0 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LINK_27_1 seq 10 deny 10.181.0.62/31
!

ip prefix-list PL_EXPORT_DENY_LONG_27 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_27_0 seq 10 deny 10.180.0.28/32
!






route-map RM_BGP_TO_OSPF_27 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_27 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_27
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_27 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_27
 set tag 65010

!


route-map RM_POLICY_OUT_27_28 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_27_0
 ! Block loopback 10.180.0.28/32


route-map RM_POLICY_OUT_27_28 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_0
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_27_28 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_1
 ! Block link 10.181.0.62/31


route-map RM_POLICY_OUT_27_28 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_27
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_27_28 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_27
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_27_28 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.28
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.4 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP



 !
 neighbor 10.181.0.63 peer-group EBGP
 neighbor 10.181.0.63 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.4 activate


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.26 activate



  neighbor 10.181.0.63 activate
  neighbor 10.181.0.63 route-map RM_POLICY_OUT_27_28 out





  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

  network 10.200.23.0 mask 255.255.255.0

  network 10.200.24.0 mask 255.255.255.0

 exit-address-family
