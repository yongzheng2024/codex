ip prefix-list PL_EXPORT_ALLOWED_23 seq 10 permit 10.200.13.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 20 permit 10.200.14.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 30 permit 10.200.15.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_23_0 seq 10 deny 10.181.0.44/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_1 seq 10 deny 10.181.0.54/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_2 seq 10 deny 10.181.0.60/31
!

ip prefix-list PL_EXPORT_DENY_LONG_23 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_23_0 seq 10 deny 10.180.0.24/32
!

ip prefix-list PL_IN_23_13 seq 10 permit 10.200.3.0/24
ip prefix-list PL_IN_23_13 seq 20 permit 10.181.0.44/31
ip prefix-list PL_IN_23_13 seq 30 permit 10.181.0.42/31
ip prefix-list PL_IN_23_13 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_23_13 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_23_13 seq 10 permit 10.200.14.0/24
ip prefix-list PL_OUT_23_13 seq 20 permit 10.200.13.0/24
!




ip community-list standard CL_COMM_23_13 permit 65535:65282
ip community-list standard CL_COMM_23_13 permit no-export
!





route-map RM_POLICY_IN_23_13 permit 5














 match community CL_COMM_23_13
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_23_13 permit 10














 match ip address prefix-list PL_IN_23_13
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_23_13 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_23_13 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_23_13 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_23_0
 ! Block loopback 10.180.0.24/32


route-map RM_POLICY_OUT_23_13 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_0
 ! Block link 10.181.0.44/31


route-map RM_POLICY_OUT_23_13 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_1
 ! Block link 10.181.0.54/31


route-map RM_POLICY_OUT_23_13 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_2
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_23_13 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_23
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_23_13 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_23
 set metric 19
 set as-path prepend 65004 65004
 set community no-advertise no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_23_13 deny 200














 match ip address prefix-list PL_OUT_23_13
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_23_13 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.24
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP



 !
 neighbor 10.181.0.44 peer-group EBGP
 neighbor 10.181.0.44 remote-as 65005


 !
 address-family ipv4


  neighbor 10.180.0.13 activate


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.22 activate


  neighbor 10.180.0.23 activate


  neighbor 10.180.0.27 activate



  neighbor 10.181.0.44 activate
  neighbor 10.181.0.44 route-map RM_POLICY_IN_23_13 in
  neighbor 10.181.0.44 route-map RM_POLICY_OUT_23_13 out





  network 10.200.13.0 mask 255.255.255.0

  network 10.200.14.0 mask 255.255.255.0

  network 10.200.15.0 mask 255.255.255.0

 exit-address-family
