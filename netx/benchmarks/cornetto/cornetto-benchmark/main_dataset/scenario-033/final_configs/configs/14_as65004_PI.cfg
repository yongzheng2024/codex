
hostname 14_as65004_PI
!
interface Loopback0
 ip address 10.180.0.15 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 4_as65004_BO (4)

 ip address 10.181.0.27 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.15
 passive-interface Loopback0
 network 10.180.0.15 0.0.0.0 area 0



network 10.181.0.26 0.0.0.1 area 0
!








router bgp 65004
 bgp router-id 10.180.0.15
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0




 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP



 !
 address-family ipv4


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.8 activate






 exit-address-family
