!


ip route 10.200.96.0 255.255.255.0 Loopback100
ip route 10.200.97.0 255.255.255.0 Loopback101
ip route 10.200.98.0 255.255.255.0 Loopback102
ip route 10.200.99.0 255.255.255.0 Loopback103
!

router isis 1
 net 31.ef00.0000.0ab4.0064.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_99 seq 10 permit 10.200.96.0/24
ip prefix-list PL_EXPORT_ALLOWED_99 seq 20 permit 10.200.97.0/24
ip prefix-list PL_EXPORT_ALLOWED_99 seq 30 permit 10.200.98.0/24
ip prefix-list PL_EXPORT_ALLOWED_99 seq 40 permit 10.200.99.0/24
