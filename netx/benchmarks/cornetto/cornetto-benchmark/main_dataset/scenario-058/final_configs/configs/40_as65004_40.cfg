route-map RM_POLICY_IN_40_39 permit 10














 match ip address prefix-list PL_IN_40_39
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_40_39 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_40_39 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_40_0
 ! Block loopback 10.180.0.41/32


route-map RM_POLICY_OUT_40_39 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_40_0
 ! Block link 10.181.0.118/31


route-map RM_POLICY_OUT_40_39 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_40_1
 ! Block link 10.181.0.124/31


route-map RM_POLICY_OUT_40_39 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_40
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_40_39 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_40
 set metric 12
 set as-path prepend 65004 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_40_39 deny 200














 match ip address prefix-list PL_OUT_40_39
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_40_39 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.41
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.65 peer-group RR




 !
 neighbor 10.181.0.124 peer-group EBGP
 neighbor 10.181.0.124 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.65 activate




  neighbor 10.181.0.124 activate
  neighbor 10.181.0.124 route-map RM_POLICY_IN_40_39 in
  neighbor 10.181.0.124 route-map RM_POLICY_OUT_40_39 out





  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

  network 10.200.33.0 mask 255.255.255.0

  network 10.200.34.0 mask 255.255.255.0

