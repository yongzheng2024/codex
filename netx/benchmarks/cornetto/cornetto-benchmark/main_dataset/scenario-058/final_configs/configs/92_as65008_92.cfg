
hostname 92_as65008_92
!
interface Loopback0
 ip address 10.180.0.93 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.90.0/24


 ip address 10.200.90.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.91.0/24


 ip address 10.200.91.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 8_as65008_8 (8)

 ip address 10.181.0.25 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 58_as65002_58 (58)

 ip address 10.181.0.173 255.255.255.254
 mtu 1500
!


ip route 10.200.90.0 255.255.255.0 Loopback100
ip route 10.200.91.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.f000.0000.0ab4.005d.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_92 seq 10 permit 10.200.90.0/24
ip prefix-list PL_EXPORT_ALLOWED_92 seq 20 permit 10.200.91.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_92_0 seq 10 deny 10.181.0.172/31
!

ip prefix-list PL_EXPORT_DENY_LINK_92_1 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LONG_92 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_92_0 seq 10 deny 10.180.0.93/32
!

ip prefix-list PL_IN_92_58 seq 10 permit 10.180.0.59/32
ip prefix-list PL_IN_92_58 seq 20 permit 10.181.0.170/31
ip prefix-list PL_IN_92_58 seq 30 permit 10.181.0.172/31
ip prefix-list PL_IN_92_58 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_92_58 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_92_58 seq 10 permit 10.200.90.0/24
!






route-map RM_POLICY_IN_92_58 permit 10














 match ip address prefix-list PL_IN_92_58
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_92_58 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_92_58 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_92_0
 ! Block loopback 10.180.0.93/32


route-map RM_POLICY_OUT_92_58 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_92_0
 ! Block link 10.181.0.172/31


route-map RM_POLICY_OUT_92_58 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_92_1
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_92_58 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_92
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_92_58 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_92
 set metric 9
 set as-path prepend 65008
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_92_58 deny 200














 match ip address prefix-list PL_OUT_92_58
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_92_58 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.93
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65008
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.30 peer-group RR




 !
 neighbor 10.181.0.172 peer-group EBGP
 neighbor 10.181.0.172 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.30 activate




  neighbor 10.181.0.172 activate
  neighbor 10.181.0.172 route-map RM_POLICY_IN_92_58 in
  neighbor 10.181.0.172 route-map RM_POLICY_OUT_92_58 out





  network 10.200.90.0 mask 255.255.255.0

  network 10.200.91.0 mask 255.255.255.0

 exit-address-family
