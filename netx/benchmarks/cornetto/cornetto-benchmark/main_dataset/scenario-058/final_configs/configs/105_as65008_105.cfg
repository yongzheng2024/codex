
hostname 105_as65008_105
!
interface Loopback0
 ip address 10.180.0.106 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 29_as65008_29 (29)

 ip address 10.181.0.101 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 99_as65007_99 (99)

 ip address 10.181.1.11 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 100_as65008_100 (100)

 ip address 10.181.1.13 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.f000.0000.0ab4.006a.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_105 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_105 seq 20 permit 10.200.1.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_105_0 seq 10 deny 10.181.0.100/31
!

ip prefix-list PL_EXPORT_DENY_LINK_105_1 seq 10 deny 10.181.1.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_105_2 seq 10 deny 10.181.1.12/31
!

ip prefix-list PL_EXPORT_DENY_LONG_105 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_105_0 seq 10 deny 10.180.0.106/32
!

ip prefix-list PL_IN_105_99 seq 10 permit 10.200.98.0/24
ip prefix-list PL_IN_105_99 seq 20 permit 10.200.96.0/24
ip prefix-list PL_IN_105_99 seq 30 permit 10.200.97.0/24
ip prefix-list PL_IN_105_99 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_105_99 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_105_99 seq 10 permit 10.200.1.0/24
ip prefix-list PL_OUT_105_99 seq 20 permit 10.200.0.0/24
!






route-map RM_POLICY_IN_105_99 permit 10














 match ip address prefix-list PL_IN_105_99
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_105_99 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_105_99 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_105_0
 ! Block loopback 10.180.0.106/32


route-map RM_POLICY_OUT_105_99 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_105_0
 ! Block link 10.181.0.100/31


route-map RM_POLICY_OUT_105_99 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_105_1
 ! Block link 10.181.1.10/31


route-map RM_POLICY_OUT_105_99 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_105_2
 ! Block link 10.181.1.12/31


route-map RM_POLICY_OUT_105_99 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_105
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_105_99 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_105
 set metric 19
 set as-path prepend 65008 65008 65008
 set community no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_105_99 deny 200














 match ip address prefix-list PL_OUT_105_99
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_105_99 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.106
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65008
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.101 peer-group RR




 !
 neighbor 10.181.1.10 peer-group EBGP
 neighbor 10.181.1.10 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.101 activate




  neighbor 10.181.1.10 activate
  neighbor 10.181.1.10 route-map RM_POLICY_OUT_105_99 in
  neighbor 10.181.1.10 route-map RM_POLICY_IN_105_99 out





  network 10.200.1.0 mask 255.255.255.0

 exit-address-family
