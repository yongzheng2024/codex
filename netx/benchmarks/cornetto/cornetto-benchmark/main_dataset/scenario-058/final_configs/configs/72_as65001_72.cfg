 match ip address prefix-list PL_EXPORT_DENY_LINK_72_1
 ! Block link 10.181.0.216/31


route-map RM_POLICY_OUT_72_117 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_72
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_72_117 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_72
 set metric 15
 set as-path prepend 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_72_117 deny 200














 match ip address prefix-list PL_OUT_72_117
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_72_117 deny 65000














 ! Deny other outbound routes

