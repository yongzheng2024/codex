!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_91_0 seq 10 deny 10.180.0.92/32
!






route-map RM_POLICY_IN_91_120 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_91_120 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_91_0
 ! Block loopback 10.180.0.92/32


route-map RM_POLICY_OUT_91_120 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_91_0
 ! Block link 10.181.0.250/31


route-map RM_POLICY_OUT_91_120 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_91_1
 ! Block link 10.181.1.4/31


route-map RM_POLICY_OUT_91_120 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_91
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_91_120 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_91
 set metric 24
 set as-path prepend 65005 65005 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_91_120 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.92
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.27 peer-group RR


 !
 neighbor 10.180.0.29 peer-group RR




 !
 neighbor 10.181.1.5 peer-group EBGP
 neighbor 10.181.1.5 remote-as 65009


 !
 address-family ipv4

  neighbor 10.180.0.27 activate


  neighbor 10.180.0.29 activate




  neighbor 10.181.1.5 activate
  neighbor 10.181.1.5 route-map RM_POLICY_IN_91_120 in
  neighbor 10.181.1.5 route-map RM_POLICY_OUT_91_120 out





  network 10.200.86.0 mask 255.255.255.0

  network 10.200.87.0 mask 255.255.255.0

  network 10.200.88.0 mask 255.255.255.0

  network 10.200.89.0 mask 255.255.255.0

 exit-address-family
