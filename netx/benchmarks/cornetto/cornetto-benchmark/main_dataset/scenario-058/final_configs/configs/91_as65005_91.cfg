!


ip prefix-list PL_EXPORT_ALLOWED_91 seq 10 permit 10.200.86.0/24
ip prefix-list PL_EXPORT_ALLOWED_91 seq 20 permit 10.200.87.0/24
ip prefix-list PL_EXPORT_ALLOWED_91 seq 30 permit 10.200.88.0/24
ip prefix-list PL_EXPORT_ALLOWED_91 seq 40 permit 10.200.89.0/24
