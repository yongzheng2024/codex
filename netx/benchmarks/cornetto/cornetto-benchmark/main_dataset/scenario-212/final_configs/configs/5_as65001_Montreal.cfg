route-map RM_POLICY_IN_5_4 permit 10














 match ip address prefix-list PL_IN_5_4
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_5_4 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_5_4 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_5_0
 ! Block loopback 10.180.0.6/32


route-map RM_POLICY_OUT_5_4 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_0
 ! Block link 10.181.0.28/31


