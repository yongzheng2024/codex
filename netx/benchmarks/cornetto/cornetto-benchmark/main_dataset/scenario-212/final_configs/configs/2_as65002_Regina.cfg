
hostname 2_as65002_Regina
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 3_as65002_Winnipeg (3)

 ip address 10.181.0.18 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 22_as65002_Calgary (22)

 ip address 10.181.0.20 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0



network 10.181.0.18 0.0.0.1 area 0
network 10.181.0.20 0.0.0.1 area 0
!








router bgp 65002
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.23 peer-group RR


 !
 neighbor 10.180.0.4 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.23 activate


  neighbor 10.180.0.4 activate







 exit-address-family
