
hostname 13_as65005_Amerique-du-Nord-et-Amerique-du-Sud
!
interface Loopback0
 ip address 10.180.0.14 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 1_as65005_Chicago (1)

 ip address 10.181.0.9 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.14
 passive-interface Loopback0
 network 10.180.0.14 0.0.0.0 area 0



network 10.181.0.8 0.0.0.1 area 0
!








router bgp 65005
 bgp router-id 10.180.0.14
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.14


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0



 !
 neighbor 10.180.0.2 peer-group RR



 !
 neighbor 10.180.0.19 peer-group IBGP



 !
 address-family ipv4

  neighbor 10.180.0.2 activate



  neighbor 10.180.0.19 activate
  neighbor 10.180.0.19 next-hop-self






 exit-address-family
