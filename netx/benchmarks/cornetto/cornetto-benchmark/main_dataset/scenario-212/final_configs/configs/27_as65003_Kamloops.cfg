
hostname 27_as65003_Kamloops
!
interface Loopback0
 ip address 10.180.0.28 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!



ip access-list extended ACL_27_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.28 any
 20 permit ip host 10.181.0.63 any
 30 permit ip host 10.181.0.72 any
 40 permit ip host 10.181.0.74 any
 50 permit ip 10.181.0.72 0.0.0.1 any
 60 permit ip 10.181.0.74 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 22_as65002_Calgary (22)

 ip address 10.181.0.63 255.255.255.254

 ip access-group ACL_27_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 28_as65003_Kelowna (28)

 ip address 10.181.0.72 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 29_as65003_Vancouver (29)

 ip address 10.181.0.74 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.11.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.28
 passive-interface Loopback0
 network 10.180.0.28 0.0.0.0 area 0



network 10.181.0.72 0.0.0.1 area 0
network 10.181.0.74 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_27 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_27 seq 20 permit 10.200.11.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_27_0 seq 10 deny 10.181.0.62/31
!

ip prefix-list PL_EXPORT_DENY_LINK_27_1 seq 10 deny 10.181.0.72/31
!

ip prefix-list PL_EXPORT_DENY_LINK_27_2 seq 10 deny 10.181.0.74/31
!

ip prefix-list PL_EXPORT_DENY_LONG_27 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_27_0 seq 10 deny 10.180.0.28/32
!






route-map RM_POLICY_OUT_27_22 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_27_0
 ! Block loopback 10.180.0.28/32


route-map RM_POLICY_OUT_27_22 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_0
 ! Block link 10.181.0.62/31


route-map RM_POLICY_OUT_27_22 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_1
 ! Block link 10.181.0.72/31


route-map RM_POLICY_OUT_27_22 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_2
 ! Block link 10.181.0.74/31


route-map RM_POLICY_OUT_27_22 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_27
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_27_22 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_27
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_27_22 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.28
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.28


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.32 peer-group RR



 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.29 peer-group IBGP


 !
 neighbor 10.180.0.31 peer-group IBGP



 !
 neighbor 10.181.0.62 peer-group EBGP
 neighbor 10.181.0.62 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.32 activate



  neighbor 10.180.0.13 activate
  neighbor 10.180.0.13 next-hop-self


  neighbor 10.180.0.29 activate
  neighbor 10.180.0.29 next-hop-self


  neighbor 10.180.0.31 activate
  neighbor 10.180.0.31 next-hop-self



  neighbor 10.181.0.62 activate
  neighbor 10.181.0.62 route-map RM_POLICY_OUT_27_22 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

 exit-address-family
