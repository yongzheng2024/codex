
hostname 28_as65008_Longyearbyen-Skole
!
interface Loopback0
 ip address 10.180.0.29 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 33_as65008_UNIS-Svalbard (33)

 ip address 10.181.0.112 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


router ospf 1
 router-id 10.180.0.29
 passive-interface Loopback0
 network 10.180.0.29 0.0.0.0 area 0



network 10.181.0.112 0.0.0.1 area 0
!








router bgp 65008
 bgp router-id 10.180.0.29
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.29


 !
 neighbor RR peer-group
 neighbor RR remote-as 65008
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65008
 neighbor IBGP update-source Loopback0



 !
 neighbor 10.180.0.29 peer-group RR



 !
 neighbor 10.180.0.63 peer-group IBGP



 !
 address-family ipv4

  neighbor 10.180.0.29 activate



  neighbor 10.180.0.63 activate
  neighbor 10.180.0.63 next-hop-self






 exit-address-family
