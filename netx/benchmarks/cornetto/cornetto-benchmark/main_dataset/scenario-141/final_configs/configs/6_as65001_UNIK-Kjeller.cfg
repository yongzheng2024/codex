ip prefix-list PL_EXPORT_ALLOWED_6 seq 10 permit 10.200.60.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 20 permit 10.200.61.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 30 permit 10.200.62.0/24
