!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_6_0 seq 10 deny 10.180.0.7/32
!






route-map RM_POLICY_IN_6_7 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_6_7 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_6_0
 ! Block loopback 10.180.0.7/32


route-map RM_POLICY_OUT_6_7 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_6_7 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_1
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_6_7 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_2
 ! Block link 10.181.0.42/31


route-map RM_POLICY_OUT_6_7 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_6
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_6_7 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_6
 set metric 7
 set as-path prepend 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_6_7 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.7
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.4 peer-group RR




 !
 neighbor 10.181.0.43 peer-group EBGP
 neighbor 10.181.0.43 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.4 activate




  neighbor 10.181.0.43 activate
  neighbor 10.181.0.43 route-map RM_POLICY_IN_6_7 in
  neighbor 10.181.0.43 route-map RM_POLICY_OUT_6_7 out





  network 10.200.60.0 mask 255.255.255.0

  network 10.200.61.0 mask 255.255.255.0

  network 10.200.62.0 mask 255.255.255.0

 exit-address-family
