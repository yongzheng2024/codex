!


ip prefix-list PL_EXPORT_ALLOWED_50 seq 10 permit 10.200.55.0/24
ip prefix-list PL_EXPORT_ALLOWED_50 seq 20 permit 10.200.56.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_50_0 seq 10 deny 10.181.0.170/31
!

