!

ip prefix-list PL_EXPORT_DENY_LONG_50 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_50_0 seq 10 deny 10.180.0.51/32
!




ip community-list standard CL_COMM_50_5 permit no-export
!





route-map RM_POLICY_IN_50_5 permit 5














 match community CL_COMM_50_5
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_50_5 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_50_5 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_50_5 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_50_0
 ! Block loopback 10.180.0.51/32


route-map RM_POLICY_OUT_50_5 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_50_0
 ! Block link 10.181.0.170/31


route-map RM_POLICY_OUT_50_5 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_50_1
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_50_5 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_50
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_50_5 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_50
 set metric 23
 set as-path prepend 65006 65006
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_50_5 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.51
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



