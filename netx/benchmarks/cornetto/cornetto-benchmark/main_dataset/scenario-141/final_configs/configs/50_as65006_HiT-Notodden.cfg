 ip address 10.200.55.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.56.0/24


 ip address 10.200.56.1 255.255.255.0
!



ip access-list extended ACL_50_GigabitEthernet0_0
 10 permit ip host 10.180.0.6 any
 20 permit ip host 10.181.0.36 any
 30 permit ip host 10.181.0.37 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
