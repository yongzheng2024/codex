 address-family ipv4


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.21 activate


  neighbor 10.180.0.22 activate


  neighbor 10.180.0.23 activate


  neighbor 10.180.0.50 activate



  neighbor 10.181.0.36 activate
  neighbor 10.181.0.36 route-map RM_POLICY_IN_50_5 in
  neighbor 10.181.0.36 route-map RM_POLICY_OUT_50_5 out





  network 10.200.55.0 mask 255.255.255.0

  network 10.200.56.0 mask 255.255.255.0

 exit-address-family
