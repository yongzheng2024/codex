ip community-list standard CL_COMM_56_11 permit no-advertise
!





route-map RM_POLICY_IN_56_11 permit 5














 match community CL_COMM_56_11
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_56_11 permit 10














 match ip address prefix-list PL_IN_56_11
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_56_11 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_56_11 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_56_11 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_56_0
 ! Block loopback 10.180.0.57/32


route-map RM_POLICY_OUT_56_11 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_56_11 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_1
 ! Block link 10.181.0.176/31


route-map RM_POLICY_OUT_56_11 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_2
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_56_11 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_56
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_56_11 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_56
 set community 65000:100 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_56_11 deny 200














 match ip address prefix-list PL_OUT_56_11
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_56_11 deny 65000














 ! Deny other outbound routes

!







