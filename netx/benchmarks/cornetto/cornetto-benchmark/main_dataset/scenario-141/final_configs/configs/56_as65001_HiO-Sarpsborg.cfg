 bgp router-id 10.180.0.57
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.4 peer-group RR




 !
 neighbor 10.181.0.60 peer-group EBGP
 neighbor 10.181.0.60 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.4 activate




  neighbor 10.181.0.60 activate
  neighbor 10.181.0.60 route-map RM_POLICY_IN_56_11 in
  neighbor 10.181.0.60 route-map RM_POLICY_OUT_56_11 out





  network 10.200.57.0 mask 255.255.255.0

  network 10.200.58.0 mask 255.255.255.0

  network 10.200.59.0 mask 255.255.255.0

