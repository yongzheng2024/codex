
hostname 5_as65005_HiBU-Kongsberg
!
interface Loopback0
 ip address 10.180.0.6 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.53.0/24


 ip address 10.200.53.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.54.0/24


 ip address 10.200.54.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 10_as65005_HiBU-Drammen (10)

 ip address 10.181.0.34 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 50_as65006_HiT-Notodden (50)

 ip address 10.181.0.36 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 7_as65005_HiBu-Honefoss (7)

 ip address 10.181.0.38 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.53.0 255.255.255.0 Loopback100
ip route 10.200.54.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.ed00.0000.0ab4.0006.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_5 seq 10 permit 10.200.53.0/24
ip prefix-list PL_EXPORT_ALLOWED_5 seq 20 permit 10.200.54.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_5_0 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_5_1 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LINK_5_2 seq 10 deny 10.181.0.38/31
!

ip prefix-list PL_EXPORT_DENY_LONG_5 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_5_0 seq 10 deny 10.180.0.6/32
!

ip prefix-list PL_IN_5_50 seq 10 permit 10.200.55.0/24
ip prefix-list PL_IN_5_50 seq 20 permit 10.200.56.0/24
ip prefix-list PL_IN_5_50 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_5_50 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_5_50 seq 10 permit 10.200.54.0/24
!




ip community-list standard CL_COMM_5_50 permit 65535:65282
!





route-map RM_POLICY_IN_5_50 permit 5














 match community CL_COMM_5_50
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_5_50 permit 10














 match ip address prefix-list PL_IN_5_50
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_5_50 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_5_50 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_5_50 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_5_0
 ! Block loopback 10.180.0.6/32


route-map RM_POLICY_OUT_5_50 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_0
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_5_50 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_1
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_5_50 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_2
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_5_50 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_5
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_5_50 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_5
 set community no-advertise no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_5_50 deny 200














 match ip address prefix-list PL_OUT_5_50
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_5_50 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.6
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.6


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.12 peer-group RR



 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.55 peer-group IBGP



 !
 neighbor 10.181.0.37 peer-group EBGP
 neighbor 10.181.0.37 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.12 activate



  neighbor 10.180.0.5 activate
  neighbor 10.180.0.5 next-hop-self


  neighbor 10.180.0.55 activate
  neighbor 10.180.0.55 next-hop-self



  neighbor 10.181.0.37 activate
  neighbor 10.181.0.37 route-map RM_POLICY_IN_5_50 in
  neighbor 10.181.0.37 route-map RM_POLICY_OUT_5_50 out





  network 10.200.53.0 mask 255.255.255.0

  network 10.200.54.0 mask 255.255.255.0

 exit-address-family
