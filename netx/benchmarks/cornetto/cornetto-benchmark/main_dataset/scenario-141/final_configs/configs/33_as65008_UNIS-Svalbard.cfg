router ospf 1
 router-id 10.180.0.34
 passive-interface Loopback0
 network 10.180.0.29 0.0.0.0 area 0



network 10.181.0.112 0.0.0.1 area 0
network 10.181.0.126 0.0.0.1 area 0
network 10.181.0.128 0.0.0.1 area 0
network 10.181.0.130 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_33 seq 10 permit 10.200.31.0/24
ip prefix-list PL_EXPORT_ALLOWED_33 seq 20 permit 10.200.32.0/24
ip prefix-list PL_EXPORT_ALLOWED_33 seq 30 permit 10.200.33.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_33_0 seq 10 deny 10.181.0.112/31
!

ip prefix-list PL_EXPORT_DENY_LINK_33_1 seq 10 deny 10.181.0.114/31
!

ip prefix-list PL_EXPORT_DENY_LINK_33_2 seq 10 deny 10.181.0.126/31
!

ip prefix-list PL_EXPORT_DENY_LINK_33_3 seq 10 deny 10.181.0.128/31
!

ip prefix-list PL_EXPORT_DENY_LINK_33_4 seq 10 deny 10.181.0.130/31
!

ip prefix-list PL_EXPORT_DENY_LONG_33 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_33_0 seq 10 deny 10.180.0.34/32
!




ip community-list standard CL_COMM_33_29 permit no-advertise
ip community-list standard CL_COMM_33_29 permit no-export
!





route-map RM_POLICY_IN_33_29 permit 5














 match community CL_COMM_33_29
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_33_29 permit 10














 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_33_29 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_33_29 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_33_0
 ! Block loopback 10.180.0.34/32


route-map RM_POLICY_OUT_33_29 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_0
 ! Block link 10.181.0.112/31


route-map RM_POLICY_OUT_33_29 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_1
 ! Block link 10.181.0.114/31


route-map RM_POLICY_OUT_33_29 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_2
 ! Block link 10.181.0.126/31


route-map RM_POLICY_OUT_33_29 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_3
 ! Block link 10.181.0.128/31


route-map RM_POLICY_OUT_33_29 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_33
 set metric 20
 set as-path prepend 65008 65008 65008
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_33_29 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_4
 ! Block link 10.181.0.130/31


route-map RM_POLICY_OUT_33_29 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_33
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_33_29 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.34
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.34


 !
 neighbor RR peer-group
 neighbor RR remote-as 65008
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65008
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.29 peer-group RR



 !
 neighbor 10.180.0.56 peer-group IBGP


 !
 neighbor 10.180.0.61 peer-group IBGP


 !
 neighbor 10.180.0.63 peer-group IBGP



 !
 neighbor 10.181.0.114 peer-group EBGP
 neighbor 10.181.0.114 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.29 activate



  neighbor 10.180.0.56 activate
  neighbor 10.180.0.56 next-hop-self


  neighbor 10.180.0.61 activate
  neighbor 10.180.0.61 next-hop-self


  neighbor 10.180.0.63 activate
  neighbor 10.180.0.63 next-hop-self



  neighbor 10.181.0.114 activate
  neighbor 10.181.0.114 route-map RM_POLICY_IN_33_29 in
  neighbor 10.181.0.114 route-map RM_POLICY_OUT_33_29 out





  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

  network 10.200.33.0 mask 255.255.255.0

 exit-address-family
