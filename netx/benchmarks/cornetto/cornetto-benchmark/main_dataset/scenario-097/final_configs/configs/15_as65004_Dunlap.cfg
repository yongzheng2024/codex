
hostname 15_as65004_Dunlap
!
interface Loopback0
 ip address 10.180.0.16 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.13.0/24


 ip address 10.200.13.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.14.0/24


 ip address 10.200.14.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.15.0/24


 ip address 10.200.15.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 14_as65004_Chattanooga (14)

 ip address 10.181.0.57 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 16_as65002_Spencer (16)

 ip address 10.181.0.60 255.255.255.254
 mtu 1500
!


ip route 10.200.13.0 255.255.255.0 Loopback100
ip route 10.200.14.0 255.255.255.0 Loopback101
ip route 10.200.15.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.16
 passive-interface Loopback0
 network 10.180.0.16 0.0.0.0 area 0



network 10.181.0.56 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_15 seq 10 permit 10.200.13.0/24
ip prefix-list PL_EXPORT_ALLOWED_15 seq 20 permit 10.200.14.0/24
ip prefix-list PL_EXPORT_ALLOWED_15 seq 30 permit 10.200.15.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_15_0 seq 10 deny 10.181.0.56/31
!

ip prefix-list PL_EXPORT_DENY_LINK_15_1 seq 10 deny 10.181.0.60/31
!

ip prefix-list PL_EXPORT_DENY_LONG_15 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_15_0 seq 10 deny 10.180.0.16/32
!






route-map RM_POLICY_IN_15_16 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_15_16 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_15_0
 ! Block loopback 10.180.0.16/32


route-map RM_POLICY_OUT_15_16 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_0
 ! Block link 10.181.0.56/31


route-map RM_POLICY_OUT_15_16 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_1
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_15_16 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_15
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_15_16 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_15
 set metric 11
 set as-path prepend 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_15_16 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.16
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP



 !
 neighbor 10.181.0.61 peer-group EBGP
 neighbor 10.181.0.61 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.13 activate


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.21 activate



  neighbor 10.181.0.61 activate
  neighbor 10.181.0.61 route-map RM_POLICY_IN_15_16 in
  neighbor 10.181.0.61 route-map RM_POLICY_OUT_15_16 out





  network 10.200.13.0 mask 255.255.255.0

  network 10.200.14.0 mask 255.255.255.0

  network 10.200.15.0 mask 255.255.255.0

 exit-address-family
