 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.1 peer-group RR



 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.34 peer-group IBGP


 !
 neighbor 10.180.0.35 peer-group IBGP


 !
 neighbor 10.180.0.36 peer-group IBGP


 !
 neighbor 10.180.0.37 peer-group IBGP



 !
 neighbor 10.181.0.53 peer-group EBGP
 neighbor 10.181.0.53 remote-as 65006


