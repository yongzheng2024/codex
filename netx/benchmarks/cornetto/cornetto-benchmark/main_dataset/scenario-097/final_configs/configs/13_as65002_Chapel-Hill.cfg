!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_13_0 seq 10 deny 10.180.0.14/32
!






route-map RM_POLICY_IN_13_26 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_13_26 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_13_0
 ! Block loopback 10.180.0.14/32


route-map RM_POLICY_OUT_13_26 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_0
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_13_26 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_1
 ! Block link 10.181.0.48/31


route-map RM_POLICY_OUT_13_26 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_2
 ! Block link 10.181.0.50/31


route-map RM_POLICY_OUT_13_26 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_3
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_13_26 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_13
 set metric 7
 set as-path prepend 65002 65002
 set community 65000:100 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_13_26 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_13
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_13_26 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.14
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.14


 !
