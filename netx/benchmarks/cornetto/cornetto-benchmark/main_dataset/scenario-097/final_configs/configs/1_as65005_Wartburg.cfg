
hostname 1_as65005_Wartburg
!
interface Loopback0
 ip address 10.180.0.2 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!



ip access-list extended ACL_1_GigabitEthernet0_0
 10 permit ip host 10.180.0.1 any
 20 permit ip host 10.181.0.0 any
 30 permit ip host 10.181.0.1 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 0_as65002_Gainesboro (0)

 ip address 10.181.0.1 255.255.255.254

 ip access-group ACL_1_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 6_as65005_Knoxville (6)

 ip address 10.181.0.12 255.255.255.254
 mtu 1500
!


ip route 10.200.2.0 255.255.255.0 Loopback100
ip route 10.200.3.0 255.255.255.0 Loopback101
ip route 10.200.4.0 255.255.255.0 Loopback102
!

router isis 1
 net 31.ed00.0000.0ab4.0002.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_1 seq 10 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 20 permit 10.200.3.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 30 permit 10.200.4.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_1_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_1_1 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LONG_1 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_1_0 seq 10 deny 10.180.0.2/32
!






route-map RM_POLICY_IN_1_0 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_1_0 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_1_0
 ! Block loopback 10.180.0.2/32


route-map RM_POLICY_OUT_1_0 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_1_0 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_1
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_1_0 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_1
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_1_0 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_1
 set metric 8
 set as-path prepend 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_1_0 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP



 !
 neighbor 10.181.0.0 peer-group EBGP
 neighbor 10.181.0.0 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.8 activate


  neighbor 10.180.0.9 activate



  neighbor 10.181.0.0 activate
  neighbor 10.181.0.0 route-map RM_POLICY_OUT_1_0 out





  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

  network 10.200.4.0 mask 255.255.255.0

 exit-address-family
