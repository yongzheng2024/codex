route-map RM_POLICY_IN_26_13 permit 5














 match community CL_COMM_26_13
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_26_13 permit 10














 match ip address prefix-list PL_IN_26_13
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_26_13 deny 20














