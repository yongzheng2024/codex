route-map RM_POLICY_OUT_26_13 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_26_0
 ! Block loopback 10.180.0.27/32


route-map RM_POLICY_OUT_26_13 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_0
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_26_13 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_1
 ! Block link 10.181.0.74/31


route-map RM_POLICY_OUT_26_13 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_2
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_26_13 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_26
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_26_13 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_26
 set community 65000:200 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_26_13 deny 200














 match ip address prefix-list PL_OUT_26_13
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_26_13 deny 65000














 ! Deny other outbound routes

