
hostname 3_as65007_Lafayette
!
interface Loopback0
 ip address 10.180.0.4 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.41.0/24


 ip address 10.200.41.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.42.0/24


 ip address 10.200.42.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.43.0/24


 ip address 10.200.43.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 0_as65002_Gainesboro (0)

 ip address 10.181.0.3 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 2_as65007_Scottsville (2)

 ip address 10.181.0.19 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.41.0 255.255.255.0 Loopback100
ip route 10.200.42.0 255.255.255.0 Loopback101
ip route 10.200.43.0 255.255.255.0 Loopback102
!

router isis 1
 net 31.ef00.0000.0ab4.0004.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_3 seq 10 permit 10.200.41.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 20 permit 10.200.42.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 30 permit 10.200.43.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_3_0 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_1 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LONG_3 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_3_0 seq 10 deny 10.180.0.4/32
!






route-map RM_POLICY_IN_3_0 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_3_0 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_0 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_3_0 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_3_0 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_0 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_3
 set metric 7
 set as-path prepend 65007 65007
 ! Outbound policy baseline


route-map RM_POLICY_OUT_3_0 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65007
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.42 peer-group IBGP


 !
 neighbor 10.180.0.43 peer-group IBGP


 !
 neighbor 10.180.0.51 peer-group IBGP



 !
 neighbor 10.181.0.2 peer-group EBGP
 neighbor 10.181.0.2 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.3 activate


  neighbor 10.180.0.42 activate


  neighbor 10.180.0.43 activate


  neighbor 10.180.0.51 activate



  neighbor 10.181.0.2 activate
  neighbor 10.181.0.2 route-map RM_POLICY_IN_3_0 in
  neighbor 10.181.0.2 route-map RM_POLICY_OUT_3_0 out





  network 10.200.41.0 mask 255.255.255.0

  network 10.200.42.0 mask 255.255.255.0

  network 10.200.43.0 mask 255.255.255.0

 exit-address-family
