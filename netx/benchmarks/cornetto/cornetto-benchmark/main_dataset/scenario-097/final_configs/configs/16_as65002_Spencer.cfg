ip route 10.200.16.0 255.255.255.0 Loopback100
ip route 10.200.17.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.17
 passive-interface Loopback0
 network 10.180.0.17 0.0.0.0 area 0



network 10.181.0.46 0.0.0.1 area 0
network 10.181.0.62 0.0.0.1 area 0
network 10.181.0.64 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_16 seq 10 permit 10.200.16.0/24
ip prefix-list PL_EXPORT_ALLOWED_16 seq 20 permit 10.200.17.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_16_0 seq 10 deny 10.181.0.46/31
!

ip prefix-list PL_EXPORT_DENY_LINK_16_1 seq 10 deny 10.181.0.60/31
!

ip prefix-list PL_EXPORT_DENY_LINK_16_2 seq 10 deny 10.181.0.62/31
!

ip prefix-list PL_EXPORT_DENY_LINK_16_3 seq 10 deny 10.181.0.64/31
!

ip prefix-list PL_EXPORT_DENY_LONG_16 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_16_0 seq 10 deny 10.180.0.17/32
!




ip community-list standard CL_COMM_16_15 permit 65535:65282
!





route-map RM_POLICY_IN_16_15 permit 5














 match community CL_COMM_16_15
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_16_15 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_16_15 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_16_15 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_16_0
 ! Block loopback 10.180.0.17/32


route-map RM_POLICY_OUT_16_15 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_0
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_16_15 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_1
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_16_15 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_2
 ! Block link 10.181.0.62/31


route-map RM_POLICY_OUT_16_15 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_3
 ! Block link 10.181.0.64/31


route-map RM_POLICY_OUT_16_15 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_16
 set metric 20
 set as-path prepend 65002
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_16_15 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_16
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_16_15 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.17
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.1 peer-group RR


 !
 neighbor 10.180.0.14 peer-group RR




 !
 neighbor 10.181.0.60 peer-group EBGP
 neighbor 10.181.0.60 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.1 activate


  neighbor 10.180.0.14 activate




  neighbor 10.181.0.60 activate
  neighbor 10.181.0.60 route-map RM_POLICY_IN_16_15 in
  neighbor 10.181.0.60 route-map RM_POLICY_OUT_16_15 out





  network 10.200.16.0 mask 255.255.255.0

  network 10.200.17.0 mask 255.255.255.0

 exit-address-family
