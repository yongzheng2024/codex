 ip address 10.181.0.62 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/3
 description to 36_as65002_Smithville (36)

