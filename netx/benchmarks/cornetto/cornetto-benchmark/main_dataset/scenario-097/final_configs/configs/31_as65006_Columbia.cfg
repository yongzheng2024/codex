 match ip address prefix-list PL_EXPORT_DENY_LONG_31
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_31_33 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_31
 set metric 19
 set as-path prepend 65006 65006
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_31_33 deny 200














 match ip address prefix-list PL_OUT_31_33
 ! Block selected outbound prefixes


