 neighbor 10.181.0.131 peer-group EBGP
 neighbor 10.181.0.131 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.31 activate


  neighbor 10.180.0.32 activate


  neighbor 10.180.0.33 activate



  neighbor 10.181.0.131 activate
  neighbor 10.181.0.131 route-map RM_POLICY_IN_34_35 in
  neighbor 10.181.0.131 route-map RM_POLICY_OUT_34_35 out





  network 10.200.19.0 mask 255.255.255.0

