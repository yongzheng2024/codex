 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.31 peer-group IBGP


 !
 neighbor 10.180.0.32 peer-group IBGP


 !
 neighbor 10.180.0.33 peer-group IBGP



