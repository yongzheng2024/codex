ip prefix-list PL_OUT_34_35 seq 10 permit 10.200.19.0/24
ip prefix-list PL_OUT_34_35 seq 20 permit 10.200.20.0/24
!






route-map RM_POLICY_IN_34_35 permit 10














 match ip address prefix-list PL_IN_34_35
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_34_35 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_34_35 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_34_0
 ! Block loopback 10.180.0.35/32


route-map RM_POLICY_OUT_34_35 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_0
 ! Block link 10.181.0.122/31


route-map RM_POLICY_OUT_34_35 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_1
 ! Block link 10.181.0.130/31


route-map RM_POLICY_OUT_34_35 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_34
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_34_35 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_34
 set metric 16
 set as-path prepend 65006 65006
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_34_35 deny 200














 match ip address prefix-list PL_OUT_34_35
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_34_35 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.35
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



