router ospf 1
 router-id 10.180.0.35
 passive-interface Loopback0
 network 10.180.0.35 0.0.0.0 area 0



network 10.181.0.122 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_34 seq 10 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 20 permit 10.200.20.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 30 permit 10.200.21.0/24
