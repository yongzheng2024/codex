
hostname 16_as65003_16
!
interface Loopback0
 ip address 10.180.0.17 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 52_as65003_52 (52)

 ip address 10.181.0.74 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 30_as65004_30 (30)

 ip address 10.181.0.76 255.255.255.254
 mtu 1500
!


ip route 10.200.6.0 255.255.255.0 Loopback100
ip route 10.200.7.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.17
 passive-interface Loopback0
 network 10.180.0.17 0.0.0.0 area 0










 redistribute bgp 65003 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_16

network 10.181.0.74 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 10 permit 10.200.0.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 20 permit 10.200.1.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 30 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 40 permit 10.200.3.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 50 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 60 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 70 permit 10.200.31.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 80 permit 10.200.32.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_16 seq 10 permit 10.180.0.17/32
ip prefix-list PL_BGP_TO_OSPF_DENY_16 seq 20 permit 10.181.0.74/31
ip prefix-list PL_BGP_TO_OSPF_DENY_16 seq 30 permit 10.181.0.76/31
!

ip prefix-list PL_EXPORT_ALLOWED_16 seq 10 permit 10.200.6.0/24
ip prefix-list PL_EXPORT_ALLOWED_16 seq 20 permit 10.200.7.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_16_0 seq 10 deny 10.181.0.74/31
!

ip prefix-list PL_EXPORT_DENY_LINK_16_1 seq 10 deny 10.181.0.76/31
!

ip prefix-list PL_EXPORT_DENY_LONG_16 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_16_0 seq 10 deny 10.180.0.17/32
!






route-map RM_BGP_TO_OSPF_16 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_16 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_16
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_16 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_16
 set tag 65010

!


route-map RM_POLICY_IN_16_30 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_16_30 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_16_0
 ! Block loopback 10.180.0.17/32


route-map RM_POLICY_OUT_16_30 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_0
 ! Block link 10.181.0.74/31


route-map RM_POLICY_OUT_16_30 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_1
 ! Block link 10.181.0.76/31


route-map RM_POLICY_OUT_16_30 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_16
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_16_30 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_16
 set metric 7
 set as-path prepend 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_16_30 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.17
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.53 peer-group RR




 !
 neighbor 10.181.0.77 peer-group EBGP
 neighbor 10.181.0.77 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.53 activate




  neighbor 10.181.0.77 activate
  neighbor 10.181.0.77 route-map RM_POLICY_IN_16_30 in
  neighbor 10.181.0.77 route-map RM_POLICY_OUT_16_30 out





  network 10.200.6.0 mask 255.255.255.0

  network 10.200.7.0 mask 255.255.255.0

 exit-address-family
