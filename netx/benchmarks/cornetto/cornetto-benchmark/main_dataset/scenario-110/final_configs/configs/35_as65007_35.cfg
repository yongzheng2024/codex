router ospf 1
 router-id 10.180.0.36
 passive-interface Loopback0
 network 10.180.0.36 0.0.0.0 area 0



network 10.181.0.134 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_35 seq 10 permit 10.200.25.0/24
ip prefix-list PL_EXPORT_ALLOWED_35 seq 20 permit 10.200.26.0/24
ip prefix-list PL_EXPORT_ALLOWED_35 seq 30 permit 10.200.27.0/24
