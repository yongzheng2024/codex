ip access-list extended ACL_35_GigabitEthernet0_0
 10 permit ip host 10.180.0.34 any
 20 permit ip host 10.181.0.120 any
 30 permit ip host 10.181.0.121 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 33_as65003_33 (33)

 ip address 10.181.0.121 255.255.255.254

 ip access-group ACL_35_GigabitEthernet0_0 in
