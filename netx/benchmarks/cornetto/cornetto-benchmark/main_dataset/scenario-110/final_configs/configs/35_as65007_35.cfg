 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP


 !
 neighbor 10.180.0.37 peer-group IBGP


 !
 neighbor 10.180.0.51 peer-group IBGP


 !
 neighbor 10.180.0.56 peer-group IBGP



 !
 neighbor 10.181.0.120 peer-group EBGP
 neighbor 10.181.0.120 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.13 activate


  neighbor 10.180.0.27 activate


  neighbor 10.180.0.28 activate


  neighbor 10.180.0.37 activate


  neighbor 10.180.0.51 activate


  neighbor 10.180.0.56 activate



  neighbor 10.181.0.120 activate
  neighbor 10.181.0.120 route-map RM_POLICY_IN_35_33 in
  neighbor 10.181.0.120 route-map RM_POLICY_OUT_35_33 out





  network 10.200.25.0 mask 255.255.255.0

