ip prefix-list PL_EXPORT_DENY_LINK_35_1 seq 10 deny 10.181.0.134/31
!

ip prefix-list PL_EXPORT_DENY_LONG_35 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_35_0 seq 10 deny 10.180.0.36/32
!




ip community-list standard CL_COMM_35_33 permit no-advertise
ip community-list standard CL_COMM_35_33 permit no-export
!





route-map RM_POLICY_IN_35_33 permit 5














 match community CL_COMM_35_33
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_35_33 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_35_33 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_35_33 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_35_0
 ! Block loopback 10.180.0.36/32


route-map RM_POLICY_OUT_35_33 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_35_0
 ! Block link 10.181.0.120/31


route-map RM_POLICY_OUT_35_33 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_35_1
 ! Block link 10.181.0.134/31


route-map RM_POLICY_OUT_35_33 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_35
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_35_33 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_35
 set metric 24
 set as-path prepend 65007 65007
 set community no-advertise no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_35_33 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.36
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
