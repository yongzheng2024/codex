
hostname 140_as65002_Metter
!
interface Loopback0
 ip address 10.180.0.141 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.35.0/24


 ip address 10.200.35.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.36.0/24


 ip address 10.200.36.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.37.0/24


 ip address 10.200.37.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.38.0/24


 ip address 10.200.38.1 255.255.255.0
!



ip access-list extended ACL_140_GigabitEthernet0_1
 10 permit ip host 10.180.0.142 any
 20 permit ip host 10.181.1.96 any
 30 permit ip host 10.181.1.97 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 192.0.2.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 139_as65002_Pembroke (139)

 ip address 10.181.1.95 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 141_as65001_Rentz (141)

 ip address 10.181.1.96 255.255.255.254

 ip access-group ACL_140_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.35.0 255.255.255.0 Loopback100
ip route 10.200.36.0 255.255.255.0 Loopback101
ip route 10.200.37.0 255.255.255.0 Loopback102
ip route 10.200.38.0 255.255.255.0 Loopback103
!

router isis 1
 net 31.ea01.0000.0ab4.008d.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_140 seq 10 permit 10.200.35.0/24
ip prefix-list PL_EXPORT_ALLOWED_140 seq 20 permit 10.200.36.0/24
ip prefix-list PL_EXPORT_ALLOWED_140 seq 30 permit 10.200.37.0/24
ip prefix-list PL_EXPORT_ALLOWED_140 seq 40 permit 10.200.38.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_140_0 seq 10 deny 10.181.1.94/31
!

ip prefix-list PL_EXPORT_DENY_LINK_140_1 seq 10 deny 10.181.1.96/31
!

ip prefix-list PL_EXPORT_DENY_LONG_140 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_140_0 seq 10 deny 10.180.0.141/32
!






route-map RM_POLICY_IN_140_141 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_140_141 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_140_0
 ! Block loopback 10.180.0.141/32


route-map RM_POLICY_OUT_140_141 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_140_0
 ! Block link 10.181.1.94/31


route-map RM_POLICY_OUT_140_141 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_140_1
 ! Block link 10.181.1.96/31


route-map RM_POLICY_OUT_140_141 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_140
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_140_141 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_140
 set metric 22
 set as-path prepend 65002 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_140_141 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.141
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.8 peer-group RR


 !
 neighbor 10.180.0.10 peer-group RR




 !
 neighbor 10.181.1.97 peer-group EBGP
 neighbor 10.181.1.97 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.8 activate


  neighbor 10.180.0.10 activate




  neighbor 10.181.1.97 activate
  neighbor 10.181.1.97 route-map RM_POLICY_IN_140_141 in
  neighbor 10.181.1.97 route-map RM_POLICY_OUT_140_141 out





  network 10.200.35.0 mask 255.255.255.0

  network 10.200.36.0 mask 255.255.255.0

  network 10.200.37.0 mask 255.255.255.0

  network 10.200.38.0 mask 255.255.255.0

 exit-address-family
