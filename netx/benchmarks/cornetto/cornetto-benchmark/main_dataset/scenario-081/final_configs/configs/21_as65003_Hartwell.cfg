
hostname 21_as65003_Hartwell
!
interface Loopback0
 ip address 10.180.0.22 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.54.0/24


 ip address 10.200.54.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.55.0/24


 ip address 10.200.55.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.56.0/24


 ip address 10.200.56.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 9_as65002_Augusta (9)

 ip address 10.181.0.33 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 20_as65003_Athens (20)

 ip address 10.181.0.65 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.54.0 255.255.255.0 Loopback100
ip route 10.200.55.0 255.255.255.0 Loopback101
ip route 10.200.56.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.22
 passive-interface Loopback0
 network 10.180.0.22 0.0.0.0 area 0



network 10.181.0.64 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_21 seq 10 permit 10.200.54.0/24
ip prefix-list PL_EXPORT_ALLOWED_21 seq 20 permit 10.200.55.0/24
ip prefix-list PL_EXPORT_ALLOWED_21 seq 30 permit 10.200.56.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_21_0 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LINK_21_1 seq 10 deny 10.181.0.64/31
!

ip prefix-list PL_EXPORT_DENY_LONG_21 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_21_0 seq 10 deny 10.180.0.22/32
!




ip community-list standard CL_COMM_21_9 permit no-export
!





route-map RM_POLICY_IN_21_9 permit 5














 match community CL_COMM_21_9
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_21_9 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_21_9 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_21_0
 ! Block loopback 10.180.0.22/32


route-map RM_POLICY_OUT_21_9 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_0
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_21_9 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_1
 ! Block link 10.181.0.64/31


route-map RM_POLICY_OUT_21_9 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_21
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_21_9 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_21
 set community 65000:200 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_21_9 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.22
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.78 peer-group RR


 !
 neighbor 10.180.0.151 peer-group RR




 !
 neighbor 10.181.0.32 peer-group EBGP
 neighbor 10.181.0.32 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.78 activate


  neighbor 10.180.0.151 activate




  neighbor 10.181.0.32 activate
  neighbor 10.181.0.32 route-map RM_POLICY_IN_21_9 in
  neighbor 10.181.0.32 route-map RM_POLICY_OUT_21_9 out





  network 10.200.54.0 mask 255.255.255.0

  network 10.200.55.0 mask 255.255.255.0

  network 10.200.56.0 mask 255.255.255.0

 exit-address-family
