
hostname 156_as65003_Blountstown
!
interface Loopback0
 ip address 10.180.0.157 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.44.0/24


 ip address 10.200.44.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.45.0/24


 ip address 10.200.45.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.46.0/24


 ip address 10.200.46.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.47.0/24


 ip address 10.200.47.1 255.255.255.0
!



ip access-list extended ACL_156_GigabitEthernet0_1
 10 permit ip host 10.180.0.158 any
 20 permit ip host 10.181.1.120 any
 30 permit ip host 10.181.1.121 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 155_as65003_Panama-City (155)

 ip address 10.181.1.119 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 157_as65001_Tallahassee (157)

 ip address 10.181.1.120 255.255.255.254

 ip access-group ACL_156_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.44.0 255.255.255.0 Loopback100
ip route 10.200.45.0 255.255.255.0 Loopback101
ip route 10.200.46.0 255.255.255.0 Loopback102
ip route 10.200.47.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.157
 passive-interface Loopback0
 network 10.180.0.157 0.0.0.0 area 0



network 10.181.1.118 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_156 seq 10 permit 10.200.44.0/24
ip prefix-list PL_EXPORT_ALLOWED_156 seq 20 permit 10.200.45.0/24
ip prefix-list PL_EXPORT_ALLOWED_156 seq 30 permit 10.200.46.0/24
ip prefix-list PL_EXPORT_ALLOWED_156 seq 40 permit 10.200.47.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_156_0 seq 10 deny 10.181.1.118/31
!

ip prefix-list PL_EXPORT_DENY_LINK_156_1 seq 10 deny 10.181.1.120/31
!

ip prefix-list PL_EXPORT_DENY_LONG_156 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_156_0 seq 10 deny 10.180.0.157/32
!

ip prefix-list PL_IN_156_157 seq 10 permit 10.181.0.18/31
ip prefix-list PL_IN_156_157 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_156_157 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_156_157 seq 10 permit 10.200.45.0/24
ip prefix-list PL_OUT_156_157 seq 20 permit 10.200.46.0/24
!






route-map RM_POLICY_IN_156_157 permit 10














 match ip address prefix-list PL_IN_156_157
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_156_157 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_156_157 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_156_0
 ! Block loopback 10.180.0.157/32


route-map RM_POLICY_OUT_156_157 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_156_0
 ! Block link 10.181.1.118/31


route-map RM_POLICY_OUT_156_157 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_156_1
 ! Block link 10.181.1.120/31


route-map RM_POLICY_OUT_156_157 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_156
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_156_157 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_156
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_156_157 deny 200














 match ip address prefix-list PL_OUT_156_157
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_156_157 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.157
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.151 peer-group RR




 !
 neighbor 10.181.1.121 peer-group EBGP
 neighbor 10.181.1.121 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.151 activate




  neighbor 10.181.1.121 activate
  neighbor 10.181.1.121 route-map RM_POLICY_IN_156_157 in
  neighbor 10.181.1.121 route-map RM_POLICY_OUT_156_157 out





  network 10.200.44.0 mask 255.255.255.0

  network 10.200.45.0 mask 255.255.255.0

  network 10.200.46.0 mask 255.255.255.0

  network 10.200.47.0 mask 255.255.255.0

 exit-address-family
