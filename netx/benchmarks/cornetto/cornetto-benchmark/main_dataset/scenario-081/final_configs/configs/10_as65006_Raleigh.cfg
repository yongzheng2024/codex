!


ip prefix-list PL_EXPORT_ALLOWED_10 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 20 permit 10.200.1.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_10_0 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_1 seq 10 deny 10.181.0.38/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_2 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LONG_10 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_10_0 seq 10 deny 10.180.0.11/32
!

ip prefix-list PL_IN_10_13 seq 10 permit 10.180.0.14/32
ip prefix-list PL_IN_10_13 seq 20 permit 10.181.0.46/31
ip prefix-list PL_IN_10_13 seq 30 permit 10.181.0.40/31
ip prefix-list PL_IN_10_13 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_10_13 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_10_13 seq 10 permit 10.200.1.0/24
!






route-map RM_POLICY_IN_10_13 permit 10














 match ip address prefix-list PL_IN_10_13
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_10_13 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_10_13 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_13 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_10_13 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_10_13 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_2
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_10_13 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_10
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_10_13 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_10
 set community 65000:200 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_10_13 deny 200














 match ip address prefix-list PL_OUT_10_13
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_10_13 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.19 peer-group RR




 !
 neighbor 10.181.0.41 peer-group EBGP
 neighbor 10.181.0.41 remote-as 65008


 !
 address-family ipv4

  neighbor 10.180.0.19 activate




  neighbor 10.181.0.41 activate
  neighbor 10.181.0.41 route-map RM_POLICY_IN_10_13 in
  neighbor 10.181.0.41 route-map RM_POLICY_OUT_10_13 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

 exit-address-family
