 network 10.180.0.136 0.0.0.0 area 0



network 10.181.0.140 0.0.0.1 area 0
network 10.181.1.90 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_135 seq 10 permit 10.200.31.0/24
ip prefix-list PL_EXPORT_ALLOWED_135 seq 20 permit 10.200.32.0/24
ip prefix-list PL_EXPORT_ALLOWED_135 seq 30 permit 10.200.33.0/24
ip prefix-list PL_EXPORT_ALLOWED_135 seq 40 permit 10.200.34.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_135_0 seq 10 deny 10.181.0.140/31
!

ip prefix-list PL_EXPORT_DENY_LINK_135_1 seq 10 deny 10.181.0.222/31
!

ip prefix-list PL_EXPORT_DENY_LINK_135_2 seq 10 deny 10.181.1.90/31
!

ip prefix-list PL_EXPORT_DENY_LONG_135 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_135_0 seq 10 deny 10.180.0.136/32
!

ip prefix-list PL_IN_135_77 seq 10 permit 10.181.0.202/31
ip prefix-list PL_IN_135_77 seq 20 permit 10.180.0.78/32
ip prefix-list PL_IN_135_77 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_135_77 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_135_77 seq 10 permit 10.200.34.0/24
!






route-map RM_POLICY_IN_135_77 permit 10














 match ip address prefix-list PL_IN_135_77
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_135_77 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_135_77 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_135_0
 ! Block loopback 10.180.0.136/32


route-map RM_POLICY_OUT_135_77 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_135_0
 ! Block link 10.181.0.140/31


route-map RM_POLICY_OUT_135_77 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_135_1
 ! Block link 10.181.0.222/31


route-map RM_POLICY_OUT_135_77 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_135_2
 ! Block link 10.181.1.90/31


route-map RM_POLICY_OUT_135_77 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_135
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_135_77 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_135
 set metric 11
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_135_77 deny 200














 match ip address prefix-list PL_OUT_135_77
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_135_77 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.136
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.47 peer-group RR




 !
 neighbor 10.181.0.222 peer-group EBGP
 neighbor 10.181.0.222 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.47 activate




  neighbor 10.181.0.222 activate
  neighbor 10.181.0.222 route-map RM_POLICY_IN_135_77 in
  neighbor 10.181.0.222 route-map RM_POLICY_OUT_135_77 out





  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

  network 10.200.33.0 mask 255.255.255.0

  network 10.200.34.0 mask 255.255.255.0

 exit-address-family
