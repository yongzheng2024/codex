
hostname 127_as65009_Harrisonburg
!
interface Loopback0
 ip address 10.180.0.128 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!



ip access-list extended ACL_127_GigabitEthernet0_0
 10 permit ip host 10.180.0.79 any
 20 permit ip host 10.181.0.230 any
 30 permit ip host 10.181.0.231 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 78_as65007_None (78)

 ip address 10.181.0.231 255.255.255.254

 ip access-group ACL_127_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 128_as65009_Staunton (128)

 ip address 10.181.1.72 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 129_as65009_Waynesboro (129)

 ip address 10.181.1.74 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.21.0 255.255.255.0 Loopback100
ip route 10.200.22.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.128
 passive-interface Loopback0
 network 10.180.0.128 0.0.0.0 area 0



network 10.181.1.72 0.0.0.1 area 0
network 10.181.1.74 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_127 seq 10 permit 10.200.21.0/24
ip prefix-list PL_EXPORT_ALLOWED_127 seq 20 permit 10.200.22.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_127_0 seq 10 deny 10.181.0.230/31
!

ip prefix-list PL_EXPORT_DENY_LINK_127_1 seq 10 deny 10.181.1.72/31
!

ip prefix-list PL_EXPORT_DENY_LINK_127_2 seq 10 deny 10.181.1.74/31
!

ip prefix-list PL_EXPORT_DENY_LONG_127 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_127_0 seq 10 deny 10.180.0.128/32
!






route-map RM_POLICY_IN_127_78 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_127_78 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_127_0
 ! Block loopback 10.180.0.128/32


route-map RM_POLICY_OUT_127_78 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_127_0
 ! Block link 10.181.0.230/31


route-map RM_POLICY_OUT_127_78 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_127_1
 ! Block link 10.181.1.72/31


route-map RM_POLICY_OUT_127_78 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_127_2
 ! Block link 10.181.1.74/31


route-map RM_POLICY_OUT_127_78 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_127
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_127_78 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_127
 set metric 11
 set as-path prepend 65009 65009 65009
 ! Outbound policy baseline


route-map RM_POLICY_OUT_127_78 deny 65000














 ! Deny other outbound routes

!







router bgp 65009
 bgp router-id 10.180.0.128
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65009
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.51 peer-group RR




 !
 neighbor 10.181.0.230 peer-group EBGP
 neighbor 10.181.0.230 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.51 activate




  neighbor 10.181.0.230 activate
  neighbor 10.181.0.230 route-map RM_POLICY_IN_127_78 in
  neighbor 10.181.0.230 route-map RM_POLICY_OUT_127_78 out





  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

 exit-address-family
