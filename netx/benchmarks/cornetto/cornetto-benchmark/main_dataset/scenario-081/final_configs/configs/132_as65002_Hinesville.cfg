
hostname 132_as65002_Hinesville
!
interface Loopback0
 ip address 10.180.0.133 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.29.0/24


 ip address 10.200.29.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.30.0/24


 ip address 10.200.30.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 2_as65001_Darien (2)

 ip address 10.181.0.9 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 133_as65002_Savannah (133)

 ip address 10.181.1.80 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.29.0 255.255.255.0 Loopback100
ip route 10.200.30.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.ea01.0000.0ab4.0085.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_132 seq 10 permit 10.200.29.0/24
ip prefix-list PL_EXPORT_ALLOWED_132 seq 20 permit 10.200.30.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_132_0 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LINK_132_1 seq 10 deny 10.181.1.80/31
!

ip prefix-list PL_EXPORT_DENY_LONG_132 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_132_0 seq 10 deny 10.180.0.133/32
!






route-map RM_POLICY_IN_132_2 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_132_2 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_132_0
 ! Block loopback 10.180.0.133/32


route-map RM_POLICY_OUT_132_2 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_132_0
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_132_2 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_132_1
 ! Block link 10.181.1.80/31


route-map RM_POLICY_OUT_132_2 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_132
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_132_2 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_132
 set metric 23
 set as-path prepend 65002
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_132_2 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.133
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.8 peer-group RR




 !
 neighbor 10.181.0.8 peer-group EBGP
 neighbor 10.181.0.8 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.8 activate




  neighbor 10.181.0.8 activate
  neighbor 10.181.0.8 route-map RM_POLICY_IN_132_2 in
  neighbor 10.181.0.8 route-map RM_POLICY_OUT_132_2 out





  network 10.200.29.0 mask 255.255.255.0

  network 10.200.30.0 mask 255.255.255.0

 exit-address-family
