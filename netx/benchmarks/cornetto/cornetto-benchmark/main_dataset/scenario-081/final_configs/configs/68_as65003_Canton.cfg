router ospf 1
 router-id 10.180.0.69
 passive-interface Loopback0
 network 10.180.0.69 0.0.0.0 area 0



network 10.181.0.200 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_68 seq 10 permit 10.200.77.0/24
ip prefix-list PL_EXPORT_ALLOWED_68 seq 20 permit 10.200.78.0/24
ip prefix-list PL_EXPORT_ALLOWED_68 seq 30 permit 10.200.79.0/24
ip prefix-list PL_EXPORT_ALLOWED_68 seq 40 permit 10.200.80.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_68_0 seq 10 deny 10.181.0.198/31
!

ip prefix-list PL_EXPORT_DENY_LINK_68_1 seq 10 deny 10.181.0.200/31
!

ip prefix-list PL_EXPORT_DENY_LONG_68 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_68_0 seq 10 deny 10.180.0.69/32
!

ip prefix-list PL_IN_68_76 seq 10 permit 10.200.86.0/24
ip prefix-list PL_IN_68_76 seq 20 permit 10.181.0.198/31
ip prefix-list PL_IN_68_76 seq 30 permit 10.181.0.220/31
ip prefix-list PL_IN_68_76 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_68_76 seq 10 permit 10.200.80.0/24
!






route-map RM_POLICY_IN_68_76 permit 10














 match ip address prefix-list PL_IN_68_76
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_68_76 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_68_76 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_68_0
 ! Block loopback 10.180.0.69/32


route-map RM_POLICY_OUT_68_76 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_68_0
 ! Block link 10.181.0.198/31


route-map RM_POLICY_OUT_68_76 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_68_1
 ! Block link 10.181.0.200/31


route-map RM_POLICY_OUT_68_76 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_68
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_68_76 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_68
 set metric 30
 set as-path prepend 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_68_76 deny 200














 match ip address prefix-list PL_OUT_68_76
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_68_76 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.69
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.151 peer-group RR




 !
 neighbor 10.181.0.199 peer-group EBGP
 neighbor 10.181.0.199 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.151 activate




  neighbor 10.181.0.199 activate
  neighbor 10.181.0.199 route-map RM_POLICY_IN_68_76 in
  neighbor 10.181.0.199 route-map RM_POLICY_OUT_68_76 out





  network 10.200.77.0 mask 255.255.255.0

  network 10.200.78.0 mask 255.255.255.0

  network 10.200.79.0 mask 255.255.255.0

  network 10.200.80.0 mask 255.255.255.0

 exit-address-family
