ip community-list standard CL_COMM_142_157 permit no-advertise
ip community-list standard CL_COMM_142_157 permit no-export
!





route-map RM_POLICY_IN_142_157 permit 5














 match community CL_COMM_142_157
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_142_157 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_142_157 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_142_0
 ! Block loopback 10.180.0.143/32


route-map RM_POLICY_OUT_142_157 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_142_0
 ! Block link 10.181.1.100/31


route-map RM_POLICY_OUT_142_157 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_142_1
 ! Block link 10.181.1.98/31


route-map RM_POLICY_OUT_142_157 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_142
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_142_157 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_142
 set community 65000:100 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_142_157 deny 65000














 ! Deny other outbound routes

!







