ip prefix-list PL_EXPORT_ALLOWED_142 seq 10 permit 10.200.41.0/24
ip prefix-list PL_EXPORT_ALLOWED_142 seq 20 permit 10.200.42.0/24
ip prefix-list PL_EXPORT_ALLOWED_142 seq 30 permit 10.200.43.0/24
