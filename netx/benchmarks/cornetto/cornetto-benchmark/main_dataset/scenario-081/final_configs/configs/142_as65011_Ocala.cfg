  neighbor 10.180.0.43 activate


  neighbor 10.180.0.44 activate


  neighbor 10.180.0.88 activate


  neighbor 10.180.0.144 activate



  neighbor 10.181.1.99 activate
  neighbor 10.181.1.99 route-map RM_POLICY_IN_142_157 in
  neighbor 10.181.1.99 route-map RM_POLICY_OUT_142_157 out





  network 10.200.41.0 mask 255.255.255.0

