
hostname 2_as65001_Darien
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.50.0/24


 ip address 10.200.50.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.51.0/24


 ip address 10.200.51.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.52.0/24


 ip address 10.200.52.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.53.0/24


 ip address 10.200.53.1 255.255.255.0
!



ip access-list extended ACL_2_GigabitEthernet0_1
 10 permit ip host 10.180.0.133 any
 20 permit ip host 10.181.0.8 any
 30 permit ip host 10.181.0.9 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 3_as65001_Nahunta (3)

 ip address 10.181.0.6 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 132_as65002_Hinesville (132)

 ip address 10.181.0.8 255.255.255.254

 ip access-group ACL_2_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.50.0 255.255.255.0 Loopback100
ip route 10.200.51.0 255.255.255.0 Loopback101
ip route 10.200.52.0 255.255.255.0 Loopback102
ip route 10.200.53.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0



network 10.181.0.6 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_2 seq 10 permit 10.200.50.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 20 permit 10.200.51.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 30 permit 10.200.52.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 40 permit 10.200.53.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_2_0 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_1 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_2 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_2_0 seq 10 deny 10.180.0.3/32
!

ip prefix-list PL_IN_2_132 seq 10 permit 10.200.30.0/24
ip prefix-list PL_IN_2_132 seq 20 permit 10.181.1.80/31
ip prefix-list PL_IN_2_132 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_2_132 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_2_132 seq 10 permit 10.200.52.0/24
ip prefix-list PL_OUT_2_132 seq 20 permit 10.200.53.0/24
!






route-map RM_POLICY_IN_2_132 permit 10














 match ip address prefix-list PL_IN_2_132
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_2_132 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_2_132 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_132 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_2_132 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_2_132 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_132 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_2
 set community no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_2_132 deny 200














 match ip address prefix-list PL_OUT_2_132
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_2_132 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.47 peer-group RR




 !
 neighbor 10.181.0.9 peer-group EBGP
 neighbor 10.181.0.9 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.47 activate




  neighbor 10.181.0.9 activate
  neighbor 10.181.0.9 route-map RM_POLICY_IN_2_132 in
  neighbor 10.181.0.9 route-map RM_POLICY_OUT_2_132 out





  network 10.200.50.0 mask 255.255.255.0

  network 10.200.51.0 mask 255.255.255.0

  network 10.200.52.0 mask 255.255.255.0

  network 10.200.53.0 mask 255.255.255.0

 exit-address-family
