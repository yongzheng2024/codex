 match ip address prefix-list PL_EXPORT_DENY_LONG_119
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_119_7 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_119
 set metric 15
 set as-path prepend 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_119_7 deny 200














 match ip address prefix-list PL_OUT_119_7
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_119_7 deny 65000














 ! Deny other outbound routes

