route-map RM_POLICY_IN_119_7 permit 10














 match ip address prefix-list PL_IN_119_7
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_119_7 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_119_7 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_119_0
