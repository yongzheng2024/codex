ip access-list extended ACL_26_GigabitEthernet0_1
 10 permit ip host 10.180.0.32 any
 20 permit ip host 10.181.0.86 any
 30 permit ip host 10.181.0.87 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 15_as65006_15 (15)

 ip address 10.181.0.57 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

