ip route 10.200.16.0 255.255.255.0 Loopback100
ip route 10.200.17.0 255.255.255.0 Loopback101
ip route 10.200.18.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.27
 passive-interface Loopback0
 network 10.180.0.27 0.0.0.0 area 0



network 10.181.0.56 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_26 seq 10 permit 10.200.16.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 20 permit 10.200.17.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 30 permit 10.200.18.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_26_0 seq 10 deny 10.181.0.56/31
!

ip prefix-list PL_EXPORT_DENY_LINK_26_1 seq 10 deny 10.181.0.86/31
!

ip prefix-list PL_EXPORT_DENY_LONG_26 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_26_0 seq 10 deny 10.180.0.27/32
!

ip prefix-list PL_IN_26_31 seq 10 permit 10.200.22.0/24
ip prefix-list PL_IN_26_31 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_26_31 seq 10 permit 10.200.18.0/24
ip prefix-list PL_OUT_26_31 seq 20 permit 10.200.16.0/24
!






route-map RM_POLICY_IN_26_31 permit 10














 match ip address prefix-list PL_IN_26_31
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_26_31 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_26_31 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_26_0
 ! Block loopback 10.180.0.27/32


route-map RM_POLICY_OUT_26_31 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_0
 ! Block link 10.181.0.56/31


route-map RM_POLICY_OUT_26_31 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_1
 ! Block link 10.181.0.86/31


route-map RM_POLICY_OUT_26_31 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_26
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_26_31 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_26
 set metric 5
 set as-path prepend 65006
 set community no-advertise no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_26_31 deny 200














 match ip address prefix-list PL_OUT_26_31
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_26_31 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.27
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.29 peer-group RR




 !
 neighbor 10.181.0.87 peer-group EBGP
 neighbor 10.181.0.87 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.29 activate




  neighbor 10.181.0.87 activate
  neighbor 10.181.0.87 route-map RM_POLICY_IN_26_31 in
  neighbor 10.181.0.87 route-map RM_POLICY_OUT_26_31 out





  network 10.200.16.0 mask 255.255.255.0

  network 10.200.17.0 mask 255.255.255.0

  network 10.200.18.0 mask 255.255.255.0

 exit-address-family
