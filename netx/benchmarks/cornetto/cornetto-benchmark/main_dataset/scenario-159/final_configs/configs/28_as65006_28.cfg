 match ip address prefix-list PL_EXPORT_DENY_LONG_28
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_28_67 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_28
 set community no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_28_67 deny 200














 match ip address prefix-list PL_OUT_28_67
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_28_67 deny 65000














 ! Deny other outbound routes

