 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_28_67 permit 10














 match ip address prefix-list PL_IN_28_67
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_28_67 deny 20














