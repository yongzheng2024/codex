
hostname 7_as65002_7
!
interface Loopback0
 ip address 10.180.0.8 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.64.0/24


 ip address 10.200.64.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.65.0/24


 ip address 10.200.65.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 1_as65005_1 (1)

 ip address 10.181.0.11 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 4_as65002_66-0 (4)

 ip address 10.181.0.25 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.64.0 255.255.255.0 Loopback100
ip route 10.200.65.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.8
 passive-interface Loopback0
 network 10.180.0.8 0.0.0.0 area 0



network 10.181.0.24 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_7 seq 10 permit 10.200.64.0/24
ip prefix-list PL_EXPORT_ALLOWED_7 seq 20 permit 10.200.65.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_7_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_7_1 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LONG_7 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_7_0 seq 10 deny 10.180.0.8/32
!






route-map RM_POLICY_IN_7_1 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_7_1 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_7_0
 ! Block loopback 10.180.0.8/32


route-map RM_POLICY_OUT_7_1 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_7_1 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_1
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_7_1 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_7
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_7_1 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_7
 set metric 23
 set as-path prepend 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_7_1 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.8
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP


 !
 neighbor 10.180.0.36 peer-group IBGP


 !
 neighbor 10.180.0.52 peer-group IBGP


 !
 neighbor 10.180.0.53 peer-group IBGP


 !
 neighbor 10.180.0.54 peer-group IBGP



 !
 neighbor 10.181.0.10 peer-group EBGP
 neighbor 10.181.0.10 remote-as 65005


 !
 address-family ipv4


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.25 activate


  neighbor 10.180.0.26 activate


  neighbor 10.180.0.36 activate


  neighbor 10.180.0.52 activate


  neighbor 10.180.0.53 activate


  neighbor 10.180.0.54 activate



  neighbor 10.181.0.10 activate
  neighbor 10.181.0.10 route-map RM_POLICY_IN_7_1 in
  neighbor 10.181.0.10 route-map RM_POLICY_OUT_7_1 out





  network 10.200.64.0 mask 255.255.255.0

  network 10.200.65.0 mask 255.255.255.0

 exit-address-family
