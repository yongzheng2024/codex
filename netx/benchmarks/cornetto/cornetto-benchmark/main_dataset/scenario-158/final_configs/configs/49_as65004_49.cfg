
hostname 49_as65004_49
!
interface Loopback0
 ip address 10.180.0.50 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.47.0/24


 ip address 10.200.47.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.48.0/24


 ip address 10.200.48.1 255.255.255.0
!



ip access-list extended ACL_49_GigabitEthernet0_1
 10 permit ip host 10.180.0.110 any
 20 permit ip host 10.181.0.150 any
 30 permit ip host 10.181.0.151 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 48_as65004_48 (48)

 ip address 10.181.0.145 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 109_as65003_109 (109)

 ip address 10.181.0.150 255.255.255.254

 ip access-group ACL_49_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.47.0 255.255.255.0 Loopback100
ip route 10.200.48.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.50
 passive-interface Loopback0
 network 10.180.0.50 0.0.0.0 area 0



network 10.181.0.144 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_49 seq 10 permit 10.200.47.0/24
ip prefix-list PL_EXPORT_ALLOWED_49 seq 20 permit 10.200.48.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_49_0 seq 10 deny 10.181.0.144/31
!

ip prefix-list PL_EXPORT_DENY_LINK_49_1 seq 10 deny 10.181.0.150/31
!

ip prefix-list PL_EXPORT_DENY_LONG_49 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_49_0 seq 10 deny 10.180.0.50/32
!






route-map RM_POLICY_IN_49_109 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_49_109 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_49_0
 ! Block loopback 10.180.0.50/32


route-map RM_POLICY_OUT_49_109 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_49_0
 ! Block link 10.181.0.144/31


route-map RM_POLICY_OUT_49_109 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_49_1
 ! Block link 10.181.0.150/31


route-map RM_POLICY_OUT_49_109 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_49
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_49_109 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_49
 set metric 10
 set as-path prepend 65004 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_49_109 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.50
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.49 peer-group RR


 !
 neighbor 10.180.0.22 peer-group RR




 !
 neighbor 10.181.0.151 peer-group EBGP
 neighbor 10.181.0.151 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.49 activate


  neighbor 10.180.0.22 activate




  neighbor 10.181.0.151 activate
  neighbor 10.181.0.151 route-map RM_POLICY_IN_49_109 in
  neighbor 10.181.0.151 route-map RM_POLICY_OUT_49_109 out





  network 10.200.47.0 mask 255.255.255.0

  network 10.200.48.0 mask 255.255.255.0

 exit-address-family
