
hostname 55_as65001_55
!
interface Loopback0
 ip address 10.180.0.56 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 56_as65001_56 (56)

 ip address 10.181.0.162 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 62_as65001_62 (62)

 ip address 10.181.0.164 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.56
 passive-interface Loopback0
 network 10.180.0.56 0.0.0.0 area 0



network 10.181.0.162 0.0.0.1 area 0
network 10.181.0.164 0.0.0.1 area 0
!








router bgp 65001
 bgp router-id 10.180.0.56
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.20 peer-group RR


 !
 neighbor 10.180.0.19 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.20 activate


  neighbor 10.180.0.19 activate







 exit-address-family
