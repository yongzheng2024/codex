ip prefix-list PL_OUT_82_79 seq 10 permit 10.200.76.0/24
!






route-map RM_POLICY_IN_82_79 permit 10














 match ip address prefix-list PL_IN_82_79
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_82_79 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_82_79 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_82_0
 ! Block loopback 10.180.0.83/32


