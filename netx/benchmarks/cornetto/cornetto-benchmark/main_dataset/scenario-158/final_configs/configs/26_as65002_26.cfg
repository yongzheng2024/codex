!


route-map RM_POLICY_OUT_26_23 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_26_0
 ! Block loopback 10.180.0.27/32


route-map RM_POLICY_OUT_26_23 deny 60














