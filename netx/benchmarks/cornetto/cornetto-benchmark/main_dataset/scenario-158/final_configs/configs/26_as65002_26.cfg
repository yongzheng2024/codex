ip prefix-list PL_EXPORT_ALLOWED_26 seq 10 permit 10.200.27.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 20 permit 10.200.28.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 30 permit 10.200.29.0/24
