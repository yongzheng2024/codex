  neighbor 10.181.0.74 activate
  neighbor 10.181.0.74 route-map RM_POLICY_IN_26_23 in
  neighbor 10.181.0.74 route-map RM_POLICY_OUT_26_23 out


  neighbor 10.181.0.87 activate
  neighbor 10.181.0.87 route-map RM_POLICY_OUT_26_107 out





  network 10.200.27.0 mask 255.255.255.0

  network 10.200.28.0 mask 255.255.255.0

  network 10.200.29.0 mask 255.255.255.0

