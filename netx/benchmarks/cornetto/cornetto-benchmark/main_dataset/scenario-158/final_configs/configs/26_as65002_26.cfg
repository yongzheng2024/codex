 match ip address prefix-list PL_EXPORT_DENY_LINK_26_2
 ! Block link 10.181.0.88/31


route-map RM_POLICY_OUT_26_23 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_26
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_26_23 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_26
 set metric 8
 set as-path prepend 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_26_23 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.27
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
