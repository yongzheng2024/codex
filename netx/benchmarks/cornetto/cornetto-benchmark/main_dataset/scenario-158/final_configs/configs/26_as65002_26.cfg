 ! Block link 10.181.0.88/31


route-map RM_POLICY_OUT_26_107 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_26
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_26_107 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_26
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_26_107 deny 65000














