
hostname 109_as65003_109
!
interface Loopback0
 ip address 10.180.0.110 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 49_as65004_49 (49)

 ip address 10.181.0.151 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 52_as65003_52 (52)

 ip address 10.181.0.159 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 60_as65003_60 (60)

 ip address 10.181.0.183 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.7.0 255.255.255.0 Loopback101
ip route 10.200.8.0 255.255.255.0 Loopback102
ip route 10.200.9.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.110
 passive-interface Loopback0
 network 10.180.0.110 0.0.0.0 area 0



network 10.181.0.158 0.0.0.1 area 0
network 10.181.0.182 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_109 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_109 seq 20 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_109 seq 30 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_109 seq 40 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_109_0 seq 10 deny 10.181.0.150/31
!

ip prefix-list PL_EXPORT_DENY_LINK_109_1 seq 10 deny 10.181.0.158/31
!

ip prefix-list PL_EXPORT_DENY_LINK_109_2 seq 10 deny 10.181.0.182/31
!

ip prefix-list PL_EXPORT_DENY_LONG_109 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_109_0 seq 10 deny 10.180.0.110/32
!

ip prefix-list PL_IN_109_49 seq 10 permit 10.181.0.144/31
ip prefix-list PL_IN_109_49 seq 20 permit 10.181.0.150/31
ip prefix-list PL_IN_109_49 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_109_49 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_109_49 seq 10 permit 10.200.10.0/24
!






route-map RM_POLICY_IN_109_49 permit 10














 match ip address prefix-list PL_IN_109_49
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_109_49 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_109_49 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_109_0
 ! Block loopback 10.180.0.110/32


route-map RM_POLICY_OUT_109_49 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_109_0
 ! Block link 10.181.0.150/31


route-map RM_POLICY_OUT_109_49 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_109_1
 ! Block link 10.181.0.158/31


route-map RM_POLICY_OUT_109_49 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_109_2
 ! Block link 10.181.0.182/31


route-map RM_POLICY_OUT_109_49 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_109
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_109_49 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_109
 set metric 20
 set as-path prepend 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_109_49 deny 200














 match ip address prefix-list PL_OUT_109_49
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_109_49 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.110
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.77 peer-group RR


 !
 neighbor 10.180.0.75 peer-group RR




 !
 neighbor 10.181.0.150 peer-group EBGP
 neighbor 10.181.0.150 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.77 activate


  neighbor 10.180.0.75 activate




  neighbor 10.181.0.150 activate
  neighbor 10.181.0.150 route-map RM_POLICY_IN_109_49 in
  neighbor 10.181.0.150 route-map RM_POLICY_OUT_109_49 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
