
hostname 100_as65006_100
!
interface Loopback0
 ip address 10.180.0.101 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 8_as65001_8 (8)

 ip address 10.181.0.27 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 105_as65006_105 (105)

 ip address 10.181.1.12 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 107_as65006_107 (107)

 ip address 10.181.1.14 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
ip route 10.200.3.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.101
 passive-interface Loopback0
 network 10.180.0.101 0.0.0.0 area 0



network 10.181.1.12 0.0.0.1 area 0
network 10.181.1.14 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_100 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_100 seq 30 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_100 seq 40 permit 10.200.3.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_100_0 seq 10 deny 10.181.0.26/31
!

ip prefix-list PL_EXPORT_DENY_LINK_100_1 seq 10 deny 10.181.1.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_100_2 seq 10 deny 10.181.1.14/31
!

ip prefix-list PL_EXPORT_DENY_LONG_100 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_100_0 seq 10 deny 10.180.0.101/32
!






route-map RM_POLICY_IN_100_8 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_100_8 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_100_0
 ! Block loopback 10.180.0.101/32


route-map RM_POLICY_OUT_100_8 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_100_0
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_100_8 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_100_1
 ! Block link 10.181.1.12/31


route-map RM_POLICY_OUT_100_8 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_100_2
 ! Block link 10.181.1.14/31


route-map RM_POLICY_OUT_100_8 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_100
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_100_8 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_100
 set metric 30
 set as-path prepend 65006 65006
 ! Outbound policy baseline


route-map RM_POLICY_OUT_100_8 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.101
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.101


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.30 peer-group RR



 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.31 peer-group IBGP


 !
 neighbor 10.180.0.102 peer-group IBGP


 !
 neighbor 10.180.0.107 peer-group IBGP


 !
 neighbor 10.180.0.109 peer-group IBGP



 !
 neighbor 10.181.0.26 peer-group EBGP
 neighbor 10.181.0.26 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.30 activate



  neighbor 10.180.0.3 activate
  neighbor 10.180.0.3 next-hop-self


  neighbor 10.180.0.31 activate
  neighbor 10.180.0.31 next-hop-self


  neighbor 10.180.0.102 activate
  neighbor 10.180.0.102 next-hop-self


  neighbor 10.180.0.107 activate
  neighbor 10.180.0.107 next-hop-self


  neighbor 10.180.0.109 activate
  neighbor 10.180.0.109 next-hop-self



  neighbor 10.181.0.26 activate
  neighbor 10.181.0.26 route-map RM_POLICY_IN_100_8 in
  neighbor 10.181.0.26 route-map RM_POLICY_OUT_100_8 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

 exit-address-family
