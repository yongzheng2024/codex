
hostname 22_as65002_Haikou
!
interface Loopback0
 ip address 10.180.0.23 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 25_as65003_Wuhan (25)

 ip address 10.181.0.92 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 28_as65002_Guangzhou (28)

 ip address 10.181.0.94 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.11.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.23
 passive-interface Loopback0
 network 10.180.0.23 0.0.0.0 area 0










 redistribute bgp 65002 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_22

network 10.181.0.94 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 10 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 20 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 30 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 40 permit 10.200.15.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 50 permit 10.200.16.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 60 permit 10.200.17.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 70 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 80 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 90 permit 10.200.20.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 100 permit 10.200.21.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 110 permit 10.200.22.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 120 permit 10.200.35.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 130 permit 10.200.36.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 140 permit 10.200.37.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_22 seq 150 permit 10.200.38.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_22 seq 10 permit 10.180.0.23/32
ip prefix-list PL_BGP_TO_OSPF_DENY_22 seq 20 permit 10.181.0.92/31
ip prefix-list PL_BGP_TO_OSPF_DENY_22 seq 30 permit 10.181.0.94/31
!

ip prefix-list PL_EXPORT_ALLOWED_22 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_22 seq 20 permit 10.200.11.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_22_0 seq 10 deny 10.181.0.92/31
!

ip prefix-list PL_EXPORT_DENY_LINK_22_1 seq 10 deny 10.181.0.94/31
!

ip prefix-list PL_EXPORT_DENY_LONG_22 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_22_0 seq 10 deny 10.180.0.23/32
!

ip prefix-list PL_IN_22_25 seq 10 permit 10.181.0.100/31
ip prefix-list PL_IN_22_25 seq 20 permit 10.181.0.80/31
ip prefix-list PL_IN_22_25 seq 30 permit 10.181.0.92/31
ip prefix-list PL_IN_22_25 seq 40 permit 10.181.0.54/31
ip prefix-list PL_IN_22_25 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_22_25 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_22_25 seq 10 permit 10.200.10.0/24
!






route-map RM_BGP_TO_OSPF_22 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_22 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_22
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_22 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_22
 set tag 65010

!


route-map RM_POLICY_IN_22_25 permit 10














 match ip address prefix-list PL_IN_22_25
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_22_25 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_22_25 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_22_0
 ! Block loopback 10.180.0.23/32


route-map RM_POLICY_OUT_22_25 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_0
 ! Block link 10.181.0.92/31


route-map RM_POLICY_OUT_22_25 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_1
 ! Block link 10.181.0.94/31


route-map RM_POLICY_OUT_22_25 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_22
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_22_25 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_22
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_22_25 deny 200














 match ip address prefix-list PL_OUT_22_25
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_22_25 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.23
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.17 peer-group RR


 !
 neighbor 10.180.0.29 peer-group RR




 !
 neighbor 10.181.0.93 peer-group EBGP
 neighbor 10.181.0.93 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.17 activate


  neighbor 10.180.0.29 activate




  neighbor 10.181.0.93 activate
  neighbor 10.181.0.93 route-map RM_POLICY_IN_22_25 in
  neighbor 10.181.0.93 route-map RM_POLICY_OUT_22_25 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

 exit-address-family
