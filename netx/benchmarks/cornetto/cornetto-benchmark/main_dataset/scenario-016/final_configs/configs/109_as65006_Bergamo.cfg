
hostname 109_as65006_Bergamo
!
interface Loopback0
 ip address 10.180.0.110 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 112_as65006_Brescia (112)

 ip address 10.181.1.74 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 152_as65001_Milan (152)

 ip address 10.181.1.76 255.255.255.254
 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.110
 passive-interface Loopback0
 network 10.180.0.110 0.0.0.0 area 0



network 10.181.1.74 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_109 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_109 seq 20 permit 10.200.1.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_109_0 seq 10 deny 10.181.1.74/31
!

ip prefix-list PL_EXPORT_DENY_LINK_109_1 seq 10 deny 10.181.1.76/31
!

ip prefix-list PL_EXPORT_DENY_LONG_109 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_109_0 seq 10 deny 10.180.0.110/32
!






route-map RM_POLICY_IN_109_152 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_109_152 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_109_0
 ! Block loopback 10.180.0.110/32


route-map RM_POLICY_OUT_109_152 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_109_0
 ! Block link 10.181.1.74/31


route-map RM_POLICY_OUT_109_152 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_109_1
 ! Block link 10.181.1.76/31


route-map RM_POLICY_OUT_109_152 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_109
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_109_152 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_109
 set metric 15
 set as-path prepend 65006 65006 65006
 ! Outbound policy baseline


route-map RM_POLICY_OUT_109_152 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.110
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.82 peer-group RR




 !
 neighbor 10.181.1.77 peer-group EBGP
 neighbor 10.181.1.77 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.82 activate




  neighbor 10.181.1.77 activate
  neighbor 10.181.1.77 route-map RM_POLICY_IN_109_152 in
  neighbor 10.181.1.77 route-map RM_POLICY_OUT_109_152 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

 exit-address-family
