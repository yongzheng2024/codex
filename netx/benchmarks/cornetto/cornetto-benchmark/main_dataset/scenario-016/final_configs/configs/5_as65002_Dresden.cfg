
hostname 5_as65002_Dresden
!
interface Loopback0
 ip address 10.180.0.6 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.56.0/24


 ip address 10.200.56.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.57.0/24


 ip address 10.200.57.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.58.0/24


 ip address 10.200.58.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 4_as65002_Leipzig (4)

 ip address 10.181.0.19 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 144_as65004_Berlin (144)

 ip address 10.181.0.20 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 11_as65002_Prague (11)

 ip address 10.181.0.22 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.56.0 255.255.255.0 Loopback100
ip route 10.200.57.0 255.255.255.0 Loopback101
ip route 10.200.58.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.6
 passive-interface Loopback0
 network 10.180.0.6 0.0.0.0 area 0



network 10.181.0.18 0.0.0.1 area 0
network 10.181.0.22 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_5 seq 10 permit 10.200.56.0/24
ip prefix-list PL_EXPORT_ALLOWED_5 seq 20 permit 10.200.57.0/24
ip prefix-list PL_EXPORT_ALLOWED_5 seq 30 permit 10.200.58.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_5_0 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_5_1 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LINK_5_2 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LONG_5 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_5_0 seq 10 deny 10.180.0.6/32
!

ip prefix-list PL_IN_5_144 seq 10 permit 10.181.0.198/31
ip prefix-list PL_IN_5_144 seq 20 permit 10.181.0.28/31
ip prefix-list PL_IN_5_144 seq 30 permit 10.200.37.0/24
ip prefix-list PL_IN_5_144 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_5_144 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_5_144 seq 10 permit 10.200.57.0/24
ip prefix-list PL_OUT_5_144 seq 20 permit 10.200.56.0/24
!






route-map RM_POLICY_IN_5_144 permit 10














 match ip address prefix-list PL_IN_5_144
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_5_144 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_5_144 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_5_0
 ! Block loopback 10.180.0.6/32


route-map RM_POLICY_OUT_5_144 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_0
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_5_144 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_1
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_5_144 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_2
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_5_144 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_5
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_5_144 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_5
 set metric 26
 set as-path prepend 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_5_144 deny 200














 match ip address prefix-list PL_OUT_5_144
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_5_144 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.6
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.11 peer-group RR




 !
 neighbor 10.181.0.21 peer-group EBGP
 neighbor 10.181.0.21 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.11 activate




  neighbor 10.181.0.21 activate
  neighbor 10.181.0.21 route-map RM_POLICY_IN_5_144 in
  neighbor 10.181.0.21 route-map RM_POLICY_OUT_5_144 out





  network 10.200.56.0 mask 255.255.255.0

  network 10.200.57.0 mask 255.255.255.0

  network 10.200.58.0 mask 255.255.255.0

 exit-address-family
