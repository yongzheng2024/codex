 router-id 10.180.0.73
 passive-interface Loopback0
 network 10.180.0.73 0.0.0.0 area 0



network 10.181.0.212 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_72 seq 10 permit 10.200.77.0/24
ip prefix-list PL_EXPORT_ALLOWED_72 seq 20 permit 10.200.78.0/24
ip prefix-list PL_EXPORT_ALLOWED_72 seq 30 permit 10.200.79.0/24
ip prefix-list PL_EXPORT_ALLOWED_72 seq 40 permit 10.200.80.0/24
