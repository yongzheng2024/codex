!

ip prefix-list PL_EXPORT_DENY_LONG_72 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_72_0 seq 10 deny 10.180.0.73/32
!




ip community-list standard CL_COMM_72_152 permit no-advertise
!





route-map RM_POLICY_IN_72_152 permit 5














 match community CL_COMM_72_152
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_72_152 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_72_152 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_72_152 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_72_0
 ! Block loopback 10.180.0.73/32


route-map RM_POLICY_OUT_72_152 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_72_0
 ! Block link 10.181.0.212/31


route-map RM_POLICY_OUT_72_152 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_72_1
 ! Block link 10.181.0.234/31


route-map RM_POLICY_OUT_72_152 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_72
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_72_152 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_72
 set metric 10
 set as-path prepend 65011 65011
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_72_152 deny 65000














 ! Deny other outbound routes

!







router bgp 65011
 bgp router-id 10.180.0.73
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



