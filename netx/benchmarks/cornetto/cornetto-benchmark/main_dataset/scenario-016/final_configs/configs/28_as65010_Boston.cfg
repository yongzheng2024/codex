
hostname 28_as65010_Boston
!
interface Loopback0
 ip address 10.180.0.29 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 140_as65010_London (140)

 ip address 10.181.0.102 255.255.255.254

 ip ospf network point-to-point
