!
interface GigabitEthernet0/1
 description to 29_as65010_Chicago (29)

 ip address 10.181.0.104 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.29
 passive-interface Loopback0
 network 10.180.0.29 0.0.0.0 area 0



network 10.181.0.102 0.0.0.1 area 0
network 10.181.0.104 0.0.0.1 area 0
!








router bgp 65010
 bgp router-id 10.180.0.29
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65010
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.141 peer-group RR


 !
 neighbor 10.180.0.55 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.141 activate


  neighbor 10.180.0.55 activate







 exit-address-family
