ip community-list standard CL_COMM_149_139 permit no-advertise
ip community-list standard CL_COMM_149_139 permit no-export
!





route-map RM_POLICY_IN_149_139 permit 5














 match community CL_COMM_149_139
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_149_139 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_149_139 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_149_0
 ! Block loopback 10.180.0.150/32


route-map RM_POLICY_OUT_149_139 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_149_0
 ! Block link 10.181.1.118/31


route-map RM_POLICY_OUT_149_139 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_149_1
 ! Block link 10.181.1.124/31


route-map RM_POLICY_OUT_149_139 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_149
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_149_139 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_149
 set community 65000:100 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_149_139 deny 65000














 ! Deny other outbound routes

!







