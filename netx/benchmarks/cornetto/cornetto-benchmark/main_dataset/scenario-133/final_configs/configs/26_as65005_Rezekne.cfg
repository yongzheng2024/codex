ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.11.0 255.255.255.0 Loopback101
ip route 10.200.12.0 255.255.255.0 Loopback102
ip route 10.200.9.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.27
 passive-interface Loopback0
 network 10.180.0.27 0.0.0.0 area 0










 redistribute bgp 65005 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_26

network 10.181.0.60 0.0.0.1 area 0
network 10.181.0.64 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_26 seq 10 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_26 seq 20 permit 10.200.14.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_26 seq 10 permit 10.180.0.27/32
ip prefix-list PL_BGP_TO_OSPF_DENY_26 seq 20 permit 10.181.0.60/31
ip prefix-list PL_BGP_TO_OSPF_DENY_26 seq 30 permit 10.181.0.62/31
ip prefix-list PL_BGP_TO_OSPF_DENY_26 seq 40 permit 10.181.0.64/31
!






route-map RM_BGP_TO_OSPF_26 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_26 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_26
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_26 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_26
 set tag 65010

!







router bgp 65005
 bgp router-id 10.180.0.27
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.32 peer-group IBGP


 !
 neighbor 10.180.0.60 peer-group IBGP


 !
 neighbor 10.180.0.66 peer-group IBGP


 !
 neighbor 10.180.0.67 peer-group IBGP


 !
 neighbor 10.180.0.68 peer-group IBGP


 !
 neighbor 10.180.0.69 peer-group IBGP



 !
 neighbor 10.181.0.63 peer-group EBGP
 neighbor 10.181.0.63 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.32 activate


  neighbor 10.180.0.60 activate


  neighbor 10.180.0.66 activate


  neighbor 10.180.0.67 activate


  neighbor 10.180.0.68 activate


  neighbor 10.180.0.69 activate



  neighbor 10.181.0.63 activate





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

  network 10.200.12.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

