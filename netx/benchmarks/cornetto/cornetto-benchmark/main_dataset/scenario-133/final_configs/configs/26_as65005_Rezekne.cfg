ip access-list extended ACL_26_GigabitEthernet0_1
 10 permit ip host 10.180.0.31 any
 20 permit ip host 10.181.0.62 any
 30 permit ip host 10.181.0.63 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 192.0.2.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 66_as65005_Ludza (66)

 ip address 10.181.0.60 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

