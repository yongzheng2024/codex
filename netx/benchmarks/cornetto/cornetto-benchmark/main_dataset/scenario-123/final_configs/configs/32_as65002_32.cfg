
hostname 32_as65002_32
!
interface Loopback0
 ip address 10.180.0.33 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 7_as65001_23-71622 (7)

 ip address 10.181.0.17 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 55_as65002_22-94389 (55)

 ip address 10.181.0.92 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.4.0 255.255.255.0 Loopback100
ip route 10.200.5.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.33
 passive-interface Loopback0
 network 10.180.0.33 0.0.0.0 area 0



network 10.181.0.92 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_32 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_32 seq 20 permit 10.200.5.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_32_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_32_1 seq 10 deny 10.181.0.92/31
!

ip prefix-list PL_EXPORT_DENY_LONG_32 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_32_0 seq 10 deny 10.180.0.33/32
!






route-map RM_POLICY_IN_32_7 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_32_7 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_32_0
 ! Block loopback 10.180.0.33/32


route-map RM_POLICY_OUT_32_7 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_32_7 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_1
 ! Block link 10.181.0.92/31


route-map RM_POLICY_OUT_32_7 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_32
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_32_7 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_32
 set metric 17
 set as-path prepend 65002 65002 65002
 set community 65000:100 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_32_7 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.33
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.53 peer-group IBGP


 !
 neighbor 10.180.0.55 peer-group IBGP


 !
 neighbor 10.180.0.56 peer-group IBGP


 !
 neighbor 10.180.0.57 peer-group IBGP


 !
 neighbor 10.180.0.58 peer-group IBGP


 !
 neighbor 10.180.0.59 peer-group IBGP


 !
 neighbor 10.180.0.60 peer-group IBGP


 !
 neighbor 10.180.0.61 peer-group IBGP


 !
 neighbor 10.180.0.62 peer-group IBGP



 !
 neighbor 10.181.0.16 peer-group EBGP
 neighbor 10.181.0.16 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.53 activate


  neighbor 10.180.0.55 activate


  neighbor 10.180.0.56 activate


  neighbor 10.180.0.57 activate


  neighbor 10.180.0.58 activate


  neighbor 10.180.0.59 activate


  neighbor 10.180.0.60 activate


  neighbor 10.180.0.61 activate


  neighbor 10.180.0.62 activate



  neighbor 10.181.0.16 activate
  neighbor 10.181.0.16 route-map RM_POLICY_IN_32_7 in
  neighbor 10.181.0.16 route-map RM_POLICY_OUT_32_7 out





  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

 exit-address-family
