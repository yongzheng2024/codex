ip access-list extended ACL_26_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.27 any
 20 permit ip host 10.181.0.33 any
 30 permit ip host 10.181.0.59 any
 40 permit ip host 10.181.0.67 any
 50 permit ip 10.181.0.58 0.0.0.1 any
 60 permit ip 10.181.0.66 0.0.0.1 any
