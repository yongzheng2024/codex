router isis 1
 net 31.e900.0000.0ab4.001b.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_26 seq 10 permit 10.200.21.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 20 permit 10.200.22.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 30 permit 10.200.23.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_26_0 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LINK_26_1 seq 10 deny 10.181.0.58/31
!

ip prefix-list PL_EXPORT_DENY_LINK_26_2 seq 10 deny 10.181.0.66/31
!

ip prefix-list PL_EXPORT_DENY_LONG_26 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_26_0 seq 10 deny 10.180.0.27/32
!

ip prefix-list PL_IN_26_17 seq 10 permit 10.200.7.0/24
ip prefix-list PL_IN_26_17 seq 20 permit 10.180.0.18/32
ip prefix-list PL_IN_26_17 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_26_17 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_26_17 seq 10 permit 10.200.21.0/24
!




ip community-list standard CL_COMM_26_17 permit 65535:65282
ip community-list standard CL_COMM_26_17 permit no-advertise
!





route-map RM_POLICY_IN_26_17 permit 5














 match community CL_COMM_26_17
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_26_17 permit 10














 match ip address prefix-list PL_IN_26_17
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_26_17 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_26_17 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_26_17 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_26_0
 ! Block loopback 10.180.0.27/32


route-map RM_POLICY_OUT_26_17 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_0
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_26_17 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_1
 ! Block link 10.181.0.58/31


route-map RM_POLICY_OUT_26_17 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_2
 ! Block link 10.181.0.66/31


route-map RM_POLICY_OUT_26_17 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_26
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_26_17 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_26
 set metric 12
 set as-path prepend 65001 65001 65001
 set community 65000:100 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_26_17 deny 200














 match ip address prefix-list PL_OUT_26_17
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_26_17 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.27
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.4 peer-group RR




 !
 neighbor 10.181.0.58 peer-group EBGP
 neighbor 10.181.0.58 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.4 activate




  neighbor 10.181.0.58 activate
  neighbor 10.181.0.58 route-map RM_POLICY_IN_26_17 in
  neighbor 10.181.0.58 route-map RM_POLICY_OUT_26_17 out





  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

  network 10.200.23.0 mask 255.255.255.0

 exit-address-family
