!

ip prefix-list PL_EXPORT_DENY_LINK_1_1 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LINK_1_2 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_1 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_1_0 seq 10 deny 10.180.0.2/32
!






route-map RM_POLICY_IN_1_9 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_1_9 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_1_0
 ! Block loopback 10.180.0.2/32


route-map RM_POLICY_OUT_1_9 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_1_9 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_1
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_1_9 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_2
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_1_9 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_1
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_1_9 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_1
 set metric 17
 set as-path prepend 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_1_9 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.3 peer-group RR




 !
 neighbor 10.181.0.7 peer-group EBGP
 neighbor 10.181.0.7 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.3 activate




  neighbor 10.181.0.7 activate
  neighbor 10.181.0.7 route-map RM_POLICY_IN_1_9 in
  neighbor 10.181.0.7 route-map RM_POLICY_OUT_1_9 out





  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

 exit-address-family
