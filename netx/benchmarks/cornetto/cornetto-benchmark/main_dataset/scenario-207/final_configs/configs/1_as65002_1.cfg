ip prefix-list PL_EXPORT_ALLOWED_1 seq 10 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 20 permit 10.200.3.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 30 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 40 permit 10.200.5.0/24
