
hostname 57_as65004_57
!
interface Loopback0
 ip address 10.180.0.58 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.31.0/24


 ip address 10.200.31.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.32.0/24


 ip address 10.200.32.1 255.255.255.0
!



ip access-list extended ACL_57_GigabitEthernet0_0
 10 permit ip host 10.180.0.55 any
 20 permit ip host 10.181.0.142 any
 30 permit ip host 10.181.0.143 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 54_as65001_54 (54)

 ip address 10.181.0.143 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30


 ip access-group ACL_57_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 58_as65004_58 (58)

 ip address 10.181.0.152 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.31.0 255.255.255.0 Loopback100
ip route 10.200.32.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.58
 passive-interface Loopback0
 network 10.180.0.58 0.0.0.0 area 0



network 10.181.0.142 0.0.0.1 area 0
network 10.181.0.152 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_57 seq 10 permit 10.200.31.0/24
ip prefix-list PL_EXPORT_ALLOWED_57 seq 20 permit 10.200.32.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_57_0 seq 10 deny 10.181.0.142/31
!

ip prefix-list PL_EXPORT_DENY_LINK_57_1 seq 10 deny 10.181.0.152/31
!

ip prefix-list PL_EXPORT_DENY_LONG_57 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_57_0 seq 10 deny 10.180.0.58/32
!

ip prefix-list PL_IN_57_54 seq 10 permit 10.181.0.144/31
ip prefix-list PL_IN_57_54 seq 20 permit 10.181.0.86/31
ip prefix-list PL_IN_57_54 seq 30 permit 10.181.0.140/31
ip prefix-list PL_IN_57_54 seq 40 permit 10.181.0.146/31
ip prefix-list PL_IN_57_54 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_57_54 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_57_54 seq 10 permit 10.200.32.0/24
!






route-map RM_POLICY_IN_57_54 permit 10














 match ip address prefix-list PL_IN_57_54
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_57_54 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_57_54 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_57_0
 ! Block loopback 10.180.0.58/32


route-map RM_POLICY_OUT_57_54 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_57_0
 ! Block link 10.181.0.142/31


route-map RM_POLICY_OUT_57_54 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_57_1
 ! Block link 10.181.0.152/31


route-map RM_POLICY_OUT_57_54 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_57
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_57_54 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_57
 set community 65000:200 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_57_54 deny 200














 match ip address prefix-list PL_OUT_57_54
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_57_54 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.58
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.1 peer-group RR




 !
 neighbor 10.181.0.142 peer-group EBGP
 neighbor 10.181.0.142 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.1 activate




  neighbor 10.181.0.142 activate
  neighbor 10.181.0.142 route-map RM_POLICY_IN_57_54 in
  neighbor 10.181.0.142 route-map RM_POLICY_OUT_57_54 out





  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

 exit-address-family
