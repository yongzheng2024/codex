
hostname 2_as65004_2
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 0_as65004_0 (0)

 ip address 10.181.0.3 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 55_as65004_55 (55)

 ip address 10.181.0.6 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 7_as65002_7 (7)

 ip address 10.181.0.8 255.255.255.254
 mtu 1500
!


ip route 10.200.2.0 255.255.255.0 Loopback100
ip route 10.200.3.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0



network 10.181.0.2 0.0.0.1 area 0
network 10.181.0.6 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 10 permit 10.200.23.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 20 permit 10.200.24.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 30 permit 10.200.25.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 40 permit 10.200.26.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 50 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 60 permit 10.200.30.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 70 permit 10.200.38.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_2 seq 80 permit 10.200.39.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 10 permit 10.180.0.3/32
ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 20 permit 10.181.0.2/31
ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 30 permit 10.181.0.6/31
ip prefix-list PL_BGP_TO_OSPF_DENY_2 seq 40 permit 10.181.0.8/31
!

ip prefix-list PL_EXPORT_ALLOWED_2 seq 10 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 20 permit 10.200.3.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_2_0 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_1 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_2 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_2 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_2_0 seq 10 deny 10.180.0.3/32
!

ip prefix-list PL_IN_2_7 seq 10 permit 10.200.39.0/24
ip prefix-list PL_IN_2_7 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_2_7 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_2_7 seq 10 permit 10.200.3.0/24
ip prefix-list PL_OUT_2_7 seq 20 permit 10.200.2.0/24
!






route-map RM_BGP_TO_OSPF_2 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_2 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_2
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_2 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_2
 set tag 65010

!


route-map RM_POLICY_IN_2_7 permit 10














 match ip address prefix-list PL_IN_2_7
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_2_7 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_2_7 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_7 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_2_7 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_2_7 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_2
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_2_7 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_7 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_2
 set metric 30
 set as-path prepend 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_2_7 deny 200














 match ip address prefix-list PL_OUT_2_7
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_2_7 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.3


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.1 peer-group RR



 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.60 peer-group IBGP


 !
 neighbor 10.180.0.61 peer-group IBGP



 !
 neighbor 10.181.0.9 peer-group EBGP
 neighbor 10.181.0.9 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.1 activate



  neighbor 10.180.0.2 activate
  neighbor 10.180.0.2 next-hop-self


  neighbor 10.180.0.7 activate
  neighbor 10.180.0.7 next-hop-self


  neighbor 10.180.0.60 activate
  neighbor 10.180.0.60 next-hop-self


  neighbor 10.180.0.61 activate
  neighbor 10.180.0.61 next-hop-self



  neighbor 10.181.0.9 activate
  neighbor 10.181.0.9 route-map RM_POLICY_IN_2_7 in
  neighbor 10.181.0.9 route-map RM_POLICY_OUT_2_7 out





  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

 exit-address-family
