
hostname 60_as65004_60
!
interface Loopback0
 ip address 10.180.0.61 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.33.0/24


 ip address 10.200.33.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.34.0/24


 ip address 10.200.34.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 55_as65004_55 (55)

 ip address 10.181.0.149 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 56_as65002_56 (56)

 ip address 10.181.0.151 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 59_as65004_59 (59)

 ip address 10.181.0.157 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.33.0 255.255.255.0 Loopback100
ip route 10.200.34.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.61
 passive-interface Loopback0
 network 10.180.0.61 0.0.0.0 area 0



network 10.181.0.148 0.0.0.1 area 0
network 10.181.0.156 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_60 seq 10 permit 10.200.33.0/24
ip prefix-list PL_EXPORT_ALLOWED_60 seq 20 permit 10.200.34.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_60_0 seq 10 deny 10.181.0.148/31
!

ip prefix-list PL_EXPORT_DENY_LINK_60_1 seq 10 deny 10.181.0.150/31
!

ip prefix-list PL_EXPORT_DENY_LINK_60_2 seq 10 deny 10.181.0.156/31
!

ip prefix-list PL_EXPORT_DENY_LONG_60 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_60_0 seq 10 deny 10.180.0.61/32
!

ip prefix-list PL_IN_60_56 seq 10 permit 10.181.0.36/31
ip prefix-list PL_IN_60_56 seq 20 permit 10.181.0.150/31
ip prefix-list PL_IN_60_56 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_60_56 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_60_56 seq 10 permit 10.200.33.0/24
!






route-map RM_POLICY_IN_60_56 permit 10














 match ip address prefix-list PL_IN_60_56
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_60_56 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_60_56 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_60_0
 ! Block loopback 10.180.0.61/32


route-map RM_POLICY_OUT_60_56 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_60_0
 ! Block link 10.181.0.148/31


route-map RM_POLICY_OUT_60_56 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_60_1
 ! Block link 10.181.0.150/31


route-map RM_POLICY_OUT_60_56 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_60_2
 ! Block link 10.181.0.156/31


route-map RM_POLICY_OUT_60_56 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_60
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_60_56 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_60
 set metric 26
 set as-path prepend 65004 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_60_56 deny 200














 match ip address prefix-list PL_OUT_60_56
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_60_56 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.61
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.3 peer-group RR




 !
 neighbor 10.181.0.150 peer-group EBGP
 neighbor 10.181.0.150 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.3 activate




  neighbor 10.181.0.150 activate
  neighbor 10.181.0.150 route-map RM_POLICY_IN_60_56 in
  neighbor 10.181.0.150 route-map RM_POLICY_OUT_60_56 out





  network 10.200.33.0 mask 255.255.255.0

  network 10.200.34.0 mask 255.255.255.0

 exit-address-family
