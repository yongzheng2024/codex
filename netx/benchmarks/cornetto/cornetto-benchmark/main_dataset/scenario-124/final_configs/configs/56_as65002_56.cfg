
hostname 56_as65002_56
!
interface Loopback0
 ip address 10.180.0.57 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.29.0/24


 ip address 10.200.29.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.30.0/24


 ip address 10.200.30.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 3_as65002_3 (3)

 ip address 10.181.0.11 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 7_as65002_7 (7)

 ip address 10.181.0.37 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 60_as65004_60 (60)

 ip address 10.181.0.150 255.255.255.254
 mtu 1500
!


ip route 10.200.29.0 255.255.255.0 Loopback100
ip route 10.200.30.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.57
 passive-interface Loopback0
 network 10.180.0.57 0.0.0.0 area 0










 redistribute bgp 65002 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_56

network 10.181.0.10 0.0.0.1 area 0
network 10.181.0.36 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 10 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 20 permit 10.200.3.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 30 permit 10.200.31.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 40 permit 10.200.32.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 50 permit 10.200.33.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 60 permit 10.200.34.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_56 seq 10 permit 10.180.0.57/32
ip prefix-list PL_BGP_TO_OSPF_DENY_56 seq 20 permit 10.181.0.10/31
ip prefix-list PL_BGP_TO_OSPF_DENY_56 seq 30 permit 10.181.0.36/31
ip prefix-list PL_BGP_TO_OSPF_DENY_56 seq 40 permit 10.181.0.150/31
!

ip prefix-list PL_EXPORT_ALLOWED_56 seq 10 permit 10.200.29.0/24
ip prefix-list PL_EXPORT_ALLOWED_56 seq 20 permit 10.200.30.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_56_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_56_1 seq 10 deny 10.181.0.150/31
!

ip prefix-list PL_EXPORT_DENY_LINK_56_2 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LONG_56 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_56_0 seq 10 deny 10.180.0.57/32
!

ip prefix-list PL_IN_56_60 seq 10 permit 10.181.0.150/31
ip prefix-list PL_IN_56_60 seq 20 permit 10.180.0.61/32
ip prefix-list PL_IN_56_60 seq 30 permit 10.181.0.156/31
ip prefix-list PL_IN_56_60 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_56_60 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_56_60 seq 10 permit 10.200.30.0/24
!






route-map RM_BGP_TO_OSPF_56 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_56 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_56
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_56 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_56
 set tag 65010

!


route-map RM_POLICY_IN_56_60 permit 10














 match ip address prefix-list PL_IN_56_60
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_56_60 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_56_60 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_56_0
 ! Block loopback 10.180.0.57/32


route-map RM_POLICY_OUT_56_60 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_56_60 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_1
 ! Block link 10.181.0.150/31


route-map RM_POLICY_OUT_56_60 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_2
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_56_60 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_56
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_56_60 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_56
 set community 65000:200 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_56_60 deny 200














 match ip address prefix-list PL_OUT_56_60
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_56_60 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.57
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.8 peer-group RR




 !
 neighbor 10.181.0.151 peer-group EBGP
 neighbor 10.181.0.151 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.8 activate




  neighbor 10.181.0.151 activate
  neighbor 10.181.0.151 route-map RM_POLICY_IN_56_60 in
  neighbor 10.181.0.151 route-map RM_POLICY_OUT_56_60 out





  network 10.200.29.0 mask 255.255.255.0

  network 10.200.30.0 mask 255.255.255.0

 exit-address-family
