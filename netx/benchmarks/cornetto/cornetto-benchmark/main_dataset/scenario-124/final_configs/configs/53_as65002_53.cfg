
hostname 53_as65002_53
!
interface Loopback0
 ip address 10.180.0.54 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.23.0/24


 ip address 10.200.23.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.24.0/24


 ip address 10.200.24.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.25.0/24


 ip address 10.200.25.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.26.0/24


 ip address 10.200.26.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 7_as65002_7 (7)

 ip address 10.181.0.33 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 46_as65002_46 (46)

 ip address 10.181.0.133 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 52_as65008_52 (52)

 ip address 10.181.0.139 255.255.255.254
 mtu 1500
!


ip route 10.200.23.0 255.255.255.0 Loopback100
ip route 10.200.24.0 255.255.255.0 Loopback101
ip route 10.200.25.0 255.255.255.0 Loopback102
ip route 10.200.26.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.54
 passive-interface Loopback0
 network 10.180.0.54 0.0.0.0 area 0



network 10.181.0.32 0.0.0.1 area 0
network 10.181.0.132 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_53 seq 10 permit 10.200.23.0/24
ip prefix-list PL_EXPORT_ALLOWED_53 seq 20 permit 10.200.24.0/24
ip prefix-list PL_EXPORT_ALLOWED_53 seq 30 permit 10.200.25.0/24
ip prefix-list PL_EXPORT_ALLOWED_53 seq 40 permit 10.200.26.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_53_0 seq 10 deny 10.181.0.132/31
!

ip prefix-list PL_EXPORT_DENY_LINK_53_1 seq 10 deny 10.181.0.138/31
!

ip prefix-list PL_EXPORT_DENY_LINK_53_2 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LONG_53 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_53_0 seq 10 deny 10.180.0.54/32
!






route-map RM_POLICY_IN_53_52 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_53_52 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_53_0
 ! Block loopback 10.180.0.54/32


route-map RM_POLICY_OUT_53_52 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_53_0
 ! Block link 10.181.0.132/31


route-map RM_POLICY_OUT_53_52 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_53_1
 ! Block link 10.181.0.138/31


route-map RM_POLICY_OUT_53_52 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_53_2
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_53_52 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_53
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_53_52 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_53
 set metric 18
 set as-path prepend 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_53_52 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.54
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.8 peer-group RR




 !
 neighbor 10.181.0.138 peer-group EBGP
 neighbor 10.181.0.138 remote-as 65008


 !
 address-family ipv4

  neighbor 10.180.0.8 activate




  neighbor 10.181.0.138 activate
  neighbor 10.181.0.138 route-map RM_POLICY_IN_53_52 in
  neighbor 10.181.0.138 route-map RM_POLICY_OUT_53_52 out





  network 10.200.23.0 mask 255.255.255.0

  network 10.200.24.0 mask 255.255.255.0

  network 10.200.25.0 mask 255.255.255.0

  network 10.200.26.0 mask 255.255.255.0

 exit-address-family
