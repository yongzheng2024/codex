
hostname 52_as65008_52
!
interface Loopback0
 ip address 10.180.0.53 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!



ip access-list extended ACL_52_GigabitEthernet0_2
 10 permit ip host 10.180.0.54 any
 20 permit ip host 10.181.0.138 any
 30 permit ip host 10.181.0.139 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 50_as65008_50 (50)

 ip address 10.181.0.135 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 51_as65008_51 (51)

 ip address 10.181.0.137 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 53_as65002_53 (53)

 ip address 10.181.0.138 255.255.255.254

 ip access-group ACL_52_GigabitEthernet0_2 in
 mtu 1500
!


ip route 10.200.21.0 255.255.255.0 Loopback100
ip route 10.200.22.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.53
 passive-interface Loopback0
 network 10.180.0.53 0.0.0.0 area 0










 redistribute bgp 65008 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_52

network 10.181.0.134 0.0.0.1 area 0
network 10.181.0.136 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_52 seq 10 permit 10.200.23.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_52 seq 20 permit 10.200.24.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_52 seq 30 permit 10.200.25.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_52 seq 40 permit 10.200.26.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_52 seq 50 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_52 seq 60 permit 10.200.30.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_52 seq 70 permit 10.200.38.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_52 seq 80 permit 10.200.39.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_52 seq 10 permit 10.180.0.53/32
ip prefix-list PL_BGP_TO_OSPF_DENY_52 seq 20 permit 10.181.0.134/31
ip prefix-list PL_BGP_TO_OSPF_DENY_52 seq 30 permit 10.181.0.136/31
ip prefix-list PL_BGP_TO_OSPF_DENY_52 seq 40 permit 10.181.0.138/31
!

ip prefix-list PL_EXPORT_ALLOWED_52 seq 10 permit 10.200.21.0/24
ip prefix-list PL_EXPORT_ALLOWED_52 seq 20 permit 10.200.22.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_52_0 seq 10 deny 10.181.0.134/31
!

ip prefix-list PL_EXPORT_DENY_LINK_52_1 seq 10 deny 10.181.0.136/31
!

ip prefix-list PL_EXPORT_DENY_LINK_52_2 seq 10 deny 10.181.0.138/31
!

ip prefix-list PL_EXPORT_DENY_LONG_52 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_52_0 seq 10 deny 10.180.0.53/32
!






route-map RM_BGP_TO_OSPF_52 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_52 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_52
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_52 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_52
 set tag 65010

!


route-map RM_POLICY_IN_52_53 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_52_53 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_52_0
 ! Block loopback 10.180.0.53/32


route-map RM_POLICY_OUT_52_53 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_52_0
 ! Block link 10.181.0.134/31


route-map RM_POLICY_OUT_52_53 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_52_1
 ! Block link 10.181.0.136/31


route-map RM_POLICY_OUT_52_53 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_52_2
 ! Block link 10.181.0.138/31


route-map RM_POLICY_OUT_52_53 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_52
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_52_53 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_52
 set metric 24
 set as-path prepend 65008 65008 65008
 set community 65000:100 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_52_53 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.53
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65008
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.51 peer-group IBGP


 !
 neighbor 10.180.0.52 peer-group IBGP



 !
 neighbor 10.181.0.139 peer-group EBGP
 neighbor 10.181.0.139 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.51 activate


  neighbor 10.180.0.52 activate



  neighbor 10.181.0.139 activate
  neighbor 10.181.0.139 route-map RM_POLICY_IN_52_53 in
  neighbor 10.181.0.139 route-map RM_POLICY_OUT_52_53 out





  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

 exit-address-family
