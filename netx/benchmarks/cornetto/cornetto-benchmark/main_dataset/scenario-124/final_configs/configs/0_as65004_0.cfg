
hostname 0_as65004_0
!
interface Loopback0
 ip address 10.180.0.1 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 1_as65004_1 (1)

 ip address 10.181.0.0 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 2_as65004_2 (2)

 ip address 10.181.0.2 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 6_as65004_6 (6)

 ip address 10.181.0.4 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


router ospf 1
 router-id 10.180.0.1
 passive-interface Loopback0
 network 10.180.0.1 0.0.0.0 area  



network 10.181.0.0 0.0.0.1 area 0
network 10.181.0.2 0.0.0.1 area 0
network 10.181.0.4 0.0.0.1 area 0
!








router bgp 65004
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.3


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0



 !
 neighbor 10.180.0.3 peer-group RR



 !
 neighbor 10.180.0.56 peer-group IBGP


 !
 neighbor 10.180.0.58 peer-group IBGP


 !
 neighbor 10.180.0.59 peer-group IBGP



 !
 address-family ipv4

  neighbor 10.180.0.3 activate



  neighbor 10.180.0.56 activate
  neighbor 10.180.0.56 next-hop-self


  neighbor 10.180.0.58 activate
  neighbor 10.180.0.58 next-hop-self


  neighbor 10.180.0.59 activate
  neighbor 10.180.0.59 next-hop-self






 exit-address-family
