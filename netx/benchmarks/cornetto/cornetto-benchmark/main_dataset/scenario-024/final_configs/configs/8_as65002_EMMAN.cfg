
hostname 8_as65002_EMMAN
!
interface Loopback0
 ip address 10.180.0.9 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.44.0/24


 ip address 10.200.44.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.45.0/24


 ip address 10.200.45.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 17_as65001_London (17)

 ip address 10.181.0.28 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 12_as65002_Leeds (12)

 ip address 10.181.0.30 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.44.0 255.255.255.0 Loopback100
ip route 10.200.45.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.9
 passive-interface Loopback0
 network 10.180.0.9 0.0.0.0 area 0



network 10.181.0.30 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_8 seq 10 permit 10.200.44.0/24
ip prefix-list PL_EXPORT_ALLOWED_8 seq 20 permit 10.200.45.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_8_0 seq 10 deny 10.181.0.28/31
!

ip prefix-list PL_EXPORT_DENY_LINK_8_1 seq 10 deny 10.181.0.30/31
!

ip prefix-list PL_EXPORT_DENY_LONG_8 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_8_0 seq 10 deny 10.180.0.9/32
!






route-map RM_POLICY_OUT_8_17 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_8_0
 ! Block loopback 10.180.0.9/32


route-map RM_POLICY_OUT_8_17 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_0
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_8_17 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_1
 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_8_17 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_8
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_8_17 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_8
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_8_17 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.9
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.13 peer-group RR


 !
 neighbor 10.180.0.3 peer-group RR




 !
 neighbor 10.181.0.29 peer-group EBGP
 neighbor 10.181.0.29 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.13 activate


  neighbor 10.180.0.3 activate




  neighbor 10.181.0.29 activate
  neighbor 10.181.0.29 route-map RM_POLICY_OUT_8_17 out





  network 10.200.44.0 mask 255.255.255.0

  network 10.200.45.0 mask 255.255.255.0

 exit-address-family
