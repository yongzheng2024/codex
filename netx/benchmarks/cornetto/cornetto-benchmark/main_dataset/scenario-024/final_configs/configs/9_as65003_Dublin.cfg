router ospf 1
 router-id 10.180.0.10
 passive-interface Loopback0
 network 10.180.0.10 0.0.0.0 area 0



network 10.181.0.32 0.0.0.1 area 0
network 10.181.0.34 0.0.0.1 area 0
!








router bgp 65003
 bgp router-id 10.180.0.10
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.14 peer-group RR


 !
 neighbor 10.180.0.15 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.14 activate


  neighbor 10.180.0.15 activate







 exit-address-family
