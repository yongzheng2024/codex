
hostname 24_as65002_EaStMAN
!
interface Loopback0
 ip address 10.180.0.25 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 12_as65002_Leeds (12)

 ip address 10.181.0.53 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 25_as65002_Clydenet (25)

 ip address 10.181.0.86 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.25
 passive-interface Loopback0
 network 10.180.0.25 0.0.0.0 area 0



network 10.181.0.52 0.0.0.1 area 0
network 10.181.0.86 0.0.0.1 area 0
!








router bgp 65002
 bgp router-id 10.180.0.25
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.13 peer-group RR


 !
 neighbor 10.180.0.3 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.13 activate


  neighbor 10.180.0.3 activate







 exit-address-family
