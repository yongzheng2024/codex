
hostname 23_as65004_FaTMAN
!
interface Loopback0
 ip address 10.180.0.24 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.26.0/24


 ip address 10.200.26.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.27.0/24


 ip address 10.200.27.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.28.0/24


 ip address 10.200.28.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.29.0/24


 ip address 10.200.29.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 12_as65002_Leeds (12)

 ip address 10.181.0.51 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 22_as65004_AbMAN (22)

 ip address 10.181.0.85 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.26.0 255.255.255.0 Loopback100
ip route 10.200.27.0 255.255.255.0 Loopback101
ip route 10.200.28.0 255.255.255.0 Loopback102
ip route 10.200.29.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.24
 passive-interface Loopback0
 network 10.180.0.24 0.0.0.0 area 0



network 10.181.0.84 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_23 seq 10 permit 10.200.26.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 20 permit 10.200.27.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 30 permit 10.200.28.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 40 permit 10.200.29.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_23_0 seq 10 deny 10.181.0.50/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_1 seq 10 deny 10.181.0.84/31
!

ip prefix-list PL_EXPORT_DENY_LONG_23 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_23_0 seq 10 deny 10.180.0.24/32
!




ip community-list standard CL_COMM_23_12 permit no-advertise
ip community-list standard CL_COMM_23_12 permit no-export
!





route-map RM_POLICY_IN_23_12 permit 5














 match community CL_COMM_23_12
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_23_12 permit 10














 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_23_12 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_23_12 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_23_0
 ! Block loopback 10.180.0.24/32


route-map RM_POLICY_OUT_23_12 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_0
 ! Block link 10.181.0.50/31


route-map RM_POLICY_OUT_23_12 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_1
 ! Block link 10.181.0.84/31


route-map RM_POLICY_OUT_23_12 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_23
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_23_12 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_23
 set metric 9
 set as-path prepend 65004
 set community no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_23_12 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.24
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.22 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP



 !
 neighbor 10.181.0.50 peer-group EBGP
 neighbor 10.181.0.50 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.22 activate


  neighbor 10.180.0.23 activate



  neighbor 10.181.0.50 activate
  neighbor 10.181.0.50 route-map RM_POLICY_IN_23_12 in
  neighbor 10.181.0.50 route-map RM_POLICY_OUT_23_12 out





  network 10.200.26.0 mask 255.255.255.0

  network 10.200.27.0 mask 255.255.255.0

  network 10.200.28.0 mask 255.255.255.0

  network 10.200.29.0 mask 255.255.255.0

 exit-address-family
