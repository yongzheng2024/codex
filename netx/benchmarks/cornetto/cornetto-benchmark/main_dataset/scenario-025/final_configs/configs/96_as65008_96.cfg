!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_96_0 seq 10 deny 10.180.0.97/32
!






route-map RM_POLICY_IN_96_63 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_96_63 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_96_0
 ! Block loopback 10.180.0.97/32


route-map RM_POLICY_OUT_96_63 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_96_0
 ! Block link 10.181.0.188/31


route-map RM_POLICY_OUT_96_63 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_96_1
 ! Block link 10.181.1.2/31


route-map RM_POLICY_OUT_96_63 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_96_2
 ! Block link 10.181.1.8/31


route-map RM_POLICY_OUT_96_63 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_96
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_96_63 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_96
 set metric 24
 set as-path prepend 65008 65008 65008
 ! Outbound policy baseline


route-map RM_POLICY_OUT_96_63 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.97
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



