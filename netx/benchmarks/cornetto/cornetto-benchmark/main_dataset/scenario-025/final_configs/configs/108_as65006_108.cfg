
hostname 108_as65006_108
!
interface Loopback0
 ip address 10.180.0.109 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.19.0/24


 ip address 10.200.19.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.20.0/24


 ip address 10.200.20.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 106_as65001_106 (106)

 ip address 10.181.1.23 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 107_as65006_107 (107)

 ip address 10.181.1.25 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.19.0 255.255.255.0 Loopback100
ip route 10.200.20.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.109
 passive-interface Loopback0
 network 10.180.0.109 0.0.0.0 area 0



network 10.181.1.24 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_108 seq 10 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_108 seq 20 permit 10.200.20.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_108_0 seq 10 deny 10.181.1.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_108_1 seq 10 deny 10.181.1.24/31
!

ip prefix-list PL_EXPORT_DENY_LONG_108 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_108_0 seq 10 deny 10.180.0.109/32
!

ip prefix-list PL_IN_108_106 seq 10 permit 10.181.1.22/31
ip prefix-list PL_IN_108_106 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_108_106 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_108_106 seq 10 permit 10.200.20.0/24
!




ip community-list standard CL_COMM_108_106 permit 65535:65282
ip community-list standard CL_COMM_108_106 permit no-export
!





route-map RM_POLICY_IN_108_106 permit 5














 match community CL_COMM_108_106
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_108_106 permit 10














 match ip address prefix-list PL_IN_108_106
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_108_106 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_108_106 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_108_106 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_108_0
 ! Block loopback 10.180.0.109/32


route-map RM_POLICY_OUT_108_106 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_108_0
 ! Block link 10.181.1.22/31


route-map RM_POLICY_OUT_108_106 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_108_1
 ! Block link 10.181.1.24/31


route-map RM_POLICY_OUT_108_106 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_108
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_108_106 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_108
 set community no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_108_106 deny 200














 match ip address prefix-list PL_OUT_108_106
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_108_106 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.109
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.27 peer-group RR


 !
 neighbor 10.180.0.29 peer-group RR




 !
 neighbor 10.181.1.22 peer-group EBGP
 neighbor 10.181.1.22 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.27 activate


  neighbor 10.180.0.29 activate




  neighbor 10.181.1.22 activate
  neighbor 10.181.1.22 route-map RM_POLICY_IN_108_106 in
  neighbor 10.181.1.22 route-map RM_POLICY_OUT_108_106 out





  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

 exit-address-family
