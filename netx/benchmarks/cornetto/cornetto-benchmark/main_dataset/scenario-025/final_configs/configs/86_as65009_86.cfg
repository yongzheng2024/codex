
hostname 86_as65009_86
!
interface Loopback0
 ip address 10.180.0.87 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.77.0/24


 ip address 10.200.77.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.78.0/24


 ip address 10.200.78.1 255.255.255.0
!



ip access-list extended ACL_86_GigabitEthernet0_0
 10 permit ip host 10.180.0.68 any
 20 permit ip host 10.181.0.204 any
 30 permit ip host 10.181.0.205 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 192.0.2.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 67_as65003_67 (67)

 ip address 10.181.0.205 255.255.255.254

 ip access-group ACL_86_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 83_as65009_83 (83)

 ip address 10.181.0.245 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.77.0 255.255.255.0 Loopback100
ip route 10.200.78.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.87
 passive-interface Loopback0
 network 10.180.0.87 0.0.0.0 area 0



network 10.181.0.244 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_86 seq 10 permit 10.200.77.0/24
ip prefix-list PL_EXPORT_ALLOWED_86 seq 20 permit 10.200.78.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_86_0 seq 10 deny 10.181.0.204/31
!

ip prefix-list PL_EXPORT_DENY_LINK_86_1 seq 10 deny 10.181.0.244/31
!

ip prefix-list PL_EXPORT_DENY_LONG_86 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_86_0 seq 10 deny 10.180.0.87/32
!

ip prefix-list PL_IN_86_67 seq 10 permit 10.181.0.200/31
ip prefix-list PL_IN_86_67 seq 20 permit 10.181.0.202/31
ip prefix-list PL_IN_86_67 seq 30 permit 10.181.0.204/31
ip prefix-list PL_IN_86_67 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_86_67 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_86_67 seq 10 permit 10.200.78.0/24
ip prefix-list PL_OUT_86_67 seq 20 permit 10.200.77.0/24
!






route-map RM_POLICY_IN_86_67 permit 10














 match ip address prefix-list PL_IN_86_67
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_86_67 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_86_67 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_86_0
 ! Block loopback 10.180.0.87/32


route-map RM_POLICY_OUT_86_67 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_86_0
 ! Block link 10.181.0.204/31


route-map RM_POLICY_OUT_86_67 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_86_1
 ! Block link 10.181.0.244/31


route-map RM_POLICY_OUT_86_67 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_86
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_86_67 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_86
 set metric 19
 set as-path prepend 65009
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_86_67 deny 200














 match ip address prefix-list PL_OUT_86_67
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_86_67 deny 65000














 ! Deny other outbound routes

!







router bgp 65009
 bgp router-id 10.180.0.87
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65009
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.82 peer-group IBGP


 !
 neighbor 10.180.0.83 peer-group IBGP


 !
 neighbor 10.180.0.84 peer-group IBGP


 !
 neighbor 10.180.0.85 peer-group IBGP


 !
 neighbor 10.180.0.95 peer-group IBGP



 !
 neighbor 10.181.0.204 peer-group EBGP
 neighbor 10.181.0.204 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.82 activate


  neighbor 10.180.0.83 activate


  neighbor 10.180.0.84 activate


  neighbor 10.180.0.85 activate


  neighbor 10.180.0.95 activate



  neighbor 10.181.0.204 activate
  neighbor 10.181.0.204 route-map RM_POLICY_IN_86_67 in
  neighbor 10.181.0.204 route-map RM_POLICY_OUT_86_67 out





  network 10.200.77.0 mask 255.255.255.0

  network 10.200.78.0 mask 255.255.255.0

 exit-address-family
