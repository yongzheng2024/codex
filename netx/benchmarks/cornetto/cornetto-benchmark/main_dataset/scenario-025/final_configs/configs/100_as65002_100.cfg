route-map RM_POLICY_IN_100_105 permit 10














 match ip address prefix-list PL_IN_100_105
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_100_105 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_IN_100_107 permit 10














 set local-preference 150
