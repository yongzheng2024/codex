
hostname 91_as65006_91
!
interface Loopback0
 ip address 10.180.0.92 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.79.0/24


 ip address 10.200.79.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.80.0/24


 ip address 10.200.80.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.81.0/24


 ip address 10.200.81.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.82.0/24


 ip address 10.200.82.1 255.255.255.0
!



ip access-list extended ACL_91_GigabitEthernet0_1
 10 permit ip host 10.180.0.121 any
 20 permit ip host 10.181.1.4 any
 30 permit ip host 10.181.1.5 any
 40 deny ip 192.0.2.0 0.0.0.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 88_as65006_88 (88)

 ip address 10.181.0.251 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 120_as65008_120 (120)

 ip address 10.181.1.4 255.255.255.254

 ip access-group ACL_91_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.79.0 255.255.255.0 Loopback100
ip route 10.200.80.0 255.255.255.0 Loopback101
ip route 10.200.81.0 255.255.255.0 Loopback102
ip route 10.200.82.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.92
 passive-interface Loopback0
 network 10.180.0.92 0.0.0.0 area 0



network 10.181.0.250 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_91 seq 10 permit 10.200.79.0/24
ip prefix-list PL_EXPORT_ALLOWED_91 seq 20 permit 10.200.80.0/24
ip prefix-list PL_EXPORT_ALLOWED_91 seq 30 permit 10.200.81.0/24
ip prefix-list PL_EXPORT_ALLOWED_91 seq 40 permit 10.200.82.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_91_0 seq 10 deny 10.181.0.250/31
!

ip prefix-list PL_EXPORT_DENY_LINK_91_1 seq 10 deny 10.181.1.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_91 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_91_0 seq 10 deny 10.180.0.92/32
!




ip community-list standard CL_COMM_91_120 permit no-advertise
ip community-list standard CL_COMM_91_120 permit no-export
!





route-map RM_POLICY_IN_91_120 permit 5














 match community CL_COMM_91_120
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_91_120 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_91_120 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_91_120 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_91_0
 ! Block loopback 10.180.0.92/32


route-map RM_POLICY_OUT_91_120 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_91_0
 ! Block link 10.181.0.250/31


route-map RM_POLICY_OUT_91_120 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_91_1
 ! Block link 10.181.1.4/31


route-map RM_POLICY_OUT_91_120 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_91
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_91_120 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_91
 set metric 28
 set as-path prepend 65006 65006 65006
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_91_120 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.92
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.29 peer-group RR




 !
 neighbor 10.181.1.5 peer-group EBGP
 neighbor 10.181.1.5 remote-as 65008


 !
 address-family ipv4

  neighbor 10.180.0.29 activate




  neighbor 10.181.1.5 activate
  neighbor 10.181.1.5 route-map RM_POLICY_IN_91_120 in
  neighbor 10.181.1.5 route-map RM_POLICY_OUT_91_120 out





  network 10.200.79.0 mask 255.255.255.0

  network 10.200.80.0 mask 255.255.255.0

  network 10.200.81.0 mask 255.255.255.0

  network 10.200.82.0 mask 255.255.255.0

 exit-address-family
