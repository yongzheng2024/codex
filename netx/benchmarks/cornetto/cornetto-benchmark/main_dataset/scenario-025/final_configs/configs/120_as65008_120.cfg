route-map RM_POLICY_IN_120_91 permit 10














 match ip address prefix-list PL_IN_120_91
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_120_91 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_120_91 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_120_0
 ! Block loopback 10.180.0.121/32


route-map RM_POLICY_OUT_120_91 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_120_0
 ! Block link 10.181.1.38/31


