 match ip address prefix-list PL_EXPORT_DENY_LINK_120_2
 ! Block link 10.181.1.40/31


route-map RM_POLICY_OUT_120_91 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_120
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_120_91 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_120
 set metric 18
 set as-path prepend 65008 65008
 ! Outbound policy baseline


route-map RM_POLICY_OUT_120_91 deny 200














 match ip address prefix-list PL_OUT_120_91
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_120_91 deny 65000














 ! Deny other outbound routes

!







