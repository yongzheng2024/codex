
hostname 72_as65011_Como
!
interface Loopback0
 ip address 10.180.0.73 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.81.0/24


 ip address 10.200.81.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.82.0/24


 ip address 10.200.82.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.83.0/24


 ip address 10.200.83.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 64_as65011_Chiasso (64)

 ip address 10.181.0.213 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 152_as65001_Milan (152)

 ip address 10.181.0.234 255.255.255.254
 mtu 1500
!


ip route 10.200.81.0 255.255.255.0 Loopback100
ip route 10.200.82.0 255.255.255.0 Loopback101
ip route 10.200.83.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.73
 passive-interface Loopback0
 network 10.180.0.73 0.0.0.0 area 0










 redistribute bgp 65011 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_72

network 10.181.0.212 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_72 seq 10 permit 10.200.48.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_72 seq 20 permit 10.200.49.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_72 seq 30 permit 10.200.50.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_72 seq 40 permit 10.200.51.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_72 seq 50 permit 10.200.77.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_72 seq 60 permit 10.200.78.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_72 seq 70 permit 10.200.79.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_72 seq 80 permit 10.200.80.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_72 seq 10 permit 10.180.0.73/32
ip prefix-list PL_BGP_TO_OSPF_DENY_72 seq 20 permit 10.181.0.212/31
ip prefix-list PL_BGP_TO_OSPF_DENY_72 seq 30 permit 10.181.0.234/31
!

ip prefix-list PL_EXPORT_ALLOWED_72 seq 10 permit 10.200.81.0/24
ip prefix-list PL_EXPORT_ALLOWED_72 seq 20 permit 10.200.82.0/24
ip prefix-list PL_EXPORT_ALLOWED_72 seq 30 permit 10.200.83.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_72_0 seq 10 deny 10.181.0.212/31
!

ip prefix-list PL_EXPORT_DENY_LINK_72_1 seq 10 deny 10.181.0.234/31
!

ip prefix-list PL_EXPORT_DENY_LONG_72 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_72_0 seq 10 deny 10.180.0.73/32
!




ip community-list standard CL_COMM_72_152 permit 65535:65282
ip community-list standard CL_COMM_72_152 permit no-export
!





route-map RM_BGP_TO_OSPF_72 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_72 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_72
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_72 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_72
 set tag 65010

!


route-map RM_POLICY_IN_72_152 permit 5














 match community CL_COMM_72_152
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_72_152 permit 10














 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_72_152 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_72_152 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_72_0
 ! Block loopback 10.180.0.73/32


route-map RM_POLICY_OUT_72_152 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_72_0
 ! Block link 10.181.0.212/31


route-map RM_POLICY_OUT_72_152 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_72_1
 ! Block link 10.181.0.234/31


route-map RM_POLICY_OUT_72_152 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_72
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_72_152 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_72
 set metric 27
 set as-path prepend 65011 65011 65011
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_72_152 deny 65000














 ! Deny other outbound routes

!







router bgp 65011
 bgp router-id 10.180.0.73
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65011
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.75 peer-group RR




 !
 neighbor 10.181.0.235 peer-group EBGP
 neighbor 10.181.0.235 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.75 activate




  neighbor 10.181.0.235 activate
  neighbor 10.181.0.235 route-map RM_POLICY_IN_72_152 in
  neighbor 10.181.0.235 route-map RM_POLICY_OUT_72_152 out





  network 10.200.81.0 mask 255.255.255.0

  network 10.200.82.0 mask 255.255.255.0

  network 10.200.83.0 mask 255.255.255.0

 exit-address-family
