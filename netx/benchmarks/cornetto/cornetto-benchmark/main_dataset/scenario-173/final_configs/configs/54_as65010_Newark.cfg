ip route 10.200.71.0 255.255.255.0 Loopback101
ip route 10.200.72.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.55
 passive-interface Loopback0
 network 10.180.0.55 0.0.0.0 area 0










 redistribute bgp 65010 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_54

network 10.181.0.182 0.0.0.1 area 0
network 10.181.0.184 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 10 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 20 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 30 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 40 permit 10.200.15.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 50 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 60 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 70 permit 10.200.20.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 80 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 90 permit 10.200.30.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 100 permit 10.200.31.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 110 permit 10.200.32.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 120 permit 10.200.44.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 130 permit 10.200.45.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 140 permit 10.200.46.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_54 seq 150 permit 10.200.47.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_54 seq 10 permit 10.180.0.55/32
ip prefix-list PL_BGP_TO_OSPF_DENY_54 seq 20 permit 10.181.0.180/31
ip prefix-list PL_BGP_TO_OSPF_DENY_54 seq 30 permit 10.181.0.182/31
ip prefix-list PL_BGP_TO_OSPF_DENY_54 seq 40 permit 10.181.0.184/31
!

ip prefix-list PL_EXPORT_ALLOWED_54 seq 10 permit 10.200.70.0/24
ip prefix-list PL_EXPORT_ALLOWED_54 seq 20 permit 10.200.71.0/24
ip prefix-list PL_EXPORT_ALLOWED_54 seq 30 permit 10.200.72.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_54_0 seq 10 deny 10.181.0.180/31
!

ip prefix-list PL_EXPORT_DENY_LINK_54_1 seq 10 deny 10.181.0.182/31
!

ip prefix-list PL_EXPORT_DENY_LINK_54_2 seq 10 deny 10.181.0.184/31
!

ip prefix-list PL_EXPORT_DENY_LONG_54 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_54_0 seq 10 deny 10.180.0.55/32
!

ip prefix-list PL_IN_54_139 seq 10 permit 10.181.1.116/31
ip prefix-list PL_IN_54_139 seq 20 permit 10.200.30.0/24
ip prefix-list PL_IN_54_139 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_54_139 seq 10 permit 10.200.72.0/24
!






route-map RM_BGP_TO_OSPF_54 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_54 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_54
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_54 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_54
 set tag 65010

!


route-map RM_POLICY_IN_54_139 permit 10














 match ip address prefix-list PL_IN_54_139
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_54_139 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_54_139 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_54_0
 ! Block loopback 10.180.0.55/32


route-map RM_POLICY_OUT_54_139 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_54_0
 ! Block link 10.181.0.180/31


route-map RM_POLICY_OUT_54_139 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_54_1
 ! Block link 10.181.0.182/31


route-map RM_POLICY_OUT_54_139 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_54_2
 ! Block link 10.181.0.184/31


route-map RM_POLICY_OUT_54_139 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_54
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_54_139 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_54
 set metric 10
 set as-path prepend 65010 65010 65010
 ! Outbound policy baseline


route-map RM_POLICY_OUT_54_139 deny 200














 match ip address prefix-list PL_OUT_54_139
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_54_139 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.55
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65010
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.141 peer-group RR




 !
 neighbor 10.181.0.181 peer-group EBGP
 neighbor 10.181.0.181 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.141 activate




  neighbor 10.181.0.181 activate
  neighbor 10.181.0.181 route-map RM_POLICY_IN_54_139 in
  neighbor 10.181.0.181 route-map RM_POLICY_OUT_54_139 out





  network 10.200.70.0 mask 255.255.255.0

  network 10.200.71.0 mask 255.255.255.0

  network 10.200.72.0 mask 255.255.255.0

 exit-address-family
