
hostname 149_as65003_Rouen
!
interface Loopback0
 ip address 10.180.0.150 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.44.0/24


 ip address 10.200.44.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.45.0/24


 ip address 10.200.45.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.46.0/24


 ip address 10.200.46.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.47.0/24


 ip address 10.200.47.1 255.255.255.0
!



ip access-list extended ACL_149_GigabitEthernet0_1
 10 permit ip host 10.180.0.149 any
 20 permit ip host 10.181.1.124 any
 30 permit ip host 10.181.1.125 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 139_as65003_Paris (139)

 ip address 10.181.1.119 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 148_as65002_Rennes (148)

 ip address 10.181.1.125 255.255.255.254

 ip access-group ACL_149_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.44.0 255.255.255.0 Loopback100
ip route 10.200.45.0 255.255.255.0 Loopback101
ip route 10.200.46.0 255.255.255.0 Loopback102
ip route 10.200.47.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.150
 passive-interface Loopback0
 network 10.180.0.150 0.0.0.0 area 0



network 10.181.1.118 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_149 seq 10 permit 10.200.44.0/24
ip prefix-list PL_EXPORT_ALLOWED_149 seq 20 permit 10.200.45.0/24
ip prefix-list PL_EXPORT_ALLOWED_149 seq 30 permit 10.200.46.0/24
ip prefix-list PL_EXPORT_ALLOWED_149 seq 40 permit 10.200.47.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_149_0 seq 10 deny 10.181.1.118/31
!

ip prefix-list PL_EXPORT_DENY_LINK_149_1 seq 10 deny 10.181.1.124/31
!

ip prefix-list PL_EXPORT_DENY_LONG_149 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_149_0 seq 10 deny 10.180.0.150/32
!




ip community-list standard CL_COMM_149_148 permit 65535:65282
ip community-list standard CL_COMM_149_148 permit no-advertise
!





route-map RM_POLICY_IN_149_148 permit 5














 match community CL_COMM_149_148
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_149_148 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_149_148 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_149_0
 ! Block loopback 10.180.0.150/32


route-map RM_POLICY_OUT_149_148 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_149_0
 ! Block link 10.181.1.118/31


route-map RM_POLICY_OUT_149_148 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_149_1
 ! Block link 10.181.1.124/31


route-map RM_POLICY_OUT_149_148 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_149
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_149_148 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_149
 set community 65000:100 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_149_148 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.150
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.124 peer-group RR




 !
 neighbor 10.181.1.124 peer-group EBGP
 neighbor 10.181.1.124 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.124 activate




  neighbor 10.181.1.124 activate
  neighbor 10.181.1.124 route-map RM_POLICY_IN_149_148 in
  neighbor 10.181.1.124 route-map RM_POLICY_OUT_149_148 out





  network 10.200.44.0 mask 255.255.255.0

  network 10.200.45.0 mask 255.255.255.0

  network 10.200.46.0 mask 255.255.255.0

  network 10.200.47.0 mask 255.255.255.0

 exit-address-family
