
hostname 117_as65003_Basel
!
interface Loopback0
 ip address 10.180.0.118 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.12.0/24


 ip address 10.200.12.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.13.0/24


 ip address 10.200.13.1 255.255.255.0
!



ip access-list extended ACL_117_GigabitEthernet0_1
 10 permit ip host 10.180.0.75 any
 20 permit ip host 10.181.0.240 any
 30 permit ip host 10.181.0.241 any
 40 deny ip 192.0.2.0 0.0.0.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 73_as65003_None (73)

 ip address 10.181.0.239 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 74_as65011_Zurich (74)

 ip address 10.181.0.241 255.255.255.254

 ip access-group ACL_117_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 118_as65003_Strasbourg (118)

 ip address 10.181.1.90 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.12.0 255.255.255.0 Loopback100
ip route 10.200.13.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.118
 passive-interface Loopback0
 network 10.180.0.118 0.0.0.0 area 0



network 10.181.0.238 0.0.0.1 area 0
network 10.181.1.90 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_117 seq 10 permit 10.200.12.0/24
ip prefix-list PL_EXPORT_ALLOWED_117 seq 20 permit 10.200.13.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_117_0 seq 10 deny 10.181.0.238/31
!

ip prefix-list PL_EXPORT_DENY_LINK_117_1 seq 10 deny 10.181.0.240/31
!

ip prefix-list PL_EXPORT_DENY_LINK_117_2 seq 10 deny 10.181.1.90/31
!

ip prefix-list PL_EXPORT_DENY_LONG_117 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_117_0 seq 10 deny 10.180.0.118/32
!






route-map RM_POLICY_IN_117_74 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_117_74 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_117_0
 ! Block loopback 10.180.0.118/32


route-map RM_POLICY_OUT_117_74 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_117_0
 ! Block link 10.181.0.238/31


route-map RM_POLICY_OUT_117_74 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_117_1
 ! Block link 10.181.0.240/31


route-map RM_POLICY_OUT_117_74 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_117_2
 ! Block link 10.181.1.90/31


route-map RM_POLICY_OUT_117_74 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_117
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_117_74 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_117
 set metric 12
 set as-path prepend 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_117_74 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.118
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.124 peer-group RR




 !
 neighbor 10.181.0.240 peer-group EBGP
 neighbor 10.181.0.240 remote-as 65011


 !
 address-family ipv4

  neighbor 10.180.0.124 activate




  neighbor 10.181.0.240 activate
  neighbor 10.181.0.240 route-map RM_POLICY_IN_117_74 in
  neighbor 10.181.0.240 route-map RM_POLICY_OUT_117_74 out





  network 10.200.12.0 mask 255.255.255.0

  network 10.200.13.0 mask 255.255.255.0

 exit-address-family
