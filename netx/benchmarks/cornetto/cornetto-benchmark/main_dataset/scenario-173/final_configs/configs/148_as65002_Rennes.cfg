 ip address 10.200.40.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.41.0/24


 ip address 10.200.41.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.42.0/24


 ip address 10.200.42.1 255.255.255.0
!
interface Loopback103
