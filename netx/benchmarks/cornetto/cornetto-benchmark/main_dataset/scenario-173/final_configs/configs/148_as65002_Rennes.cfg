ip route 10.200.41.0 255.255.255.0 Loopback101
ip route 10.200.42.0 255.255.255.0 Loopback102
ip route 10.200.43.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.149
 passive-interface Loopback0
 network 10.180.0.149 0.0.0.0 area 0










 redistribute bgp 65002 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_148

network 10.181.1.94 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 10 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 20 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 30 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 40 permit 10.200.15.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 50 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 60 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 70 permit 10.200.20.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 80 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 90 permit 10.200.30.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 100 permit 10.200.31.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 110 permit 10.200.32.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 120 permit 10.200.44.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 130 permit 10.200.45.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 140 permit 10.200.46.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_148 seq 150 permit 10.200.47.0/24
