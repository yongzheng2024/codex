ip prefix-list PL_BGP_TO_OSPF_DENY_148 seq 10 permit 10.180.0.149/32
ip prefix-list PL_BGP_TO_OSPF_DENY_148 seq 20 permit 10.181.1.94/31
ip prefix-list PL_BGP_TO_OSPF_DENY_148 seq 30 permit 10.181.1.124/31
!

ip prefix-list PL_EXPORT_ALLOWED_148 seq 10 permit 10.200.40.0/24
ip prefix-list PL_EXPORT_ALLOWED_148 seq 20 permit 10.200.41.0/24
ip prefix-list PL_EXPORT_ALLOWED_148 seq 30 permit 10.200.42.0/24
ip prefix-list PL_EXPORT_ALLOWED_148 seq 40 permit 10.200.43.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_148_0 seq 10 deny 10.181.1.124/31
!

ip prefix-list PL_EXPORT_DENY_LINK_148_1 seq 10 deny 10.181.1.94/31
!

ip prefix-list PL_EXPORT_DENY_LONG_148 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_148_0 seq 10 deny 10.180.0.149/32
!






route-map RM_BGP_TO_OSPF_148 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_148 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_148
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_148 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_148
 set tag 65010

!


route-map RM_POLICY_OUT_148_149 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_148_0
 ! Block loopback 10.180.0.149/32


route-map RM_POLICY_OUT_148_149 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_148_0
 ! Block link 10.181.1.124/31


route-map RM_POLICY_OUT_148_149 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_148_1
 ! Block link 10.181.1.94/31


route-map RM_POLICY_OUT_148_149 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_148
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_148_149 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_148
 set community 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_148_149 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.149
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.24 peer-group RR




 !
 neighbor 10.181.1.125 peer-group EBGP
 neighbor 10.181.1.125 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.24 activate




  neighbor 10.181.1.125 activate
  neighbor 10.181.1.125 route-map RM_POLICY_OUT_148_149 out





  network 10.200.40.0 mask 255.255.255.0

  network 10.200.41.0 mask 255.255.255.0

  network 10.200.42.0 mask 255.255.255.0

  network 10.200.43.0 mask 255.255.255.0

 exit-address-family
