ip route 10.200.73.0 255.255.255.0 Loopback100
ip route 10.200.74.0 255.255.255.0 Loopback101
ip route 10.200.75.0 255.255.255.0 Loopback102
ip route 10.200.76.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.63
 passive-interface Loopback0
 network 10.180.0.63 0.0.0.0 area 0










 redistribute bgp 65005 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_62

network 10.181.0.202 0.0.0.1 area 0
network 10.181.0.206 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_62 seq 10 permit 10.200.33.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_62 seq 20 permit 10.200.34.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_62 seq 30 permit 10.200.70.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_62 seq 40 permit 10.200.71.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_62 seq 50 permit 10.200.72.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_62 seq 10 permit 10.180.0.63/32
ip prefix-list PL_BGP_TO_OSPF_DENY_62 seq 20 permit 10.181.0.202/31
ip prefix-list PL_BGP_TO_OSPF_DENY_62 seq 30 permit 10.181.0.204/31
ip prefix-list PL_BGP_TO_OSPF_DENY_62 seq 40 permit 10.181.0.206/31
!

ip prefix-list PL_EXPORT_ALLOWED_62 seq 10 permit 10.200.73.0/24
ip prefix-list PL_EXPORT_ALLOWED_62 seq 20 permit 10.200.74.0/24
ip prefix-list PL_EXPORT_ALLOWED_62 seq 30 permit 10.200.75.0/24
ip prefix-list PL_EXPORT_ALLOWED_62 seq 40 permit 10.200.76.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_62_0 seq 10 deny 10.181.0.202/31
!

ip prefix-list PL_EXPORT_DENY_LINK_62_1 seq 10 deny 10.181.0.204/31
!

ip prefix-list PL_EXPORT_DENY_LINK_62_2 seq 10 deny 10.181.0.206/31
!

ip prefix-list PL_EXPORT_DENY_LONG_62 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_62_0 seq 10 deny 10.180.0.63/32
!

ip prefix-list PL_IN_62_140 seq 10 permit 10.200.33.0/24
ip prefix-list PL_IN_62_140 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_62_140 seq 10 permit 10.200.75.0/24
ip prefix-list PL_OUT_62_140 seq 20 permit 10.200.74.0/24
!




ip community-list standard CL_COMM_62_140 permit no-advertise
ip community-list standard CL_COMM_62_140 permit no-export
!





route-map RM_BGP_TO_OSPF_62 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_62 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_62
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_62 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_62
 set tag 65010

!


route-map RM_POLICY_IN_62_140 permit 5














 match community CL_COMM_62_140
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_62_140 permit 10














 match ip address prefix-list PL_IN_62_140
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_62_140 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_62_140 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_62_140 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_62_0
 ! Block loopback 10.180.0.63/32


route-map RM_POLICY_OUT_62_140 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_62_0
 ! Block link 10.181.0.202/31


route-map RM_POLICY_OUT_62_140 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_62_1
 ! Block link 10.181.0.204/31


route-map RM_POLICY_OUT_62_140 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_62_2
 ! Block link 10.181.0.206/31


route-map RM_POLICY_OUT_62_140 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_62
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_62_140 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_62
 set community 65000:200 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_62_140 deny 200














 match ip address prefix-list PL_OUT_62_140
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_62_140 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.63
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.63


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.143 peer-group RR



 !
 neighbor 10.180.0.43 peer-group IBGP


 !
 neighbor 10.180.0.44 peer-group IBGP


 !
 neighbor 10.180.0.45 peer-group IBGP


 !
 neighbor 10.180.0.47 peer-group IBGP


 !
 neighbor 10.180.0.48 peer-group IBGP


 !
 neighbor 10.180.0.79 peer-group IBGP


 !
 neighbor 10.180.0.95 peer-group IBGP



 !
 neighbor 10.181.0.205 peer-group EBGP
 neighbor 10.181.0.205 remote-as 65010


 !
 address-family ipv4

  neighbor 10.180.0.143 activate



  neighbor 10.180.0.43 activate
  neighbor 10.180.0.43 next-hop-self


  neighbor 10.180.0.44 activate
  neighbor 10.180.0.44 next-hop-self


  neighbor 10.180.0.45 activate
  neighbor 10.180.0.45 next-hop-self


  neighbor 10.180.0.47 activate
