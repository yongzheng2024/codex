  neighbor 10.180.0.48 activate
  neighbor 10.180.0.48 next-hop-self


  neighbor 10.180.0.79 activate
  neighbor 10.180.0.79 next-hop-self


  neighbor 10.180.0.95 activate
  neighbor 10.180.0.95 next-hop-self



  neighbor 10.181.0.205 activate
  neighbor 10.181.0.205 route-map RM_POLICY_IN_62_140 in
  neighbor 10.181.0.205 route-map RM_POLICY_OUT_62_140 out





  network 10.200.73.0 mask 255.255.255.0

  network 10.200.74.0 mask 255.255.255.0

  network 10.200.75.0 mask 255.255.255.0

  network 10.200.76.0 mask 255.255.255.0

