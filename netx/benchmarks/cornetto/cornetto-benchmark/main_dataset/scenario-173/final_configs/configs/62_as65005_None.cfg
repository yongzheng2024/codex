!
interface Loopback100
 description Customer network 10.200.73.0/24


 ip address 10.200.73.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.74.0/24


 ip address 10.200.74.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.75.0/24


 ip address 10.200.75.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.76.0/24


 ip address 10.200.76.1 255.255.255.0
!



ip access-list extended ACL_62_GigabitEthernet0_1
 10 permit ip host 10.180.0.141 any
 20 permit ip host 10.181.0.204 any
 30 permit ip host 10.181.0.205 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 115_as65005_Lille (115)

 ip address 10.181.0.202 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 140_as65010_London (140)

 ip address 10.181.0.204 255.255.255.254

 ip access-group ACL_62_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 94_as65005_Ostend (94)

 ip address 10.181.0.206 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
