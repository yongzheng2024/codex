ip prefix-list PL_OUT_82_123 seq 10 permit 10.200.95.0/24
ip prefix-list PL_OUT_82_123 seq 20 permit 10.200.96.0/24
!






route-map RM_BGP_TO_OSPF_82 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_82 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_82
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_82 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_82
 set tag 65010

!


route-map RM_POLICY_IN_82_123 permit 10














 match ip address prefix-list PL_IN_82_123
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_82_123 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_82_123 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_82_0
 ! Block loopback 10.180.0.83/32


route-map RM_POLICY_OUT_82_123 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_0
 ! Block link 10.181.1.18/31


route-map RM_POLICY_OUT_82_123 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_1
 ! Block link 10.181.1.20/31


route-map RM_POLICY_OUT_82_123 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_2
 ! Block link 10.181.1.22/31


route-map RM_POLICY_OUT_82_123 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_3
 ! Block link 10.181.1.24/31


route-map RM_POLICY_OUT_82_123 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_82
 set metric 14
 set as-path prepend 65002
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_82_123 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_82
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_82_123 deny 200














 match ip address prefix-list PL_OUT_82_123
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_82_123 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.83
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.24 peer-group RR




 !
 neighbor 10.181.1.23 peer-group EBGP
 neighbor 10.181.1.23 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.24 activate




  neighbor 10.181.1.23 activate
  neighbor 10.181.1.23 route-map RM_POLICY_IN_82_123 in
  neighbor 10.181.1.23 route-map RM_POLICY_OUT_82_123 out





  network 10.200.94.0 mask 255.255.255.0

  network 10.200.95.0 mask 255.255.255.0

  network 10.200.96.0 mask 255.255.255.0

 exit-address-family
