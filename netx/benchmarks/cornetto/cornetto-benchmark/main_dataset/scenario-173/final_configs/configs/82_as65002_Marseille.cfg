!

ip prefix-list PL_IN_82_123 seq 10 permit 10.181.1.26/31
ip prefix-list PL_IN_82_123 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_82_123 seq 30 deny 0.0.0.0/0
