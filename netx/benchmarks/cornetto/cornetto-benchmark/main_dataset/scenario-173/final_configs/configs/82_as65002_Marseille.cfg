ip route 10.200.95.0 255.255.255.0 Loopback101
ip route 10.200.96.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.83
 passive-interface Loopback0
 network 10.180.0.83 0.0.0.0 area 0










 redistribute bgp 65002 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_82

network 10.181.1.18 0.0.0.1 area 0
network 10.181.1.20 0.0.0.1 area 0
network 10.181.1.24 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 10 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 20 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 30 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 40 permit 10.200.15.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 50 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 60 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 70 permit 10.200.20.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 80 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 90 permit 10.200.30.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 100 permit 10.200.31.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 110 permit 10.200.32.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 120 permit 10.200.44.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 130 permit 10.200.45.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 140 permit 10.200.46.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 150 permit 10.200.47.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_82 seq 10 permit 10.180.0.83/32
ip prefix-list PL_BGP_TO_OSPF_DENY_82 seq 20 permit 10.181.1.18/31
ip prefix-list PL_BGP_TO_OSPF_DENY_82 seq 30 permit 10.181.1.20/31
ip prefix-list PL_BGP_TO_OSPF_DENY_82 seq 40 permit 10.181.1.22/31
ip prefix-list PL_BGP_TO_OSPF_DENY_82 seq 50 permit 10.181.1.24/31
!

ip prefix-list PL_EXPORT_ALLOWED_82 seq 10 permit 10.200.94.0/24
ip prefix-list PL_EXPORT_ALLOWED_82 seq 20 permit 10.200.95.0/24
ip prefix-list PL_EXPORT_ALLOWED_82 seq 30 permit 10.200.96.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_82_0 seq 10 deny 10.181.1.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_82_1 seq 10 deny 10.181.1.20/31
!

ip prefix-list PL_EXPORT_DENY_LINK_82_2 seq 10 deny 10.181.1.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_82_3 seq 10 deny 10.181.1.24/31
!

ip prefix-list PL_EXPORT_DENY_LONG_82 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

