
hostname 30_as65008_Karlsruhe
!
interface Loopback0
 ip address 10.180.0.31 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.64.0/24


 ip address 10.200.64.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.65.0/24


 ip address 10.200.65.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.66.0/24


 ip address 10.200.66.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.67.0/24


 ip address 10.200.67.1 255.255.255.0
!



ip access-list extended ACL_30_GigabitEthernet0_1
 10 permit ip host 10.180.0.119 any
 20 permit ip host 10.181.0.106 any
 30 permit ip host 10.181.0.107 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 192.0.2.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 12_as65008_Mannheim (12)

 ip address 10.181.0.53 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 118_as65003_Strasbourg (118)

 ip address 10.181.0.106 255.255.255.254

 ip access-group ACL_30_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 119_as65008_Stuttgart (119)

 ip address 10.181.0.108 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.64.0 255.255.255.0 Loopback100
ip route 10.200.65.0 255.255.255.0 Loopback101
ip route 10.200.66.0 255.255.255.0 Loopback102
ip route 10.200.67.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.31
 passive-interface Loopback0
 network 10.180.0.31 0.0.0.0 area 0










 redistribute bgp 65008 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_30

network 10.181.0.52 0.0.0.1 area 0
network 10.181.0.108 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 10 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 20 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 30 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 40 permit 10.200.15.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 50 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 60 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 70 permit 10.200.20.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 80 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 90 permit 10.200.30.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 100 permit 10.200.31.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 110 permit 10.200.32.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 120 permit 10.200.44.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 130 permit 10.200.45.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 140 permit 10.200.46.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 150 permit 10.200.47.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_30 seq 10 permit 10.180.0.31/32
ip prefix-list PL_BGP_TO_OSPF_DENY_30 seq 20 permit 10.181.0.52/31
ip prefix-list PL_BGP_TO_OSPF_DENY_30 seq 30 permit 10.181.0.106/31
ip prefix-list PL_BGP_TO_OSPF_DENY_30 seq 40 permit 10.181.0.108/31
!

ip prefix-list PL_EXPORT_ALLOWED_30 seq 10 permit 10.200.64.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 20 permit 10.200.65.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 30 permit 10.200.66.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 40 permit 10.200.67.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_30_0 seq 10 deny 10.181.0.106/31
!

ip prefix-list PL_EXPORT_DENY_LINK_30_1 seq 10 deny 10.181.0.108/31
!

ip prefix-list PL_EXPORT_DENY_LINK_30_2 seq 10 deny 10.181.0.52/31
!

ip prefix-list PL_EXPORT_DENY_LONG_30 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_30_0 seq 10 deny 10.180.0.31/32
!




ip community-list standard CL_COMM_30_118 permit no-advertise
ip community-list standard CL_COMM_30_118 permit no-export
!





route-map RM_BGP_TO_OSPF_30 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_30 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_30
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_30 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_30
 set tag 65010

!


route-map RM_POLICY_IN_30_118 permit 5














 match community CL_COMM_30_118
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_30_118 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_30_118 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_30_118 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_30_0
 ! Block loopback 10.180.0.31/32


route-map RM_POLICY_OUT_30_118 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_0
 ! Block link 10.181.0.106/31


route-map RM_POLICY_OUT_30_118 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_1
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_30_118 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_2
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_30_118 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_30
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_30_118 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_30
 set metric 22
 set as-path prepend 65008
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_30_118 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.31
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65008
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.120 peer-group RR


 !
 neighbor 10.180.0.18 peer-group RR




 !
 neighbor 10.181.0.107 peer-group EBGP
 neighbor 10.181.0.107 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.120 activate


  neighbor 10.180.0.18 activate




  neighbor 10.181.0.107 activate
  neighbor 10.181.0.107 route-map RM_POLICY_IN_30_118 in
  neighbor 10.181.0.107 route-map RM_POLICY_OUT_30_118 out





  network 10.200.64.0 mask 255.255.255.0

  network 10.200.65.0 mask 255.255.255.0

  network 10.200.66.0 mask 255.255.255.0

  network 10.200.67.0 mask 255.255.255.0

 exit-address-family
