!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.11.0 255.255.255.0 Loopback101
ip route 10.200.8.0 255.255.255.0 Loopback102
ip route 10.200.9.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.116
 passive-interface Loopback0
 network 10.180.0.116 0.0.0.0 area 0










 redistribute bgp 65005 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_115

network 10.181.0.202 0.0.0.1 area 0
network 10.181.0.254 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 10 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 20 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 30 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 40 permit 10.200.15.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 50 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 60 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 70 permit 10.200.20.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 80 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 90 permit 10.200.30.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 100 permit 10.200.31.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 110 permit 10.200.32.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 120 permit 10.200.44.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 130 permit 10.200.45.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 140 permit 10.200.46.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_115 seq 150 permit 10.200.47.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_115 seq 10 permit 10.180.0.116/32
ip prefix-list PL_BGP_TO_OSPF_DENY_115 seq 20 permit 10.181.0.202/31
ip prefix-list PL_BGP_TO_OSPF_DENY_115 seq 30 permit 10.181.0.254/31
ip prefix-list PL_BGP_TO_OSPF_DENY_115 seq 40 permit 10.181.1.86/31
!

ip prefix-list PL_EXPORT_ALLOWED_115 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_115 seq 20 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_115 seq 30 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_115 seq 40 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_115_0 seq 10 deny 10.181.0.202/31
!

ip prefix-list PL_EXPORT_DENY_LINK_115_1 seq 10 deny 10.181.0.254/31
!

ip prefix-list PL_EXPORT_DENY_LINK_115_2 seq 10 deny 10.181.1.86/31
!

ip prefix-list PL_EXPORT_DENY_LONG_115 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_115_0 seq 10 deny 10.180.0.116/32
!






route-map RM_BGP_TO_OSPF_115 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_115 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_115
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_115 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_115
 set tag 65010

!


route-map RM_POLICY_IN_115_139 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_115_139 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_115_0
 ! Block loopback 10.180.0.116/32


route-map RM_POLICY_OUT_115_139 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_115_0
 ! Block link 10.181.0.202/31


route-map RM_POLICY_OUT_115_139 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_115_1
 ! Block link 10.181.0.254/31


route-map RM_POLICY_OUT_115_139 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_115_2
 ! Block link 10.181.1.86/31


route-map RM_POLICY_OUT_115_139 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_115
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_115_139 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_115
 set metric 29
 set as-path prepend 65005 65005 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_115_139 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.116
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.143 peer-group RR




 !
 neighbor 10.181.1.87 peer-group EBGP
 neighbor 10.181.1.87 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.143 activate




  neighbor 10.181.1.87 activate
  neighbor 10.181.1.87 route-map RM_POLICY_IN_115_139 in
  neighbor 10.181.1.87 route-map RM_POLICY_OUT_115_139 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
