
hostname 138_as65002_Turin
!
interface Loopback0
 ip address 10.180.0.139 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.26.0/24


 ip address 10.200.26.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.27.0/24


 ip address 10.200.27.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.28.0/24


 ip address 10.200.28.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 82_as65002_Marseille (82)

 ip address 10.181.1.21 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 90_as65002_Cuneo (90)

 ip address 10.181.1.41 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 152_as65001_Milan (152)

