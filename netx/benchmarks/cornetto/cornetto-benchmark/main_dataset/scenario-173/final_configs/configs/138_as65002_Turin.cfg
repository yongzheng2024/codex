!


ip route 10.200.26.0 255.255.255.0 Loopback100
ip route 10.200.27.0 255.255.255.0 Loopback101
ip route 10.200.28.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.139
 passive-interface Loopback0
 network 10.180.0.139 0.0.0.0 area 0










 redistribute bgp 65002 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_138

network 10.181.1.20 0.0.0.1 area 0
network 10.181.1.40 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_138 seq 10 permit 10.200.48.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_138 seq 20 permit 10.200.49.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_138 seq 30 permit 10.200.50.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_138 seq 40 permit 10.200.51.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_138 seq 50 permit 10.200.77.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_138 seq 60 permit 10.200.78.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_138 seq 70 permit 10.200.79.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_138 seq 80 permit 10.200.80.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_138 seq 10 permit 10.180.0.139/32
ip prefix-list PL_BGP_TO_OSPF_DENY_138 seq 20 permit 10.181.1.20/31
ip prefix-list PL_BGP_TO_OSPF_DENY_138 seq 30 permit 10.181.1.40/31
ip prefix-list PL_BGP_TO_OSPF_DENY_138 seq 40 permit 10.181.1.114/31
!

ip prefix-list PL_EXPORT_ALLOWED_138 seq 10 permit 10.200.26.0/24
ip prefix-list PL_EXPORT_ALLOWED_138 seq 20 permit 10.200.27.0/24
ip prefix-list PL_EXPORT_ALLOWED_138 seq 30 permit 10.200.28.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_138_0 seq 10 deny 10.181.1.114/31
!

ip prefix-list PL_EXPORT_DENY_LINK_138_1 seq 10 deny 10.181.1.20/31
!

ip prefix-list PL_EXPORT_DENY_LINK_138_2 seq 10 deny 10.181.1.40/31
!

ip prefix-list PL_EXPORT_DENY_LONG_138 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_138_0 seq 10 deny 10.180.0.139/32
!




ip community-list standard CL_COMM_138_152 permit 65535:65282
!





route-map RM_BGP_TO_OSPF_138 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_138 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_138
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_138 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_138
 set tag 65010

!


route-map RM_POLICY_IN_138_152 permit 5














 match community CL_COMM_138_152
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_138_152 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_138_152 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_138_152 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_138_0
 ! Block loopback 10.180.0.139/32


route-map RM_POLICY_OUT_138_152 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_138_0
 ! Block link 10.181.1.114/31


route-map RM_POLICY_OUT_138_152 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_138_1
 ! Block link 10.181.1.20/31


route-map RM_POLICY_OUT_138_152 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_138_2
 ! Block link 10.181.1.40/31


route-map RM_POLICY_OUT_138_152 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_138
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_138_152 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_138
 set metric 28
 set as-path prepend 65002 65002 65002
 set community 65000:100 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_138_152 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.139
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.24 peer-group RR




 !
 neighbor 10.181.1.115 peer-group EBGP
 neighbor 10.181.1.115 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.24 activate




  neighbor 10.181.1.115 activate
  neighbor 10.181.1.115 route-map RM_POLICY_IN_138_152 in
  neighbor 10.181.1.115 route-map RM_POLICY_OUT_138_152 out





  network 10.200.26.0 mask 255.255.255.0

  network 10.200.27.0 mask 255.255.255.0

  network 10.200.28.0 mask 255.255.255.0

 exit-address-family
