
hostname 59_as65001_HiO-Fredrikstad
!
interface Loopback0
 ip address 10.180.0.60 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 57_as65001_HiO-Halden (57)

 ip address 10.181.0.179 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 58_as65001_UMB-As (58)

 ip address 10.181.0.181 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


router ospf 1
 router-id 10.180.0.60
 passive-interface Loopback0
 network 10.180.0.60 0.0.0.0 area 0



network 10.181.0.178 0.0.0.1 area 0
network 10.181.0.180 0.0.0.1 area 0
!








router bgp 65001
 bgp router-id 10.180.0.60
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.1 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.1 activate







 exit-address-family
