network 10.181.0.36 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_50 seq 10 permit 10.200.6.0/24
ip prefix-list PL_EXPORT_ALLOWED_50 seq 20 permit 10.200.60.0/24
ip prefix-list PL_EXPORT_ALLOWED_50 seq 30 permit 10.200.61.0/24
ip prefix-list PL_EXPORT_ALLOWED_50 seq 40 permit 10.200.66.0/24
ip prefix-list PL_EXPORT_ALLOWED_50 seq 50 permit 10.200.67.0/24
