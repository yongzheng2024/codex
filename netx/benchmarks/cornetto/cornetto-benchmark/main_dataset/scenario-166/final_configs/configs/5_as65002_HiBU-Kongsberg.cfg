
hostname 5_as65002_HiBU-Kongsberg
!
interface Loopback0
 ip address 10.180.0.6 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 10_as65002_HiBU-Drammen (10)

 ip address 10.181.0.34 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 50_as65002_HiT-Notodden (50)

 ip address 10.181.0.36 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 7_as65002_HiBu-Honefoss (7)

 ip address 10.181.0.38 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.6
 passive-interface Loopback0
 network 10.180.0.6 0.0.0.0 area 0



network 10.181.0.34 0.0.0.1 area 0
network 10.181.0.36 0.0.0.1 area 0
network 10.181.0.38 0.0.0.1 area 0
!








router bgp 65002
 bgp router-id 10.180.0.6
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.6


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0



 !
 neighbor 10.180.0.12 peer-group RR



 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.11 peer-group IBGP



 !
 address-family ipv4

  neighbor 10.180.0.12 activate



  neighbor 10.180.0.5 activate
  neighbor 10.180.0.5 next-hop-self


  neighbor 10.180.0.7 activate
  neighbor 10.180.0.7 next-hop-self


  neighbor 10.180.0.8 activate
  neighbor 10.180.0.8 next-hop-self


  neighbor 10.180.0.11 activate
  neighbor 10.180.0.11 next-hop-self






 exit-address-family
