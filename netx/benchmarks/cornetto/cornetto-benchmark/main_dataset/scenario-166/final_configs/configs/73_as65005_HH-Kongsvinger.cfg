
hostname 73_as65005_HH-Kongsvinger
!
interface Loopback0
 ip address 10.180.0.74 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.81.0/24


 ip address 10.200.81.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.82.0/24


 ip address 10.200.82.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.83.0/24


 ip address 10.200.83.1 255.255.255.0
!



ip access-list extended ACL_73_GigabitEthernet0_0
 10 permit ip host 10.180.0.1 any
 20 permit ip host 10.181.0.4 any
 30 permit ip host 10.181.0.5 any
 40 deny ip 192.0.2.0 0.0.0.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 0_as65004_UiO (0)

 ip address 10.181.0.5 255.255.255.254

 ip access-group ACL_73_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 72_as65005_HH-Elverum (72)

 ip address 10.181.0.201 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.81.0 255.255.255.0 Loopback100
ip route 10.200.82.0 255.255.255.0 Loopback101
ip route 10.200.83.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.74
 passive-interface Loopback0
 network 10.180.0.74 0.0.0.0 area 0



network 10.181.0.200 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_73 seq 10 permit 10.200.81.0/24
ip prefix-list PL_EXPORT_ALLOWED_73 seq 20 permit 10.200.82.0/24
ip prefix-list PL_EXPORT_ALLOWED_73 seq 30 permit 10.200.83.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_73_0 seq 10 deny 10.181.0.200/31
!

ip prefix-list PL_EXPORT_DENY_LINK_73_1 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_73 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_73_0 seq 10 deny 10.180.0.74/32
!






route-map RM_POLICY_IN_73_0 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_73_0 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_73_0
 ! Block loopback 10.180.0.74/32


route-map RM_POLICY_OUT_73_0 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_73_0
 ! Block link 10.181.0.200/31


route-map RM_POLICY_OUT_73_0 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_73_1
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_73_0 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_73
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_73_0 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_73
 set metric 22
 set as-path prepend 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_73_0 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.74
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.3 peer-group RR




 !
 neighbor 10.181.0.4 peer-group EBGP
 neighbor 10.181.0.4 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.3 activate




  neighbor 10.181.0.4 activate
  neighbor 10.181.0.4 route-map RM_POLICY_IN_73_0 in
  neighbor 10.181.0.4 route-map RM_POLICY_OUT_73_0 out





  network 10.200.81.0 mask 255.255.255.0

  network 10.200.82.0 mask 255.255.255.0

  network 10.200.83.0 mask 255.255.255.0

 exit-address-family
