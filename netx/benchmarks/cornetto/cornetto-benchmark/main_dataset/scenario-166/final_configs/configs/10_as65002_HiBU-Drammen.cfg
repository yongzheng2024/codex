route-map RM_POLICY_IN_10_3 permit 10














 match ip address prefix-list PL_IN_10_3
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_10_3 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_10_3 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_3 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_10_3 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.34/31


