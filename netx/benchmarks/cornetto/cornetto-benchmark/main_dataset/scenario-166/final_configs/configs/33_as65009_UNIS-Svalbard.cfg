 set as-path prepend 65009 65009 65009
 set community no-advertise no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_33_29 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_4
