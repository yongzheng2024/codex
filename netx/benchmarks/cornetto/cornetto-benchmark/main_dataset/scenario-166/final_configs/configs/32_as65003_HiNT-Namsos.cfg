ip community-list standard CL_COMM_32_34 permit 65535:65282
ip community-list standard CL_COMM_32_34 permit no-advertise
!





route-map RM_POLICY_IN_32_34 permit 5














 match community CL_COMM_32_34
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_32_34 permit 10














 match ip address prefix-list PL_IN_32_34
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_32_34 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_32_34 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_32_34 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_32_0
 ! Block loopback 10.180.0.33/32


route-map RM_POLICY_OUT_32_34 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_0
 ! Block link 10.181.0.122/31


route-map RM_POLICY_OUT_32_34 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_1
 ! Block link 10.181.0.124/31


route-map RM_POLICY_OUT_32_34 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_32
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_32_34 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_32
 set metric 29
 set as-path prepend 65003 65003 65003
 set community 65000:200 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_32_34 deny 200














 match ip address prefix-list PL_OUT_32_34
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_32_34 deny 65000














 ! Deny other outbound routes

