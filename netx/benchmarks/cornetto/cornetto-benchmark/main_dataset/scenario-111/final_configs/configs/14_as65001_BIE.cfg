 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_14_27 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_14
 set community no-advertise no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_14_27 deny 200














 match ip address prefix-list PL_OUT_14_27
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_14_27 deny 65000














