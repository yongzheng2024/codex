route-map RM_POLICY_IN_14_27 permit 10














 match ip address prefix-list PL_IN_14_27
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_14_27 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_14_27 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_14_0
 ! Block loopback 10.180.0.15/32


route-map RM_POLICY_OUT_14_27 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_0
 ! Block link 10.181.0.44/31


route-map RM_POLICY_OUT_14_27 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_1
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_14_27 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_2
 ! Block link 10.181.0.48/31


