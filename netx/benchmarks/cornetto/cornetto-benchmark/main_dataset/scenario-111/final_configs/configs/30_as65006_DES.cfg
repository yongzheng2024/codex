
hostname 30_as65006_DES
!
interface Loopback0
 ip address 10.180.0.31 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!



ip access-list extended ACL_30_GigabitEthernet0_0
 10 permit ip host 10.180.0.49 any
 20 permit ip host 10.181.0.90 any
 30 permit ip host 10.181.0.91 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_30_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.31 any
 20 permit ip host 10.181.0.90 any
 30 permit ip host 10.181.0.92 any
 40 permit ip 10.181.0.90 0.0.0.1 any
 50 permit ip 10.181.0.92 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 48_as65004_TUB (48)

 ip address 10.181.0.90 255.255.255.254

 ip access-group ACL_30_GigabitEthernet0_0 in

 ip access-group ACL_30_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 31_as65006_HAM (31)

 ip address 10.181.0.92 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.21.0 255.255.255.0 Loopback100
ip route 10.200.22.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.ee00.0000.0ab4.001f.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_30 seq 10 permit 10.200.21.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 20 permit 10.200.22.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_30_0 seq 10 deny 10.181.0.90/31
!

ip prefix-list PL_EXPORT_DENY_LINK_30_1 seq 10 deny 10.181.0.92/31
!

ip prefix-list PL_EXPORT_DENY_LONG_30 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_30_0 seq 10 deny 10.180.0.31/32
!




ip community-list standard CL_COMM_30_48 permit 65535:65282
ip community-list standard CL_COMM_30_48 permit no-advertise
!





route-map RM_POLICY_IN_30_48 permit 5














 match community CL_COMM_30_48
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_30_48 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_30_48 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_30_0
 ! Block loopback 10.180.0.31/32


route-map RM_POLICY_OUT_30_48 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_0
 ! Block link 10.181.0.90/31


route-map RM_POLICY_OUT_30_48 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_1
 ! Block link 10.181.0.92/31


route-map RM_POLICY_OUT_30_48 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_30
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_30_48 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_30
 set community no-advertise no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_30_48 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.31
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP


 !
 neighbor 10.180.0.32 peer-group IBGP



 !
 neighbor 10.181.0.91 peer-group EBGP
 neighbor 10.181.0.91 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.26 activate


  neighbor 10.180.0.28 activate


  neighbor 10.180.0.32 activate



  neighbor 10.181.0.91 activate
  neighbor 10.181.0.91 route-map RM_POLICY_IN_30_48 in
  neighbor 10.181.0.91 route-map RM_POLICY_OUT_30_48 out





  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

 exit-address-family
