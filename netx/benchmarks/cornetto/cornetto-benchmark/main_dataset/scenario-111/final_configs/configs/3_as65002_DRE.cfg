
hostname 3_as65002_DRE
!
interface Loopback0
 ip address 10.180.0.4 255.255.255.255





 ip router isis 1

!
interface Loopback100
 description Customer network 10.200.17.0/24


 ip address 10.200.17.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.18.0/24


 ip address 10.200.18.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.19.0/24


 ip address 10.200.19.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.20.0/24


 ip address 10.200.20.1 255.255.255.0
!



ip access-list extended ACL_3_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.4 any
 20 permit ip host 10.181.0.3 any
 30 permit ip host 10.181.0.14 any
 40 permit ip host 10.181.0.16 any
 50 permit ip 10.181.0.14 0.0.0.1 any
 60 permit ip 10.181.0.2 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 0_as65002_CHE (0)

 ip address 10.181.0.3 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 52_as65004_POT (52)

 ip address 10.181.0.14 255.255.255.254

 ip access-group ACL_3_GigabitEthernet0_1_OUT out
 mtu 1500
!
interface GigabitEthernet0/2
 description to 53_as65002_ERL (53)

 ip address 10.181.0.16 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.17.0 255.255.255.0 Loopback100
ip route 10.200.18.0 255.255.255.0 Loopback101
ip route 10.200.19.0 255.255.255.0 Loopback102
ip route 10.200.20.0 255.255.255.0 Loopback103
!

router isis 1
 net 31.ea01.0000.0ab4.0004.00
 is-type level-1-2
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_3 seq 10 permit 10.200.17.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 20 permit 10.200.18.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 30 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 40 permit 10.200.20.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_3_0 seq 10 deny 10.181.0.14/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_1 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_2 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LONG_3 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_3_0 seq 10 deny 10.180.0.4/32
!

ip prefix-list PL_IN_3_52 seq 10 permit 10.200.50.0/24
ip prefix-list PL_IN_3_52 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_3_52 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_3_52 seq 10 permit 10.200.18.0/24
ip prefix-list PL_OUT_3_52 seq 20 permit 10.200.17.0/24
!






route-map RM_POLICY_IN_3_52 permit 10














 match ip address prefix-list PL_IN_3_52
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_3_52 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_3_52 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_52 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_3_52 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_3_52 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_2
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_3_52 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_52 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_3
 set metric 28
 set as-path prepend 65002
 set community 65000:200 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_3_52 deny 200














 match ip address prefix-list PL_OUT_3_52
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_3_52 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.54 peer-group RR




 !
 neighbor 10.181.0.15 peer-group EBGP
 neighbor 10.181.0.15 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.54 activate




  neighbor 10.181.0.15 activate
  neighbor 10.181.0.15 route-map RM_POLICY_IN_3_52 in
  neighbor 10.181.0.15 route-map RM_POLICY_OUT_3_52 out





  network 10.200.17.0 mask 255.255.255.0

  network 10.200.18.0 mask 255.255.255.0

  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

 exit-address-family
