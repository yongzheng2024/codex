 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_47_53 permit 10














 match ip address prefix-list PL_IN_47_53
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_47_53 deny 20














