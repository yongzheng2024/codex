 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_47_53 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_47
 set metric 25
 set as-path prepend 65003
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_47_53 deny 200














 match ip address prefix-list PL_OUT_47_53
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_47_53 deny 65000














