!


ip route 10.200.23.0 255.255.255.0 Loopback100
ip route 10.200.24.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.e900.0000.0ab4.0023.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_34 seq 10 permit 10.200.23.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 20 permit 10.200.24.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_34_0 seq 10 deny 10.181.0.102/31
!

ip prefix-list PL_EXPORT_DENY_LINK_34_1 seq 10 deny 10.181.0.104/31
!

ip prefix-list PL_EXPORT_DENY_LONG_34 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_34_0 seq 10 deny 10.180.0.35/32
!






route-map RM_POLICY_IN_34_52 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_34_52 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_34_0
 ! Block loopback 10.180.0.35/32


route-map RM_POLICY_OUT_34_52 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_0
 ! Block link 10.181.0.102/31


route-map RM_POLICY_OUT_34_52 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_1
 ! Block link 10.181.0.104/31


route-map RM_POLICY_OUT_34_52 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_34
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_34_52 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_34
 set metric 30
 set as-path prepend 65001 65001
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_34_52 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.35
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.15 peer-group RR


 !
 neighbor 10.180.0.51 peer-group RR




 !
 neighbor 10.181.0.105 peer-group EBGP
 neighbor 10.181.0.105 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.15 activate


  neighbor 10.180.0.51 activate




  neighbor 10.181.0.105 activate
  neighbor 10.181.0.105 route-map RM_POLICY_IN_34_52 in
  neighbor 10.181.0.105 route-map RM_POLICY_OUT_34_52 out





  network 10.200.23.0 mask 255.255.255.0

  network 10.200.24.0 mask 255.255.255.0

 exit-address-family
