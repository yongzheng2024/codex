
hostname 34_as65001_MAG
!
interface Loopback0
 ip address 10.180.0.35 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.23.0/24


 ip address 10.200.23.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.24.0/24


 ip address 10.200.24.1 255.255.255.0
!



ip access-list extended ACL_34_GigabitEthernet0_1
 10 permit ip host 10.180.0.53 any
 20 permit ip host 10.181.0.104 any
 30 permit ip host 10.181.0.105 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_34_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.35 any
 20 permit ip host 10.181.0.102 any
 30 permit ip host 10.181.0.104 any
 40 permit ip 10.181.0.102 0.0.0.1 any
 50 permit ip 10.181.0.104 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 35_as65001_BRA (35)

 ip address 10.181.0.102 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 52_as65004_POT (52)

 ip address 10.181.0.104 255.255.255.254

 ip access-group ACL_34_GigabitEthernet0_1 in

 ip access-group ACL_34_GigabitEthernet0_1_OUT out
