!
interface GigabitEthernet0/1
 description to 52_as65004_POT (52)

 ip address 10.181.0.165 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 56_as65004_ZIB (56)

 ip address 10.181.0.170 255.255.255.254








