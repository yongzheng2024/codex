ip access-list extended ACL_55_GigabitEthernet0_0
 10 permit ip host 10.180.0.51 any
 20 permit ip host 10.181.0.154 any
 30 permit ip host 10.181.0.155 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
