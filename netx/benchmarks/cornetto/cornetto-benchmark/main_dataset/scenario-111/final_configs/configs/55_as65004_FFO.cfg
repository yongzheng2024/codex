ip prefix-list PL_EXPORT_ALLOWED_55 seq 10 permit 10.200.61.0/24
ip prefix-list PL_EXPORT_ALLOWED_55 seq 20 permit 10.200.62.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_55_0 seq 10 deny 10.181.0.154/31
!

ip prefix-list PL_EXPORT_DENY_LINK_55_1 seq 10 deny 10.181.0.164/31
!

ip prefix-list PL_EXPORT_DENY_LINK_55_2 seq 10 deny 10.181.0.170/31
!

ip prefix-list PL_EXPORT_DENY_LONG_55 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_55_0 seq 10 deny 10.180.0.56/32
