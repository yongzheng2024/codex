!

ip prefix-list PL_OUT_55_50 seq 10 permit 10.200.62.0/24
ip prefix-list PL_OUT_55_50 seq 20 permit 10.200.61.0/24
!






route-map RM_POLICY_IN_55_50 permit 10














 match ip address prefix-list PL_IN_55_50
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_55_50 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_55_50 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_55_0
 ! Block loopback 10.180.0.56/32


route-map RM_POLICY_OUT_55_50 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_55_0
 ! Block link 10.181.0.154/31


route-map RM_POLICY_OUT_55_50 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_55_1
 ! Block link 10.181.0.164/31


route-map RM_POLICY_OUT_55_50 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_55_2
 ! Block link 10.181.0.170/31


route-map RM_POLICY_OUT_55_50 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_55
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_55_50 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_55
 set community 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_55_50 deny 200














 match ip address prefix-list PL_OUT_55_50
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_55_50 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.56
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



