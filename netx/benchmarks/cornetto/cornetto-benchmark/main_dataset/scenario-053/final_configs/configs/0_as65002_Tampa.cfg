ip community-list standard CL_COMM_0_8 permit 65535:65282
ip community-list standard CL_COMM_0_8 permit no-advertise
!





route-map RM_POLICY_IN_0_8 permit 5














 match community CL_COMM_0_8
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_0_8 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_0_8 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_0_8 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_0_0
 ! Block loopback 10.180.0.1/32


route-map RM_POLICY_OUT_0_8 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_0_8 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_1
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_0_8 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_2
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_0_8 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_3
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_0_8 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_0
 set metric 14
 set as-path prepend 65002 65002
 set community 65000:200 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_0_8 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_4
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_0_8 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_5
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_0_8 deny 130














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_6
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_0_8 deny 140














 match ip address prefix-list PL_EXPORT_DENY_LONG_0
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_0_8 deny 65000














 ! Deny other outbound routes

!







