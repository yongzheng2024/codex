 address-family ipv4


  neighbor 10.180.0.22 activate


  neighbor 10.180.0.25 activate


  neighbor 10.180.0.26 activate


  neighbor 10.180.0.27 activate


  neighbor 10.180.0.28 activate


  neighbor 10.180.0.29 activate


  neighbor 10.180.0.30 activate


  neighbor 10.180.0.92 activate


