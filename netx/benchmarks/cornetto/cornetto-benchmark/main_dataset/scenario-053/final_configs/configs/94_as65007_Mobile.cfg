
hostname 94_as65007_Mobile
!
interface Loopback0
 ip address 10.180.0.95 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.90.0/24


 ip address 10.200.90.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.91.0/24


 ip address 10.200.91.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.92.0/24


 ip address 10.200.92.1 255.255.255.0
!



ip access-list extended ACL_94_GigabitEthernet0_2_OUT
 10 permit ip host 10.180.0.95 any
 20 permit ip host 10.181.0.221 any
 30 permit ip host 10.181.1.81 any
 40 permit ip host 10.181.1.82 any
 50 permit ip 10.181.0.220 0.0.0.1 any
 60 permit ip 10.181.1.80 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 55_as65007_Montgomery (55)

 ip address 10.181.0.221 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 93_as65007_Pensacola (93)

 ip address 10.181.1.81 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 95_as65004_Gulfport (95)

 ip address 10.181.1.82 255.255.255.254

 ip access-group ACL_94_GigabitEthernet0_2_OUT out
 mtu 1500
!


ip route 10.200.90.0 255.255.255.0 Loopback100
ip route 10.200.91.0 255.255.255.0 Loopback101
ip route 10.200.92.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.95
 passive-interface Loopback0
 network 10.180.0.95 0.0.0.0 area 0



network 10.181.0.220 0.0.0.1 area 0
network 10.181.1.80 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_94 seq 10 permit 10.200.90.0/24
ip prefix-list PL_EXPORT_ALLOWED_94 seq 20 permit 10.200.91.0/24
ip prefix-list PL_EXPORT_ALLOWED_94 seq 30 permit 10.200.92.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_94_0 seq 10 deny 10.181.0.220/31
!

ip prefix-list PL_EXPORT_DENY_LINK_94_1 seq 10 deny 10.181.1.80/31
!

ip prefix-list PL_EXPORT_DENY_LINK_94_2 seq 10 deny 10.181.1.82/31
!

ip prefix-list PL_EXPORT_DENY_LONG_94 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_94_0 seq 10 deny 10.180.0.95/32
!






route-map RM_POLICY_OUT_94_95 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_94_0
 ! Block loopback 10.180.0.95/32


route-map RM_POLICY_OUT_94_95 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_94_0
 ! Block link 10.181.0.220/31


route-map RM_POLICY_OUT_94_95 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_94_1
 ! Block link 10.181.1.80/31


route-map RM_POLICY_OUT_94_95 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_94_2
 ! Block link 10.181.1.82/31


route-map RM_POLICY_OUT_94_95 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_94
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_94_95 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_94
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_94_95 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.95
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65007
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.55 peer-group IBGP


 !
 neighbor 10.180.0.56 peer-group IBGP


 !
 neighbor 10.180.0.88 peer-group IBGP


 !
 neighbor 10.180.0.89 peer-group IBGP


 !
 neighbor 10.180.0.91 peer-group IBGP


 !
 neighbor 10.180.0.94 peer-group IBGP


 !
 neighbor 10.180.0.112 peer-group IBGP



 !
 neighbor 10.181.1.83 peer-group EBGP
 neighbor 10.181.1.83 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.3 activate


  neighbor 10.180.0.55 activate


  neighbor 10.180.0.56 activate


  neighbor 10.180.0.88 activate


  neighbor 10.180.0.89 activate


  neighbor 10.180.0.91 activate


  neighbor 10.180.0.94 activate


  neighbor 10.180.0.112 activate



  neighbor 10.181.1.83 activate
  neighbor 10.181.1.83 route-map RM_POLICY_OUT_94_95 out





  network 10.200.90.0 mask 255.255.255.0

  network 10.200.91.0 mask 255.255.255.0

  network 10.200.92.0 mask 255.255.255.0

 exit-address-family
