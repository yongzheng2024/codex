
hostname 18_as65010_Rocky-Mount
!
interface Loopback0
 ip address 10.180.0.19 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!



ip access-list extended ACL_18_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.19 any
 20 permit ip host 10.181.0.90 any
 30 permit ip host 10.181.0.92 any
 40 permit ip 10.181.0.90 0.0.0.1 any
 50 permit ip 10.181.0.92 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 35_as65010_Norfolk (35)

 ip address 10.181.0.90 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 19_as65009_Raleigh (19)

 ip address 10.181.0.92 255.255.255.254

 ip access-group ACL_18_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.7.0 255.255.255.0 Loopback100
ip route 10.200.8.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.19
 passive-interface Loopback0
 network 10.180.0.19 0.0.0.0 area 0



network 10.181.0.90 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_18 seq 10 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_18 seq 20 permit 10.200.8.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_18_0 seq 10 deny 10.181.0.90/31
!

ip prefix-list PL_EXPORT_DENY_LINK_18_1 seq 10 deny 10.181.0.92/31
!

ip prefix-list PL_EXPORT_DENY_LONG_18 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_18_0 seq 10 deny 10.180.0.19/32
!

ip prefix-list PL_IN_18_19 seq 10 permit 10.200.9.0/24
ip prefix-list PL_IN_18_19 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_18_19 seq 10 permit 10.200.7.0/24
ip prefix-list PL_OUT_18_19 seq 20 permit 10.200.8.0/24
!






route-map RM_POLICY_IN_18_19 permit 10














 match ip address prefix-list PL_IN_18_19
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_18_19 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_18_19 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_18_0
 ! Block loopback 10.180.0.19/32


route-map RM_POLICY_OUT_18_19 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_18_0
 ! Block link 10.181.0.90/31


route-map RM_POLICY_OUT_18_19 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_18_1
 ! Block link 10.181.0.92/31


route-map RM_POLICY_OUT_18_19 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_18
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_18_19 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_18
 set metric 8
 set as-path prepend 65010
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_18_19 deny 200














 match ip address prefix-list PL_OUT_18_19
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_18_19 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.19
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65010
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.33 peer-group IBGP


 !
 neighbor 10.180.0.34 peer-group IBGP


 !
 neighbor 10.180.0.35 peer-group IBGP


 !
 neighbor 10.180.0.36 peer-group IBGP


 !
 neighbor 10.180.0.39 peer-group IBGP


 !
 neighbor 10.180.0.40 peer-group IBGP



 !
 neighbor 10.181.0.93 peer-group EBGP
 neighbor 10.181.0.93 remote-as 65009


 !
 address-family ipv4


  neighbor 10.180.0.33 activate


  neighbor 10.180.0.34 activate


  neighbor 10.180.0.35 activate


  neighbor 10.180.0.36 activate


  neighbor 10.180.0.39 activate


  neighbor 10.180.0.40 activate



  neighbor 10.181.0.93 activate
  neighbor 10.181.0.93 route-map RM_POLICY_IN_18_19 in
  neighbor 10.181.0.93 route-map RM_POLICY_OUT_18_19 out





  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

 exit-address-family
