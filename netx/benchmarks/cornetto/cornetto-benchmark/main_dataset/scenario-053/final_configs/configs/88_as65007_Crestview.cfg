 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_88_3 permit 10














 match ip address prefix-list PL_IN_88_3
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_88_3 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_88_3 permit 1000














 ! Default permit for other communities

