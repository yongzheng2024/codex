 match ip address prefix-list PL_EXPORT_DENY_LONG_88
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_88_3 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_88
 set metric 5
 set as-path prepend 65007
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_88_3 deny 200














 match ip address prefix-list PL_OUT_88_3
