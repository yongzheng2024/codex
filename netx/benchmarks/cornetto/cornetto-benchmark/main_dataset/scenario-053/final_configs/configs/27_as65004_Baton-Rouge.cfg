route-map RM_POLICY_IN_27_83 permit 10














 match ip address prefix-list PL_IN_27_83
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_27_83 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_27_83 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_27_0
 ! Block loopback 10.180.0.28/32


route-map RM_POLICY_OUT_27_83 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_0
 ! Block link 10.181.0.116/31


route-map RM_POLICY_OUT_27_83 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_1
 ! Block link 10.181.0.128/31


route-map RM_POLICY_OUT_27_83 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_27
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_27_83 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_27
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_27_83 deny 200














 match ip address prefix-list PL_OUT_27_83
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_27_83 deny 65000














 ! Deny other outbound routes

!







