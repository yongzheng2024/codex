ip prefix-list PL_IN_27_83 seq 30 permit 10.200.71.0/24
ip prefix-list PL_IN_27_83 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_27_83 seq 50 deny 0.0.0.0/0
