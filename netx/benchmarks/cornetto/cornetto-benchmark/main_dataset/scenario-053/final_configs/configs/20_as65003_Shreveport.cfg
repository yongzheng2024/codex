
hostname 20_as65003_Shreveport
!
interface Loopback0
 ip address 10.180.0.21 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.12.0/24


 ip address 10.200.12.1 255.255.255.0
!



ip access-list extended ACL_20_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.21 any
 20 permit ip host 10.181.0.102 any
 30 permit ip host 10.181.0.104 any
 40 permit ip host 10.181.0.106 any
 50 permit ip 10.181.0.102 0.0.0.1 any
 60 permit ip 10.181.0.106 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 21_as65004_Monroe (21)

 ip address 10.181.0.102 255.255.255.254

 ip access-group ACL_20_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 22_as65003_Alexandria (22)

 ip address 10.181.0.104 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 23_as65003_Longview (23)

 ip address 10.181.0.106 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.11.0 255.255.255.0 Loopback100
ip route 10.200.12.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.21
 passive-interface Loopback0
 network 10.180.0.21 0.0.0.0 area 0



network 10.181.0.104 0.0.0.1 area 0
network 10.181.0.106 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_20 seq 10 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 20 permit 10.200.12.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_20_0 seq 10 deny 10.181.0.102/31
!

ip prefix-list PL_EXPORT_DENY_LINK_20_1 seq 10 deny 10.181.0.104/31
!

ip prefix-list PL_EXPORT_DENY_LINK_20_2 seq 10 deny 10.181.0.106/31
!

ip prefix-list PL_EXPORT_DENY_LONG_20 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_20_0 seq 10 deny 10.180.0.21/32
!






route-map RM_POLICY_OUT_20_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_20_0
 ! Block loopback 10.180.0.21/32


route-map RM_POLICY_OUT_20_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_0
 ! Block link 10.181.0.102/31


route-map RM_POLICY_OUT_20_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_1
 ! Block link 10.181.0.104/31


route-map RM_POLICY_OUT_20_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_2
 ! Block link 10.181.0.106/31


route-map RM_POLICY_OUT_20_21 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_20
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_20_21 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_20
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_20_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.21
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.21


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.59 peer-group RR



 !
 neighbor 10.180.0.23 peer-group IBGP


 !
 neighbor 10.180.0.24 peer-group IBGP


 !
 neighbor 10.180.0.62 peer-group IBGP


 !
 neighbor 10.180.0.83 peer-group IBGP


 !
 neighbor 10.180.0.107 peer-group IBGP


 !
 neighbor 10.180.0.108 peer-group IBGP


 !
 neighbor 10.180.0.110 peer-group IBGP


 !
 neighbor 10.180.0.111 peer-group IBGP



 !
 neighbor 10.181.0.103 peer-group EBGP
 neighbor 10.181.0.103 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.59 activate



  neighbor 10.180.0.23 activate
  neighbor 10.180.0.23 next-hop-self


  neighbor 10.180.0.24 activate
  neighbor 10.180.0.24 next-hop-self


  neighbor 10.180.0.62 activate
  neighbor 10.180.0.62 next-hop-self


  neighbor 10.180.0.83 activate
  neighbor 10.180.0.83 next-hop-self


  neighbor 10.180.0.107 activate
  neighbor 10.180.0.107 next-hop-self


  neighbor 10.180.0.108 activate
  neighbor 10.180.0.108 next-hop-self


  neighbor 10.180.0.110 activate
  neighbor 10.180.0.110 next-hop-self


  neighbor 10.180.0.111 activate
  neighbor 10.180.0.111 next-hop-self



  neighbor 10.181.0.103 activate
  neighbor 10.181.0.103 route-map RM_POLICY_OUT_20_21 out





  network 10.200.11.0 mask 255.255.255.0

  network 10.200.12.0 mask 255.255.255.0

 exit-address-family
