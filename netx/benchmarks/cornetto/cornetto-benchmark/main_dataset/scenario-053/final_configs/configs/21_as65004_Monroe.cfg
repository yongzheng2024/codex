  neighbor 10.180.0.92 activate


  neighbor 10.180.0.93 activate


  neighbor 10.180.0.96 activate


  neighbor 10.180.0.97 activate



  neighbor 10.181.0.102 activate
  neighbor 10.181.0.102 route-map RM_POLICY_IN_21_20 in
  neighbor 10.181.0.102 route-map RM_POLICY_OUT_21_20 out





  network 10.200.13.0 mask 255.255.255.0

  network 10.200.14.0 mask 255.255.255.0

 exit-address-family
