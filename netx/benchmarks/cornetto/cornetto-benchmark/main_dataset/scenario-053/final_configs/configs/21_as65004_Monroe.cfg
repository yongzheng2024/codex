
hostname 21_as65004_Monroe
!
interface Loopback0
 ip address 10.180.0.22 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.13.0/24


 ip address 10.200.13.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.14.0/24


 ip address 10.200.14.1 255.255.255.0
!



ip access-list extended ACL_21_GigabitEthernet0_0
 10 permit ip host 10.180.0.21 any
 20 permit ip host 10.181.0.102 any
 30 permit ip host 10.181.0.103 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_21_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.22 any
 20 permit ip host 10.181.0.103 any
 30 permit ip host 10.181.0.108 any
 40 permit ip 10.181.0.102 0.0.0.1 any
 50 permit ip 10.181.0.108 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 20_as65003_Shreveport (20)

 ip address 10.181.0.103 255.255.255.254

 ip access-group ACL_21_GigabitEthernet0_0 in

 ip access-group ACL_21_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 26_as65004_Vicksburg (26)

 ip address 10.181.0.108 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.13.0 255.255.255.0 Loopback100
ip route 10.200.14.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.22
 passive-interface Loopback0
 network 10.180.0.22 0.0.0.0 area 0



network 10.181.0.108 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_21 seq 10 permit 10.200.13.0/24
ip prefix-list PL_EXPORT_ALLOWED_21 seq 20 permit 10.200.14.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_21_0 seq 10 deny 10.181.0.102/31
!

ip prefix-list PL_EXPORT_DENY_LINK_21_1 seq 10 deny 10.181.0.108/31
!

ip prefix-list PL_EXPORT_DENY_LONG_21 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_21_0 seq 10 deny 10.180.0.22/32
!

ip prefix-list PL_IN_21_20 seq 10 permit 10.181.0.106/31
ip prefix-list PL_IN_21_20 seq 20 permit 10.181.0.104/31
ip prefix-list PL_IN_21_20 seq 30 permit 10.181.0.102/31
ip prefix-list PL_IN_21_20 seq 40 permit 10.200.12.0/24
ip prefix-list PL_IN_21_20 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_21_20 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_21_20 seq 10 permit 10.200.14.0/24
!






route-map RM_POLICY_IN_21_20 permit 10














 match ip address prefix-list PL_IN_21_20
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_21_20 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_21_20 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_21_0
 ! Block loopback 10.180.0.22/32


route-map RM_POLICY_OUT_21_20 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_0
 ! Block link 10.181.0.102/31


route-map RM_POLICY_OUT_21_20 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_1
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_21_20 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_21
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_21_20 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_21
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_21_20 deny 200














 match ip address prefix-list PL_OUT_21_20
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_21_20 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.22
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.25 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP


 !
 neighbor 10.180.0.29 peer-group IBGP


 !
 neighbor 10.180.0.30 peer-group IBGP


