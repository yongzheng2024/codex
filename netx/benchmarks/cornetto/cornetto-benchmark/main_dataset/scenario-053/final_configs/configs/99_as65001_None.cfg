 10 permit ip host 10.180.0.100 any
 20 permit ip host 10.181.1.89 any
 30 permit ip host 10.181.1.90 any
 40 permit ip host 10.181.1.92 any
 50 permit ip 10.181.1.90 0.0.0.1 any
 60 permit ip 10.181.1.92 0.0.0.1 any
