ip prefix-list PL_OUT_99_104 seq 10 permit 10.200.104.0/24
!




ip community-list standard CL_COMM_99_104 permit no-advertise
ip community-list standard CL_COMM_99_104 permit no-export
!





route-map RM_POLICY_IN_99_104 permit 5














 match community CL_COMM_99_104
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_99_104 permit 10














 match ip address prefix-list PL_IN_99_104
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_99_104 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_99_104 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_99_104 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_99_0
 ! Block loopback 10.180.0.100/32


route-map RM_POLICY_OUT_99_104 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_99_0
 ! Block link 10.181.1.88/31


route-map RM_POLICY_OUT_99_104 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_99_1
 ! Block link 10.181.1.90/31


route-map RM_POLICY_OUT_99_104 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_99_2
 ! Block link 10.181.1.92/31


route-map RM_POLICY_OUT_99_104 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_99
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_99_104 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_99
 set community 65000:100 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_99_104 deny 200














 match ip address prefix-list PL_OUT_99_104
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_99_104 deny 65000














 ! Deny other outbound routes

!







