 router-id 10.180.0.33
 passive-interface Loopback0
 network 10.180.0.33 0.0.0.0 area 0



network 10.181.0.150 0.0.0.1 area 0
network 10.181.0.152 0.0.0.1 area 0
!








router bgp 65010
 bgp router-id 10.180.0.33
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65010
 neighbor IBGP update-source Loopback0




 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.34 peer-group IBGP


 !
 neighbor 10.180.0.35 peer-group IBGP


 !
 neighbor 10.180.0.36 peer-group IBGP


 !
 neighbor 10.180.0.39 peer-group IBGP


 !
 neighbor 10.180.0.40 peer-group IBGP



 !
 address-family ipv4


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.34 activate


  neighbor 10.180.0.35 activate


  neighbor 10.180.0.36 activate


  neighbor 10.180.0.39 activate


  neighbor 10.180.0.40 activate






