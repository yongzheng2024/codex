!

ip prefix-list PL_EXPORT_DENY_LINK_101_1 seq 10 deny 10.181.1.28/31
!

ip prefix-list PL_EXPORT_DENY_LONG_101 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_101_0 seq 10 deny 10.180.0.102/32
!






route-map RM_POLICY_OUT_101_108 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_101_0
 ! Block loopback 10.180.0.102/32


route-map RM_POLICY_OUT_101_108 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_101_0
 ! Block link 10.181.1.24/31


route-map RM_POLICY_OUT_101_108 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_101_1
 ! Block link 10.181.1.28/31


route-map RM_POLICY_OUT_101_108 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_101
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_101_108 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_101
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_101_108 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.102
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.92 peer-group RR




 !
 neighbor 10.181.1.29 peer-group EBGP
 neighbor 10.181.1.29 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.92 activate




  neighbor 10.181.1.29 activate





  network 10.180.0.102 mask 255.255.255.255

  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

