!






route-map RM_POLICY_OUT_109_7 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_109_0
 ! Block loopback 10.180.0.110/32


route-map RM_POLICY_OUT_109_7 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_109_0
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_109_7 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_109_1
 ! Block link 10.181.0.244/31


route-map RM_POLICY_OUT_109_7 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_109_2
 ! Block link 10.181.1.42/31


route-map RM_POLICY_OUT_109_7 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_109
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_109_7 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_109
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_109_7 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.110
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.19 peer-group RR




 !
 neighbor 10.181.0.24 peer-group EBGP
 neighbor 10.181.0.24 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.19 activate




  neighbor 10.181.0.24 activate
  neighbor 10.181.0.24 route-map RM_POLICY_OUT_109_7 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
