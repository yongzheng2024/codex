ip access-list extended ACL_132_GigabitEthernet0_1
 10 permit ip host 10.180.0.134 any
 20 permit ip host 10.181.1.80 any
 30 permit ip host 10.181.1.81 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 2_as65010_Darien (2)

 ip address 10.181.0.9 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 133_as65007_Savannah (133)

 ip address 10.181.1.80 255.255.255.254

 ip access-group ACL_132_GigabitEthernet0_1 in
