ip route 10.200.31.0 255.255.255.0 Loopback100
ip route 10.200.32.0 255.255.255.0 Loopback101
ip route 10.200.33.0 255.255.255.0 Loopback102
ip route 10.200.34.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.133
 passive-interface Loopback0
 network 10.180.0.133 0.0.0.0 area 0



network 10.181.0.8 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_132 seq 10 permit 10.200.31.0/24
ip prefix-list PL_EXPORT_ALLOWED_132 seq 20 permit 10.200.32.0/24
ip prefix-list PL_EXPORT_ALLOWED_132 seq 30 permit 10.200.33.0/24
ip prefix-list PL_EXPORT_ALLOWED_132 seq 40 permit 10.200.34.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_132_0 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LINK_132_1 seq 10 deny 10.181.1.80/31
!

ip prefix-list PL_EXPORT_DENY_LONG_132 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_132_0 seq 10 deny 10.180.0.133/32
!




ip community-list standard CL_COMM_132_133 permit no-export
!





route-map RM_POLICY_IN_132_133 permit 5














 match community CL_COMM_132_133
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_132_133 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_132_133 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_132_0
 ! Block loopback 10.180.0.133/32


route-map RM_POLICY_OUT_132_133 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_132_0
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_132_133 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_132_1
 ! Block link 10.181.1.80/31


route-map RM_POLICY_OUT_132_133 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_132
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_132_133 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_132
 set community 65000:100 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_132_133 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.133
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65010
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.47 peer-group RR




 !
 neighbor 10.181.1.81 peer-group EBGP
 neighbor 10.181.1.81 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.47 activate




  neighbor 10.181.1.81 activate
  neighbor 10.181.1.81 route-map RM_POLICY_IN_132_133 in
  neighbor 10.181.1.81 route-map RM_POLICY_OUT_132_133 out





  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

  network 10.200.33.0 mask 255.255.255.0

  network 10.200.34.0 mask 255.255.255.0

 exit-address-family
