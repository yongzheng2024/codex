  neighbor 10.180.0.49 activate
  neighbor 10.180.0.49 next-hop-self



  neighbor 10.181.0.13 activate
  neighbor 10.181.0.13 route-map RM_FAULT_NH_3_5 out





  network 10.200.61.0 mask 255.255.255.0

  network 10.200.62.0 mask 255.255.255.0

  network 10.200.63.0 mask 255.255.255.0

  network 10.200.64.0 mask 255.255.255.0

 exit-address-family
