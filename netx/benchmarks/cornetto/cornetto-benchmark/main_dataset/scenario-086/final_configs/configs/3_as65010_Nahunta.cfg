 router-id 10.180.0.4
 passive-interface Loopback0
 network 10.180.0.4 0.0.0.0 area 0



network 10.181.0.6 0.0.0.1 area 0
network 10.181.0.10 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_3 seq 10 permit 10.200.61.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 20 permit 10.200.62.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 30 permit 10.200.63.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 40 permit 10.200.64.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_3_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_1 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_2 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LONG_3 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_3_0 seq 10 deny 10.180.0.4/32
!






route-map RM_FAULT_NH_3_5 permit 10














 set ip next-hop 203.0.113.1
 ! Fault-injected next-hop override

!


route-map RM_POLICY_OUT_3_5 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_5 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_3_5 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_3_5 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_2
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_3_5 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_5 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_3
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_3_5 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.4


 !
 neighbor RR peer-group
 neighbor RR remote-as 65010
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65010
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.47 peer-group RR



 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.42 peer-group IBGP


 !
 neighbor 10.180.0.45 peer-group IBGP


 !
 neighbor 10.180.0.46 peer-group IBGP


 !
 neighbor 10.180.0.49 peer-group IBGP



 !
 neighbor 10.181.0.13 peer-group EBGP
 neighbor 10.181.0.13 remote-as 65010


 !
 address-family ipv4

  neighbor 10.180.0.47 activate



  neighbor 10.180.0.3 activate
  neighbor 10.180.0.3 next-hop-self


  neighbor 10.180.0.5 activate
  neighbor 10.180.0.5 next-hop-self


  neighbor 10.180.0.42 activate
