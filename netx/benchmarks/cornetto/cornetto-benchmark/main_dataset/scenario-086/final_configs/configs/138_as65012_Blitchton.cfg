
hostname 138_as65012_Blitchton
!
interface Loopback0
 ip address 10.180.0.139 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.44.0/24


 ip address 10.200.44.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.45.0/24


 ip address 10.200.45.1 255.255.255.0
!



ip access-list extended ACL_138_GigabitEthernet0_0
 10 permit ip host 10.180.0.134 any
 20 permit ip host 10.181.1.82 any
 30 permit ip host 10.181.1.83 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 133_as65007_Savannah (133)

 ip address 10.181.1.83 255.255.255.254

 ip access-group ACL_138_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 139_as65012_Pembroke (139)

 ip address 10.181.1.92 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!


ip route 10.200.44.0 255.255.255.0 Loopback100
ip route 10.200.45.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.f400.0000.0ab4.008b.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_138 seq 10 permit 10.200.44.0/24
ip prefix-list PL_EXPORT_ALLOWED_138 seq 20 permit 10.200.45.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_138_0 seq 10 deny 10.181.1.82/31
!

ip prefix-list PL_EXPORT_DENY_LINK_138_1 seq 10 deny 10.181.1.92/31
!

ip prefix-list PL_EXPORT_DENY_LONG_138 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_138_0 seq 10 deny 10.180.0.139/32
!






route-map RM_POLICY_IN_138_133 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_138_133 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_138_0
 ! Block loopback 10.180.0.139/32


route-map RM_POLICY_OUT_138_133 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_138_0
 ! Block link 10.181.1.82/31


route-map RM_POLICY_OUT_138_133 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_138_1
 ! Block link 10.181.1.92/31


route-map RM_POLICY_OUT_138_133 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_138
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_138_133 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_138
 set metric 10
 set as-path prepend 65012 65012 65012
 ! Outbound policy baseline


route-map RM_POLICY_OUT_138_133 deny 65000














 ! Deny other outbound routes

!







router bgp 65012
 bgp router-id 10.180.0.139
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65012
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.136 peer-group RR




 !
 neighbor 10.181.1.82 peer-group EBGP
 neighbor 10.181.1.82 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.136 activate




  neighbor 10.181.1.82 activate
  neighbor 10.181.1.82 route-map RM_POLICY_IN_138_133 in
  neighbor 10.181.1.82 route-map RM_POLICY_OUT_138_133 out





  network 10.200.44.0 mask 255.255.255.0

  network 10.200.45.0 mask 255.255.255.0

 exit-address-family
