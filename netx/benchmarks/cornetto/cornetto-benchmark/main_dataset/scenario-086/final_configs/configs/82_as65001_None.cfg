 ip address 10.200.108.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.109.0/24


 ip address 10.200.109.1 255.255.255.0
!



ip access-list extended ACL_82_GigabitEthernet0_1
 10 permit ip host 10.180.0.106 any
 20 permit ip host 10.181.0.242 any
 30 permit ip host 10.181.0.243 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 104_as65001_Georgetown (104)

 ip address 10.181.0.240 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 105_as65007_Monks-Corner (105)

 ip address 10.181.0.242 255.255.255.254

 ip access-group ACL_82_GigabitEthernet0_1 in
