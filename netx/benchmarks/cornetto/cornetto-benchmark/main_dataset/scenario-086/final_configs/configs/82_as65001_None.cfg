ip route 10.200.108.0 255.255.255.0 Loopback100
ip route 10.200.109.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.83
 passive-interface Loopback0
 network 10.180.0.83 0.0.0.0 area 0



network 10.181.0.240 0.0.0.1 area 0
network 10.181.0.244 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_82 seq 10 permit 10.200.108.0/24
ip prefix-list PL_EXPORT_ALLOWED_82 seq 20 permit 10.200.109.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_82_0 seq 10 deny 10.181.0.240/31
!

ip prefix-list PL_EXPORT_DENY_LINK_82_1 seq 10 deny 10.181.0.242/31
!

ip prefix-list PL_EXPORT_DENY_LINK_82_2 seq 10 deny 10.181.0.244/31
!

ip prefix-list PL_EXPORT_DENY_LONG_82 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_82_0 seq 10 deny 10.180.0.83/32
!

ip prefix-list PL_IN_82_105 seq 10 permit 10.181.1.30/31
ip prefix-list PL_IN_82_105 seq 20 permit 10.181.0.242/31
ip prefix-list PL_IN_82_105 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_82_105 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_82_105 seq 10 permit 10.200.108.0/24
ip prefix-list PL_OUT_82_105 seq 20 permit 10.200.109.0/24
!




ip community-list standard CL_COMM_82_105 permit 65535:65282
ip community-list standard CL_COMM_82_105 permit no-advertise
!





route-map RM_POLICY_IN_82_105 permit 5














 match community CL_COMM_82_105
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_82_105 permit 10














 match ip address prefix-list PL_IN_82_105
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_82_105 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_82_105 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_82_105 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_82_0
 ! Block loopback 10.180.0.83/32


route-map RM_POLICY_OUT_82_105 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_0
 ! Block link 10.181.0.240/31


route-map RM_POLICY_OUT_82_105 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_1
 ! Block link 10.181.0.242/31


route-map RM_POLICY_OUT_82_105 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_2
 ! Block link 10.181.0.244/31


route-map RM_POLICY_OUT_82_105 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_82
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_82_105 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_82
 set metric 23
 set as-path prepend 65001 65001 65001
 set community 65000:100 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_82_105 deny 200














 match ip address prefix-list PL_OUT_82_105
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_82_105 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.83
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.19 peer-group RR




 !
 neighbor 10.181.0.243 peer-group EBGP
 neighbor 10.181.0.243 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.19 activate




  neighbor 10.181.0.243 activate
  neighbor 10.181.0.243 route-map RM_POLICY_IN_82_105 in
  neighbor 10.181.0.243 route-map RM_POLICY_OUT_82_105 out





  network 10.200.108.0 mask 255.255.255.0

  network 10.200.109.0 mask 255.255.255.0

 exit-address-family
