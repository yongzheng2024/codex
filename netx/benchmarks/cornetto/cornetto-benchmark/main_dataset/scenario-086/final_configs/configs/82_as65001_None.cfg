!
interface GigabitEthernet0/2
 description to 109_as65001_Sumter (109)

 ip address 10.181.0.244 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
