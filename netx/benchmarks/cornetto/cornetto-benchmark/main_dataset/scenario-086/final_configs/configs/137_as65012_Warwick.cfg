ip prefix-list PL_OUT_137_46 seq 10 permit 10.200.43.0/24
!






route-map RM_POLICY_IN_137_46 permit 10














 match ip address prefix-list PL_IN_137_46
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_137_46 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_137_46 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_137_0
 ! Block loopback 10.180.0.138/32


route-map RM_POLICY_OUT_137_46 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_137_0
 ! Block link 10.181.0.134/31


route-map RM_POLICY_OUT_137_46 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_137_1
 ! Block link 10.181.1.86/31


route-map RM_POLICY_OUT_137_46 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_137
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_137_46 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_137
 set metric 12
 set as-path prepend 65012 65012
 ! Outbound policy baseline


route-map RM_POLICY_OUT_137_46 deny 200














 match ip address prefix-list PL_OUT_137_46
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_137_46 deny 65000














 ! Deny other outbound routes

!







router bgp 65012
 bgp router-id 10.180.0.138
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65012
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.136 peer-group RR


 !
 neighbor 10.180.0.135 peer-group RR




 !
 neighbor 10.181.0.134 peer-group EBGP
 neighbor 10.181.0.134 remote-as 65010


 !
 address-family ipv4

  neighbor 10.180.0.136 activate


  neighbor 10.180.0.135 activate




  neighbor 10.181.0.134 activate
  neighbor 10.181.0.134 route-map RM_POLICY_IN_137_46 in
  neighbor 10.181.0.134 route-map RM_POLICY_OUT_137_46 out





  network 10.200.42.0 mask 255.255.255.0

  network 10.200.43.0 mask 255.255.255.0

 exit-address-family
