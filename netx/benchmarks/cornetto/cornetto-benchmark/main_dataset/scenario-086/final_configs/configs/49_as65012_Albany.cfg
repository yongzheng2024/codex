ip prefix-list PL_EXPORT_ALLOWED_49 seq 10 permit 10.200.74.0/24
ip prefix-list PL_EXPORT_ALLOWED_49 seq 20 permit 10.200.75.0/24
ip prefix-list PL_EXPORT_ALLOWED_49 seq 30 permit 10.200.76.0/24
