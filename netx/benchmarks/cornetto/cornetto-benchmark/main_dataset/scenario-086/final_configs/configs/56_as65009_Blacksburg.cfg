ip prefix-list PL_IN_56_57 seq 10 permit 10.200.88.0/24
ip prefix-list PL_IN_56_57 seq 20 permit 10.200.86.0/24
ip prefix-list PL_IN_56_57 seq 30 permit 10.200.0.0/16 le 24
