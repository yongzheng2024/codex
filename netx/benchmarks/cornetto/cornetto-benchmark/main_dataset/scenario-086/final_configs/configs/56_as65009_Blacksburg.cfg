ip prefix-list PL_OUT_56_57 seq 10 permit 10.200.85.0/24
ip prefix-list PL_OUT_56_57 seq 20 permit 10.200.84.0/24
!






route-map RM_POLICY_IN_56_57 permit 10














 match ip address prefix-list PL_IN_56_57
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_56_57 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_56_57 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_56_0
 ! Block loopback 10.180.0.57/32


route-map RM_POLICY_OUT_56_57 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_0
 ! Block link 10.181.0.162/31


route-map RM_POLICY_OUT_56_57 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_1
 ! Block link 10.181.0.164/31


route-map RM_POLICY_OUT_56_57 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_56
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_56_57 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_56
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_56_57 deny 200














 match ip address prefix-list PL_OUT_56_57
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_56_57 deny 65000














 ! Deny other outbound routes

!







