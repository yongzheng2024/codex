!
interface GigabitEthernet0/2
 description to 29_as65005_Switzerland (29)

 ip address 10.181.0.90 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.21.0 255.255.255.0 Loopback100
ip route 10.200.22.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.24
 passive-interface Loopback0
 network 10.180.0.24 0.0.0.0 area 0



network 10.181.0.86 0.0.0.1 area 0
network 10.181.0.90 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_23 seq 10 permit 10.200.21.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 20 permit 10.200.22.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_23_0 seq 10 deny 10.181.0.86/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_1 seq 10 deny 10.181.0.88/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_2 seq 10 deny 10.181.0.90/31
!

ip prefix-list PL_EXPORT_DENY_LONG_23 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_23_0 seq 10 deny 10.180.0.24/32
!






route-map RM_POLICY_IN_23_43 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_23_43 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_23_0
 ! Block loopback 10.180.0.24/32


route-map RM_POLICY_OUT_23_43 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_0
 ! Block link 10.181.0.86/31


route-map RM_POLICY_OUT_23_43 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_1
 ! Block link 10.181.0.88/31


route-map RM_POLICY_OUT_23_43 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_2
 ! Block link 10.181.0.90/31


route-map RM_POLICY_OUT_23_43 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_23
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_23_43 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_23
 set metric 26
 set as-path prepend 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_23_43 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.24
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.30 peer-group RR




 !
 neighbor 10.181.0.89 peer-group EBGP
 neighbor 10.181.0.89 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.30 activate




  neighbor 10.181.0.89 activate
  neighbor 10.181.0.89 route-map RM_POLICY_IN_23_43 in
  neighbor 10.181.0.89 route-map RM_POLICY_OUT_23_43 out





  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

 exit-address-family
