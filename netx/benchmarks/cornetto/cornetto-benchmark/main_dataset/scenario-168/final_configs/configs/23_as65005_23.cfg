
hostname 23_as65005_23
!
interface Loopback0
 ip address 10.180.0.24 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!



ip access-list extended ACL_23_GigabitEthernet0_1
 10 permit ip host 10.180.0.44 any
 20 permit ip host 10.181.0.88 any
 30 permit ip host 10.181.0.89 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 192.0.2.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 26_as65005_Switzerland (26)

 ip address 10.181.0.86 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 43_as65003_Switzerland (43)

 ip address 10.181.0.88 255.255.255.254

 ip access-group ACL_23_GigabitEthernet0_1 in
