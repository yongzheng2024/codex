
hostname 2_as65003_2
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.12.0/24


 ip address 10.200.12.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.13.0/24


 ip address 10.200.13.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 40_as65001_Switzerland (40)

 ip address 10.181.0.12 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 42_as65003_Switzerland (42)

 ip address 10.181.0.14 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 61_as65003_Switzerland (61)

 ip address 10.181.0.16 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.12.0 255.255.255.0 Loopback100
ip route 10.200.13.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0



network 10.181.0.14 0.0.0.1 area 0
network 10.181.0.16 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_2 seq 10 permit 10.200.12.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 20 permit 10.200.13.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_2_0 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_1 seq 10 deny 10.181.0.14/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_2 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LONG_2 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_2_0 seq 10 deny 10.180.0.3/32
!






route-map RM_POLICY_IN_2_40 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_2_40 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_40 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_2_40 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_2_40 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_2
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_2_40 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_40 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_2
 set metric 10
 set as-path prepend 65003 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_2_40 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.3


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.43 peer-group RR



 !
 neighbor 10.180.0.34 peer-group IBGP


 !
 neighbor 10.180.0.45 peer-group IBGP



 !
 neighbor 10.181.0.13 peer-group EBGP
 neighbor 10.181.0.13 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.43 activate



  neighbor 10.180.0.34 activate
  neighbor 10.180.0.34 next-hop-self


  neighbor 10.180.0.45 activate
  neighbor 10.180.0.45 next-hop-self



  neighbor 10.181.0.13 activate
  neighbor 10.181.0.13 route-map RM_POLICY_IN_2_40 in
  neighbor 10.181.0.13 route-map RM_POLICY_OUT_2_40 out





  network 10.200.12.0 mask 255.255.255.0

  network 10.200.13.0 mask 255.255.255.0

 exit-address-family
