ip prefix-list PL_EXPORT_ALLOWED_55 seq 10 permit 10.200.52.0/24
ip prefix-list PL_EXPORT_ALLOWED_55 seq 20 permit 10.200.53.0/24
ip prefix-list PL_EXPORT_ALLOWED_55 seq 30 permit 10.200.54.0/24
