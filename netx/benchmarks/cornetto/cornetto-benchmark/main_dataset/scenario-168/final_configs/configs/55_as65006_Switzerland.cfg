!

ip prefix-list PL_EXPORT_DENY_LINK_55_2 seq 10 deny 10.181.0.152/31
!

ip prefix-list PL_EXPORT_DENY_LONG_55 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_55_0 seq 10 deny 10.180.0.56/32
!






route-map RM_POLICY_IN_55_28 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_55_28 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_55_0
 ! Block loopback 10.180.0.56/32


route-map RM_POLICY_OUT_55_28 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_55_0
 ! Block link 10.181.0.100/31


route-map RM_POLICY_OUT_55_28 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_55_1
 ! Block link 10.181.0.140/31


route-map RM_POLICY_OUT_55_28 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_55_2
 ! Block link 10.181.0.152/31


route-map RM_POLICY_OUT_55_28 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_55
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_55_28 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_55
 set metric 25
 set as-path prepend 65006 65006
 ! Outbound policy baseline


route-map RM_POLICY_OUT_55_28 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.56
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP


 !
 neighbor 10.180.0.33 peer-group IBGP


 !
 neighbor 10.180.0.35 peer-group IBGP


 !
 neighbor 10.180.0.48 peer-group IBGP


 !
 neighbor 10.180.0.52 peer-group IBGP


 !
 neighbor 10.180.0.64 peer-group IBGP



 !
 neighbor 10.181.0.100 peer-group EBGP
 neighbor 10.181.0.100 remote-as 65009


 !
 address-family ipv4


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.21 activate


  neighbor 10.180.0.33 activate


  neighbor 10.180.0.35 activate


  neighbor 10.180.0.48 activate


  neighbor 10.180.0.52 activate


  neighbor 10.180.0.64 activate



  neighbor 10.181.0.100 activate
  neighbor 10.181.0.100 route-map RM_POLICY_IN_55_28 in
  neighbor 10.181.0.100 route-map RM_POLICY_OUT_55_28 out





  network 10.200.52.0 mask 255.255.255.0

  network 10.200.53.0 mask 255.255.255.0

  network 10.200.54.0 mask 255.255.255.0

