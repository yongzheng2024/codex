
hostname 66_as65009_Switzerland
!
interface Loopback0
 ip address 10.180.0.67 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.61.0/24


 ip address 10.200.61.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.62.0/24


 ip address 10.200.62.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.63.0/24


 ip address 10.200.63.1 255.255.255.0
!



ip access-list extended ACL_66_GigabitEthernet0_1
 10 permit ip host 10.180.0.70 any
 20 permit ip host 10.181.0.170 any
 30 permit ip host 10.181.0.171 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 49_as65009_49 (49)

 ip address 10.181.0.145 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 69_as65004_Switzerland (69)

 ip address 10.181.0.170 255.255.255.254

 ip access-group ACL_66_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.61.0 255.255.255.0 Loopback100
ip route 10.200.62.0 255.255.255.0 Loopback101
ip route 10.200.63.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.67
 passive-interface Loopback0
 network 10.180.0.67 0.0.0.0 area 0



network 10.181.0.144 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_66 seq 10 permit 10.200.61.0/24
ip prefix-list PL_EXPORT_ALLOWED_66 seq 20 permit 10.200.62.0/24
ip prefix-list PL_EXPORT_ALLOWED_66 seq 30 permit 10.200.63.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_66_0 seq 10 deny 10.181.0.144/31
!

ip prefix-list PL_EXPORT_DENY_LINK_66_1 seq 10 deny 10.181.0.170/31
!

ip prefix-list PL_EXPORT_DENY_LONG_66 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_66_0 seq 10 deny 10.180.0.67/32
!






route-map RM_POLICY_IN_66_69 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_66_69 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_66_0
 ! Block loopback 10.180.0.67/32


route-map RM_POLICY_OUT_66_69 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_0
 ! Block link 10.181.0.144/31


route-map RM_POLICY_OUT_66_69 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_1
 ! Block link 10.181.0.170/31


route-map RM_POLICY_OUT_66_69 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_66
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_66_69 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_66
 set metric 28
 set as-path prepend 65009 65009
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_66_69 deny 65000














 ! Deny other outbound routes

!







router bgp 65009
 bgp router-id 10.180.0.67
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65009
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.29 peer-group IBGP


 !
 neighbor 10.180.0.50 peer-group IBGP


 !
 neighbor 10.180.0.54 peer-group IBGP


 !
 neighbor 10.180.0.61 peer-group IBGP


 !
 neighbor 10.180.0.63 peer-group IBGP



 !
 neighbor 10.181.0.171 peer-group EBGP
 neighbor 10.181.0.171 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.29 activate


  neighbor 10.180.0.50 activate


  neighbor 10.180.0.54 activate


  neighbor 10.180.0.61 activate


  neighbor 10.180.0.63 activate



  neighbor 10.181.0.171 activate
  neighbor 10.181.0.171 route-map RM_POLICY_IN_66_69 in
  neighbor 10.181.0.171 route-map RM_POLICY_OUT_66_69 out





  network 10.200.61.0 mask 255.255.255.0

  network 10.200.62.0 mask 255.255.255.0

  network 10.200.63.0 mask 255.255.255.0

 exit-address-family
