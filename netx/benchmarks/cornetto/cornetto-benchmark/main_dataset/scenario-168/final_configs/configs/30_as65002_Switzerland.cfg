
hostname 30_as65002_Switzerland
!
interface Loopback0
 ip address 10.180.0.31 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.30.0/24


 ip address 10.200.30.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.31.0/24


 ip address 10.200.31.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.32.0/24


 ip address 10.200.32.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 8_as65002_Switzerland (8)

 ip address 10.181.0.33 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 35_as65004_Switzerland (35)

 ip address 10.181.0.108 255.255.255.254
 mtu 1500
!


ip route 10.200.30.0 255.255.255.0 Loopback100
ip route 10.200.31.0 255.255.255.0 Loopback101
ip route 10.200.32.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.31
 passive-interface Loopback0
 network 10.180.0.31 0.0.0.0 area 0



network 10.181.0.32 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_30 seq 10 permit 10.200.30.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 20 permit 10.200.31.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 30 permit 10.200.32.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_30_0 seq 10 deny 10.181.0.108/31
!

ip prefix-list PL_EXPORT_DENY_LINK_30_1 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LONG_30 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_30_0 seq 10 deny 10.180.0.31/32
!






route-map RM_POLICY_OUT_30_35 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_30_0
 ! Block loopback 10.180.0.31/32


route-map RM_POLICY_OUT_30_35 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_0
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_30_35 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_1
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_30_35 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_30
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_30_35 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_30
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_30_35 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.31
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.38 peer-group IBGP


 !
 neighbor 10.180.0.39 peer-group IBGP


 !
 neighbor 10.180.0.40 peer-group IBGP


 !
 neighbor 10.180.0.51 peer-group IBGP


 !
 neighbor 10.180.0.55 peer-group IBGP


 !
 neighbor 10.180.0.57 peer-group IBGP



 !
 neighbor 10.181.0.109 peer-group EBGP
 neighbor 10.181.0.109 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.9 activate


  neighbor 10.180.0.38 activate


  neighbor 10.180.0.39 activate


  neighbor 10.180.0.40 activate


  neighbor 10.180.0.51 activate


  neighbor 10.180.0.55 activate


  neighbor 10.180.0.57 activate



  neighbor 10.181.0.109 activate
  neighbor 10.181.0.109 route-map RM_POLICY_OUT_30_35 out





  network 10.200.30.0 mask 255.255.255.0

  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

 exit-address-family
