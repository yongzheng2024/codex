
hostname 34_as65006_Switzerland
!
interface Loopback0
 ip address 10.180.0.35 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.33.0/24


 ip address 10.200.33.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.34.0/24


 ip address 10.200.34.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.35.0/24


 ip address 10.200.35.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.36.0/24


 ip address 10.200.36.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 20_as65006_20 (20)

 ip address 10.181.0.75 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 22_as65008_22 (22)

 ip address 10.181.0.85 255.255.255.254
 mtu 1500
!


ip route 10.200.33.0 255.255.255.0 Loopback100
ip route 10.200.34.0 255.255.255.0 Loopback101
ip route 10.200.35.0 255.255.255.0 Loopback102
ip route 10.200.36.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.35
 passive-interface Loopback0
 network 10.180.0.35 0.0.0.0 area 0



network 10.181.0.74 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_34 seq 10 permit 10.200.33.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 20 permit 10.200.34.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 30 permit 10.200.35.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 40 permit 10.200.36.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_34_0 seq 10 deny 10.181.0.74/31
!

ip prefix-list PL_EXPORT_DENY_LINK_34_1 seq 10 deny 10.181.0.84/31
!

ip prefix-list PL_EXPORT_DENY_LONG_34 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_34_0 seq 10 deny 10.180.0.35/32
!

ip prefix-list PL_IN_34_22 seq 10 permit 10.200.20.0/24
ip prefix-list PL_IN_34_22 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_34_22 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_34_22 seq 10 permit 10.200.35.0/24
ip prefix-list PL_OUT_34_22 seq 20 permit 10.200.36.0/24
!






route-map RM_POLICY_IN_34_22 permit 10














 match ip address prefix-list PL_IN_34_22
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_34_22 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_34_22 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_34_0
 ! Block loopback 10.180.0.35/32


route-map RM_POLICY_OUT_34_22 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_0
 ! Block link 10.181.0.74/31


route-map RM_POLICY_OUT_34_22 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_1
 ! Block link 10.181.0.84/31


route-map RM_POLICY_OUT_34_22 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_34
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_34_22 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_34
 set metric 27
 set as-path prepend 65006
 ! Outbound policy baseline


route-map RM_POLICY_OUT_34_22 deny 200














 match ip address prefix-list PL_OUT_34_22
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_34_22 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.35
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP


 !
 neighbor 10.180.0.33 peer-group IBGP


 !
 neighbor 10.180.0.48 peer-group IBGP


 !
 neighbor 10.180.0.52 peer-group IBGP


 !
 neighbor 10.180.0.56 peer-group IBGP


 !
 neighbor 10.180.0.64 peer-group IBGP



 !
 neighbor 10.181.0.84 peer-group EBGP
 neighbor 10.181.0.84 remote-as 65008


 !
 address-family ipv4


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.21 activate


  neighbor 10.180.0.33 activate


  neighbor 10.180.0.48 activate


  neighbor 10.180.0.52 activate


  neighbor 10.180.0.56 activate


  neighbor 10.180.0.64 activate



  neighbor 10.181.0.84 activate
  neighbor 10.181.0.84 route-map RM_POLICY_IN_34_22 in
  neighbor 10.181.0.84 route-map RM_POLICY_OUT_34_22 out





  network 10.200.33.0 mask 255.255.255.0

  network 10.200.34.0 mask 255.255.255.0

  network 10.200.35.0 mask 255.255.255.0

  network 10.200.36.0 mask 255.255.255.0

 exit-address-family
