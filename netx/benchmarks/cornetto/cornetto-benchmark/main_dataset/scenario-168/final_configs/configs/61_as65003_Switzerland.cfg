
hostname 61_as65003_Switzerland
!
interface Loopback0
 ip address 10.180.0.62 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.55.0/24


 ip address 10.200.55.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.56.0/24


 ip address 10.200.56.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.57.0/24


 ip address 10.200.57.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.58.0/24


 ip address 10.200.58.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 1_as65008_1 (1)

 ip address 10.181.0.9 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 2_as65003_2 (2)

 ip address 10.181.0.17 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.55.0 255.255.255.0 Loopback100
ip route 10.200.56.0 255.255.255.0 Loopback101
ip route 10.200.57.0 255.255.255.0 Loopback102
ip route 10.200.58.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.62
 passive-interface Loopback0
 network 10.180.0.62 0.0.0.0 area 0



network 10.181.0.16 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_61 seq 10 permit 10.200.55.0/24
ip prefix-list PL_EXPORT_ALLOWED_61 seq 20 permit 10.200.56.0/24
ip prefix-list PL_EXPORT_ALLOWED_61 seq 30 permit 10.200.57.0/24
ip prefix-list PL_EXPORT_ALLOWED_61 seq 40 permit 10.200.58.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_61_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_61_1 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_61 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_61_0 seq 10 deny 10.180.0.62/32
!

ip prefix-list PL_IN_61_1 seq 10 permit 10.200.5.0/24
ip prefix-list PL_IN_61_1 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_61_1 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_61_1 seq 10 permit 10.200.58.0/24
!






route-map RM_POLICY_IN_61_1 permit 10














 match ip address prefix-list PL_IN_61_1
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_61_1 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_61_1 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_61_0
 ! Block loopback 10.180.0.62/32


route-map RM_POLICY_OUT_61_1 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_61_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_61_1 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_61_1
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_61_1 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_61
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_61_1 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_61
 set metric 29
 set as-path prepend 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_61_1 deny 200














 match ip address prefix-list PL_OUT_61_1
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_61_1 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.62
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.43 peer-group RR




 !
 neighbor 10.181.0.8 peer-group EBGP
 neighbor 10.181.0.8 remote-as 65008


 !
 address-family ipv4

  neighbor 10.180.0.43 activate




  neighbor 10.181.0.8 activate
  neighbor 10.181.0.8 route-map RM_POLICY_IN_61_1 in
  neighbor 10.181.0.8 route-map RM_POLICY_OUT_61_1 out





  network 10.200.55.0 mask 255.255.255.0

  network 10.200.56.0 mask 255.255.255.0

  network 10.200.57.0 mask 255.255.255.0

  network 10.200.58.0 mask 255.255.255.0

 exit-address-family
