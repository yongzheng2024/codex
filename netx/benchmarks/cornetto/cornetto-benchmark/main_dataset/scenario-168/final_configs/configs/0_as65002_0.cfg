
hostname 0_as65002_0
!
interface Loopback0
 ip address 10.180.0.1 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!



ip access-list extended ACL_0_GigabitEthernet0_1
 10 permit ip host 10.180.0.36 any
 20 permit ip host 10.181.0.2 any
 30 permit ip host 10.181.0.3 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 50_as65002_Switzerland (50)

 ip address 10.181.0.0 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 35_as65004_Switzerland (35)

 ip address 10.181.0.2 255.255.255.254

 ip access-group ACL_0_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 38_as65002_Switzerland (38)

 ip address 10.181.0.4 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.1
 passive-interface Loopback0
 network 10.180.0.1 0.0.0.0 area 0



network 10.181.0.0 0.0.0.1 area 0
network 10.181.0.4 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_0 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_0 seq 20 permit 10.200.1.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_0_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_1 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_2 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_0 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_0_0 seq 10 deny 10.180.0.1/32
!




ip community-list standard CL_COMM_0_35 permit 65535:65282
ip community-list standard CL_COMM_0_35 permit no-export
!





route-map RM_POLICY_IN_0_35 permit 5














 match community CL_COMM_0_35
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_0_35 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_0_35 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_0_35 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_0_0
 ! Block loopback 10.180.0.1/32


route-map RM_POLICY_OUT_0_35 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_0_35 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_0_35 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_2
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_0_35 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_0
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_0_35 deny 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_0
 set metric 20
 set as-path prepend 65002
 set community 65000:200 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_0_35 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.31 peer-group IBGP


 !
 neighbor 10.180.0.38 peer-group IBGP


 !
 neighbor 10.180.0.39 peer-group IBGP


 !
 neighbor 10.180.0.40 peer-group IBGP


 !
 neighbor 10.180.0.51 peer-group IBGP


 !
 neighbor 10.180.0.55 peer-group IBGP


 !
 neighbor 10.180.0.57 peer-group IBGP



 !
 neighbor 10.181.0.3 peer-group EBGP
 neighbor 10.181.0.3 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.9 activate


  neighbor 10.180.0.31 activate


  neighbor 10.180.0.38 activate


  neighbor 10.180.0.39 activate


  neighbor 10.180.0.40 activate


  neighbor 10.180.0.51 activate


  neighbor 10.180.0.55 activate


  neighbor 10.180.0.57 activate



  neighbor 10.181.0.3 activate
  neighbor 10.181.0.3 route-map RM_POLICY_IN_0_35 in
  neighbor 10.181.0.3 route-map RM_POLICY_OUT_0_35 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

 exit-address-family
