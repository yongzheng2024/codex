
hostname 101_as65001_Kershaw
!
interface Loopback0
 ip address 10.180.0.102 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 100_as65001_Lancaster (100)

 ip address 10.181.1.25 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 108_as65001_Bethune (108)

 ip address 10.181.1.28 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.102
 passive-interface Loopback0
 network 10.180.0.102 0.0.0.0 area 0



network 10.181.1.24 0.0.0.1 area 0
network 10.181.1.28 0.0.0.1 area 0
!








router bgp 65001
 bgp router-id 10.180.0.102
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.92 peer-group RR


 !
 neighbor 10.180.0.98 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.92 activate


  neighbor 10.180.0.98 activate







 exit-address-family
