 router-id 10.180.0.115
 passive-interface Loopback0
 network 10.180.0.115 0.0.0.0 area 0



network 10.181.0.192 0.0.0.1 area 0
network 10.181.1.52 0.0.0.1 area 0
!








router bgp 65001
 bgp router-id 10.180.0.115
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.92 peer-group RR


 !
 neighbor 10.180.0.98 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.92 activate


  neighbor 10.180.0.98 activate







 exit-address-family
