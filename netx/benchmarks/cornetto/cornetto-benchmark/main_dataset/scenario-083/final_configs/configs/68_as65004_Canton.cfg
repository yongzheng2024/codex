
hostname 68_as65004_Canton
!
interface Loopback0
 ip address 10.180.0.69 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.78.0/24


 ip address 10.200.78.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.79.0/24


 ip address 10.200.79.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.80.0/24


 ip address 10.200.80.1 255.255.255.0
!



ip access-list extended ACL_68_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.69 any
 20 permit ip host 10.181.0.198 any
 30 permit ip host 10.181.0.200 any
 40 permit ip 10.181.0.198 0.0.0.1 any
 50 permit ip 10.181.0.200 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 76_as65002_Ellijay (76)

 ip address 10.181.0.198 255.255.255.254

 ip access-group ACL_68_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 77_as65004_Atlanta (77)

 ip address 10.181.0.200 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

