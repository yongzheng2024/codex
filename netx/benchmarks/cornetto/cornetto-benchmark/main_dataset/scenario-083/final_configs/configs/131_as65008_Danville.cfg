
hostname 131_as65008_Danville
!
interface Loopback0
 ip address 10.180.0.132 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.25.0/24


 ip address 10.200.25.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.26.0/24


 ip address 10.200.26.1 255.255.255.0
!



ip access-list extended ACL_131_GigabitEthernet0_0
 10 permit ip host 10.180.0.31 any
 20 permit ip host 10.181.0.90 any
 30 permit ip host 10.181.0.91 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_131_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.132 any
 20 permit ip host 10.181.0.91 any
 30 permit ip host 10.181.1.69 any
 40 permit ip host 10.181.1.79 any
 50 permit ip 10.181.0.90 0.0.0.1 any
 60 permit ip 10.181.1.68 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 30_as65010_Greensboro (30)

 ip address 10.181.0.91 255.255.255.254

 ip access-group ACL_131_GigabitEthernet0_0 in

 ip access-group ACL_131_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 124_as65008_Lynchburg (124)

 ip address 10.181.1.69 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 130_as65008_Martinsville (130)

 ip address 10.181.1.79 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.25.0 255.255.255.0 Loopback100
ip route 10.200.26.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.132
 passive-interface Loopback0
 network 10.180.0.132 0.0.0.0 area 0



network 10.181.1.68 0.0.0.1 area 0
network 10.181.1.78 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_131 seq 10 permit 10.200.25.0/24
ip prefix-list PL_EXPORT_ALLOWED_131 seq 20 permit 10.200.26.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_131_0 seq 10 deny 10.181.0.90/31
!

ip prefix-list PL_EXPORT_DENY_LINK_131_1 seq 10 deny 10.181.1.68/31
!

ip prefix-list PL_EXPORT_DENY_LINK_131_2 seq 10 deny 10.181.1.78/31
!

ip prefix-list PL_EXPORT_DENY_LONG_131 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_131_0 seq 10 deny 10.180.0.132/32
!




ip community-list standard CL_COMM_131_30 permit 65535:65282
ip community-list standard CL_COMM_131_30 permit no-advertise
!





route-map RM_POLICY_IN_131_30 permit 5














 match community CL_COMM_131_30
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_131_30 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_131_30 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_131_0
 ! Block loopback 10.180.0.132/32


route-map RM_POLICY_OUT_131_30 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_131_0
 ! Block link 10.181.0.90/31


route-map RM_POLICY_OUT_131_30 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_131_1
 ! Block link 10.181.1.68/31


route-map RM_POLICY_OUT_131_30 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_131_2
 ! Block link 10.181.1.78/31


route-map RM_POLICY_OUT_131_30 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_131
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_131_30 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_131
 set community 65000:200 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_131_30 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.132
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65008
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.51 peer-group RR


 !
 neighbor 10.180.0.58 peer-group RR




 !
 neighbor 10.181.0.90 peer-group EBGP
 neighbor 10.181.0.90 remote-as 65010


 !
 address-family ipv4

  neighbor 10.180.0.51 activate


  neighbor 10.180.0.58 activate




  neighbor 10.181.0.90 activate
  neighbor 10.181.0.90 route-map RM_POLICY_IN_131_30 in
  neighbor 10.181.0.90 route-map RM_POLICY_OUT_131_30 out





  network 10.200.25.0 mask 255.255.255.0

  network 10.200.26.0 mask 255.255.255.0

 exit-address-family
