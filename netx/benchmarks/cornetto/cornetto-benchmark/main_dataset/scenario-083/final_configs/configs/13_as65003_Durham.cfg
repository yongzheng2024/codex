
hostname 13_as65003_Durham
!
interface Loopback0
 ip address 10.180.0.14 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.23.0/24


 ip address 10.200.23.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.24.0/24


 ip address 10.200.24.1 255.255.255.0
!



ip access-list extended ACL_13_GigabitEthernet0_1
 10 permit ip host 10.180.0.13 any
 20 permit ip host 10.181.0.46 any
 30 permit ip host 10.181.0.47 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_13_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.14 any
 20 permit ip host 10.181.0.41 any
 30 permit ip host 10.181.0.47 any
 40 permit ip 10.181.0.40 0.0.0.1 any
 50 permit ip 10.181.0.46 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 10_as65003_Raleigh (10)

 ip address 10.181.0.41 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 12_as65010_Burlington (12)

 ip address 10.181.0.47 255.255.255.254

 ip access-group ACL_13_GigabitEthernet0_1 in

 ip access-group ACL_13_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.22.0 255.255.255.0 Loopback100
ip route 10.200.23.0 255.255.255.0 Loopback101
ip route 10.200.24.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.14
 passive-interface Loopback0
 network 10.180.0.14 0.0.0.0 area 0



network 10.181.0.40 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_13 seq 10 permit 10.200.22.0/24
ip prefix-list PL_EXPORT_ALLOWED_13 seq 20 permit 10.200.23.0/24
ip prefix-list PL_EXPORT_ALLOWED_13 seq 30 permit 10.200.24.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_13_0 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LINK_13_1 seq 10 deny 10.181.0.46/31
!

ip prefix-list PL_EXPORT_DENY_LONG_13 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_13_0 seq 10 deny 10.180.0.14/32
!

ip prefix-list PL_IN_13_12 seq 10 permit 10.181.0.46/31
ip prefix-list PL_IN_13_12 seq 20 permit 10.180.0.13/32
ip prefix-list PL_IN_13_12 seq 30 permit 10.200.16.0/24
ip prefix-list PL_IN_13_12 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_13_12 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_13_12 seq 10 permit 10.200.22.0/24
!




ip community-list standard CL_COMM_13_12 permit no-advertise
ip community-list standard CL_COMM_13_12 permit no-export
!





route-map RM_POLICY_IN_13_12 permit 5














 match community CL_COMM_13_12
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_13_12 permit 10














 match ip address prefix-list PL_IN_13_12
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_13_12 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_13_12 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_13_12 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_13_0
 ! Block loopback 10.180.0.14/32


route-map RM_POLICY_OUT_13_12 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_0
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_13_12 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_1
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_13_12 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_13
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_13_12 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_13
 set metric 6
 set as-path prepend 65003 65003 65003
 set community no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_13_12 deny 200














 match ip address prefix-list PL_OUT_13_12
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_13_12 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.14
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.19 peer-group RR




 !
 neighbor 10.181.0.46 peer-group EBGP
 neighbor 10.181.0.46 remote-as 65010


 !
 address-family ipv4

  neighbor 10.180.0.19 activate




  neighbor 10.181.0.46 activate
  neighbor 10.181.0.46 route-map RM_POLICY_IN_13_12 in
  neighbor 10.181.0.46 route-map RM_POLICY_OUT_13_12 out





  network 10.200.22.0 mask 255.255.255.0

  network 10.200.23.0 mask 255.255.255.0

  network 10.200.24.0 mask 255.255.255.0

 exit-address-family
