!


route-map RM_POLICY_IN_53_83 permit 10














 match ip address prefix-list PL_IN_53_83
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_53_83 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_53_83 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_53_0
 ! Block loopback 10.180.0.54/32


