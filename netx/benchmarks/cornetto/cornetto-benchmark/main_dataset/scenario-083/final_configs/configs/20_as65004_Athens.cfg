 passive-interface Loopback0
 network 10.180.0.21 0.0.0.0 area 0










 redistribute bgp 65004 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_20

network 10.181.0.66 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 10 permit 10.200.0.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 20 permit 10.200.1.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 30 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 40 permit 10.200.3.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 50 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 60 permit 10.200.30.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 70 permit 10.200.56.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 80 permit 10.200.57.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 90 permit 10.200.58.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 100 permit 10.200.59.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 110 permit 10.200.81.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_20 seq 120 permit 10.200.82.0/24
