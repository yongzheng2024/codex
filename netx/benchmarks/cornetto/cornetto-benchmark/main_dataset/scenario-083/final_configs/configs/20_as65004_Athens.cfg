!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_20_0 seq 10 deny 10.180.0.21/32
!






route-map RM_BGP_TO_OSPF_20 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_20 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_20
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_20 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_20
 set tag 65010

!


route-map RM_POLICY_IN_20_21 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_20_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_20_0
 ! Block loopback 10.180.0.21/32


route-map RM_POLICY_OUT_20_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_0
 ! Block link 10.181.0.64/31


route-map RM_POLICY_OUT_20_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_1
 ! Block link 10.181.0.66/31


route-map RM_POLICY_OUT_20_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_20
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_20_21 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_20
 set metric 9
 set as-path prepend 65004 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_20_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.21
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.78 peer-group RR




 !
 neighbor 10.181.0.65 peer-group EBGP
 neighbor 10.181.0.65 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.78 activate




  neighbor 10.181.0.65 activate
  neighbor 10.181.0.65 route-map RM_POLICY_IN_20_21 in
  neighbor 10.181.0.65 route-map RM_POLICY_OUT_20_21 out





  network 10.200.52.0 mask 255.255.255.0

  network 10.200.53.0 mask 255.255.255.0

  network 10.200.54.0 mask 255.255.255.0

  network 10.200.55.0 mask 255.255.255.0

 exit-address-family
