ip prefix-list PL_BGP_TO_OSPF_DENY_20 seq 30 permit 10.181.0.66/31
!

ip prefix-list PL_EXPORT_ALLOWED_20 seq 10 permit 10.200.52.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 20 permit 10.200.53.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 30 permit 10.200.54.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 40 permit 10.200.55.0/24
