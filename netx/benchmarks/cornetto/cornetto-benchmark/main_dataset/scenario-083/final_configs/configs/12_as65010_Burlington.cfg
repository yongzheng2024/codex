
hostname 12_as65010_Burlington
!
interface Loopback0
 ip address 10.180.0.13 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.16.0/24


 ip address 10.200.16.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.17.0/24


 ip address 10.200.17.1 255.255.255.0
!



ip access-list extended ACL_12_GigabitEthernet0_0
 10 permit ip host 10.180.0.14 any
 20 permit ip host 10.181.0.46 any
 30 permit ip host 10.181.0.47 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_12_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.13 any
 20 permit ip host 10.181.0.46 any
 30 permit ip host 10.181.0.48 any
 40 permit ip 10.181.0.46 0.0.0.1 any
 50 permit ip 10.181.0.48 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 13_as65003_Durham (13)

 ip address 10.181.0.46 255.255.255.254

 ip access-group ACL_12_GigabitEthernet0_0 in

 ip access-group ACL_12_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 30_as65010_Greensboro (30)

 ip address 10.181.0.48 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.16.0 255.255.255.0 Loopback100
ip route 10.200.17.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.13
 passive-interface Loopback0
 network 10.180.0.13 0.0.0.0 area 0










 redistribute bgp 65010 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_12

network 10.181.0.48 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 10 permit 10.200.4.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 20 permit 10.200.5.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 30 permit 10.200.8.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 40 permit 10.200.9.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 50 permit 10.200.22.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 60 permit 10.200.23.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 70 permit 10.200.24.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 80 permit 10.200.95.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_12 seq 90 permit 10.200.96.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_12 seq 10 permit 10.180.0.13/32
ip prefix-list PL_BGP_TO_OSPF_DENY_12 seq 20 permit 10.181.0.46/31
ip prefix-list PL_BGP_TO_OSPF_DENY_12 seq 30 permit 10.181.0.48/31
!

ip prefix-list PL_EXPORT_ALLOWED_12 seq 10 permit 10.200.16.0/24
ip prefix-list PL_EXPORT_ALLOWED_12 seq 20 permit 10.200.17.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_12_0 seq 10 deny 10.181.0.46/31
!

ip prefix-list PL_EXPORT_DENY_LINK_12_1 seq 10 deny 10.181.0.48/31
!

ip prefix-list PL_EXPORT_DENY_LONG_12 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_12_0 seq 10 deny 10.180.0.13/32
!

ip prefix-list PL_IN_12_13 seq 10 permit 10.200.22.0/24
ip prefix-list PL_IN_12_13 seq 20 permit 10.200.23.0/24
ip prefix-list PL_IN_12_13 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_12_13 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_12_13 seq 10 permit 10.200.16.0/24
!






route-map RM_BGP_TO_OSPF_12 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_12 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_12
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_12 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_12
 set tag 65010

!


route-map RM_POLICY_IN_12_13 permit 10














 match ip address prefix-list PL_IN_12_13
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_12_13 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_12_13 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_12_0
 ! Block loopback 10.180.0.13/32


route-map RM_POLICY_OUT_12_13 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_0
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_12_13 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_1
 ! Block link 10.181.0.48/31


route-map RM_POLICY_OUT_12_13 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_12
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_12_13 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_12
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_12_13 deny 200














 match ip address prefix-list PL_OUT_12_13
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_12_13 deny 65000














 ! Deny other outbound routes

!







