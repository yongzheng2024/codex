
hostname 82_as65003_None
!
interface Loopback0
 ip address 10.180.0.83 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.95.0/24


 ip address 10.200.95.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.96.0/24


 ip address 10.200.96.1 255.255.255.0
!



ip access-list extended ACL_82_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.83 any
 20 permit ip host 10.181.0.240 any
 30 permit ip host 10.181.0.242 any
 40 permit ip host 10.181.0.244 any
 50 permit ip 10.181.0.242 0.0.0.1 any
 60 permit ip 10.181.0.244 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 104_as65003_Georgetown (104)

 ip address 10.181.0.240 255.255.255.254

