ip prefix-list PL_BGP_TO_OSPF_DENY_82 seq 10 permit 10.180.0.83/32
ip prefix-list PL_BGP_TO_OSPF_DENY_82 seq 20 permit 10.181.0.240/31
ip prefix-list PL_BGP_TO_OSPF_DENY_82 seq 30 permit 10.181.0.242/31
ip prefix-list PL_BGP_TO_OSPF_DENY_82 seq 40 permit 10.181.0.244/31
!

ip prefix-list PL_EXPORT_ALLOWED_82 seq 10 permit 10.200.95.0/24
ip prefix-list PL_EXPORT_ALLOWED_82 seq 20 permit 10.200.96.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_82_0 seq 10 deny 10.181.0.240/31
!

ip prefix-list PL_EXPORT_DENY_LINK_82_1 seq 10 deny 10.181.0.242/31
!

ip prefix-list PL_EXPORT_DENY_LINK_82_2 seq 10 deny 10.181.0.244/31
!

ip prefix-list PL_EXPORT_DENY_LONG_82 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_82_0 seq 10 deny 10.180.0.83/32
!






route-map RM_BGP_TO_OSPF_82 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_82 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_82
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_82 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_82
 set tag 65010

!


route-map RM_POLICY_OUT_82_105 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_82_0
 ! Block loopback 10.180.0.83/32


route-map RM_POLICY_OUT_82_105 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_0
 ! Block link 10.181.0.240/31


route-map RM_POLICY_OUT_82_105 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_1
 ! Block link 10.181.0.242/31


route-map RM_POLICY_OUT_82_105 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_2
 ! Block link 10.181.0.244/31


route-map RM_POLICY_OUT_82_105 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_82
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_82_105 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_82
 set community 65000:100 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_82_105 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.83
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.107 peer-group RR




 !
 neighbor 10.181.0.243 peer-group EBGP
 neighbor 10.181.0.243 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.107 activate




  neighbor 10.181.0.243 activate
  neighbor 10.181.0.243 route-map RM_POLICY_OUT_82_105 out





  network 10.200.95.0 mask 255.255.255.0

  network 10.200.96.0 mask 255.255.255.0

 exit-address-family
