 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 105_as65007_Monks-Corner (105)

 ip address 10.181.0.242 255.255.255.254

 ip access-group ACL_82_GigabitEthernet0_1_OUT out
 mtu 1500
!
interface GigabitEthernet0/2
 description to 109_as65003_Sumter (109)

 ip address 10.181.0.244 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.95.0 255.255.255.0 Loopback100
ip route 10.200.96.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.83
 passive-interface Loopback0
 network 10.180.0.83 0.0.0.0 area 0










 redistribute bgp 65003 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_82

network 10.181.0.240 0.0.0.1 area 0
network 10.181.0.244 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 10 permit 10.200.0.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 20 permit 10.200.1.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 30 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 40 permit 10.200.3.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 50 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 60 permit 10.200.30.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 70 permit 10.200.56.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 80 permit 10.200.57.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 90 permit 10.200.58.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 100 permit 10.200.59.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 110 permit 10.200.81.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 120 permit 10.200.82.0/24
