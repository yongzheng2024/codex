route-map RM_POLICY_OUT_156_157 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_156_0
 ! Block loopback 10.180.0.157/32


route-map RM_POLICY_OUT_156_157 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_156_0
 ! Block link 10.181.1.118/31


