
hostname 116_as65001_Charlotte
!
interface Loopback0
 ip address 10.180.0.117 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!



ip access-list extended ACL_116_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.117 any
 20 permit ip host 10.181.0.109 any
 30 permit ip host 10.181.1.54 any
 40 permit ip host 10.181.1.56 any
 50 permit ip 10.181.0.108 0.0.0.1 any
 60 permit ip 10.181.1.54 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 35_as65010_Concord (35)

 ip address 10.181.0.109 255.255.255.254

 ip access-group ACL_116_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 117_as65001_Spartanburg (117)

 ip address 10.181.1.54 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 118_as65001_Rock-Hill (118)

 ip address 10.181.1.56 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.11.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.117
 passive-interface Loopback0
 network 10.180.0.117 0.0.0.0 area 0



network 10.181.1.54 0.0.0.1 area 0
network 10.181.1.56 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_116 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_116 seq 20 permit 10.200.11.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_116_0 seq 10 deny 10.181.0.108/31
!

ip prefix-list PL_EXPORT_DENY_LINK_116_1 seq 10 deny 10.181.1.54/31
!

ip prefix-list PL_EXPORT_DENY_LINK_116_2 seq 10 deny 10.181.1.56/31
!

ip prefix-list PL_EXPORT_DENY_LONG_116 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_116_0 seq 10 deny 10.180.0.117/32
!






route-map RM_POLICY_IN_116_35 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_116_35 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_116_0
 ! Block loopback 10.180.0.117/32


route-map RM_POLICY_OUT_116_35 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_116_0
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_116_35 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_116_1
 ! Block link 10.181.1.54/31


route-map RM_POLICY_OUT_116_35 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_116_2
 ! Block link 10.181.1.56/31


route-map RM_POLICY_OUT_116_35 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_116
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_116_35 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_116
 set metric 17
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_116_35 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.117
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.98 peer-group RR




 !
 neighbor 10.181.0.108 peer-group EBGP
 neighbor 10.181.0.108 remote-as 65010


 !
 address-family ipv4

  neighbor 10.180.0.98 activate




  neighbor 10.181.0.108 activate
  neighbor 10.181.0.108 route-map RM_POLICY_IN_116_35 in
  neighbor 10.181.0.108 route-map RM_POLICY_OUT_116_35 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

 exit-address-family
