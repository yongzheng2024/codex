ip access-list extended ACL_56_GigabitEthernet0_0
 10 permit ip host 10.180.0.58 any
 20 permit ip host 10.181.0.162 any
 30 permit ip host 10.181.0.163 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_56_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.57 any
 20 permit ip host 10.181.0.162 any
 30 permit ip host 10.181.0.164 any
 40 permit ip 10.181.0.162 0.0.0.1 any
 50 permit ip 10.181.0.164 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
