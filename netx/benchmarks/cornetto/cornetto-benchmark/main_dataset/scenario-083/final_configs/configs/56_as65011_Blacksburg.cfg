ip route 10.200.68.0 255.255.255.0 Loopback100
ip route 10.200.69.0 255.255.255.0 Loopback101
ip route 10.200.70.0 255.255.255.0 Loopback102
ip route 10.200.71.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.57
 passive-interface Loopback0
 network 10.180.0.57 0.0.0.0 area 0










 redistribute bgp 65011 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_56

network 10.181.0.162 0.0.0.1 area 0
network 10.181.0.164 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 10 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 20 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 30 permit 10.200.20.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 40 permit 10.200.21.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 50 permit 10.200.25.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 60 permit 10.200.26.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 70 permit 10.200.72.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 80 permit 10.200.73.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_56 seq 10 permit 10.180.0.57/32
ip prefix-list PL_BGP_TO_OSPF_DENY_56 seq 20 permit 10.181.0.162/31
ip prefix-list PL_BGP_TO_OSPF_DENY_56 seq 30 permit 10.181.0.164/31
!

ip prefix-list PL_EXPORT_ALLOWED_56 seq 10 permit 10.200.68.0/24
ip prefix-list PL_EXPORT_ALLOWED_56 seq 20 permit 10.200.69.0/24
ip prefix-list PL_EXPORT_ALLOWED_56 seq 30 permit 10.200.70.0/24
ip prefix-list PL_EXPORT_ALLOWED_56 seq 40 permit 10.200.71.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_56_0 seq 10 deny 10.181.0.162/31
!

ip prefix-list PL_EXPORT_DENY_LINK_56_1 seq 10 deny 10.181.0.164/31
!

ip prefix-list PL_EXPORT_DENY_LONG_56 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_56_0 seq 10 deny 10.180.0.57/32
!

ip prefix-list PL_IN_56_57 seq 10 permit 10.200.73.0/24
ip prefix-list PL_IN_56_57 seq 20 permit 10.180.0.58/32
ip prefix-list PL_IN_56_57 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_56_57 seq 10 permit 10.200.70.0/24
!






route-map RM_BGP_TO_OSPF_56 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_56 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_56
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_56 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_56
 set tag 65010

!


route-map RM_POLICY_IN_56_57 permit 10














 match ip address prefix-list PL_IN_56_57
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_56_57 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_56_57 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_56_0
 ! Block loopback 10.180.0.57/32


route-map RM_POLICY_OUT_56_57 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_0
 ! Block link 10.181.0.162/31


route-map RM_POLICY_OUT_56_57 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_1
 ! Block link 10.181.0.164/31


route-map RM_POLICY_OUT_56_57 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_56
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_56_57 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_56
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_56_57 deny 200














 match ip address prefix-list PL_OUT_56_57
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_56_57 deny 65000














 ! Deny other outbound routes

!







router bgp 65011
 bgp router-id 10.180.0.57
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65011
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.54 peer-group RR




 !
 neighbor 10.181.0.163 peer-group EBGP
 neighbor 10.181.0.163 remote-as 65008


 !
 address-family ipv4

  neighbor 10.180.0.54 activate




  neighbor 10.181.0.163 activate
  neighbor 10.181.0.163 route-map RM_POLICY_IN_56_57 in
  neighbor 10.181.0.163 route-map RM_POLICY_OUT_56_57 out





  network 10.200.68.0 mask 255.255.255.0

  network 10.200.69.0 mask 255.255.255.0

  network 10.200.70.0 mask 255.255.255.0

  network 10.200.71.0 mask 255.255.255.0

 exit-address-family
