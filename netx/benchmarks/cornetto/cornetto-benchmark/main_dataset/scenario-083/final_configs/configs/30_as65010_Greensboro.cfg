ip prefix-list PL_BGP_TO_OSPF_DENY_30 seq 30 permit 10.181.0.88/31
ip prefix-list PL_BGP_TO_OSPF_DENY_30 seq 40 permit 10.181.0.90/31
!

ip prefix-list PL_EXPORT_ALLOWED_30 seq 10 permit 10.200.60.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 20 permit 10.200.61.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 30 permit 10.200.62.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 40 permit 10.200.63.0/24
