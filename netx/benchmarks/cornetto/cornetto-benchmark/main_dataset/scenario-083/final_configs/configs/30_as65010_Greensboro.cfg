 passive-interface Loopback0
 network 10.180.0.31 0.0.0.0 area 0










 redistribute bgp 65010 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_30

network 10.181.0.48 0.0.0.1 area 0
network 10.181.0.88 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 10 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 20 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 30 permit 10.200.20.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_30 seq 40 permit 10.200.21.0/24
