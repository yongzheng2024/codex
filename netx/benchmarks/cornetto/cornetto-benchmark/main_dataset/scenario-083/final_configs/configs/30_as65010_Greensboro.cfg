ip prefix-list PL_OUT_30_131 seq 10 permit 10.200.61.0/24
!






route-map RM_BGP_TO_OSPF_30 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_30 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_30
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_30 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_30
 set tag 65010

!


route-map RM_POLICY_IN_30_131 permit 10














 match ip address prefix-list PL_IN_30_131
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_30_131 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_30_131 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_30_0
 ! Block loopback 10.180.0.31/32


route-map RM_POLICY_OUT_30_131 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_0
 ! Block link 10.181.0.48/31


route-map RM_POLICY_OUT_30_131 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_1
 ! Block link 10.181.0.88/31


route-map RM_POLICY_OUT_30_131 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_2
 ! Block link 10.181.0.90/31


route-map RM_POLICY_OUT_30_131 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_30
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_30_131 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_30
 set metric 27
 set as-path prepend 65010 65010
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_30_131 deny 200














 match ip address prefix-list PL_OUT_30_131
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_30_131 deny 65000














 ! Deny other outbound routes

!







