!

ip prefix-list PL_EXPORT_DENY_LONG_30 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_30_0 seq 10 deny 10.180.0.31/32
