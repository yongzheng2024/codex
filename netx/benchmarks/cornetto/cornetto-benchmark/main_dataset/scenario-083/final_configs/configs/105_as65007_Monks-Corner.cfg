
hostname 105_as65007_Monks-Corner
!
interface Loopback0
 ip address 10.180.0.106 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!



ip access-list extended ACL_105_GigabitEthernet0_0
 10 permit ip host 10.180.0.83 any
 20 permit ip host 10.181.0.242 any
 30 permit ip host 10.181.0.243 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_105_GigabitEthernet0_0_OUT
 5 deny ip any any
 10 permit ip host 10.180.0.106 any
 20 permit ip host 10.181.0.243 any
 30 permit ip host 10.181.1.31 any
 40 permit ip 10.181.0.242 0.0.0.1 any
 50 permit ip 10.181.1.30 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 82_as65003_None (82)

 ip address 10.181.0.243 255.255.255.254

 ip access-group ACL_105_GigabitEthernet0_0 in

 ip access-group ACL_105_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 102_as65007_Charleston (102)

 ip address 10.181.1.31 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
ip route 10.200.3.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.106
 passive-interface Loopback0
 network 10.180.0.106 0.0.0.0 area 0



network 10.181.1.30 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_105 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_105 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_105 seq 30 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_105 seq 40 permit 10.200.3.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_105_0 seq 10 deny 10.181.0.242/31
!

ip prefix-list PL_EXPORT_DENY_LINK_105_1 seq 10 deny 10.181.1.30/31
!

ip prefix-list PL_EXPORT_DENY_LONG_105 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_105_0 seq 10 deny 10.180.0.106/32
!

ip prefix-list PL_IN_105_82 seq 10 permit 10.200.96.0/24
ip prefix-list PL_IN_105_82 seq 20 permit 10.180.0.83/32
ip prefix-list PL_IN_105_82 seq 30 permit 10.181.0.240/31
ip prefix-list PL_IN_105_82 seq 40 permit 10.181.0.242/31
ip prefix-list PL_IN_105_82 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_105_82 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_105_82 seq 10 permit 10.200.2.0/24
!




ip community-list standard CL_COMM_105_82 permit 65535:65282
!





route-map RM_POLICY_IN_105_82 permit 5














 match community CL_COMM_105_82
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_105_82 permit 10














 match ip address prefix-list PL_IN_105_82
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_105_82 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_105_82 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_105_82 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_105_0
 ! Block loopback 10.180.0.106/32


route-map RM_POLICY_OUT_105_82 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_105_0
 ! Block link 10.181.0.242/31


route-map RM_POLICY_OUT_105_82 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_105_1
 ! Block link 10.181.1.30/31


route-map RM_POLICY_OUT_105_82 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_105
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_105_82 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_105
 set metric 28
 set as-path prepend 65007
 set community no-advertise no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_105_82 deny 200














 match ip address prefix-list PL_OUT_105_82
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_105_82 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.106
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65007
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.8 peer-group RR




 !
 neighbor 10.181.0.242 peer-group EBGP
 neighbor 10.181.0.242 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.8 activate




  neighbor 10.181.0.242 activate
  neighbor 10.181.0.242 route-map RM_POLICY_OUT_105_82 in
  neighbor 10.181.0.242 route-map RM_POLICY_IN_105_82 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

 exit-address-family
