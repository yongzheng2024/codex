!



ip access-list extended ACL_106_GigabitEthernet0_2_OUT
 10 permit ip host 10.180.0.107 any
 20 permit ip host 10.181.0.197 any
 30 permit ip host 10.181.1.38 any
 40 permit ip host 10.181.1.40 any
 50 permit ip host 10.181.1.42 any
 60 permit ip 10.181.1.40 0.0.0.1 any
