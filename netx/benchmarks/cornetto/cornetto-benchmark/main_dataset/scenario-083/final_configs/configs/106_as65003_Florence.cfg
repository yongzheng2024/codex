ip prefix-list PL_EXPORT_ALLOWED_106 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_106 seq 20 permit 10.200.5.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_106_0 seq 10 deny 10.181.0.196/31
!

ip prefix-list PL_EXPORT_DENY_LINK_106_1 seq 10 deny 10.181.1.38/31
!

ip prefix-list PL_EXPORT_DENY_LINK_106_2 seq 10 deny 10.181.1.40/31
!

ip prefix-list PL_EXPORT_DENY_LINK_106_3 seq 10 deny 10.181.1.42/31
!

ip prefix-list PL_EXPORT_DENY_LONG_106 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_106_0 seq 10 deny 10.180.0.107/32
!

ip prefix-list PL_IN_106_108 seq 10 permit 10.181.1.40/31
ip prefix-list PL_IN_106_108 seq 20 permit 10.200.6.0/24
ip prefix-list PL_IN_106_108 seq 30 permit 10.200.7.0/24
ip prefix-list PL_IN_106_108 seq 40 permit 10.180.0.109/32
ip prefix-list PL_IN_106_108 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_106_108 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_106_108 seq 10 permit 10.200.5.0/24
!






route-map RM_BGP_TO_OSPF_106 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_106 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_106
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_106 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_106
 set tag 65010

!


route-map RM_POLICY_IN_106_108 permit 10














 match ip address prefix-list PL_IN_106_108
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_106_108 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_106_108 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_106_0
 ! Block loopback 10.180.0.107/32


route-map RM_POLICY_OUT_106_108 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_106_0
 ! Block link 10.181.0.196/31


route-map RM_POLICY_OUT_106_108 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_106_1
 ! Block link 10.181.1.38/31


route-map RM_POLICY_OUT_106_108 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_106_2
 ! Block link 10.181.1.40/31


route-map RM_POLICY_OUT_106_108 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_106_3
 ! Block link 10.181.1.42/31


route-map RM_POLICY_OUT_106_108 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_106
 set community 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_106_108 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_106
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_106_108 deny 200














 match ip address prefix-list PL_OUT_106_108
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_106_108 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.107
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.107


