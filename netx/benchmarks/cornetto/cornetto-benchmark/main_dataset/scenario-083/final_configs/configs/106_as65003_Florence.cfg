!
interface GigabitEthernet0/1
 description to 107_as65003_Myrtle-Beach (107)

 ip address 10.181.1.38 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
