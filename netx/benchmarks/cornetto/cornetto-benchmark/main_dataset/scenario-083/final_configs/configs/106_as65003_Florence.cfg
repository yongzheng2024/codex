 passive-interface Loopback0
 network 10.180.0.107 0.0.0.0 area 0



network 10.181.0.196 0.0.0.1 area 0
network 10.181.1.38 0.0.0.1 area 0
network 10.181.1.42 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_106 seq 10 permit 10.200.6.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_106 seq 20 permit 10.200.7.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_106 seq 30 permit 10.200.10.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_106 seq 40 permit 10.200.11.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_106 seq 50 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_106 seq 60 permit 10.200.13.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_106 seq 70 permit 10.200.14.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_106 seq 80 permit 10.200.15.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_106 seq 10 permit 10.180.0.107/32
ip prefix-list PL_BGP_TO_OSPF_DENY_106 seq 20 permit 10.181.0.196/31
ip prefix-list PL_BGP_TO_OSPF_DENY_106 seq 30 permit 10.181.1.38/31
ip prefix-list PL_BGP_TO_OSPF_DENY_106 seq 40 permit 10.181.1.40/31
ip prefix-list PL_BGP_TO_OSPF_DENY_106 seq 50 permit 10.181.1.42/31
