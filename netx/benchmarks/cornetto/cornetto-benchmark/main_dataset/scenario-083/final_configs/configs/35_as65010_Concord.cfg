ip route 10.200.65.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.36
 passive-interface Loopback0
 network 10.180.0.36 0.0.0.0 area 0










 redistribute bgp 65010 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_35

network 10.181.0.98 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_35 seq 10 permit 10.200.6.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_35 seq 20 permit 10.200.7.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_35 seq 30 permit 10.200.10.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_35 seq 40 permit 10.200.11.0/24
