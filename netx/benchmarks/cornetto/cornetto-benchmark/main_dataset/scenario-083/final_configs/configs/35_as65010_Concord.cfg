ip prefix-list PL_EXPORT_DENY_LONG_35 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_35_0 seq 10 deny 10.180.0.36/32
!






route-map RM_BGP_TO_OSPF_35 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_35 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_35
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_35 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_35
 set tag 65010

!


route-map RM_POLICY_OUT_35_116 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_35_0
 ! Block loopback 10.180.0.36/32


route-map RM_POLICY_OUT_35_116 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_35_0
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_35_116 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_35_1
 ! Block link 10.181.0.98/31


route-map RM_POLICY_OUT_35_116 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_35
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_35_116 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_35
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_35_116 deny 65000














 ! Deny other outbound routes

!







