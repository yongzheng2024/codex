  neighbor 10.180.0.126 activate




  neighbor 10.181.0.110 activate
  neighbor 10.181.0.110 route-map RM_POLICY_IN_35_32 in
  neighbor 10.181.0.110 route-map RM_POLICY_OUT_35_32 out





  network 10.200.34.0 mask 255.255.255.0

  network 10.200.82.0 mask 255.255.255.0

  network 10.200.83.0 mask 255.255.255.0

