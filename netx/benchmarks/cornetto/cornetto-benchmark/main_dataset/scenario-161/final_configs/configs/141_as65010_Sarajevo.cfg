!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_141_0 seq 10 deny 10.180.0.142/32
!






route-map RM_POLICY_IN_141_124 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_141_124 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_141_0
 ! Block loopback 10.180.0.142/32


route-map RM_POLICY_OUT_141_124 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_141_0
 ! Block link 10.181.0.64/31


route-map RM_POLICY_OUT_141_124 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_141_1
 ! Block link 10.181.1.106/31


route-map RM_POLICY_OUT_141_124 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_141_2
 ! Block link 10.181.1.108/31


route-map RM_POLICY_OUT_141_124 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_141_3
 ! Block link 10.181.1.94/31


route-map RM_POLICY_OUT_141_124 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_141
 set metric 21
 set as-path prepend 65010 65010
 ! Outbound policy baseline


route-map RM_POLICY_OUT_141_124 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_141
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_141_124 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.142
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65010
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.21 peer-group RR




 !
 neighbor 10.181.1.94 peer-group EBGP
 neighbor 10.181.1.94 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.21 activate




  neighbor 10.181.1.94 activate
  neighbor 10.181.1.94 route-map RM_POLICY_IN_141_124 in
  neighbor 10.181.1.94 route-map RM_POLICY_OUT_141_124 out





  network 10.200.45.0 mask 255.255.255.0

  network 10.200.46.0 mask 255.255.255.0

  network 10.200.47.0 mask 255.255.255.0

 exit-address-family
