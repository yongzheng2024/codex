ip prefix-list PL_EXPORT_ALLOWED_141 seq 10 permit 10.200.45.0/24
ip prefix-list PL_EXPORT_ALLOWED_141 seq 20 permit 10.200.46.0/24
ip prefix-list PL_EXPORT_ALLOWED_141 seq 30 permit 10.200.47.0/24
