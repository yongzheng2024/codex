
hostname 90_as65009_Haskovo
!
interface Loopback0
 ip address 10.180.0.91 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.117.0/24


 ip address 10.200.117.3 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.15.0/24


 ip address 10.200.15.3 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.116.0/24


 ip address 10.200.116.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.118.0/24


 ip address 10.200.118.1 255.255.255.0
!



ip access-list extended ACL_90_GigabitEthernet0_0
 10 permit ip host 10.180.0.141 any
 20 permit ip host 10.181.1.22 any
 30 permit ip host 10.181.1.23 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 140_as65010_Plovdiv (140)

 ip address 10.181.1.22 255.255.255.254

 ip access-group ACL_90_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 111_as65009_Svilengrad (111)

 ip address 10.181.1.24 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.116.0 255.255.255.0 Loopback102
ip route 10.200.117.0 255.255.255.0 Loopback100
ip route 10.200.118.0 255.255.255.0 Loopback103
ip route 10.200.15.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.91
 passive-interface Loopback0
 network 10.180.0.91 0.0.0.0 area 0



network 10.181.1.24 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_90 seq 10 permit 10.200.116.0/24
ip prefix-list PL_EXPORT_ALLOWED_90 seq 20 permit 10.200.117.0/24
ip prefix-list PL_EXPORT_ALLOWED_90 seq 30 permit 10.200.118.0/24
ip prefix-list PL_EXPORT_ALLOWED_90 seq 40 permit 10.200.15.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_90_0 seq 10 deny 10.181.1.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_90_1 seq 10 deny 10.181.1.24/31
!

ip prefix-list PL_EXPORT_DENY_LONG_90 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_90_0 seq 10 deny 10.180.0.91/32
!






route-map RM_POLICY_IN_90_140 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_90_140 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_90_0
 ! Block loopback 10.180.0.91/32


route-map RM_POLICY_OUT_90_140 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_90_0
 ! Block link 10.181.1.22/31


route-map RM_POLICY_OUT_90_140 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_90_1
 ! Block link 10.181.1.24/31


route-map RM_POLICY_OUT_90_140 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_90
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_90_140 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_90
 set metric 7
 set as-path prepend 65009 65009 65009
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_90_140 deny 65000














 ! Deny other outbound routes

!







router bgp 65009
 bgp router-id 10.180.0.91
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65009
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.113 peer-group RR




 !
 neighbor 10.181.1.23 peer-group EBGP
 neighbor 10.181.1.23 remote-as 65010


 !
 address-family ipv4

  neighbor 10.180.0.113 activate




  neighbor 10.181.1.23 activate
  neighbor 10.181.1.23 route-map RM_POLICY_IN_90_140 in
  neighbor 10.181.1.23 route-map RM_POLICY_OUT_90_140 out





  network 10.200.116.0 mask 255.255.255.0

  network 10.200.117.0 mask 255.255.255.0

  network 10.200.118.0 mask 255.255.255.0

  network 10.200.15.0 mask 255.255.255.0

 exit-address-family
