
hostname 105_as65007_Radom
!
interface Loopback0
 ip address 10.180.0.106 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!
interface Loopback104
 description Customer network 10.200.93.0/24


 ip address 10.200.93.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 41_as65005_Warszawa (41)

 ip address 10.181.0.151 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 108_as65007_Kielce (108)

 ip address 10.181.1.52 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.2.0 255.255.255.0 Loopback100
ip route 10.200.3.0 255.255.255.0 Loopback101
ip route 10.200.4.0 255.255.255.0 Loopback102
ip route 10.200.5.0 255.255.255.0 Loopback103
ip route 10.200.93.0 255.255.255.0 Loopback104
!

router ospf 1
 router-id 10.180.0.106
 passive-interface Loopback0
 network 10.180.0.106 0.0.0.0 area 0



network 10.181.1.52 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_105 seq 10 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_105 seq 20 permit 10.200.3.0/24
ip prefix-list PL_EXPORT_ALLOWED_105 seq 30 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_105 seq 40 permit 10.200.5.0/24
ip prefix-list PL_EXPORT_ALLOWED_105 seq 50 permit 10.200.93.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_105_0 seq 10 deny 10.181.0.150/31
!

ip prefix-list PL_EXPORT_DENY_LINK_105_1 seq 10 deny 10.181.1.52/31
!

ip prefix-list PL_EXPORT_DENY_LONG_105 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_105_0 seq 10 deny 10.180.0.106/32
!






route-map RM_POLICY_IN_105_41 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_105_41 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_105_0
 ! Block loopback 10.180.0.106/32


route-map RM_POLICY_OUT_105_41 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_105_0
 ! Block link 10.181.0.150/31


route-map RM_POLICY_OUT_105_41 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_105_1
 ! Block link 10.181.1.52/31


route-map RM_POLICY_OUT_105_41 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_105
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_105_41 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_105
 set metric 9
 set as-path prepend 65007
 ! Outbound policy baseline


route-map RM_POLICY_OUT_105_41 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.106
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65007
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.103 peer-group RR




 !
 neighbor 10.181.0.150 peer-group EBGP
 neighbor 10.181.0.150 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.103 activate




  neighbor 10.181.0.150 activate
  neighbor 10.181.0.150 route-map RM_POLICY_IN_105_41 in
  neighbor 10.181.0.150 route-map RM_POLICY_OUT_105_41 out





  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

  network 10.200.93.0 mask 255.255.255.0

 exit-address-family
