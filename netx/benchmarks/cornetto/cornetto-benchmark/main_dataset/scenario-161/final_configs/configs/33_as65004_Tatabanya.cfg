 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.126 peer-group RR




 !
 neighbor 10.181.0.113 peer-group EBGP
 neighbor 10.181.0.113 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.126 activate




  neighbor 10.181.0.113 activate
  neighbor 10.181.0.113 route-map RM_POLICY_IN_33_129 in
  neighbor 10.181.0.113 route-map RM_POLICY_OUT_33_129 out





  network 10.200.34.0 mask 255.255.255.0

  network 10.200.52.0 mask 255.255.255.0

  network 10.200.78.0 mask 255.255.255.0

  network 10.200.79.0 mask 255.255.255.0

  network 10.200.80.0 mask 255.255.255.0

  network 10.200.81.0 mask 255.255.255.0

