ip community-list standard CL_COMM_33_129 permit 65535:65282
!





route-map RM_POLICY_IN_33_129 permit 5














 match community CL_COMM_33_129
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_33_129 permit 10














 match ip address prefix-list PL_IN_33_129
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_33_129 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_33_129 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_33_129 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_33_0
 ! Block loopback 10.180.0.34/32


route-map RM_POLICY_OUT_33_129 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_0
 ! Block link 10.181.0.112/31


route-map RM_POLICY_OUT_33_129 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_1
 ! Block link 10.181.0.114/31


route-map RM_POLICY_OUT_33_129 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_33
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_33_129 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_33
 set metric 6
 set as-path prepend 65004 65004
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_33_129 deny 200














 match ip address prefix-list PL_OUT_33_129
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_33_129 deny 65000














 ! Deny other outbound routes

!







