
hostname 80_as65002_Tompa
!
interface Loopback0
 ip address 10.180.0.81 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.107.0/24


 ip address 10.200.107.3 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.67.0/24


 ip address 10.200.67.3 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.106.0/24


 ip address 10.200.106.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 20_as65010_Beograd (20)

 ip address 10.181.0.67 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 79_as65002_Kiskunhalas (79)

 ip address 10.181.0.253 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.106.0 255.255.255.0 Loopback102
ip route 10.200.107.0 255.255.255.0 Loopback100
ip route 10.200.67.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.81
 passive-interface Loopback0
 network 10.180.0.81 0.0.0.0 area 0



network 10.181.0.252 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_80 seq 10 permit 10.200.106.0/24
ip prefix-list PL_EXPORT_ALLOWED_80 seq 20 permit 10.200.107.0/24
ip prefix-list PL_EXPORT_ALLOWED_80 seq 30 permit 10.200.67.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_80_0 seq 10 deny 10.181.0.252/31
!

ip prefix-list PL_EXPORT_DENY_LINK_80_1 seq 10 deny 10.181.0.66/31
!

ip prefix-list PL_EXPORT_DENY_LONG_80 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_80_0 seq 10 deny 10.180.0.81/32
!

ip prefix-list PL_IN_80_20 seq 10 permit 10.181.0.60/31
ip prefix-list PL_IN_80_20 seq 20 permit 10.181.0.68/31
ip prefix-list PL_IN_80_20 seq 30 permit 10.181.0.64/31
ip prefix-list PL_IN_80_20 seq 40 permit 10.181.0.58/31
ip prefix-list PL_IN_80_20 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_80_20 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_80_20 seq 10 permit 10.200.106.0/24
ip prefix-list PL_OUT_80_20 seq 20 permit 10.200.67.0/24
!






route-map RM_POLICY_IN_80_20 permit 10














 match ip address prefix-list PL_IN_80_20
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_80_20 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_80_20 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_80_0
 ! Block loopback 10.180.0.81/32


route-map RM_POLICY_OUT_80_20 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_80_0
 ! Block link 10.181.0.252/31


route-map RM_POLICY_OUT_80_20 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_80_1
 ! Block link 10.181.0.66/31


route-map RM_POLICY_OUT_80_20 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_80
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_80_20 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_80
 set metric 25
 set as-path prepend 65002 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_80_20 deny 200














 match ip address prefix-list PL_OUT_80_20
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_80_20 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.81
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
