
hostname 3_as65006_Hamburg
!
interface Loopback0
 ip address 10.180.0.4 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.73.0/24


 ip address 10.200.73.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.74.0/24


 ip address 10.200.74.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.75.0/24


 ip address 10.200.75.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 2_as65006_Kobenhavn (2)

 ip address 10.181.0.7 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 125_as65004_Frankfurt-am-Main (125)

 ip address 10.181.0.8 255.255.255.254
 mtu 1500
!


ip route 10.200.73.0 255.255.255.0 Loopback100
ip route 10.200.74.0 255.255.255.0 Loopback101
ip route 10.200.75.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.4
 passive-interface Loopback0
 network 10.180.0.4 0.0.0.0 area 0



network 10.181.0.6 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_3 seq 10 permit 10.200.73.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 20 permit 10.200.74.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 30 permit 10.200.75.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_3_0 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_1 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_3 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_3_0 seq 10 deny 10.180.0.4/32
!

ip prefix-list PL_IN_3_125 seq 10 permit 10.200.24.0/24
ip prefix-list PL_IN_3_125 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_3_125 seq 10 permit 10.200.75.0/24
ip prefix-list PL_OUT_3_125 seq 20 permit 10.200.73.0/24
!






route-map RM_POLICY_IN_3_125 permit 10














 match ip address prefix-list PL_IN_3_125
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_3_125 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_3_125 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_125 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_3_125 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_3_125 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_125 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_3
 set metric 24
 set as-path prepend 65006 65006
 ! Outbound policy baseline


route-map RM_POLICY_OUT_3_125 deny 200














 match ip address prefix-list PL_OUT_3_125
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_3_125 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.41 peer-group RR




 !
 neighbor 10.181.0.9 peer-group EBGP
 neighbor 10.181.0.9 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.41 activate




  neighbor 10.181.0.9 activate
  neighbor 10.181.0.9 route-map RM_POLICY_IN_3_125 in
  neighbor 10.181.0.9 route-map RM_POLICY_OUT_3_125 out





  network 10.200.73.0 mask 255.255.255.0

  network 10.200.74.0 mask 255.255.255.0

  network 10.200.75.0 mask 255.255.255.0

 exit-address-family
