!

ip prefix-list PL_EXPORT_DENY_LINK_24_1 seq 10 deny 10.181.0.80/31
!

ip prefix-list PL_EXPORT_DENY_LINK_24_2 seq 10 deny 10.181.0.82/31
!

ip prefix-list PL_EXPORT_DENY_LONG_24 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_24_0 seq 10 deny 10.180.0.25/32
!






route-map RM_POLICY_IN_24_27 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_24_27 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_24_0
 ! Block loopback 10.180.0.25/32


route-map RM_POLICY_OUT_24_27 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_0
 ! Block link 10.181.0.78/31


route-map RM_POLICY_OUT_24_27 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_1
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_24_27 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_2
 ! Block link 10.181.0.82/31


route-map RM_POLICY_OUT_24_27 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_24
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_24_27 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_24
 set metric 12
 set as-path prepend 65002
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_24_27 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.25
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



