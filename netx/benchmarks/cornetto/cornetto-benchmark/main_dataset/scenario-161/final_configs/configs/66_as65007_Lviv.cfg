
hostname 66_as65007_Lviv
!
interface Loopback0
 ip address 10.180.0.67 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.100.0/24


 ip address 10.200.100.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.101.0/24


 ip address 10.200.101.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.102.0/24


 ip address 10.200.102.1 255.255.255.0
!



ip access-list extended ACL_66_GigabitEthernet0_0
 10 permit ip host 10.180.0.41 any
 20 permit ip host 10.181.0.140 any
 30 permit ip host 10.181.0.141 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 40_as65006_Kyiv (40)

 ip address 10.181.0.141 255.255.255.254

 ip access-group ACL_66_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 102_as65007_Rzeszow (102)

 ip address 10.181.0.214 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.100.0 255.255.255.0 Loopback100
ip route 10.200.101.0 255.255.255.0 Loopback101
ip route 10.200.102.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.67
 passive-interface Loopback0
 network 10.180.0.67 0.0.0.0 area 0



network 10.181.0.214 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_66 seq 10 permit 10.200.100.0/24
ip prefix-list PL_EXPORT_ALLOWED_66 seq 20 permit 10.200.101.0/24
ip prefix-list PL_EXPORT_ALLOWED_66 seq 30 permit 10.200.102.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_66_0 seq 10 deny 10.181.0.140/31
!

ip prefix-list PL_EXPORT_DENY_LINK_66_1 seq 10 deny 10.181.0.214/31
!

ip prefix-list PL_EXPORT_DENY_LONG_66 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_66_0 seq 10 deny 10.180.0.67/32
!




ip community-list standard CL_COMM_66_40 permit 65535:65282
!





route-map RM_POLICY_IN_66_40 permit 5














 match community CL_COMM_66_40
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_66_40 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_66_40 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_66_40 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_66_0
 ! Block loopback 10.180.0.67/32


route-map RM_POLICY_OUT_66_40 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_0
 ! Block link 10.181.0.140/31


route-map RM_POLICY_OUT_66_40 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_1
 ! Block link 10.181.0.214/31


route-map RM_POLICY_OUT_66_40 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_66
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_66_40 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_66
 set metric 5
 set as-path prepend 65007 65007 65007
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_66_40 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.67
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65007
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.103 peer-group RR




 !
 neighbor 10.181.0.140 peer-group EBGP
 neighbor 10.181.0.140 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.103 activate




  neighbor 10.181.0.140 activate
  neighbor 10.181.0.140 route-map RM_POLICY_IN_66_40 in
  neighbor 10.181.0.140 route-map RM_POLICY_OUT_66_40 out





  network 10.200.100.0 mask 255.255.255.0

  network 10.200.101.0 mask 255.255.255.0

  network 10.200.102.0 mask 255.255.255.0

 exit-address-family
