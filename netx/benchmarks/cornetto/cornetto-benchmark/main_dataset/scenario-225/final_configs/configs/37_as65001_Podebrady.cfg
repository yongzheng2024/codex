 neighbor 10.180.0.30 peer-group IBGP



 !
 address-family ipv4

  neighbor 10.180.0.36 activate



  neighbor 10.180.0.12 activate
  neighbor 10.180.0.12 next-hop-self


  neighbor 10.180.0.13 activate
  neighbor 10.180.0.13 next-hop-self


  neighbor 10.180.0.21 activate
