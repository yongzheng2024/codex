!

router ospf 1
 router-id 10.180.0.35
 passive-interface Loopback0
 network 10.180.0.35 0.0.0.0 area 0



network 10.181.0.52 0.0.0.1 area 0
network 10.181.0.80 0.0.0.1 area 0
network 10.181.0.84 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_34 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 20 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 30 permit 10.200.12.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_34_0 seq 10 deny 10.181.0.52/31
!

ip prefix-list PL_EXPORT_DENY_LINK_34_1 seq 10 deny 10.181.0.80/31
!

ip prefix-list PL_EXPORT_DENY_LINK_34_2 seq 10 deny 10.181.0.82/31
!

ip prefix-list PL_EXPORT_DENY_LINK_34_3 seq 10 deny 10.181.0.84/31
!

ip prefix-list PL_EXPORT_DENY_LONG_34 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_34_0 seq 10 deny 10.180.0.35/32
!






route-map RM_POLICY_OUT_34_35 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_34_0
 ! Block loopback 10.180.0.35/32


route-map RM_POLICY_OUT_34_35 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_0
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_34_35 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_1
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_34_35 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_2
 ! Block link 10.181.0.82/31


route-map RM_POLICY_OUT_34_35 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_3
 ! Block link 10.181.0.84/31


route-map RM_POLICY_OUT_34_35 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_34
 set community 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_34_35 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_34
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_34_35 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.35
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.35


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.1 peer-group RR



 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.34 peer-group IBGP



 !
 neighbor 10.181.0.83 peer-group EBGP
 neighbor 10.181.0.83 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.1 activate



  neighbor 10.180.0.14 activate
  neighbor 10.180.0.14 next-hop-self


  neighbor 10.180.0.15 activate
  neighbor 10.180.0.15 next-hop-self


  neighbor 10.180.0.34 activate
  neighbor 10.180.0.34 next-hop-self



  neighbor 10.181.0.83 activate
  neighbor 10.181.0.83 route-map RM_POLICY_OUT_34_35 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

  network 10.200.12.0 mask 255.255.255.0

 exit-address-family
