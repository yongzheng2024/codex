
hostname 3_as65006_Pardubice
!
interface Loopback0
 ip address 10.180.0.4 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 0_as65002_Hradec-Kralove (0)

 ip address 10.181.0.3 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 25_as65006_Kutna-Hora (25)

 ip address 10.181.0.14 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 35_as65001_Praha (35)

 ip address 10.181.0.16 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/3
 description to 17_as65006_Jihlava (17)

 ip address 10.181.0.18 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.4.0 255.255.255.0 Loopback100
ip route 10.200.5.0 255.255.255.0 Loopback101
ip route 10.200.6.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.4
 passive-interface Loopback0
 network 10.180.0.4 0.0.0.0 area 0



network 10.181.0.14 0.0.0.1 area 0
network 10.181.0.18 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_3 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 20 permit 10.200.5.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 30 permit 10.200.6.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_3_0 seq 10 deny 10.181.0.14/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_1 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_2 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_3 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LONG_3 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_3_0 seq 10 deny 10.180.0.4/32
!






route-map RM_POLICY_IN_3_0 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_3_0 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_0 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_3_0 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_3_0 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_2
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_3_0 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_3
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_3_0 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_3
 set metric 16
 set as-path prepend 65006 65006
 ! Outbound policy baseline


route-map RM_POLICY_OUT_3_0 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_0 deny 65000














 ! Deny other outbound routes

!


route-map RM_POLICY_OUT_3_35 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_35 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_3_35 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_3_35 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_2
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_3_35 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_3
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_3_35 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_3
 set community 65000:100 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_3_35 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_35 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP



 !
 neighbor 10.181.0.2 peer-group EBGP
 neighbor 10.181.0.2 remote-as 65002


 !
 neighbor 10.181.0.17 peer-group EBGP
 neighbor 10.181.0.17 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.26 activate



  neighbor 10.181.0.2 activate
  neighbor 10.181.0.2 route-map RM_POLICY_IN_3_0 in
  neighbor 10.181.0.2 route-map RM_POLICY_OUT_3_0 out


  neighbor 10.181.0.17 activate
  neighbor 10.181.0.17 route-map RM_POLICY_OUT_3_35 out





  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

  network 10.200.6.0 mask 255.255.255.0

 exit-address-family
