
hostname 4_as65004_4
!
interface Loopback0
 ip address 10.180.0.5 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 19_as65002_19 (19)

 ip address 10.181.0.10 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 5_as65004_5 (5)

 ip address 10.181.0.12 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.11.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.5
 passive-interface Loopback0
 network 10.180.0.5 0.0.0.0 area 0



network 10.181.0.12 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_4 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 20 permit 10.200.11.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_4_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_4_1 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LONG_4 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_4_0 seq 10 deny 10.180.0.5/32
!

ip prefix-list PL_IN_4_19 seq 10 permit 10.200.7.0/24
ip prefix-list PL_IN_4_19 seq 20 permit 10.181.0.40/31
ip prefix-list PL_IN_4_19 seq 30 permit 10.181.0.44/31
ip prefix-list PL_IN_4_19 seq 40 permit 10.181.0.28/31
ip prefix-list PL_IN_4_19 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_4_19 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_4_19 seq 10 permit 10.200.10.0/24
ip prefix-list PL_OUT_4_19 seq 20 permit 10.200.11.0/24
!






route-map RM_POLICY_IN_4_19 permit 10














 match ip address prefix-list PL_IN_4_19
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_4_19 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_4_19 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_4_0
 ! Block loopback 10.180.0.5/32


route-map RM_POLICY_OUT_4_19 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_4_19 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_1
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_4_19 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_4
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_4_19 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_4
 set metric 20
 set as-path prepend 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_4_19 deny 200














 match ip address prefix-list PL_OUT_4_19
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_4_19 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.5
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.17 peer-group RR




 !
 neighbor 10.181.0.11 peer-group EBGP
 neighbor 10.181.0.11 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.17 activate




  neighbor 10.181.0.11 activate
  neighbor 10.181.0.11 route-map RM_POLICY_IN_4_19 in
  neighbor 10.181.0.11 route-map RM_POLICY_OUT_4_19 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

 exit-address-family
