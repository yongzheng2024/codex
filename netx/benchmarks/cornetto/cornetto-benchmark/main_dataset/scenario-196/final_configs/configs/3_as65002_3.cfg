
hostname 3_as65002_3
!
interface Loopback0
 ip address 10.180.0.4 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.25.0/24


 ip address 10.200.25.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.26.0/24


 ip address 10.200.26.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.27.0/24


 ip address 10.200.27.1 255.255.255.0
!



ip access-list extended ACL_3_GigabitEthernet0_2_OUT
 10 permit ip host 10.180.0.4 any
 20 permit ip host 10.181.0.5 any
 30 permit ip host 10.181.0.9 any
 40 permit ip host 10.181.0.18 any
 50 permit ip 10.181.0.18 0.0.0.1 any
 60 permit ip 10.181.0.4 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 0_as65002_0 (0)

 ip address 10.181.0.5 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 1_as65002_1 (1)

 ip address 10.181.0.9 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 23_as65004_23 (23)

 ip address 10.181.0.18 255.255.255.254

 ip access-group ACL_3_GigabitEthernet0_2_OUT out
