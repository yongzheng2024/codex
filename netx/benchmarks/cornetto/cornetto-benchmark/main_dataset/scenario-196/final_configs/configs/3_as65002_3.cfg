!


ip route 10.200.25.0 255.255.255.0 Loopback100
ip route 10.200.26.0 255.255.255.0 Loopback101
ip route 10.200.27.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.4
 passive-interface Loopback0
 network 10.180.0.4 0.0.0.0 area 0



network 10.181.0.4 0.0.0.1 area 0
network 10.181.0.8 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_3 seq 10 permit 10.200.25.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 20 permit 10.200.26.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 30 permit 10.200.27.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_3_0 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_1 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_2 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_3 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_3_0 seq 10 deny 10.180.0.4/32
!

ip prefix-list PL_IN_3_23 seq 10 permit 10.200.23.0/24
ip prefix-list PL_IN_3_23 seq 20 permit 10.181.0.66/31
ip prefix-list PL_IN_3_23 seq 30 permit 10.181.0.64/31
ip prefix-list PL_IN_3_23 seq 40 permit 10.200.21.0/24
ip prefix-list PL_IN_3_23 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_3_23 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_3_23 seq 10 permit 10.200.26.0/24
!






route-map RM_POLICY_IN_3_23 permit 10














 match ip address prefix-list PL_IN_3_23
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_3_23 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_3_23 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_23 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_3_23 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_3_23 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_2
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_3_23 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_23 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_3
 set metric 22
 set as-path prepend 65002 65002 65002
 set community 65000:100 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_3_23 deny 200














 match ip address prefix-list PL_OUT_3_23
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_3_23 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.2 peer-group RR




 !
 neighbor 10.181.0.19 peer-group EBGP
 neighbor 10.181.0.19 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.2 activate




  neighbor 10.181.0.19 activate
  neighbor 10.181.0.19 route-map RM_POLICY_IN_3_23 in
  neighbor 10.181.0.19 route-map RM_POLICY_OUT_3_23 out





  network 10.200.25.0 mask 255.255.255.0

  network 10.200.26.0 mask 255.255.255.0

  network 10.200.27.0 mask 255.255.255.0

 exit-address-family
