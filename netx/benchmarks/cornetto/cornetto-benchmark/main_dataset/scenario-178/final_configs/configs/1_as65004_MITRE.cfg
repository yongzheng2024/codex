
hostname 1_as65004_MITRE
!
interface Loopback0
 ip address 10.180.0.2 255.255.255.255

 ip ospf network point-to-point
!



ip access-list extended ACL_1_GigabitEthernet0_0
 5 deny ip any any
 10 permit ip host 10.180.0.3 any
 20 permit ip host 10.181.0.4 any
 30 permit ip host 10.181.0.5 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
