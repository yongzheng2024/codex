!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_14_0 seq 10 deny 10.180.0.15/32
!






route-map RM_POLICY_IN_14_30 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_14_30 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_14_0
 ! Block loopback 10.180.0.15/32


route-map RM_POLICY_OUT_14_30 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_0
 ! Block link 10.181.0.42/31


route-map RM_POLICY_OUT_14_30 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_1
 ! Block link 10.181.0.50/31


route-map RM_POLICY_OUT_14_30 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_2
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_14_30 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_14
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_14_30 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_14
 set metric 17
 set as-path prepend 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_14_30 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.15
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



