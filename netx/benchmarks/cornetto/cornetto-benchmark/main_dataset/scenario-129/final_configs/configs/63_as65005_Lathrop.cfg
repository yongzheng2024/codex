 match ip address prefix-list PL_EXPORT_DENY_LONG_63
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_63_49 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_63
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_63_49 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.64
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.63 peer-group RR




 !
 neighbor 10.181.0.138 peer-group EBGP
 neighbor 10.181.0.138 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.63 activate




  neighbor 10.181.0.138 activate
  neighbor 10.181.0.138 route-map RM_POLICY_OUT_63_49 out





  network 10.200.47.0 mask 255.255.255.0

  network 10.200.48.0 mask 255.255.255.0

  network 10.200.49.0 mask 255.255.255.0

 exit-address-family
