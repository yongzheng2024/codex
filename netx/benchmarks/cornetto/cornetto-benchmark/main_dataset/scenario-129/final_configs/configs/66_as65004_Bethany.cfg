ip prefix-list PL_EXPORT_ALLOWED_66 seq 10 permit 10.200.53.0/24
ip prefix-list PL_EXPORT_ALLOWED_66 seq 20 permit 10.200.54.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_66_0 seq 10 deny 10.181.0.142/31
