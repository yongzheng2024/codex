ip prefix-list PL_OUT_66_53 seq 10 permit 10.200.54.0/24
!

ip prefix-list PL_OUT_66_64 seq 10 permit 10.200.54.0/24
!






route-map RM_POLICY_IN_66_53 permit 10














 match ip address prefix-list PL_IN_66_53
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_66_53 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_IN_66_64 permit 10














 match ip address prefix-list PL_IN_66_64
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_66_64 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_66_53 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_66_0
 ! Block loopback 10.180.0.67/32


route-map RM_POLICY_OUT_66_53 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_0
 ! Block link 10.181.0.142/31


route-map RM_POLICY_OUT_66_53 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_1
 ! Block link 10.181.0.162/31


route-map RM_POLICY_OUT_66_53 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_2
 ! Block link 10.181.0.164/31


route-map RM_POLICY_OUT_66_53 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_66
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_66_53 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_66
 set metric 19
 set as-path prepend 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_66_53 deny 200














 match ip address prefix-list PL_OUT_66_53
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_66_53 deny 65000














 ! Deny other outbound routes

!


route-map RM_POLICY_OUT_66_64 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_66_0
 ! Block loopback 10.180.0.67/32


route-map RM_POLICY_OUT_66_64 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_0
 ! Block link 10.181.0.142/31


route-map RM_POLICY_OUT_66_64 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_1
 ! Block link 10.181.0.162/31


route-map RM_POLICY_OUT_66_64 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_2
 ! Block link 10.181.0.164/31


route-map RM_POLICY_OUT_66_64 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_66
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_66_64 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_66
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_66_64 deny 200














 match ip address prefix-list PL_OUT_66_64
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_66_64 deny 65000














 ! Deny other outbound routes

!







