!
interface Loopback101
 description Customer network 10.200.54.0/24


 ip address 10.200.54.1 255.255.255.0
!



ip access-list extended ACL_66_GigabitEthernet0_0
 10 permit ip host 10.180.0.54 any
 20 permit ip host 10.181.0.142 any
 30 permit ip host 10.181.0.143 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
