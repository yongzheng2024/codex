ip route 10.200.16.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.33
 passive-interface Loopback0
 network 10.180.0.33 0.0.0.0 area 0



network 10.181.0.34 0.0.0.1 area 0
network 10.181.0.104 0.0.0.1 area 0
network 10.181.0.106 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_32 seq 10 permit 10.200.15.0/24
ip prefix-list PL_EXPORT_ALLOWED_32 seq 20 permit 10.200.16.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_32_0 seq 10 deny 10.181.0.102/31
!

ip prefix-list PL_EXPORT_DENY_LINK_32_1 seq 10 deny 10.181.0.104/31
!

ip prefix-list PL_EXPORT_DENY_LINK_32_2 seq 10 deny 10.181.0.106/31
!

ip prefix-list PL_EXPORT_DENY_LINK_32_3 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LONG_32 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_32_0 seq 10 deny 10.180.0.33/32
!

ip prefix-list PL_IN_32_42 seq 10 permit 10.200.27.0/24
ip prefix-list PL_IN_32_42 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_32_42 seq 10 permit 10.200.15.0/24
!






route-map RM_POLICY_IN_32_42 permit 10














 match ip address prefix-list PL_IN_32_42
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_32_42 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_32_42 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_32_0
 ! Block loopback 10.180.0.33/32


route-map RM_POLICY_OUT_32_42 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_0
 ! Block link 10.181.0.102/31


route-map RM_POLICY_OUT_32_42 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_1
 ! Block link 10.181.0.104/31


route-map RM_POLICY_OUT_32_42 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_2
 ! Block link 10.181.0.106/31


route-map RM_POLICY_OUT_32_42 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_3
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_32_42 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_32
 set metric 12
 set as-path prepend 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_32_42 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_32
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_32_42 deny 200














 match ip address prefix-list PL_OUT_32_42
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_32_42 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.33
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.31 peer-group RR




 !
 neighbor 10.181.0.103 peer-group EBGP
 neighbor 10.181.0.103 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.31 activate




  neighbor 10.181.0.103 activate
  neighbor 10.181.0.103 route-map RM_POLICY_IN_32_42 in
  neighbor 10.181.0.103 route-map RM_POLICY_OUT_32_42 out





  network 10.200.15.0 mask 255.255.255.0

  network 10.200.16.0 mask 255.255.255.0

 exit-address-family
