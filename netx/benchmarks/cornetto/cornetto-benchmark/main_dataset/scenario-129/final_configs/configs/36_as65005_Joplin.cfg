!
interface GigabitEthernet0/1
 description to 35_as65005_Tulsa (35)

 ip address 10.181.0.115 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 45_as65003_Springfield (45)

 ip address 10.181.0.116 255.255.255.254

 ip access-group ACL_36_GigabitEthernet0_2 in
 mtu 1500
!


ip route 10.200.19.0 255.255.255.0 Loopback100
ip route 10.200.20.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.37
 passive-interface Loopback0
 network 10.180.0.37 0.0.0.0 area 0



network 10.181.0.98 0.0.0.1 area 0
network 10.181.0.114 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_36 seq 10 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_36 seq 20 permit 10.200.20.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_36_0 seq 10 deny 10.181.0.114/31
!

ip prefix-list PL_EXPORT_DENY_LINK_36_1 seq 10 deny 10.181.0.116/31
!

ip prefix-list PL_EXPORT_DENY_LINK_36_2 seq 10 deny 10.181.0.98/31
!

ip prefix-list PL_EXPORT_DENY_LONG_36 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_36_0 seq 10 deny 10.180.0.37/32
!

ip prefix-list PL_IN_36_45 seq 10 permit 10.200.34.0/24
ip prefix-list PL_IN_36_45 seq 20 permit 10.180.0.46/32
ip prefix-list PL_IN_36_45 seq 30 permit 10.200.33.0/24
ip prefix-list PL_IN_36_45 seq 40 permit 10.200.32.0/24
ip prefix-list PL_IN_36_45 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_36_45 seq 10 permit 10.200.20.0/24
!






route-map RM_POLICY_IN_36_45 permit 10














 match ip address prefix-list PL_IN_36_45
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_36_45 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_36_45 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_36_0
 ! Block loopback 10.180.0.37/32


route-map RM_POLICY_OUT_36_45 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_36_0
 ! Block link 10.181.0.114/31


route-map RM_POLICY_OUT_36_45 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_36_1
 ! Block link 10.181.0.116/31


route-map RM_POLICY_OUT_36_45 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_36_2
 ! Block link 10.181.0.98/31


route-map RM_POLICY_OUT_36_45 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_36
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_36_45 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_36
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_36_45 deny 200














 match ip address prefix-list PL_OUT_36_45
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_36_45 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.37
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.63 peer-group RR




 !
 neighbor 10.181.0.117 peer-group EBGP
 neighbor 10.181.0.117 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.63 activate




  neighbor 10.181.0.117 activate
  neighbor 10.181.0.117 route-map RM_POLICY_IN_36_45 in
  neighbor 10.181.0.117 route-map RM_POLICY_OUT_36_45 out





  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

 exit-address-family
