
hostname 36_as65005_Joplin
!
interface Loopback0
 ip address 10.180.0.37 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.19.0/24


 ip address 10.200.19.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.20.0/24


 ip address 10.200.20.1 255.255.255.0
!



ip access-list extended ACL_36_GigabitEthernet0_2
 10 permit ip host 10.180.0.46 any
 20 permit ip host 10.181.0.116 any
 30 permit ip host 10.181.0.117 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
