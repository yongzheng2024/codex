 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_34_7 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_34
 set metric 9
 set as-path prepend 65005 65005 65005
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_34_7 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_34
