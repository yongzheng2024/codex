 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_34_7 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_34_7 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_34_7 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_34_0
 ! Block loopback 10.180.0.35/32


route-map RM_POLICY_OUT_34_7 deny 60














