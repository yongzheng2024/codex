
hostname 10_as65005_Lees-Summit
!
interface Loopback0
 ip address 10.180.0.11 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 4_as65003_Warrensburg (4)

 ip address 10.181.0.19 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 62_as65005_Kansas-City (62)

 ip address 10.181.0.40 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
ip route 10.200.3.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.11
 passive-interface Loopback0
 network 10.180.0.11 0.0.0.0 area 0



network 10.181.0.40 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_10 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 30 permit 10.200.2.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 40 permit 10.200.3.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_10_0 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_1 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LONG_10 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_10_0 seq 10 deny 10.180.0.11/32
!




ip community-list standard CL_COMM_10_4 permit no-export
!





route-map RM_POLICY_IN_10_4 permit 5














 match community CL_COMM_10_4
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_10_4 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_10_4 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_4 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_10_4 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_10_4 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_10
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_10_4 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_10
 set community no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_10_4 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.63 peer-group RR




 !
 neighbor 10.181.0.18 peer-group EBGP
 neighbor 10.181.0.18 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.63 activate




  neighbor 10.181.0.18 activate
  neighbor 10.181.0.18 route-map RM_POLICY_IN_10_4 in
  neighbor 10.181.0.18 route-map RM_POLICY_OUT_10_4 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

  network 10.200.3.0 mask 255.255.255.0

 exit-address-family
