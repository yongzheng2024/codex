
hostname 64_as65005_Cameron
!
interface Loopback0
 ip address 10.180.0.65 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.50.0/24


 ip address 10.200.50.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.51.0/24


 ip address 10.200.51.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.52.0/24


 ip address 10.200.52.1 255.255.255.0
!



ip access-list extended ACL_64_GigabitEthernet0_1
 10 permit ip host 10.180.0.67 any
 20 permit ip host 10.181.0.162 any
 30 permit ip host 10.181.0.163 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 63_as65005_Lathrop (63)

 ip address 10.181.0.161 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 66_as65004_Bethany (66)

 ip address 10.181.0.162 255.255.255.254

 ip access-group ACL_64_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.50.0 255.255.255.0 Loopback100
ip route 10.200.51.0 255.255.255.0 Loopback101
ip route 10.200.52.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.65
 passive-interface Loopback0
 network 10.180.0.65 0.0.0.0 area 0



network 10.181.0.160 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_64 seq 10 permit 10.200.50.0/24
ip prefix-list PL_EXPORT_ALLOWED_64 seq 20 permit 10.200.51.0/24
ip prefix-list PL_EXPORT_ALLOWED_64 seq 30 permit 10.200.52.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_64_0 seq 10 deny 10.181.0.160/31
!

ip prefix-list PL_EXPORT_DENY_LINK_64_1 seq 10 deny 10.181.0.162/31
!

ip prefix-list PL_EXPORT_DENY_LONG_64 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_64_0 seq 10 deny 10.180.0.65/32
!






route-map RM_POLICY_OUT_64_66 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_64_0
 ! Block loopback 10.180.0.65/32


route-map RM_POLICY_OUT_64_66 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_64_0
 ! Block link 10.181.0.160/31


route-map RM_POLICY_OUT_64_66 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_64_1
 ! Block link 10.181.0.162/31


route-map RM_POLICY_OUT_64_66 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_64
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_64_66 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_64
 set community 65000:100 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_64_66 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.65
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.35 peer-group RR




 !
 neighbor 10.181.0.163 peer-group EBGP
 neighbor 10.181.0.163 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.35 activate




  neighbor 10.181.0.163 activate
  neighbor 10.181.0.163 route-map RM_POLICY_OUT_64_66 out





  network 10.200.50.0 mask 255.255.255.0

  network 10.200.51.0 mask 255.255.255.0

  network 10.200.52.0 mask 255.255.255.0

 exit-address-family
