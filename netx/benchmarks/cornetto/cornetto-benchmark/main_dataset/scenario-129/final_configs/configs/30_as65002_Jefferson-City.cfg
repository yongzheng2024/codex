 ! Block link 10.181.0.92/31


route-map RM_POLICY_OUT_30_14 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_3
 ! Block link 10.181.0.94/31


route-map RM_POLICY_OUT_30_14 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_30
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_30_14 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_30
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_30_14 deny 65000














 ! Deny other outbound routes

