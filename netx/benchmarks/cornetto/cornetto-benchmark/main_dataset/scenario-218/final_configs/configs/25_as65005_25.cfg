
hostname 25_as65005_25
!
interface Loopback0
 ip address 10.180.0.26 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.15.0/24


 ip address 10.200.15.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.16.0/24


 ip address 10.200.16.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 7_as65001_7 (7)

 ip address 10.181.0.25 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 30_as65005_30 (30)

 ip address 10.181.0.60 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.15.0 255.255.255.0 Loopback100
ip route 10.200.16.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.26
 passive-interface Loopback0
 network 10.180.0.26 0.0.0.0 area 0



network 10.181.0.60 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_25 seq 10 permit 10.200.15.0/24
ip prefix-list PL_EXPORT_ALLOWED_25 seq 20 permit 10.200.16.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_25_0 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_25_1 seq 10 deny 10.181.0.60/31
!

ip prefix-list PL_EXPORT_DENY_LONG_25 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_25_0 seq 10 deny 10.180.0.26/32
!

ip prefix-list PL_IN_25_7 seq 10 permit 10.181.0.4/31
ip prefix-list PL_IN_25_7 seq 20 permit 10.181.0.24/31
ip prefix-list PL_IN_25_7 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_25_7 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_25_7 seq 10 permit 10.200.16.0/24
ip prefix-list PL_OUT_25_7 seq 20 permit 10.200.15.0/24
!






route-map RM_POLICY_IN_25_7 permit 10














 match ip address prefix-list PL_IN_25_7
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_25_7 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_25_7 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_25_0
 ! Block loopback 10.180.0.26/32


route-map RM_POLICY_OUT_25_7 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_0
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_25_7 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_25_1
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_25_7 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_25
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_25_7 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_25
 set community 65000:100 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_25_7 deny 200














 match ip address prefix-list PL_OUT_25_7
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_25_7 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.26
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.31 peer-group RR




 !
 neighbor 10.181.0.24 peer-group EBGP
 neighbor 10.181.0.24 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.31 activate




  neighbor 10.181.0.24 activate
  neighbor 10.181.0.24 route-map RM_POLICY_IN_25_7 in
  neighbor 10.181.0.24 route-map RM_POLICY_OUT_25_7 out





  network 10.200.15.0 mask 255.255.255.0

  network 10.200.16.0 mask 255.255.255.0

 exit-address-family
