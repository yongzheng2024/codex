
hostname 15_as65003_15
!
interface Loopback0
 ip address 10.180.0.16 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 10_as65002_10 (10)

 ip address 10.181.0.35 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 16_as65003_16 (16)

 ip address 10.181.0.44 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.4.0 255.255.255.0 Loopback100
ip route 10.200.5.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.16
 passive-interface Loopback0
 network 10.180.0.16 0.0.0.0 area 0



network 10.181.0.44 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_15 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_15 seq 20 permit 10.200.5.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_15_0 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_15_1 seq 10 deny 10.181.0.44/31
!

ip prefix-list PL_EXPORT_DENY_LONG_15 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_15_0 seq 10 deny 10.180.0.16/32
!






route-map RM_POLICY_OUT_15_10 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_15_0
 ! Block loopback 10.180.0.16/32


route-map RM_POLICY_OUT_15_10 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_0
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_15_10 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_15_1
 ! Block link 10.181.0.44/31


route-map RM_POLICY_OUT_15_10 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_15
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_15_10 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_15
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_15_10 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.16
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.24


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.24 peer-group RR



 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP



 !
 neighbor 10.181.0.34 peer-group EBGP
 neighbor 10.181.0.34 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.24 activate



  neighbor 10.180.0.20 activate
  neighbor 10.180.0.20 next-hop-self


  neighbor 10.180.0.22 activate
  neighbor 10.180.0.22 next-hop-self


  neighbor 10.180.0.23 activate
  neighbor 10.180.0.23 next-hop-self


  neighbor 10.180.0.25 activate
  neighbor 10.180.0.25 next-hop-self



  neighbor 10.181.0.34 activate
  neighbor 10.181.0.34 route-map RM_POLICY_OUT_15_10 out





  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

 exit-address-family
