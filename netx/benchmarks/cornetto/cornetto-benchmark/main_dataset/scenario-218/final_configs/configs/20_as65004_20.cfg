!

router isis 1
 net 31.ec00.0000.0ab4.0015.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_20 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 20 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 30 permit 10.200.12.0/24
