route-map RM_POLICY_IN_29_30 permit 10














 match ip address prefix-list PL_IN_29_30
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_29_30 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_29_30 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_29_0
 ! Block loopback 10.180.0.30/32


route-map RM_POLICY_OUT_29_30 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_29_0
 ! Block link 10.181.0.64/31


route-map RM_POLICY_OUT_29_30 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_29_1
 ! Block link 10.181.0.66/31


route-map RM_POLICY_OUT_29_30 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_29
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_29_30 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_29
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_29_30 deny 200














 match ip address prefix-list PL_OUT_29_30
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_29_30 deny 65000














 ! Deny other outbound routes

!







