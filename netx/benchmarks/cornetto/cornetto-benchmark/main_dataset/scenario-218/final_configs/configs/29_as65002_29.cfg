ip prefix-list PL_EXPORT_ALLOWED_29 seq 10 permit 10.200.17.0/24
ip prefix-list PL_EXPORT_ALLOWED_29 seq 20 permit 10.200.18.0/24
ip prefix-list PL_EXPORT_ALLOWED_29 seq 30 permit 10.200.19.0/24
