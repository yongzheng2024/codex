
hostname 28_as65009_Switzerland
!
interface Loopback0
 ip address 10.180.0.29 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.28.0/24


 ip address 10.200.28.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.29.0/24


 ip address 10.200.29.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.30.0/24


 ip address 10.200.30.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 62_as65009_Switzerland (62)

 ip address 10.181.0.98 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 55_as65008_Switzerland (55)

 ip address 10.181.0.100 255.255.255.254
 mtu 1500
!


ip route 10.200.28.0 255.255.255.0 Loopback100
ip route 10.200.29.0 255.255.255.0 Loopback101
ip route 10.200.30.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.29
 passive-interface Loopback0
 network 10.180.0.29 0.0.0.0 area 0



network 10.181.0.98 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_28 seq 10 permit 10.200.28.0/24
ip prefix-list PL_EXPORT_ALLOWED_28 seq 20 permit 10.200.29.0/24
ip prefix-list PL_EXPORT_ALLOWED_28 seq 30 permit 10.200.30.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_28_0 seq 10 deny 10.181.0.100/31
!

ip prefix-list PL_EXPORT_DENY_LINK_28_1 seq 10 deny 10.181.0.98/31
!

ip prefix-list PL_EXPORT_DENY_LONG_28 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_28_0 seq 10 deny 10.180.0.29/32
!

ip prefix-list PL_IN_28_55 seq 10 permit 10.200.64.0/24
ip prefix-list PL_IN_28_55 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_28_55 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_28_55 seq 10 permit 10.200.30.0/24
!






route-map RM_POLICY_IN_28_55 permit 10














 match ip address prefix-list PL_IN_28_55
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_28_55 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_28_55 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_28_0
 ! Block loopback 10.180.0.29/32


route-map RM_POLICY_OUT_28_55 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_28_0
 ! Block link 10.181.0.100/31


route-map RM_POLICY_OUT_28_55 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_28_1
 ! Block link 10.181.0.98/31


route-map RM_POLICY_OUT_28_55 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_28
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_28_55 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_28
 set community 65000:200 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_28_55 deny 200














 match ip address prefix-list PL_OUT_28_55
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_28_55 deny 65000














 ! Deny other outbound routes

!







router bgp 65009
 bgp router-id 10.180.0.29
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65009
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.50 peer-group IBGP


 !
 neighbor 10.180.0.54 peer-group IBGP


 !
 neighbor 10.180.0.61 peer-group IBGP


 !
 neighbor 10.180.0.63 peer-group IBGP



 !
 neighbor 10.181.0.101 peer-group EBGP
 neighbor 10.181.0.101 remote-as 65008


 !
 address-family ipv4


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.50 activate


  neighbor 10.180.0.54 activate


  neighbor 10.180.0.61 activate


  neighbor 10.180.0.63 activate



  neighbor 10.181.0.101 activate
  neighbor 10.181.0.101 route-map RM_POLICY_IN_28_55 in
  neighbor 10.181.0.101 route-map RM_POLICY_OUT_28_55 out





  network 10.200.28.0 mask 255.255.255.0

  network 10.200.29.0 mask 255.255.255.0

  network 10.200.30.0 mask 255.255.255.0

 exit-address-family
