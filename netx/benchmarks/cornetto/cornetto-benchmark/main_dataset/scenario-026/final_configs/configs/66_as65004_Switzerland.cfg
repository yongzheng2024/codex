
hostname 66_as65004_Switzerland
!
interface Loopback0
 ip address 10.180.0.67 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.71.0/24


 ip address 10.200.71.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.72.0/24


 ip address 10.200.72.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 49_as65009_49 (49)

 ip address 10.181.0.145 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 69_as65004_Switzerland (69)

 ip address 10.181.0.170 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.71.0 255.255.255.0 Loopback100
ip route 10.200.72.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.67
 passive-interface Loopback0
 network 10.180.0.67 0.0.0.0 area 0



network 10.181.0.170 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_66 seq 10 permit 10.200.71.0/24
ip prefix-list PL_EXPORT_ALLOWED_66 seq 20 permit 10.200.72.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_66_0 seq 10 deny 10.181.0.144/31
!

ip prefix-list PL_EXPORT_DENY_LINK_66_1 seq 10 deny 10.181.0.170/31
!

ip prefix-list PL_EXPORT_DENY_LONG_66 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_66_0 seq 10 deny 10.180.0.67/32
!

ip prefix-list PL_IN_66_49 seq 10 permit 10.200.58.0/24
ip prefix-list PL_IN_66_49 seq 20 permit 10.200.59.0/24
ip prefix-list PL_IN_66_49 seq 30 permit 10.181.0.144/31
ip prefix-list PL_IN_66_49 seq 40 permit 10.181.0.60/31
ip prefix-list PL_IN_66_49 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_66_49 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_66_49 seq 10 permit 10.200.72.0/24
!






route-map RM_POLICY_IN_66_49 permit 10














 match ip address prefix-list PL_IN_66_49
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_66_49 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_66_49 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_66_0
 ! Block loopback 10.180.0.67/32


route-map RM_POLICY_OUT_66_49 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_0
 ! Block link 10.181.0.144/31


route-map RM_POLICY_OUT_66_49 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_1
 ! Block link 10.181.0.170/31


route-map RM_POLICY_OUT_66_49 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_66
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_66_49 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_66
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_66_49 deny 200














 match ip address prefix-list PL_OUT_66_49
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_66_49 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.67
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.36 peer-group RR




 !
 neighbor 10.181.0.144 peer-group EBGP
 neighbor 10.181.0.144 remote-as 65009


 !
 address-family ipv4

  neighbor 10.180.0.36 activate




  neighbor 10.181.0.144 activate
  neighbor 10.181.0.144 route-map RM_POLICY_IN_66_49 in
  neighbor 10.181.0.144 route-map RM_POLICY_OUT_66_49 out





  network 10.200.71.0 mask 255.255.255.0

  network 10.200.72.0 mask 255.255.255.0

 exit-address-family
