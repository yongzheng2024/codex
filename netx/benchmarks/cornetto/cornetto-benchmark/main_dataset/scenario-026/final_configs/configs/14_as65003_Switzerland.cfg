
hostname 14_as65003_Switzerland
!
interface Loopback0
 ip address 10.180.0.15 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 8_as65002_Switzerland (8)

 ip address 10.181.0.35 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 42_as65003_Switzerland (42)

 ip address 10.181.0.50 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.5.0 255.255.255.0 Loopback100
ip route 10.200.6.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.15
 passive-interface Loopback0
 network 10.180.0.15 0.0.0.0 area 0



network 10.181.0.50 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_14 seq 10 permit 10.200.5.0/24
ip prefix-list PL_EXPORT_ALLOWED_14 seq 20 permit 10.200.6.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_14_0 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_14_1 seq 10 deny 10.181.0.50/31
!

ip prefix-list PL_EXPORT_DENY_LONG_14 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_14_0 seq 10 deny 10.180.0.15/32
!

ip prefix-list PL_IN_14_8 seq 10 permit 10.181.0.32/31
ip prefix-list PL_IN_14_8 seq 20 permit 10.181.0.36/31
ip prefix-list PL_IN_14_8 seq 30 permit 10.180.0.9/32
ip prefix-list PL_IN_14_8 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_14_8 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_14_8 seq 10 permit 10.200.5.0/24
ip prefix-list PL_OUT_14_8 seq 20 permit 10.200.6.0/24
!






route-map RM_POLICY_IN_14_8 permit 10














 match ip address prefix-list PL_IN_14_8
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_14_8 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_14_8 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_14_0
 ! Block loopback 10.180.0.15/32


route-map RM_POLICY_OUT_14_8 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_0
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_14_8 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_1
 ! Block link 10.181.0.50/31


route-map RM_POLICY_OUT_14_8 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_14
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_14_8 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_14
 set metric 17
 set as-path prepend 65003 65003
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_14_8 deny 200














 match ip address prefix-list PL_OUT_14_8
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_14_8 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.15
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.43 peer-group RR




 !
 neighbor 10.181.0.34 peer-group EBGP
 neighbor 10.181.0.34 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.43 activate




  neighbor 10.181.0.34 activate
  neighbor 10.181.0.34 route-map RM_POLICY_IN_14_8 in
  neighbor 10.181.0.34 route-map RM_POLICY_OUT_14_8 out





  network 10.200.5.0 mask 255.255.255.0

  network 10.200.6.0 mask 255.255.255.0

 exit-address-family
