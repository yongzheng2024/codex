
hostname 8_as65002_Switzerland
!
interface Loopback0
 ip address 10.180.0.9 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.77.0/24


 ip address 10.200.77.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.78.0/24


 ip address 10.200.78.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 30_as65002_Switzerland (30)

 ip address 10.181.0.32 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 14_as65003_Switzerland (14)

 ip address 10.181.0.34 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 39_as65002_Switzerland (39)

 ip address 10.181.0.36 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.77.0 255.255.255.0 Loopback100
ip route 10.200.78.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.9
 passive-interface Loopback0
 network 10.180.0.9 0.0.0.0 area 0



network 10.181.0.32 0.0.0.1 area 0
network 10.181.0.36 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_8 seq 10 permit 10.200.77.0/24
ip prefix-list PL_EXPORT_ALLOWED_8 seq 20 permit 10.200.78.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_8_0 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LINK_8_1 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_8_2 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LONG_8 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_8_0 seq 10 deny 10.180.0.9/32
!




ip community-list standard CL_COMM_8_14 permit 65535:65282
ip community-list standard CL_COMM_8_14 permit no-export
!





route-map RM_POLICY_IN_8_14 permit 5














 match community CL_COMM_8_14
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_8_14 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_8_14 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_8_14 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_8_0
 ! Block loopback 10.180.0.9/32


route-map RM_POLICY_OUT_8_14 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_0
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_8_14 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_1
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_8_14 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_2
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_8_14 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_8
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_8_14 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_8
 set metric 16
 set as-path prepend 65002 65002
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_8_14 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.9
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.51 peer-group RR




 !
 neighbor 10.181.0.35 peer-group EBGP
 neighbor 10.181.0.35 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.51 activate




  neighbor 10.181.0.35 activate
  neighbor 10.181.0.35 route-map RM_POLICY_IN_8_14 in
  neighbor 10.181.0.35 route-map RM_POLICY_OUT_8_14 out





  network 10.200.77.0 mask 255.255.255.0

  network 10.200.78.0 mask 255.255.255.0

 exit-address-family
