
hostname 34_as65005_Switzerland
!
interface Loopback0
 ip address 10.180.0.35 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.38.0/24


 ip address 10.200.38.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.39.0/24


 ip address 10.200.39.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.40.0/24


 ip address 10.200.40.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.41.0/24


 ip address 10.200.41.1 255.255.255.0
!



ip access-list extended ACL_34_GigabitEthernet0_0
 10 permit ip host 10.180.0.21 any
 20 permit ip host 10.181.0.74 any
 30 permit ip host 10.181.0.75 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 20_as65008_20 (20)

 ip address 10.181.0.75 255.255.255.254

 ip access-group ACL_34_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 22_as65005_22 (22)

 ip address 10.181.0.85 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.38.0 255.255.255.0 Loopback100
ip route 10.200.39.0 255.255.255.0 Loopback101
ip route 10.200.40.0 255.255.255.0 Loopback102
ip route 10.200.41.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.35
 passive-interface Loopback0
 network 10.180.0.35 0.0.0.0 area 0



network 10.181.0.84 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_34 seq 10 permit 10.200.38.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 20 permit 10.200.39.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 30 permit 10.200.40.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 40 permit 10.200.41.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_34_0 seq 10 deny 10.181.0.74/31
!

ip prefix-list PL_EXPORT_DENY_LINK_34_1 seq 10 deny 10.181.0.84/31
!

ip prefix-list PL_EXPORT_DENY_LONG_34 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_34_0 seq 10 deny 10.180.0.35/32
!

ip prefix-list PL_IN_34_20 seq 10 permit 10.200.13.0/24
ip prefix-list PL_IN_34_20 seq 20 permit 10.200.14.0/24
ip prefix-list PL_IN_34_20 seq 30 permit 10.181.0.72/31
ip prefix-list PL_IN_34_20 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_34_20 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_34_20 seq 10 permit 10.200.40.0/24
!






route-map RM_POLICY_IN_34_20 permit 10














 match ip address prefix-list PL_IN_34_20
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_34_20 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_34_20 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_34_0
 ! Block loopback 10.180.0.35/32


route-map RM_POLICY_OUT_34_20 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_0
 ! Block link 10.181.0.74/31


route-map RM_POLICY_OUT_34_20 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_1
 ! Block link 10.181.0.84/31


route-map RM_POLICY_OUT_34_20 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_34
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_34_20 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_34
 set metric 30
 set as-path prepend 65005 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_34_20 deny 200














 match ip address prefix-list PL_OUT_34_20
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_34_20 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.35
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.2 peer-group RR


 !
 neighbor 10.180.0.23 peer-group RR




 !
 neighbor 10.181.0.74 peer-group EBGP
 neighbor 10.181.0.74 remote-as 65008


 !
 address-family ipv4

  neighbor 10.180.0.2 activate


  neighbor 10.180.0.23 activate




  neighbor 10.181.0.74 activate
  neighbor 10.181.0.74 route-map RM_POLICY_IN_34_20 in
  neighbor 10.181.0.74 route-map RM_POLICY_OUT_34_20 out





  network 10.200.38.0 mask 255.255.255.0

  network 10.200.39.0 mask 255.255.255.0

  network 10.200.40.0 mask 255.255.255.0

  network 10.200.41.0 mask 255.255.255.0

 exit-address-family
