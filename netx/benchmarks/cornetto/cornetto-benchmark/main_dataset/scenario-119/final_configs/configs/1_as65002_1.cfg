
hostname 1_as65002_1
!
interface Loopback0
 ip address 10.180.0.2 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 4_as65002_4 (4)

 ip address 10.181.0.2 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.2
 passive-interface Loopback0
 network 10.180.0.2 0.0.0.0 area 0



network 10.181.0.2 0.0.0.1 area 0
!








router bgp 65002
 bgp router-id 10.180.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.54 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.54 activate







 exit-address-family
