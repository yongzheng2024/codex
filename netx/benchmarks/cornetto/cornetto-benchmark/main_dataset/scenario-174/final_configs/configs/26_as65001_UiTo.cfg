 set tag 65010

!


route-map RM_POLICY_IN_26_66 permit 10














 match ip address prefix-list PL_IN_26_66
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_26_66 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_26_66 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_26_0
 ! Block loopback 10.180.0.27/32


