ip route 10.200.13.0 255.255.255.0 Loopback100
ip route 10.200.14.0 255.255.255.0 Loopback101
ip route 10.200.15.0 255.255.255.0 Loopback102
ip route 10.200.16.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.17
 passive-interface Loopback0
 network 10.180.0.17 0.0.0.0 area 0










 redistribute bgp 65005 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_16

network 10.181.0.78 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 10 permit 10.200.23.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 20 permit 10.200.24.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 30 permit 10.200.25.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 40 permit 10.200.26.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 50 permit 10.200.27.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 60 permit 10.200.28.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 70 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 80 permit 10.200.30.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 90 permit 10.200.65.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 100 permit 10.200.66.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 110 permit 10.200.67.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_16 seq 120 permit 10.200.68.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_16 seq 10 permit 10.180.0.17/32
ip prefix-list PL_BGP_TO_OSPF_DENY_16 seq 20 permit 10.181.0.78/31
ip prefix-list PL_BGP_TO_OSPF_DENY_16 seq 30 permit 10.181.0.80/31
!

ip prefix-list PL_EXPORT_ALLOWED_16 seq 10 permit 10.200.13.0/24
ip prefix-list PL_EXPORT_ALLOWED_16 seq 20 permit 10.200.14.0/24
ip prefix-list PL_EXPORT_ALLOWED_16 seq 30 permit 10.200.15.0/24
ip prefix-list PL_EXPORT_ALLOWED_16 seq 40 permit 10.200.16.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_16_0 seq 10 deny 10.181.0.78/31
!

ip prefix-list PL_EXPORT_DENY_LINK_16_1 seq 10 deny 10.181.0.80/31
!

ip prefix-list PL_EXPORT_DENY_LONG_16 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_16_0 seq 10 deny 10.180.0.17/32
!






route-map RM_BGP_TO_OSPF_16 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_16 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_16
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_16 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_16
 set tag 65010

!


route-map RM_POLICY_OUT_16_25 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_16_0
 ! Block loopback 10.180.0.17/32


route-map RM_POLICY_OUT_16_25 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_0
 ! Block link 10.181.0.78/31


route-map RM_POLICY_OUT_16_25 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_1
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_16_25 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_16
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_16_25 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_16
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_16_25 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.17
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.18 peer-group RR




 !
 neighbor 10.181.0.81 peer-group EBGP
 neighbor 10.181.0.81 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.18 activate




  neighbor 10.181.0.81 activate
  neighbor 10.181.0.81 route-map RM_POLICY_OUT_16_25 out





  network 10.200.13.0 mask 255.255.255.0

  network 10.200.14.0 mask 255.255.255.0

  network 10.200.15.0 mask 255.255.255.0

  network 10.200.16.0 mask 255.255.255.0

 exit-address-family
