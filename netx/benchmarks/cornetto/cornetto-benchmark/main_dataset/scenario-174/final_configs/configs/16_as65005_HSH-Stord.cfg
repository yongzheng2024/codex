interface GigabitEthernet0/0
 description to 17_as65005_UiB-Hoyteklogibygget (17)

 ip address 10.181.0.78 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

