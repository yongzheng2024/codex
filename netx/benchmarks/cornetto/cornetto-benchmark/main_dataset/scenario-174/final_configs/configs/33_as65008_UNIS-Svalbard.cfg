!

ip prefix-list PL_OUT_33_29 seq 10 permit 10.200.41.0/24
ip prefix-list PL_OUT_33_29 seq 20 permit 10.200.40.0/24
!






route-map RM_POLICY_IN_33_29 permit 10














 match ip address prefix-list PL_IN_33_29
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_33_29 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_33_29 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_33_0
 ! Block loopback 10.180.0.34/32


route-map RM_POLICY_OUT_33_29 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_0
 ! Block link 10.181.0.112/31


route-map RM_POLICY_OUT_33_29 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_1
 ! Block link 10.181.0.114/31


route-map RM_POLICY_OUT_33_29 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_2
 ! Block link 10.181.0.126/31


route-map RM_POLICY_OUT_33_29 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_3
 ! Block link 10.181.0.128/31


route-map RM_POLICY_OUT_33_29 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_33
 set metric 17
 set as-path prepend 65008 65008
 ! Outbound policy baseline


route-map RM_POLICY_OUT_33_29 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_4
 ! Block link 10.181.0.130/31


route-map RM_POLICY_OUT_33_29 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_33
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_33_29 deny 200














 match ip address prefix-list PL_OUT_33_29
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_33_29 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.34
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65008
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.29 peer-group IBGP


 !
 neighbor 10.180.0.56 peer-group IBGP


 !
 neighbor 10.180.0.61 peer-group IBGP


 !
 neighbor 10.180.0.63 peer-group IBGP



 !
 neighbor 10.181.0.114 peer-group EBGP
 neighbor 10.181.0.114 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.29 activate


  neighbor 10.180.0.56 activate


  neighbor 10.180.0.61 activate


  neighbor 10.180.0.63 activate



  neighbor 10.181.0.114 activate
  neighbor 10.181.0.114 route-map RM_POLICY_IN_33_29 in
  neighbor 10.181.0.114 route-map RM_POLICY_OUT_33_29 out





  network 10.200.40.0 mask 255.255.255.0

  network 10.200.41.0 mask 255.255.255.0

  network 10.200.42.0 mask 255.255.255.0

 exit-address-family
