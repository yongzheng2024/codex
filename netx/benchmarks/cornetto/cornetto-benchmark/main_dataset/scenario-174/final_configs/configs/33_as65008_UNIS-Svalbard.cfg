!

ip prefix-list PL_EXPORT_DENY_LINK_33_1 seq 10 deny 10.181.0.114/31
!

ip prefix-list PL_EXPORT_DENY_LINK_33_2 seq 10 deny 10.181.0.126/31
!

ip prefix-list PL_EXPORT_DENY_LINK_33_3 seq 10 deny 10.181.0.128/31
!

ip prefix-list PL_EXPORT_DENY_LINK_33_4 seq 10 deny 10.181.0.130/31
