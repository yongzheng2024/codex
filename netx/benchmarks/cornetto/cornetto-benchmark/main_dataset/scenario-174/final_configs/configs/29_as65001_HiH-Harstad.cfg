router ospf 1
 router-id 10.180.0.30
 passive-interface Loopback0
 network 10.180.0.30 0.0.0.0 area 0










 redistribute bgp 65001 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_29

network 10.181.0.48 0.0.0.1 area 0
network 10.181.0.54 0.0.0.1 area 0
network 10.181.0.116 0.0.0.1 area 0
network 10.181.0.118 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_29 seq 10 permit 10.200.40.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_29 seq 20 permit 10.200.41.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_29 seq 30 permit 10.200.42.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_29 seq 10 permit 10.180.0.30/32
ip prefix-list PL_BGP_TO_OSPF_DENY_29 seq 20 permit 10.181.0.48/31
ip prefix-list PL_BGP_TO_OSPF_DENY_29 seq 30 permit 10.181.0.54/31
ip prefix-list PL_BGP_TO_OSPF_DENY_29 seq 40 permit 10.181.0.114/31
ip prefix-list PL_BGP_TO_OSPF_DENY_29 seq 50 permit 10.181.0.116/31
ip prefix-list PL_BGP_TO_OSPF_DENY_29 seq 60 permit 10.181.0.118/31
!

ip prefix-list PL_EXPORT_ALLOWED_29 seq 10 permit 10.200.34.0/24
ip prefix-list PL_EXPORT_ALLOWED_29 seq 20 permit 10.200.35.0/24
ip prefix-list PL_EXPORT_ALLOWED_29 seq 30 permit 10.200.36.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_29_0 seq 10 deny 10.181.0.114/31
!

ip prefix-list PL_EXPORT_DENY_LINK_29_1 seq 10 deny 10.181.0.116/31
!

ip prefix-list PL_EXPORT_DENY_LINK_29_2 seq 10 deny 10.181.0.118/31
!

ip prefix-list PL_EXPORT_DENY_LINK_29_3 seq 10 deny 10.181.0.48/31
!

ip prefix-list PL_EXPORT_DENY_LINK_29_4 seq 10 deny 10.181.0.54/31
!

ip prefix-list PL_EXPORT_DENY_LONG_29 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_29_0 seq 10 deny 10.180.0.30/32
!




ip community-list standard CL_COMM_29_33 permit no-export
!





route-map RM_BGP_TO_OSPF_29 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_29 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_29
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_29 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_29
 set tag 65010

!


route-map RM_POLICY_IN_29_33 permit 5














 match community CL_COMM_29_33
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_29_33 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_29_33 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_29_0
 ! Block loopback 10.180.0.30/32


route-map RM_POLICY_OUT_29_33 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_29_0
 ! Block link 10.181.0.114/31


route-map RM_POLICY_OUT_29_33 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_29_1
 ! Block link 10.181.0.116/31


route-map RM_POLICY_OUT_29_33 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_29_2
 ! Block link 10.181.0.118/31


route-map RM_POLICY_OUT_29_33 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_29_3
 ! Block link 10.181.0.48/31


route-map RM_POLICY_OUT_29_33 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_29
 set community 65000:100 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_29_33 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_29_4
 ! Block link 10.181.0.54/31


route-map RM_POLICY_OUT_29_33 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LONG_29
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_29_33 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.30
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.30


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.9 peer-group RR



 !
 neighbor 10.180.0.10 peer-group IBGP


