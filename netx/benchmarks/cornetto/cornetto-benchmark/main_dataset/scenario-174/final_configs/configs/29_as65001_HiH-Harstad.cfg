  neighbor 10.180.0.9 activate



  neighbor 10.180.0.10 activate
  neighbor 10.180.0.10 next-hop-self


  neighbor 10.180.0.14 activate
  neighbor 10.180.0.14 next-hop-self


  neighbor 10.180.0.16 activate
  neighbor 10.180.0.16 next-hop-self


  neighbor 10.180.0.27 activate
  neighbor 10.180.0.27 next-hop-self


  neighbor 10.180.0.31 activate
  neighbor 10.180.0.31 next-hop-self


  neighbor 10.180.0.49 activate
  neighbor 10.180.0.49 next-hop-self



  neighbor 10.181.0.115 activate
  neighbor 10.181.0.115 route-map RM_POLICY_IN_29_33 in
  neighbor 10.181.0.115 route-map RM_POLICY_OUT_29_33 out





  network 10.200.34.0 mask 255.255.255.0

  network 10.200.35.0 mask 255.255.255.0

  network 10.200.36.0 mask 255.255.255.0

