 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP


 !
 neighbor 10.180.0.31 peer-group IBGP


 !
 neighbor 10.180.0.49 peer-group IBGP



 !
 neighbor 10.181.0.115 peer-group EBGP
 neighbor 10.181.0.115 remote-as 65008


 !
