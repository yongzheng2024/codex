
hostname 50_as65003_HiT-Notodden
!
interface Loopback0
 ip address 10.180.0.51 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.69.0/24


 ip address 10.200.69.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.70.0/24


 ip address 10.200.70.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.71.0/24


 ip address 10.200.71.1 255.255.255.0
!



ip access-list extended ACL_50_GigabitEthernet0_1
 10 permit ip host 10.180.0.50 any
 20 permit ip host 10.181.0.170 any
 30 permit ip host 10.181.0.171 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 5_as65003_HiBU-Kongsberg (5)

 ip address 10.181.0.37 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 49_as65006_HiT-Bo (49)

 ip address 10.181.0.171 255.255.255.254

 ip access-group ACL_50_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.69.0 255.255.255.0 Loopback100
ip route 10.200.70.0 255.255.255.0 Loopback101
ip route 10.200.71.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.51
 passive-interface Loopback0
 network 10.180.0.51 0.0.0.0 area 0



network 10.181.0.36 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_50 seq 10 permit 10.200.69.0/24
ip prefix-list PL_EXPORT_ALLOWED_50 seq 20 permit 10.200.70.0/24
ip prefix-list PL_EXPORT_ALLOWED_50 seq 30 permit 10.200.71.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_50_0 seq 10 deny 10.181.0.170/31
!

ip prefix-list PL_EXPORT_DENY_LINK_50_1 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LONG_50 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_50_0 seq 10 deny 10.180.0.51/32
!

ip prefix-list PL_IN_50_49 seq 10 permit 10.200.67.0/24
ip prefix-list PL_IN_50_49 seq 20 permit 10.181.0.6/31
ip prefix-list PL_IN_50_49 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_50_49 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_50_49 seq 10 permit 10.200.70.0/24
ip prefix-list PL_OUT_50_49 seq 20 permit 10.200.69.0/24
!






route-map RM_POLICY_IN_50_49 permit 10














 match ip address prefix-list PL_IN_50_49
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_50_49 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_50_49 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_50_0
 ! Block loopback 10.180.0.51/32


route-map RM_POLICY_OUT_50_49 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_50_0
 ! Block link 10.181.0.170/31


route-map RM_POLICY_OUT_50_49 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_50_1
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_50_49 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_50
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_50_49 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_50
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_50_49 deny 200














 match ip address prefix-list PL_OUT_50_49
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_50_49 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.51
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.12 peer-group RR




 !
 neighbor 10.181.0.170 peer-group EBGP
 neighbor 10.181.0.170 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.12 activate




  neighbor 10.181.0.170 activate
  neighbor 10.181.0.170 route-map RM_POLICY_IN_50_49 in
  neighbor 10.181.0.170 route-map RM_POLICY_OUT_50_49 out





  network 10.200.69.0 mask 255.255.255.0

  network 10.200.70.0 mask 255.255.255.0

  network 10.200.71.0 mask 255.255.255.0

 exit-address-family
