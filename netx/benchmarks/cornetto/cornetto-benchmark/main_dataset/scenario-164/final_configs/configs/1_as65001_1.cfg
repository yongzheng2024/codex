!
interface Loopback103
 description Customer network 10.200.27.0/24


 ip address 10.200.27.1 255.255.255.0
!



ip access-list extended ACL_1_GigabitEthernet0_1
 10 permit ip host 10.180.0.7 any
 20 permit ip host 10.181.0.4 any
 30 permit ip host 10.181.0.5 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 0_as65001_0 (0)

 ip address 10.181.0.1 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 6_as65002_6 (6)

 ip address 10.181.0.4 255.255.255.254

 ip access-group ACL_1_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 71_as65001_71 (71)

 ip address 10.181.0.6 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
