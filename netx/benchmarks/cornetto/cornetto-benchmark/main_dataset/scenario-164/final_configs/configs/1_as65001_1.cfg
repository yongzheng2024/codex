ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.12.0 255.255.255.0 Loopback102
ip route 10.200.27.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.2
 passive-interface Loopback0
 network 10.180.0.2 0.0.0.0 area 0



network 10.181.0.0 0.0.0.1 area 0
network 10.181.0.6 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_1 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 30 permit 10.200.12.0/24
ip prefix-list PL_EXPORT_ALLOWED_1 seq 40 permit 10.200.27.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_1_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_1_1 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LINK_1_2 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LONG_1 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_1_0 seq 10 deny 10.180.0.2/32
!

ip prefix-list PL_IN_1_6 seq 10 permit 10.181.0.30/31
ip prefix-list PL_IN_1_6 seq 20 permit 10.200.54.0/24
ip prefix-list PL_IN_1_6 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_1_6 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_1_6 seq 10 permit 10.200.12.0/24
ip prefix-list PL_OUT_1_6 seq 20 permit 10.200.1.0/24
!




ip community-list standard CL_COMM_1_6 permit no-advertise
ip community-list standard CL_COMM_1_6 permit no-export
!





route-map RM_POLICY_IN_1_6 permit 5














 match community CL_COMM_1_6
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_1_6 permit 10














 match ip address prefix-list PL_IN_1_6
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_1_6 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_1_6 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_1_6 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_1_0
 ! Block loopback 10.180.0.2/32


route-map RM_POLICY_OUT_1_6 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_1_6 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_1
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_1_6 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_1_2
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_1_6 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_1
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_1_6 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_1
 set metric 18
 set as-path prepend 65001 65001
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_1_6 deny 200














 match ip address prefix-list PL_OUT_1_6
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_1_6 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.2



