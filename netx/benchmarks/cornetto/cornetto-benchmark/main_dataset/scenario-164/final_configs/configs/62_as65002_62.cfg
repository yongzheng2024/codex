
hostname 62_as65002_62
!
interface Loopback0
 ip address 10.180.0.63 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.54.0/24


 ip address 10.200.54.4 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.56.0/24


 ip address 10.200.56.4 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.55.0/24


 ip address 10.200.55.3 255.255.255.0
!



ip access-list extended ACL_62_GigabitEthernet0_0
 10 permit ip host 10.180.0.32 any
 20 permit ip host 10.181.0.120 any
 30 permit ip host 10.181.0.121 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 31_as65001_31 (31)

 ip address 10.181.0.121 255.255.255.254

 ip access-group ACL_62_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 35_as65002_35 (35)

 ip address 10.181.0.133 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.54.0 255.255.255.0 Loopback100
ip route 10.200.55.0 255.255.255.0 Loopback102
ip route 10.200.56.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.63
 passive-interface Loopback0
 network 10.180.0.63 0.0.0.0 area 0



network 10.181.0.132 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_62 seq 10 permit 10.200.54.0/24
ip prefix-list PL_EXPORT_ALLOWED_62 seq 20 permit 10.200.55.0/24
ip prefix-list PL_EXPORT_ALLOWED_62 seq 30 permit 10.200.56.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_62_0 seq 10 deny 10.181.0.120/31
!

ip prefix-list PL_EXPORT_DENY_LINK_62_1 seq 10 deny 10.181.0.132/31
!

ip prefix-list PL_EXPORT_DENY_LONG_62 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_62_0 seq 10 deny 10.180.0.63/32
!

ip prefix-list PL_IN_62_31 seq 10 permit 10.180.0.32/32
ip prefix-list PL_IN_62_31 seq 20 permit 10.181.0.14/31
ip prefix-list PL_IN_62_31 seq 30 permit 10.200.56.0/24
ip prefix-list PL_IN_62_31 seq 40 permit 10.181.0.120/31
ip prefix-list PL_IN_62_31 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_62_31 seq 10 permit 10.200.56.0/24
ip prefix-list PL_OUT_62_31 seq 20 permit 10.200.54.0/24
!




ip community-list standard CL_COMM_62_31 permit 65535:65282
ip community-list standard CL_COMM_62_31 permit no-advertise
!





route-map RM_POLICY_IN_62_31 permit 5














 match community CL_COMM_62_31
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_62_31 permit 10














 match ip address prefix-list PL_IN_62_31
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_62_31 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_62_31 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_62_31 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_62_0
 ! Block loopback 10.180.0.63/32


route-map RM_POLICY_OUT_62_31 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_62_0
 ! Block link 10.181.0.120/31


route-map RM_POLICY_OUT_62_31 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_62_1
 ! Block link 10.181.0.132/31


route-map RM_POLICY_OUT_62_31 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_62
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_62_31 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_62
 set metric 20
 set as-path prepend 65002
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_62_31 deny 200














 match ip address prefix-list PL_OUT_62_31
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_62_31 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.63
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.7 peer-group RR


 !
 neighbor 10.180.0.8 peer-group RR




 !
 neighbor 10.181.0.120 peer-group EBGP
 neighbor 10.181.0.120 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.7 activate


  neighbor 10.180.0.8 activate




  neighbor 10.181.0.120 activate
  neighbor 10.181.0.120 route-map RM_POLICY_IN_62_31 in
  neighbor 10.181.0.120 route-map RM_POLICY_OUT_62_31 out





  network 10.200.54.0 mask 255.255.255.0

  network 10.200.55.0 mask 255.255.255.0

  network 10.200.56.0 mask 255.255.255.0

 exit-address-family
