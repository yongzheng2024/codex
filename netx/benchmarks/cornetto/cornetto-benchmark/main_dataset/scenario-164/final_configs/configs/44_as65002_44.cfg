router ospf 1
 router-id 10.180.0.45
 passive-interface Loopback0
 network 10.180.0.45 0.0.0.0 area 0



network 10.181.0.70 0.0.0.1 area 0
network 10.181.0.138 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_44 seq 10 permit 10.200.31.0/24
ip prefix-list PL_EXPORT_ALLOWED_44 seq 20 permit 10.200.32.0/24
ip prefix-list PL_EXPORT_ALLOWED_44 seq 30 permit 10.200.33.0/24
ip prefix-list PL_EXPORT_ALLOWED_44 seq 40 permit 10.200.34.0/24
