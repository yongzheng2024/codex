ip prefix-list PL_EXPORT_DENY_LINK_44_1 seq 10 deny 10.181.0.144/31
!

ip prefix-list PL_EXPORT_DENY_LINK_44_2 seq 10 deny 10.181.0.70/31
!

ip prefix-list PL_EXPORT_DENY_LONG_44 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_44_0 seq 10 deny 10.180.0.45/32
!






route-map RM_POLICY_IN_44_46 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_44_46 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_44_0
 ! Block loopback 10.180.0.45/32


route-map RM_POLICY_OUT_44_46 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_44_0
 ! Block link 10.181.0.138/31


route-map RM_POLICY_OUT_44_46 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_44_1
 ! Block link 10.181.0.144/31


route-map RM_POLICY_OUT_44_46 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_44_2
 ! Block link 10.181.0.70/31


route-map RM_POLICY_OUT_44_46 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_44
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_44_46 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_44
 set metric 20
 set as-path prepend 65002 65002
 ! Outbound policy baseline


route-map RM_POLICY_OUT_44_46 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.45
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.7 peer-group RR


 !
 neighbor 10.180.0.8 peer-group RR




 !
 neighbor 10.181.0.145 peer-group EBGP
 neighbor 10.181.0.145 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.7 activate


  neighbor 10.180.0.8 activate




  neighbor 10.181.0.145 activate
  neighbor 10.181.0.145 route-map RM_POLICY_IN_44_46 in
  neighbor 10.181.0.145 route-map RM_POLICY_OUT_44_46 out





  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

  network 10.200.33.0 mask 255.255.255.0

  network 10.200.34.0 mask 255.255.255.0

 exit-address-family
