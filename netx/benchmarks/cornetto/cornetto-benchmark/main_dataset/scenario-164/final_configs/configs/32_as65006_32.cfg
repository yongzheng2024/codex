
hostname 32_as65006_32
!
interface Loopback0
 ip address 10.180.0.33 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.38.0/24


 ip address 10.200.38.3 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.29.0/24


 ip address 10.200.29.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.30.0/24


 ip address 10.200.30.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 13_as65006_13 (13)

 ip address 10.181.0.53 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 15_as65003_15 (15)

 ip address 10.181.0.61 255.255.255.254
 mtu 1500
!


ip route 10.200.29.0 255.255.255.0 Loopback101
ip route 10.200.30.0 255.255.255.0 Loopback102
ip route 10.200.38.0 255.255.255.0 Loopback100
!

router ospf 1
 router-id 10.180.0.33
 passive-interface Loopback0
 network 10.180.0.33 0.0.0.0 area 0



network 10.181.0.52 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_32 seq 10 permit 10.200.29.0/24
ip prefix-list PL_EXPORT_ALLOWED_32 seq 20 permit 10.200.30.0/24
ip prefix-list PL_EXPORT_ALLOWED_32 seq 30 permit 10.200.38.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_32_0 seq 10 deny 10.181.0.52/31
!

ip prefix-list PL_EXPORT_DENY_LINK_32_1 seq 10 deny 10.181.0.60/31
!

ip prefix-list PL_EXPORT_DENY_LONG_32 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_32_0 seq 10 deny 10.180.0.33/32
!






route-map RM_POLICY_IN_32_15 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_32_15 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_32_0
 ! Block loopback 10.180.0.33/32


route-map RM_POLICY_OUT_32_15 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_0
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_32_15 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_1
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_32_15 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_32
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_32_15 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_32
 set metric 16
 set as-path prepend 65006 65006 65006
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_32_15 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.33
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP


 !
 neighbor 10.180.0.29 peer-group IBGP


 !
 neighbor 10.180.0.39 peer-group IBGP


 !
 neighbor 10.180.0.40 peer-group IBGP


 !
 neighbor 10.180.0.41 peer-group IBGP



 !
 neighbor 10.181.0.60 peer-group EBGP
 neighbor 10.181.0.60 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.14 activate


  neighbor 10.180.0.28 activate


  neighbor 10.180.0.29 activate


  neighbor 10.180.0.39 activate


  neighbor 10.180.0.40 activate


  neighbor 10.180.0.41 activate



  neighbor 10.181.0.60 activate
  neighbor 10.181.0.60 route-map RM_POLICY_IN_32_15 in
  neighbor 10.181.0.60 route-map RM_POLICY_OUT_32_15 out





  network 10.200.29.0 mask 255.255.255.0

  network 10.200.30.0 mask 255.255.255.0

  network 10.200.38.0 mask 255.255.255.0

 exit-address-family
