route-map RM_POLICY_OUT_21_22 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_1
 ! Block link 10.181.0.92/31


route-map RM_POLICY_OUT_21_22 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_21
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_21_22 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_21
 set metric 15
 set as-path prepend 65007 65007 65007
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_21_22 deny 65000














 ! Deny other outbound routes

!







