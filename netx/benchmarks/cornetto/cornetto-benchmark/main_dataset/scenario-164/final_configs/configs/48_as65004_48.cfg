
hostname 48_as65004_48
!
interface Loopback0
 ip address 10.180.0.49 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.42.0/24


 ip address 10.200.42.3 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.41.0/24


 ip address 10.200.41.2 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.39.0/24


 ip address 10.200.39.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.40.0/24


 ip address 10.200.40.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 24_as65004_24 (24)

 ip address 10.181.0.103 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 46_as65003_46 (46)

 ip address 10.181.0.153 255.255.255.254
 mtu 1500
!


ip route 10.200.39.0 255.255.255.0 Loopback102
ip route 10.200.40.0 255.255.255.0 Loopback103
ip route 10.200.41.0 255.255.255.0 Loopback101
ip route 10.200.42.0 255.255.255.0 Loopback100
!

router ospf 1
 router-id 10.180.0.49
 passive-interface Loopback0
 network 10.180.0.49 0.0.0.0 area 0



network 10.181.0.102 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_48 seq 10 permit 10.200.39.0/24
ip prefix-list PL_EXPORT_ALLOWED_48 seq 20 permit 10.200.40.0/24
ip prefix-list PL_EXPORT_ALLOWED_48 seq 30 permit 10.200.41.0/24
ip prefix-list PL_EXPORT_ALLOWED_48 seq 40 permit 10.200.42.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_48_0 seq 10 deny 10.181.0.102/31
!

ip prefix-list PL_EXPORT_DENY_LINK_48_1 seq 10 deny 10.181.0.152/31
!

ip prefix-list PL_EXPORT_DENY_LONG_48 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_48_0 seq 10 deny 10.180.0.49/32
!






route-map RM_POLICY_IN_48_46 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_48_46 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_48_0
 ! Block loopback 10.180.0.49/32


route-map RM_POLICY_OUT_48_46 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_48_0
 ! Block link 10.181.0.102/31


route-map RM_POLICY_OUT_48_46 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_48_1
 ! Block link 10.181.0.152/31


route-map RM_POLICY_OUT_48_46 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_48
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_48_46 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_48
 set metric 15
 set as-path prepend 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_48_46 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.49
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.24 peer-group RR




 !
 neighbor 10.181.0.152 peer-group EBGP
 neighbor 10.181.0.152 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.24 activate




  neighbor 10.181.0.152 activate
  neighbor 10.181.0.152 route-map RM_POLICY_IN_48_46 in
  neighbor 10.181.0.152 route-map RM_POLICY_OUT_48_46 out





  network 10.200.39.0 mask 255.255.255.0

  network 10.200.40.0 mask 255.255.255.0

  network 10.200.41.0 mask 255.255.255.0

  network 10.200.42.0 mask 255.255.255.0

 exit-address-family
