
hostname 11_as65002_Varna
!
interface Loopback0
 ip address 10.180.0.12 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!



ip access-list extended ACL_11_GigabitEthernet0_0
 10 permit ip host 10.180.0.7 any
 20 permit ip host 10.181.0.16 any
 30 permit ip host 10.181.0.17 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_11_GigabitEthernet0_0_OUT
 5 deny ip any any
 10 permit ip host 10.180.0.12 any
 20 permit ip host 10.181.0.17 any
 30 permit ip host 10.181.0.19 any
 40 permit ip host 10.181.0.32 any
 50 permit ip host 10.181.0.34 any
 60 permit ip 10.181.0.18 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 6_as65003_Dobrich (6)

 ip address 10.181.0.17 255.255.255.254

 ip access-group ACL_11_GigabitEthernet0_0 in

 ip access-group ACL_11_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 7_as65002_Burgas (7)

 ip address 10.181.0.19 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 27_as65002_Bucharest (27)

 ip address 10.181.0.32 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/3
 description to 14_as65002_Sofia (14)

 ip address 10.181.0.34 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.12
 passive-interface Loopback0
 network 10.180.0.12 0.0.0.0 area 0



network 10.181.0.18 0.0.0.1 area 0
network 10.181.0.32 0.0.0.1 area 0
network 10.181.0.34 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_11 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_11 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_11 seq 30 permit 10.200.2.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_11_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_11_1 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_11_2 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LINK_11_3 seq 10 deny 10.181.0.34/31
!

ip prefix-list PL_EXPORT_DENY_LONG_11 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_11_0 seq 10 deny 10.180.0.12/32
!




ip community-list standard CL_COMM_11_6 permit 65535:65282
ip community-list standard CL_COMM_11_6 permit no-export
!





route-map RM_POLICY_IN_11_6 permit 5














 match community CL_COMM_11_6
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_11_6 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_11_6 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_11_0
 ! Block loopback 10.180.0.12/32


route-map RM_POLICY_OUT_11_6 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_11_6 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_1
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_11_6 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_2
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_11_6 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_3
 ! Block link 10.181.0.34/31


route-map RM_POLICY_OUT_11_6 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_11
 set community no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_11_6 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_11
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_11_6 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.12
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.12


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.15 peer-group RR



 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP


 !
 neighbor 10.180.0.30 peer-group IBGP


 !
 neighbor 10.180.0.37 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP



 !
 neighbor 10.181.0.16 peer-group EBGP
 neighbor 10.181.0.16 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.15 activate



  neighbor 10.180.0.8 activate
  neighbor 10.180.0.8 next-hop-self


  neighbor 10.180.0.14 activate
  neighbor 10.180.0.14 next-hop-self


  neighbor 10.180.0.20 activate
  neighbor 10.180.0.20 next-hop-self


  neighbor 10.180.0.22 activate
  neighbor 10.180.0.22 next-hop-self


  neighbor 10.180.0.28 activate
  neighbor 10.180.0.28 next-hop-self


  neighbor 10.180.0.30 activate
  neighbor 10.180.0.30 next-hop-self


  neighbor 10.180.0.37 activate
  neighbor 10.180.0.37 next-hop-self


  neighbor 10.180.0.26 activate
  neighbor 10.180.0.26 next-hop-self


  neighbor 10.180.0.27 activate
  neighbor 10.180.0.27 next-hop-self



  neighbor 10.181.0.16 activate
  neighbor 10.181.0.16 route-map RM_POLICY_IN_11_6 in
  neighbor 10.181.0.16 route-map RM_POLICY_OUT_11_6 out





  network 10.200.0.0 mask 255.255.255.0

