 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_12_14 deny 200














 match ip address prefix-list PL_OUT_12_14
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_12_14 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.13
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.13


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.9 peer-group RR



 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP



 !
