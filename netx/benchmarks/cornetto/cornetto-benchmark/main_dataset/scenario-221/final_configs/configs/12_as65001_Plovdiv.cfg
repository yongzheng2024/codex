 match ip address prefix-list PL_EXPORT_DENY_LINK_12_3
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_12_14 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_12
 set metric 27
 set as-path prepend 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_12_14 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_4
 ! Block link 10.181.0.42/31


route-map RM_POLICY_OUT_12_14 deny 120














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_5
 ! Block link 10.181.0.44/31


route-map RM_POLICY_OUT_12_14 deny 130














