route-map RM_POLICY_IN_12_14 permit 10














 match ip address prefix-list PL_IN_12_14
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_12_14 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_12_14 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_12_0
 ! Block loopback 10.180.0.13/32


route-map RM_POLICY_OUT_12_14 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_0
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_12_14 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_1
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_12_14 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_2
 ! Block link 10.181.0.38/31


