
hostname 7_as65002_Burgas
!
interface Loopback0
 ip address 10.180.0.8 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.27.0/24


 ip address 10.200.27.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.28.0/24


 ip address 10.200.28.1 255.255.255.0
!



ip access-list extended ACL_7_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.8 any
 20 permit ip host 10.181.0.13 any
 30 permit ip host 10.181.0.18 any
 40 permit ip host 10.181.0.20 any
 50 permit ip 10.181.0.18 0.0.0.1 any
 60 permit ip 10.181.0.20 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 4_as65001_Yambol (4)

 ip address 10.181.0.13 255.255.255.254

 ip access-group ACL_7_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65002_Varna (11)

 ip address 10.181.0.18 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 14_as65002_Sofia (14)

 ip address 10.181.0.20 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.27.0 255.255.255.0 Loopback100
ip route 10.200.28.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.8
 passive-interface Loopback0
 network 10.180.0.8 0.0.0.0 area 0



network 10.181.0.18 0.0.0.1 area 0
network 10.181.0.20 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_7 seq 10 permit 10.200.27.0/24
ip prefix-list PL_EXPORT_ALLOWED_7 seq 20 permit 10.200.28.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_7_0 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_7_1 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_7_2 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LONG_7 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_7_0 seq 10 deny 10.180.0.8/32
!




ip community-list standard CL_COMM_7_4 permit 65535:65282
!





route-map RM_POLICY_IN_7_4 permit 5














 match community CL_COMM_7_4
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_7_4 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_7_4 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_7_0
 ! Block loopback 10.180.0.8/32


route-map RM_POLICY_OUT_7_4 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_7_4 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_1
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_7_4 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_2
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_7_4 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_7
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_7_4 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_7
 set community no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_7_4 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.8
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.12 peer-group RR




 !
 neighbor 10.181.0.12 peer-group EBGP
 neighbor 10.181.0.12 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.12 activate




  neighbor 10.181.0.12 activate
  neighbor 10.181.0.12 route-map RM_POLICY_IN_7_4 in
  neighbor 10.181.0.12 route-map RM_POLICY_OUT_7_4 out





  network 10.200.27.0 mask 255.255.255.0

  network 10.200.28.0 mask 255.255.255.0

 exit-address-family
