
hostname 2_as65005_San-Antonio
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 19_as65005_El-Paso-Las-Cruces (19)

 ip address 10.181.0.8 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 6_as65005_Houston (6)

 ip address 10.181.0.10 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0



network 10.181.0.8 0.0.0.1 area 0
network 10.181.0.10 0.0.0.1 area 0
!








router bgp 65005
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0




 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP



 !
 address-family ipv4


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.27 activate






 exit-address-family
