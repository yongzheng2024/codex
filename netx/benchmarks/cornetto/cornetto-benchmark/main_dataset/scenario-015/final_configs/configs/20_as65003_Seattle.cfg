
hostname 20_as65003_Seattle
!
interface Loopback0
 ip address 10.180.0.21 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.16.0/24


 ip address 10.200.16.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.17.0/24


 ip address 10.200.17.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.18.0/24


 ip address 10.200.18.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.19.0/24


 ip address 10.200.19.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 21_as65006_Portland (21)

 ip address 10.181.0.52 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 23_as65003_Boise (23)

 ip address 10.181.0.54 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.16.0 255.255.255.0 Loopback100
ip route 10.200.17.0 255.255.255.0 Loopback101
ip route 10.200.18.0 255.255.255.0 Loopback102
ip route 10.200.19.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.21
 passive-interface Loopback0
 network 10.180.0.21 0.0.0.0 area 0



network 10.181.0.54 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_20 seq 10 permit 10.200.16.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 20 permit 10.200.17.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 30 permit 10.200.18.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 40 permit 10.200.19.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_20_0 seq 10 deny 10.181.0.52/31
!

ip prefix-list PL_EXPORT_DENY_LINK_20_1 seq 10 deny 10.181.0.54/31
!

ip prefix-list PL_EXPORT_DENY_LONG_20 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_20_0 seq 10 deny 10.180.0.21/32
!

ip prefix-list PL_IN_20_21 seq 10 permit 10.181.0.56/31
ip prefix-list PL_IN_20_21 seq 20 permit 10.200.20.0/24
ip prefix-list PL_IN_20_21 seq 30 permit 10.180.0.22/32
ip prefix-list PL_IN_20_21 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_20_21 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_20_21 seq 10 permit 10.200.16.0/24
ip prefix-list PL_OUT_20_21 seq 20 permit 10.200.18.0/24
!






route-map RM_POLICY_IN_20_21 permit 10














 match ip address prefix-list PL_IN_20_21
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_20_21 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_20_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_20_0
 ! Block loopback 10.180.0.21/32


route-map RM_POLICY_OUT_20_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_0
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_20_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_1
 ! Block link 10.181.0.54/31


route-map RM_POLICY_OUT_20_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_20
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_20_21 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_20
 set metric 11
 set as-path prepend 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_20_21 deny 200














 match ip address prefix-list PL_OUT_20_21
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_20_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.21
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.24 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP



 !
 neighbor 10.181.0.53 peer-group EBGP
 neighbor 10.181.0.53 remote-as 65006


 !
 address-family ipv4


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.24 activate


  neighbor 10.180.0.25 activate


  neighbor 10.180.0.26 activate



  neighbor 10.181.0.53 activate
  neighbor 10.181.0.53 route-map RM_POLICY_IN_20_21 in
  neighbor 10.181.0.53 route-map RM_POLICY_OUT_20_21 out





  network 10.200.16.0 mask 255.255.255.0

  network 10.200.17.0 mask 255.255.255.0

  network 10.200.18.0 mask 255.255.255.0

  network 10.200.19.0 mask 255.255.255.0

 exit-address-family
