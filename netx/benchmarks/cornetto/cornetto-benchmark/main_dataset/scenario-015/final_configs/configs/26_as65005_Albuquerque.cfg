
hostname 26_as65005_Albuquerque
!
interface Loopback0
 ip address 10.180.0.27 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.26.0/24


 ip address 10.200.26.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.27.0/24


 ip address 10.200.27.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.28.0/24


 ip address 10.200.28.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 14_as65003_Raton (14)

 ip address 10.181.0.39 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 19_as65005_El-Paso-Las-Cruces (19)

 ip address 10.181.0.51 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.26.0 255.255.255.0 Loopback100
ip route 10.200.27.0 255.255.255.0 Loopback101
ip route 10.200.28.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.27
 passive-interface Loopback0
 network 10.180.0.27 0.0.0.0 area 0



network 10.181.0.50 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_26 seq 10 permit 10.200.26.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 20 permit 10.200.27.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 30 permit 10.200.28.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_26_0 seq 10 deny 10.181.0.38/31
!

ip prefix-list PL_EXPORT_DENY_LINK_26_1 seq 10 deny 10.181.0.50/31
!

ip prefix-list PL_EXPORT_DENY_LONG_26 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_26_0 seq 10 deny 10.180.0.27/32
!

ip prefix-list PL_IN_26_14 seq 10 permit 10.200.8.0/24
ip prefix-list PL_IN_26_14 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_26_14 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_26_14 seq 10 permit 10.200.27.0/24
ip prefix-list PL_OUT_26_14 seq 20 permit 10.200.26.0/24
!






route-map RM_POLICY_IN_26_14 permit 10














 match ip address prefix-list PL_IN_26_14
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_26_14 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_26_14 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_26_0
 ! Block loopback 10.180.0.27/32


route-map RM_POLICY_OUT_26_14 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_0
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_26_14 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_1
 ! Block link 10.181.0.50/31


route-map RM_POLICY_OUT_26_14 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_26
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_26_14 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_26
 set metric 9
 set as-path prepend 65005 65005 65005
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_26_14 deny 200














 match ip address prefix-list PL_OUT_26_14
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_26_14 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.27
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP



 !
 neighbor 10.181.0.38 peer-group EBGP
 neighbor 10.181.0.38 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.3 activate


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.20 activate



  neighbor 10.181.0.38 activate
  neighbor 10.181.0.38 route-map RM_POLICY_IN_26_14 in
  neighbor 10.181.0.38 route-map RM_POLICY_OUT_26_14 out





  network 10.200.26.0 mask 255.255.255.0

  network 10.200.27.0 mask 255.255.255.0

  network 10.200.28.0 mask 255.255.255.0

 exit-address-family
