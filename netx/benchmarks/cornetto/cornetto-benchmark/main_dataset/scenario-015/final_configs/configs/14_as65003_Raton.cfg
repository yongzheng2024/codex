
hostname 14_as65003_Raton
!
interface Loopback0
 ip address 10.180.0.15 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!



ip access-list extended ACL_14_GigabitEthernet0_1
 10 permit ip host 10.180.0.27 any
 20 permit ip host 10.181.0.38 any
 30 permit ip host 10.181.0.39 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 25_as65003_Denver (25)

 ip address 10.181.0.36 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 26_as65005_Albuquerque (26)

 ip address 10.181.0.38 255.255.255.254

 ip access-group ACL_14_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.6.0 255.255.255.0 Loopback100
ip route 10.200.7.0 255.255.255.0 Loopback101
ip route 10.200.8.0 255.255.255.0 Loopback102
ip route 10.200.9.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.15
 passive-interface Loopback0
 network 10.180.0.15 0.0.0.0 area 0



network 10.181.0.36 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_14 seq 10 permit 10.200.6.0/24
ip prefix-list PL_EXPORT_ALLOWED_14 seq 20 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_14 seq 30 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_14 seq 40 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_14_0 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LINK_14_1 seq 10 deny 10.181.0.38/31
!

ip prefix-list PL_EXPORT_DENY_LONG_14 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_14_0 seq 10 deny 10.180.0.15/32
!




ip community-list standard CL_COMM_14_26 permit 65535:65282
ip community-list standard CL_COMM_14_26 permit no-advertise
!





route-map RM_POLICY_IN_14_26 permit 5














 match community CL_COMM_14_26
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_14_26 permit 10














 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_14_26 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_14_26 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_14_0
 ! Block loopback 10.180.0.15/32


route-map RM_POLICY_OUT_14_26 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_0
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_14_26 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_14_1
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_14_26 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_14
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_14_26 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_14
 set metric 26
 set as-path prepend 65003
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_14_26 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.15
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.21 peer-group IBGP


 !
 neighbor 10.180.0.24 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP



 !
 neighbor 10.181.0.39 peer-group EBGP
 neighbor 10.181.0.39 remote-as 65005


 !
 address-family ipv4


  neighbor 10.180.0.21 activate


  neighbor 10.180.0.24 activate


  neighbor 10.180.0.25 activate


  neighbor 10.180.0.26 activate



  neighbor 10.181.0.39 activate
  neighbor 10.181.0.39 route-map RM_POLICY_IN_14_26 in
  neighbor 10.181.0.39 route-map RM_POLICY_OUT_14_26 out





  network 10.200.6.0 mask 255.255.255.0

  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
