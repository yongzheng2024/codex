
hostname 16_as65001_Washington-DC
!
interface Loopback0
 ip address 10.180.0.17 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!



ip access-list extended ACL_16_GigabitEthernet0_0
 10 permit ip host 10.180.0.10 any
 20 permit ip host 10.181.0.24 any
 30 permit ip host 10.181.0.25 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 9_as65002_Raleigh (9)

 ip address 10.181.0.25 255.255.255.254

 ip access-group ACL_16_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 15_as65001_Pittsburgh (15)

 ip address 10.181.0.41 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 17_as65001_Philadelphia (17)

 ip address 10.181.0.42 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.11.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.17
 passive-interface Loopback0
 network 10.180.0.17 0.0.0.0 area 0



network 10.181.0.40 0.0.0.1 area 0
network 10.181.0.42 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_16 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_16 seq 20 permit 10.200.11.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_16_0 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_16_1 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LINK_16_2 seq 10 deny 10.181.0.42/31
!

ip prefix-list PL_EXPORT_DENY_LONG_16 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_16_0 seq 10 deny 10.180.0.17/32
!






route-map RM_POLICY_IN_16_9 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_16_9 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_16_0
 ! Block loopback 10.180.0.17/32


route-map RM_POLICY_OUT_16_9 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_0
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_16_9 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_1
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_16_9 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_2
 ! Block link 10.181.0.42/31


route-map RM_POLICY_OUT_16_9 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_16
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_16_9 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_16
 set metric 14
 set as-path prepend 65001
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_16_9 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.17
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP



 !
 neighbor 10.181.0.24 peer-group EBGP
 neighbor 10.181.0.24 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.13 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.18 activate



  neighbor 10.181.0.24 activate
  neighbor 10.181.0.24 route-map RM_POLICY_IN_16_9 in
  neighbor 10.181.0.24 route-map RM_POLICY_OUT_16_9 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

 exit-address-family
