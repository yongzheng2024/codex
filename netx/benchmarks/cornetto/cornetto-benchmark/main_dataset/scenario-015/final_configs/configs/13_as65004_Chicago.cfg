
hostname 13_as65004_Chicago
!
interface Loopback0
 ip address 10.180.0.14 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 1_as65004_Kansas-City (1)

 ip address 10.181.0.7 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 12_as65001_Cleveland (12)

 ip address 10.181.0.33 255.255.255.254
 mtu 1500
!


ip route 10.200.4.0 255.255.255.0 Loopback100
ip route 10.200.5.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.14
 passive-interface Loopback0
 network 10.180.0.14 0.0.0.0 area 0



network 10.181.0.6 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_13 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_13 seq 20 permit 10.200.5.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_13_0 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LINK_13_1 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LONG_13 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_13_0 seq 10 deny 10.180.0.14/32
!

ip prefix-list PL_IN_13_12 seq 10 permit 10.200.3.0/24
ip prefix-list PL_IN_13_12 seq 20 permit 10.200.2.0/24
ip prefix-list PL_IN_13_12 seq 30 permit 10.181.0.30/31
ip prefix-list PL_IN_13_12 seq 40 permit 10.180.0.13/32
ip prefix-list PL_IN_13_12 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_13_12 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_13_12 seq 10 permit 10.200.4.0/24
ip prefix-list PL_OUT_13_12 seq 20 permit 10.200.5.0/24
!






route-map RM_POLICY_IN_13_12 permit 10














 match ip address prefix-list PL_IN_13_12
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_13_12 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_13_12 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_13_0
 ! Block loopback 10.180.0.14/32


route-map RM_POLICY_OUT_13_12 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_0
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_13_12 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_1
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_13_12 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_13
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_13_12 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_13
 set metric 12
 set as-path prepend 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_13_12 deny 200














 match ip address prefix-list PL_OUT_13_12
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_13_12 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.14
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.4 peer-group IBGP



 !
 neighbor 10.181.0.32 peer-group EBGP
 neighbor 10.181.0.32 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.4 activate



  neighbor 10.181.0.32 activate
  neighbor 10.181.0.32 route-map RM_POLICY_OUT_13_12 out





  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

 exit-address-family
