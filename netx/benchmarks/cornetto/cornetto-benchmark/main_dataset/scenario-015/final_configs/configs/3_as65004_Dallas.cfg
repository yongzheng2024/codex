
hostname 3_as65004_Dallas
!
interface Loopback0
 ip address 10.180.0.4 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.32.0/24


 ip address 10.200.32.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.33.0/24


 ip address 10.200.33.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.34.0/24


 ip address 10.200.34.1 255.255.255.0
!



ip access-list extended ACL_3_GigabitEthernet0_1
 10 permit ip host 10.180.0.7 any
 20 permit ip host 10.181.0.12 any
 30 permit ip host 10.181.0.13 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 0_as65004_Tulsa (0)

 ip address 10.181.0.3 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 6_as65005_Houston (6)

 ip address 10.181.0.12 255.255.255.254

 ip access-group ACL_3_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.32.0 255.255.255.0 Loopback100
ip route 10.200.33.0 255.255.255.0 Loopback101
ip route 10.200.34.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.4
 passive-interface Loopback0
 network 10.180.0.4 0.0.0.0 area 0



network 10.181.0.2 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_3 seq 10 permit 10.200.32.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 20 permit 10.200.33.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 30 permit 10.200.34.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_3_0 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_1 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LONG_3 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_3_0 seq 10 deny 10.180.0.4/32
!






route-map RM_POLICY_IN_3_6 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_3_6 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_6 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_3_6 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_3_6 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_6 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_3
 set metric 11
 set as-path prepend 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_3_6 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.14 peer-group IBGP



 !
 neighbor 10.181.0.13 peer-group EBGP
 neighbor 10.181.0.13 remote-as 65005


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.14 activate



  neighbor 10.181.0.13 activate
  neighbor 10.181.0.13 route-map RM_POLICY_IN_3_6 in
  neighbor 10.181.0.13 route-map RM_POLICY_OUT_3_6 out





  network 10.200.32.0 mask 255.255.255.0

  network 10.200.33.0 mask 255.255.255.0

  network 10.200.34.0 mask 255.255.255.0

 exit-address-family
