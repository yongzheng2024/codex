!


router ospf 1
 router-id 10.180.0.24
 passive-interface Loopback0
 network 10.180.0.24 0.0.0.0 area 0



network 10.181.0.54 0.0.0.1 area 0
network 10.181.0.58 0.0.0.1 area 0
!








router bgp 65003
 bgp router-id 10.180.0.24
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0




 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP



 !
 address-family ipv4


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.21 activate


  neighbor 10.180.0.25 activate


  neighbor 10.180.0.26 activate






 exit-address-family
