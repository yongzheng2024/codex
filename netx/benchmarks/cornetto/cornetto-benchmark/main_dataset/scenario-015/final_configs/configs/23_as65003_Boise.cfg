
hostname 23_as65003_Boise
!
interface Loopback0
 ip address 10.180.0.24 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 20_as65003_Seattle (20)

 ip address 10.181.0.55 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

