
hostname 9_as65002_Raleigh
!
interface Loopback0
 ip address 10.180.0.10 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.41.0/24


 ip address 10.200.41.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.42.0/24


 ip address 10.200.42.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 8_as65002_Atlanta (8)

 ip address 10.181.0.23 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 16_as65001_Washington-DC (16)

 ip address 10.181.0.24 255.255.255.254
 mtu 1500
!


ip route 10.200.41.0 255.255.255.0 Loopback100
ip route 10.200.42.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.10
 passive-interface Loopback0
 network 10.180.0.10 0.0.0.0 area 0



network 10.181.0.22 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_9 seq 10 permit 10.200.41.0/24
ip prefix-list PL_EXPORT_ALLOWED_9 seq 20 permit 10.200.42.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_9_0 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_9_1 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LONG_9 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_9_0 seq 10 deny 10.180.0.10/32
!






route-map RM_POLICY_IN_9_16 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_9_16 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_9_0
 ! Block loopback 10.180.0.10/32


route-map RM_POLICY_OUT_9_16 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_9_0
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_9_16 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_9_1
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_9_16 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_9
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_9_16 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_9
 set metric 13
 set as-path prepend 65002 65002
 set community 65000:100 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_9_16 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.10
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP



 !
 neighbor 10.181.0.25 peer-group EBGP
 neighbor 10.181.0.25 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.8 activate


  neighbor 10.180.0.9 activate



  neighbor 10.181.0.25 activate
  neighbor 10.181.0.25 route-map RM_POLICY_IN_9_16 in
  neighbor 10.181.0.25 route-map RM_POLICY_OUT_9_16 out





  network 10.200.41.0 mask 255.255.255.0

  network 10.200.42.0 mask 255.255.255.0

 exit-address-family
