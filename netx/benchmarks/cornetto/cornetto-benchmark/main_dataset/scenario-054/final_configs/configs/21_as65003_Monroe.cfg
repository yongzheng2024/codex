
hostname 21_as65003_Monroe
!
interface Loopback0
 ip address 10.180.0.22 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.18.0/24


 ip address 10.200.18.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.19.0/24


 ip address 10.200.19.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.20.0/24


 ip address 10.200.20.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!



ip access-list extended ACL_21_GigabitEthernet0_1
 10 permit ip host 10.180.0.27 any
 20 permit ip host 10.181.0.108 any
 30 permit ip host 10.181.0.109 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_21_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.22 any
 20 permit ip host 10.181.0.103 any
 30 permit ip host 10.181.0.108 any
 40 permit ip 10.181.0.102 0.0.0.1 any
 50 permit ip 10.181.0.108 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 20_as65003_Shreveport (20)

 ip address 10.181.0.103 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 26_as65005_Vicksburg (26)

 ip address 10.181.0.108 255.255.255.254

 ip access-group ACL_21_GigabitEthernet0_1 in

 ip access-group ACL_21_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.18.0 255.255.255.0 Loopback100
ip route 10.200.19.0 255.255.255.0 Loopback101
ip route 10.200.20.0 255.255.255.0 Loopback102
ip route 10.200.21.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.22
 passive-interface Loopback0
 network 10.180.0.22 0.0.0.0 area 0



network 10.181.0.102 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_21 seq 10 permit 10.200.18.0/24
ip prefix-list PL_EXPORT_ALLOWED_21 seq 20 permit 10.200.19.0/24
ip prefix-list PL_EXPORT_ALLOWED_21 seq 30 permit 10.200.20.0/24
ip prefix-list PL_EXPORT_ALLOWED_21 seq 40 permit 10.200.21.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_21_0 seq 10 deny 10.181.0.102/31
!

ip prefix-list PL_EXPORT_DENY_LINK_21_1 seq 10 deny 10.181.0.108/31
!

ip prefix-list PL_EXPORT_DENY_LONG_21 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_21_0 seq 10 deny 10.180.0.22/32
!




ip community-list standard CL_COMM_21_26 permit no-advertise
!





route-map RM_POLICY_IN_21_26 permit 5














 match community CL_COMM_21_26
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_21_26 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_21_26 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_21_0
 ! Block loopback 10.180.0.22/32


route-map RM_POLICY_OUT_21_26 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_0
 ! Block link 10.181.0.102/31


route-map RM_POLICY_OUT_21_26 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_1
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_21_26 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_21
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_21_26 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_21
 set community no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_21_26 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.22
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.59 peer-group RR




 !
 neighbor 10.181.0.109 peer-group EBGP
 neighbor 10.181.0.109 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.59 activate




  neighbor 10.181.0.109 activate
  neighbor 10.181.0.109 route-map RM_POLICY_IN_21_26 in
  neighbor 10.181.0.109 route-map RM_POLICY_OUT_21_26 out





  network 10.200.18.0 mask 255.255.255.0

  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

  network 10.200.21.0 mask 255.255.255.0

 exit-address-family
