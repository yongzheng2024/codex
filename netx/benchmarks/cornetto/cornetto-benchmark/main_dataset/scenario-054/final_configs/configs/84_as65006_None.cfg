 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_84_47 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_84
 set metric 29
 set as-path prepend 65006 65006 65006
 ! Outbound policy baseline


route-map RM_POLICY_OUT_84_47 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.85
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.50 peer-group RR


 !
 neighbor 10.180.0.44 peer-group RR




 !
 neighbor 10.181.0.182 peer-group EBGP
 neighbor 10.181.0.182 remote-as 65004


 !
