
hostname 26_as65005_Vicksburg
!
interface Loopback0
 ip address 10.180.0.27 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.23.0/24


 ip address 10.200.23.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.24.0/24


 ip address 10.200.24.1 255.255.255.0
!



ip access-list extended ACL_26_GigabitEthernet0_0
 10 permit ip host 10.180.0.22 any
 20 permit ip host 10.181.0.108 any
 30 permit ip host 10.181.0.109 any
 40 deny ip 198.18.0.0 0.1.255.255 any
 50 deny ip 203.0.113.0 0.0.0.255 any
 60 permit ip any any
!

ip access-list extended ACL_26_GigabitEthernet0_0_OUT
 10 permit ip host 10.180.0.27 any
 20 permit ip host 10.181.0.109 any
 30 permit ip host 10.181.0.123 any
 40 permit ip 10.181.0.108 0.0.0.1 any
 50 permit ip 10.181.0.122 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 21_as65003_Monroe (21)

 ip address 10.181.0.109 255.255.255.254

 ip access-group ACL_26_GigabitEthernet0_0 in

 ip access-group ACL_26_GigabitEthernet0_0_OUT out
 mtu 1500
!
interface GigabitEthernet0/1
 description to 25_as65005_Jackson (25)

 ip address 10.181.0.123 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.22.0 255.255.255.0 Loopback100
ip route 10.200.23.0 255.255.255.0 Loopback101
ip route 10.200.24.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.27
 passive-interface Loopback0
 network 10.180.0.27 0.0.0.0 area 0



network 10.181.0.122 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_26 seq 10 permit 10.200.22.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 20 permit 10.200.23.0/24
ip prefix-list PL_EXPORT_ALLOWED_26 seq 30 permit 10.200.24.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_26_0 seq 10 deny 10.181.0.108/31
!

ip prefix-list PL_EXPORT_DENY_LINK_26_1 seq 10 deny 10.181.0.122/31
!

ip prefix-list PL_EXPORT_DENY_LONG_26 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_26_0 seq 10 deny 10.180.0.27/32
!






route-map RM_POLICY_OUT_26_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_26_0
 ! Block loopback 10.180.0.27/32


route-map RM_POLICY_OUT_26_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_0
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_26_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_26_1
 ! Block link 10.181.0.122/31


route-map RM_POLICY_OUT_26_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_26
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_26_21 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_26
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_26_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.27
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.25 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP


 !
 neighbor 10.180.0.29 peer-group IBGP


 !
 neighbor 10.180.0.30 peer-group IBGP


 !
 neighbor 10.180.0.90 peer-group IBGP


 !
 neighbor 10.180.0.91 peer-group IBGP


 !
 neighbor 10.180.0.92 peer-group IBGP


 !
 neighbor 10.180.0.93 peer-group IBGP


 !
 neighbor 10.180.0.96 peer-group IBGP


 !
 neighbor 10.180.0.97 peer-group IBGP



 !
 neighbor 10.181.0.108 peer-group EBGP
 neighbor 10.181.0.108 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.25 activate


  neighbor 10.180.0.26 activate


  neighbor 10.180.0.28 activate


  neighbor 10.180.0.29 activate


  neighbor 10.180.0.30 activate


  neighbor 10.180.0.90 activate


  neighbor 10.180.0.91 activate


  neighbor 10.180.0.92 activate


  neighbor 10.180.0.93 activate


  neighbor 10.180.0.96 activate


  neighbor 10.180.0.97 activate



  neighbor 10.181.0.108 activate
  neighbor 10.181.0.108 route-map RM_POLICY_OUT_26_21 out





  network 10.200.22.0 mask 255.255.255.0

  network 10.200.23.0 mask 255.255.255.0

  network 10.200.24.0 mask 255.255.255.0

 exit-address-family
