 match ip address prefix-list PL_EXPORT_DENY_LONG_90
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_90_54 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_90
 set community 65000:100 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_90_54 deny 65000














