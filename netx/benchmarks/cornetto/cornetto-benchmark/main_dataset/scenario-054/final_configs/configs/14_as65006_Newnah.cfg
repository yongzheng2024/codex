
hostname 14_as65006_Newnah
!
interface Loopback0
 ip address 10.180.0.15 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 17_as65006_Lagrange (17)

 ip address 10.181.0.78 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 84_as65006_None (84)

 ip address 10.181.0.80 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

