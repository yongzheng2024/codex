router ospf 1
 router-id 10.180.0.15
 passive-interface Loopback0
 network 10.180.0.15 0.0.0.0 area 0



network 10.181.0.78 0.0.0.1 area 0
network 10.181.0.80 0.0.0.1 area 0
!








router bgp 65006
 bgp router-id 10.180.0.15
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.50 peer-group RR


 !
 neighbor 10.180.0.44 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.50 activate


  neighbor 10.180.0.44 activate







 exit-address-family
