ip prefix-list PL_IN_73_72 seq 20 permit 10.181.1.30/31
ip prefix-list PL_IN_73_72 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_73_72 seq 10 permit 10.200.74.0/24
!






route-map RM_POLICY_IN_73_72 permit 10














 match ip address prefix-list PL_IN_73_72
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_73_72 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_73_72 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_73_0
 ! Block loopback 10.180.0.74/32


route-map RM_POLICY_OUT_73_72 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_73_0
 ! Block link 10.181.0.178/31


route-map RM_POLICY_OUT_73_72 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_73_1
 ! Block link 10.181.1.18/31


route-map RM_POLICY_OUT_73_72 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_73_2
 ! Block link 10.181.1.32/31


route-map RM_POLICY_OUT_73_72 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_73
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_73_72 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_73
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_73_72 deny 200














 match ip address prefix-list PL_OUT_73_72
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_73_72 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.74
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.61 peer-group RR




 !
 neighbor 10.181.1.18 peer-group EBGP
 neighbor 10.181.1.18 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.61 activate




  neighbor 10.181.1.18 activate
  neighbor 10.181.1.18 route-map RM_POLICY_IN_73_72 in
  neighbor 10.181.1.18 route-map RM_POLICY_OUT_73_72 out





  network 10.200.74.0 mask 255.255.255.0

  network 10.200.75.0 mask 255.255.255.0

 exit-address-family
