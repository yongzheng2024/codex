ip prefix-list PL_EXPORT_ALLOWED_73 seq 10 permit 10.200.74.0/24
ip prefix-list PL_EXPORT_ALLOWED_73 seq 20 permit 10.200.75.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_73_0 seq 10 deny 10.181.0.178/31
!

