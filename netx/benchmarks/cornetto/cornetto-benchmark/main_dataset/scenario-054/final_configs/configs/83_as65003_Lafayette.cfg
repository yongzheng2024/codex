!
interface GigabitEthernet0/2
 description to 82_as65003_Lake-Charles (82)

 ip address 10.181.1.69 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
