ip route 10.200.85.0 255.255.255.0 Loopback100
ip route 10.200.86.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.84
 passive-interface Loopback0
 network 10.180.0.84 0.0.0.0 area 0



network 10.181.0.110 0.0.0.1 area 0
network 10.181.1.68 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_83 seq 10 permit 10.200.85.0/24
ip prefix-list PL_EXPORT_ALLOWED_83 seq 20 permit 10.200.86.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_83_0 seq 10 deny 10.181.0.110/31
!

ip prefix-list PL_EXPORT_DENY_LINK_83_1 seq 10 deny 10.181.0.128/31
!

ip prefix-list PL_EXPORT_DENY_LINK_83_2 seq 10 deny 10.181.1.68/31
!

ip prefix-list PL_EXPORT_DENY_LONG_83 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_83_0 seq 10 deny 10.180.0.84/32
!






route-map RM_POLICY_OUT_83_27 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_83_0
 ! Block loopback 10.180.0.84/32


route-map RM_POLICY_OUT_83_27 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_83_0
 ! Block link 10.181.0.110/31


route-map RM_POLICY_OUT_83_27 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_83_1
 ! Block link 10.181.0.128/31


route-map RM_POLICY_OUT_83_27 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_83_2
 ! Block link 10.181.1.68/31


route-map RM_POLICY_OUT_83_27 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_83
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_83_27 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_83
 set community no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_83_27 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.84
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.59 peer-group RR


 !
 neighbor 10.180.0.21 peer-group RR




 !
 neighbor 10.181.0.128 peer-group EBGP
 neighbor 10.181.0.128 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.59 activate


  neighbor 10.180.0.21 activate




  neighbor 10.181.0.128 activate
  neighbor 10.181.0.128 route-map RM_POLICY_OUT_83_27 out





  network 10.200.85.0 mask 255.255.255.0

  network 10.200.86.0 mask 255.255.255.0

 exit-address-family
