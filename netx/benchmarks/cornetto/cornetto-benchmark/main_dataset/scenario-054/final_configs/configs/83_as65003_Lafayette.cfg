
hostname 83_as65003_Lafayette
!
interface Loopback0
 ip address 10.180.0.84 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.85.0/24


 ip address 10.200.85.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.86.0/24


 ip address 10.200.86.1 255.255.255.0
!



ip access-list extended ACL_83_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.84 any
 20 permit ip host 10.181.0.111 any
 30 permit ip host 10.181.0.129 any
 40 permit ip host 10.181.1.69 any
 50 permit ip 10.181.0.128 0.0.0.1 any
 60 permit ip 10.181.1.68 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 22_as65003_Alexandria (22)

 ip address 10.181.0.111 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 27_as65005_Baton-Rouge (27)

 ip address 10.181.0.129 255.255.255.254

 ip access-group ACL_83_GigabitEthernet0_1_OUT out
