 network 10.180.0.111 0.0.0.0 area 0



network 10.181.0.230 0.0.0.1 area 0
network 10.181.1.108 0.0.0.1 area 0
!








router bgp 65003
 bgp router-id 10.180.0.111
 bgp log-neighbor-changes
