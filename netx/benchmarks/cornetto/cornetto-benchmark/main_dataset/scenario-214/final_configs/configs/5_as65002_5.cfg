
hostname 5_as65002_5
!
interface Loopback0
 ip address 10.180.0.6 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.37.0/24


 ip address 10.200.37.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.38.0/24


 ip address 10.200.38.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.39.0/24


 ip address 10.200.39.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.40.0/24


 ip address 10.200.40.1 255.255.255.0
!



ip access-list extended ACL_5_GigabitEthernet0_2_OUT
 10 permit ip host 10.180.0.6 any
 20 permit ip host 10.181.0.3 any
 30 permit ip host 10.181.0.17 any
 40 permit ip host 10.181.0.20 any
 50 permit ip 10.181.0.16 0.0.0.1 any
 60 permit ip 10.181.0.2 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 0_as65002_0 (0)

 ip address 10.181.0.3 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 4_as65002_4 (4)

 ip address 10.181.0.17 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 32_as65004_32 (32)

 ip address 10.181.0.20 255.255.255.254

 ip access-group ACL_5_GigabitEthernet0_2_OUT out
 mtu 1500
!


ip route 10.200.37.0 255.255.255.0 Loopback100
ip route 10.200.38.0 255.255.255.0 Loopback101
ip route 10.200.39.0 255.255.255.0 Loopback102
ip route 10.200.40.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.6
 passive-interface Loopback0
 network 10.180.0.6 0.0.0.0 area 0



network 10.181.0.2 0.0.0.1 area 0
network 10.181.0.16 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_5 seq 10 permit 10.200.37.0/24
ip prefix-list PL_EXPORT_ALLOWED_5 seq 20 permit 10.200.38.0/24
ip prefix-list PL_EXPORT_ALLOWED_5 seq 30 permit 10.200.39.0/24
ip prefix-list PL_EXPORT_ALLOWED_5 seq 40 permit 10.200.40.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_5_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_5_1 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LINK_5_2 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LONG_5 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_5_0 seq 10 deny 10.180.0.6/32
!

ip prefix-list PL_IN_5_32 seq 10 permit 10.200.30.0/24
ip prefix-list PL_IN_5_32 seq 20 permit 10.181.0.80/31
ip prefix-list PL_IN_5_32 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_5_32 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_5_32 seq 10 permit 10.200.40.0/24
ip prefix-list PL_OUT_5_32 seq 20 permit 10.200.39.0/24
!






route-map RM_POLICY_IN_5_32 permit 10














 match ip address prefix-list PL_IN_5_32
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_5_32 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_5_32 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_5_0
 ! Block loopback 10.180.0.6/32


route-map RM_POLICY_OUT_5_32 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_5_32 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_5_32 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_5_2
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_5_32 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_5
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_5_32 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_5
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_5_32 deny 200














 match ip address prefix-list PL_OUT_5_32
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_5_32 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.6
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.6


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.1 peer-group RR



 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP



 !
 neighbor 10.181.0.21 peer-group EBGP
 neighbor 10.181.0.21 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.1 activate



  neighbor 10.180.0.3 activate
  neighbor 10.180.0.3 next-hop-self


  neighbor 10.180.0.23 activate
  neighbor 10.180.0.23 next-hop-self



  neighbor 10.181.0.21 activate
  neighbor 10.181.0.21 route-map RM_POLICY_IN_5_32 in
  neighbor 10.181.0.21 route-map RM_POLICY_OUT_5_32 out





  network 10.200.37.0 mask 255.255.255.0

  network 10.200.38.0 mask 255.255.255.0

  network 10.200.39.0 mask 255.255.255.0

  network 10.200.40.0 mask 255.255.255.0

 exit-address-family
