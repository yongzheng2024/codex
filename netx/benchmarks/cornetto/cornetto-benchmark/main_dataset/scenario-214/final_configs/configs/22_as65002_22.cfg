ip prefix-list PL_EXPORT_ALLOWED_22 seq 10 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_22 seq 20 permit 10.200.12.0/24
ip prefix-list PL_EXPORT_ALLOWED_22 seq 30 permit 10.200.13.0/24
ip prefix-list PL_EXPORT_ALLOWED_22 seq 40 permit 10.200.14.0/24
