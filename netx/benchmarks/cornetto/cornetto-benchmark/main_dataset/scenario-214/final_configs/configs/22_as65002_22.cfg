route-map RM_POLICY_IN_22_16 permit 10














 match ip address prefix-list PL_IN_22_16
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_22_16 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_22_16 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_22_0
 ! Block loopback 10.180.0.23/32


route-map RM_POLICY_OUT_22_16 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_0
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_22_16 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_1
 ! Block link 10.181.0.70/31


