  neighbor 10.181.0.60 route-map RM_POLICY_IN_22_16 in
  neighbor 10.181.0.60 route-map RM_POLICY_OUT_22_16 out





  network 10.200.11.0 mask 255.255.255.0

  network 10.200.12.0 mask 255.255.255.0

  network 10.200.13.0 mask 255.255.255.0

  network 10.200.14.0 mask 255.255.255.0

