
hostname 6_as65001_6
!
interface Loopback0
 ip address 10.180.0.7 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.41.0/24


 ip address 10.200.41.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.42.0/24


 ip address 10.200.42.1 255.255.255.0
!



ip access-list extended ACL_6_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.7 any
 20 permit ip host 10.181.0.7 any
 30 permit ip host 10.181.0.19 any
 40 permit ip host 10.181.0.22 any
 50 permit ip host 10.181.0.24 any
 60 permit ip 10.181.0.24 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 1_as65001_1 (1)

 ip address 10.181.0.7 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 4_as65002_4 (4)

 ip address 10.181.0.19 255.255.255.254

 ip access-group ACL_6_GigabitEthernet0_1_OUT out
