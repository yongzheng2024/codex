!
interface GigabitEthernet0/2
 description to 8_as65001_8 (8)

 ip address 10.181.0.22 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/3
 description to 7_as65001_7 (7)

 ip address 10.181.0.24 255.255.255.254








 ip router isis 1

 isis metric 10

