!


ip prefix-list PL_EXPORT_ALLOWED_6 seq 10 permit 10.200.41.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 20 permit 10.200.42.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_6_0 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_6_1 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_6_2 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_6_3 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LONG_6 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_6_0 seq 10 deny 10.180.0.7/32
!






route-map RM_POLICY_OUT_6_4 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_6_0
 ! Block loopback 10.180.0.7/32


route-map RM_POLICY_OUT_6_4 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_0
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_6_4 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_1
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_6_4 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_2
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_6_4 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_3
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_6_4 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_6
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_6_4 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_6
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_6_4 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.7
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.7


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.8 peer-group RR



 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP



 !
 neighbor 10.181.0.18 peer-group EBGP
 neighbor 10.181.0.18 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.8 activate



  neighbor 10.180.0.12 activate
  neighbor 10.180.0.12 next-hop-self


  neighbor 10.180.0.15 activate
  neighbor 10.180.0.15 next-hop-self


  neighbor 10.180.0.27 activate
  neighbor 10.180.0.27 next-hop-self



  neighbor 10.181.0.18 activate
  neighbor 10.181.0.18 route-map RM_POLICY_OUT_6_4 out





  network 10.200.41.0 mask 255.255.255.0

  network 10.200.42.0 mask 255.255.255.0

 exit-address-family
