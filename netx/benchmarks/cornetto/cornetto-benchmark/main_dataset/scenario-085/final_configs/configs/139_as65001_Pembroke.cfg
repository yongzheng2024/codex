
hostname 139_as65001_Pembroke
!
interface Loopback0
 ip address 10.180.0.140 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.36.0/24


 ip address 10.200.36.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.37.0/24


 ip address 10.200.37.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 138_as65007_Blitchton (138)

 ip address 10.181.1.93 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 140_as65001_Metter (140)

 ip address 10.181.1.94 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.36.0 255.255.255.0 Loopback100
ip route 10.200.37.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.140
 passive-interface Loopback0
 network 10.180.0.140 0.0.0.0 area 0



network 10.181.1.94 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_139 seq 10 permit 10.200.36.0/24
ip prefix-list PL_EXPORT_ALLOWED_139 seq 20 permit 10.200.37.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_139_0 seq 10 deny 10.181.1.92/31
!

ip prefix-list PL_EXPORT_DENY_LINK_139_1 seq 10 deny 10.181.1.94/31
!

ip prefix-list PL_EXPORT_DENY_LONG_139 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_139_0 seq 10 deny 10.180.0.140/32
!

ip prefix-list PL_IN_139_138 seq 10 permit 10.181.1.82/31
ip prefix-list PL_IN_139_138 seq 20 permit 10.200.34.0/24
ip prefix-list PL_IN_139_138 seq 30 permit 10.200.35.0/24
ip prefix-list PL_IN_139_138 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_139_138 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_139_138 seq 10 permit 10.200.37.0/24
ip prefix-list PL_OUT_139_138 seq 20 permit 10.200.36.0/24
!






route-map RM_POLICY_IN_139_138 permit 10














 match ip address prefix-list PL_IN_139_138
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_139_138 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_139_138 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_139_0
 ! Block loopback 10.180.0.140/32


route-map RM_POLICY_OUT_139_138 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_139_0
 ! Block link 10.181.1.92/31


route-map RM_POLICY_OUT_139_138 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_139_1
 ! Block link 10.181.1.94/31


route-map RM_POLICY_OUT_139_138 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_139
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_139_138 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_139
 set metric 20
 set as-path prepend 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_139_138 deny 200














 match ip address prefix-list PL_OUT_139_138
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_139_138 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.140
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.4 peer-group RR


 !
 neighbor 10.180.0.47 peer-group RR




 !
 neighbor 10.181.1.92 peer-group EBGP
 neighbor 10.181.1.92 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.4 activate


  neighbor 10.180.0.47 activate




  neighbor 10.181.1.92 activate
  neighbor 10.181.1.92 route-map RM_POLICY_IN_139_138 in
  neighbor 10.181.1.92 route-map RM_POLICY_OUT_139_138 out





  network 10.200.36.0 mask 255.255.255.0

  network 10.200.37.0 mask 255.255.255.0

 exit-address-family
