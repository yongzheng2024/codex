
hostname 32_as65010_Salisbury
!
interface Loopback0
 ip address 10.180.0.33 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.53.0/24


 ip address 10.200.53.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.54.0/24


 ip address 10.200.54.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.55.0/24


 ip address 10.200.55.1 255.255.255.0
!



ip access-list extended ACL_32_GigabitEthernet0_1
 10 permit ip host 10.180.0.36 any
 20 permit ip host 10.181.0.98 any
 30 permit ip host 10.181.0.99 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 33_as65010_Lexington (33)

 ip address 10.181.0.96 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 35_as65005_Concord (35)

 ip address 10.181.0.98 255.255.255.254

 ip access-group ACL_32_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.53.0 255.255.255.0 Loopback100
ip route 10.200.54.0 255.255.255.0 Loopback101
ip route 10.200.55.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.33
 passive-interface Loopback0
 network 10.180.0.33 0.0.0.0 area 0










 redistribute bgp 65010 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_32

network 10.181.0.96 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 10 permit 10.200.0.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 20 permit 10.200.1.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 30 permit 10.200.2.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 40 permit 10.200.11.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 50 permit 10.200.12.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 60 permit 10.200.62.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 70 permit 10.200.63.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 80 permit 10.200.64.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_32 seq 90 permit 10.200.65.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_32 seq 10 permit 10.180.0.33/32
ip prefix-list PL_BGP_TO_OSPF_DENY_32 seq 20 permit 10.181.0.96/31
ip prefix-list PL_BGP_TO_OSPF_DENY_32 seq 30 permit 10.181.0.98/31
!

ip prefix-list PL_EXPORT_ALLOWED_32 seq 10 permit 10.200.53.0/24
ip prefix-list PL_EXPORT_ALLOWED_32 seq 20 permit 10.200.54.0/24
ip prefix-list PL_EXPORT_ALLOWED_32 seq 30 permit 10.200.55.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_32_0 seq 10 deny 10.181.0.96/31
!

ip prefix-list PL_EXPORT_DENY_LINK_32_1 seq 10 deny 10.181.0.98/31
!

ip prefix-list PL_EXPORT_DENY_LONG_32 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_32_0 seq 10 deny 10.180.0.33/32
!






route-map RM_BGP_TO_OSPF_32 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_32 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_32
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_32 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_32
 set tag 65010

!


route-map RM_POLICY_OUT_32_35 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_32_0
 ! Block loopback 10.180.0.33/32


route-map RM_POLICY_OUT_32_35 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_0
 ! Block link 10.181.0.96/31


route-map RM_POLICY_OUT_32_35 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_1
 ! Block link 10.181.0.98/31


route-map RM_POLICY_OUT_32_35 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_32
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_32_35 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_32
 set community no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_32_35 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.33
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65010
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.34 peer-group IBGP


 !
 neighbor 10.180.0.37 peer-group IBGP


 !
 neighbor 10.180.0.38 peer-group IBGP


 !
 neighbor 10.180.0.39 peer-group IBGP


 !
 neighbor 10.180.0.40 peer-group IBGP


 !
 neighbor 10.180.0.84 peer-group IBGP



 !
 neighbor 10.181.0.99 peer-group EBGP
 neighbor 10.181.0.99 remote-as 65005


 !
 address-family ipv4


  neighbor 10.180.0.34 activate


  neighbor 10.180.0.37 activate


  neighbor 10.180.0.38 activate


  neighbor 10.180.0.39 activate


  neighbor 10.180.0.40 activate


  neighbor 10.180.0.84 activate



  neighbor 10.181.0.99 activate
  neighbor 10.181.0.99 route-map RM_POLICY_OUT_32_35 out





  network 10.200.53.0 mask 255.255.255.0

  network 10.200.54.0 mask 255.255.255.0

  network 10.200.55.0 mask 255.255.255.0

 exit-address-family
