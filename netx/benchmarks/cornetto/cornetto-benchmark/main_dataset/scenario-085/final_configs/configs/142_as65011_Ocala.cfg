ip prefix-list PL_BGP_TO_OSPF_ALLOW_142 seq 90 permit 10.200.83.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_142 seq 100 permit 10.200.84.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_142 seq 110 permit 10.200.85.0/24
