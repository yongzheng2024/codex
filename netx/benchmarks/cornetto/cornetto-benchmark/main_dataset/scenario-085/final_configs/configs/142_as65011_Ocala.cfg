ip prefix-list PL_OUT_142_157 seq 10 permit 10.200.39.0/24
!






route-map RM_BGP_TO_OSPF_142 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_142 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_142
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_142 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_142
 set tag 65010

!


route-map RM_POLICY_IN_142_157 permit 10














 match ip address prefix-list PL_IN_142_157
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_142_157 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_142_157 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_142_0
 ! Block loopback 10.180.0.143/32


route-map RM_POLICY_OUT_142_157 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_142_0
 ! Block link 10.181.1.100/31


