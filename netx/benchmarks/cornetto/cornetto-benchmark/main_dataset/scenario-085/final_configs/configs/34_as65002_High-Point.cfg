
hostname 34_as65002_High-Point
!
interface Loopback0
 ip address 10.180.0.35 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.60.0/24


 ip address 10.200.60.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.61.0/24


 ip address 10.200.61.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 31_as65002_Kernersville (31)

 ip address 10.181.0.93 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 33_as65010_Lexington (33)

 ip address 10.181.0.101 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 84_as65002_None (84)

 ip address 10.181.0.106 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.60.0 255.255.255.0 Loopback100
ip route 10.200.61.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.35
 passive-interface Loopback0
 network 10.180.0.35 0.0.0.0 area 0



network 10.181.0.92 0.0.0.1 area 0
network 10.181.0.100 0.0.0.1 area 0
network 10.181.0.106 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_34 seq 10 permit 10.200.60.0/24
ip prefix-list PL_EXPORT_ALLOWED_34 seq 20 permit 10.200.61.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_34_0 seq 10 deny 10.181.0.100/31
!

ip prefix-list PL_EXPORT_DENY_LINK_34_1 seq 10 deny 10.181.0.106/31
!

ip prefix-list PL_EXPORT_DENY_LINK_34_2 seq 10 deny 10.181.0.92/31
!

ip prefix-list PL_EXPORT_DENY_LONG_34 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_34_0 seq 10 deny 10.180.0.35/32
!

ip prefix-list PL_IN_34_33 seq 10 permit 10.200.57.0/24
ip prefix-list PL_IN_34_33 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_34_33 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_34_33 seq 10 permit 10.200.61.0/24
!






route-map RM_POLICY_IN_34_33 permit 10














 match ip address prefix-list PL_IN_34_33
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_34_33 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_34_33 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_34_0
 ! Block loopback 10.180.0.35/32


route-map RM_POLICY_OUT_34_33 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_0
 ! Block link 10.181.0.100/31


route-map RM_POLICY_OUT_34_33 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_1
 ! Block link 10.181.0.106/31


route-map RM_POLICY_OUT_34_33 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_34_2
 ! Block link 10.181.0.92/31


route-map RM_POLICY_OUT_34_33 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_34
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_34_33 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_34
 set metric 6
 set as-path prepend 65002
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_34_33 deny 200














 match ip address prefix-list PL_OUT_34_33
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_34_33 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.35
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.51 peer-group RR




 !
 neighbor 10.181.0.100 peer-group EBGP
 neighbor 10.181.0.100 remote-as 65010


 !
 address-family ipv4

  neighbor 10.180.0.51 activate




  neighbor 10.181.0.100 activate
  neighbor 10.181.0.100 route-map RM_POLICY_IN_34_33 in
  neighbor 10.181.0.100 route-map RM_POLICY_OUT_34_33 out





  network 10.200.60.0 mask 255.255.255.0

  network 10.200.61.0 mask 255.255.255.0

 exit-address-family
