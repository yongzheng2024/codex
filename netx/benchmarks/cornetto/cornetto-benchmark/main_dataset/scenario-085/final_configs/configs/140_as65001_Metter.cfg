
hostname 140_as65001_Metter
!
interface Loopback0
 ip address 10.180.0.141 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 139_as65001_Pembroke (139)

 ip address 10.181.1.95 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 141_as65001_Rentz (141)

 ip address 10.181.1.96 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


router ospf 1
 router-id 10.180.0.141
 passive-interface Loopback0
 network 10.180.0.141 0.0.0.0 area 0



network 10.181.1.94 0.0.0.1 area 0
network 10.181.1.96 0.0.0.1 area 0
!








router bgp 65001
 bgp router-id 10.180.0.141
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.4 peer-group RR


 !
 neighbor 10.180.0.47 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.4 activate


  neighbor 10.180.0.47 activate







 exit-address-family
