route-map RM_POLICY_IN_21_20 permit 10














 match ip address prefix-list PL_IN_21_20
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_21_20 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_21_20 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_21_0
 ! Block loopback 10.180.0.22/32


route-map RM_POLICY_OUT_21_20 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_0
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_21_20 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_1
 ! Block link 10.181.0.64/31


route-map RM_POLICY_OUT_21_20 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_21
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_21_20 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_21
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_21_20 deny 200














 match ip address prefix-list PL_OUT_21_20
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_21_20 deny 65000














 ! Deny other outbound routes

!







