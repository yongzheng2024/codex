route-map RM_BGP_TO_OSPF_53 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_53 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_53
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_53 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_53
 set tag 65010

!


route-map RM_POLICY_OUT_53_83 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_53_0
 ! Block loopback 10.180.0.54/32


route-map RM_POLICY_OUT_53_83 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_53_0
 ! Block link 10.181.0.152/31


route-map RM_POLICY_OUT_53_83 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_53_1
