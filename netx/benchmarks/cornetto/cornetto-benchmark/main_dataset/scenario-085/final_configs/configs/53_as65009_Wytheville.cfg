 ! Block link 10.181.0.158/31


route-map RM_POLICY_OUT_53_83 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_53
 set community 65000:200 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_53_83 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_53
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_53_83 deny 65000














 ! Deny other outbound routes

!







