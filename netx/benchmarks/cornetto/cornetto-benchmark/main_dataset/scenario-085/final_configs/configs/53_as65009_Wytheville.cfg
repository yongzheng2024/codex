ip prefix-list PL_BGP_TO_OSPF_ALLOW_53 seq 80 permit 10.200.93.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_53 seq 90 permit 10.200.94.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_53 seq 100 permit 10.200.95.0/24
