 redistribute bgp 65009 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_53

network 10.181.0.152 0.0.0.1 area 0
network 10.181.0.154 0.0.0.1 area 0
network 10.181.0.158 0.0.0.1 area 0
