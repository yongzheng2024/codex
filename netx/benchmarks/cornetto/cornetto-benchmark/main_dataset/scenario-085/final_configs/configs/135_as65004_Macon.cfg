ip route 10.200.27.0 255.255.255.0 Loopback101
ip route 10.200.28.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.136
 passive-interface Loopback0
 network 10.180.0.136 0.0.0.0 area 0










 redistribute bgp 65004 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_135

network 10.181.0.140 0.0.0.1 area 0
network 10.181.0.222 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_135 seq 10 permit 10.200.19.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_135 seq 20 permit 10.200.20.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_135 seq 30 permit 10.200.21.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_135 seq 40 permit 10.200.29.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_135 seq 50 permit 10.200.30.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_135 seq 60 permit 10.200.31.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_135 seq 70 permit 10.200.32.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_135 seq 80 permit 10.200.36.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_135 seq 90 permit 10.200.37.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_135 seq 100 permit 10.200.73.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_135 seq 110 permit 10.200.74.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_135 seq 120 permit 10.200.75.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_135 seq 10 permit 10.180.0.136/32
ip prefix-list PL_BGP_TO_OSPF_DENY_135 seq 20 permit 10.181.0.140/31
ip prefix-list PL_BGP_TO_OSPF_DENY_135 seq 30 permit 10.181.0.222/31
ip prefix-list PL_BGP_TO_OSPF_DENY_135 seq 40 permit 10.181.1.90/31
!

ip prefix-list PL_EXPORT_ALLOWED_135 seq 10 permit 10.200.26.0/24
ip prefix-list PL_EXPORT_ALLOWED_135 seq 20 permit 10.200.27.0/24
ip prefix-list PL_EXPORT_ALLOWED_135 seq 30 permit 10.200.28.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_135_0 seq 10 deny 10.181.0.140/31
!

ip prefix-list PL_EXPORT_DENY_LINK_135_1 seq 10 deny 10.181.0.222/31
!

ip prefix-list PL_EXPORT_DENY_LINK_135_2 seq 10 deny 10.181.1.90/31
!

ip prefix-list PL_EXPORT_DENY_LONG_135 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_135_0 seq 10 deny 10.180.0.136/32
!

ip prefix-list PL_IN_135_136 seq 10 permit 10.200.29.0/24
ip prefix-list PL_IN_135_136 seq 20 permit 10.200.31.0/24
ip prefix-list PL_IN_135_136 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_135_136 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_135_136 seq 10 permit 10.200.28.0/24
ip prefix-list PL_OUT_135_136 seq 20 permit 10.200.27.0/24
!






route-map RM_BGP_TO_OSPF_135 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_135 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_135
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_135 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_135
 set tag 65010

!


route-map RM_POLICY_IN_135_136 permit 10














 match ip address prefix-list PL_IN_135_136
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_135_136 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_135_136 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_135_0
 ! Block loopback 10.180.0.136/32


route-map RM_POLICY_OUT_135_136 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_135_0
 ! Block link 10.181.0.140/31


route-map RM_POLICY_OUT_135_136 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_135_1
 ! Block link 10.181.0.222/31


route-map RM_POLICY_OUT_135_136 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_135_2
 ! Block link 10.181.1.90/31


route-map RM_POLICY_OUT_135_136 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_135
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_135_136 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_135
 set metric 16
 set as-path prepend 65004
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_135_136 deny 200














 match ip address prefix-list PL_OUT_135_136
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_135_136 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.136
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.78 peer-group RR




 !
 neighbor 10.181.1.91 peer-group EBGP
 neighbor 10.181.1.91 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.78 activate




  neighbor 10.181.1.91 activate
  neighbor 10.181.1.91 route-map RM_POLICY_IN_135_136 in
  neighbor 10.181.1.91 route-map RM_POLICY_OUT_135_136 out





  network 10.200.26.0 mask 255.255.255.0

  network 10.200.27.0 mask 255.255.255.0

  network 10.200.28.0 mask 255.255.255.0

 exit-address-family
