
hostname 30_as65002_Greensboro
!
interface Loopback0
 ip address 10.180.0.31 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.50.0/24


 ip address 10.200.50.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.51.0/24


 ip address 10.200.51.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.52.0/24


 ip address 10.200.52.1 255.255.255.0
!



ip access-list extended ACL_30_GigabitEthernet0_0
 10 permit ip host 10.180.0.13 any
 20 permit ip host 10.181.0.48 any
 30 permit ip host 10.181.0.49 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 12_as65003_Burlington (12)

 ip address 10.181.0.49 255.255.255.254

 ip access-group ACL_30_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 84_as65002_None (84)

 ip address 10.181.0.88 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 131_as65002_Danville (131)

 ip address 10.181.0.90 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.50.0 255.255.255.0 Loopback100
ip route 10.200.51.0 255.255.255.0 Loopback101
ip route 10.200.52.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.31
 passive-interface Loopback0
 network 10.180.0.31 0.0.0.0 area 0



network 10.181.0.88 0.0.0.1 area 0
network 10.181.0.90 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_30 seq 10 permit 10.200.50.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 20 permit 10.200.51.0/24
ip prefix-list PL_EXPORT_ALLOWED_30 seq 30 permit 10.200.52.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_30_0 seq 10 deny 10.181.0.48/31
!

ip prefix-list PL_EXPORT_DENY_LINK_30_1 seq 10 deny 10.181.0.88/31
!

ip prefix-list PL_EXPORT_DENY_LINK_30_2 seq 10 deny 10.181.0.90/31
!

ip prefix-list PL_EXPORT_DENY_LONG_30 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_30_0 seq 10 deny 10.180.0.31/32
!






route-map RM_POLICY_OUT_30_12 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_30_0
 ! Block loopback 10.180.0.31/32


route-map RM_POLICY_OUT_30_12 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_0
 ! Block link 10.181.0.48/31


route-map RM_POLICY_OUT_30_12 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_1
 ! Block link 10.181.0.88/31


route-map RM_POLICY_OUT_30_12 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_30_2
 ! Block link 10.181.0.90/31


route-map RM_POLICY_OUT_30_12 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_30
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_30_12 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_30
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_30_12 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.31
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.51 peer-group RR




 !
 neighbor 10.181.0.48 peer-group EBGP
 neighbor 10.181.0.48 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.51 activate




  neighbor 10.181.0.48 activate
  neighbor 10.181.0.48 route-map RM_POLICY_OUT_30_12 out





  network 10.200.50.0 mask 255.255.255.0

  network 10.200.51.0 mask 255.255.255.0

  network 10.200.52.0 mask 255.255.255.0

 exit-address-family
