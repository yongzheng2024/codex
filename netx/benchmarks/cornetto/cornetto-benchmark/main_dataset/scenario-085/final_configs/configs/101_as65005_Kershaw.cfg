ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 100 permit 10.200.90.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 110 permit 10.200.91.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 120 permit 10.200.92.0/24
