ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.102
 passive-interface Loopback0
 network 10.180.0.102 0.0.0.0 area 0










 redistribute bgp 65005 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_101

network 10.181.1.24 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 10 permit 10.200.6.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_101 seq 20 permit 10.200.7.0/24
