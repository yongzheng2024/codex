 redistribute bgp 65001 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_6

network 10.181.0.16 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 10 permit 10.200.26.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 20 permit 10.200.27.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 30 permit 10.200.28.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 40 permit 10.200.42.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 50 permit 10.200.43.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 60 permit 10.200.44.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 70 permit 10.200.45.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 80 permit 10.200.46.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 90 permit 10.200.83.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 100 permit 10.200.84.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_6 seq 110 permit 10.200.85.0/24
