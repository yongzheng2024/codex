ip prefix-list PL_BGP_TO_OSPF_DENY_6 seq 10 permit 10.180.0.7/32
ip prefix-list PL_BGP_TO_OSPF_DENY_6 seq 20 permit 10.181.0.16/31
ip prefix-list PL_BGP_TO_OSPF_DENY_6 seq 30 permit 10.181.0.18/31
!

ip prefix-list PL_EXPORT_ALLOWED_6 seq 10 permit 10.200.73.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 20 permit 10.200.74.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 30 permit 10.200.75.0/24
