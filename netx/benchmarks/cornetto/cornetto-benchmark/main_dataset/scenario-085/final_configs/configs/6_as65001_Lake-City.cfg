 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.47 peer-group RR




 !
 neighbor 10.181.0.19 peer-group EBGP
 neighbor 10.181.0.19 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.47 activate




  neighbor 10.181.0.19 activate
  neighbor 10.181.0.19 route-map RM_POLICY_IN_6_157 in
  neighbor 10.181.0.19 route-map RM_POLICY_OUT_6_157 out





  network 10.200.73.0 mask 255.255.255.0

  network 10.200.74.0 mask 255.255.255.0

  network 10.200.75.0 mask 255.255.255.0

 exit-address-family
