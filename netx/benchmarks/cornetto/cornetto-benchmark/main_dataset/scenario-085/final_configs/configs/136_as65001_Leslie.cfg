  neighbor 10.180.0.4 activate


  neighbor 10.180.0.47 activate




  neighbor 10.181.1.90 activate
  neighbor 10.181.1.90 route-map RM_POLICY_IN_136_135 in
  neighbor 10.181.1.90 route-map RM_POLICY_OUT_136_135 out





  network 10.200.29.0 mask 255.255.255.0

  network 10.200.30.0 mask 255.255.255.0

  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

