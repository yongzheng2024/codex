network 10.181.1.84 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_136 seq 10 permit 10.200.29.0/24
ip prefix-list PL_EXPORT_ALLOWED_136 seq 20 permit 10.200.30.0/24
ip prefix-list PL_EXPORT_ALLOWED_136 seq 30 permit 10.200.31.0/24
ip prefix-list PL_EXPORT_ALLOWED_136 seq 40 permit 10.200.32.0/24
