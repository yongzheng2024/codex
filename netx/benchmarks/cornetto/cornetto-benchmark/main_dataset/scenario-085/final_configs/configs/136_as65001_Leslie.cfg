ip prefix-list PL_OUT_136_135 seq 10 permit 10.200.32.0/24
!






route-map RM_POLICY_IN_136_135 permit 10














 match ip address prefix-list PL_IN_136_135
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_136_135 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_136_135 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_136_0
 ! Block loopback 10.180.0.137/32


route-map RM_POLICY_OUT_136_135 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_136_0
 ! Block link 10.181.1.84/31


route-map RM_POLICY_OUT_136_135 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_136_1
 ! Block link 10.181.1.90/31


route-map RM_POLICY_OUT_136_135 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_136
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_136_135 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_136
 set metric 5
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_136_135 deny 200














 match ip address prefix-list PL_OUT_136_135
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_136_135 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.137
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.4 peer-group RR


 !
 neighbor 10.180.0.47 peer-group RR




 !
 neighbor 10.181.1.90 peer-group EBGP
 neighbor 10.181.1.90 remote-as 65004


 !
