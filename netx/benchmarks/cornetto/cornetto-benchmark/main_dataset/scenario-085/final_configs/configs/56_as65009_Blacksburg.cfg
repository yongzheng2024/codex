
hostname 56_as65009_Blacksburg
!
interface Loopback0
 ip address 10.180.0.57 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.68.0/24


 ip address 10.200.68.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.69.0/24


 ip address 10.200.69.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.70.0/24


 ip address 10.200.70.1 255.255.255.0
!



ip access-list extended ACL_56_GigabitEthernet0_0
 10 permit ip host 10.180.0.58 any
 20 permit ip host 10.181.0.162 any
 30 permit ip host 10.181.0.163 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 192.0.2.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 57_as65002_Troutville (57)

 ip address 10.181.0.162 255.255.255.254

 ip access-group ACL_56_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 59_as65009_Christiansburg (59)

 ip address 10.181.0.164 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.68.0 255.255.255.0 Loopback100
ip route 10.200.69.0 255.255.255.0 Loopback101
ip route 10.200.70.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.57
 passive-interface Loopback0
 network 10.180.0.57 0.0.0.0 area 0










 redistribute bgp 65009 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_56

network 10.181.0.164 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 10 permit 10.200.17.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 20 permit 10.200.18.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 30 permit 10.200.50.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 40 permit 10.200.51.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 50 permit 10.200.52.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 60 permit 10.200.60.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 70 permit 10.200.61.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 80 permit 10.200.71.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_56 seq 90 permit 10.200.72.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_56 seq 10 permit 10.180.0.57/32
ip prefix-list PL_BGP_TO_OSPF_DENY_56 seq 20 permit 10.181.0.162/31
ip prefix-list PL_BGP_TO_OSPF_DENY_56 seq 30 permit 10.181.0.164/31
!

ip prefix-list PL_EXPORT_ALLOWED_56 seq 10 permit 10.200.68.0/24
ip prefix-list PL_EXPORT_ALLOWED_56 seq 20 permit 10.200.69.0/24
ip prefix-list PL_EXPORT_ALLOWED_56 seq 30 permit 10.200.70.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_56_0 seq 10 deny 10.181.0.162/31
!

ip prefix-list PL_EXPORT_DENY_LINK_56_1 seq 10 deny 10.181.0.164/31
!

ip prefix-list PL_EXPORT_DENY_LONG_56 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_56_0 seq 10 deny 10.180.0.57/32
!




ip community-list standard CL_COMM_56_57 permit 65535:65282
ip community-list standard CL_COMM_56_57 permit no-advertise
!





route-map RM_BGP_TO_OSPF_56 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_56 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_56
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_56 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_56
 set tag 65010

!


route-map RM_POLICY_IN_56_57 permit 5














 match community CL_COMM_56_57
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_56_57 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_56_57 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_56_57 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_56_0
 ! Block loopback 10.180.0.57/32


route-map RM_POLICY_OUT_56_57 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_0
 ! Block link 10.181.0.162/31


route-map RM_POLICY_OUT_56_57 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_56_1
 ! Block link 10.181.0.164/31


route-map RM_POLICY_OUT_56_57 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_56
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_56_57 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_56
 set metric 10
 set as-path prepend 65009 65009
 set community no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_56_57 deny 65000














 ! Deny other outbound routes

!







router bgp 65009
 bgp router-id 10.180.0.57
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65009
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.23 peer-group RR




 !
 neighbor 10.181.0.163 peer-group EBGP
 neighbor 10.181.0.163 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.23 activate




  neighbor 10.181.0.163 activate
  neighbor 10.181.0.163 route-map RM_POLICY_IN_56_57 in
  neighbor 10.181.0.163 route-map RM_POLICY_OUT_56_57 out





  network 10.200.68.0 mask 255.255.255.0

  network 10.200.69.0 mask 255.255.255.0

  network 10.200.70.0 mask 255.255.255.0

 exit-address-family
