 set tag 65010

!


route-map RM_POLICY_IN_82_105 permit 10














 match ip address prefix-list PL_IN_82_105
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_82_105 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_82_105 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_82_0
 ! Block loopback 10.180.0.83/32


route-map RM_POLICY_OUT_82_105 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_0
 ! Block link 10.181.0.240/31


route-map RM_POLICY_OUT_82_105 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_1
 ! Block link 10.181.0.242/31


