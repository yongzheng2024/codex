ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 40 permit 10.200.22.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 50 permit 10.200.23.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 60 permit 10.200.24.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 70 permit 10.200.25.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 80 permit 10.200.33.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 90 permit 10.200.34.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_82 seq 100 permit 10.200.35.0/24
