
hostname 17_as65006_17
!
interface Loopback0
 ip address 10.180.0.18 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!



ip access-list extended ACL_17_GigabitEthernet0_1_OUT
 10 permit ip host 10.180.0.18 any
 20 permit ip host 10.181.0.74 any
 30 permit ip host 10.181.0.76 any
 40 permit ip 10.181.0.74 0.0.0.1 any
 50 permit ip 10.181.0.76 0.0.0.1 any
 60 deny ip 198.18.0.0 0.1.255.255 any
