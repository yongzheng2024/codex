ip prefix-list PL_IN_17_54 seq 10 permit 10.200.46.0/24
ip prefix-list PL_IN_17_54 seq 20 permit 10.200.48.0/24
ip prefix-list PL_IN_17_54 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_17_54 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_17_54 seq 10 permit 10.200.5.0/24
!




ip community-list standard CL_COMM_17_54 permit 65535:65282
ip community-list standard CL_COMM_17_54 permit no-advertise
!





route-map RM_POLICY_IN_17_54 permit 5














 match community CL_COMM_17_54
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_17_54 permit 10














 match ip address prefix-list PL_IN_17_54
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_17_54 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_17_54 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_17_54 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_17_0
 ! Block loopback 10.180.0.18/32


route-map RM_POLICY_OUT_17_54 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_0
 ! Block link 10.181.0.74/31


route-map RM_POLICY_OUT_17_54 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_17_1
 ! Block link 10.181.0.76/31


route-map RM_POLICY_OUT_17_54 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_17
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_17_54 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_17
 set community 65000:100 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_17_54 deny 200














 match ip address prefix-list PL_OUT_17_54
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_17_54 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.18
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



