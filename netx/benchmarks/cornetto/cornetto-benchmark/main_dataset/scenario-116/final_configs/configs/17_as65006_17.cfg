 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.31 peer-group IBGP


 !
 neighbor 10.180.0.32 peer-group IBGP


 !
 neighbor 10.180.0.33 peer-group IBGP


 !
 neighbor 10.180.0.35 peer-group IBGP



 !
 neighbor 10.181.0.77 peer-group EBGP
 neighbor 10.181.0.77 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.31 activate


  neighbor 10.180.0.32 activate


  neighbor 10.180.0.33 activate


  neighbor 10.180.0.35 activate



  neighbor 10.181.0.77 activate
  neighbor 10.181.0.77 route-map RM_POLICY_IN_17_54 in
  neighbor 10.181.0.77 route-map RM_POLICY_OUT_17_54 out





