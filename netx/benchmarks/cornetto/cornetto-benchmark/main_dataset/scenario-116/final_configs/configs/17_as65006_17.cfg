!
interface GigabitEthernet0/1
 description to 54_as65001_54 (54)

 ip address 10.181.0.76 255.255.255.254

 ip access-group ACL_17_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.4.0 255.255.255.0 Loopback100
ip route 10.200.5.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.18
 passive-interface Loopback0
 network 10.180.0.18 0.0.0.0 area 0



network 10.181.0.74 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_17 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_17 seq 20 permit 10.200.5.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_17_0 seq 10 deny 10.181.0.74/31
