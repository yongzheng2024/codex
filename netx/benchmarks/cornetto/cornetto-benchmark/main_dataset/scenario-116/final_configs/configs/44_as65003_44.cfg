 address-family ipv4

  neighbor 10.180.0.15 activate




  neighbor 10.181.0.32 activate
  neighbor 10.181.0.32 route-map RM_POLICY_OUT_44_10 out





  network 10.200.36.0 mask 255.255.255.0

  network 10.200.37.0 mask 255.255.255.0

  network 10.200.38.0 mask 255.255.255.0

