route-map RM_POLICY_OUT_44_10 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_44
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_44_10 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.45
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.15 peer-group RR




 !
 neighbor 10.181.0.32 peer-group EBGP
 neighbor 10.181.0.32 remote-as 65002


