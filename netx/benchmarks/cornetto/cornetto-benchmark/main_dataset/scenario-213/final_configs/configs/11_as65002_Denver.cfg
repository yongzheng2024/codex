
hostname 11_as65002_Denver
!
interface Loopback0
 ip address 10.180.0.12 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.3.0/24


 ip address 10.200.3.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 10_as65002_Kansas-City (10)

 ip address 10.181.0.29 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 32_as65005_San-Francisco (32)

 ip address 10.181.0.32 255.255.255.254
 mtu 1500
!


ip route 10.200.3.0 255.255.255.0 Loopback100
ip route 10.200.4.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.12
 passive-interface Loopback0
 network 10.180.0.12 0.0.0.0 area 0



network 10.181.0.28 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_11 seq 10 permit 10.200.3.0/24
ip prefix-list PL_EXPORT_ALLOWED_11 seq 20 permit 10.200.4.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_11_0 seq 10 deny 10.181.0.28/31
!

ip prefix-list PL_EXPORT_DENY_LINK_11_1 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LONG_11 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_11_0 seq 10 deny 10.180.0.12/32
!

ip prefix-list PL_IN_11_32 seq 10 permit 10.181.0.74/31
ip prefix-list PL_IN_11_32 seq 20 permit 10.181.0.32/31
ip prefix-list PL_IN_11_32 seq 30 permit 10.181.0.58/31
ip prefix-list PL_IN_11_32 seq 40 permit 10.180.0.33/32
ip prefix-list PL_IN_11_32 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_11_32 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_11_32 seq 10 permit 10.200.3.0/24
ip prefix-list PL_OUT_11_32 seq 20 permit 10.200.4.0/24
!






route-map RM_POLICY_IN_11_32 permit 10














 match ip address prefix-list PL_IN_11_32
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_11_32 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_11_32 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_11_0
 ! Block loopback 10.180.0.12/32


route-map RM_POLICY_OUT_11_32 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_0
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_11_32 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_1
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_11_32 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_11
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_11_32 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_11
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_11_32 deny 200














 match ip address prefix-list PL_OUT_11_32
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_11_32 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.12
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.14 peer-group RR




 !
 neighbor 10.181.0.33 peer-group EBGP
 neighbor 10.181.0.33 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.14 activate




  neighbor 10.181.0.33 activate
  neighbor 10.181.0.33 route-map RM_POLICY_IN_11_32 in
  neighbor 10.181.0.33 route-map RM_POLICY_OUT_11_32 out





  network 10.200.3.0 mask 255.255.255.0

  network 10.200.4.0 mask 255.255.255.0

 exit-address-family
