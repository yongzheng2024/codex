
hostname 23_as65003_San-Jose
!
interface Loopback0
 ip address 10.180.0.24 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.14.0/24


 ip address 10.200.14.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.15.0/24


 ip address 10.200.15.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.16.0/24


 ip address 10.200.16.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 24_as65003_Los-Angeles (24)

 ip address 10.181.0.56 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 32_as65005_San-Francisco (32)

 ip address 10.181.0.58 255.255.255.254
 mtu 1500
!


ip route 10.200.14.0 255.255.255.0 Loopback100
ip route 10.200.15.0 255.255.255.0 Loopback101
ip route 10.200.16.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.24
 passive-interface Loopback0
 network 10.180.0.24 0.0.0.0 area 0



network 10.181.0.56 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_23 seq 10 permit 10.200.14.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 20 permit 10.200.15.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 30 permit 10.200.16.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_23_0 seq 10 deny 10.181.0.56/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_1 seq 10 deny 10.181.0.58/31
!

ip prefix-list PL_EXPORT_DENY_LONG_23 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_23_0 seq 10 deny 10.180.0.24/32
!

ip prefix-list PL_IN_23_32 seq 10 permit 10.200.25.0/24
ip prefix-list PL_IN_23_32 seq 20 permit 10.181.0.58/31
ip prefix-list PL_IN_23_32 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_23_32 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_23_32 seq 10 permit 10.200.15.0/24
ip prefix-list PL_OUT_23_32 seq 20 permit 10.200.16.0/24
!






route-map RM_POLICY_IN_23_32 permit 10














 match ip address prefix-list PL_IN_23_32
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_23_32 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_23_32 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_23_0
 ! Block loopback 10.180.0.24/32


route-map RM_POLICY_OUT_23_32 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_0
 ! Block link 10.181.0.56/31


route-map RM_POLICY_OUT_23_32 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_1
 ! Block link 10.181.0.58/31


route-map RM_POLICY_OUT_23_32 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_23
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_23_32 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_23
 set community 65000:200 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_23_32 deny 200














 match ip address prefix-list PL_OUT_23_32
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_23_32 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.24
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.2 peer-group RR




 !
 neighbor 10.181.0.59 peer-group EBGP
 neighbor 10.181.0.59 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.2 activate




  neighbor 10.181.0.59 activate
  neighbor 10.181.0.59 route-map RM_POLICY_IN_23_32 in
  neighbor 10.181.0.59 route-map RM_POLICY_OUT_23_32 out





  network 10.200.14.0 mask 255.255.255.0

  network 10.200.15.0 mask 255.255.255.0

  network 10.200.16.0 mask 255.255.255.0

 exit-address-family
