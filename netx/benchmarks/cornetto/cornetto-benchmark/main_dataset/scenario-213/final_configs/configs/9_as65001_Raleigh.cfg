
hostname 9_as65001_Raleigh
!
interface Loopback0
 ip address 10.180.0.10 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.33.0/24


 ip address 10.200.33.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.34.0/24


 ip address 10.200.34.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.35.0/24


 ip address 10.200.35.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 8_as65004_Atlanta (8)

 ip address 10.181.0.23 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 18_as65001_Washington--DC (18)

 ip address 10.181.0.26 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.33.0 255.255.255.0 Loopback100
ip route 10.200.34.0 255.255.255.0 Loopback101
ip route 10.200.35.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.10
 passive-interface Loopback0
 network 10.180.0.10 0.0.0.0 area 0



network 10.181.0.26 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_9 seq 10 permit 10.200.33.0/24
ip prefix-list PL_EXPORT_ALLOWED_9 seq 20 permit 10.200.34.0/24
ip prefix-list PL_EXPORT_ALLOWED_9 seq 30 permit 10.200.35.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_9_0 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_9_1 seq 10 deny 10.181.0.26/31
!

ip prefix-list PL_EXPORT_DENY_LONG_9 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_9_0 seq 10 deny 10.180.0.10/32
!

ip prefix-list PL_IN_9_8 seq 10 permit 10.181.0.24/31
ip prefix-list PL_IN_9_8 seq 20 permit 10.181.0.22/31
ip prefix-list PL_IN_9_8 seq 30 permit 10.181.0.16/31
ip prefix-list PL_IN_9_8 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_9_8 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_9_8 seq 10 permit 10.200.35.0/24
!






route-map RM_POLICY_IN_9_8 permit 10














 match ip address prefix-list PL_IN_9_8
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_9_8 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_9_8 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_9_0
 ! Block loopback 10.180.0.10/32


route-map RM_POLICY_OUT_9_8 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_9_0
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_9_8 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_9_1
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_9_8 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_9
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_9_8 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_9
 set metric 16
 set as-path prepend 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_9_8 deny 200














 match ip address prefix-list PL_OUT_9_8
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_9_8 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.10
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP



 !
 neighbor 10.181.0.22 peer-group EBGP
 neighbor 10.181.0.22 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.22 activate


  neighbor 10.180.0.23 activate



  neighbor 10.181.0.22 activate
  neighbor 10.181.0.22 route-map RM_POLICY_IN_9_8 in
  neighbor 10.181.0.22 route-map RM_POLICY_OUT_9_8 out





  network 10.200.33.0 mask 255.255.255.0

  network 10.200.34.0 mask 255.255.255.0

  network 10.200.35.0 mask 255.255.255.0

 exit-address-family
