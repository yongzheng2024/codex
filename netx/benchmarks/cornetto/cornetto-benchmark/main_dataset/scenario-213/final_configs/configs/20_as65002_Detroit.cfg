
hostname 20_as65002_Detroit
!
interface Loopback0
 ip address 10.180.0.21 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!



ip access-list extended ACL_20_GigabitEthernet0_1
 10 permit ip host 10.180.0.22 any
 20 permit ip host 10.181.0.52 any
 30 permit ip host 10.181.0.53 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 19_as65002_Chicago (19)

 ip address 10.181.0.51 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 21_as65001_Cleveland (21)

 ip address 10.181.0.52 255.255.255.254

 ip access-group ACL_20_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.9.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.21
 passive-interface Loopback0
 network 10.180.0.21 0.0.0.0 area 0



network 10.181.0.50 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_20 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_20 seq 20 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_20_0 seq 10 deny 10.181.0.50/31
!

ip prefix-list PL_EXPORT_DENY_LINK_20_1 seq 10 deny 10.181.0.52/31
!

ip prefix-list PL_EXPORT_DENY_LONG_20 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_20_0 seq 10 deny 10.180.0.21/32
!




ip community-list standard CL_COMM_20_21 permit no-advertise
!





route-map RM_POLICY_IN_20_21 permit 5














 match community CL_COMM_20_21
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_20_21 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_20_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_20_0
 ! Block loopback 10.180.0.21/32


route-map RM_POLICY_OUT_20_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_0
 ! Block link 10.181.0.50/31


route-map RM_POLICY_OUT_20_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_20_1
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_20_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_20
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_20_21 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_20
 set community 65000:100 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_20_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.21
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.14 peer-group RR




 !
 neighbor 10.181.0.53 peer-group EBGP
 neighbor 10.181.0.53 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.14 activate




  neighbor 10.181.0.53 activate
  neighbor 10.181.0.53 route-map RM_POLICY_IN_20_21 in
  neighbor 10.181.0.53 route-map RM_POLICY_OUT_20_21 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
