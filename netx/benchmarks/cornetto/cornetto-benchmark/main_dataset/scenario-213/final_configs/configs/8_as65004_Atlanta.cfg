
hostname 8_as65004_Atlanta
!
interface Loopback0
 ip address 10.180.0.9 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.30.0/24


 ip address 10.200.30.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.31.0/24


 ip address 10.200.31.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.32.0/24


 ip address 10.200.32.1 255.255.255.0
!



ip access-list extended ACL_8_GigabitEthernet0_1
 10 permit ip host 10.180.0.10 any
 20 permit ip host 10.181.0.22 any
 30 permit ip host 10.181.0.23 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 6_as65004_Dallas (6)

 ip address 10.181.0.17 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 9_as65001_Raleigh (9)

 ip address 10.181.0.22 255.255.255.254

 ip access-group ACL_8_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 12_as65004_Tampa (12)

 ip address 10.181.0.24 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.30.0 255.255.255.0 Loopback100
ip route 10.200.31.0 255.255.255.0 Loopback101
ip route 10.200.32.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.9
 passive-interface Loopback0
 network 10.180.0.9 0.0.0.0 area 0



network 10.181.0.16 0.0.0.1 area 0
network 10.181.0.24 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_8 seq 10 permit 10.200.30.0/24
ip prefix-list PL_EXPORT_ALLOWED_8 seq 20 permit 10.200.31.0/24
ip prefix-list PL_EXPORT_ALLOWED_8 seq 30 permit 10.200.32.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_8_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_8_1 seq 10 deny 10.181.0.22/31
!

ip prefix-list PL_EXPORT_DENY_LINK_8_2 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LONG_8 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_8_0 seq 10 deny 10.180.0.9/32
!






route-map RM_POLICY_IN_8_9 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_8_9 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_8_0
 ! Block loopback 10.180.0.9/32


route-map RM_POLICY_OUT_8_9 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_8_9 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_1
 ! Block link 10.181.0.22/31


route-map RM_POLICY_OUT_8_9 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_2
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_8_9 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_8
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_8_9 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_8
 set metric 30
 set as-path prepend 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_8_9 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.9
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.5 peer-group IBGP


 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.13 peer-group IBGP



 !
 neighbor 10.181.0.23 peer-group EBGP
 neighbor 10.181.0.23 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.5 activate


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.8 activate


  neighbor 10.180.0.13 activate



  neighbor 10.181.0.23 activate
  neighbor 10.181.0.23 route-map RM_POLICY_IN_8_9 in
  neighbor 10.181.0.23 route-map RM_POLICY_OUT_8_9 out





  network 10.200.30.0 mask 255.255.255.0

  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

 exit-address-family
