
hostname 21_as65001_Cleveland
!
interface Loopback0
 ip address 10.180.0.22 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.12.0/24


 ip address 10.200.12.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.13.0/24


 ip address 10.200.13.1 255.255.255.0
!



ip access-list extended ACL_21_GigabitEthernet0_1
 10 permit ip host 10.180.0.21 any
 20 permit ip host 10.181.0.52 any
 30 permit ip host 10.181.0.53 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 14_as65001_Pittsburgh (14)

 ip address 10.181.0.39 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 20_as65002_Detroit (20)

 ip address 10.181.0.53 255.255.255.254

 ip access-group ACL_21_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 22_as65001_Boston (22)

 ip address 10.181.0.54 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.11.0 255.255.255.0 Loopback100
ip route 10.200.12.0 255.255.255.0 Loopback101
ip route 10.200.13.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.22
 passive-interface Loopback0
 network 10.180.0.22 0.0.0.0 area 0



network 10.181.0.38 0.0.0.1 area 0
network 10.181.0.54 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_21 seq 10 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_21 seq 20 permit 10.200.12.0/24
ip prefix-list PL_EXPORT_ALLOWED_21 seq 30 permit 10.200.13.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_21_0 seq 10 deny 10.181.0.38/31
!

ip prefix-list PL_EXPORT_DENY_LINK_21_1 seq 10 deny 10.181.0.52/31
!

ip prefix-list PL_EXPORT_DENY_LINK_21_2 seq 10 deny 10.181.0.54/31
!

ip prefix-list PL_EXPORT_DENY_LONG_21 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_21_0 seq 10 deny 10.180.0.22/32
!






route-map RM_POLICY_IN_21_20 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_21_20 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_21_0
 ! Block loopback 10.180.0.22/32


route-map RM_POLICY_OUT_21_20 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_0
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_21_20 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_1
 ! Block link 10.181.0.52/31


route-map RM_POLICY_OUT_21_20 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_2
 ! Block link 10.181.0.54/31


route-map RM_POLICY_OUT_21_20 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_21
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_21_20 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_21
 set metric 28
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_21_20 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.22
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP



 !
 neighbor 10.181.0.52 peer-group EBGP
 neighbor 10.181.0.52 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.10 activate


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.23 activate



  neighbor 10.181.0.52 activate
  neighbor 10.181.0.52 route-map RM_POLICY_IN_21_20 in
  neighbor 10.181.0.52 route-map RM_POLICY_OUT_21_20 out





  network 10.200.11.0 mask 255.255.255.0

  network 10.200.12.0 mask 255.255.255.0

  network 10.200.13.0 mask 255.255.255.0

 exit-address-family
