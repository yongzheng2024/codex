
hostname 3_as65004_3
!
interface Loopback0
 ip address 10.180.0.4 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.33.0/24


 ip address 10.200.33.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.34.0/24


 ip address 10.200.34.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 0_as65004_0 (0)

 ip address 10.181.0.5 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 2_as65002_2 (2)

 ip address 10.181.0.13 255.255.255.254
 mtu 1500
!


ip route 10.200.33.0 255.255.255.0 Loopback100
ip route 10.200.34.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.4
 passive-interface Loopback0
 network 10.180.0.4 0.0.0.0 area 0



network 10.181.0.4 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_3 seq 10 permit 10.200.33.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 20 permit 10.200.34.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_3_0 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_1 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_3 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_3_0 seq 10 deny 10.180.0.4/32
!

ip prefix-list PL_IN_3_2 seq 10 permit 10.200.20.0/24
ip prefix-list PL_IN_3_2 seq 20 permit 10.200.22.0/24
ip prefix-list PL_IN_3_2 seq 30 permit 10.181.0.14/31
ip prefix-list PL_IN_3_2 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_3_2 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_3_2 seq 10 permit 10.200.34.0/24
!






route-map RM_POLICY_IN_3_2 permit 10














 match ip address prefix-list PL_IN_3_2
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_3_2 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_3_2 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_2 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_3_2 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_3_2 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_2 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_3
 set metric 17
 set as-path prepend 65004 65004
 set community 65000:100 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_3_2 deny 200














 match ip address prefix-list PL_OUT_3_2
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_3_2 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65004
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP



 !
 neighbor 10.181.0.12 peer-group EBGP
 neighbor 10.181.0.12 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.13 activate


  neighbor 10.180.0.26 activate


  neighbor 10.180.0.27 activate



  neighbor 10.181.0.12 activate
  neighbor 10.181.0.12 route-map RM_POLICY_IN_3_2 in
  neighbor 10.181.0.12 route-map RM_POLICY_OUT_3_2 out





  network 10.200.33.0 mask 255.255.255.0

  network 10.200.34.0 mask 255.255.255.0

 exit-address-family
