
hostname 2_as65002_2
!
interface Loopback0
 ip address 10.180.0.3 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.20.0/24


 ip address 10.200.20.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 3_as65004_3 (3)

 ip address 10.181.0.12 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 36_as65002_36 (36)

 ip address 10.181.0.14 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 14_as65002_14 (14)

 ip address 10.181.0.16 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
