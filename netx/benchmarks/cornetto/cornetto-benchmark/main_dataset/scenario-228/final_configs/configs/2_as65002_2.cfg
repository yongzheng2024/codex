ip route 10.200.21.0 255.255.255.0 Loopback101
ip route 10.200.22.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.3
 passive-interface Loopback0
 network 10.180.0.3 0.0.0.0 area 0



network 10.181.0.14 0.0.0.1 area 0
network 10.181.0.16 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_2 seq 10 permit 10.200.20.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 20 permit 10.200.21.0/24
ip prefix-list PL_EXPORT_ALLOWED_2 seq 30 permit 10.200.22.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_2_0 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_1 seq 10 deny 10.181.0.14/31
!

ip prefix-list PL_EXPORT_DENY_LINK_2_2 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LONG_2 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_2_0 seq 10 deny 10.180.0.3/32
!

ip prefix-list PL_IN_2_3 seq 10 permit 10.200.34.0/24
ip prefix-list PL_IN_2_3 seq 20 permit 10.181.0.12/31
ip prefix-list PL_IN_2_3 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_2_3 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_2_3 seq 10 permit 10.200.21.0/24
ip prefix-list PL_OUT_2_3 seq 20 permit 10.200.22.0/24
!




ip community-list standard CL_COMM_2_3 permit no-advertise
ip community-list standard CL_COMM_2_3 permit no-export
!





route-map RM_POLICY_IN_2_3 permit 5














 match community CL_COMM_2_3
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_2_3 permit 10














 match ip address prefix-list PL_IN_2_3
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_2_3 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_2_3 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_2_3 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_2_0
 ! Block loopback 10.180.0.3/32


route-map RM_POLICY_OUT_2_3 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_2_3 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_1
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_2_3 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_2_2
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_2_3 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_2
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_2_3 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_2
 set metric 12
 set as-path prepend 65002
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_2_3 deny 200














 match ip address prefix-list PL_OUT_2_3
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_2_3 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.36 peer-group IBGP


 !
 neighbor 10.180.0.37 peer-group IBGP


 !
 neighbor 10.180.0.42 peer-group IBGP


 !
 neighbor 10.180.0.43 peer-group IBGP


 !
 neighbor 10.180.0.44 peer-group IBGP


 !
 neighbor 10.180.0.45 peer-group IBGP



 !
 neighbor 10.181.0.13 peer-group EBGP
 neighbor 10.181.0.13 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.16 activate


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.36 activate


  neighbor 10.180.0.37 activate


  neighbor 10.180.0.42 activate


  neighbor 10.180.0.43 activate


  neighbor 10.180.0.44 activate


