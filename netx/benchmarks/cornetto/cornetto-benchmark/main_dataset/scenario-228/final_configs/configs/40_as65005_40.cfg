ip route 10.200.45.0 255.255.255.0 Loopback100
ip route 10.200.46.0 255.255.255.0 Loopback101
ip route 10.200.47.0 255.255.255.0 Loopback102
ip route 10.200.48.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.41
 passive-interface Loopback0
 network 10.180.0.41 0.0.0.0 area 0



network 10.181.0.36 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_40 seq 10 permit 10.200.45.0/24
ip prefix-list PL_EXPORT_ALLOWED_40 seq 20 permit 10.200.46.0/24
ip prefix-list PL_EXPORT_ALLOWED_40 seq 30 permit 10.200.47.0/24
ip prefix-list PL_EXPORT_ALLOWED_40 seq 40 permit 10.200.48.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_40_0 seq 10 deny 10.181.0.130/31
!

ip prefix-list PL_EXPORT_DENY_LINK_40_1 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LONG_40 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_40_0 seq 10 deny 10.180.0.41/32
!






route-map RM_POLICY_IN_40_41 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_40_41 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_40_0
 ! Block loopback 10.180.0.41/32


route-map RM_POLICY_OUT_40_41 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_40_0
 ! Block link 10.181.0.130/31


route-map RM_POLICY_OUT_40_41 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_40_1
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_40_41 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_40
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_40_41 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_40
 set metric 16
 set as-path prepend 65005
 set community 65000:200 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_40_41 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.41
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.10 peer-group IBGP



 !
 neighbor 10.181.0.131 peer-group EBGP
 neighbor 10.181.0.131 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.6 activate


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.8 activate


  neighbor 10.180.0.9 activate


  neighbor 10.180.0.10 activate



  neighbor 10.181.0.131 activate
  neighbor 10.181.0.131 route-map RM_POLICY_IN_40_41 in
  neighbor 10.181.0.131 route-map RM_POLICY_OUT_40_41 out





  network 10.200.45.0 mask 255.255.255.0

  network 10.200.46.0 mask 255.255.255.0

  network 10.200.47.0 mask 255.255.255.0

  network 10.200.48.0 mask 255.255.255.0

 exit-address-family
