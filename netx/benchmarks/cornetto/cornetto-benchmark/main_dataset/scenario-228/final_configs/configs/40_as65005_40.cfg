
hostname 40_as65005_40
!
interface Loopback0
 ip address 10.180.0.41 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.45.0/24


 ip address 10.200.45.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.46.0/24


 ip address 10.200.46.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.47.0/24


 ip address 10.200.47.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.48.0/24


 ip address 10.200.48.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 8_as65005_8 (8)

 ip address 10.181.0.37 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 41_as65002_41 (41)

 ip address 10.181.0.130 255.255.255.254
 mtu 1500
