 match ip address prefix-list PL_EXPORT_DENY_LONG_6
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_6_1 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_6
 set metric 22
 set as-path prepend 65005 65005 65005
 ! Outbound policy baseline


route-map RM_POLICY_OUT_6_1 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.7
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
