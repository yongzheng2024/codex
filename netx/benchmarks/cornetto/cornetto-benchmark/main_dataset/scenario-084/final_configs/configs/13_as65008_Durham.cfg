ip route 10.200.26.0 255.255.255.0 Loopback100
ip route 10.200.27.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.14
 passive-interface Loopback0
 network 10.180.0.14 0.0.0.0 area 0



network 10.181.0.46 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_13 seq 10 permit 10.200.26.0/24
ip prefix-list PL_EXPORT_ALLOWED_13 seq 20 permit 10.200.27.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_13_0 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LINK_13_1 seq 10 deny 10.181.0.46/31
!

ip prefix-list PL_EXPORT_DENY_LONG_13 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_13_0 seq 10 deny 10.180.0.14/32
!

ip prefix-list PL_IN_13_10 seq 10 permit 10.200.0.0/24
ip prefix-list PL_IN_13_10 seq 20 permit 10.181.0.36/31
ip prefix-list PL_IN_13_10 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_13_10 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_13_10 seq 10 permit 10.200.26.0/24
ip prefix-list PL_OUT_13_10 seq 20 permit 10.200.27.0/24
!






route-map RM_POLICY_IN_13_10 permit 10














 match ip address prefix-list PL_IN_13_10
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_13_10 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_13_10 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_13_0
 ! Block loopback 10.180.0.14/32


route-map RM_POLICY_OUT_13_10 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_0
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_13_10 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_1
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_13_10 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_13
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_13_10 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_13
 set metric 8
 set as-path prepend 65008 65008 65008
 ! Outbound policy baseline


route-map RM_POLICY_OUT_13_10 deny 200














 match ip address prefix-list PL_OUT_13_10
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_13_10 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.14
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65008
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.34 peer-group RR




 !
 neighbor 10.181.0.40 peer-group EBGP
 neighbor 10.181.0.40 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.34 activate




  neighbor 10.181.0.40 activate
  neighbor 10.181.0.40 route-map RM_POLICY_OUT_13_10 out





  network 10.200.26.0 mask 255.255.255.0

  network 10.200.27.0 mask 255.255.255.0

 exit-address-family
