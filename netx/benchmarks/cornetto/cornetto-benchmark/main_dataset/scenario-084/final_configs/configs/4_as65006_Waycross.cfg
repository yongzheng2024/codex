
hostname 4_as65006_Waycross
!
interface Loopback0
 ip address 10.180.0.5 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.65.0/24


 ip address 10.200.65.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.66.0/24


 ip address 10.200.66.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.67.0/24


 ip address 10.200.67.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.68.0/24


 ip address 10.200.68.1 255.255.255.0
!



ip access-list extended ACL_4_GigabitEthernet0_1
 10 permit ip host 10.180.0.49 any
 20 permit ip host 10.181.0.14 any
 30 permit ip host 10.181.0.15 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 3_as65006_Nahunta (3)

 ip address 10.181.0.11 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 48_as65004_Douglas (48)

 ip address 10.181.0.14 255.255.255.254

 ip access-group ACL_4_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.65.0 255.255.255.0 Loopback100
ip route 10.200.66.0 255.255.255.0 Loopback101
ip route 10.200.67.0 255.255.255.0 Loopback102
ip route 10.200.68.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.5
 passive-interface Loopback0
 network 10.180.0.5 0.0.0.0 area 0



network 10.181.0.10 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_4 seq 10 permit 10.200.65.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 20 permit 10.200.66.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 30 permit 10.200.67.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 40 permit 10.200.68.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_4_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_4_1 seq 10 deny 10.181.0.14/31
!

ip prefix-list PL_EXPORT_DENY_LONG_4 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_4_0 seq 10 deny 10.180.0.5/32
!

ip prefix-list PL_IN_4_48 seq 10 permit 10.200.70.0/24
ip prefix-list PL_IN_4_48 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_4_48 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_4_48 seq 10 permit 10.200.65.0/24
ip prefix-list PL_OUT_4_48 seq 20 permit 10.200.68.0/24
!




ip community-list standard CL_COMM_4_48 permit no-advertise
ip community-list standard CL_COMM_4_48 permit no-export
!





route-map RM_POLICY_IN_4_48 permit 5














 match community CL_COMM_4_48
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_4_48 permit 10














 match ip address prefix-list PL_IN_4_48
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_4_48 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_4_48 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_4_48 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_4_0
 ! Block loopback 10.180.0.5/32


route-map RM_POLICY_OUT_4_48 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_4_48 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_1
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_4_48 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_4
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_4_48 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_4
 set community 65000:100 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_4_48 deny 200














 match ip address prefix-list PL_OUT_4_48
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_4_48 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.5
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.4 peer-group RR


 !
 neighbor 10.180.0.158 peer-group RR




 !
 neighbor 10.181.0.15 peer-group EBGP
 neighbor 10.181.0.15 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.4 activate


  neighbor 10.180.0.158 activate




  neighbor 10.181.0.15 activate
  neighbor 10.181.0.15 route-map RM_POLICY_IN_4_48 in
  neighbor 10.181.0.15 route-map RM_POLICY_OUT_4_48 out





  network 10.200.65.0 mask 255.255.255.0

  network 10.200.66.0 mask 255.255.255.0

  network 10.200.67.0 mask 255.255.255.0

  network 10.200.68.0 mask 255.255.255.0

 exit-address-family
