
hostname 100_as65001_Lancaster
!
interface Loopback0
 ip address 10.180.0.101 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 101_as65001_Kershaw (101)

 ip address 10.181.1.24 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 118_as65001_Rock-Hill (118)

 ip address 10.181.1.26 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


router ospf 1
 router-id 10.180.0.101
 passive-interface Loopback0
 network 10.180.0.101 0.0.0.0 area 0



network 10.181.1.24 0.0.0.1 area 0
network 10.181.1.26 0.0.0.1 area 0
!








router bgp 65001
 bgp router-id 10.180.0.101
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.92 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.92 activate







 exit-address-family
