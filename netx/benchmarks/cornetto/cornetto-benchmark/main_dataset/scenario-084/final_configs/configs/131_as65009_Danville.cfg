
hostname 131_as65009_Danville
!
interface Loopback0
 ip address 10.180.0.132 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.28.0/24


 ip address 10.200.28.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.29.0/24


 ip address 10.200.29.1 255.255.255.0
!



ip access-list extended ACL_131_GigabitEthernet0_0
 10 permit ip host 10.180.0.31 any
 20 permit ip host 10.181.0.90 any
 30 permit ip host 10.181.0.91 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
