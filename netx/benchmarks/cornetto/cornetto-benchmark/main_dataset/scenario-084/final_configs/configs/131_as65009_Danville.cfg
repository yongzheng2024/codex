 router-id 10.180.0.132
 passive-interface Loopback0
 network 10.180.0.132 0.0.0.0 area 0



network 10.181.1.68 0.0.0.1 area 0
network 10.181.1.78 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_131 seq 10 permit 10.200.28.0/24
ip prefix-list PL_EXPORT_ALLOWED_131 seq 20 permit 10.200.29.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_131_0 seq 10 deny 10.181.0.90/31
!

ip prefix-list PL_EXPORT_DENY_LINK_131_1 seq 10 deny 10.181.1.68/31
!

ip prefix-list PL_EXPORT_DENY_LINK_131_2 seq 10 deny 10.181.1.78/31
!

ip prefix-list PL_EXPORT_DENY_LONG_131 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_131_0 seq 10 deny 10.180.0.132/32
!

ip prefix-list PL_IN_131_30 seq 10 permit 10.181.0.88/31
ip prefix-list PL_IN_131_30 seq 20 permit 10.181.0.48/31
ip prefix-list PL_IN_131_30 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_131_30 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_131_30 seq 10 permit 10.200.28.0/24
!






route-map RM_POLICY_IN_131_30 permit 10














 match ip address prefix-list PL_IN_131_30
 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_131_30 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_131_30 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_131_0
 ! Block loopback 10.180.0.132/32


route-map RM_POLICY_OUT_131_30 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_131_0
 ! Block link 10.181.0.90/31


route-map RM_POLICY_OUT_131_30 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_131_1
 ! Block link 10.181.1.68/31


route-map RM_POLICY_OUT_131_30 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_131_2
 ! Block link 10.181.1.78/31


route-map RM_POLICY_OUT_131_30 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_131
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_131_30 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_131
 set metric 12
 set as-path prepend 65009
 set community no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_131_30 deny 200














 match ip address prefix-list PL_OUT_131_30
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_131_30 deny 65000














 ! Deny other outbound routes

!







router bgp 65009
 bgp router-id 10.180.0.132
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65009
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.51 peer-group RR




 !
 neighbor 10.181.0.90 peer-group EBGP
 neighbor 10.181.0.90 remote-as 65008


 !
 address-family ipv4

  neighbor 10.180.0.51 activate




  neighbor 10.181.0.90 activate
  neighbor 10.181.0.90 route-map RM_POLICY_IN_131_30 in
  neighbor 10.181.0.90 route-map RM_POLICY_OUT_131_30 out





  network 10.200.28.0 mask 255.255.255.0

  network 10.200.29.0 mask 255.255.255.0

 exit-address-family
