ip route 10.200.69.0 255.255.255.0 Loopback100
ip route 10.200.70.0 255.255.255.0 Loopback101
ip route 10.200.71.0 255.255.255.0 Loopback102
ip route 10.200.72.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.49
 passive-interface Loopback0
 network 10.180.0.49 0.0.0.0 area 0



network 10.181.0.136 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_48 seq 10 permit 10.200.69.0/24
ip prefix-list PL_EXPORT_ALLOWED_48 seq 20 permit 10.200.70.0/24
ip prefix-list PL_EXPORT_ALLOWED_48 seq 30 permit 10.200.71.0/24
ip prefix-list PL_EXPORT_ALLOWED_48 seq 40 permit 10.200.72.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_48_0 seq 10 deny 10.181.0.136/31
!

ip prefix-list PL_EXPORT_DENY_LINK_48_1 seq 10 deny 10.181.0.14/31
!

ip prefix-list PL_EXPORT_DENY_LONG_48 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_48_0 seq 10 deny 10.180.0.49/32
!




ip community-list standard CL_COMM_48_4 permit no-advertise
ip community-list standard CL_COMM_48_4 permit no-export
!





route-map RM_POLICY_IN_48_4 permit 5














 match community CL_COMM_48_4
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_48_4 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_48_4 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_48_0
 ! Block loopback 10.180.0.49/32


route-map RM_POLICY_OUT_48_4 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_48_0
 ! Block link 10.181.0.136/31


route-map RM_POLICY_OUT_48_4 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_48_1
 ! Block link 10.181.0.14/31


route-map RM_POLICY_OUT_48_4 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_48
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_48_4 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_48
 set community 65000:100 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_48_4 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.49
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.135 peer-group RR




 !
 neighbor 10.181.0.14 peer-group EBGP
 neighbor 10.181.0.14 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.135 activate




  neighbor 10.181.0.14 activate
  neighbor 10.181.0.14 route-map RM_POLICY_IN_48_4 in
  neighbor 10.181.0.14 route-map RM_POLICY_OUT_48_4 out





  network 10.200.69.0 mask 255.255.255.0

  network 10.200.70.0 mask 255.255.255.0

  network 10.200.71.0 mask 255.255.255.0

  network 10.200.72.0 mask 255.255.255.0

 exit-address-family
