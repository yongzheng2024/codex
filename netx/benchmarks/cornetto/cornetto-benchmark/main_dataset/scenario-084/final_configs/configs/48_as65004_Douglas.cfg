ip access-list extended ACL_48_GigabitEthernet0_0
 10 permit ip host 10.180.0.5 any
 20 permit ip host 10.181.0.14 any
 30 permit ip host 10.181.0.15 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 4_as65006_Waycross (4)

 ip address 10.181.0.15 255.255.255.254

 ip access-group ACL_48_GigabitEthernet0_0 in
