
hostname 112_as65002_Cherokee
!
interface Loopback0
 ip address 10.180.0.113 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 113_as65002_Bryson-City (113)

 ip address 10.181.1.48 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

