router ospf 1
 router-id 10.180.0.113
 passive-interface Loopback0
 network 10.180.0.113 0.0.0.0 area 0



network 10.181.1.48 0.0.0.1 area 0
network 10.181.1.50 0.0.0.1 area 0
!








router bgp 65002
 bgp router-id 10.180.0.113
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.73 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.73 activate







 exit-address-family
