
hostname 80_as65010_Hilton-Head
!
interface Loopback0
 ip address 10.180.0.81 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 81_as65010_Beaufort (81)

 ip address 10.181.0.234 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 86_as65010_None (86)

 ip address 10.181.0.236 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


router ospf 1
 router-id 10.180.0.81
 passive-interface Loopback0
 network 10.180.0.81 0.0.0.0 area 0



network 10.181.0.234 0.0.0.1 area 0
network 10.181.0.236 0.0.0.1 area 0
!








router bgp 65010
 bgp router-id 10.180.0.81
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65010
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.8 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.8 activate







 exit-address-family
