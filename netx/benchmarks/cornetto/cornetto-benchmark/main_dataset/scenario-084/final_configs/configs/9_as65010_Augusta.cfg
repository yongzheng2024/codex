
hostname 9_as65010_Augusta
!
interface Loopback0
 ip address 10.180.0.10 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.107.0/24


 ip address 10.200.107.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.108.0/24


 ip address 10.200.108.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.109.0/24


 ip address 10.200.109.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 7_as65010_Columbia (7)

 ip address 10.181.0.23 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

