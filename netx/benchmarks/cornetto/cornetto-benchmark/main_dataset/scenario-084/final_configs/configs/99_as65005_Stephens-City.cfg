
hostname 99_as65005_Stephens-City
!
interface Loopback0
 ip address 10.180.0.100 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 79_as65005_None (79)

 ip address 10.181.0.233 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

