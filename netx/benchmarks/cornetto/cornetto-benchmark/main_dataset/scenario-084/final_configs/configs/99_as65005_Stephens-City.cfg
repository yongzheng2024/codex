router ospf 1
 router-id 10.180.0.100
 passive-interface Loopback0
 network 10.180.0.100 0.0.0.0 area 0



network 10.181.0.232 0.0.0.1 area 0
network 10.181.1.22 0.0.0.1 area 0
!








router bgp 65005
 bgp router-id 10.180.0.100
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.79 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.79 activate







 exit-address-family
