 match ip address prefix-list PL_EXPORT_DENY_LONG_119
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_119_7 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_119
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_119_7 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.120
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.92 peer-group RR




 !
 neighbor 10.181.0.28 peer-group EBGP
 neighbor 10.181.0.28 remote-as 65010


 !
 address-family ipv4

  neighbor 10.180.0.92 activate




  neighbor 10.181.0.28 activate
  neighbor 10.181.0.28 route-map RM_POLICY_OUT_119_7 out





  network 10.200.19.0 mask 255.255.255.0

  network 10.200.20.0 mask 255.255.255.0

  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

 exit-address-family
