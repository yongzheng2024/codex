
hostname 10_as65007_Raleigh
!
interface Loopback0
 ip address 10.180.0.11 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 18_as65007_Fayetteville (18)

 ip address 10.181.0.36 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65007_Rocky-Mount (11)

 ip address 10.181.0.38 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 13_as65008_Durham (13)

 ip address 10.181.0.40 255.255.255.254
 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.11
 passive-interface Loopback0
 network 10.180.0.11 0.0.0.0 area 0



network 10.181.0.36 0.0.0.1 area 0
network 10.181.0.38 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_10 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 20 permit 10.200.1.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_10_0 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_1 seq 10 deny 10.181.0.38/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_2 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LONG_10 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_10_0 seq 10 deny 10.180.0.11/32
!






route-map RM_POLICY_IN_10_13 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_10_13 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_13 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_10_13 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_10_13 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_2
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_10_13 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_10
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_10_13 deny 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_10
 set metric 28
 set as-path prepend 65007 65007
 ! Outbound policy baseline


route-map RM_POLICY_OUT_10_13 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65007
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.19 peer-group RR


 !
 neighbor 10.180.0.107 peer-group RR




 !
 neighbor 10.181.0.41 peer-group EBGP
 neighbor 10.181.0.41 remote-as 65008


 !
 address-family ipv4

  neighbor 10.180.0.19 activate


  neighbor 10.180.0.107 activate




  neighbor 10.181.0.41 activate
  neighbor 10.181.0.41 route-map RM_POLICY_IN_10_13 in





  network 10.180.0.11 mask 255.255.255.255

  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

 exit-address-family
