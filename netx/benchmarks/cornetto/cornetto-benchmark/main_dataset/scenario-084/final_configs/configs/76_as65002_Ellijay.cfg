
hostname 76_as65002_Ellijay
!
interface Loopback0
 ip address 10.180.0.77 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.90.0/24


 ip address 10.200.90.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.91.0/24


 ip address 10.200.91.1 255.255.255.0
!



ip access-list extended ACL_76_GigabitEthernet0_0
 10 permit ip host 10.180.0.69 any
 20 permit ip host 10.181.0.198 any
 30 permit ip host 10.181.0.199 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 68_as65003_Canton (68)

 ip address 10.181.0.199 255.255.255.254

 ip access-group ACL_76_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 72_as65002_Dalton (72)

 ip address 10.181.0.213 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 92_as65002_Blueridge (92)

 ip address 10.181.0.220 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.90.0 255.255.255.0 Loopback100
ip route 10.200.91.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.77
 passive-interface Loopback0
 network 10.180.0.77 0.0.0.0 area 0



network 10.181.0.212 0.0.0.1 area 0
network 10.181.0.220 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_76 seq 10 permit 10.200.90.0/24
ip prefix-list PL_EXPORT_ALLOWED_76 seq 20 permit 10.200.91.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_76_0 seq 10 deny 10.181.0.198/31
!

ip prefix-list PL_EXPORT_DENY_LINK_76_1 seq 10 deny 10.181.0.212/31
!

ip prefix-list PL_EXPORT_DENY_LINK_76_2 seq 10 deny 10.181.0.220/31
!

ip prefix-list PL_EXPORT_DENY_LONG_76 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_76_0 seq 10 deny 10.180.0.77/32
!

ip prefix-list PL_IN_76_68 seq 10 permit 10.200.86.0/24
ip prefix-list PL_IN_76_68 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_76_68 seq 10 permit 10.200.90.0/24
ip prefix-list PL_OUT_76_68 seq 20 permit 10.200.91.0/24
!






route-map RM_POLICY_IN_76_68 permit 10














 match ip address prefix-list PL_IN_76_68
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_76_68 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_76_68 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_76_0
 ! Block loopback 10.180.0.77/32


route-map RM_POLICY_OUT_76_68 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_76_0
 ! Block link 10.181.0.198/31


route-map RM_POLICY_OUT_76_68 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_76_1
 ! Block link 10.181.0.212/31


route-map RM_POLICY_OUT_76_68 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_76_2
 ! Block link 10.181.0.220/31


route-map RM_POLICY_OUT_76_68 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_76
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_76_68 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_76
 set community 65000:200 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_76_68 deny 200














 match ip address prefix-list PL_OUT_76_68
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_76_68 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.77
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.73 peer-group RR




 !
 neighbor 10.181.0.198 peer-group EBGP
 neighbor 10.181.0.198 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.73 activate




  neighbor 10.181.0.198 activate
  neighbor 10.181.0.198 route-map RM_POLICY_IN_76_68 in
  neighbor 10.181.0.198 route-map RM_POLICY_OUT_76_68 out





  network 10.200.90.0 mask 255.255.255.0

  network 10.200.91.0 mask 255.255.255.0

 exit-address-family
