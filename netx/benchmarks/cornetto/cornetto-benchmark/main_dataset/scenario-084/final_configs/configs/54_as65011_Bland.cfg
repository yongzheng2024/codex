
hostname 54_as65011_Bland
!
interface Loopback0
 ip address 10.180.0.55 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 53_as65011_Wytheville (53)

 ip address 10.181.0.159 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 55_as65011_Bluefield (55)

 ip address 10.181.0.160 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


router ospf 1
 router-id 10.180.0.55
 passive-interface Loopback0
 network 10.180.0.55 0.0.0.0 area 0



network 10.181.0.158 0.0.0.1 area 0
network 10.181.0.160 0.0.0.1 area 0
!








router bgp 65011
 bgp router-id 10.180.0.55
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65011
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.54 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.54 activate







 exit-address-family
