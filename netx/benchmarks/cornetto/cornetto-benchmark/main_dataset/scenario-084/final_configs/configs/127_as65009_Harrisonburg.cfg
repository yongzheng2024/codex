!

ip prefix-list PL_EXPORT_DENY_LINK_127_1 seq 10 deny 10.181.1.72/31
!

ip prefix-list PL_EXPORT_DENY_LINK_127_2 seq 10 deny 10.181.1.74/31
!

ip prefix-list PL_EXPORT_DENY_LONG_127 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_127_0 seq 10 deny 10.180.0.128/32
!

ip prefix-list PL_IN_127_78 seq 10 permit 10.181.0.228/31
ip prefix-list PL_IN_127_78 seq 20 permit 10.180.0.79/32
ip prefix-list PL_IN_127_78 seq 30 permit 10.181.0.230/31
ip prefix-list PL_IN_127_78 seq 40 permit 10.181.0.180/31
ip prefix-list PL_IN_127_78 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_127_78 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_127_78 seq 10 permit 10.200.23.0/24
!






route-map RM_POLICY_IN_127_78 permit 10














 match ip address prefix-list PL_IN_127_78
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_127_78 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_127_78 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_127_0
 ! Block loopback 10.180.0.128/32


route-map RM_POLICY_OUT_127_78 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_127_0
 ! Block link 10.181.0.230/31


route-map RM_POLICY_OUT_127_78 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_127_1
 ! Block link 10.181.1.72/31


route-map RM_POLICY_OUT_127_78 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_127_2
 ! Block link 10.181.1.74/31


route-map RM_POLICY_OUT_127_78 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_127
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_127_78 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_127
 set metric 15
 set as-path prepend 65009 65009
 ! Outbound policy baseline


route-map RM_POLICY_OUT_127_78 deny 200














 match ip address prefix-list PL_OUT_127_78
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_127_78 deny 65000














 ! Deny other outbound routes

!







router bgp 65009
 bgp router-id 10.180.0.128
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65009
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.51 peer-group RR




 !
 neighbor 10.181.0.230 peer-group EBGP
 neighbor 10.181.0.230 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.51 activate




  neighbor 10.181.0.230 activate
  neighbor 10.181.0.230 route-map RM_POLICY_IN_127_78 in
  neighbor 10.181.0.230 route-map RM_POLICY_OUT_127_78 out





  network 10.200.23.0 mask 255.255.255.0

  network 10.200.24.0 mask 255.255.255.0

  network 10.200.25.0 mask 255.255.255.0

 exit-address-family
