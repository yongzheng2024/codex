
hostname 3_as65004_CASE
!
interface Loopback0
 ip address 10.180.0.4 255.255.255.255

 ip ospf network point-to-point
!



ip access-list extended ACL_3_GigabitEthernet0_2_OUT
 10 permit ip host 10.180.0.4 any
 20 permit ip host 10.181.0.11 any
 30 permit ip host 10.181.0.12 any
 40 permit ip host 10.181.0.14 any
 50 permit ip 10.181.0.10 0.0.0.1 any
 60 permit ip 10.181.0.12 0.0.0.1 any
!


interface GigabitEthernet0/0
 description to 2_as65004_CARNEGIE (2)

 ip address 10.181.0.11 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65004_RADC (11)

 ip address 10.181.0.12 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 5_as65001_AFGWC (5)

 ip address 10.181.0.14 255.255.255.254

 ip access-group ACL_3_GigabitEthernet0_2_OUT out
 mtu 1500
!


router ospf 1
 router-id 10.180.0.4
 passive-interface Loopback0
 network 10.180.0.4 0.0.0.0 area 0



network 10.181.0.10 0.0.0.1 area 0
network 10.181.0.12 0.0.0.1 area 0
!
