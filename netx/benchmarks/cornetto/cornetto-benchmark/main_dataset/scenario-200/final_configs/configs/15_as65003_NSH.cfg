router ospf 1
 router-id 10.180.0.16
 passive-interface Loopback0
 network 10.180.0.16 0.0.0.0 area 0



network 10.181.0.42 0.0.0.1 area 0
network 10.181.0.44 0.0.0.1 area 0
network 10.181.0.46 0.0.0.1 area 0
!








router bgp 65003
 bgp router-id 10.180.0.16
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0




 !
 neighbor 10.180.0.11 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.18 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP



 !
 address-family ipv4


  neighbor 10.180.0.11 activate


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.18 activate


  neighbor 10.180.0.25 activate






