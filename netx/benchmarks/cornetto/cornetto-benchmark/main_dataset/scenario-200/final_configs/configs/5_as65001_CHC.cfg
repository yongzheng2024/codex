
hostname 5_as65001_CHC
!
interface Loopback0
 ip address 10.180.0.6 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 0_as65001_WLG (0)

 ip address 10.181.0.7 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 4_as65001_LCN (4)

 ip address 10.181.0.31 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 8_as65001_TPO (8)

 ip address 10.181.0.32 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/3
 description to 9_as65001_NLS (9)

 ip address 10.181.0.34 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


router ospf 1
 router-id 10.180.0.6
 passive-interface Loopback0
 network 10.180.0.6 0.0.0.0 area 0



network 10.181.0.6 0.0.0.1 area 0
network 10.181.0.30 0.0.0.1 area 0
network 10.181.0.32 0.0.0.1 area 0
network 10.181.0.34 0.0.0.1 area 0
!








router bgp 65001
 bgp router-id 10.180.0.6
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.2 peer-group RR


 !
 neighbor 10.180.0.1 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.2 activate


  neighbor 10.180.0.1 activate







 exit-address-family
