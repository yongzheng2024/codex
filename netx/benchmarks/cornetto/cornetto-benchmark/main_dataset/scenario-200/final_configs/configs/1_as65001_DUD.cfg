
hostname 1_as65001_DUD
!
interface Loopback0
 ip address 10.180.0.2 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 0_as65001_WLG (0)

 ip address 10.181.0.1 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 4_as65001_LCN (4)

 ip address 10.181.0.10 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 6_as65001_IVM (6)

 ip address 10.181.0.12 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/3
 description to 6_as65001_IVM (6)

 ip address 10.181.0.14 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/4
 description to 7_as65001_INV (7)

 ip address 10.181.0.16 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


router ospf 1
 router-id 10.180.0.2
 passive-interface Loopback0
 network 10.180.0.2 0.0.0.0 area 0



network 10.181.0.10 0.0.0.1 area 0
network 10.181.0.12 0.0.0.1 area 0
network 10.181.0.14 0.0.0.1 area 0
network 10.181.0.16 0.0.0.1 area 0
!








router bgp 65001
 bgp router-id 10.180.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.2


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0



 !
 neighbor 10.180.0.1 peer-group RR



 !
 neighbor 10.180.0.6 peer-group IBGP


 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP



 !
 address-family ipv4

  neighbor 10.180.0.1 activate



  neighbor 10.180.0.6 activate
  neighbor 10.180.0.6 next-hop-self


  neighbor 10.180.0.8 activate
  neighbor 10.180.0.8 next-hop-self


  neighbor 10.180.0.9 activate
  neighbor 10.180.0.9 next-hop-self






 exit-address-family
