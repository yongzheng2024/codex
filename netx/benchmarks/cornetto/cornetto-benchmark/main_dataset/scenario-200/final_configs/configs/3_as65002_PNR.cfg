
hostname 3_as65002_PNR
!
interface Loopback0
 ip address 10.180.0.4 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.13.0/24


 ip address 10.200.13.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.14.0/24


 ip address 10.200.14.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.15.0/24


 ip address 10.200.15.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 0_as65001_WLG (0)

 ip address 10.181.0.5 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 24_as65003_AKL (24)

 ip address 10.181.0.22 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 12_as65002_NPL (12)

 ip address 10.181.0.24 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/3
 description to 13_as65002_WAG (13)

 ip address 10.181.0.26 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/4
 description to 14_as65002_MUP (14)

 ip address 10.181.0.28 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.13.0 255.255.255.0 Loopback100
ip route 10.200.14.0 255.255.255.0 Loopback101
ip route 10.200.15.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.4
 passive-interface Loopback0
 network 10.180.0.4 0.0.0.0 area 0










 redistribute bgp 65002 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_3

network 10.181.0.22 0.0.0.1 area 0
network 10.181.0.24 0.0.0.1 area 0
network 10.181.0.26 0.0.0.1 area 0
network 10.181.0.28 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 10 permit 10.200.10.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 20 permit 10.200.11.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_3 seq 30 permit 10.200.12.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 10 permit 10.180.0.4/32
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 20 permit 10.181.0.4/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 30 permit 10.181.0.22/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 40 permit 10.181.0.24/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 50 permit 10.181.0.26/31
ip prefix-list PL_BGP_TO_OSPF_DENY_3 seq 60 permit 10.181.0.28/31
!






route-map RM_BGP_TO_OSPF_3 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_3 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_3
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_3 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_3
 set tag 65010

!







router bgp 65002
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP



 !
 neighbor 10.181.0.4 peer-group EBGP
 neighbor 10.181.0.4 remote-as 65001


 !
 neighbor 10.181.0.23 peer-group EBGP
 neighbor 10.181.0.23 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.3 activate


  neighbor 10.180.0.13 activate


  neighbor 10.180.0.14 activate


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.21 activate



  neighbor 10.181.0.4 activate


  neighbor 10.181.0.23 activate





  network 10.200.13.0 mask 255.255.255.0

  network 10.200.14.0 mask 255.255.255.0

  network 10.200.15.0 mask 255.255.255.0

 exit-address-family
