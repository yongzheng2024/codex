
hostname 90_as65009_Haskovo
!
interface Loopback0
 ip address 10.180.0.91 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.121.0/24


 ip address 10.200.121.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.122.0/24


 ip address 10.200.122.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 140_as65009_Plovdiv (140)

 ip address 10.181.1.22 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 111_as65011_Svilengrad (111)

 ip address 10.181.1.24 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.121.0 255.255.255.0 Loopback100
ip route 10.200.122.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.91
 passive-interface Loopback0
 network 10.180.0.91 0.0.0.0 area 0










 redistribute bgp 65009 metric 90 metric-type 2 subnets route-map RM_BGP_TO_OSPF_90

network 10.181.1.22 0.0.0.1 area 0
network 10.181.1.24 0.0.0.1 area 0
!


ip prefix-list PL_BGP_TO_OSPF_ALLOW_90 seq 10 permit 10.200.8.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_90 seq 20 permit 10.200.9.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_90 seq 30 permit 10.200.118.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_90 seq 40 permit 10.200.119.0/24
ip prefix-list PL_BGP_TO_OSPF_ALLOW_90 seq 50 permit 10.200.120.0/24
!

ip prefix-list PL_BGP_TO_OSPF_DENY_90 seq 10 permit 10.180.0.91/32
ip prefix-list PL_BGP_TO_OSPF_DENY_90 seq 20 permit 10.181.1.22/31
ip prefix-list PL_BGP_TO_OSPF_DENY_90 seq 30 permit 10.181.1.24/31
!






route-map RM_BGP_TO_OSPF_90 deny 5














 match tag 65100
 ! Deny routes originally from OSPF to prevent redistribution loops


route-map RM_BGP_TO_OSPF_90 deny 10














 match ip address prefix-list PL_BGP_TO_OSPF_DENY_90
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_90 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_90
 set tag 65010

!







router bgp 65009
 bgp router-id 10.180.0.91
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65009
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.145 peer-group RR


 !
 neighbor 10.180.0.52 peer-group RR




 !
 neighbor 10.181.1.25 peer-group EBGP
 neighbor 10.181.1.25 remote-as 65011


 !
 address-family ipv4

  neighbor 10.180.0.145 activate


  neighbor 10.180.0.52 activate




  neighbor 10.181.1.25 activate





  network 10.200.121.0 mask 255.255.255.0

  network 10.200.122.0 mask 255.255.255.0

 exit-address-family
