 match ip address prefix-list PL_BGP_TO_OSPF_DENY_19
 ! Block internal/disallowed prefixes


route-map RM_BGP_TO_OSPF_19 permit 20














 match ip address prefix-list PL_BGP_TO_OSPF_ALLOW_19
 set tag 65010

!







router bgp 65006
