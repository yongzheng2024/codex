
hostname 10_as65004_4-85
!
interface Loopback0
 ip address 10.180.0.11 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.2.0/24


 ip address 10.200.2.1 255.255.255.0
!



ip access-list extended ACL_10_GigabitEthernet0_1_OUT
 5 deny ip any any
 10 permit ip host 10.180.0.11 any
 20 permit ip host 10.181.0.28 any
 30 permit ip host 10.181.0.30 any
 40 permit ip 10.181.0.28 0.0.0.1 any
 50 permit ip 10.181.0.30 0.0.0.1 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 58_as65004_4-8 (58)

 ip address 10.181.0.28 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65001_11 (11)

 ip address 10.181.0.30 255.255.255.254

 ip access-group ACL_10_GigabitEthernet0_1_OUT out
 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
ip route 10.200.2.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.11
 passive-interface Loopback0
 network 10.180.0.11 0.0.0.0 area 0



network 10.181.0.28 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_10 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 20 permit 10.200.1.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 30 permit 10.200.2.0/24
