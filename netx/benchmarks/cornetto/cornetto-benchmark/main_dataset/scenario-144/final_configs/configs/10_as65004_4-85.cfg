ip prefix-list PL_EXPORT_DENY_LINK_10_0 seq 10 deny 10.181.0.28/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_1 seq 10 deny 10.181.0.30/31
!

ip prefix-list PL_EXPORT_DENY_LONG_10 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_10_0 seq 10 deny 10.180.0.11/32
!






route-map RM_POLICY_IN_10_11 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_10_11 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_11 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.28/31


route-map RM_POLICY_OUT_10_11 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_10_11 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_10
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_10_11 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_10
 set metric 30
 set as-path prepend 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_10_11 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.59 peer-group IBGP


 !
 neighbor 10.180.0.61 peer-group IBGP


 !
 neighbor 10.180.0.62 peer-group IBGP


 !
 neighbor 10.180.0.63 peer-group IBGP


 !
 neighbor 10.180.0.64 peer-group IBGP


 !
 neighbor 10.180.0.66 peer-group IBGP



 !
 neighbor 10.181.0.31 peer-group EBGP
 neighbor 10.181.0.31 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.13 activate


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.59 activate


  neighbor 10.180.0.61 activate


  neighbor 10.180.0.62 activate


  neighbor 10.180.0.63 activate


  neighbor 10.180.0.64 activate


  neighbor 10.180.0.66 activate



  neighbor 10.181.0.31 activate
  neighbor 10.181.0.31 route-map RM_POLICY_IN_10_11 in
  neighbor 10.181.0.31 route-map RM_POLICY_OUT_10_11 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

  network 10.200.2.0 mask 255.255.255.0

 exit-address-family
