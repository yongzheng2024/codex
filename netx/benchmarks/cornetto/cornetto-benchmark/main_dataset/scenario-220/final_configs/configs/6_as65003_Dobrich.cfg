 match ip address prefix-list PL_EXPORT_DENY_LINK_6_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_6_11 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_2
 ! Block link 10.181.0.4/31


