 match ip address prefix-list PL_EXPORT_DENY_LONG_6
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_6_11 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_6
 set metric 19
 set as-path prepend 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_6_11 deny 65000














 ! Deny other outbound routes

!







