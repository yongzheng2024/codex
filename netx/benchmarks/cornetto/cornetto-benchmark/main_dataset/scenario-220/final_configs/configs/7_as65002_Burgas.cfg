
hostname 7_as65002_Burgas
!
interface Loopback0
 ip address 10.180.0.8 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.28.0/24


 ip address 10.200.28.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.29.0/24


 ip address 10.200.29.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 4_as65001_Yambol (4)

 ip address 10.181.0.13 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 11_as65002_Varna (11)

 ip address 10.181.0.18 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 14_as65002_Sofia (14)

 ip address 10.181.0.20 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.28.0 255.255.255.0 Loopback100
ip route 10.200.29.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.8
 passive-interface Loopback0
 network 10.180.0.8 0.0.0.0 area 0



network 10.181.0.18 0.0.0.1 area 0
network 10.181.0.20 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_7 seq 10 permit 10.200.28.0/24
ip prefix-list PL_EXPORT_ALLOWED_7 seq 20 permit 10.200.29.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_7_0 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_7_1 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_7_2 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LONG_7 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_7_0 seq 10 deny 10.180.0.8/32
!

ip prefix-list PL_IN_7_4 seq 10 permit 10.200.21.0/24
ip prefix-list PL_IN_7_4 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_7_4 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_7_4 seq 10 permit 10.200.28.0/24
!






route-map RM_POLICY_IN_7_4 permit 10














 match ip address prefix-list PL_IN_7_4
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_7_4 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_7_4 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_7_0
 ! Block loopback 10.180.0.8/32


route-map RM_POLICY_OUT_7_4 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_7_4 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_1
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_7_4 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_7_2
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_7_4 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_7
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_7_4 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_7
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_7_4 deny 200














 match ip address prefix-list PL_OUT_7_4
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_7_4 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.8
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.14 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.19 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP


 !
 neighbor 10.180.0.30 peer-group IBGP


 !
 neighbor 10.180.0.37 peer-group IBGP


 !
 neighbor 10.180.0.26 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP



 !
 neighbor 10.181.0.12 peer-group EBGP
 neighbor 10.181.0.12 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.14 activate


  neighbor 10.180.0.15 activate


  neighbor 10.180.0.19 activate


  neighbor 10.180.0.20 activate


  neighbor 10.180.0.21 activate


  neighbor 10.180.0.22 activate


  neighbor 10.180.0.28 activate


  neighbor 10.180.0.30 activate


  neighbor 10.180.0.37 activate


  neighbor 10.180.0.26 activate


  neighbor 10.180.0.27 activate



  neighbor 10.181.0.12 activate
  neighbor 10.181.0.12 route-map RM_POLICY_IN_7_4 in
  neighbor 10.181.0.12 route-map RM_POLICY_OUT_7_4 out





  network 10.200.28.0 mask 255.255.255.0

  network 10.200.29.0 mask 255.255.255.0

 exit-address-family
