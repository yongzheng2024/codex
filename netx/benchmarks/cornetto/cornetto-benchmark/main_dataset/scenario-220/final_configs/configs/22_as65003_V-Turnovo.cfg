
hostname 22_as65003_V-Turnovo
!
interface Loopback0
 ip address 10.180.0.23 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.12.0/24


 ip address 10.200.12.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 35_as65004_Lovech (35)

 ip address 10.181.0.74 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 28_as65003_Ruse (28)

 ip address 10.181.0.76 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.11.0 255.255.255.0 Loopback101
ip route 10.200.12.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.23
 passive-interface Loopback0
 network 10.180.0.23 0.0.0.0 area 0



network 10.181.0.76 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_22 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_22 seq 20 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_22 seq 30 permit 10.200.12.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_22_0 seq 10 deny 10.181.0.74/31
!

ip prefix-list PL_EXPORT_DENY_LINK_22_1 seq 10 deny 10.181.0.76/31
!

ip prefix-list PL_EXPORT_DENY_LONG_22 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_22_0 seq 10 deny 10.180.0.23/32
!

ip prefix-list PL_IN_22_35 seq 10 permit 10.200.18.0/24
ip prefix-list PL_IN_22_35 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_22_35 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_22_35 seq 10 permit 10.200.12.0/24
!




ip community-list standard CL_COMM_22_35 permit 65535:65282
ip community-list standard CL_COMM_22_35 permit no-export
!





route-map RM_POLICY_IN_22_35 permit 5














 match community CL_COMM_22_35
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_22_35 permit 10














 match ip address prefix-list PL_IN_22_35
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_22_35 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_22_35 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_22_35 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_22_0
 ! Block loopback 10.180.0.23/32


route-map RM_POLICY_OUT_22_35 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_0
 ! Block link 10.181.0.74/31


route-map RM_POLICY_OUT_22_35 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_1
 ! Block link 10.181.0.76/31


route-map RM_POLICY_OUT_22_35 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_22
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_22_35 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_22
 set community 65000:100 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_22_35 deny 200














 match ip address prefix-list PL_OUT_22_35
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_22_35 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.23
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.4 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.29 peer-group IBGP



 !
 neighbor 10.181.0.75 peer-group EBGP
 neighbor 10.181.0.75 remote-as 65004


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.3 activate


  neighbor 10.180.0.4 activate


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.29 activate



  neighbor 10.181.0.75 activate
  neighbor 10.181.0.75 route-map RM_POLICY_IN_22_35 in
  neighbor 10.181.0.75 route-map RM_POLICY_OUT_22_35 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

  network 10.200.12.0 mask 255.255.255.0

 exit-address-family
