 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_75_76 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_75
 set metric 15
 set as-path prepend 65008 65008 65008
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_75_76 deny 65000














 ! Deny other outbound routes

!







