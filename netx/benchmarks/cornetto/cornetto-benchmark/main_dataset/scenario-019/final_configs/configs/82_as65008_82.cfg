
hostname 82_as65008_82
!
interface Loopback0
 ip address 10.180.0.83 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.80.0/24


 ip address 10.200.80.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.81.0/24


 ip address 10.200.81.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 79_as65005_79 (79)

 ip address 10.181.0.237 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 81_as65008_81 (81)

 ip address 10.181.0.239 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.80.0 255.255.255.0 Loopback100
ip route 10.200.81.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.83
 passive-interface Loopback0
 network 10.180.0.83 0.0.0.0 area 0



network 10.181.0.238 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_82 seq 10 permit 10.200.80.0/24
ip prefix-list PL_EXPORT_ALLOWED_82 seq 20 permit 10.200.81.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_82_0 seq 10 deny 10.181.0.236/31
!

ip prefix-list PL_EXPORT_DENY_LINK_82_1 seq 10 deny 10.181.0.238/31
!

ip prefix-list PL_EXPORT_DENY_LONG_82 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_82_0 seq 10 deny 10.180.0.83/32
!




ip community-list standard CL_COMM_82_79 permit no-export
!





route-map RM_POLICY_IN_82_79 permit 5














 match community CL_COMM_82_79
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_82_79 permit 10














 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_82_79 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_82_79 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_82_0
 ! Block loopback 10.180.0.83/32


route-map RM_POLICY_OUT_82_79 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_0
 ! Block link 10.181.0.236/31


route-map RM_POLICY_OUT_82_79 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_82_1
 ! Block link 10.181.0.238/31


route-map RM_POLICY_OUT_82_79 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_82
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_82_79 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_82
 set metric 30
 set as-path prepend 65008 65008
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_82_79 deny 65000














 ! Deny other outbound routes

!







router bgp 65008
 bgp router-id 10.180.0.83
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65008
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.95 peer-group RR


 !
 neighbor 10.180.0.68 peer-group RR




 !
 neighbor 10.181.0.236 peer-group EBGP
 neighbor 10.181.0.236 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.95 activate


  neighbor 10.180.0.68 activate




  neighbor 10.181.0.236 activate
  neighbor 10.181.0.236 route-map RM_POLICY_IN_82_79 in
  neighbor 10.181.0.236 route-map RM_POLICY_OUT_82_79 out





  network 10.200.80.0 mask 255.255.255.0

  network 10.200.81.0 mask 255.255.255.0

 exit-address-family
