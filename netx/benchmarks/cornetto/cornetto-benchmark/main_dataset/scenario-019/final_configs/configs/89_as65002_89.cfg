 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_89_115 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_89
 set metric 5
 set as-path prepend 65002 65002 65002
 set community no-advertise no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_89_115 deny 65000














