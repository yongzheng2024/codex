!

ip prefix-list PL_EXPORT_DENY_LINK_65_1 seq 10 deny 10.181.0.196/31
!

ip prefix-list PL_EXPORT_DENY_LONG_65 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_65_0 seq 10 deny 10.180.0.66/32
!






route-map RM_POLICY_IN_65_111 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_65_111 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_65_0
 ! Block loopback 10.180.0.66/32


route-map RM_POLICY_OUT_65_111 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_65_0
 ! Block link 10.181.0.194/31


route-map RM_POLICY_OUT_65_111 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_65_1
 ! Block link 10.181.0.196/31


route-map RM_POLICY_OUT_65_111 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_65
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_65_111 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_65
 set metric 11
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_65_111 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.66
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



