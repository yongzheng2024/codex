 router-id 10.180.0.66
 passive-interface Loopback0
 network 10.180.0.66 0.0.0.0 area 0



network 10.181.0.194 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_65 seq 10 permit 10.200.61.0/24
ip prefix-list PL_EXPORT_ALLOWED_65 seq 20 permit 10.200.62.0/24
ip prefix-list PL_EXPORT_ALLOWED_65 seq 30 permit 10.200.63.0/24
