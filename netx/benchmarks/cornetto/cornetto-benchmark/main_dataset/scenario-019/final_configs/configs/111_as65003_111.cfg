!


route-map RM_POLICY_OUT_111_65 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_111_0
 ! Block loopback 10.180.0.112/32


route-map RM_POLICY_OUT_111_65 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_111_0
 ! Block link 10.181.0.196/31


route-map RM_POLICY_OUT_111_65 deny 70














