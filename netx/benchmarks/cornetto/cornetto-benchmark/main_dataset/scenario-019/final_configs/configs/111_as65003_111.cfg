 match ip address prefix-list PL_EXPORT_DENY_LINK_111_3
 ! Block link 10.181.1.26/31


route-map RM_POLICY_OUT_111_65 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_111
 set community 65000:200 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_111_65 deny 110














 match ip address prefix-list PL_EXPORT_DENY_LONG_111
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_111_65 deny 200














 match ip address prefix-list PL_OUT_111_65
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_111_65 deny 65000














