 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_111_65 permit 10














 match ip address prefix-list PL_IN_111_65
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_111_65 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_111_65 permit 1000














