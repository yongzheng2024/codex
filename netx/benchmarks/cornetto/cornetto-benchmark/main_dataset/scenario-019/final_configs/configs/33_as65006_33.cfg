!

ip prefix-list PL_EXPORT_DENY_LONG_33 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_33_0 seq 10 deny 10.180.0.34/32
!




ip community-list standard CL_COMM_33_29 permit no-export
!





route-map RM_POLICY_IN_33_29 permit 5














 match community CL_COMM_33_29
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_33_29 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_33_29 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_33_29 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_33_0
 ! Block loopback 10.180.0.34/32


route-map RM_POLICY_OUT_33_29 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_0
 ! Block link 10.181.0.110/31


route-map RM_POLICY_OUT_33_29 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_1
 ! Block link 10.181.0.96/31


route-map RM_POLICY_OUT_33_29 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_33
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_33_29 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_33
 set metric 6
 set as-path prepend 65006
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_33_29 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.34
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.104 peer-group RR




 !
 neighbor 10.181.0.96 peer-group EBGP
 neighbor 10.181.0.96 remote-as 65007


 !
 address-family ipv4

  neighbor 10.180.0.104 activate




  neighbor 10.181.0.96 activate
  neighbor 10.181.0.96 route-map RM_POLICY_IN_33_29 in
  neighbor 10.181.0.96 route-map RM_POLICY_OUT_33_29 out





  network 10.200.43.0 mask 255.255.255.0

  network 10.200.44.0 mask 255.255.255.0

  network 10.200.45.0 mask 255.255.255.0

 exit-address-family
