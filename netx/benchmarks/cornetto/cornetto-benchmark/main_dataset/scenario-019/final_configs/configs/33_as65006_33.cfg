ip access-list extended ACL_33_GigabitEthernet0_0
 10 permit ip host 10.180.0.30 any
 20 permit ip host 10.181.0.96 any
 30 permit ip host 10.181.0.97 any
 40 deny ip 192.0.2.0 0.0.0.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
