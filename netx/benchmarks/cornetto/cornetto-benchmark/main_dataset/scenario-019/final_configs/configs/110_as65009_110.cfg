ip route 10.200.9.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.111
 passive-interface Loopback0
 network 10.180.0.111 0.0.0.0 area 0



network 10.181.0.220 0.0.0.1 area 0
network 10.181.0.230 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_110 seq 10 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_110 seq 20 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_110_0 seq 10 deny 10.181.0.220/31
!

ip prefix-list PL_EXPORT_DENY_LINK_110_1 seq 10 deny 10.181.0.224/31
!

ip prefix-list PL_EXPORT_DENY_LINK_110_2 seq 10 deny 10.181.0.230/31
!

ip prefix-list PL_EXPORT_DENY_LONG_110 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_110_0 seq 10 deny 10.180.0.111/32
!






route-map RM_POLICY_OUT_110_74 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_110_0
 ! Block loopback 10.180.0.111/32


route-map RM_POLICY_OUT_110_74 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_110_0
 ! Block link 10.181.0.220/31


route-map RM_POLICY_OUT_110_74 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_110_1
 ! Block link 10.181.0.224/31


route-map RM_POLICY_OUT_110_74 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_110_2
 ! Block link 10.181.0.230/31


route-map RM_POLICY_OUT_110_74 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_110
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_110_74 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_110
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_110_74 deny 65000














 ! Deny other outbound routes

!







