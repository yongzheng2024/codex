!
interface Loopback101
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!



ip access-list extended ACL_110_GigabitEthernet0_1
 10 permit ip host 10.180.0.75 any
 20 permit ip host 10.181.0.224 any
 30 permit ip host 10.181.0.225 any
 40 deny ip 192.0.2.0 0.0.0.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 73_as65009_73 (73)

 ip address 10.181.0.221 255.255.255.254

