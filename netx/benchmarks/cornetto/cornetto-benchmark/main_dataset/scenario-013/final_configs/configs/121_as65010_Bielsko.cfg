
hostname 121_as65010_Bielsko
!
interface Loopback0
 ip address 10.180.0.122 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.16.0/24


 ip address 10.200.16.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.17.0/24


 ip address 10.200.17.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 110_as65010_Katowice (110)

 ip address 10.181.1.61 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 116_as65001_Ostrava (116)

 ip address 10.181.1.81 255.255.255.254
 mtu 1500
!


ip route 10.200.16.0 255.255.255.0 Loopback100
ip route 10.200.17.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.122
 passive-interface Loopback0
 network 10.180.0.122 0.0.0.0 area 0



network 10.181.1.60 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_121 seq 10 permit 10.200.16.0/24
ip prefix-list PL_EXPORT_ALLOWED_121 seq 20 permit 10.200.17.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_121_0 seq 10 deny 10.181.1.60/31
!

ip prefix-list PL_EXPORT_DENY_LINK_121_1 seq 10 deny 10.181.1.80/31
!

ip prefix-list PL_EXPORT_DENY_LONG_121 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_121_0 seq 10 deny 10.180.0.122/32
!






route-map RM_POLICY_IN_121_116 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_121_116 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_121_0
 ! Block loopback 10.180.0.122/32


route-map RM_POLICY_OUT_121_116 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_121_0
 ! Block link 10.181.1.60/31


route-map RM_POLICY_OUT_121_116 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_121_1
 ! Block link 10.181.1.80/31


route-map RM_POLICY_OUT_121_116 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_121
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_121_116 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_121
 set metric 11
 set as-path prepend 65010 65010
 ! Outbound policy baseline


route-map RM_POLICY_OUT_121_116 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.122
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65010
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.103 peer-group RR




 !
 neighbor 10.181.1.80 peer-group EBGP
 neighbor 10.181.1.80 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.103 activate




  neighbor 10.181.1.80 activate
  neighbor 10.181.1.80 route-map RM_POLICY_OUT_121_116 out





  network 10.200.16.0 mask 255.255.255.0

  network 10.200.17.0 mask 255.255.255.0

 exit-address-family
