
hostname 92_as65010_Leszno
!
interface Loopback0
 ip address 10.180.0.93 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.114.0/24


 ip address 10.200.114.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.115.0/24


 ip address 10.200.115.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 91_as65010_Wroclaw (91)

 ip address 10.181.1.27 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 94_as65002_Poznan (94)

 ip address 10.181.1.30 255.255.255.254
 mtu 1500
!


ip route 10.200.114.0 255.255.255.0 Loopback100
ip route 10.200.115.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.93
 passive-interface Loopback0
 network 10.180.0.93 0.0.0.0 area 0



network 10.181.1.26 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_92 seq 10 permit 10.200.114.0/24
ip prefix-list PL_EXPORT_ALLOWED_92 seq 20 permit 10.200.115.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_92_0 seq 10 deny 10.181.1.26/31
!

ip prefix-list PL_EXPORT_DENY_LINK_92_1 seq 10 deny 10.181.1.30/31
!

ip prefix-list PL_EXPORT_DENY_LONG_92 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_92_0 seq 10 deny 10.180.0.93/32
!




ip community-list standard CL_COMM_92_94 permit no-advertise
!





route-map RM_POLICY_IN_92_94 permit 5














 match community CL_COMM_92_94
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_92_94 permit 10














 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_92_94 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_92_94 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_92_0
 ! Block loopback 10.180.0.93/32


route-map RM_POLICY_OUT_92_94 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_92_0
 ! Block link 10.181.1.26/31


route-map RM_POLICY_OUT_92_94 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_92_1
 ! Block link 10.181.1.30/31


route-map RM_POLICY_OUT_92_94 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_92
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_92_94 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_92
 set metric 25
 set as-path prepend 65010 65010 65010
 set community 65000:100 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_92_94 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.93
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65010
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.103 peer-group RR


 !
 neighbor 10.180.0.108 peer-group RR




 !
 neighbor 10.181.1.31 peer-group EBGP
 neighbor 10.181.1.31 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.103 activate


  neighbor 10.180.0.108 activate




  neighbor 10.181.1.31 activate
  neighbor 10.181.1.31 route-map RM_POLICY_IN_92_94 in
  neighbor 10.181.1.31 route-map RM_POLICY_OUT_92_94 out





  network 10.200.114.0 mask 255.255.255.0

  network 10.200.115.0 mask 255.255.255.0

 exit-address-family
