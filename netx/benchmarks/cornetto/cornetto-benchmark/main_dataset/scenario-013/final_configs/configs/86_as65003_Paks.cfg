
hostname 86_as65003_Paks
!
interface Loopback0
 ip address 10.180.0.87 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.102.0/24


 ip address 10.200.102.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.103.0/24


 ip address 10.200.103.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.104.0/24


 ip address 10.200.104.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.105.0/24


 ip address 10.200.105.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 79_as65003_Kiskunhalas (79)

 ip address 10.181.1.1 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 129_as65004_Budapest (129)

 ip address 10.181.1.12 255.255.255.254
 mtu 1500
!


ip route 10.200.102.0 255.255.255.0 Loopback100
ip route 10.200.103.0 255.255.255.0 Loopback101
ip route 10.200.104.0 255.255.255.0 Loopback102
ip route 10.200.105.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.87
 passive-interface Loopback0
 network 10.180.0.87 0.0.0.0 area 0



network 10.181.1.0 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_86 seq 10 permit 10.200.102.0/24
ip prefix-list PL_EXPORT_ALLOWED_86 seq 20 permit 10.200.103.0/24
ip prefix-list PL_EXPORT_ALLOWED_86 seq 30 permit 10.200.104.0/24
ip prefix-list PL_EXPORT_ALLOWED_86 seq 40 permit 10.200.105.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_86_0 seq 10 deny 10.181.1.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_86_1 seq 10 deny 10.181.1.12/31
!

ip prefix-list PL_EXPORT_DENY_LONG_86 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_86_0 seq 10 deny 10.180.0.87/32
!






route-map RM_POLICY_IN_86_129 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_86_129 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_86_0
 ! Block loopback 10.180.0.87/32


route-map RM_POLICY_OUT_86_129 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_86_0
 ! Block link 10.181.1.0/31


route-map RM_POLICY_OUT_86_129 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_86_1
 ! Block link 10.181.1.12/31


route-map RM_POLICY_OUT_86_129 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_86
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_86_129 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_86
 set metric 16
 set as-path prepend 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_86_129 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.87
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.21 peer-group RR




 !
 neighbor 10.181.1.13 peer-group EBGP
 neighbor 10.181.1.13 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.21 activate




  neighbor 10.181.1.13 activate
  neighbor 10.181.1.13 route-map RM_POLICY_IN_86_129 in
  neighbor 10.181.1.13 route-map RM_POLICY_OUT_86_129 out





  network 10.200.102.0 mask 255.255.255.0

  network 10.200.103.0 mask 255.255.255.0

  network 10.200.104.0 mask 255.255.255.0

  network 10.200.105.0 mask 255.255.255.0

 exit-address-family
