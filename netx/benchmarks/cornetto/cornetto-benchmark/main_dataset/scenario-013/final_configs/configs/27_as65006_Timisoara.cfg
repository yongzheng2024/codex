
hostname 27_as65006_Timisoara
!
interface Loopback0
 ip address 10.180.0.28 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.64.0/24


 ip address 10.200.64.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.65.0/24


 ip address 10.200.65.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.66.0/24


 ip address 10.200.66.1 255.255.255.0
!



ip access-list extended ACL_27_GigabitEthernet0_2
 10 permit ip host 10.180.0.145 any
 20 permit ip host 10.181.0.90 any
 30 permit ip host 10.181.0.91 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 24_as65006_Arad (24)

 ip address 10.181.0.81 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 26_as65006_Caransebes (26)

 ip address 10.181.0.89 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 144_as65003_Sofia (144)

 ip address 10.181.0.90 255.255.255.254

 ip access-group ACL_27_GigabitEthernet0_2 in
 mtu 1500
!


ip route 10.200.64.0 255.255.255.0 Loopback100
ip route 10.200.65.0 255.255.255.0 Loopback101
ip route 10.200.66.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.28
 passive-interface Loopback0
 network 10.180.0.28 0.0.0.0 area 0



network 10.181.0.80 0.0.0.1 area 0
network 10.181.0.88 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_27 seq 10 permit 10.200.64.0/24
ip prefix-list PL_EXPORT_ALLOWED_27 seq 20 permit 10.200.65.0/24
ip prefix-list PL_EXPORT_ALLOWED_27 seq 30 permit 10.200.66.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_27_0 seq 10 deny 10.181.0.80/31
!

ip prefix-list PL_EXPORT_DENY_LINK_27_1 seq 10 deny 10.181.0.88/31
!

ip prefix-list PL_EXPORT_DENY_LINK_27_2 seq 10 deny 10.181.0.90/31
!

ip prefix-list PL_EXPORT_DENY_LONG_27 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_27_0 seq 10 deny 10.180.0.28/32
!




ip community-list standard CL_COMM_27_144 permit 65535:65282
ip community-list standard CL_COMM_27_144 permit no-advertise
!





route-map RM_POLICY_IN_27_144 permit 5














 match community CL_COMM_27_144
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_27_144 permit 10














 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_27_144 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_27_144 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_27_0
 ! Block loopback 10.180.0.28/32


route-map RM_POLICY_OUT_27_144 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_0
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_27_144 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_1
 ! Block link 10.181.0.88/31


route-map RM_POLICY_OUT_27_144 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_27_2
 ! Block link 10.181.0.90/31


route-map RM_POLICY_OUT_27_144 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_27
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_27_144 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_27
 set metric 12
 set as-path prepend 65006 65006 65006
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_27_144 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.28
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.25 peer-group RR




 !
 neighbor 10.181.0.91 peer-group EBGP
 neighbor 10.181.0.91 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.25 activate




  neighbor 10.181.0.91 activate
  neighbor 10.181.0.91 route-map RM_POLICY_IN_27_144 in
  neighbor 10.181.0.91 route-map RM_POLICY_OUT_27_144 out





  network 10.200.64.0 mask 255.255.255.0

  network 10.200.65.0 mask 255.255.255.0

  network 10.200.66.0 mask 255.255.255.0

 exit-address-family
