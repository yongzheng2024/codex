!






route-map RM_POLICY_IN_16_95 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_16_95 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_16_0
 ! Block loopback 10.180.0.17/32


route-map RM_POLICY_OUT_16_95 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_16_95 deny 70














