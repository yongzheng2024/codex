ip access-list extended ACL_90_GigabitEthernet0_0
 10 permit ip host 10.180.0.141 any
 20 permit ip host 10.181.1.22 any
 30 permit ip host 10.181.1.23 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
