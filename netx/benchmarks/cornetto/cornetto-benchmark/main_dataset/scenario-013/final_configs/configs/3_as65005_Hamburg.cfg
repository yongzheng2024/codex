
hostname 3_as65005_Hamburg
!
interface Loopback0
 ip address 10.180.0.4 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.67.0/24


 ip address 10.200.67.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.68.0/24


 ip address 10.200.68.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.69.0/24


 ip address 10.200.69.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.70.0/24


 ip address 10.200.70.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 2_as65005_Kobenhavn (2)

 ip address 10.181.0.7 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 125_as65004_Frankfurt-am-Main (125)

 ip address 10.181.0.8 255.255.255.254
 mtu 1500
!


ip route 10.200.67.0 255.255.255.0 Loopback100
ip route 10.200.68.0 255.255.255.0 Loopback101
ip route 10.200.69.0 255.255.255.0 Loopback102
ip route 10.200.70.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.4
 passive-interface Loopback0
 network 10.180.0.4 0.0.0.0 area 0



network 10.181.0.6 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_3 seq 10 permit 10.200.67.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 20 permit 10.200.68.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 30 permit 10.200.69.0/24
ip prefix-list PL_EXPORT_ALLOWED_3 seq 40 permit 10.200.70.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_3_0 seq 10 deny 10.181.0.6/31
!

ip prefix-list PL_EXPORT_DENY_LINK_3_1 seq 10 deny 10.181.0.8/31
!

ip prefix-list PL_EXPORT_DENY_LONG_3 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_3_0 seq 10 deny 10.180.0.4/32
!






route-map RM_POLICY_OUT_3_125 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_3_0
 ! Block loopback 10.180.0.4/32


route-map RM_POLICY_OUT_3_125 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_0
 ! Block link 10.181.0.6/31


route-map RM_POLICY_OUT_3_125 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_3_1
 ! Block link 10.181.0.8/31


route-map RM_POLICY_OUT_3_125 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_3
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_3_125 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_3
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_3_125 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.41 peer-group RR




 !
 neighbor 10.181.0.9 peer-group EBGP
 neighbor 10.181.0.9 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.41 activate




  neighbor 10.181.0.9 activate
  neighbor 10.181.0.9 route-map RM_POLICY_OUT_3_125 out





  network 10.200.67.0 mask 255.255.255.0

  network 10.200.68.0 mask 255.255.255.0

  network 10.200.69.0 mask 255.255.255.0

  network 10.200.70.0 mask 255.255.255.0

 exit-address-family
