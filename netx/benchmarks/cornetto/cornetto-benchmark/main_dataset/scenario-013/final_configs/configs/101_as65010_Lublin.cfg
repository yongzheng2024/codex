
hostname 101_as65010_Lublin
!
interface Loopback0
 ip address 10.180.0.102 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!



ip access-list extended ACL_101_GigabitEthernet0_0
 10 permit ip host 10.180.0.42 any
 20 permit ip host 10.181.0.146 any
 30 permit ip host 10.181.0.147 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 41_as65002_Warszawa (41)

 ip address 10.181.0.147 255.255.255.254

 ip access-group ACL_101_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 102_as65010_Rzeszow (102)

 ip address 10.181.1.48 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.102
 passive-interface Loopback0
 network 10.180.0.102 0.0.0.0 area 0



network 10.181.1.48 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_101 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_101 seq 20 permit 10.200.1.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_101_0 seq 10 deny 10.181.0.146/31
!

ip prefix-list PL_EXPORT_DENY_LINK_101_1 seq 10 deny 10.181.1.48/31
!

ip prefix-list PL_EXPORT_DENY_LONG_101 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_101_0 seq 10 deny 10.180.0.102/32
!

ip prefix-list PL_IN_101_41 seq 10 permit 10.200.73.0/24
ip prefix-list PL_IN_101_41 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_101_41 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_101_41 seq 10 permit 10.200.0.0/24
!






route-map RM_POLICY_IN_101_41 permit 10














 match ip address prefix-list PL_IN_101_41
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_101_41 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_101_41 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_101_0
 ! Block loopback 10.180.0.102/32


route-map RM_POLICY_OUT_101_41 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_101_0
 ! Block link 10.181.0.146/31


route-map RM_POLICY_OUT_101_41 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_101_1
 ! Block link 10.181.1.48/31


route-map RM_POLICY_OUT_101_41 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_101
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_101_41 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_101
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_101_41 deny 200














 match ip address prefix-list PL_OUT_101_41
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_101_41 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.102
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65010
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.103 peer-group RR




 !
 neighbor 10.181.0.146 peer-group EBGP
 neighbor 10.181.0.146 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.103 activate




  neighbor 10.181.0.146 activate
  neighbor 10.181.0.146 route-map RM_POLICY_IN_101_41 in
  neighbor 10.181.0.146 route-map RM_POLICY_OUT_101_41 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

 exit-address-family
