
hostname 37_as65001_Karlovy-Vary
!
interface Loopback0
 ip address 10.180.0.38 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 122_as65001_Most (122)

 ip address 10.181.0.126 255.255.255.254

 ip ospf network point-to-point
