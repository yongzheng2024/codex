 router-id 10.180.0.38
 passive-interface Loopback0
 network 10.180.0.38 0.0.0.0 area 0



network 10.181.0.126 0.0.0.1 area 0
network 10.181.0.128 0.0.0.1 area 0
!








router bgp 65001
 bgp router-id 10.180.0.38
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.71 peer-group RR


 !
 neighbor 10.180.0.131 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.71 activate


  neighbor 10.180.0.131 activate







 exit-address-family
