
hostname 78_as65004_Dunaujvaros
!
interface Loopback0
 ip address 10.180.0.79 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.94.0/24


 ip address 10.200.94.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.95.0/24


 ip address 10.200.95.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.96.0/24


 ip address 10.200.96.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 129_as65004_Budapest (129)

 ip address 10.181.0.248 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 85_as65003_Kecskemet (85)

 ip address 10.181.0.250 255.255.255.254
 mtu 1500
!


ip route 10.200.94.0 255.255.255.0 Loopback100
ip route 10.200.95.0 255.255.255.0 Loopback101
ip route 10.200.96.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.79
 passive-interface Loopback0
 network 10.180.0.79 0.0.0.0 area 0



network 10.181.0.248 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_78 seq 10 permit 10.200.94.0/24
ip prefix-list PL_EXPORT_ALLOWED_78 seq 20 permit 10.200.95.0/24
ip prefix-list PL_EXPORT_ALLOWED_78 seq 30 permit 10.200.96.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_78_0 seq 10 deny 10.181.0.248/31
!

ip prefix-list PL_EXPORT_DENY_LINK_78_1 seq 10 deny 10.181.0.250/31
!

ip prefix-list PL_EXPORT_DENY_LONG_78 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_78_0 seq 10 deny 10.180.0.79/32
!






route-map RM_POLICY_IN_78_85 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_78_85 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_78_0
 ! Block loopback 10.180.0.79/32


route-map RM_POLICY_OUT_78_85 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_78_0
 ! Block link 10.181.0.248/31


route-map RM_POLICY_OUT_78_85 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_78_1
 ! Block link 10.181.0.250/31


route-map RM_POLICY_OUT_78_85 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_78
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_78_85 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_78
 set metric 27
 set as-path prepend 65004 65004
 ! Outbound policy baseline


route-map RM_POLICY_OUT_78_85 deny 65000














 ! Deny other outbound routes

!







router bgp 65004
 bgp router-id 10.180.0.79
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65004
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.132 peer-group RR




 !
 neighbor 10.181.0.251 peer-group EBGP
 neighbor 10.181.0.251 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.132 activate




  neighbor 10.181.0.251 activate
  neighbor 10.181.0.251 route-map RM_POLICY_IN_78_85 in
  neighbor 10.181.0.251 route-map RM_POLICY_OUT_78_85 out





  network 10.200.94.0 mask 255.255.255.0

  network 10.200.95.0 mask 255.255.255.0

  network 10.200.96.0 mask 255.255.255.0

 exit-address-family
