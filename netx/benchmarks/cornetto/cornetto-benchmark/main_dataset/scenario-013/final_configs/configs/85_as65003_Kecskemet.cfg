
hostname 85_as65003_Kecskemet
!
interface Loopback0
 ip address 10.180.0.86 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.100.0/24


 ip address 10.200.100.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.101.0/24


 ip address 10.200.101.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.99.0/24


 ip address 10.200.99.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 78_as65004_Dunaujvaros (78)

 ip address 10.181.0.251 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 82_as65003_Szentes (82)

 ip address 10.181.1.5 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.100.0 255.255.255.0 Loopback100
ip route 10.200.101.0 255.255.255.0 Loopback101
ip route 10.200.99.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.86
 passive-interface Loopback0
 network 10.180.0.86 0.0.0.0 area 0



network 10.181.1.4 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_85 seq 10 permit 10.200.100.0/24
ip prefix-list PL_EXPORT_ALLOWED_85 seq 20 permit 10.200.101.0/24
ip prefix-list PL_EXPORT_ALLOWED_85 seq 30 permit 10.200.99.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_85_0 seq 10 deny 10.181.0.250/31
!

ip prefix-list PL_EXPORT_DENY_LINK_85_1 seq 10 deny 10.181.1.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_85 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_85_0 seq 10 deny 10.180.0.86/32
!






route-map RM_POLICY_OUT_85_78 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_85_0
 ! Block loopback 10.180.0.86/32


route-map RM_POLICY_OUT_85_78 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_85_0
 ! Block link 10.181.0.250/31


route-map RM_POLICY_OUT_85_78 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_85_1
 ! Block link 10.181.1.4/31


route-map RM_POLICY_OUT_85_78 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_85
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_85_78 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_85
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_85_78 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.86
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.21 peer-group RR




 !
 neighbor 10.181.0.250 peer-group EBGP
 neighbor 10.181.0.250 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.21 activate




  neighbor 10.181.0.250 activate
  neighbor 10.181.0.250 route-map RM_POLICY_OUT_85_78 out





  network 10.200.100.0 mask 255.255.255.0

  network 10.200.101.0 mask 255.255.255.0

  network 10.200.99.0 mask 255.255.255.0

 exit-address-family
