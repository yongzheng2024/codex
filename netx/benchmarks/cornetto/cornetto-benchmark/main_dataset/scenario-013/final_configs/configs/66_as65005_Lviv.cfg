
hostname 66_as65005_Lviv
!
interface Loopback0
 ip address 10.180.0.67 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.85.0/24


 ip address 10.200.85.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.86.0/24


 ip address 10.200.86.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.87.0/24


 ip address 10.200.87.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 40_as65005_Kyiv (40)

 ip address 10.181.0.141 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 102_as65010_Rzeszow (102)

 ip address 10.181.0.214 255.255.255.254
 mtu 1500
!


ip route 10.200.85.0 255.255.255.0 Loopback100
ip route 10.200.86.0 255.255.255.0 Loopback101
ip route 10.200.87.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.67
 passive-interface Loopback0
 network 10.180.0.67 0.0.0.0 area 0



network 10.181.0.140 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_66 seq 10 permit 10.200.85.0/24
ip prefix-list PL_EXPORT_ALLOWED_66 seq 20 permit 10.200.86.0/24
ip prefix-list PL_EXPORT_ALLOWED_66 seq 30 permit 10.200.87.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_66_0 seq 10 deny 10.181.0.140/31
!

ip prefix-list PL_EXPORT_DENY_LINK_66_1 seq 10 deny 10.181.0.214/31
!

ip prefix-list PL_EXPORT_DENY_LONG_66 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_66_0 seq 10 deny 10.180.0.67/32
!






route-map RM_POLICY_IN_66_102 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_66_102 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_66_0
 ! Block loopback 10.180.0.67/32


route-map RM_POLICY_OUT_66_102 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_0
 ! Block link 10.181.0.140/31


route-map RM_POLICY_OUT_66_102 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_1
 ! Block link 10.181.0.214/31


route-map RM_POLICY_OUT_66_102 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_66
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_66_102 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_66
 set metric 28
 set as-path prepend 65005 65005
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_66_102 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.67
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.45 peer-group RR


 !
 neighbor 10.180.0.41 peer-group RR




 !
 neighbor 10.181.0.215 peer-group EBGP
 neighbor 10.181.0.215 remote-as 65010


 !
 address-family ipv4

  neighbor 10.180.0.45 activate


  neighbor 10.180.0.41 activate




  neighbor 10.181.0.215 activate
  neighbor 10.181.0.215 route-map RM_POLICY_IN_66_102 in
  neighbor 10.181.0.215 route-map RM_POLICY_OUT_66_102 out





  network 10.200.85.0 mask 255.255.255.0

  network 10.200.86.0 mask 255.255.255.0

  network 10.200.87.0 mask 255.255.255.0

 exit-address-family
