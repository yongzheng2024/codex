ip route 10.200.119.0 255.255.255.0 Loopback100
ip route 10.200.120.0 255.255.255.0 Loopback101
ip route 10.200.121.0 255.255.255.0 Loopback102
ip route 10.200.122.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.96
 passive-interface Loopback0
 network 10.180.0.96 0.0.0.0 area 0



network 10.181.0.32 0.0.0.1 area 0
network 10.181.1.40 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_95 seq 10 permit 10.200.119.0/24
ip prefix-list PL_EXPORT_ALLOWED_95 seq 20 permit 10.200.120.0/24
ip prefix-list PL_EXPORT_ALLOWED_95 seq 30 permit 10.200.121.0/24
ip prefix-list PL_EXPORT_ALLOWED_95 seq 40 permit 10.200.122.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_95_0 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LINK_95_1 seq 10 deny 10.181.0.44/31
!

ip prefix-list PL_EXPORT_DENY_LINK_95_2 seq 10 deny 10.181.1.40/31
!

ip prefix-list PL_EXPORT_DENY_LONG_95 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_95_0 seq 10 deny 10.180.0.96/32
!






route-map RM_POLICY_OUT_95_16 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_95_0
 ! Block loopback 10.180.0.96/32


route-map RM_POLICY_OUT_95_16 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_95_0
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_95_16 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_95_1
 ! Block link 10.181.0.44/31


route-map RM_POLICY_OUT_95_16 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_95_2
 ! Block link 10.181.1.40/31


route-map RM_POLICY_OUT_95_16 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_95
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_95_16 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_95
 set community 65000:100 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_95_16 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.96
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.42 peer-group RR




 !
 neighbor 10.181.0.44 peer-group EBGP
 neighbor 10.181.0.44 remote-as 65008


 !
 address-family ipv4

  neighbor 10.180.0.42 activate




  neighbor 10.181.0.44 activate
  neighbor 10.181.0.44 route-map RM_POLICY_OUT_95_16 out





  network 10.200.119.0 mask 255.255.255.0

  network 10.200.120.0 mask 255.255.255.0

  network 10.200.121.0 mask 255.255.255.0

  network 10.200.122.0 mask 255.255.255.0

 exit-address-family
