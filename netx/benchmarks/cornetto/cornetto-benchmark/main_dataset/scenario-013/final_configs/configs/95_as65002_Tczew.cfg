
hostname 95_as65002_Tczew
!
interface Loopback0
 ip address 10.180.0.96 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.119.0/24


 ip address 10.200.119.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.120.0/24


 ip address 10.200.120.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.121.0/24


 ip address 10.200.121.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.122.0/24


 ip address 10.200.122.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 11_as65002_None (11)

 ip address 10.181.0.33 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 16_as65008_None (16)

 ip address 10.181.0.45 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 96_as65002_Bydgoszcz (96)

 ip address 10.181.1.40 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
