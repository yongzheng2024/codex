ip community-list standard CL_COMM_102_66 permit 65535:65282
!





route-map RM_POLICY_IN_102_66 permit 5














 match community CL_COMM_102_66
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_102_66 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_102_66 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_102_66 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_102_0
 ! Block loopback 10.180.0.103/32


route-map RM_POLICY_OUT_102_66 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_102_0
 ! Block link 10.181.0.214/31


route-map RM_POLICY_OUT_102_66 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_102_1
 ! Block link 10.181.0.218/31


route-map RM_POLICY_OUT_102_66 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_102_2
 ! Block link 10.181.1.48/31


