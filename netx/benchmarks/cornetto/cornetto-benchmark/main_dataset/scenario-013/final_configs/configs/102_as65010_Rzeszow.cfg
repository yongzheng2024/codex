 match ip address prefix-list PL_EXPORT_DENY_LONG_102
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_102_66 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_102
 set metric 24
 set as-path prepend 65010 65010
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_102_66 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.103
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.103


