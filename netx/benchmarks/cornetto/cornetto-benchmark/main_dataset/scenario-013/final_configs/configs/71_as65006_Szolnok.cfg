!

ip prefix-list PL_EXPORT_DENY_LINK_71_1 seq 10 deny 10.181.0.236/31
!

ip prefix-list PL_EXPORT_DENY_LONG_71 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_71_0 seq 10 deny 10.180.0.72/32
!






route-map RM_POLICY_IN_71_129 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_71_129 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_71_0
 ! Block loopback 10.180.0.72/32


route-map RM_POLICY_OUT_71_129 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_71_0
 ! Block link 10.181.0.234/31


route-map RM_POLICY_OUT_71_129 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_71_1
 ! Block link 10.181.0.236/31


route-map RM_POLICY_OUT_71_129 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_71
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_71_129 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_71
 set metric 30
 set as-path prepend 65006 65006
 set community no-advertise no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_71_129 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.72
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.26 peer-group RR




 !
 neighbor 10.181.0.237 peer-group EBGP
 neighbor 10.181.0.237 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.26 activate




  neighbor 10.181.0.237 activate
  neighbor 10.181.0.237 route-map RM_POLICY_IN_71_129 in
  neighbor 10.181.0.237 route-map RM_POLICY_OUT_71_129 out





  network 10.200.90.0 mask 255.255.255.0

  network 10.200.91.0 mask 255.255.255.0

  network 10.200.92.0 mask 255.255.255.0

  network 10.200.93.0 mask 255.255.255.0

 exit-address-family
