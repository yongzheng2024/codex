!


ip route 10.200.90.0 255.255.255.0 Loopback100
ip route 10.200.91.0 255.255.255.0 Loopback101
ip route 10.200.92.0 255.255.255.0 Loopback102
ip route 10.200.93.0 255.255.255.0 Loopback103
