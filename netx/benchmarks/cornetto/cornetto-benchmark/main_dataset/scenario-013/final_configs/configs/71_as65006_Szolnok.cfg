 router-id 10.180.0.72
 passive-interface Loopback0
 network 10.180.0.72 0.0.0.0 area 0



network 10.181.0.234 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_71 seq 10 permit 10.200.90.0/24
ip prefix-list PL_EXPORT_ALLOWED_71 seq 20 permit 10.200.91.0/24
ip prefix-list PL_EXPORT_ALLOWED_71 seq 30 permit 10.200.92.0/24
ip prefix-list PL_EXPORT_ALLOWED_71 seq 40 permit 10.200.93.0/24
