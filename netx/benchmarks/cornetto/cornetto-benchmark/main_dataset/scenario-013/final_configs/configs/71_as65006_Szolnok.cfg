ip access-list extended ACL_71_GigabitEthernet0_1
 10 permit ip host 10.180.0.130 any
 20 permit ip host 10.181.0.236 any
 30 permit ip host 10.181.0.237 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
