!

router ospf 1
 router-id 10.180.0.25
 passive-interface Loopback0
 network 10.180.0.25 0.0.0.0 area 0



network 10.181.0.80 0.0.0.1 area 0
network 10.181.0.82 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_24 seq 10 permit 10.200.61.0/24
ip prefix-list PL_EXPORT_ALLOWED_24 seq 20 permit 10.200.62.0/24
ip prefix-list PL_EXPORT_ALLOWED_24 seq 30 permit 10.200.63.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_24_0 seq 10 deny 10.181.0.78/31
!

ip prefix-list PL_EXPORT_DENY_LINK_24_1 seq 10 deny 10.181.0.80/31
!

ip prefix-list PL_EXPORT_DENY_LINK_24_2 seq 10 deny 10.181.0.82/31
!

ip prefix-list PL_EXPORT_DENY_LONG_24 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_24_0 seq 10 deny 10.180.0.25/32
!




ip community-list standard CL_COMM_24_81 permit no-export
!





route-map RM_POLICY_IN_24_81 permit 5














 match community CL_COMM_24_81
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_24_81 permit 10














 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_24_81 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_24_81 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_24_0
 ! Block loopback 10.180.0.25/32


route-map RM_POLICY_OUT_24_81 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_0
 ! Block link 10.181.0.78/31


route-map RM_POLICY_OUT_24_81 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_1
 ! Block link 10.181.0.80/31


route-map RM_POLICY_OUT_24_81 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_24_2
 ! Block link 10.181.0.82/31


route-map RM_POLICY_OUT_24_81 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_24
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_24_81 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_24
 set metric 27
 set as-path prepend 65006 65006 65006
 set community 65000:200 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_24_81 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.25
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.25


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65006
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.26 peer-group RR



 !
 neighbor 10.180.0.23 peer-group IBGP


 !
 neighbor 10.180.0.24 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP


 !
 neighbor 10.180.0.58 peer-group IBGP


 !
 neighbor 10.180.0.60 peer-group IBGP


 !
 neighbor 10.180.0.89 peer-group IBGP



 !
 neighbor 10.181.0.79 peer-group EBGP
 neighbor 10.181.0.79 remote-as 65003


 !
 address-family ipv4

  neighbor 10.180.0.26 activate



  neighbor 10.180.0.23 activate
  neighbor 10.180.0.23 next-hop-self


  neighbor 10.180.0.24 activate
  neighbor 10.180.0.24 next-hop-self


  neighbor 10.180.0.28 activate
  neighbor 10.180.0.28 next-hop-self


  neighbor 10.180.0.58 activate
  neighbor 10.180.0.58 next-hop-self


  neighbor 10.180.0.60 activate
  neighbor 10.180.0.60 next-hop-self


  neighbor 10.180.0.89 activate
  neighbor 10.180.0.89 next-hop-self



  neighbor 10.181.0.79 activate
  neighbor 10.181.0.79 route-map RM_POLICY_IN_24_81 in
  neighbor 10.181.0.79 route-map RM_POLICY_OUT_24_81 out





  network 10.200.61.0 mask 255.255.255.0

  network 10.200.62.0 mask 255.255.255.0

  network 10.200.63.0 mask 255.255.255.0

 exit-address-family
