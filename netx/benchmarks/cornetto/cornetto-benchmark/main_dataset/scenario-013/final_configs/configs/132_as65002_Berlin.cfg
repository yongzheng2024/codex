
hostname 132_as65002_Berlin
!
interface Loopback0
 ip address 10.180.0.133 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.34.0/24


 ip address 10.200.34.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.35.0/24


 ip address 10.200.35.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.36.0/24


 ip address 10.200.36.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 17_as65002_None (17)

 ip address 10.181.0.47 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

