  neighbor 10.180.0.131 activate




  neighbor 10.181.1.81 activate





  network 10.180.0.117 mask 255.255.255.255

  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

