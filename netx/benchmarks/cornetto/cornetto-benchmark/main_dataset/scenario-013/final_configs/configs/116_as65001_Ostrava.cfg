router bgp 65001
 bgp router-id 10.180.0.117
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.71 peer-group RR


 !
 neighbor 10.180.0.131 peer-group RR




 !
 neighbor 10.181.1.81 peer-group EBGP
 neighbor 10.181.1.81 remote-as 65010


 !
