
hostname 49_as65005_Helsinki
!
interface Loopback0
 ip address 10.180.0.50 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 128_as65005_Stockholm (128)

 ip address 10.181.0.172 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 127_as65005_Sankt-Peterburg (127)

 ip address 10.181.0.174 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


router ospf 1
 router-id 10.180.0.50
 passive-interface Loopback0
 network 10.180.0.50 0.0.0.0 area 0



network 10.181.0.172 0.0.0.1 area 0
network 10.181.0.174 0.0.0.1 area 0
!








router bgp 65005
 bgp router-id 10.180.0.50
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.45 peer-group RR


 !
 neighbor 10.180.0.41 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.45 activate


  neighbor 10.180.0.41 activate







 exit-address-family
