
hostname 6_as65003_BBN
!
interface Loopback0
 ip address 10.180.0.7 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.34.0/24


 ip address 10.200.34.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.35.0/24


 ip address 10.200.35.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.36.0/24


 ip address 10.200.36.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.37.0/24


 ip address 10.200.37.1 255.255.255.0
!



ip access-list extended ACL_6_GigabitEthernet0_1
 10 permit ip host 10.180.0.29 any
 20 permit ip host 10.181.0.26 any
 30 permit ip host 10.181.0.27 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 19_as65003_BBN (19)

 ip address 10.181.0.24 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 28_as65002_MIT (28)

 ip address 10.181.0.26 255.255.255.254

 ip access-group ACL_6_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.34.0 255.255.255.0 Loopback100
ip route 10.200.35.0 255.255.255.0 Loopback101
ip route 10.200.36.0 255.255.255.0 Loopback102
ip route 10.200.37.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.7
 passive-interface Loopback0
 network 10.180.0.7 0.0.0.0 area 0



network 10.181.0.24 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_6 seq 10 permit 10.200.34.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 20 permit 10.200.35.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 30 permit 10.200.36.0/24
ip prefix-list PL_EXPORT_ALLOWED_6 seq 40 permit 10.200.37.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_6_0 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_6_1 seq 10 deny 10.181.0.26/31
!

ip prefix-list PL_EXPORT_DENY_LONG_6 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_6_0 seq 10 deny 10.180.0.7/32
!




ip community-list standard CL_COMM_6_28 permit 65535:65282
!





route-map RM_POLICY_IN_6_28 permit 5














 match community CL_COMM_6_28
 set local-preference 150
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_6_28 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_6_28 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_6_28 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_6_0
 ! Block loopback 10.180.0.7/32


route-map RM_POLICY_OUT_6_28 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_0
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_6_28 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_6_1
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_6_28 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_6
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_6_28 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_6
 set metric 8
 set as-path prepend 65003 65003 65003
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_6_28 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.7
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.7


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.5 peer-group RR



 !
 neighbor 10.180.0.21 peer-group IBGP



 !
 neighbor 10.181.0.27 peer-group EBGP
 neighbor 10.181.0.27 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.5 activate



  neighbor 10.180.0.21 activate
  neighbor 10.180.0.21 next-hop-self



  neighbor 10.181.0.27 activate
  neighbor 10.181.0.27 route-map RM_POLICY_IN_6_28 in
  neighbor 10.181.0.27 route-map RM_POLICY_OUT_6_28 out





  network 10.200.34.0 mask 255.255.255.0

  network 10.200.35.0 mask 255.255.255.0

  network 10.200.36.0 mask 255.255.255.0

  network 10.200.37.0 mask 255.255.255.0

 exit-address-family
