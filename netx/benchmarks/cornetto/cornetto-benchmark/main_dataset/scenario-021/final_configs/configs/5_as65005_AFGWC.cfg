
hostname 5_as65005_AFGWC
!
interface Loopback0
 ip address 10.180.0.6 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 3_as65005_CASE (3)

 ip address 10.181.0.15 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 15_as65005_NOAA---Boulder--Colorado (15)

 ip address 10.181.0.22 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


router ospf 1
 router-id 10.180.0.6
 passive-interface Loopback0
 network 10.180.0.6 0.0.0.0 area 0



network 10.181.0.14 0.0.0.1 area 0
network 10.181.0.22 0.0.0.1 area 0
!








router bgp 65005
 bgp router-id 10.180.0.6
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.6


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65005
 neighbor IBGP update-source Loopback0



 !
 neighbor 10.180.0.4 peer-group RR



 !
 neighbor 10.180.0.16 peer-group IBGP


 !
 neighbor 10.180.0.19 peer-group IBGP



 !
 address-family ipv4

  neighbor 10.180.0.4 activate



  neighbor 10.180.0.16 activate
  neighbor 10.180.0.16 next-hop-self


  neighbor 10.180.0.19 activate
  neighbor 10.180.0.19 next-hop-self






 exit-address-family
