
hostname 28_as65002_MIT
!
interface Loopback0
 ip address 10.180.0.29 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.26.0/24


 ip address 10.200.26.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.27.0/24


 ip address 10.200.27.1 255.255.255.0
!



ip access-list extended ACL_28_GigabitEthernet0_1
 10 permit ip host 10.180.0.7 any
 20 permit ip host 10.181.0.26 any
 30 permit ip host 10.181.0.27 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 0_as65002_ILLINOIS (0)

 ip address 10.181.0.3 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 6_as65003_BBN (6)

 ip address 10.181.0.27 255.255.255.254

 ip access-group ACL_28_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 27_as65002_Lincoln (27)

 ip address 10.181.0.63 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.26.0 255.255.255.0 Loopback100
ip route 10.200.27.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.29
 passive-interface Loopback0
 network 10.180.0.29 0.0.0.0 area 0



network 10.181.0.2 0.0.0.1 area 0
network 10.181.0.62 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_28 seq 10 permit 10.200.26.0/24
ip prefix-list PL_EXPORT_ALLOWED_28 seq 20 permit 10.200.27.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_28_0 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LINK_28_1 seq 10 deny 10.181.0.26/31
!

ip prefix-list PL_EXPORT_DENY_LINK_28_2 seq 10 deny 10.181.0.62/31
!

ip prefix-list PL_EXPORT_DENY_LONG_28 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_28_0 seq 10 deny 10.180.0.29/32
!






route-map RM_POLICY_OUT_28_6 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_28_0
 ! Block loopback 10.180.0.29/32


route-map RM_POLICY_OUT_28_6 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_28_0
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_28_6 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_28_1
 ! Block link 10.181.0.26/31


route-map RM_POLICY_OUT_28_6 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_28_2
 ! Block link 10.181.0.62/31


route-map RM_POLICY_OUT_28_6 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_28
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_28_6 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_28
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_28_6 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.29
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP



 !
 neighbor 10.181.0.26 peer-group EBGP
 neighbor 10.181.0.26 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.13 activate


  neighbor 10.180.0.27 activate


  neighbor 10.180.0.28 activate



  neighbor 10.181.0.26 activate
  neighbor 10.181.0.26 route-map RM_POLICY_OUT_28_6 out





  network 10.200.26.0 mask 255.255.255.0

  network 10.200.27.0 mask 255.255.255.0

 exit-address-family
