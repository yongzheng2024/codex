
hostname 8_as65003_Tinker
!
interface Loopback0
 ip address 10.180.0.9 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.38.0/24


 ip address 10.200.38.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.39.0/24


 ip address 10.200.39.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.40.0/24


 ip address 10.200.40.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 4_as65003_ETAC (4)

 ip address 10.181.0.17 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 13_as65001_RAND (13)

 ip address 10.181.0.30 255.255.255.254
 mtu 1500
!


ip route 10.200.38.0 255.255.255.0 Loopback100
ip route 10.200.39.0 255.255.255.0 Loopback101
ip route 10.200.40.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.9
 passive-interface Loopback0
 network 10.180.0.9 0.0.0.0 area 0



network 10.181.0.16 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_8 seq 10 permit 10.200.38.0/24
ip prefix-list PL_EXPORT_ALLOWED_8 seq 20 permit 10.200.39.0/24
ip prefix-list PL_EXPORT_ALLOWED_8 seq 30 permit 10.200.40.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_8_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_8_1 seq 10 deny 10.181.0.30/31
!

ip prefix-list PL_EXPORT_DENY_LONG_8 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_8_0 seq 10 deny 10.180.0.9/32
!




ip community-list standard CL_COMM_8_13 permit no-advertise
!





route-map RM_POLICY_IN_8_13 permit 5














 match community CL_COMM_8_13
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_8_13 permit 10














 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_8_13 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_8_13 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_8_0
 ! Block loopback 10.180.0.9/32


route-map RM_POLICY_OUT_8_13 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_8_13 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_8_1
 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_8_13 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_8
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_8_13 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_8
 set metric 29
 set as-path prepend 65003 65003 65003
 set community 65000:200 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_8_13 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.9
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.5 peer-group RR




 !
 neighbor 10.181.0.31 peer-group EBGP
 neighbor 10.181.0.31 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.5 activate




  neighbor 10.181.0.31 activate
  neighbor 10.181.0.31 route-map RM_POLICY_IN_8_13 in
  neighbor 10.181.0.31 route-map RM_POLICY_OUT_8_13 out





  network 10.200.38.0 mask 255.255.255.0

  network 10.200.39.0 mask 255.255.255.0

  network 10.200.40.0 mask 255.255.255.0

 exit-address-family
