
hostname 21_as65001_SRI
!
interface Loopback0
 ip address 10.180.0.22 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.20.0/24


 ip address 10.200.20.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.21.0/24


 ip address 10.200.21.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.22.0/24


 ip address 10.200.22.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 9_as65001_AMES (9)

 ip address 10.181.0.33 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 12_as65002_McClellan (12)

 ip address 10.181.0.41 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 22_as65001_UCSB (22)

 ip address 10.181.0.58 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.20.0 255.255.255.0 Loopback100
ip route 10.200.21.0 255.255.255.0 Loopback101
ip route 10.200.22.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.22
 passive-interface Loopback0
 network 10.180.0.22 0.0.0.0 area 0



network 10.181.0.32 0.0.0.1 area 0
network 10.181.0.58 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_21 seq 10 permit 10.200.20.0/24
ip prefix-list PL_EXPORT_ALLOWED_21 seq 20 permit 10.200.21.0/24
ip prefix-list PL_EXPORT_ALLOWED_21 seq 30 permit 10.200.22.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_21_0 seq 10 deny 10.181.0.32/31
!

ip prefix-list PL_EXPORT_DENY_LINK_21_1 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LINK_21_2 seq 10 deny 10.181.0.58/31
!

ip prefix-list PL_EXPORT_DENY_LONG_21 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_21_0 seq 10 deny 10.180.0.22/32
!




ip community-list standard CL_COMM_21_12 permit 65535:65282
!





route-map RM_POLICY_IN_21_12 permit 5














 match community CL_COMM_21_12
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_21_12 permit 10














 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_21_12 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_21_12 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_21_0
 ! Block loopback 10.180.0.22/32


route-map RM_POLICY_OUT_21_12 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_0
 ! Block link 10.181.0.32/31


route-map RM_POLICY_OUT_21_12 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_1
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_21_12 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_21_2
 ! Block link 10.181.0.58/31


route-map RM_POLICY_OUT_21_12 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_21
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_21_12 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_21
 set metric 7
 set as-path prepend 65001 65001 65001
 set community 65000:200 no-advertise additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_21_12 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.22
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.14 peer-group RR




 !
 neighbor 10.181.0.40 peer-group EBGP
 neighbor 10.181.0.40 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.14 activate




  neighbor 10.181.0.40 activate
  neighbor 10.181.0.40 route-map RM_POLICY_IN_21_12 in
  neighbor 10.181.0.40 route-map RM_POLICY_OUT_21_12 out





  network 10.200.20.0 mask 255.255.255.0

  network 10.200.21.0 mask 255.255.255.0

  network 10.200.22.0 mask 255.255.255.0

 exit-address-family
