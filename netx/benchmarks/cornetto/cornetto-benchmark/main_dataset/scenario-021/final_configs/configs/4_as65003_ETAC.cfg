
hostname 4_as65003_ETAC
!
interface Loopback0
 ip address 10.180.0.5 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.32.0/24


 ip address 10.200.32.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.33.0/24


 ip address 10.200.33.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 8_as65003_Tinker (8)

 ip address 10.181.0.16 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 10_as65004_ARPA (10)

 ip address 10.181.0.18 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/2
 description to 7_as65003_NBS (7)

 ip address 10.181.0.20 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.32.0 255.255.255.0 Loopback100
ip route 10.200.33.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.5
 passive-interface Loopback0
 network 10.180.0.5 0.0.0.0 area 0



network 10.181.0.16 0.0.0.1 area 0
network 10.181.0.20 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_4 seq 10 permit 10.200.32.0/24
ip prefix-list PL_EXPORT_ALLOWED_4 seq 20 permit 10.200.33.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_4_0 seq 10 deny 10.181.0.16/31
!

ip prefix-list PL_EXPORT_DENY_LINK_4_1 seq 10 deny 10.181.0.18/31
!

ip prefix-list PL_EXPORT_DENY_LINK_4_2 seq 10 deny 10.181.0.20/31
!

ip prefix-list PL_EXPORT_DENY_LONG_4 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_4_0 seq 10 deny 10.180.0.5/32
!

ip prefix-list PL_IN_4_10 seq 10 permit 10.180.0.11/32
ip prefix-list PL_IN_4_10 seq 20 permit 10.181.0.18/31
ip prefix-list PL_IN_4_10 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_4_10 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_4_10 seq 10 permit 10.200.33.0/24
ip prefix-list PL_OUT_4_10 seq 20 permit 10.200.32.0/24
!






route-map RM_POLICY_IN_4_10 permit 10














 match ip address prefix-list PL_IN_4_10
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_4_10 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_4_10 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_4_0
 ! Block loopback 10.180.0.5/32


route-map RM_POLICY_OUT_4_10 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_0
 ! Block link 10.181.0.16/31


route-map RM_POLICY_OUT_4_10 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_1
 ! Block link 10.181.0.18/31


route-map RM_POLICY_OUT_4_10 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_4_2
 ! Block link 10.181.0.20/31


route-map RM_POLICY_OUT_4_10 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_4
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_4_10 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_4
 set metric 22
 set as-path prepend 65003 65003 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_4_10 deny 200














 match ip address prefix-list PL_OUT_4_10
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_4_10 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.5
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.7


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0


 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.7 peer-group RR



 !
 neighbor 10.180.0.8 peer-group IBGP


 !
 neighbor 10.180.0.9 peer-group IBGP


 !
 neighbor 10.180.0.20 peer-group IBGP



 !
 neighbor 10.181.0.19 peer-group EBGP
 neighbor 10.181.0.19 remote-as 65004


 !
 address-family ipv4

  neighbor 10.180.0.7 activate



  neighbor 10.180.0.8 activate
  neighbor 10.180.0.8 next-hop-self


  neighbor 10.180.0.9 activate
  neighbor 10.180.0.9 next-hop-self


  neighbor 10.180.0.20 activate
  neighbor 10.180.0.20 next-hop-self



  neighbor 10.181.0.19 activate
  neighbor 10.181.0.19 route-map RM_POLICY_IN_4_10 in
  neighbor 10.181.0.19 route-map RM_POLICY_OUT_4_10 out





  network 10.200.32.0 mask 255.255.255.0

  network 10.200.33.0 mask 255.255.255.0

 exit-address-family
