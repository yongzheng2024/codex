
hostname 12_as65002_McClellan
!
interface Loopback0
 ip address 10.180.0.13 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.6.0/24


 ip address 10.200.6.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!



ip access-list extended ACL_12_GigabitEthernet0_1
 10 permit ip host 10.180.0.22 any
 20 permit ip host 10.181.0.40 any
 30 permit ip host 10.181.0.41 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 26_as65002_UTAH (26)

 ip address 10.181.0.38 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 21_as65001_SRI (21)

 ip address 10.181.0.40 255.255.255.254

 ip access-group ACL_12_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.6.0 255.255.255.0 Loopback100
ip route 10.200.7.0 255.255.255.0 Loopback101
ip route 10.200.8.0 255.255.255.0 Loopback102
ip route 10.200.9.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.13
 passive-interface Loopback0
 network 10.180.0.13 0.0.0.0 area 0



network 10.181.0.38 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_12 seq 10 permit 10.200.6.0/24
ip prefix-list PL_EXPORT_ALLOWED_12 seq 20 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_12 seq 30 permit 10.200.8.0/24
ip prefix-list PL_EXPORT_ALLOWED_12 seq 40 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_12_0 seq 10 deny 10.181.0.38/31
!

ip prefix-list PL_EXPORT_DENY_LINK_12_1 seq 10 deny 10.181.0.40/31
!

ip prefix-list PL_EXPORT_DENY_LONG_12 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_12_0 seq 10 deny 10.180.0.13/32
!

ip prefix-list PL_IN_12_21 seq 10 permit 10.181.0.32/31
ip prefix-list PL_IN_12_21 seq 20 permit 10.200.20.0/24
ip prefix-list PL_IN_12_21 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_12_21 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_12_21 seq 10 permit 10.200.9.0/24
ip prefix-list PL_OUT_12_21 seq 20 permit 10.200.8.0/24
!






route-map RM_POLICY_IN_12_21 permit 10














 match ip address prefix-list PL_IN_12_21
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_12_21 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_12_21 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_12_0
 ! Block loopback 10.180.0.13/32


route-map RM_POLICY_OUT_12_21 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_0
 ! Block link 10.181.0.38/31


route-map RM_POLICY_OUT_12_21 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_12_1
 ! Block link 10.181.0.40/31


route-map RM_POLICY_OUT_12_21 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_12
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_12_21 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_12
 set community no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_12_21 deny 200














 match ip address prefix-list PL_OUT_12_21
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_12_21 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.13
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP


 !
 neighbor 10.180.0.29 peer-group IBGP



 !
 neighbor 10.181.0.41 peer-group EBGP
 neighbor 10.181.0.41 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.27 activate


  neighbor 10.180.0.28 activate


  neighbor 10.180.0.29 activate



  neighbor 10.181.0.41 activate
  neighbor 10.181.0.41 route-map RM_POLICY_IN_12_21 in
  neighbor 10.181.0.41 route-map RM_POLICY_OUT_12_21 out





  network 10.200.6.0 mask 255.255.255.0

  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
