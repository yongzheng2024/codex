router ospf 1
 router-id 10.180.0.14
 passive-interface Loopback0
 network 10.180.0.14 0.0.0.0 area 0



network 10.181.0.42 0.0.0.1 area 0
network 10.181.0.44 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_13 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_13 seq 20 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_13 seq 30 permit 10.200.12.0/24
ip prefix-list PL_EXPORT_ALLOWED_13 seq 40 permit 10.200.13.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_13_0 seq 10 deny 10.181.0.30/31
!

ip prefix-list PL_EXPORT_DENY_LINK_13_1 seq 10 deny 10.181.0.42/31
!

ip prefix-list PL_EXPORT_DENY_LINK_13_2 seq 10 deny 10.181.0.44/31
!

ip prefix-list PL_EXPORT_DENY_LONG_13 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_13_0 seq 10 deny 10.180.0.14/32
!

ip prefix-list PL_IN_13_8 seq 10 permit 10.200.39.0/24
ip prefix-list PL_IN_13_8 seq 20 permit 10.181.0.30/31
ip prefix-list PL_IN_13_8 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_13_8 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_13_8 seq 10 permit 10.200.12.0/24
ip prefix-list PL_OUT_13_8 seq 20 permit 10.200.11.0/24
!






route-map RM_POLICY_IN_13_8 permit 10














 match ip address prefix-list PL_IN_13_8
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_13_8 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_13_8 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_13_0
 ! Block loopback 10.180.0.14/32


route-map RM_POLICY_OUT_13_8 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_0
 ! Block link 10.181.0.30/31


route-map RM_POLICY_OUT_13_8 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_1
 ! Block link 10.181.0.42/31


route-map RM_POLICY_OUT_13_8 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_13_2
 ! Block link 10.181.0.44/31


route-map RM_POLICY_OUT_13_8 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_13
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_13_8 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_13
 set metric 26
 set as-path prepend 65001 65001
 set community 65000:100 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_13_8 deny 200














 match ip address prefix-list PL_OUT_13_8
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_13_8 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.14
 bgp log-neighbor-changes
 no bgp default ipv4-unicast

 bgp cluster-id 10.180.0.14



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.15 peer-group IBGP


 !
 neighbor 10.180.0.22 peer-group IBGP


 !
 neighbor 10.180.0.23 peer-group IBGP


 !
 neighbor 10.180.0.24 peer-group IBGP


 !
 neighbor 10.180.0.25 peer-group IBGP



 !
 neighbor 10.181.0.30 peer-group EBGP
 neighbor 10.181.0.30 remote-as 65003


 !
 address-family ipv4


  neighbor 10.180.0.10 activate
  neighbor 10.180.0.10 next-hop-self


  neighbor 10.180.0.15 activate
  neighbor 10.180.0.15 next-hop-self


  neighbor 10.180.0.22 activate
  neighbor 10.180.0.22 next-hop-self


  neighbor 10.180.0.23 activate
  neighbor 10.180.0.23 next-hop-self


  neighbor 10.180.0.24 activate
  neighbor 10.180.0.24 next-hop-self


  neighbor 10.180.0.25 activate
  neighbor 10.180.0.25 next-hop-self



  neighbor 10.181.0.30 activate
  neighbor 10.181.0.30 route-map RM_POLICY_IN_13_8 in
  neighbor 10.181.0.30 route-map RM_POLICY_OUT_13_8 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.11.0 mask 255.255.255.0

  network 10.200.12.0 mask 255.255.255.0

  network 10.200.13.0 mask 255.255.255.0

 exit-address-family
