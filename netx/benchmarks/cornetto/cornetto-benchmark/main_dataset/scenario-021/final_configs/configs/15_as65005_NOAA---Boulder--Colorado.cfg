
hostname 15_as65005_NOAA---Boulder--Colorado
!
interface Loopback0
 ip address 10.180.0.16 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 5_as65005_AFGWC (5)

 ip address 10.181.0.23 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 25_as65005_USC (25)

 ip address 10.181.0.48 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


router ospf 1
 router-id 10.180.0.16
 passive-interface Loopback0
 network 10.180.0.16 0.0.0.0 area 0



network 10.181.0.22 0.0.0.1 area 0
network 10.181.0.48 0.0.0.1 area 0
!








router bgp 65005
 bgp router-id 10.180.0.16
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.6 peer-group RR


 !
 neighbor 10.180.0.4 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.6 activate


  neighbor 10.180.0.4 activate







 exit-address-family
