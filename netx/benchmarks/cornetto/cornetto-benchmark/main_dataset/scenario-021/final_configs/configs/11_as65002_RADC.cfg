
hostname 11_as65002_RADC
!
interface Loopback0
 ip address 10.180.0.12 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.4.0/24


 ip address 10.200.4.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.5.0/24


 ip address 10.200.5.1 255.255.255.0
!



ip access-list extended ACL_11_GigabitEthernet0_0
 10 permit ip host 10.180.0.4 any
 20 permit ip host 10.181.0.12 any
 30 permit ip host 10.181.0.13 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 3_as65005_CASE (3)

 ip address 10.181.0.13 255.255.255.254

 ip access-group ACL_11_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 27_as65002_Lincoln (27)

 ip address 10.181.0.36 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!


ip route 10.200.4.0 255.255.255.0 Loopback100
ip route 10.200.5.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.12
 passive-interface Loopback0
 network 10.180.0.12 0.0.0.0 area 0



network 10.181.0.36 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_11 seq 10 permit 10.200.4.0/24
ip prefix-list PL_EXPORT_ALLOWED_11 seq 20 permit 10.200.5.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_11_0 seq 10 deny 10.181.0.12/31
!

ip prefix-list PL_EXPORT_DENY_LINK_11_1 seq 10 deny 10.181.0.36/31
!

ip prefix-list PL_EXPORT_DENY_LONG_11 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_11_0 seq 10 deny 10.180.0.12/32
!

ip prefix-list PL_IN_11_3 seq 10 permit 10.200.31.0/24
ip prefix-list PL_IN_11_3 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_11_3 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_11_3 seq 10 permit 10.200.4.0/24
!






route-map RM_POLICY_IN_11_3 permit 10














 match ip address prefix-list PL_IN_11_3
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_11_3 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_11_3 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_11_0
 ! Block loopback 10.180.0.12/32


route-map RM_POLICY_OUT_11_3 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_0
 ! Block link 10.181.0.12/31


route-map RM_POLICY_OUT_11_3 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_11_1
 ! Block link 10.181.0.36/31


route-map RM_POLICY_OUT_11_3 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_11
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_11_3 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_11
 set metric 24
 set as-path prepend 65002
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_11_3 deny 200














 match ip address prefix-list PL_OUT_11_3
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_11_3 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.12
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65002
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.13 peer-group IBGP


 !
 neighbor 10.180.0.27 peer-group IBGP


 !
 neighbor 10.180.0.28 peer-group IBGP


 !
 neighbor 10.180.0.29 peer-group IBGP



 !
 neighbor 10.181.0.12 peer-group EBGP
 neighbor 10.181.0.12 remote-as 65005


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.13 activate


  neighbor 10.180.0.27 activate


  neighbor 10.180.0.28 activate


  neighbor 10.180.0.29 activate



  neighbor 10.181.0.12 activate
  neighbor 10.181.0.12 route-map RM_POLICY_IN_11_3 in
  neighbor 10.181.0.12 route-map RM_POLICY_OUT_11_3 out





  network 10.200.4.0 mask 255.255.255.0

  network 10.200.5.0 mask 255.255.255.0

 exit-address-family
