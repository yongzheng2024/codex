
hostname 23_as65001_UCLA
!
interface Loopback0
 ip address 10.180.0.24 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.23.0/24


 ip address 10.200.23.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.24.0/24


 ip address 10.200.24.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.25.0/24


 ip address 10.200.25.1 255.255.255.0
!



ip access-list extended ACL_23_GigabitEthernet0_1
 10 permit ip host 10.180.0.19 any
 20 permit ip host 10.181.0.54 any
 30 permit ip host 10.181.0.55 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 192.0.2.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 13_as65001_RAND (13)

 ip address 10.181.0.45 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/1
 description to 18_as65005_SDC (18)

 ip address 10.181.0.55 255.255.255.254

 ip access-group ACL_23_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 22_as65001_UCSB (22)

 ip address 10.181.0.61 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
