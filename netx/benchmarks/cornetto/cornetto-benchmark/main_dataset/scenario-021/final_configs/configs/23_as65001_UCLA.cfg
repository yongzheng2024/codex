ip route 10.200.23.0 255.255.255.0 Loopback100
ip route 10.200.24.0 255.255.255.0 Loopback101
ip route 10.200.25.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.24
 passive-interface Loopback0
 network 10.180.0.24 0.0.0.0 area 0



network 10.181.0.44 0.0.0.1 area 0
network 10.181.0.60 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_23 seq 10 permit 10.200.23.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 20 permit 10.200.24.0/24
ip prefix-list PL_EXPORT_ALLOWED_23 seq 30 permit 10.200.25.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_23_0 seq 10 deny 10.181.0.44/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_1 seq 10 deny 10.181.0.54/31
!

ip prefix-list PL_EXPORT_DENY_LINK_23_2 seq 10 deny 10.181.0.60/31
!

ip prefix-list PL_EXPORT_DENY_LONG_23 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_23_0 seq 10 deny 10.180.0.24/32
!

ip prefix-list PL_IN_23_18 seq 10 permit 10.181.0.54/31
ip prefix-list PL_IN_23_18 seq 20 permit 10.180.0.19/32
ip prefix-list PL_IN_23_18 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_23_18 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_23_18 seq 10 permit 10.200.25.0/24
!






route-map RM_POLICY_IN_23_18 permit 10














 match ip address prefix-list PL_IN_23_18
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_23_18 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_23_18 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_23_0
 ! Block loopback 10.180.0.24/32


route-map RM_POLICY_OUT_23_18 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_0
 ! Block link 10.181.0.44/31


route-map RM_POLICY_OUT_23_18 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_1
 ! Block link 10.181.0.54/31


route-map RM_POLICY_OUT_23_18 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_23_2
 ! Block link 10.181.0.60/31


route-map RM_POLICY_OUT_23_18 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_23
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_23_18 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_23
 set metric 5
 set as-path prepend 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_23_18 deny 200














 match ip address prefix-list PL_OUT_23_18
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_23_18 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.24
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.14 peer-group RR




 !
 neighbor 10.181.0.54 peer-group EBGP
 neighbor 10.181.0.54 remote-as 65005


 !
 address-family ipv4

  neighbor 10.180.0.14 activate




  neighbor 10.181.0.54 activate
  neighbor 10.181.0.54 route-map RM_POLICY_IN_23_18 in
  neighbor 10.181.0.54 route-map RM_POLICY_OUT_23_18 out





  network 10.200.23.0 mask 255.255.255.0

  network 10.200.24.0 mask 255.255.255.0

  network 10.200.25.0 mask 255.255.255.0

 exit-address-family
