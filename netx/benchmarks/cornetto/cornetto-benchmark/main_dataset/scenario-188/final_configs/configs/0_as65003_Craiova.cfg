
hostname 0_as65003_Craiova
!
interface Loopback0
 ip address 10.180.0.1 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.0.0/24


 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!



ip access-list extended ACL_0_GigabitEthernet0_1
 10 permit ip host 10.180.0.6 any
 20 permit ip host 10.181.0.2 any
 30 permit ip host 10.181.0.3 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 198.18.0.0 0.1.255.255 any
!


interface GigabitEthernet0/0
 description to 11_as65003_Timisoara (11)

 ip address 10.181.0.0 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 5_as65001_Bucarest (5)

 ip address 10.181.0.2 255.255.255.254

 ip access-group ACL_0_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.0.0 255.255.255.0 Loopback100
ip route 10.200.1.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.eb00.0000.0ab4.0001.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_0 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_0 seq 20 permit 10.200.1.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_0_0 seq 10 deny 10.181.0.0/31
!

ip prefix-list PL_EXPORT_DENY_LINK_0_1 seq 10 deny 10.181.0.2/31
!

ip prefix-list PL_EXPORT_DENY_LONG_0 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_0_0 seq 10 deny 10.180.0.1/32
!

ip prefix-list PL_IN_0_5 seq 10 permit 10.200.16.0/24
ip prefix-list PL_IN_0_5 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_0_5 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_0_5 seq 10 permit 10.200.1.0/24
ip prefix-list PL_OUT_0_5 seq 20 permit 10.200.0.0/24
!




ip community-list standard CL_COMM_0_5 permit 65535:65282
ip community-list standard CL_COMM_0_5 permit no-export
!





route-map RM_POLICY_IN_0_5 permit 5














 match community CL_COMM_0_5
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_0_5 permit 10














 match ip address prefix-list PL_IN_0_5
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_0_5 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_0_5 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_0_5 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_0_0
 ! Block loopback 10.180.0.1/32


route-map RM_POLICY_OUT_0_5 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_0
 ! Block link 10.181.0.0/31


route-map RM_POLICY_OUT_0_5 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_0_1
 ! Block link 10.181.0.2/31


route-map RM_POLICY_OUT_0_5 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_0
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_0_5 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_0
 set metric 7
 set as-path prepend 65003 65003
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_0_5 deny 200














 match ip address prefix-list PL_OUT_0_5
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_0_5 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65003
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.10 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP


 !
 neighbor 10.180.0.17 peer-group IBGP


 !
 neighbor 10.180.0.21 peer-group IBGP



 !
 neighbor 10.181.0.3 peer-group EBGP
 neighbor 10.181.0.3 remote-as 65001


 !
 address-family ipv4


  neighbor 10.180.0.10 activate


  neighbor 10.180.0.12 activate


  neighbor 10.180.0.17 activate


  neighbor 10.180.0.21 activate



  neighbor 10.181.0.3 activate
  neighbor 10.181.0.3 route-map RM_POLICY_IN_0_5 in
  neighbor 10.181.0.3 route-map RM_POLICY_OUT_0_5 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

 exit-address-family
