
hostname 10_as65001_10
!
interface Loopback0
 ip address 10.180.0.11 255.255.255.255







 ip router isis 1

 isis circuit-type level-1

!
interface Loopback100
 description Customer network 10.200.0.0/24

 shutdown

 ip address 10.200.0.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.1.0/24


 ip address 10.200.1.1 255.255.255.0
!



ip access-list extended ACL_10_GigabitEthernet0_1
 10 permit ip host 10.180.0.20 any
 20 permit ip host 10.181.0.24 any
 30 permit ip host 10.181.0.25 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 192.0.2.0 0.0.0.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 1_as65001_1 (1)

 ip address 10.181.0.5 255.255.255.254








 ip router isis 1

 isis metric 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 19_as65002_19 (19)

 ip address 10.181.0.24 255.255.255.254

 ip access-group ACL_10_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.1.0 255.255.255.0 Loopback101
!

router isis 1
 net 31.e900.0000.0ab4.000b.00
 is-type level-1
 metric-style wide
 passive-interface Loopback0
!


ip prefix-list PL_EXPORT_ALLOWED_10 seq 10 permit 10.200.0.0/24
ip prefix-list PL_EXPORT_ALLOWED_10 seq 20 permit 10.200.1.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_10_0 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_10_1 seq 10 deny 10.181.0.4/31
!

ip prefix-list PL_EXPORT_DENY_LONG_10 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_10_0 seq 10 deny 10.180.0.11/32
!

ip prefix-list PL_IN_10_19 seq 10 permit 10.200.4.0/24
ip prefix-list PL_IN_10_19 seq 20 permit 10.181.0.20/31
ip prefix-list PL_IN_10_19 seq 30 permit 10.181.0.40/31
ip prefix-list PL_IN_10_19 seq 40 permit 10.181.0.28/31
ip prefix-list PL_IN_10_19 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_10_19 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_10_19 seq 10 permit 10.200.0.0/24
!






route-map RM_POLICY_IN_10_19 permit 10














 match ip address prefix-list PL_IN_10_19
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_10_19 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_10_19 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_10_0
 ! Block loopback 10.180.0.11/32


route-map RM_POLICY_OUT_10_19 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_0
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_10_19 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_10_1
 ! Block link 10.181.0.4/31


route-map RM_POLICY_OUT_10_19 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_10
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_10_19 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_10
 set community 65000:200 additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_10_19 deny 200














 match ip address prefix-list PL_OUT_10_19
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_10_19 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast



 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65001
 neighbor IBGP update-source Loopback0


 !
 neighbor EBGP peer-group



 !
 neighbor 10.180.0.1 peer-group IBGP


 !
 neighbor 10.180.0.2 peer-group IBGP


 !
 neighbor 10.180.0.3 peer-group IBGP


 !
 neighbor 10.180.0.4 peer-group IBGP


 !
 neighbor 10.180.0.7 peer-group IBGP


 !
 neighbor 10.180.0.12 peer-group IBGP



 !
 neighbor 10.181.0.25 peer-group EBGP
 neighbor 10.181.0.25 remote-as 65002


 !
 address-family ipv4


  neighbor 10.180.0.1 activate


  neighbor 10.180.0.2 activate


  neighbor 10.180.0.3 activate


  neighbor 10.180.0.4 activate


  neighbor 10.180.0.7 activate


  neighbor 10.180.0.12 activate



  neighbor 10.181.0.25 activate
  neighbor 10.181.0.25 route-map RM_POLICY_IN_10_19 in
  neighbor 10.181.0.25 route-map RM_POLICY_OUT_10_19 out





  network 10.200.0.0 mask 255.255.255.0

  network 10.200.1.0 mask 255.255.255.0

 exit-address-family
