
hostname 110_as65010_Katowice
!
interface Loopback0
 ip address 10.180.0.111 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.10.0/24


 ip address 10.200.10.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.9.0/24


 ip address 10.200.9.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 107_as65001_Krakow (107)

 ip address 10.181.1.57 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 109_as65010_Opole (109)

 ip address 10.181.1.59 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 121_as65010_Bielsko (121)

 ip address 10.181.1.60 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.10.0 255.255.255.0 Loopback100
ip route 10.200.9.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.111
 passive-interface Loopback0
 network 10.180.0.111 0.0.0.0 area 0



network 10.181.1.58 0.0.0.1 area 0
network 10.181.1.60 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_110 seq 10 permit 10.200.10.0/24
ip prefix-list PL_EXPORT_ALLOWED_110 seq 20 permit 10.200.9.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_110_0 seq 10 deny 10.181.1.56/31
!

ip prefix-list PL_EXPORT_DENY_LINK_110_1 seq 10 deny 10.181.1.58/31
!

ip prefix-list PL_EXPORT_DENY_LINK_110_2 seq 10 deny 10.181.1.60/31
!

ip prefix-list PL_EXPORT_DENY_LONG_110 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_110_0 seq 10 deny 10.180.0.111/32
!




ip community-list standard CL_COMM_110_107 permit 65535:65282
!





route-map RM_POLICY_IN_110_107 permit 5














 match community CL_COMM_110_107
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_110_107 permit 10














 set local-preference 150
 ! Inbound policy baseline


route-map RM_POLICY_IN_110_107 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_110_107 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_110_0
 ! Block loopback 10.180.0.111/32


route-map RM_POLICY_OUT_110_107 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_110_0
 ! Block link 10.181.1.56/31


route-map RM_POLICY_OUT_110_107 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_110_1
 ! Block link 10.181.1.58/31


route-map RM_POLICY_OUT_110_107 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_110_2
 ! Block link 10.181.1.60/31


route-map RM_POLICY_OUT_110_107 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_110
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_110_107 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_110
 set metric 9
 set as-path prepend 65010
 set community 65000:200 no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_110_107 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.111
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65010
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.95 peer-group RR




 !
 neighbor 10.181.1.56 peer-group EBGP
 neighbor 10.181.1.56 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.95 activate




  neighbor 10.181.1.56 activate
  neighbor 10.181.1.56 route-map RM_POLICY_IN_110_107 in
  neighbor 10.181.1.56 route-map RM_POLICY_OUT_110_107 out





  network 10.200.10.0 mask 255.255.255.0

  network 10.200.9.0 mask 255.255.255.0

 exit-address-family
