
hostname 16_as65007_None
!
interface Loopback0
 ip address 10.180.0.17 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.66.0/24


 ip address 10.200.66.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.67.0/24


 ip address 10.200.67.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 4_as65007_Gdansk (4)

 ip address 10.181.0.11 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 10_as65007_Braniewo (10)

 ip address 10.181.0.25 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 95_as65001_Tczew (95)

 ip address 10.181.0.44 255.255.255.254
 mtu 1500
!


ip route 10.200.66.0 255.255.255.0 Loopback100
ip route 10.200.67.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.17
 passive-interface Loopback0
 network 10.180.0.17 0.0.0.0 area 0



network 10.181.0.10 0.0.0.1 area 0
network 10.181.0.24 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_16 seq 10 permit 10.200.66.0/24
ip prefix-list PL_EXPORT_ALLOWED_16 seq 20 permit 10.200.67.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_16_0 seq 10 deny 10.181.0.10/31
!

ip prefix-list PL_EXPORT_DENY_LINK_16_1 seq 10 deny 10.181.0.24/31
!

ip prefix-list PL_EXPORT_DENY_LINK_16_2 seq 10 deny 10.181.0.44/31
!

ip prefix-list PL_EXPORT_DENY_LONG_16 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_16_0 seq 10 deny 10.180.0.17/32
!






route-map RM_POLICY_IN_16_95 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_16_95 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_16_0
 ! Block loopback 10.180.0.17/32


route-map RM_POLICY_OUT_16_95 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_0
 ! Block link 10.181.0.10/31


route-map RM_POLICY_OUT_16_95 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_1
 ! Block link 10.181.0.24/31


route-map RM_POLICY_OUT_16_95 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_16_2
 ! Block link 10.181.0.44/31


route-map RM_POLICY_OUT_16_95 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_16
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_16_95 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_16
 set metric 19
 set as-path prepend 65007
 ! Outbound policy baseline


route-map RM_POLICY_OUT_16_95 deny 65000














 ! Deny other outbound routes

!







router bgp 65007
 bgp router-id 10.180.0.17
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65007
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.15 peer-group RR




 !
 neighbor 10.181.0.45 peer-group EBGP
 neighbor 10.181.0.45 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.15 activate




  neighbor 10.181.0.45 activate
  neighbor 10.181.0.45 route-map RM_POLICY_IN_16_95 in
  neighbor 10.181.0.45 route-map RM_POLICY_OUT_16_95 out





  network 10.200.66.0 mask 255.255.255.0

  network 10.200.67.0 mask 255.255.255.0

 exit-address-family
