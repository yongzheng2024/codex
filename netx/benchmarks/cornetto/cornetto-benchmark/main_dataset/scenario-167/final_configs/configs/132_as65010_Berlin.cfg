
hostname 132_as65010_Berlin
!
interface Loopback0
 ip address 10.180.0.133 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.43.0/24


 ip address 10.200.43.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.44.0/24


 ip address 10.200.44.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.45.0/24


 ip address 10.200.45.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.46.0/24


 ip address 10.200.46.1 255.255.255.0
!



ip access-list extended ACL_132_GigabitEthernet0_1
 10 permit ip host 10.180.0.126 any
 20 permit ip host 10.181.1.96 any
 30 permit ip host 10.181.1.97 any
 40 deny ip 169.254.0.0 0.0.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 17_as65010_None (17)

 ip address 10.181.0.47 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 125_as65002_Frankfurt-am-Main (125)

 ip address 10.181.1.97 255.255.255.254

 ip access-group ACL_132_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.43.0 255.255.255.0 Loopback100
ip route 10.200.44.0 255.255.255.0 Loopback101
ip route 10.200.45.0 255.255.255.0 Loopback102
ip route 10.200.46.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.133
 passive-interface Loopback0
 network 10.180.0.133 0.0.0.0 area 0



network 10.181.0.46 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_132 seq 10 permit 10.200.43.0/24
ip prefix-list PL_EXPORT_ALLOWED_132 seq 20 permit 10.200.44.0/24
ip prefix-list PL_EXPORT_ALLOWED_132 seq 30 permit 10.200.45.0/24
ip prefix-list PL_EXPORT_ALLOWED_132 seq 40 permit 10.200.46.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_132_0 seq 10 deny 10.181.0.46/31
!

ip prefix-list PL_EXPORT_DENY_LINK_132_1 seq 10 deny 10.181.1.96/31
!

ip prefix-list PL_EXPORT_DENY_LONG_132 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_132_0 seq 10 deny 10.180.0.133/32
!

ip prefix-list PL_IN_132_125 seq 10 permit 10.200.34.0/24
ip prefix-list PL_IN_132_125 seq 20 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_132_125 seq 10 permit 10.200.46.0/24
!






route-map RM_POLICY_IN_132_125 permit 10














 match ip address prefix-list PL_IN_132_125
 set local-preference 100
 ! Inbound policy baseline


route-map RM_POLICY_IN_132_125 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_132_125 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_132_0
 ! Block loopback 10.180.0.133/32


route-map RM_POLICY_OUT_132_125 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_132_0
 ! Block link 10.181.0.46/31


route-map RM_POLICY_OUT_132_125 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_132_1
 ! Block link 10.181.1.96/31


route-map RM_POLICY_OUT_132_125 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_132
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_132_125 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_132
 set metric 17
 set as-path prepend 65010 65010 65010
 ! Outbound policy baseline


route-map RM_POLICY_OUT_132_125 deny 200














 match ip address prefix-list PL_OUT_132_125
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_132_125 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.133
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65010
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.18 peer-group RR




 !
 neighbor 10.181.1.96 peer-group EBGP
 neighbor 10.181.1.96 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.18 activate




  neighbor 10.181.1.96 activate
  neighbor 10.181.1.96 route-map RM_POLICY_IN_132_125 in
  neighbor 10.181.1.96 route-map RM_POLICY_OUT_132_125 out





  network 10.200.43.0 mask 255.255.255.0

  network 10.200.44.0 mask 255.255.255.0

  network 10.200.45.0 mask 255.255.255.0

  network 10.200.46.0 mask 255.255.255.0

 exit-address-family
