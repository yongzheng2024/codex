
hostname 33_as65011_Tatabanya
!
interface Loopback0
 ip address 10.180.0.34 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.89.0/24


 ip address 10.200.89.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.90.0/24


 ip address 10.200.90.1 255.255.255.0
!



ip access-list extended ACL_33_GigabitEthernet0_1
 10 permit ip host 10.180.0.62 any
 20 permit ip host 10.181.0.114 any
 30 permit ip host 10.181.0.115 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 129_as65011_Budapest (129)

 ip address 10.181.0.112 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 61_as65002_Gyor (61)

 ip address 10.181.0.114 255.255.255.254

 ip access-group ACL_33_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.89.0 255.255.255.0 Loopback100
ip route 10.200.90.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.34
 passive-interface Loopback0
 network 10.180.0.34 0.0.0.0 area 0



network 10.181.0.112 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_33 seq 10 permit 10.200.89.0/24
ip prefix-list PL_EXPORT_ALLOWED_33 seq 20 permit 10.200.90.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_33_0 seq 10 deny 10.181.0.112/31
!

ip prefix-list PL_EXPORT_DENY_LINK_33_1 seq 10 deny 10.181.0.114/31
!

ip prefix-list PL_EXPORT_DENY_LONG_33 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_33_0 seq 10 deny 10.180.0.34/32
!






route-map RM_POLICY_IN_33_61 permit 10














 set local-preference 50
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_33_61 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_33_0
 ! Block loopback 10.180.0.34/32


route-map RM_POLICY_OUT_33_61 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_0
 ! Block link 10.181.0.112/31


route-map RM_POLICY_OUT_33_61 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_33_1
 ! Block link 10.181.0.114/31


route-map RM_POLICY_OUT_33_61 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_33
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_33_61 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_33
 set metric 14
 set as-path prepend 65011 65011 65011
 ! Outbound policy baseline


route-map RM_POLICY_OUT_33_61 deny 65000














 ! Deny other outbound routes

!







router bgp 65011
 bgp router-id 10.180.0.34
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65011
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.130 peer-group RR




 !
 neighbor 10.181.0.115 peer-group EBGP
 neighbor 10.181.0.115 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.130 activate




  neighbor 10.181.0.115 activate
  neighbor 10.181.0.115 route-map RM_POLICY_IN_33_61 in
  neighbor 10.181.0.115 route-map RM_POLICY_OUT_33_61 out





  network 10.200.89.0 mask 255.255.255.0

  network 10.200.90.0 mask 255.255.255.0

 exit-address-family
