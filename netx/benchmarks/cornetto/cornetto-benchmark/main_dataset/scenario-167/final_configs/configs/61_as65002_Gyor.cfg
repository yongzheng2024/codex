
hostname 61_as65002_Gyor
!
interface Loopback0
 ip address 10.180.0.62 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.100.0/24


 ip address 10.200.100.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.101.0/24


 ip address 10.200.101.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.102.0/24


 ip address 10.200.102.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.99.0/24


 ip address 10.200.99.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 33_as65011_Tatabanya (33)

 ip address 10.181.0.115 255.255.255.254
 mtu 1500
!
interface GigabitEthernet0/1
 description to 130_as65002_Bratislava (130)

 ip address 10.181.0.204 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/2
 description to 62_as65002_Sopron (62)

 ip address 10.181.0.206 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.100.0 255.255.255.0 Loopback100
ip route 10.200.101.0 255.255.255.0 Loopback101
ip route 10.200.102.0 255.255.255.0 Loopback102
ip route 10.200.99.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.62
 passive-interface Loopback0
 network 10.180.0.62 0.0.0.0 area 0



network 10.181.0.204 0.0.0.1 area 0
network 10.181.0.206 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_61 seq 10 permit 10.200.100.0/24
ip prefix-list PL_EXPORT_ALLOWED_61 seq 20 permit 10.200.101.0/24
ip prefix-list PL_EXPORT_ALLOWED_61 seq 30 permit 10.200.102.0/24
ip prefix-list PL_EXPORT_ALLOWED_61 seq 40 permit 10.200.99.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_61_0 seq 10 deny 10.181.0.114/31
!

ip prefix-list PL_EXPORT_DENY_LINK_61_1 seq 10 deny 10.181.0.204/31
!

ip prefix-list PL_EXPORT_DENY_LINK_61_2 seq 10 deny 10.181.0.206/31
!

ip prefix-list PL_EXPORT_DENY_LONG_61 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_61_0 seq 10 deny 10.180.0.62/32
!




ip community-list standard CL_COMM_61_33 permit no-advertise
ip community-list standard CL_COMM_61_33 permit no-export
!





route-map RM_POLICY_IN_61_33 permit 5














 match community CL_COMM_61_33
 set local-preference 100
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_61_33 permit 10














 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_61_33 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_61_33 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_61_0
 ! Block loopback 10.180.0.62/32


route-map RM_POLICY_OUT_61_33 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_61_0
 ! Block link 10.181.0.114/31


route-map RM_POLICY_OUT_61_33 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_61_1
 ! Block link 10.181.0.204/31


route-map RM_POLICY_OUT_61_33 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_61_2
 ! Block link 10.181.0.206/31


route-map RM_POLICY_OUT_61_33 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_61
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_61_33 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_61
 set metric 8
 set as-path prepend 65002 65002
 set community 65000:100 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_61_33 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.62
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.131 peer-group RR




 !
 neighbor 10.181.0.114 peer-group EBGP
 neighbor 10.181.0.114 remote-as 65011


 !
 address-family ipv4

  neighbor 10.180.0.131 activate




  neighbor 10.181.0.114 activate
  neighbor 10.181.0.114 route-map RM_POLICY_IN_61_33 in
  neighbor 10.181.0.114 route-map RM_POLICY_OUT_61_33 out





  network 10.200.100.0 mask 255.255.255.0

  network 10.200.101.0 mask 255.255.255.0

  network 10.200.102.0 mask 255.255.255.0

  network 10.200.99.0 mask 255.255.255.0

 exit-address-family
