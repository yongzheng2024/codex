route-map RM_POLICY_IN_66_102 permit 10














 match ip address prefix-list PL_IN_66_102
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_66_102 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_66_102 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_66_0
 ! Block loopback 10.180.0.67/32


route-map RM_POLICY_OUT_66_102 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_0
 ! Block link 10.181.0.140/31


route-map RM_POLICY_OUT_66_102 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_66_1
 ! Block link 10.181.0.214/31


route-map RM_POLICY_OUT_66_102 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_66
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_66_102 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_66
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_66_102 deny 200














 match ip address prefix-list PL_OUT_66_102
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_66_102 deny 65000














 ! Deny other outbound routes

!







