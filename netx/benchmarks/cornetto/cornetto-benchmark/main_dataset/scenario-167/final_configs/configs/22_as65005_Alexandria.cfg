
hostname 22_as65005_Alexandria
!
interface Loopback0
 ip address 10.180.0.23 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.74.0/24


 ip address 10.200.74.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.75.0/24


 ip address 10.200.75.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.76.0/24


 ip address 10.200.76.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.77.0/24


 ip address 10.200.77.1 255.255.255.0
!



ip access-list extended ACL_22_GigabitEthernet0_0
 10 permit ip host 10.180.0.143 any
 20 permit ip host 10.181.0.74 any
 30 permit ip host 10.181.0.75 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 142_as65006_Bucuresti (142)

 ip address 10.181.0.74 255.255.255.254

 ip access-group ACL_22_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 23_as65005_Craiova (23)

 ip address 10.181.0.76 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!


ip route 10.200.74.0 255.255.255.0 Loopback100
ip route 10.200.75.0 255.255.255.0 Loopback101
ip route 10.200.76.0 255.255.255.0 Loopback102
ip route 10.200.77.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.23
 passive-interface Loopback0
 network 10.180.0.23 0.0.0.0 area 0



network 10.181.0.76 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_22 seq 10 permit 10.200.74.0/24
ip prefix-list PL_EXPORT_ALLOWED_22 seq 20 permit 10.200.75.0/24
ip prefix-list PL_EXPORT_ALLOWED_22 seq 30 permit 10.200.76.0/24
ip prefix-list PL_EXPORT_ALLOWED_22 seq 40 permit 10.200.77.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_22_0 seq 10 deny 10.181.0.74/31
!

ip prefix-list PL_EXPORT_DENY_LINK_22_1 seq 10 deny 10.181.0.76/31
!

ip prefix-list PL_EXPORT_DENY_LONG_22 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_22_0 seq 10 deny 10.180.0.23/32
!

ip prefix-list PL_IN_22_142 seq 10 permit 10.200.60.0/24
ip prefix-list PL_IN_22_142 seq 20 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_22_142 seq 30 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_22_142 seq 10 permit 10.200.75.0/24
!






route-map RM_POLICY_IN_22_142 permit 10














 match ip address prefix-list PL_IN_22_142
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_22_142 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_22_142 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_22_0
 ! Block loopback 10.180.0.23/32


route-map RM_POLICY_OUT_22_142 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_0
 ! Block link 10.181.0.74/31


route-map RM_POLICY_OUT_22_142 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_22_1
 ! Block link 10.181.0.76/31


route-map RM_POLICY_OUT_22_142 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_22
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_22_142 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_22
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_22_142 deny 200














 match ip address prefix-list PL_OUT_22_142
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_22_142 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.23
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.25 peer-group RR




 !
 neighbor 10.181.0.75 peer-group EBGP
 neighbor 10.181.0.75 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.25 activate




  neighbor 10.181.0.75 activate
  neighbor 10.181.0.75 route-map RM_POLICY_IN_22_142 in
  neighbor 10.181.0.75 route-map RM_POLICY_OUT_22_142 out





  network 10.200.74.0 mask 255.255.255.0

  network 10.200.75.0 mask 255.255.255.0

  network 10.200.76.0 mask 255.255.255.0

  network 10.200.77.0 mask 255.255.255.0

 exit-address-family
