
hostname 99_as65010_Konin
!
interface Loopback0
 ip address 10.180.0.100 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.133.0/24


 ip address 10.200.133.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.134.0/24


 ip address 10.200.134.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 94_as65010_Poznan (94)

 ip address 10.181.1.39 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 103_as65001_Kutno (103)

 ip address 10.181.1.46 255.255.255.254
 mtu 1500
!


ip route 10.200.133.0 255.255.255.0 Loopback100
ip route 10.200.134.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.100
 passive-interface Loopback0
 network 10.180.0.100 0.0.0.0 area 0



network 10.181.1.38 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_99 seq 10 permit 10.200.133.0/24
ip prefix-list PL_EXPORT_ALLOWED_99 seq 20 permit 10.200.134.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_99_0 seq 10 deny 10.181.1.38/31
!

ip prefix-list PL_EXPORT_DENY_LINK_99_1 seq 10 deny 10.181.1.46/31
!

ip prefix-list PL_EXPORT_DENY_LONG_99 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_99_0 seq 10 deny 10.180.0.100/32
!






route-map RM_POLICY_OUT_99_103 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_99_0
 ! Block loopback 10.180.0.100/32


route-map RM_POLICY_OUT_99_103 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_99_0
 ! Block link 10.181.1.38/31


route-map RM_POLICY_OUT_99_103 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_99_1
 ! Block link 10.181.1.46/31


route-map RM_POLICY_OUT_99_103 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_99
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_99_103 permit 100














 match ip address prefix-list PL_EXPORT_ALLOWED_99
 ! Permit curated customer prefixes


route-map RM_POLICY_OUT_99_103 deny 65000














 ! Deny other outbound routes

!







router bgp 65010
 bgp router-id 10.180.0.100
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65010
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.95 peer-group RR


 !
 neighbor 10.180.0.18 peer-group RR




 !
 neighbor 10.181.1.47 peer-group EBGP
 neighbor 10.181.1.47 remote-as 65001


 !
 address-family ipv4

  neighbor 10.180.0.95 activate


  neighbor 10.180.0.18 activate




  neighbor 10.181.1.47 activate
  neighbor 10.181.1.47 route-map RM_POLICY_OUT_99_103 out





  network 10.200.133.0 mask 255.255.255.0

  network 10.200.134.0 mask 255.255.255.0

 exit-address-family
