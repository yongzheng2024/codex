  neighbor 10.181.0.44 activate
  neighbor 10.181.0.44 route-map RM_POLICY_IN_95_16 in
  neighbor 10.181.0.44 route-map RM_POLICY_OUT_95_16 out





  network 10.200.129.0 mask 255.255.255.0

  network 10.200.130.0 mask 255.255.255.0

  network 10.200.131.0 mask 255.255.255.0

  network 10.200.132.0 mask 255.255.255.0

