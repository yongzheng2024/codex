
hostname 19_as65005_Ulmi
!
interface Loopback0
 ip address 10.180.0.20 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.68.0/24


 ip address 10.200.68.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.69.0/24


 ip address 10.200.69.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.70.0/24


 ip address 10.200.70.1 255.255.255.0
!



ip access-list extended ACL_19_GigabitEthernet0_1
 10 permit ip host 10.180.0.143 any
 20 permit ip host 10.181.0.56 any
 30 permit ip host 10.181.0.57 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 192.0.2.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 59_as65005_Dumbravita (59)

 ip address 10.181.0.54 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 142_as65006_Bucuresti (142)

 ip address 10.181.0.56 255.255.255.254

 ip access-group ACL_19_GigabitEthernet0_1 in
 mtu 1500
!


ip route 10.200.68.0 255.255.255.0 Loopback100
ip route 10.200.69.0 255.255.255.0 Loopback101
ip route 10.200.70.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.20
 passive-interface Loopback0
 network 10.180.0.20 0.0.0.0 area 0



network 10.181.0.54 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_19 seq 10 permit 10.200.68.0/24
ip prefix-list PL_EXPORT_ALLOWED_19 seq 20 permit 10.200.69.0/24
ip prefix-list PL_EXPORT_ALLOWED_19 seq 30 permit 10.200.70.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_19_0 seq 10 deny 10.181.0.54/31
!

ip prefix-list PL_EXPORT_DENY_LINK_19_1 seq 10 deny 10.181.0.56/31
!

ip prefix-list PL_EXPORT_DENY_LONG_19 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_19_0 seq 10 deny 10.180.0.20/32
!

ip prefix-list PL_IN_19_142 seq 10 permit 10.200.60.0/24
ip prefix-list PL_IN_19_142 seq 20 permit 10.200.61.0/24
ip prefix-list PL_IN_19_142 seq 30 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_19_142 seq 40 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_19_142 seq 10 permit 10.200.68.0/24
!




ip community-list standard CL_COMM_19_142 permit 65535:65282
!





route-map RM_POLICY_IN_19_142 permit 5














 match community CL_COMM_19_142
 set local-preference 50
 ! Prefer routes with selected communities


route-map RM_POLICY_IN_19_142 permit 10














 match ip address prefix-list PL_IN_19_142
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_19_142 deny 20














 ! Deny other inbound prefixes


route-map RM_POLICY_IN_19_142 permit 1000














 ! Default permit for other communities

!


route-map RM_POLICY_OUT_19_142 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_19_0
 ! Block loopback 10.180.0.20/32


route-map RM_POLICY_OUT_19_142 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_19_0
 ! Block link 10.181.0.54/31


route-map RM_POLICY_OUT_19_142 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_19_1
 ! Block link 10.181.0.56/31


route-map RM_POLICY_OUT_19_142 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_19
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_19_142 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_19
 set metric 25
 set as-path prepend 65005
 set community 65000:200 additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_19_142 deny 200














 match ip address prefix-list PL_OUT_19_142
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_19_142 deny 65000














 ! Deny other outbound routes

!







router bgp 65005
 bgp router-id 10.180.0.20
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65005
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.25 peer-group RR




 !
 neighbor 10.181.0.57 peer-group EBGP
 neighbor 10.181.0.57 remote-as 65006


 !
 address-family ipv4

  neighbor 10.180.0.25 activate




  neighbor 10.181.0.57 activate
  neighbor 10.181.0.57 route-map RM_POLICY_IN_19_142 in
  neighbor 10.181.0.57 route-map RM_POLICY_OUT_19_142 out





  network 10.200.68.0 mask 255.255.255.0

  network 10.200.69.0 mask 255.255.255.0

  network 10.200.70.0 mask 255.255.255.0

 exit-address-family
