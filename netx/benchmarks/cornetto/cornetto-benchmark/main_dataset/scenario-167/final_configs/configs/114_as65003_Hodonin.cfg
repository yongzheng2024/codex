
hostname 114_as65003_Hodonin
!
interface Loopback0
 ip address 10.180.0.115 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.11.0/24


 ip address 10.200.11.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.12.0/24


 ip address 10.200.12.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.13.0/24


 ip address 10.200.13.1 255.255.255.0
!
interface Loopback103
 description Customer network 10.200.14.0/24


 ip address 10.200.14.1 255.255.255.0
!



ip access-list extended ACL_114_GigabitEthernet0_1
 10 permit ip host 10.180.0.131 any
 20 permit ip host 10.181.1.74 any
 30 permit ip host 10.181.1.75 any
 40 deny ip 192.0.2.0 0.0.0.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 120_as65003_Brno (120)

 ip address 10.181.1.72 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/1
 description to 130_as65002_Bratislava (130)

 ip address 10.181.1.74 255.255.255.254

 ip access-group ACL_114_GigabitEthernet0_1 in
 mtu 1500
!
interface GigabitEthernet0/2
 description to 115_as65003_Zlin (115)

 ip address 10.181.1.76 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.11.0 255.255.255.0 Loopback100
ip route 10.200.12.0 255.255.255.0 Loopback101
ip route 10.200.13.0 255.255.255.0 Loopback102
ip route 10.200.14.0 255.255.255.0 Loopback103
!

router ospf 1
 router-id 10.180.0.115
 passive-interface Loopback0
 network 10.180.0.115 0.0.0.0 area 0



network 10.181.1.72 0.0.0.1 area 0
network 10.181.1.76 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_114 seq 10 permit 10.200.11.0/24
ip prefix-list PL_EXPORT_ALLOWED_114 seq 20 permit 10.200.12.0/24
ip prefix-list PL_EXPORT_ALLOWED_114 seq 30 permit 10.200.13.0/24
ip prefix-list PL_EXPORT_ALLOWED_114 seq 40 permit 10.200.14.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_114_0 seq 10 deny 10.181.1.72/31
!

ip prefix-list PL_EXPORT_DENY_LINK_114_1 seq 10 deny 10.181.1.74/31
!

ip prefix-list PL_EXPORT_DENY_LINK_114_2 seq 10 deny 10.181.1.76/31
!

ip prefix-list PL_EXPORT_DENY_LONG_114 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_114_0 seq 10 deny 10.180.0.115/32
!

ip prefix-list PL_IN_114_130 seq 10 permit 10.181.0.202/31
ip prefix-list PL_IN_114_130 seq 20 permit 10.181.0.220/31
ip prefix-list PL_IN_114_130 seq 30 permit 10.180.0.131/32
ip prefix-list PL_IN_114_130 seq 40 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_114_130 seq 50 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_114_130 seq 10 permit 10.200.14.0/24
!






route-map RM_POLICY_IN_114_130 permit 10














 match ip address prefix-list PL_IN_114_130
 set local-preference 50
 ! Inbound policy baseline


route-map RM_POLICY_IN_114_130 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_114_130 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_114_0
 ! Block loopback 10.180.0.115/32


route-map RM_POLICY_OUT_114_130 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_114_0
 ! Block link 10.181.1.72/31


route-map RM_POLICY_OUT_114_130 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_114_1
 ! Block link 10.181.1.74/31


route-map RM_POLICY_OUT_114_130 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_114_2
 ! Block link 10.181.1.76/31


route-map RM_POLICY_OUT_114_130 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_114
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_114_130 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_114
 set metric 9
 set as-path prepend 65003
 ! Outbound policy baseline


route-map RM_POLICY_OUT_114_130 deny 200














 match ip address prefix-list PL_OUT_114_130
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_114_130 deny 65000














 ! Deny other outbound routes

!







router bgp 65003
 bgp router-id 10.180.0.115
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.71 peer-group RR




 !
 neighbor 10.181.1.75 peer-group EBGP
 neighbor 10.181.1.75 remote-as 65002


 !
 address-family ipv4

  neighbor 10.180.0.71 activate




  neighbor 10.181.1.75 activate
  neighbor 10.181.1.75 route-map RM_POLICY_IN_114_130 in
  neighbor 10.181.1.75 route-map RM_POLICY_OUT_114_130 out





  network 10.200.11.0 mask 255.255.255.0

  network 10.200.12.0 mask 255.255.255.0

  network 10.200.13.0 mask 255.255.255.0

  network 10.200.14.0 mask 255.255.255.0

 exit-address-family
