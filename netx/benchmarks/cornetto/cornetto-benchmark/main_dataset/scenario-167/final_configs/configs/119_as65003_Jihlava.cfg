 !
 neighbor RR peer-group
 neighbor RR remote-as 65003
 neighbor RR update-source Loopback0




 !
 neighbor 10.180.0.71 peer-group RR




 !
 address-family ipv4

  neighbor 10.180.0.71 activate







 exit-address-family
