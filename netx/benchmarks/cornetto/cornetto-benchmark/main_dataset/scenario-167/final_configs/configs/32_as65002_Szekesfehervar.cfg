
hostname 32_as65002_Szekesfehervar
!
interface Loopback0
 ip address 10.180.0.33 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.86.0/24


 ip address 10.200.86.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.87.0/24


 ip address 10.200.87.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.88.0/24


 ip address 10.200.88.1 255.255.255.0
!



ip access-list extended ACL_32_GigabitEthernet0_0
 10 permit ip host 10.180.0.130 any
 20 permit ip host 10.181.0.108 any
 30 permit ip host 10.181.0.109 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 169.254.0.0 0.0.255.255 any
 60 deny ip 192.0.2.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 129_as65011_Budapest (129)

 ip address 10.181.0.108 255.255.255.254

 ip access-group ACL_32_GigabitEthernet0_0 in
 mtu 1500
!
interface GigabitEthernet0/1
 description to 35_as65002_Veszprem (35)

 ip address 10.181.0.110 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!


ip route 10.200.86.0 255.255.255.0 Loopback100
ip route 10.200.87.0 255.255.255.0 Loopback101
ip route 10.200.88.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.33
 passive-interface Loopback0
 network 10.180.0.33 0.0.0.0 area 0



network 10.181.0.110 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_32 seq 10 permit 10.200.86.0/24
ip prefix-list PL_EXPORT_ALLOWED_32 seq 20 permit 10.200.87.0/24
ip prefix-list PL_EXPORT_ALLOWED_32 seq 30 permit 10.200.88.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_32_0 seq 10 deny 10.181.0.108/31
!

ip prefix-list PL_EXPORT_DENY_LINK_32_1 seq 10 deny 10.181.0.110/31
!

ip prefix-list PL_EXPORT_DENY_LONG_32 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_32_0 seq 10 deny 10.180.0.33/32
!

ip prefix-list PL_IN_32_129 seq 10 permit 10.181.1.12/31
ip prefix-list PL_IN_32_129 seq 20 permit 10.200.36.0/24
ip prefix-list PL_IN_32_129 seq 30 permit 10.200.38.0/24
ip prefix-list PL_IN_32_129 seq 40 permit 10.181.0.108/31
ip prefix-list PL_IN_32_129 seq 50 permit 10.200.0.0/16 le 24
ip prefix-list PL_IN_32_129 seq 60 deny 0.0.0.0/0
!

ip prefix-list PL_OUT_32_129 seq 10 permit 10.200.88.0/24
ip prefix-list PL_OUT_32_129 seq 20 permit 10.200.87.0/24
!






route-map RM_POLICY_IN_32_129 permit 10














 match ip address prefix-list PL_IN_32_129
 ! Permit selected inbound prefixes


route-map RM_POLICY_IN_32_129 deny 20














 ! Deny other inbound prefixes

!


route-map RM_POLICY_OUT_32_129 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_32_0
 ! Block loopback 10.180.0.33/32


route-map RM_POLICY_OUT_32_129 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_0
 ! Block link 10.181.0.108/31


route-map RM_POLICY_OUT_32_129 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_32_1
 ! Block link 10.181.0.110/31


route-map RM_POLICY_OUT_32_129 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_32
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_32_129 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_32
 set community 65000:200 no-advertise additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_32_129 deny 200














 match ip address prefix-list PL_OUT_32_129
 ! Block selected outbound prefixes


route-map RM_POLICY_OUT_32_129 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.33
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.131 peer-group RR




 !
 neighbor 10.181.0.109 peer-group EBGP
 neighbor 10.181.0.109 remote-as 65011


 !
 address-family ipv4

  neighbor 10.180.0.131 activate




  neighbor 10.181.0.109 activate
  neighbor 10.181.0.109 route-map RM_POLICY_IN_32_129 in
  neighbor 10.181.0.109 route-map RM_POLICY_OUT_32_129 out





  network 10.200.86.0 mask 255.255.255.0

  network 10.200.87.0 mask 255.255.255.0

  network 10.200.88.0 mask 255.255.255.0

 exit-address-family
