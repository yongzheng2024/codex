
hostname 101_as65001_Lublin
!
interface Loopback0
 ip address 10.180.0.102 255.255.255.255

 ip ospf network point-to-point
!


interface GigabitEthernet0/0
 description to 41_as65001_Warszawa (41)

 ip address 10.181.0.147 255.255.255.254

 ip ospf network point-to-point
