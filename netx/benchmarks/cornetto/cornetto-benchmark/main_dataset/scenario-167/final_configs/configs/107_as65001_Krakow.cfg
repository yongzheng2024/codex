
hostname 107_as65001_Krakow
!
interface Loopback0
 ip address 10.180.0.108 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.7.0/24


 ip address 10.200.7.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.8.0/24


 ip address 10.200.8.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 67_as65001_Tarnow (67)

 ip address 10.181.0.217 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 108_as65001_Kielce (108)

 ip address 10.181.1.54 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 30

 mtu 1500
!
interface GigabitEthernet0/2
 description to 110_as65010_Katowice (110)

 ip address 10.181.1.56 255.255.255.254
 mtu 1500
!


ip route 10.200.7.0 255.255.255.0 Loopback100
ip route 10.200.8.0 255.255.255.0 Loopback101
!

router ospf 1
 router-id 10.180.0.108
 passive-interface Loopback0
 network 10.180.0.108 0.0.0.0 area 0



network 10.181.0.216 0.0.0.1 area 0
network 10.181.1.54 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_107 seq 10 permit 10.200.7.0/24
ip prefix-list PL_EXPORT_ALLOWED_107 seq 20 permit 10.200.8.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_107_0 seq 10 deny 10.181.0.216/31
!

ip prefix-list PL_EXPORT_DENY_LINK_107_1 seq 10 deny 10.181.1.54/31
!

ip prefix-list PL_EXPORT_DENY_LINK_107_2 seq 10 deny 10.181.1.56/31
!

ip prefix-list PL_EXPORT_DENY_LONG_107 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_107_0 seq 10 deny 10.180.0.108/32
!






route-map RM_POLICY_IN_107_110 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_107_110 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_107_0
 ! Block loopback 10.180.0.108/32


route-map RM_POLICY_OUT_107_110 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_107_0
 ! Block link 10.181.0.216/31


route-map RM_POLICY_OUT_107_110 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_107_1
 ! Block link 10.181.1.54/31


route-map RM_POLICY_OUT_107_110 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_107_2
 ! Block link 10.181.1.56/31


route-map RM_POLICY_OUT_107_110 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_107
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_107_110 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_107
 set metric 13
 set as-path prepend 65001 65001 65001
 ! Outbound policy baseline


route-map RM_POLICY_OUT_107_110 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.108
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.104 peer-group RR




 !
 neighbor 10.181.1.57 peer-group EBGP
 neighbor 10.181.1.57 remote-as 65010


 !
 address-family ipv4

  neighbor 10.180.0.104 activate




  neighbor 10.181.1.57 activate
  neighbor 10.181.1.57 route-map RM_POLICY_IN_107_110 in
  neighbor 10.181.1.57 route-map RM_POLICY_OUT_107_110 out





  network 10.200.7.0 mask 255.255.255.0

  network 10.200.8.0 mask 255.255.255.0

 exit-address-family
