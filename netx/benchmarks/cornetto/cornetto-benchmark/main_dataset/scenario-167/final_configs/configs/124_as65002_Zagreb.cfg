route-map RM_POLICY_IN_124_141 permit 10














 set local-preference 100
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_124_141 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_124_0
 ! Block loopback 10.180.0.125/32


route-map RM_POLICY_OUT_124_141 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_124_0
 ! Block link 10.181.1.90/31


route-map RM_POLICY_OUT_124_141 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_124_1
 ! Block link 10.181.1.92/31


route-map RM_POLICY_OUT_124_141 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_124_2
 ! Block link 10.181.1.94/31


route-map RM_POLICY_OUT_124_141 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_124
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_124_141 permit 100

























 match ip address prefix-list PL_EXPORT_ALLOWED_124
 set metric 12
 set as-path prepend 65002
 set community no-export additive
 ! Outbound policy baseline


route-map RM_POLICY_OUT_124_141 deny 65000














 ! Deny other outbound routes

!







router bgp 65002
 bgp router-id 10.180.0.125
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65002
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.131 peer-group RR




 !
 neighbor 10.181.1.95 peer-group EBGP
 neighbor 10.181.1.95 remote-as 65009


 !
 address-family ipv4

  neighbor 10.180.0.131 activate




  neighbor 10.181.1.95 activate
  neighbor 10.181.1.95 route-map RM_POLICY_IN_124_141 in
  neighbor 10.181.1.95 route-map RM_POLICY_OUT_124_141 out





  network 10.200.30.0 mask 255.255.255.0

  network 10.200.31.0 mask 255.255.255.0

  network 10.200.32.0 mask 255.255.255.0

  network 10.200.33.0 mask 255.255.255.0

