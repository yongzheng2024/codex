
hostname 93_as65001_Inowroclaw
!
interface Loopback0
 ip address 10.180.0.94 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.124.0/24


 ip address 10.200.124.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.125.0/24


 ip address 10.200.125.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.126.0/24


 ip address 10.200.126.1 255.255.255.0
!


interface GigabitEthernet0/0
 description to 96_as65001_Bydgoszcz (96)

 ip address 10.181.1.32 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 10

 mtu 1500
!
interface GigabitEthernet0/1
 description to 100_as65001_Torun (100)

 ip address 10.181.1.34 255.255.255.254

 ip ospf network point-to-point
 ip ospf 1 area 0

 ip ospf cost 20

 mtu 1500
!
interface GigabitEthernet0/2
 description to 94_as65010_Poznan (94)

 ip address 10.181.1.36 255.255.255.254
 mtu 1500
!


ip route 10.200.124.0 255.255.255.0 Loopback100
ip route 10.200.125.0 255.255.255.0 Loopback101
ip route 10.200.126.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.94
 passive-interface Loopback0
 network 10.180.0.94 0.0.0.0 area 0



network 10.181.1.32 0.0.0.1 area 0
network 10.181.1.34 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_93 seq 10 permit 10.200.124.0/24
ip prefix-list PL_EXPORT_ALLOWED_93 seq 20 permit 10.200.125.0/24
ip prefix-list PL_EXPORT_ALLOWED_93 seq 30 permit 10.200.126.0/24
!

ip prefix-list PL_EXPORT_DENY_LINK_93_0 seq 10 deny 10.181.1.32/31
!

ip prefix-list PL_EXPORT_DENY_LINK_93_1 seq 10 deny 10.181.1.34/31
!

ip prefix-list PL_EXPORT_DENY_LINK_93_2 seq 10 deny 10.181.1.36/31
!

ip prefix-list PL_EXPORT_DENY_LONG_93 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_93_0 seq 10 deny 10.180.0.94/32
!






route-map RM_POLICY_OUT_93_94 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_93_0
 ! Block loopback 10.180.0.94/32


route-map RM_POLICY_OUT_93_94 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_93_0
 ! Block link 10.181.1.32/31


route-map RM_POLICY_OUT_93_94 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_93_1
 ! Block link 10.181.1.34/31


route-map RM_POLICY_OUT_93_94 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LINK_93_2
 ! Block link 10.181.1.36/31


route-map RM_POLICY_OUT_93_94 deny 90














 match ip address prefix-list PL_EXPORT_DENY_LONG_93
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_93_94 permit 100




















 match ip address prefix-list PL_EXPORT_ALLOWED_93
 set community 65000:100 no-export additive
 ! Outbound community tagging


route-map RM_POLICY_OUT_93_94 deny 65000














 ! Deny other outbound routes

!







router bgp 65001
 bgp router-id 10.180.0.94
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65001
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.104 peer-group RR




 !
 neighbor 10.181.1.37 peer-group EBGP
 neighbor 10.181.1.37 remote-as 65010


 !
 address-family ipv4

  neighbor 10.180.0.104 activate




  neighbor 10.181.1.37 activate
  neighbor 10.181.1.37 route-map RM_POLICY_OUT_93_94 out





  network 10.200.124.0 mask 255.255.255.0

  network 10.200.125.0 mask 255.255.255.0

  network 10.200.126.0 mask 255.255.255.0

 exit-address-family
