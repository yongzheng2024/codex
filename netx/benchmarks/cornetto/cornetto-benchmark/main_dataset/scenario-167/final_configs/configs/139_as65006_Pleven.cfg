ip route 10.200.48.0 255.255.255.0 Loopback101
ip route 10.200.49.0 255.255.255.0 Loopback102
!

router ospf 1
 router-id 10.180.0.140
 passive-interface Loopback0
 network 10.180.0.140 0.0.0.0 area 0



network 10.181.0.98 0.0.0.1 area 0
!


ip prefix-list PL_EXPORT_ALLOWED_139 seq 10 permit 10.200.47.0/24
ip prefix-list PL_EXPORT_ALLOWED_139 seq 20 permit 10.200.48.0/24
ip prefix-list PL_EXPORT_ALLOWED_139 seq 30 permit 10.200.49.0/24
