ip prefix-list PL_EXPORT_DENY_LINK_139_0 seq 10 deny 10.181.0.98/31
!

ip prefix-list PL_EXPORT_DENY_LINK_139_1 seq 10 deny 10.181.1.120/31
!

ip prefix-list PL_EXPORT_DENY_LONG_139 seq 10 deny 0.0.0.0/0 ge 25 le 32
!

ip prefix-list PL_EXPORT_DENY_LOOPBACK_139_0 seq 10 deny 10.180.0.140/32
!






route-map RM_POLICY_IN_139_144 permit 10














 set local-preference 150
 ! Inbound policy baseline

!


route-map RM_POLICY_OUT_139_144 deny 50














 match ip address prefix-list PL_EXPORT_DENY_LOOPBACK_139_0
 ! Block loopback 10.180.0.140/32


route-map RM_POLICY_OUT_139_144 deny 60














 match ip address prefix-list PL_EXPORT_DENY_LINK_139_0
 ! Block link 10.181.0.98/31


route-map RM_POLICY_OUT_139_144 deny 70














 match ip address prefix-list PL_EXPORT_DENY_LINK_139_1
 ! Block link 10.181.1.120/31


route-map RM_POLICY_OUT_139_144 deny 80














 match ip address prefix-list PL_EXPORT_DENY_LONG_139
 ! Deny prefixes longer than /24


route-map RM_POLICY_OUT_139_144 permit 100



















 match ip address prefix-list PL_EXPORT_ALLOWED_139
 set metric 15
 set as-path prepend 65006 65006 65006
 ! Outbound policy baseline


route-map RM_POLICY_OUT_139_144 deny 65000














 ! Deny other outbound routes

!







router bgp 65006
 bgp router-id 10.180.0.140
 bgp log-neighbor-changes
 no bgp default ipv4-unicast


 !
 neighbor RR peer-group
 neighbor RR remote-as 65006
 neighbor RR update-source Loopback0



 !
 neighbor EBGP peer-group


 !
 neighbor 10.180.0.143 peer-group RR




 !
 neighbor 10.181.1.121 peer-group EBGP
 neighbor 10.181.1.121 remote-as 65009


 !
 address-family ipv4

  neighbor 10.180.0.143 activate




  neighbor 10.181.1.121 activate
  neighbor 10.181.1.121 route-map RM_POLICY_IN_139_144 in
  neighbor 10.181.1.121 route-map RM_POLICY_OUT_139_144 out





  network 10.200.47.0 mask 255.255.255.0

  network 10.200.48.0 mask 255.255.255.0

  network 10.200.49.0 mask 255.255.255.0

 exit-address-family
