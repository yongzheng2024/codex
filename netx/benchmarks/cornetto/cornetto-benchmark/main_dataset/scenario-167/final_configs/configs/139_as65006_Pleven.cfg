
hostname 139_as65006_Pleven
!
interface Loopback0
 ip address 10.180.0.140 255.255.255.255

 ip ospf network point-to-point
!
interface Loopback100
 description Customer network 10.200.47.0/24


 ip address 10.200.47.1 255.255.255.0
!
interface Loopback101
 description Customer network 10.200.48.0/24


 ip address 10.200.48.1 255.255.255.0
!
interface Loopback102
 description Customer network 10.200.49.0/24


 ip address 10.200.49.1 255.255.255.0
!



ip access-list extended ACL_139_GigabitEthernet0_1
 10 permit ip host 10.180.0.145 any
 20 permit ip host 10.181.1.120 any
 30 permit ip host 10.181.1.121 any
 40 deny ip 100.64.0.0 0.63.255.255 any
 50 deny ip 198.18.0.0 0.1.255.255 any
 60 deny ip 203.0.113.0 0.0.0.255 any
!


interface GigabitEthernet0/0
 description to 29_as65006_Giurgiu (29)

 ip address 10.181.0.99 255.255.255.254

